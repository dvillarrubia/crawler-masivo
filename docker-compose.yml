
services:
  # ---------- Infrastructure ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to localhost only — never expose Postgres to the public internet.
      # Local dev keeps host-to-container access; production routes
      # via the Docker network (Traefik to api, api to postgres).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin esto, un reinicio del servidor deja la API y el worker en bucle: el
    # 16-oct-2026 el VPS rearranco, Postgres y Redis se quedaron parados 32 h y
    # el nombre `postgres` resolvio al de otro proyecto de la misma red.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ---------- API ----------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - ARCHIVO_DIR=/data/archivo
      - SECRETOS_DIR=/secretos
    # Enlaces archivados en Parquet (decision 95): lo escribe el worker y lo
    # lee la API, asi que es el mismo volumen en los dos.
    # Secretos subidos desde la interfaz (decision 141): los escribe la API y
    # los lee el worker. Fuera de la base de datos y de los backups.
    volumes:
      - archivo:/data/archivo
      - secretos:/secretos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Crawler Workers ----------
  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    shm_size: '1gb'
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - ARCHIVO_DIR=/data/archivo
      - SECRETOS_DIR=/secretos
    # Enlaces archivados en Parquet (decision 95): lo escribe el worker y lo
    # lee la API, asi que es el mismo volumen en los dos.
    volumes:
      - archivo:/data/archivo
      - secretos:/secretos:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2g
          cpus: '2'

  # ---------- Analysis (runs inside crawler, but can also be standalone) ----------
  # Analysis is triggered by the crawler worker after each job completes.
  # Uncomment below to run as a separate service if needed:
  # analysis:
  #   build:
  #     context: .
  #     dockerfile: analysis/Dockerfile
  #   env_file: .env
  #   environment:
  #     - PYTHONPATH=/app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
  redisdata:
  archivo:
  secretos:
