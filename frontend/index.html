              <summary>
                <span class="cfg-seccion-titulo">Enlace para el cliente</span>
                <span class="cfg-seccion-resumen text-sm text-dim" x-text="resumenSeccionConfig('cfg-enlace')"></span>
              </summary>
              <div class="cfg-seccion-cuerpo">
            <!-- Enlaces de solo lectura (decision 143): el cliente ve el
                 informe de sus censos en /c/<token>, sin la sesion de la agencia. -->
            <template x-if="cliente">
              <div x-init="cargarEnlaces()" data-testid="enlaces" x-data="{ nombre: '', dias: 365 }">
                <p class="text-dim text-sm mb-1">Una dirección que puedes mandarle: ve el informe de cada censo (nota, cambios, qué arreglar primero y tráfico de Google) y nada más de la herramienta. Se puede revocar cuando quieras.</p>
                <template x-if="enlaceNuevo">
                  <div class="card mb-1 bc-green" data-testid="enlace-nuevo">
                    <div class="text-sm"><strong>Cópialo ahora:</strong> no se volverá a enseñar.</div>
                    <div class="flex gap-1 items-center mt-1 flex-wrap">
                      <code class="break-all" x-text="enlaceNuevo.url"></code>
                      <button class="btn btn-sm" @click="navigator.clipboard && navigator.clipboard.writeText(enlaceNuevo.url); showToast('Enlace copiado')">Copiar</button>
                    </div>
                  </div>
                </template>
                <ul class="enlaces-cliente" x-show="enlaces && enlaces.length">
                  <template x-for="e in enlaces || []" :key="e.id">
                    <li :class="e.revocado_en && 'text-dim'">
                      <strong x-text="e.nombre || 'sin nombre'"></strong>
                      <code x-text="e.prefijo + '…'"></code>
                      <span class="text-sm text-dim" x-text="'creado ' + fmt.dia(e.creado_en) + (e.caduca_en ? ' · caduca ' + fmt.dia(e.caduca_en) : ' · no caduca') + (e.ultimo_uso ? ' · visto ' + fmt.date(e.ultimo_uso) + ' (' + e.usos + ')' : ' · sin abrir')"></span>
                      <span class="badge badge-failed" x-show="e.revocado_en">revocado</span>
                      <button class="btn btn-sm" x-show="!e.revocado_en" @click="revocarEnlace(e)">Revocar</button>
                    </li>
                  </template>
                </ul>
                <div class="flex gap-1 items-center flex-wrap">
                  <input type="text" x-model="nombre" placeholder="Para quién (opcional)" style="width:14rem">
                  <label class="text-sm">Caduca en <input type="number" x-model="dias" min="1" max="3650" class="w-5rem"> días</label>
                  <button class="btn btn-sm btn-primary" @click="crearEnlace(nombre, dias); nombre = ''" data-testid="crear-enlace">Crear enlace</button>
                </div>
              </div>
            </template>
              </div>
            </details>
            <details class="cfg-seccion" id="cfg-integraciones" data-testid="seccion-cfg-integraciones">
              <summary>
                <span class="cfg-seccion-titulo">Otras integraciones</span>
                <span class="cfg-seccion-resumen text-sm text-dim" x-text="resumenSeccionConfig('cfg-integraciones')"></span>
              </summary>
              <div class="cfg-seccion-cuerpo">
            <!-- Integraciones: NUNCA el secreto. Se guarda el nombre de la
                 variable de entorno; la API solo dice si esta puesta. -->
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-sm text-dim">Otras APIs de este cliente.</span>
                <button class="btn btn-sm" @click="agregarIntegracion()">Añadir integración</button>
              </div>
              <p class="text-dim text-sm mb-1">
                APIs externas del cliente (Search Console, DataForSEO, Ahrefs, Semrush...). <strong>Las claves no se
                guardan en la base de datos</strong>: se escribe el <em>nombre</em> de la credencial y el secreto va en
                el <code>.env</code> del servidor (<code>DATAFORSEO_LIN3S=login:password</code>) o, para Search Console,
                se conecta en su sección.
              </p>
              <template x-for="(i, idx) in clienteForm.integraciones" :key="idx">
                <div class="card mb-1 py-60 px-75">
                  <div class="form-row">
                    <div class="form-group">
                      <label>Tipo</label>
                      <select x-model="i.tipo">
                        <option value="gsc">Search Console</option>
                        <option value="dataforseo">DataForSEO</option>
                        <option value="ahrefs">Ahrefs</option>
                        <option value="semrush">Semrush</option>
                        <option value="majestic">Majestic</option>
                        <option value="pagespeed">PageSpeed</option>
                        <option value="slack">Slack</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Etiqueta</label>
                      <input type="text" x-model="i.etiqueta" placeholder="opcional">
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>Variable de entorno con la credencial</label>
                      <input type="text" x-model="i.credencial_env" class="mono"
                             :placeholder="prefijoIntegracion(i.tipo) + 'NOMBRECLIENTE'">
                      <div class="form-hint">
                        Tiene que empezar por <code x-text="prefijoIntegracion(i.tipo)"></code>.
                        <template x-if="i.configurada === true">
                          <span class="c-green">&#10003; configurada en el servidor</span>
                        </template>
                        <template x-if="i.configurada === false">
                          <span class="c-orange">no está puesta en el servidor</span>
                        </template>
                        <template x-if="i.configurada === null">
                          <span class="text-dim">se comprueba al guardar</span>
                        </template>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>Parámetros (clave=valor, uno por línea)</label>
                      <textarea x-model="i.parametros" rows="2" class="mono fs-sm"
                                :placeholder="i.tipo === 'gsc' ? 'propiedad=sc-domain:cliente.com' : 'location_code=2724\nlanguage_code=es'"></textarea>
                    </div>
                  </div>
                  <div class="flex items-center justify-between">
                    <label class="checkbox-label"><input type="checkbox" x-model="i.activa"> Activa</label>
                    <button class="btn btn-sm" @click="quitarIntegracion(idx)">Quitar</button>
                  </div>
                </div>
              </template>

            </div>
              </div>
            </details>
            <details class="cfg-seccion" id="reglas-alertas" data-testid="seccion-reglas-alertas">
              <summary>
                <span class="cfg-seccion-titulo">Reglas de alertas</span>
                <span class="cfg-seccion-resumen text-sm text-dim" x-text="resumenSeccionConfig('reglas-alertas')"></span>
              </summary>
              <div class="cfg-seccion-cuerpo">
            <!-- Reglas de alertas y resumen semanal (decision 135). Lo que se ve
                 son las reglas EFECTIVAS: las de serie con lo que el cliente haya
                 cambiado encima. Guardar solo manda las diferencias. -->
            <template x-if="cliente">
              <div data-testid="reglas-cliente">
                <template x-if="reglasError">
                  <div class="card mb-2 btn-rojo" x-text="reglasError"></div>
                </template>
                <template x-if="!reglasForm && !reglasError"><div class="card text-dim text-sm">Cargando reglas…</div></template>
                <template x-if="reglasForm">
                  <div>
                    <div class="card mb-2 text-sm">
                      <!-- Lo de serie incluye reglas por cifras (shared/reglas.py): salia «usa
                           las reglas de serie» y debajo «Reglas del cliente» con dos, y
                           no se sabia si eran suyas (revision del 27-oct). -->
                      <span x-show="!reglasCliente.guardadas">Este cliente usa las <strong>reglas de serie</strong>: las de los cambios frente al rastreo anterior y <span x-text="fmt.n(((reglasCliente.de_serie || {}).propias || []).length, 'regla', 'reglas')"></span> por cifras que trae todo cliente. Cualquier cambio que guardes pasa a ser de este cliente y vale para los rastreos que terminen desde ese momento.</span>
                      <span x-show="reglasCliente.guardadas">Este cliente tiene <strong>reglas propias</strong> sobre las de serie.</span>
                      Las alertas salen arriba en la ficha de cada rastreo; las marcadas «avisar» se mandan además por el webhook de avisos.
                    </div>

                    <!-- Reglas propias -->
                    <div class="card mb-2">
                      <div class="card-header">
                        <h2>Reglas por cifras</h2>
                        <span class="text-sm text-dim ml-50" data-testid="reglas-origen" x-text="reglasCliente.guardadas ? 'de este cliente' : 'de serie, sin cambios'"></span>
                        <button class="btn btn-sm ml-auto" @click="reglaNueva()" data-testid="regla-nueva">
                          <i data-lucide="plus" class="ico-14"></i> Nueva regla</button>
                      </div>
                      <div class="text-dim text-sm mb-2">Una cifra del rastreo, opcionalmente en un segmento, contra un umbral. Por ejemplo: «URLs 4xx en fichas: el valor &gt; 20». Las de cambio comparan con el censo anterior y no se evalúan si no es comparable (truncado, otro alcance o detrás de un muro).</div>
                      <template x-if="!reglasForm.propias.length"><div class="text-dim text-sm">Sin reglas propias.</div></template>
                      <template x-for="(r, i) in reglasForm.propias" :key="i">
                        <div class="regla-propia">
                          <div class="regla-campos">
                            <label class="regla-ancho">Nombre
                              <input type="text" x-model="r.nombre" placeholder="Fichas rotas"></label>
                            <label class="regla-ancho">Qué se mide
                              <select x-model="r.medida">
                                <template x-for="[k, m] in Object.entries(reglasCliente.catalogo.medidas)" :key="k">
                                  <option :value="k" x-text="m.etiqueta" :selected="r.medida === k"></option>
                                </template>
                                <template x-for="t in Object.keys(ISSUE_INFO)" :key="t">
                                  <option :value="'incidencia:' + t" x-text="'Páginas con: ' + fmt.issue(t)" :selected="r.medida === 'incidencia:' + t"></option>
                                </template>
                              </select></label>
                            <label>Segmento
                              <input type="text" x-model="r.segmento" placeholder="todo el sitio" :list="'segs-' + i">
                              <datalist :id="'segs-' + i">
                                <template x-for="sg in reglasCliente.catalogo.segmentos" :key="sg"><option :value="sg"></option></template>
                              </datalist></label>
                            <label class="regla-ancho">Sobre
                              <select x-model="r.modo">
                                <template x-for="[k, t] in Object.entries(reglasCliente.catalogo.modos)" :key="k">
                                  <option :value="k" x-text="t" :selected="r.modo === k"></option>
                                </template>
                              </select></label>
                            <label class="regla-ancho">Si
                              <select x-model="r.operador">
                                <template x-for="o in reglasCliente.catalogo.operadores" :key="o"><option :value="o" x-text="OPERADOR_REGLA[o] || o" :selected="r.operador === o"></option></template>
                              </select></label>
                            <label><span x-text="r.modo === 'cambio_pct' ? 'Umbral (%)' : 'Umbral'"></span>
                              <input type="number" x-model="r.umbral" step="any"></label>
                            <label>Gravedad
                              <select x-model="r.severidad">
                                <option value="critical" :selected="r.severidad === 'critical'">crítica</option>
                                <option value="warning" :selected="r.severidad === 'warning'">aviso</option>
                                <option value="info" :selected="r.severidad === 'info'">informativa</option>
                              </select></label>
                          </div>
                          <div class="regla-pie">
                            <span class="text-dim" x-text="fraseRegla(r)"></span>
                            <label><input type="checkbox" x-model="r.activa"> activa</label>
                            <label><input type="checkbox" x-model="r.avisar"> avisar</label>
                            <!-- «Eliminar» dentro de «⋯» (revision de UX del 25-oct, 3.5) -->
                            <div class="menu-wrap" @click.outside="menuAbierto === 'regla-' + i && (menuAbierto = '')">
                              <button type="button" class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'regla-' + i ? '' : 'regla-' + i"
                                      aria-haspopup="menu" :aria-expanded="menuAbierto === 'regla-' + i" :aria-label="'Más acciones de la regla ' + (r.nombre || fraseRegla(r))" title="Más acciones">
                                <i data-lucide="more-horizontal" class="ico-16"></i>
                              </button>
                              <div class="menu" x-show="menuAbierto === 'regla-' + i" role="menu">
                                <button type="button" role="menuitem" class="danger" data-testid="regla-eliminar" @click="menuAbierto = ''; reglasForm.propias.splice(i, 1)">
                                  <i data-lucide="trash-2" class="ico-14"></i>
                                  <span>Eliminar la regla<span class="menu-sub">No se borra hasta que guardes</span></span></button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>

                    <!-- Reglas de la comparacion -->
                    <div class="card mb-2">
                      <div class="card-header"><h2>Cambios frente al rastreo anterior</h2></div>
                      <div class="text-dim text-sm mb-2">Las reglas que comparan página a página con el censo anterior. Saltan si afectan al % indicado del sitio (con un mínimo de páginas) o a ese % de una plantilla o segmento.</div>
                      <div class="ovx-auto">
                        <table class="w-full fs-sm">
                          <thead><tr><th class="ta-l">Regla</th><th>Activa</th><th>Avisar</th><th>% del sitio</th><th>Mín. páginas</th><th>% plantilla</th></tr></thead>
                          <tbody>
                            <template x-for="c in reglasCliente.catalogo.comparacion" :key="c.regla">
                              <tr>
                                <td :title="c.que_decide_google">
                                  <!-- En frase y no la clave interna (revision de UX del 25-oct, 3.9) -->
                                  <span x-text="fmt.reglaDiff(c.regla)"></span>
                                  <span class="text-dim fs-sm" x-text="c.severidad === 'critical' ? ' · crítica' : (c.severidad === 'warning' ? ' · aviso' : ' · info')"></span>
                                </td>
                                <td class="ta-c"><input type="checkbox" x-model="reglasForm.comparacion[c.regla].activa" :aria-label="'Activa: ' + fmt.reglaDiff(c.regla)"></td>
                                <td class="ta-c"><input type="checkbox" x-model="reglasForm.comparacion[c.regla].avisar" :aria-label="'Avisar: ' + fmt.reglaDiff(c.regla)"></td>
                                <td><input type="number" min="0" max="100" step="any" class="w-5rem" x-model="reglasForm.comparacion[c.regla].pct_sitio"></td>
                                <td><input type="number" min="1" class="w-5rem" x-model="reglasForm.comparacion[c.regla].min_paginas"></td>
                                <td><input type="number" min="0" max="100" step="any" class="w-5rem" x-model="reglasForm.comparacion[c.regla].pct_plantilla"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <!-- Silencio y resumen -->
                    <div class="card mb-2">
                      <div class="regla-campos items-end">
                        <div class="form-group m-0">
                          <label>Silenciar avisos hasta</label>
                          <input type="date" x-model="reglasForm.silenciado_hasta">
                          <div class="form-hint">Hasta ese día no sale nada por el webhook. En la ficha se siguen viendo.</div>
                        </div>
                        <label class="text-sm flex gap-30 items-center"><input type="checkbox" x-model="reglasForm.resumen_semanal.activo"> Resumen semanal</label>
                        <div class="form-group m-0">
                          <label>Día</label>
                          <select x-model.number="reglasForm.resumen_semanal.dia">
                            <template x-for="d in [1,2,3,4,5,6,7]" :key="d"><option :value="d" x-text="DIAS_SEMANA[d]" :selected="reglasForm.resumen_semanal.dia === d"></option></template>
                          </select>
                        </div>
                        <div class="form-group m-0">
                          <label>Hora</label>
                          <input type="number" min="0" max="23" style="width:4.5rem" x-model.number="reglasForm.resumen_semanal.hora">
                        </div>
                      </div>
                    </div>

                    <!-- Guardar y descartar, en la barra fija (revision de UX del 25-oct, 3.5) -->
                    <div class="flex items-center gap-1 mb-2 flex-wrap">
                      <button class="btn" @click="probarReglas()" data-tip="Evalúa las reglas del cliente, tal como están en pantalla, contra su último rastreo completado. No guarda nada">Probar contra el último rastreo</button>
                      <button class="btn btn-danger ml-auto" @click="restablecerReglas()" x-show="reglasCliente.guardadas">Volver a las de serie</button>
                    </div>

                    <template x-if="reglasPrueba">
                      <div class="card mb-2 text-sm" data-testid="reglas-prueba">
                        <div><strong>Prueba contra</strong> <a :href="'#/rastreos/' + reglasPrueba.job_id" x-text="reglasPrueba.nombre"></a></div>
                        <template x-if="reglasPrueba.motivo"><div class="orange" x-text="'No se evaluó: ' + reglasPrueba.motivo"></div></template>
                        <div x-show="!reglasPrueba.motivo" x-text="fmt.n(reglasPrueba.evaluadas, 'regla evaluada', 'reglas evaluadas') + ': ' + (reglasPrueba.disparadas.length === 1 ? 'saltaría 1' : (reglasPrueba.disparadas.length ? 'saltarían ' + fmt.num(reglasPrueba.disparadas.length) : 'no saltaría ninguna'))"></div>
                        <template x-for="a in reglasPrueba.disparadas" :key="a.id">
                          <div :class="a.severidad === 'critical' ? 'red' : 'orange'" x-text="'• ' + a.texto"></div>
                        </template>
                        <template x-for="x in reglasPrueba.sin_evaluar" :key="x.id">
                          <div class="text-dim" x-text="'• ' + nombreRegla(x.id) + ': sin evaluar (' + x.motivo + ')'"></div>
                        </template>
                      </div>
                    </template>

                    <!-- Resumenes semanales -->
                    <div class="card mb-2">
                      <div class="card-header">
                        <h2>Resumen semanal</h2>
                        <button class="btn btn-sm" @click="verResumenPrevio()">Ver cómo sería ahora</button>
                      </div>
                      <div class="text-dim text-sm mb-2" x-text="reglasForm.resumen_semanal.activo
                           ? 'Se genera cada ' + DIAS_SEMANA[reglasForm.resumen_semanal.dia] + ' a las ' + reglasForm.resumen_semanal.hora + ':00 (' + (cliente.zona_horaria || 'Europe/Madrid') + ') con los últimos 7 días, y se manda por el webhook de avisos si hay uno configurado.'
                           : 'Desactivado para este cliente.'"></div>
                      <template x-if="resumenPrevia">
                        <div class="mb-2">
                          <div class="text-sm"><strong>Vista previa</strong> (sin guardar)</div>
                          <pre class="pre-wrap fs-sm my-30 mx-0" x-text="resumenPrevia.texto"></pre>
                        </div>
                      </template>
                      <template x-if="!resumenes.length && !resumenPrevia"><div class="text-dim text-sm">Todavía no se ha generado ninguno.</div></template>
                      <template x-for="r in resumenes" :key="r.id">
                        <details class="borde-t py-40 px-0">
                          <summary class="text-sm pointer">
                            <span x-text="'Semana hasta el ' + fmt.dia(r.semana + 'T12:00:00')"></span>
                            <span class="text-dim" x-text="r.enviado ? ' · enviado' : ' · no enviado'"></span>
                          </summary>
                          <pre class="pre-wrap fs-sm my-30 mx-0" x-text="r.texto"></pre>
                        </details>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
              </div>
            </details>
            <template x-if="clienteError">
              <div class="card mb-2 btn-rojo" x-text="clienteError"></div>
            </template>
            <div class="cfg-borrar">
              <button class="btn btn-danger btn-sm" @click="borrarCliente()"
                      data-tip="Borra el cliente y sus perfiles. Sus rastreos NO se borran">Borrar cliente</button>
            </div>
          </div>
          </template>
        </template>
      </div>
    </template>

    <!-- ============================================================ -->
    <!--         VISTA: AJUSTES DE LA AGENCIA (revision de UX 2.5)       -->
    <!-- ============================================================ -->
    <!-- Lo que vale para todos los clientes. NUNCA un secreto: de una llave
         se ve su email; de un token, el bot y el espacio; de las claves del
         entorno, solo si estan puestas. Lo que es de cada cliente (su canal,
         su propiedad de Search Console) sigue en su Configuración. -->
    <template x-if="view === 'ajustes' && ajustes">
      <div class="ajustes" data-testid="vista-ajustes">
        <h2 class="ajustes-titulo">Ajustes de la agencia</h2>
        <p class="text-sm text-dim ajustes-intro">Lo que vale para todos los clientes. El canal de Slack y la propiedad de Search Console
          de cada cliente se eligen en su ficha, en Configuración.</p>

        <!-- Slack -->
        <section class="card mb-2 ajustes-bloque" data-testid="ajustes-slack">
          <div class="card-header"><h2>Bot de Slack</h2></div>
          <p class="text-sm text-dim">Un bot para toda la agencia: con él llegan a cada canal de cliente sus alertas, el resumen semanal
            y el informe de cada rastreo programado.</p>
          <template x-if="ajustes.slack.error">
            <div class="cfg-aviso cfg-aviso--peligro text-sm" x-text="ajustes.slack.error"></div>
          </template>
          <template x-if="ajustes.slack.tokens === null"><p class="text-sm text-dim">Cargando…</p></template>
          <template x-if="ajustes.slack.tokens && !ajustes.slack.tokens.length">
            <p class="text-sm text-orange" data-testid="ajustes-sin-bot">Aún no hay ningún bot conectado: sin él no sale nada a Slack.</p>
          </template>
          <ul class="ajustes-lista" x-show="(ajustes.slack.tokens || []).length">
            <template x-for="t in (ajustes.slack.tokens || [])" :key="t.nombre">
              <li>
                <span class="badge" :class="t.valida ? 'badge-completed' : 'badge-failed'" x-text="t.valida ? 'Funciona' : 'No funciona'"></span>
                <strong x-text="t.valida ? t.bot + ' en ' + t.equipo : t.nombre"></strong>
                <span class="text-sm text-dim" x-text="(t.valida ? t.nombre + ' · ' : (t.motivo ? t.motivo + ' · ' : '')) + ((t.en_uso_por || []).length ? 'lo usan ' + t.en_uso_por.join(', ') : 'no lo usa ningún cliente') + (t.origen === 'entorno' ? ' · está en el .env del servidor' : '')"></span>
                <button class="btn btn-sm" x-show="t.origen !== 'entorno'" @click="quitarCredencial('slack', t)">Quitar</button>
              </li>
            </template>
          </ul>
          <details class="ajustes-alta" :open="ajustes.slack.tokens && !ajustes.slack.tokens.length">
            <summary class="text-sm" x-text="(ajustes.slack.tokens || []).length ? 'Conectar otro bot' : 'Conectar el bot (una sola vez)'"></summary>
            <ol class="text-sm ajustes-pasos">
              <li>Abre <a href="https://api.slack.com/apps?new_app=1" target="_blank" rel="noopener">api.slack.com/apps</a> con tu cuenta de Slack y pulsa <em>Create New App</em> → <em>From a manifest</em>.</li>
              <li>Elige el espacio de trabajo de la agencia, cambia a la pestaña <em>YAML</em>, borra lo que haya y pega este manifiesto:
                <pre class="ajustes-manifiesto" x-text="manifiestoSlack()"></pre>
                <button class="btn btn-sm" type="button" @click="copiarManifiestoSlack()" data-testid="slack-copiar-manifiesto">Copiar manifiesto</button>
                <span class="text-dim">Da al bot permiso para escribir y para ver la lista de canales. Nada más: no lee mensajes.</span>
              </li>
              <li>Pulsa <em>Next</em> → <em>Create</em> y luego <em>Install to Workspace</em> → <em>Allow</em>. Si tu espacio exige aprobación, un administrador de Slack tendrá que aprobarla.</li>
              <li>En <em>OAuth &amp; Permissions</em>, copia el <em>Bot User OAuth Token</em> (empieza por <code>xoxb-</code>) y pégalo aquí:</li>
            </ol>
            <div class="ajustes-fila">
              <label class="text-sm">Nombre <input type="text" x-model="ajustes.slack.nombreNuevo" class="mono w-11rem"></label>
              <input type="password" x-model="ajustes.slack.tokenTexto" placeholder="xoxb-…" autocomplete="off" class="mono" aria-label="Token del bot" data-testid="slack-token">
              <button class="btn btn-sm btn-primary" @click="subirTokenSlackAgencia()" :disabled="!ajustes.slack.tokenTexto || ajustes.slack.ocupado">Guardar el token</button>
            </div>
            <p class="form-hint">Se comprueba con Slack al guardarlo y se guarda en el servidor, fuera de la base de datos. No se vuelve a enseñar.
              Para cortarlo de golpe en todos los clientes: en Slack, tu app → <em>Install App</em> → <em>Revoke</em>.</p>
          </details>
        </section>

        <!-- Search Console -->
        <section class="card mb-2 ajustes-bloque" data-testid="ajustes-gsc">
          <div class="card-header"><h2>Llaves de Search Console</h2></div>
          <p class="text-sm text-dim">Cuentas de servicio de Google con las que se descargan cada noche los clics, las impresiones y la posición
            de cada URL. Una llave sirve a varios clientes: en cada uno se elige cuál y qué propiedad.</p>
          <template x-if="ajustes.gsc.error">
            <div class="cfg-aviso cfg-aviso--peligro text-sm" x-text="ajustes.gsc.error"></div>
          </template>
          <template x-if="ajustes.gsc.llaves === null"><p class="text-sm text-dim">Cargando…</p></template>
          <template x-if="ajustes.gsc.llaves && !ajustes.gsc.llaves.length">
            <p class="text-sm text-dim">Aún no hay ninguna llave.</p>
          </template>
          <ul class="ajustes-lista" x-show="(ajustes.gsc.llaves || []).length">
            <template x-for="l in (ajustes.gsc.llaves || [])" :key="l.nombre">
              <li>
                <span class="badge" :class="l.valida ? 'badge-completed' : 'badge-failed'" x-text="l.valida ? 'Válida' : 'No válida'"></span>
                <strong class="mono" x-text="l.nombre"></strong>
                <span class="text-sm text-dim ajustes-email" x-text="(l.client_email || l.motivo || '') + ' · ' + ((l.en_uso_por || []).length ? 'la usan ' + l.en_uso_por.join(', ') : 'no la usa ningún cliente') + (l.origen === 'entorno' ? ' · está en el .env del servidor' : '')"></span>
                <button class="btn btn-sm" x-show="l.origen !== 'entorno'" @click="quitarCredencial('gsc', l)">Quitar</button>
              </li>
            </template>
          </ul>
          <div class="ajustes-fila">
            <label class="text-sm">Subir una llave como <input type="text" x-model="ajustes.gsc.nombreNueva" class="mono w-11rem"></label>
            <label class="btn btn-sm" :class="ajustes.gsc.ocupado && 'disabled'">Elegir el JSON…
              <input type="file" accept=".json,application/json" style="display:none" @change="subirLlaveGscAgencia($event)" data-testid="gsc-fichero">
            </label>
          </div>
          <p class="form-hint">El JSON de la cuenta de servicio, tal cual se descarga de Google Cloud. Se guarda en el servidor, fuera de la base
            de datos, y no se vuelve a enseñar: solo su email, que es el que hay que dar de alta como usuario en Search Console.</p>
        </section>

        <!-- Modelos -->
        <section class="card mb-2 ajustes-bloque" data-testid="ajustes-modelos">
          <div class="card-header"><h2>Claves de los modelos (IA)</h2></div>
          <p class="text-sm text-dim">Las usa la pestaña IA de cada censo, que pregunta a un modelo por las páginas dudosas (soft 404,
            intención, categoría). Nada llama al modelo solo: hay que lanzarlo, y cuesta dinero. Se ponen en el <code>.env</code> del
            servidor; aquí solo se ve si están.</p>
          <template x-if="ajustes.modelosError">
            <p class="text-sm text-orange" x-text="'No se ha podido saber: ' + ajustes.modelosError"></p>
          </template>
          <template x-if="ajustes.modelos">
            <ul class="ajustes-lista ajustes-claves">
              <li><span class="badge" :class="ajustes.modelos.clave_modelo ? 'badge-completed' : 'badge-pending'" x-text="ajustes.modelos.clave_modelo ? 'Puesta' : 'Sin poner'"></span>
                <strong>Clave del modelo</strong> <span class="text-sm text-dim">con la que se llama al modelo (OpenRouter)</span></li>
              <li><span class="badge" :class="ajustes.modelos.clave_autorizacion ? 'badge-completed' : 'badge-pending'" x-text="ajustes.modelos.clave_autorizacion ? 'Puesta' : 'Sin poner'"></span>
                <strong>Clave de autorización</strong> <span class="text-sm text-dim">la que se pide al lanzar un análisis de pago</span></li>
              <li><span class="badge" :class="ajustes.modelos.activada ? 'badge-completed' : 'badge-pending'" x-text="ajustes.modelos.activada ? 'Activada' : 'Apagada'"></span>
                <strong>Capa de decisiones</strong> <span class="text-sm text-dim">sin activarla no se llama al modelo aunque haya clave</span></li>
              <li><span class="badge" :class="ajustes.modelos.tope_mensual_usd != null ? 'badge-completed' : 'badge-pending'"
                        x-text="ajustes.modelos.tope_mensual_usd != null ? fmt.num(ajustes.modelos.tope_mensual_usd) + ' $ al mes' : 'Sin tope'"></span>
                <strong>Tope de gasto de la agencia</strong> <span class="text-sm text-dim">al llegar, se deja de preguntar hasta el mes siguiente</span></li>
            </ul>
          </template>
          <p class="text-sm text-dim" x-show="ajustes.gemini && ajustes.gemini.length"
             x-text="'Análisis semántico: ' + (ajustes.gemini || []).length + ((ajustes.gemini || []).length === 1 ? ' clave de Gemini guardada' : ' claves de Gemini guardadas') + ' (' + (ajustes.gemini || []).map(g => g.name).join(', ') + '). Se eligen en la pestaña Semántico de cada censo.'"></p>
        </section>

        <!-- Backup y tema -->
        <section class="card mb-2 ajustes-bloque ajustes-dos" data-testid="ajustes-otros">
          <div>
            <h3>Importar un backup</h3>
            <p class="text-sm text-dim">Restaura un rastreo completo desde el ZIP de «Backup completo» de otra instalación.</p>
            <button class="btn btn-sm inline-flex items-center gap-35" @click="showImportModal = true">
              <i data-lucide="upload" class="ico-14"></i> Importar backup…</button>
          </div>
          <div>
            <h3>Tema</h3>
            <p class="text-sm text-dim" x-text="theme === 'terminal' ? 'Ahora: terminal (oscuro). Se guarda en este navegador.' : 'Ahora: claro. Se guarda en este navegador.'"></p>
            <button class="btn btn-sm inline-flex items-center gap-35" @click="toggleTheme()">
              <i data-lucide="contrast" class="ico-14"></i>
              <span x-text="theme === 'terminal' ? 'Pasar al tema claro' : 'Pasar al tema terminal'"></span></button>
          </div>
        </section>
      </div>
    </template>

    <!-- ===== MODAL: PERFIL DE RASTREO ===== -->
    <template x-if="perfilForm && cliente">
      <!-- Cerrar con cambios pregunta antes (revision de UX del 25-oct, 3.5) -->
      <div class="modal-backdrop" @click.self="cerrarPerfil()" @keydown.escape.window="cerrarPerfil()">
        <div class="modal modal--wide">
          <div class="modal-header">
            <h3 x-text="perfilForm.id ? 'Editar perfil' : 'Nuevo perfil'"></h3>
            <button class="btn-icon fs-md" @click="cerrarPerfil()" aria-label="Cerrar">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-row">
              <div class="form-group">
                <label>Nombre *</label>
                <input type="text" x-model="perfilForm.nombre" placeholder="Sitio principal, Blog, Competidor X...">
              </div>
              <div class="form-group">
                <label>Rol</label>
                <select x-model="perfilForm.rol">
                  <option value="propio">Propio</option>
                  <option value="competidor">Competidor</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>URLs semilla * (una por línea)<span class="ayuda" tabindex="0" role="img" aria-label="Qué son las semillas"
                data-tip="Las páginas por las que empieza el rastreo: desde ellas sigue los enlaces internos. Normalmente basta la portada; añade otras si hay partes del sitio a las que no se llega enlazando.">?</span></label>
              <textarea x-model="perfilForm.seeds" rows="3" placeholder="https://www.cliente.com/"></textarea>
            </div>
            <!-- El mismo formulario que el cliente y el rastreo (decision 196):
                 lo que no se toca sale del cliente o es de serie. -->
            <div class="form-group">
              <label>Cómo se rastrea</label>
              <div class="form-hint mt-0 mb-40 mx-0">Encima de la configuración del cliente: lo que cambies aquí vale para
                todos los rastreos de este perfil, también los programados.</div>
              <template x-if="cfgPerfil">
                <div class="cfg-host" x-data="{ get i() { return cfgPerfil } }" x-html="plantillaCfg()"></div>
              </template>
              <template x-if="!cfgPerfil"><p class="text-sm text-dim">Cargando la configuración…</p></template>
            </div>
            <div class="form-group">
              <label>Notas</label>
              <textarea x-model="perfilForm.notas" rows="2"></textarea>
            </div>
            <label class="checkbox-label"><input type="checkbox" x-model="perfilForm.activo"> Activo</label>
            <div x-show="perfilError" class="card filete-red mt-80">
              <div class="text-sm" x-text="perfilError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <span class="text-sm text-orange modal-sin-guardar" x-show="perfilCambiado()" data-testid="perfil-sin-guardar">Cambios sin guardar</span>
            <button class="btn" @click="cerrarPerfil()">Cancelar</button>
            <button class="btn btn-primary" @click="guardarPerfil()" :disabled="cfgHayErrores(cfgPerfil)">Guardar</button>
          </div>
        </div>
      </div>
    </template>

    <template x-if="view === 'jobs'">
      <div>
        <!-- Filtros (UX-07): buscar, cliente, tipo y estado. Todo va a la
             URL, asi que «los canarios de Lopesan» es un enlace. -->
        <div class="filtros-rastreos mb-2">
          <div class="exp-search-wrap" style="max-width:320px">
            <i data-lucide="search"></i>
            <input type="search" class="exp-search" placeholder="Buscar por nombre o dominio…"
                   x-model="jobsBuscar" @input.debounce.400ms="jobsPage = 1; loadJobs()" aria-label="Buscar rastreos">
          </div>
          <select x-model="jobsCliente" @change="jobsPage = 1; loadJobs()" aria-label="Cliente">
            <option value="">Todos los clientes</option>
            <option value="ninguno">Sin cliente</option>
            <template x-for="c in clientes" :key="c.id">
              <option :value="c.id" :selected="c.id === jobsCliente" x-text="c.nombre"></option>
            </template>
          </select>
          <div class="grupo-chips" role="group" aria-label="Tipo">
            <template x-for="t in [['', 'Todos'], ['censo', 'Censos'], ['canario', 'Canarios'], ['prueba', 'Pruebas']]" :key="t[0]">
              <button class="btn btn-sm chip" :class="jobsTipo === t[0] && 'chip-on'" @click="jobsTipo = t[0]; jobsPage = 1; loadJobs()" x-text="t[1]"></button>
            </template>
          </div>
          <select x-model="jobsFilter" @change="jobsPage = 1; loadJobs()" aria-label="Estado">
            <option value="">Cualquier estado</option>
            <template x-for="st in ['pending','running','analyzing','completed','failed','cancelled']" :key="st">
              <option :value="st" :selected="st === jobsFilter" x-text="fmt.status(st)"></option>
            </template>
          </select>
          <span class="text-dim text-sm ml-auto" x-text="fmt.num(jobsTotal) + (jobsTotal === 1 ? ' rastreo' : ' rastreos')"></span>
          <!-- Lo que ocupa la base, donde se decide que borrar: sin esto, la
               unica forma de enterarse de que el disco se llena es que se
               llene (decision 96). -->
          <template x-if="almacenamiento && almacenamiento.total_bytes">
            <button class="btn btn-sm" @click="verAlmacenamiento = true"
                    :title="'Base de datos: ' + fmt.bytes(almacenamiento.total_bytes) + ' — ver el desglose'">
              <i data-lucide="hard-drive" class="ico-14"></i>
              <span x-text="fmt.bytes(almacenamiento.total_bytes)"></span>
            </button>
          </template>
        </div>

        <!-- Seleccion para borrar en masa. Aparece solo cuando hay algo
             seleccionado: en la lista normal no estorba. -->
        <template x-if="seleccionados.length > 0">
          <div class="barra-seleccion mb-2">
            <strong x-text="fmt.num(seleccionados.length) + (seleccionados.length === 1 ? ' rastreo seleccionado' : ' rastreos seleccionados')"></strong>
            <span class="text-dim text-sm">La selección se mantiene al cambiar de página o de filtro</span>
            <button class="btn btn-sm" @click="limpiarSeleccion()">Limpiar</button>
            <button class="btn btn-sm btn-danger" @click="abrirBorrado()">
              <i data-lucide="trash-2" class="ico-14"></i> Eliminar seleccionados
            </button>
          </div>
        </template>

        <!-- Cargando -->
        <template x-if="loading && jobs.length === 0">
          <div class="loading-overlay"><div class="spinner"></div> Cargando trabajos...</div>
        </template>

        <!-- Vacio -->
        <template x-if="!loading && jobs.length === 0">
          <div class="empty" style="padding:3rem 1.5rem">
            <div class="empty-icon" style="margin-bottom:1rem;opacity:.6">
              <i data-lucide="search" style="width:48px;height:48px;color:var(--accent)"></i>
            </div>
            <h3 class="mb-50 fs-md">No hay trabajos de rastreo</h3>
            <p class="text-dim" style="margin-bottom:1.25rem;max-width:340px;line-height:1.5">Crea tu primer rastreo para empezar a auditar un sitio web y detectar problemas SEO automáticamente.</p>
            <button class="btn btn-primary mt-2" @click="openCreate()" style="display:flex;align-items:center;gap:.4rem;padding:.6rem 1.2rem">
              <i data-lucide="plus-circle" class="ico-16"></i> Nuevo rastreo
            </button>
          </div>
        </template>

        <!-- Tabla de trabajos -->
        <template x-if="jobs.length > 0">
          <div>
            <!-- En movil, cada rastreo una tarjeta: estado, si ha terminado y
                 cuantas URLs lleva (revision de UX del 25-oct, 3.2). -->
            <div class="table-wrap con-tarjetas">
              <table class="tabla-tarjetas tabla-rastreos" data-testid="tabla-rastreos">
                <thead>
                  <tr>
                    <th style="width:2.2rem">
                      <input type="checkbox" :checked="paginaSeleccionada" @change="alternarPagina()"
                             aria-label="Seleccionar los rastreos de esta página"
                             title="Seleccionar los rastreos de esta página">
                    </th>
                    <th data-tip="Nombre identificativo del trabajo de rastreo">Nombre</th>
                    <th data-tip="Cliente al que pertenece el rastreo">Cliente</th>
                    <th data-tip="Estado actual: pendiente, en curso, completado, fallido o cancelado">Estado</th>
                    <th data-tip="Número de URLs semilla desde las que empieza el rastreo">Semillas</th>
                    <th data-tip="URLs rastreadas con éxito hasta ahora">Rastreadas</th>
                    <!-- Solo si alguna fila tiene fallidas (V38): una columna de ceros no dice nada. -->
                    <th x-show="hayFallidas" data-tip="URLs que dieron error (timeout, DNS, conexión rechazada, etc.)">Fallidas</th>
                    <th data-tip="Cuando se creo el trabajo">Creado</th>
                    <th data-tip="Tiempo total desde el inicio hasta la finalización del rastreo">Duración</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="j in jobs" :key="j.id">
                    <tr @click="openJob(j.id)" class="pointer"
                        :class="jobsSel[j.id] && 'fila-marcada'">
                      <td @click.stop class="td-sel">
                        <input type="checkbox" :checked="!!jobsSel[j.id]" @change="alternarSeleccion(j.id)"
                               :aria-label="'Seleccionar ' + j.name">
                      </td>
                      <td>
                        <div class="fw-500">
                          <a :href="'#/rastreos/' + j.id" @click.stop class="enlace-fila" x-text="j.name"></a>
                          <span class="tipo-chip" x-show="j.tipo_efectivo && j.tipo_efectivo !== 'censo'" x-text="j.tipo_efectivo" :title="({canario: 'Canario: unas pocas páginas para comprobar bloqueos, render y ritmo antes del censo. No cuenta en la evolución', prueba: 'Prueba: un rastreo para probar algo. No cuenta en la evolución ni en la portada', lista: 'Lista: solo las URLs de una lista, sin seguir enlaces'})[j.tipo_efectivo] || ''"></span>
                        </div>
                        <div class="text-dim text-sm truncate maxw-250px" x-text="j.seeds?.[0] || ''"></div>
                      </td>
                      <td data-label="Cliente">
                        <template x-if="j.cliente_id">
                          <a href="#" @click.prevent.stop="abrirCliente(j.cliente_id)" x-text="j.cliente_nombre || j.client_id"></a>
                        </template>
                        <!-- Sin FK pero con texto: un job anterior a la migracion.
                             Se ensena el texto, atenuado, para no esconder la pista. -->
                        <template x-if="!j.cliente_id">
                          <span class="text-dim" x-text="j.client_id || '—'"></span>
                        </template>
                      </td>
                      <td data-label="Estado"><span class="badge" :class="statusColor(j.status)" x-text="fmt.status(j.status)"></span></td>
                      <td class="solo-escritorio" x-text="fmt.num(j.seeds?.length || 0)"></td>
                      <!-- En curso, con el tope si lo tiene (V38). La hora estimada
                           se mide en Produccion, que sigue el ritmo entre refrescos:
                           aqui no hay base para darla y no se inventa. -->
                      <td data-label="Rastreadas" x-text="fmt.num(j.total_urls_crawled) + (['running', 'pending'].includes(j.status) && j.config && j.config.max_urls ? ' de ' + fmt.num(j.config.max_urls) + ' como mucho' : '')"></td>
                      <td data-label="Fallidas" x-show="hayFallidas" x-text="fmt.num(j.total_urls_failed)"></td>
                      <td data-label="Creado" x-text="fmt.ago(j.created_at)" :title="fmt.date(j.created_at)"></td>
                      <td data-label="Duración">
                        <template x-if="j.started_at && j.completed_at">
                          <span x-text="fmt.lapso(new Date(j.completed_at) - new Date(j.started_at))"></span>
                        </template>
                        <template x-if="j.started_at && !j.completed_at && ['running','analyzing','pending'].includes(j.status)">
                          <a href="#/produccion" @click.stop class="text-sm" data-tip="Producción dice cuánto le queda y a qué hora acabará, cuando tiene ritmo medido">en curso · ver en Producción</a>
                        </template>
                        <!-- Terminado y sin marca de fin: rastreos viejos y los
                             que murieron sin cerrar. Decir "en curso" de un job
                             completado es mentir sobre lo unico que mira ahi
                             quien pasa la vista por la lista. -->
                        <template x-if="j.started_at && !j.completed_at && !['running','analyzing','pending'].includes(j.status)">
                          <span class="text-dim" title="Terminado sin marca de fin">&mdash;</span>
                        </template>
                        <template x-if="!j.started_at">
                          <span class="text-dim">&mdash;</span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Paginacion -->
            <div class="pagination">
              <span>Página <strong x-text="jobsPage"></strong> de <strong x-text="jobsPages"></strong></span>
              <div class="pagination-buttons">
                <button class="btn btn-sm" :disabled="jobsPage <= 1" @click="setJobsPage(jobsPage - 1)">&laquo; Anterior</button>
                <button class="btn btn-sm" :disabled="jobsPage >= jobsPages" @click="setJobsPage(jobsPage + 1)">Siguiente &raquo;</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>


    <!-- ============================================================ -->
    <!--                  VISTA: DETALLE DEL TRABAJO                  -->
    <!-- ============================================================ -->
    <!-- Cabecera y pestanas del censo, comunes a la ficha, al Explorador
         (pestana URLs) y a la ficha de una URL (revision de UX del 25-oct,
         2.6): antes el Explorador salia de la ficha y para volver habia un
         boton con el nombre del rastreo. En URLs la cabecera va compacta para
         que la tabla quepa debajo. -->
    <template x-if="['detail', 'explorer', 'url-detail'].includes(view) && job">
      <div>
        <div class="ficha-cabecera" :class="view !== 'detail' && 'ficha-compacta'">
          <!-- Cabecera -->
          <div class="flex items-center justify-between flex-wrap gap-50">
            <div class="ficha-titulo-bloque">
              <h2 class="ficha-titulo" x-text="job.name"></h2>
              <div class="ficha-subtitulo text-dim text-sm flex items-center gap-1 mt-1">
                <span class="badge" :class="statusColor(job.status)" x-text="fmt.status(job.status)"></span>
                <span>&middot;</span>
                <span x-text="'Creado ' + fmt.ago(job.created_at)"></span>
                <template x-if="job.cliente_id">
                  <span>&middot; <a href="#" @click.prevent="abrirCliente(job.cliente_id)"
                     x-text="job.cliente_nombre || job.client_id"></a></span>
                </template>
              </div>
            </div>
            <!-- flex-wrap: con el boton del informe, en movil la fila se salia
                 de la pantalla (revision de la fase 1.3). -->
            <div class="ficha-acciones flex gap-1 flex-wrap justify-end">
              <template x-if="['pending','running'].includes(job.status)">
                <button class="btn btn-sm btn-danger flex items-center gap-30" @click="cancelJob()">
                  <i data-lucide="x-circle" class="ico-13"></i> Cancelar
                </button>
              </template>
              <template x-if="['failed','cancelled'].includes(job.status)">
                <button class="btn btn-sm btn-primary flex items-center gap-30" @click="openResumeDialog()">
                  <i data-lucide="play-circle" class="ico-13"></i> Reanudar
                </button>
              </template>
              <!-- El informe para el cliente (decision 138) es una de las tareas
                   principales: boton propio y no una opcion de Exportar, donde
                   se tomaba por una descarga (revision de UX del 25-oct, 1.3). -->
              <button class="btn btn-sm btn-primary flex items-center gap-30" data-testid="abrir-informe"
                      @click="location.hash = '#/rastreos/' + job.id + '/informe-cliente'"
                      :disabled="job.status !== 'completed'"
                      :data-tip="job.status === 'completed' ? 'Nota, qué arreglar primero y qué ha cambiado; se guarda como PDF' : 'Solo con el rastreo completado y analizado'">
                <i data-lucide="file-check-2" class="ico-13"></i> Informe para el cliente
              </button>
              <!-- Se programa DESDE un rastreo que ya salio bien: sus semillas y
                   su configuracion son las buenas, y repetirlas es un clic. -->
              <button class="btn btn-sm flex items-center gap-30" @click="abrirProgramar()"
                      data-tip="Repetir este mismo rastreo cada cierto tiempo">
                <i data-lucide="calendar-clock" class="ico-13"></i> Programar
              </button>
              <!-- El analisis con IA (#40) ya no tiene boton aqui: se lanza desde
                   su pestana, junto a lo que ya se pregunto y con el coste
                   antes de pagar (revision de UX del 25-oct, 2.9). -->
              <!-- Las cuatro descargas en un menu (UX-09): sueltas ocupaban
                   media cabecera y competian con lo que se usa a diario. -->
              <div class="menu-wrap" @click.outside="menuAbierto === 'exportar' && (menuAbierto = '')">
                <button class="btn btn-sm flex items-center gap-30" @click="menuAbierto = menuAbierto === 'exportar' ? '' : 'exportar'"
                        aria-haspopup="menu" :aria-expanded="menuAbierto === 'exportar'">
                  <i data-lucide="download" class="ico-13"></i> Exportar
                  <i data-lucide="chevron-down" class="ico-12"></i>
                </button>
                <div class="menu" x-show="menuAbierto === 'exportar'" x-transition.opacity role="menu" style="min-width:19rem">
                  <!-- Decision 145: el censo en Excel, con varias hojas. -->
                  <button role="menuitem" @click="menuAbierto = ''; window.location.href = API + '/jobs/' + job.id + '/export.xlsx'"
                          :disabled="!['completed','failed','cancelled'].includes(job.status)" data-testid="exportar-excel">
                    <i data-lucide="sheet" class="ico-14"></i>
                    <span>Excel (varias hojas)<span class="menu-sub">Resumen, qué arreglar con su ficha, URLs, incidencias y Search Console</span></span></button>
                  <button role="menuitem" @click="menuAbierto = ''; exportCSV()">
                    <i data-lucide="table" class="ico-14"></i>
                    <span>URLs con sus metadatos (CSV)<span class="menu-sub">Una fila por URL, compatible con Excel</span></span></button>
                  <button role="menuitem" @click="menuAbierto = ''; exportLinksCSV()">
                    <i data-lucide="link" class="ico-14"></i>
                    <span>Enlaces (CSV)<span class="menu-sub">Origen, destino, ancla, rel y follow</span></span></button>
                  <button role="menuitem" @click="menuAbierto = ''; exportContentCSV()">
                    <i data-lucide="file-text" class="ico-14"></i>
                    <span>Contenido (CSV)<span class="menu-sub">Texto y markdown de cada página</span></span></button>
                  <hr>
                  <button role="menuitem" @click="menuAbierto = ''; exportBackup()" :disabled="!['completed','failed','cancelled'].includes(job.status)">
                    <i data-lucide="archive" class="ico-14"></i>
                    <span>Backup completo (ZIP)<span class="menu-sub">Para importarlo en otra instalación</span></span></button>
                </div>
              </div>
              <div class="menu-wrap" @click.outside="menuAbierto === 'mas' && (menuAbierto = '')">
                <button class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'mas' ? '' : 'mas'"
                        aria-haspopup="menu" :aria-expanded="menuAbierto === 'mas'" aria-label="Más acciones" title="Más acciones">
                  <i data-lucide="more-horizontal" class="ico-16"></i>
                </button>
                <div class="menu" x-show="menuAbierto === 'mas'" x-transition.opacity role="menu">
                  <button role="menuitem" @click="menuAbierto = ''; abrirEditarJob()">
                    <i data-lucide="pencil" class="ico-14"></i> Nombre, tipo y cliente</button>
                  <!-- Accion aparte y no una casilla de Comparar (revision de UX del 25-oct, 2.13). -->
                  <button role="menuitem" data-testid="menu-validar-migracion" @click="abrirMigracion()">
                    <i data-lucide="route" class="ico-14"></i> Validar una migración</button>
                  <hr>
                  <button role="menuitem" class="danger" @click="menuAbierto = ''; deleteJob()">
                    <i data-lucide="trash-2" class="ico-14"></i> Eliminar este rastreo</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template x-if="view === 'detail' && job">
      <div>
        <!-- Barra de progreso para trabajos en curso -->
        <template x-if="progress && ['pending','running','analyzing'].includes(job.status)">
          <div class="card mb-2">
            <div class="flex items-center justify-between text-sm">
              <span x-text="job.status === 'analyzing' ? 'Analizando resultados SEO...' : 'Rastreo en curso...'"></span>
              <span>
                <span x-text="fmt.num(progress.crawled_count) + ' URLs rastreadas'"></span>
                <!-- Frontera pendiente: evita tener que adivinar el tamano del
                     sitio. Si llega a 0, el rastreo cubrio todo lo enlazado. -->
                <template x-if="progress.pending_count !== null && progress.pending_count > 0">
                  <span class="text-dim" x-text="' · ' + fmt.num(progress.pending_count) + ' en cola'"></span>
                </template>
              </span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" :style="'width:' + crawledPercent() + '%'"></div>
            </div>
          </div>
        </template>

        <!-- Aviso de rastreo truncado. Sin esto, un crawl cortado por el tope
             de URLs se presentaba igual que uno completo, y las metricas de
             enlaces (PageRank incluido) salian de un grafo parcial. -->
        <template x-if="job.finish_reason === 'max_urls_reached'">
          <div class="card mb-2 filete-orange">
            <div class="text-sm">
              <strong>Rastreo incompleto.</strong>
              Se alcanzó el tope de URLs configurado, así que quedaron páginas sin
              rastrear. El grafo de enlaces y el PageRank están calculados sobre
              una parte del sitio. Reanuda el rastreo con un tope mayor —o sin
              tope— antes de usar estos datos para un informe.
            </div>
          </div>
        </template>

        <!-- Topes por carpeta (decision 172): partes del sitio con su cupo
             agotado. El censo esta truncado y no se afirman ausencias. -->
        <template x-if="job.topes_carpeta && job.topes_carpeta.sin_rastrear > 0">
          <div class="card mb-2 filete-orange" data-testid="aviso-topes-carpeta">
            <div class="text-sm">
              <strong>Partes del sitio sin rastrear entero.</strong>
              Los topes por carpeta dejaron sin pedir al menos
              <span x-text="fmt.num(job.topes_carpeta.sin_rastrear)"></span> URLs
              descubiertas. El censo no está entero: como esas páginas sin pedir
              también enlazan al resto del sitio, en todo el censo no se afirman
              páginas huérfanas ni sin camino desde la home, y tampoco la
              comparación con otro censo.
              <ul class="mt-40 mb-0 mr-0 ml-100">
                <template x-for="c in (job.topes_carpeta.cortados || []).slice(0, 8)" :key="c.grupo">
                  <li><code x-text="c.grupo"></code>: tope <span x-text="fmt.num(c.tope)"></span>,
                    <span x-text="fmt.num(c.sin_rastrear)"></span> sin rastrear</li>
                </template>
              </ul>
            </div>
          </div>
        </template>

        <!-- Rastreo detras de un muro (decision 103): el job queda failed con
             la causa y no se analiza. Sin esto se leia como un sitio con
             todo en 403, o peor, como un sitio limpio. -->
        <template x-if="['bloqueado_por_waf','rate_limited'].includes(job.finish_reason)
                        || (job.health && job.health.causa)">
          <div class="card mb-2 filete-red">
            <div class="text-sm">
              <strong x-text="(job.finish_reason === 'rate_limited' || (job.health||{}).causa === 'rate_limited')
                ? 'Rastreo parado: el servidor limita las peticiones (429).'
                : 'Rastreo parado: un WAF o un captcha no deja ver las páginas.'"></strong>
              Las respuestas que no eran la página llegaron al umbral, así que el
              rastreo se detuvo y no se ha analizado: las cifras de este censo
              no describen el sitio. Prueba con render de JavaScript, menos
              concurrencia o la IP del rastreador en la lista blanca del cliente.
            </div>
            <template x-if="job.health && job.health.por_clase">
              <div class="text-dim fs-sm mt-40"
                   x-text="Object.entries(job.health.por_clase).map(([c,n]) => fmt.claseRespuesta(c) + ': ' + fmt.num(n)).join(' · ')"></div>
            </template>
          </div>
        </template>

        <!-- Modo lista (decision 128): el veredicto de GET /veredicto, arriba
             y antes que las alertas, que es lo que se mira en un QA de
             despliegue. Los motivos traen su mensaje y una muestra de URLs. -->
        <template x-if="veredicto && VEREDICTO_TEXTO[veredicto.veredicto]">
          <div class="card mb-2 chk" data-testid="veredicto-lista"
               :style="'border-left:3px solid var(--' + VEREDICTO_TEXTO[veredicto.veredicto][1] + ')'">
            <div class="text-sm fila-extremos flex-wrap">
              <span>
                <strong :class="VEREDICTO_TEXTO[veredicto.veredicto][1]" x-text="VEREDICTO_TEXTO[veredicto.veredicto][0]"></strong>
                <span class="text-dim" x-text="' · lista de ' + fmt.num(veredicto.urls_de_la_lista) + (veredicto.urls_de_la_lista === 1 ? ' URL' : ' URLs')"></span>
              </span>
              <a class="text-sm" :href="'/api/jobs/' + job.id + '/veredicto'" target="_blank" rel="noopener">JSON para CI</a>
            </div>
            <template x-if="veredicto.veredicto === 'pasa'">
              <div class="text-sm text-dim">Todas las URLs de la lista responden 200, siguen indexables y con el mismo canonical que en el censo de referencia.</div>
            </template>
            <!-- Rojo los fallos, naranja las dudas y azul los avisos: una URL de
                 la lista que redirige a una pagina sana (decision 133). -->
            <template x-for="(m, i) in (veredicto.motivos || []).concat(veredicto.no_concluyente_por || [], veredicto.avisos || [])" :key="m.tipo + (m.regla || '') + i">
              <div :style="'margin-top:.5rem;padding-left:.6rem;border-left:2px solid var(--' + (i < (veredicto.motivos || []).length ? 'red' : (i < (veredicto.motivos || []).length + (veredicto.no_concluyente_por || []).length ? 'orange' : 'blue')) + ')'">
                <div class="fila-extremos">
                  <span class="text-sm" x-text="m.mensaje.charAt(0).toUpperCase() + m.mensaje.slice(1) + (m.causa ? ' (' + m.causa + ')' : '')"></span>
                  <strong x-show="m.paginas" class="nowrap" x-text="fmt.num(m.paginas)"></strong>
                </div>
                <!-- Por posicion: las semillas pueden repetirse y un :key repetido deja el x-for sin pintar -->
                <template x-for="(e, j) in (m.ejemplos || []).slice(0, 5)" :key="j">
                  <div class="text-dim fs-sm break-all"
                       x-text="e.url + (e.antes !== undefined ? '  ·  ' + (e.antes ?? '—') + ' → ' + (e.ahora ?? '—') : (e.ahora !== undefined && e.ahora !== null ? '  ·  ' + e.ahora : '')) + (e.destino ? '  → ' + e.destino : '') + (e.saltos ? ' (' + e.saltos + ' saltos)' : '') + (e.estado_destino ? '  ·  destino: ' + e.estado_destino : '')"></div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Lo que cambio respecto al censo anterior va lo primero del
             Resumen, justo bajo las pestanas (y en Comparar), y la tarjeta
             «N alertas», encima de las pestanas, se ve en todas: una alerta a la que hay
             que ir no es una alerta. En Lopesan, media seccion canonicalizada a
             un servidor de pruebas se entrego como un aviso `info` entre
             315.119 incidencias. -->
        <!-- Reglas propias del cliente que han saltado al cerrar el rastreo
             (decision 135). Se editan en la ficha del cliente, pestaña Configuración. -->
        <template x-if="job.alertas_cliente && (job.alertas_cliente.disparadas || []).length">
          <div class="card mb-2" data-testid="alertas-cliente"
               :style="'border-left:3px solid ' + fmt.colorSeveridad(job.alertas_cliente.disparadas[0].severidad)">
            <div class="text-sm flex justify-between gap-100 flex-wrap">
              <strong>Han saltado reglas del cliente.</strong>
              <a x-show="job.cliente_id" :href="'#/clientes/' + job.cliente_id" class="text-sm">Editar las reglas</a>
            </div>
            <template x-for="a in job.alertas_cliente.disparadas" :key="a.id">
              <div class="text-sm" :style="'margin-top:.4rem;padding-left:.6rem;border-left:2px solid ' + fmt.colorSeveridad(a.severidad)"
                   x-text="a.texto"></div>
            </template>
          </div>
        </template>




        <!-- Aviso de grafo incompleto por JavaScript. El PageRank se calcula
             igual y antes se entregaba sin decir nada: el aviso solo existia en
             el log del worker y en una columna del CSV, que no abre quien mira
             el job en pantalla (decision 35). -->
        <template x-if="job.js_check && job.js_check.grafo_fiable === false">
          <div class="card mb-2 filete-orange">
            <div class="text-sm">
              <strong>El PageRank no es fiable: faltan enlaces.</strong>
              Este rastreo se hizo sin render de JavaScript y hay plantillas que
              montan sus enlaces con JS, así que el grafo esta incompleto y el
              PageRank sale de el.
              <template x-if="(job.js_check.plantillas || []).some(p => p.enlaces_solo_js > 0)">
                <span>
                  Plantillas afectadas:
                  <span x-text="(job.js_check.plantillas || []).filter(p => p.enlaces_solo_js > 0).map(p => p.plantilla.split('  (')[0]).join(', ')"></span>.
                </span>
              </template>
              Relanza con <code>render_js</code> antes de usar estas cifras de
              enlazado en un informe.
            </div>
          </div>
        </template>

        <!-- Lo contrario: no se pudo comprobar. Tampoco es "fiable". -->
        <template x-if="job.js_check && job.js_check.grafo_fiable === null">
          <div class="card mb-2 filete-text-dim">
            <div class="text-sm">
              <strong>No se pudo comprobar si faltan enlaces.</strong>
              En las plantillas muestreadas, Chromium no recibió una página con
              contenido (bloqueo del WAF, desafío o error), así que el
              <em>grafo fiable</em> queda sin determinar: ni se afirma que falten
              enlaces ni que no falten.
            </div>
          </div>
        </template>


        <!-- Tarjetas (UX-13). Antes eran «URLs totales» y «Procesadas» con
             la misma cifra, y «Fallidas 0» en rojo. Ahora cada una contesta
             una pregunta y lleva a donde se mira el detalle. -->
      </div>
    </template>

    <template x-if="['detail', 'explorer', 'url-detail'].includes(view) && job">
      <div>
        <!-- Las tarjetas, solo en la ficha: en URLs la tabla necesita el alto. -->
        <template x-if="stats && view === 'detail'">
          <div class="stats-grid">
            <button class="stat-card stat-link" @click="openExplorer(); setExplorerTab('paginas_html')"
                    data-tip="Páginas HTML internas que responden 2xx: lo que el buscador puede indexar">
              <div class="stat-value" x-text="fmt.num(stats.paginas_html)"></div>
              <div class="stat-label">Páginas HTML</div>
              <div class="stat-sub" x-text="'de ' + fmt.num(stats.total_urls) + ' URLs rastreadas'"></div>
            </button>
            <button class="stat-card stat-link" @click="openExplorer(); setExplorerTab('noindex')"
                    data-tip="Páginas HTML que el buscador puede indexar; el resto lleva noindex, canonical a otra URL o similar">
              <!-- Sin analizar no hay indexabilidad calculada: «—» y «sin analizar
                   todavía», como la tarjeta de errores; no «0 indexables · 0 %». -->
              <div class="stat-value" :class="!job.analisis_version ? 'c-text-dim' : (stats.paginas_html && stats.indexables / stats.paginas_html < .5 ? 'orange' : 'green')"
                   data-testid="tarjeta-indexables" x-text="job.analisis_version ? fmt.num(stats.indexables) : '—'"></div>
              <div class="stat-label">Indexables</div>
              <div class="stat-sub" x-show="stats.paginas_html || !job.analisis_version"
                   x-text="!job.analisis_version ? 'sin analizar todavía' : Math.round(stats.indexables / Math.max(1, stats.paginas_html) * 100) + ' % · ' + fmt.num(stats.no_indexables) + ' no indexables'"></div>
            </button>
            <!-- En paginas y no en incidencias (revision de UX del 25-oct, 1.11):
                 «11.681 incidencias en total» sumaba tambien las info y no
                 decia cuantas paginas hay que tocar. -->
            <button class="stat-card stat-link" @click="issueFilters.severity = 'error'; issueFilters.issue_type = ''; issues = []; switchTab('issues')"
                    data-tip="Páginas con al menos un problema de gravedad error: lo primero que hay que mirar">
              <!-- Sin analizar (en curso o fallido antes del analisis) no se
                   sabe: «—», no un 0 en verde. -->
              <div class="stat-value" :class="!job.analisis_version ? '' : (stats.paginas_con_error ? 'red' : 'green')"
                   :style="!job.analisis_version ? 'color:var(--text-dim)' : ''"
                   x-text="job.analisis_version ? fmt.num(stats.paginas_con_error) : '—'"></div>
              <div class="stat-label">Páginas con error</div>
              <div class="stat-sub" x-text="!job.analisis_version ? 'sin analizar todavía' : (n => n ? n + (n === 1 ? ' tipo de error' : ' tipos de error') : 'ningún error')(stats.issues_by_type.filter(i => i.severity === 'error').length)"></div>
            </button>
            <button class="stat-card stat-link" @click="switchTab('diff')"
                    data-tip="Lo que ha cambiado respecto al censo anterior del mismo sitio">
              <template x-if="job.comparacion && job.comparacion.comparable">
                <div>
                  <div class="stat-value" :class="(job.comparacion.alertas || []).length ? 'orange' : 'green'"
                       x-text="(n => n ? fmt.num(n) + (n === 1 ? ' alerta' : ' alertas') : 'Ninguna alerta')((job.comparacion.alertas || []).length)"></div>
                  <div class="stat-label">Frente al censo anterior</div>
                  <!-- «saltaron»: las de esta comparacion, no las abiertas del
                       cliente (revision de UX del 25-oct, 2.3). -->
                  <div class="stat-sub" x-text="(n => (n > 1 ? 'saltaron' : 'saltó') + ' frente al ' + fmt.dia(job.comparacion.fecha_anterior))((job.comparacion.alertas || []).length)"></div>
                </div>
              </template>
              <template x-if="!(job.comparacion && job.comparacion.comparable)">
                <div>
                  <div class="stat-value c-text-dim">—</div>
                  <div class="stat-label">Frente al censo anterior</div>
                  <div class="stat-sub" x-text="job.comparacion ? 'no comparable' : 'sin comparación automática'"></div>
                </div>
              </template>
            </button>
          </div>
        </template>

        <!-- Pestanas (UX-09/10/11). Cinco de uso diario y lo especializado
             bajo «Avanzado». La antigua pestana URLs era una version pobre
             del Explorador: ahora la pestana URLs es el Explorador (2.6). -->
        <div class="tabs tabs-main" :class="view === 'explorer' && 'tabs-urls'" role="tablist">
          <button class="tab" role="tab" :aria-selected="pestanaActiva('overview')" :class="pestanaActiva('overview') && 'active'" @click="switchTab('overview')">
            <i data-lucide="layout-dashboard" class="ico-14"></i> Resumen
          </button>
          <!-- URLs = el Explorador y la ficha de cada URL (revision de UX del
               25-oct, 2.6; V29: antes nunca salia activa). Vuelve a la ultima
               consulta, con sus filtros y su pagina. -->
          <button class="tab" role="tab" data-testid="pestana-urls" :aria-selected="pestanaActiva('urls')" :class="pestanaActiva('urls') && 'active'"
                  @click="irAUrls()" data-tip="Todas las URLs, con filtros por columna">
            <i data-lucide="table-2" class="ico-14"></i> URLs
            <span class="count" x-text="stats ? fmt.num(stats.total_urls) : ''"></span>
          </button>
          <!-- El contador son tipos de error o aviso, los que hay que mirar, sin
               los info (revision de UX del 25-oct, 1.11; V16; decision 202):
               «11.681» eran todas las incidencias, info incluidas. -->
          <button class="tab" role="tab" :aria-selected="pestanaActiva('issues')" :class="pestanaActiva('issues') && 'active'" @click="switchTab('issues')"
                  :data-tip="stats && job.analisis_version ? (n => fmt.n(n, 'tipo', 'tipos') + ' de error o aviso, sin contar los informativos')(tiposQueMirar(stats)) : null">
            <i data-lucide="alert-triangle" class="ico-14"></i> Problemas <span class="count" data-testid="contador-problemas" x-text="(n => n ? fmt.num(n) : '')(stats && job.analisis_version ? tiposQueMirar(stats) : 0)"></span>
          </button>
          <button class="tab" role="tab" :aria-selected="pestanaActiva('links')" :class="pestanaActiva('links') && 'active'" @click="switchTab('links')">
            <i data-lucide="share-2" class="ico-14"></i> Enlaces<!-- Sin cifra: cambiaba con la vista y los filtros (destinos o enlaces) y no decia de que (2.8). -->
          </button>
          <button class="tab" role="tab" :aria-selected="pestanaActiva('diff')" :class="pestanaActiva('diff') && 'active'" @click="switchTab('diff')" data-tip="Qué ha cambiado respecto a otro rastreo del mismo sitio">
            <i data-lucide="git-compare" class="ico-14"></i> Comparar
          </button>
          <button class="tab" role="tab" :aria-selected="pestanaActiva('insights')" :class="pestanaActiva('insights') && 'active'" @click="switchTab('insights')" data-tip="Puntuación SEO por categorías, con recomendaciones. El entregable es «Informe para el cliente», arriba">
            <i data-lucide="file-bar-chart" class="ico-14"></i> Puntuación
          </button>
          <!-- IA (revision de UX del 25-oct, 2.9): pestana propia y no una
               opcion de «Avanzado». Es lo unico que se paga, y se lanza desde
               aqui con el coste delante y lo ya preguntado a la vista; dentro
               de un menu, nadie sabia si ya se habia preguntado. Cabe en la
               fila de escritorio (nombre corto) y en movil la fila ya se
               desplaza (1.1). -->
          <button class="tab" role="tab" data-testid="pestana-ia" :aria-selected="pestanaActiva('enriquecido')" :class="pestanaActiva('enriquecido') && 'active'"
                  @click="switchTab('enriquecido')" data-tip="Preguntas a la IA sobre las páginas: lo ya preguntado, sus respuestas y, con el coste delante, una consulta nueva">
            <i data-lucide="sparkles" class="ico-14"></i> IA
            <span class="count" x-text="enriqRuns.length ? fmt.num(enriqRuns.length) : ''"></span>
          </button>
          <!-- «Más» con nombre fijo y la opcion activa marcada dentro (V34,

          <div class="menu-wrap menu-wrap-mas" @click.outside="menuAbierto === 'avanzado' && (menuAbierto = '')">

                    <div class="mt-60">

                        <span x-text="'Preguntando: ' + (enriqRun.progreso.modulo ? tituloModuloEnriq(enriqRun.progreso.modulo) : '—')"></span>
                        <span x-text="fmt.num(enriqRun.progreso.procesadas) + ' de ' + fmt.num(enriqRun.progreso.total) + ' URLs'"></span>
                      </div>
                      <div class="progress-bar">
                        <div class="progress-fill" :style="'width:' + (enriqRun.progreso.total ? Math.min(100, 100 * enriqRun.progreso.procesadas / enriqRun.progreso.total) : 0) + '%'"></div>
                      </div>
                    </div>
                  </template>
                  <template x-if="enriqRun.estado === 'cancelando'">
                    <div class="text-dim fs-sm mt-40">Se para al terminar el lote en curso. Lo ya pagado se conserva.</div>
                  </template>
                  <template x-for="e in (enriqRun.errores || []).slice(0, 5)" :key="e">
                    <div class="text-dim fs-sm mt-25" x-text="'· ' + e"></div>
                  </template>
                </div>

                <template x-for="[preg, r] in Object.entries(enriqRun.resultados || {})" :key="preg">
                  <div class="card mb-100">
                    <div class="fila-extremos">
                      <!-- Sin la clave interna a la vista (V32; revision de UX del 25-oct, 3.9) -->
                      <span><strong x-text="tituloPreguntaEnriq(preg)"></strong></span>
                      <span class="text-dim fs-sm" x-text="fmt.num(r.total) + ' ' + fmt.unidadEnriq(r) + ' · ' + fmt.usd(r.coste_usd)"></span>
                    </div>
                    <div class="flex gap-120 flex-wrap mt-50 fs-sm">
                      <template x-for="[resp, n] in respuestasEnriq(r)" :key="resp">
                        <a href="#" @click.prevent="cargarDecisionesEnriq(preg, resp)">
                          <strong x-text="etiquetaEnriq(preg, resp)"></strong> <span x-text="fmt.num(n)"></span>
                          <span class="text-dim" x-show="r.umbral != null"
                                x-text="'(' + fmt.num((r.decididas_por_respuesta || {})[resp] || 0) + ' decididas)'"></span>
                        </a>
                      </template>
                      <template x-for="[est, n] in Object.entries(r.por_estado)" :key="est">
                        <span class="text-dim" x-text="estadoEnriq(est, n)"></span>
                      </template>
                    </div>
                    <!-- solo_si (decision 175): la recomendacion de una canibalizacion solo cuenta donde las paginas son sustitutas -->
                    <div class="text-dim fs-sm mt-35" x-show="r.solo_si">
                      Solo donde «<span x-text="r.solo_si && tituloPreguntaEnriq(r.solo_si[0])"></span>» respondió «<span x-text="r.solo_si && fmt.respuestaEnriq(r.solo_si[1])"></span>»;
                      en las otras <span x-text="fmt.num(r.no_aplica || 0)"></span> no aplica y no se cuenta.
                    </div>
                    <div class="text-dim fs-sm mt-35" x-show="r.umbral == null">
                      Esta pregunta aún no está calibrada: ninguna respuesta se da por decidida. Son orientativas; revísalas antes de actuar.
                    </div>
                    <!-- Salida a Problemas (V32): las preguntas que repasan un tipo
