                        <p class="text-sm text-dim" style="margin-top:.25rem">Obtenla en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
                      </div>
                      <template x-if="geminiFormError">
                        <p class="text-sm" style="color:var(--red);margin-bottom:.5rem" x-text="geminiFormError"></p>
                      </template>
                      <div style="display:flex;gap:.5rem;justify-content:flex-end">
                        <button class="btn btn-sm" @click="showGeminiModal = false">Cancelar</button>
                        <button class="btn btn-sm btn-primary" @click="saveGeminiAccount()">Guardar</button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Parametros: plegados, los valores por defecto sirven casi siempre -->
                <details class="config-avanzada" style="margin-bottom:1.25rem">
                  <summary><span>Parámetros</span>
                    <span class="text-dim text-sm" x-text="'PageRank ' + semanticAlpha + ' · clics ' + semanticBeta + ' · canibalización desde ' + semanticThreshold"></span></summary>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem">
                    <div data-tip="Peso del PageRank interno en el calculo de autoridad. Con alpha=1.0 solo usa PageRank. Si tienes datos GSC, baja alpha para dar peso a clicks reales.">
                      <label class="text-dim text-sm">Alpha (PageRank): <span x-text="semanticAlpha"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticAlpha" style="width:100%">
                    </div>
                    <div data-tip="Peso de los clicks de Google Search Console. Solo aplica si has importado datos GSC. Con beta=0.4 las páginas con mas trafico organico tendran mas influencia en el centro semántico.">
                      <label class="text-dim text-sm">Beta (Clicks GSC): <span x-text="semanticBeta"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticBeta" style="width:100%">
                    </div>
                    <div data-tip="Similitud coseno minima para considerar dos páginas como canibalización. 0.92 = conservador (solo pares muy similares). Baja a 0.85 para detectar mas pares, sube a 0.95 para solo los mas criticos.">
                      <label class="text-dim text-sm">Umbral canibalización: <span x-text="semanticThreshold"></span></label>
                      <input type="range" min="0.8" max="0.99" step="0.01" x-model.number="semanticThreshold" style="width:100%">
                    </div>
                  </div>
                </details>

                <!-- Boton Analizar -->
                <button class="btn btn-primary" @click="runSemanticAnalysis()" :disabled="semanticLoading"
                        style="display:flex;align-items:center;gap:.4rem;font-size:.95rem;padding:.6rem 1.5rem">
                  <template x-if="semanticLoading"><span class="spinner" style="width:16px;height:16px"></span></template>
                  <i data-lucide="brain" style="width:16px;height:16px" x-show="!semanticLoading"></i>
                  Analizar
                </button>
              </div>
            </template>

            <!-- Progress bar -->
            <template x-if="semanticLoading && semanticProgress">
              <div class="card" style="padding:1rem;margin-bottom:1rem">
                <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem">
                  <span class="spinner" style="width:16px;height:16px"></span>
                  <span class="text-sm" x-text="semanticStageLabel(semanticProgress.stage)"></span>
                  <span class="text-sm text-dim" x-text="semanticProgress.progress + '%'" style="margin-left:auto"></span>
                </div>
                <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;background:var(--accent);border-radius:3px;transition:width .3s" :style="'width:' + semanticProgress.progress + '%'"></div>
                </div>
              </div>
            </template>

            <!-- Error -->
            <template x-if="semanticError">
              <div class="card" style="padding:1rem;border-color:var(--red);color:var(--red);margin-bottom:1rem">
                <span x-text="semanticError"></span>
                <button class="btn btn-sm" style="margin-left:1rem" @click="semanticError=null;semanticResults=null">Reintentar</button>
              </div>
            </template>

            <!-- Sub-tabs de resultados -->
            <template x-if="semanticResults">
              <div>
                <div class="tabs" style="margin-bottom:1rem">
                  <button type="button" class="tab" :class="semanticSubTab === 'rings' && 'active'" @click="semanticSubTab='rings'; renderSemanticChart('rings')" data-tip="Visualizacion en anillos concentricos. Las páginas se colocan según su distancia al centro semántico del sitio. Core = tema principal, Peripheral = contenido lejano.">Anillos</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'scatter' && 'active'" @click="semanticSubTab='scatter'; renderSemanticChart('scatter')" data-tip="Mapa 2D donde cada punto es una página. Las páginas cercanas tratan temas similares. Los colores agrupan clusters temáticos detectados automáticamente.">Mapa de temas</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'cannibal' && 'active'" @click="semanticSubTab='cannibal'; loadCannibalization()" data-tip="Pares de páginas con contenido casi identico que compiten entre si en Google. La URL dominante es la de mayor autoridad (PageRank/clicks). La debil es candidata a consolidar, redirigir o diferenciar.">Canibalización</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'drift' && 'active'" @click="semanticSubTab='drift'; loadDrift()" data-tip="Páginas con alta autoridad que estan lejos del tema central. Al tener mucho peso, arrastran el centro semántico del sitio. Candidatas a reenfocar o desacoplar.">Desvío del tema</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'gap' && 'active'" @click="semanticSubTab='gap'" data-tip="Busca que páginas de tu sitio son mas relevantes para un tema concreto. Compara embeddings directamente para encontrar contenido existente que cubra o se acerque al topico buscado.">Huecos</button>
                </div>

                <!-- Ring Map -->
                <template x-if="semanticSubTab === 'rings'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Cada punto es una página posicionada según su distancia al <strong>centro semántico actual</strong> del sitio. El centro se calcula como la media ponderada de todos los embeddings (peso = PageRank + clicks GSC). <strong>PageRank</strong> mide la importancia de cada pagina segun cuantos enlaces internos recibe y de que paginas: una URL enlazada desde muchas paginas (o desde paginas importantes) tiene mas PageRank. Es la misma logica que usa Google internamente. Las paginas del anillo <strong style="color:#34a853">Core</strong> definen el tema principal, las del <strong style="color:#ea4335">Peripheral</strong> estan fuera de foco. El tamaño del punto refleja su autoridad.</p>
                    <div id="semantic-ring-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden"></div>

                    <!-- Target Theme -->
                    <div class="card" style="padding:1rem;margin-top:1rem">
                      <h4 style="margin-bottom:.5rem;font-size:.9rem;display:flex;align-items:center;gap:.3rem" data-tip="Define el tema ideal de tu sitio. El sistema re-centra los anillos alrededor de ese tema y te dice que páginas reforzar (estan cerca del objetivo pero con poca autoridad) y cuales reenfocar (tienen mucha autoridad pero estan lejos del objetivo).">
                        <i data-lucide="target" style="width:14px;height:14px"></i> Tema objetivo
                      </h4>
                      <p class="text-dim text-sm" style="margin-bottom:.5rem">Describe el tema central ideal de tu sitio (5-15 palabras para mejor precision). El sistema re-centrara los anillos alrededor de ese tema y mostrara como mover el centro semantico hacia el.</p>
                      <div style="display:flex;gap:.5rem;align-items:end">
                        <div style="flex:1">
                          <input type="text" x-model="targetTheme" placeholder="Ej: Formacion Profesional online a distancia, ciclos de grado medio y superior"
                                 style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.9rem">
                        </div>
                        <button class="btn btn-primary btn-sm" @click="analyzeTarget()" :disabled="targetLoading || !targetTheme.trim()" style="display:flex;align-items:center;gap:.25rem">
                          <template x-if="targetLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                          <i data-lucide="target" style="width:13px;height:13px" x-show="!targetLoading"></i>
                          Re-centrar
                        </button>
                      </div>

                      <!-- Target Results -->
                      <template x-if="targetResults">
                        <div style="margin-top:1rem">
                          <!-- Alignment Score -->
                          <div style="display:flex;align-items:center;gap:1.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap">
                            <span class="text-sm" data-tip="Similitud coseno entre el centro semántico actual del sitio y el tema objetivo. 100% = perfectamente alineado.">
                              <strong>Alineamiento:</strong>
                              <span :style="'font-weight:700;color:' + (targetResults.alignment >= 0.9 ? 'var(--green)' : targetResults.alignment >= 0.8 ? 'var(--orange)' : 'var(--red)')"
                                    x-text="(targetResults.alignment * 100).toFixed(1) + '%'"></span>
                            </span>
                            <span class="text-sm text-dim" x-text="'Tema: ' + targetResults.target_theme"></span>
                            <template x-for="ring in ['Core','Focus','Expansion','Peripheral']" :key="ring">
                              <span class="text-sm" :style="'color:' + ({Core:'#34a853',Focus:'#4285f4',Expansion:'#fbbc04',Peripheral:'#ea4335'})[ring]">
                                <strong x-text="ring + ': '"></strong><span x-text="targetResults.ring_counts[ring] || 0"></span>
                              </span>
                            </template>
                          </div>

                          <!-- Target Ring Map -->
                          <div id="semantic-target-ring-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden;margin-bottom:1rem"></div>

                          <!-- Recommendations -->
                          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                            <!-- Reinforce -->
                            <div>
                              <h5 style="font-size:.85rem;margin-bottom:.5rem;color:#34a853;display:flex;align-items:center;gap:.3rem" data-tip="Páginas cercanas al tema objetivo pero con poca autoridad. Refuerza el enlazado interno hacia ellas para mover el centro semántico hacia tu objetivo.">
                                <i data-lucide="arrow-up-circle" style="width:14px;height:14px"></i> Reforzar (enlazar mas)
                              </h5>
                              <template x-if="targetResults.reinforce.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.reinforce.length > 0">
                                <div style="max-height:300px;overflow-y:auto">
                                  <table class="tbl" style="font-size:.8rem">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.reinforce" :key="r.url_id">
                                        <tr>
                                          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="r.weight.toFixed(3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--orange)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>

                            <!-- Refocus -->
                            <div>
                              <h5 style="font-size:.85rem;margin-bottom:.5rem;color:#ea4335;display:flex;align-items:center;gap:.3rem" data-tip="Páginas con alta autoridad pero alejadas del tema objetivo. Estan arrastrando el centro semántico en otra direccion. Opciones: reenfocar su contenido hacia el objetivo, o reducir su enlazado interno.">
                                <i data-lucide="arrow-down-circle" style="width:14px;height:14px"></i> Reenfocar (alejadas del objetivo)
                              </h5>
                              <template x-if="targetResults.refocus.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.refocus.length > 0">
                                <div style="max-height:300px;overflow-y:auto">
                                  <table class="tbl" style="font-size:.8rem">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.refocus" :key="r.url_id">
                                        <tr>
                                          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="r.weight.toFixed(3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--red)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Scatter UMAP -->
                <template x-if="semanticSubTab === 'scatter'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Proyeccion 2D del espacio de embeddings (UMAP). Paginas cercanas tratan temas similares. Los colores representan clusters tematicos (HDBSCAN). Puntos con borde rojo son outliers semanticos. Pasa el raton sobre un punto para ver la URL y sus metricas.</p>
                    <div id="semantic-scatter-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden"></div>
                  </div>
                </template>

                <!-- Canibalizacion -->
                <template x-if="semanticSubTab === 'cannibal'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Pares de páginas con contenido similar que compiten por las mismas keywords en Google. Si hay datos GSC con queries, se valida que ambas páginas ranqueen para las mismas keywords no-marca. Sin datos GSC, se muestra solo la similitud semántica.</p>

                    <!-- Brand filter + reload -->
                    <div style="display:flex;gap:.5rem;align-items:end;margin-bottom:.75rem;flex-wrap:wrap">
                      <div style="flex:1;min-width:200px">
                        <label class="text-dim text-sm" data-tip="Keywords de marca a excluir. Separadas por coma. Ej: ilerna, ilerna fp. Dos páginas que solo comparten queries de marca NO son canibalización real.">Keywords de marca (excluir)</label>
                        <input type="text" x-model="cannibalBrand" placeholder="Ej: ilerna, ilerna fp"
                               style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem;margin-top:.2rem">
                      </div>
                      <button class="btn btn-sm" @click="cannibalPairs=[]; loadCannibalization()" :disabled="cannibalLoading" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="cannibalLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Recargar
                      </button>
                      <template x-if="cannibalHasQueryData && cannibalPairs.length > 0">
                        <div style="display:flex;gap:.25rem">
                          <button class="btn btn-sm" :class="cannibalFilter === 'all' && 'btn-primary'" @click="cannibalFilter='all'">Todos</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'confirmed' && 'btn-primary'" @click="cannibalFilter='confirmed'" data-tip="Solo pares que comparten keywords no-marca en GSC">Confirmados</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'unconfirmed' && 'btn-primary'" @click="cannibalFilter='unconfirmed'" data-tip="Pares sin keywords compartidas (posibles falsos positivos)">Sin validar</button>
                        </div>
                      </template>
                    </div>

                    <template x-if="cannibalLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando canibalización...</div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length === 0">
                      <div class="empty" style="padding:2rem">
                        <i data-lucide="check-circle" style="width:32px;height:32px;color:var(--green);margin-bottom:.5rem"></i>
                        <p>No se detectaron pares de canibalización con el umbral actual.</p>
                      </div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length > 0">
                      <div style="overflow-x:auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>URL Dominante</th>
                              <th data-tip="Clicks organicos de la URL dominante (GSC).">Clicks</th>
                              <th>URL Debil</th>
                              <th data-tip="Clicks organicos de la URL debil (GSC).">Clicks</th>
                              <th>Similitud</th>
                              <th data-tip="Keywords no-marca compartidas entre ambas URLs en GSC. Si hay queries compartidas = canibalización confirmada.">KWs compartidas</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="pair in cannibalPairs.filter(p => {
                              if (cannibalFilter === 'all') return true;
                              if (cannibalFilter === 'confirmed') return p.shared_query_count > 0;
                              return p.shared_query_count === 0;
                            })" :key="pair.url_dominant + pair.url_weak">
                              <tr>
                                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="pair.url_dominant" x-text="pair.url_dominant"></td>
                                <td x-text="pair.dominant_clicks != null ? pair.dominant_clicks.toLocaleString('es-ES') : '—'"></td>
                                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="pair.url_weak" x-text="pair.url_weak"></td>
                                <td x-text="pair.weak_clicks != null ? pair.weak_clicks.toLocaleString('es-ES') : '—'"></td>
                                <td><span style="font-weight:600" :style="pair.cosine_similarity >= 0.95 ? 'color:var(--red)' : 'color:var(--orange)'" x-text="(pair.cosine_similarity * 100).toFixed(1) + '%'"></span></td>
                                <td>
                                  <template x-if="pair.shared_query_count > 0">
                                    <span style="cursor:help" :title="pair.shared_queries.join(', ')" :style="'color:var(--red);font-weight:600'">
                                      <span x-text="pair.shared_query_count"></span> kws
                                    </span>
                                  </template>
                                  <template x-if="pair.shared_query_count === 0 && cannibalHasQueryData">
                                    <span class="text-dim">0</span>
                                  </template>
                                  <template x-if="!cannibalHasQueryData">
                                    <span class="text-dim">—</span>
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Drift -->
                <template x-if="semanticSubTab === 'drift'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Páginas que mas desplazan el centro semántico del sitio. Son URLs con <strong>alta autoridad</strong> (peso) pero <strong>alejadas del tema principal</strong> (distancia). El Drift Score = peso x distancia. Si una pagina importante habla de algo muy diferente al resto del sitio, arrastra el centroide. Accion: reenfocar su contenido o reducir su autoridad interna.</p>
                    <template x-if="driftLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando drift...</div>
                    </template>
                    <template x-if="!driftLoading && driftData.length > 0">
                      <div style="overflow-x:auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th><th>URL</th>
                              <th data-tip="Distancia euclidea al centroide. Mayor = mas alejada del tema central.">Distancia</th>
                              <th data-tip="Autoridad normalizada (PageRank + clicks GSC). Mayor = mas influyente.">Peso</th>
                              <th data-tip="Impacto en el desplazamiento del centro semántico. Drift = peso x distancia.">Drift Score</th>
                              <th data-tip="Clicks organicos de Google (GSC). Contexto: por que esta página importa.">Clicks</th>
                              <th data-tip="Posicion media en Google (GSC). Menor = mejor posicionamiento.">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(d, idx) in driftData" :key="d.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="d.url" x-text="d.url"></td>
                                <td x-text="d.distance"></td>
                                <td x-text="d.weight"></td>
                                <td><strong x-text="d.drift_score"></strong></td>
                                <td x-text="d.clicks != null ? d.clicks.toLocaleString('es-ES') : '—'"></td>
                                <td x-text="d.position != null ? d.position.toFixed(1) : '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Gap Analysis -->
                <template x-if="semanticSubTab === 'gap'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Escribe un tema y el sistema busca que paginas de tu sitio cubren mejor ese contenido. Compara el embedding del tema con el de cada pagina. Las mas similares son candidatas para enlazar, expandir o reforzar. Tambien muestra la centralidad de cada pagina (similitud al centroide) para saber si esta en el nucleo o en la periferia del sitio.</p>
                    <div style="display:flex;gap:.5rem;align-items:end;margin-bottom:.5rem">
                      <div style="flex:1">
                        <label class="text-dim text-sm">Topico objetivo</label>
                        <input type="text" x-model="gapTopic" placeholder="Ej: guia de cuidado dental infantil"
                               style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.9rem;margin-top:.2rem">
                      </div>
                      <button class="btn btn-primary btn-sm" @click="runGapAnalysis()" :disabled="gapLoading || !gapTopic.trim()" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="gapLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Analizar gap
                      </button>
                    </div>
                    <div style="margin-bottom:1rem">
                      <label class="text-dim text-sm" data-tip="Patrones de URL a excluir de los resultados, separados por coma. Ej: /page/, /tag/, /category/. Se aplica como 'contiene'.">Excluir URLs que contengan</label>
                      <input type="text" x-model="gapExclude" placeholder="Ej: /page/, /tag/, /category/"
                             style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem;margin-top:.2rem">
                    </div>
                    <template x-if="gapResults && gapResults.candidates">
                      <div>
                        <p class="text-sm text-dim" style="margin-bottom:.5rem">Páginas mas relevantes para "<span x-text="gapResults.topic"></span>":</p>
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th>
                              <th>URL</th>
                              <th data-tip="Similitud coseno entre el embedding de la página y el del tema buscado. Mayor = mas relevante.">Similitud al tema</th>
                              <th data-tip="Similitud coseno al centroide del sitio. Alto = página central. Bajo = página periferica.">Centralidad</th>
                              <th data-tip="Clicks organicos de Google (GSC).">Clicks</th>
                              <th data-tip="Posicion media en Google (GSC).">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(c, idx) in gapResults.candidates.filter(c => {
                              if (!gapExclude || !gapExclude.trim()) return true;
                              const patterns = gapExclude.split(',').map(p => p.trim().toLowerCase()).filter(Boolean);
                              return !patterns.some(p => c.url.toLowerCase().includes(p));
                            })" :key="c.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td style="max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="c.url" x-text="c.url"></td>
                                <td><strong x-text="(c.similarity_to_topic * 100).toFixed(1) + '%'"></strong></td>
                                <td x-text="(c.similarity_to_centroid * 100).toFixed(1) + '%'"></td>
                                <td x-text="c.clicks != null ? c.clicks.toLocaleString('es-ES') : '—'"></td>
                                <td x-text="c.position != null ? c.position.toFixed(1) : '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: LIMPIEZA ===== -->
        <template x-if="detailTab === 'cleaning'">
          <div>
            <!-- Nota informativa -->
            <div style="display:flex;align-items:flex-start;gap:.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;border-left:3px solid var(--blue);font-size:.85rem">
              <i data-lucide="info" style="width:15px;height:15px;flex-shrink:0;margin-top:.15rem;color:var(--blue)"></i>
              <span>Proceso opcional a posteriori. Los originales se conservan &mdash; puedes revertir en cualquier momento. Si una regla eliminaría más del 60% del contenido de una página, esa página se salta automáticamente.</span>
            </div>

            <template x-if="cleaningError">
              <p class="text-sm" style="color:var(--red);margin-bottom:.75rem" x-text="cleaningError"></p>
            </template>
            <template x-if="cleaningMessage">
              <p class="text-sm" style="color:var(--green);margin-bottom:.75rem" x-text="cleaningMessage"></p>
            </template>

            <!-- Grupos -->
            <div class="card" style="margin-bottom:1rem">
              <div class="card-header">
                <h2>Grupos</h2>
                <button class="btn btn-sm" @click="loadCleaningGroups()" :disabled="cleaningGroupsLoading" style="display:flex;align-items:center;gap:.25rem">
                  <i data-lucide="refresh-cw" style="width:12px;height:12px"></i> Actualizar
                </button>
              </div>
              <template x-if="cleaningGroupsLoading">
                <div class="loading-overlay"><div class="spinner"></div> Cargando grupos...</div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length === 0">
                <div class="empty"><h3>No hay grupos de contenido</h3></div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th data-tip="Patron de forma de URL que agrupa páginas con estructura similar">Forma de URL</th>
                        <th data-tip="Número de páginas del grupo">Páginas</th>
                        <th data-tip="Páginas del grupo con limpieza aplicada">Limpiadas</th>
                        <th data-tip="Longitud media del contenido en caracteres">Long. media</th>
                        <th data-tip="URL de ejemplo del grupo">Ejemplo</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="g in cleaningGroups" :key="g.group_key">
                        <tr @click="selectCleaningGroup(g)" style="cursor:pointer" :class="cleaningSelectedGroup === g.group_key && 'row-selected'">
                          <td style="font-family:monospace;font-size:.8rem" x-text="g.group_key"></td>
                          <td x-text="fmt.num(g.pages)"></td>
                          <td x-text="fmt.num(g.cleaned_pages)"></td>
                          <td x-text="fmt.num(g.avg_content_length)"></td>
                          <td style="max-width:300px" :title="g.sample_urls?.[0] || ''">
                            <div class="truncate text-dim text-sm" x-text="g.sample_urls?.[0] || '—'"></div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>

            <!-- Reglas -->
            <template x-if="cleaningSelectedGroup">
              <div class="card" style="margin-bottom:1rem">
                <div class="card-header">
                  <h2>Reglas &mdash; <span style="font-family:monospace;font-size:.85rem;font-weight:400" x-text="cleaningSelectedGroup"></span></h2>
                </div>
                <template x-for="(rule, idx) in cleaningRules" :key="idx">
                  <div style="display:flex;gap:.5rem;margin-bottom:.5rem;align-items:center">
                    <select x-model="rule.type" style="width:auto;padding:.35rem .5rem;font-size:.8rem">
                      <option value="line_exact">Línea exacta</option>
                      <option value="line_prefix">Línea que empieza por</option>
                      <option value="line_contains">Línea que contiene</option>
                      <option value="cut_from_line">Cortar desde línea que contiene</option>
                      <option value="remove_substring">Quitar texto literal</option>
                      <option value="regex">Expresión regular</option>
                    </select>
                    <input type="text" x-model="rule.value" placeholder="Valor de la regla" style="flex:1">
                    <button class="btn btn-sm btn-danger" @click="removeCleaningRule(idx)" title="Quitar regla">&#10005;</button>
                  </div>
                </template>
                <button class="btn btn-sm" @click="addCleaningRule()" style="margin-bottom:1rem">+ Añadir regla</button>

                <div style="display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem">
                  <div>
                    <label class="text-dim text-sm">Aplicar a</label>
                    <select x-model="cleaningTargets" style="display:block;margin-top:.2rem;width:auto;padding:.35rem .5rem;font-size:.8rem">
                      <option value="text">Texto</option>
                      <option value="markdown">Markdown</option>
                      <option value="both">Ambos</option>
                    </select>
                  </div>
                  <div style="flex:1;min-width:220px">
                    <label class="text-dim text-sm">Filtro regex de URL (opcional)</label>
                    <input type="text" x-model="cleaningUrlRegex" placeholder="^https://ejemplo\.com/blog/" style="display:block;margin-top:.2rem;width:100%">
                  </div>
                </div>

                <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                  <button class="btn btn-sm" @click="previewCleaning()" :disabled="cleaningPreviewLoading || cleaningApplying || cleaningReverting" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningPreviewLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Vista previa
                  </button>
                  <button class="btn btn-sm btn-primary" @click="applyCleaning()" :disabled="cleaningApplying || cleaningPreviewLoading || cleaningReverting" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningApplying"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Aplicar al grupo
                  </button>
                  <button class="btn btn-sm btn-danger" @click="revertCleaning()" :disabled="cleaningReverting || cleaningApplying || cleaningPreviewLoading" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningReverting"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Revertir grupo
                  </button>
                </div>
              </div>
            </template>

            <!-- Vista previa -->
            <template x-if="cleaningPreview">
              <div class="card" style="margin-bottom:1rem">
                <div class="card-header"><h2>Vista previa</h2></div>
                <p class="text-sm" style="margin-bottom:.75rem">
                  <strong x-text="fmt.num(cleaningPreview.total_chars_removed)"></strong> caracteres eliminados en total en la muestra.
                  <template x-if="cleaningPreview.pages_skipped_safety > 0">
                    <span style="color:var(--orange)" x-text="fmt.num(cleaningPreview.pages_skipped_safety) + ' páginas se saltarían por la válvula de seguridad (>60% eliminado)'"></span>
                  </template>
                </p>
                <template x-if="cleaningPreview.samples.length === 0">
                  <div class="empty"><h3>Ninguna página de la muestra cambia con estas reglas</h3></div>
                </template>
                <template x-for="s in cleaningPreview.samples" :key="s.url">
                  <div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
                    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap">
                      <a :href="s.url" target="_blank" rel="noopener" class="text-sm truncate" style="max-width:60%" :title="s.url" x-text="s.url"></a>
                      <span class="text-sm" style="padding:.1rem .5rem;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600"
                            x-text="'-' + fmt.num(s.chars_removed) + ' chars (' + (s.removed_pct ?? 0).toFixed(1) + '%)'"></span>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                      <div>
                        <div class="text-dim text-sm" style="margin-bottom:.25rem">Antes</div>
                        <pre style="max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem;font-size:.72rem;font-family:monospace;white-space:pre-wrap;word-break:break-word" x-text="s.before_excerpt"></pre>
                      </div>
                      <div>
                        <div class="text-dim text-sm" style="margin-bottom:.25rem">Después</div>
                        <pre style="max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem;font-size:.72rem;font-family:monospace;white-space:pre-wrap;word-break:break-word" x-text="s.after_excerpt"></pre>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Historial -->
            <div class="card">
              <div class="card-header"><h2>Historial de limpiezas</h2></div>
              <template x-if="cleaningRulesets.length === 0">
                <div class="text-dim text-sm">Sin limpiezas aplicadas todavía</div>
              </template>
              <template x-if="cleaningRulesets.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Fecha</th>
                        <th>Grupo</th>
                        <th>Reglas</th>
                        <th>Páginas actualizadas</th>
                        <th>Saltadas</th>
                        <th>Chars eliminados</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rs in cleaningRulesets" :key="rs.id">
                        <tr>
                          <td x-text="fmt.date(rs.created_at)"></td>
                          <td style="font-family:monospace;font-size:.8rem" x-text="rs.group_key || rs.url_regex || '—'"></td>
                          <td x-text="rs.rules?.length || 0"></td>
                          <td x-text="fmt.num(rs.pages_updated)"></td>
                          <td x-text="fmt.num(rs.pages_skipped)"></td>
                          <td x-text="fmt.num(rs.chars_removed)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: INFORME SEO ===== -->
        <template x-if="detailTab === 'insights'">
          <div>
            <!-- Loading -->
            <template x-if="insightsLoading">
              <div class="loading-overlay"><div class="spinner"></div> Calculando la puntuación...</div>
            </template>

            <template x-if="!insightsLoading && insights">
              <div>
                <!-- Puntuacion global -->
                <div class="insights-header">
                  <div class="score-ring-wrap">
                    <svg class="score-ring" viewBox="0 0 120 120">
                      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8"/>
                      <circle cx="60" cy="60" r="52" fill="none" :stroke="scoreColor(insights.overall_score)" stroke-width="8"
                        stroke-linecap="round"
                        :stroke-dasharray="ringDash(insights.overall_score, 52)"
                        stroke-dashoffset="0"
                        transform="rotate(-90 60 60)"/>
                      <text x="60" y="55" text-anchor="middle" fill="var(--text)" font-size="28" font-weight="700" x-text="insights.overall_score"></text>
                      <text x="60" y="73" text-anchor="middle" fill="var(--text-dim)" font-size="11" x-text="scoreLabel(insights.overall_score)"></text>
                    </svg>
                  </div>
                  <div class="insights-header-text">
                    <h2>Puntuación SEO global</h2>
                    <!-- El tope va ANTES que la explicacion de la media: si la
                         nota esta recortada, es lo primero que hay que saber. -->
                    <template x-if="insights.tope">
                      <div class="nota-tope">
                        <i data-lucide="alert-octagon" style="width:15px;height:15px"></i>
                        <div>
                          <strong x-text="'Limitada a ' + insights.tope.tope + ' por errores'"></strong>
                          (sin el tope saldría <span x-text="insights.overall_score_sin_tope"></span>).
                          <span x-text="fmt.num(insights.tope.paginas_con_error) + ' de ' + fmt.num(insights.tope.de) + ' URLs internas (' + String(insights.tope.pct).replace('.', ',') + ' %) tienen algún error.'"></span>
                          <a :href="'#/rastreos/' + job.id + '/problemas?gravedad=error'">Ver los errores</a>
                        </div>
                      </div>
                    </template>
                    <p class="text-dim text-sm">Media ponderada de 6 categorías: rastreabilidad 25 %, contenido 25 %, enlaces 20 %, seguridad 15 %, datos estructurados 10 %, internacionalización 5 %. Con errores abiertos no pasa de 79, y si afectan al 10 % de las URLs o más, de 49.</p>
                  </div>
                </div>

                <!-- Categorias -->
                <div class="insights-categories">
                  <template x-for="cat in insights.categories" :key="cat.key">
                    <div class="insight-card" :style="'border-left-color:' + scoreColor(cat.score)">
                      <!-- Cabecera de categoria -->
                      <div class="insight-card-header" role="button" tabindex="0" @keydown.enter.prevent="$el.click()" @keydown.space.prevent="$el.click()" @click="toggleCategory(cat.key)">
                        <div class="flex items-center gap-1">
                          <span class="insight-icon" x-text="cat.icon"></span>
                          <span class="insight-name" x-text="cat.name"></span>
                        </div>
                        <div class="flex items-center gap-1">
                          <div class="insight-score-bar">
                            <div class="insight-score-fill" :style="'width:' + cat.score + '%;background:' + scoreColor(cat.score)"></div>
                          </div>
                          <span class="insight-score-num" :style="'color:' + scoreColor(cat.score)" x-text="cat.score"></span>
                          <span class="insight-toggle" x-text="isCategoryExpanded(cat.key) ? '&#9650;' : '&#9660;'"></span>
                        </div>
                      </div>

                      <!-- Cuerpo expandible -->
                      <div class="insight-card-body" x-show="isCategoryExpanded(cat.key)" x-transition.duration.200ms>
                        <!-- Metricas -->
                        <div class="metric-grid">
                          <!-- Crawlability metrics -->
                          <template x-if="cat.key === 'crawlability'">
                            <template x-for="m in [
                              {l:'URLs internas', v:fmt.num(cat.metrics.total_internal)},
                              {l:'% respuesta 2xx', v:fmt.pct(cat.metrics.pct_2xx)},
                              {l:'% indexables', v:fmt.pct(cat.metrics.pct_indexable)},
                              {l:'% redirecciones', v:fmt.pct(cat.metrics.pct_redirects)},
                              {l:'Errores 4xx', v:fmt.num(cat.metrics.errors_4xx)},
                              {l:'Errores 5xx', v:fmt.num(cat.metrics.errors_5xx)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Content metrics -->
                          <template x-if="cat.key === 'content'">
                            <template x-for="m in [
                              {l:'Paginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'% titulos OK', v:fmt.pct(cat.metrics.pct_title_ok)},
                              {l:'% descripciones OK', v:fmt.pct(cat.metrics.pct_desc_ok)},
                              {l:'% H1 OK', v:fmt.pct(cat.metrics.pct_h1_ok)},
                              {l:'Media palabras', v:fmt.num(cat.metrics.avg_word_count)},
                              {l:'Contenido delgado', v:fmt.num(cat.metrics.thin_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Links metrics -->
                          <template x-if="cat.key === 'links'">
                            <template x-for="m in [
                              {l:'Paginas internas', v:fmt.num(cat.metrics.total_internal_pages)},
                              {l:'Paginas huerfanas', v:fmt.num(cat.metrics.orphan_count)},
                              {l:'Media inlinks', v:cat.metrics.avg_inlinks},
                              {l:'Enlaces nofollow', v:fmt.num(cat.metrics.nofollow_links)},
                              {l:'Paginas con errores', v:fmt.num(cat.metrics.broken_link_issues)},
                              {l:'Exceso de enlaces', v:fmt.num(cat.metrics.high_outlinks)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Security metrics -->
                          <template x-if="cat.key === 'security'">
                            <template x-for="m in [
                              {l:'Paginas analizadas', v:fmt.num(cat.metrics.total_checked)},
                              {l:'% HTTPS', v:fmt.pct(cat.metrics.pct_https)},
                              {l:'% HSTS', v:fmt.pct(cat.metrics.pct_hsts)},
                              {l:'% CSP', v:fmt.pct(cat.metrics.pct_csp)},
                              {l:'% contenido mixto', v:fmt.pct(cat.metrics.pct_mixed)},
                              {l:'Con contenido mixto', v:fmt.num(cat.metrics.mixed_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Structured Data metrics -->
                          <template x-if="cat.key === 'structured_data'">
                            <template x-for="m in [
                              {l:'Paginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'Con datos estructurados', v:fmt.num(cat.metrics.pages_with_sd)},
                              {l:'% con SD', v:fmt.pct(cat.metrics.pct_with_sd)},
                              {l:'Bloques totales', v:fmt.num(cat.metrics.total_sd_blocks)},
                              {l:'Errores validacion', v:fmt.num(cat.metrics.sd_errors)},
                              {l:'% errores', v:fmt.pct(cat.metrics.pct_errors)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- i18n metrics -->
                          <template x-if="cat.key === 'i18n'">
                            <template x-for="m in [
                              {l:'Etiquetas hreflang', v:fmt.num(cat.metrics.total_hreflang)},
                              {l:'Idiomas', v:cat.metrics.languages?.join(', ') || '—'},
                              {l:'% retorno OK', v:fmt.pct(cat.metrics.pct_return_ok)},
                              {l:'Hreflang a URL descartada', v:fmt.num(cat.metrics.destino_malo ?? 0)},
                              {l:'% idioma valido', v:fmt.pct(cat.metrics.pct_lang_valid)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                        </div>

                        <!-- Recomendaciones -->
                        <template x-if="cat.recommendations.length > 0">
                          <div class="recommendations-section">
                            <h4 class="text-dim text-sm mb-1" style="text-transform:uppercase;letter-spacing:.05em">Recomendaciones</h4>
                            <template x-for="rec in cat.recommendations" :key="rec.title">
                              <div class="recommendation">
                                <div class="recommendation-header">
                                  <span class="priority-badge" :class="priorityClass(rec.priority)" x-text="priorityLabel(rec.priority)"></span>
                                  <span class="recommendation-title" x-text="rec.title"></span>
                                  <template x-if="recHasUrls(rec)">
                                    <button class="btn-icon" @click.stop="toggleRecUrls(rec)"
                                      style="margin-left:.25rem;font-size:.72rem;padding:.15rem .4rem;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;gap:.25rem;color:var(--accent);background:rgba(91,174,35,.06);cursor:pointer">
                                      <i data-lucide="list" style="width:11px;height:11px"></i>
                                      <span x-text="recUrlsOpen[rec.title] ? 'Ocultar URLs' : 'Ver URLs'"></span>
                                    </button>
                                  </template>
                                  <span class="recommendation-count" x-text="rec.affected_count + ' URLs'" x-show="rec.affected_count > 0"></span>
                                </div>
                                <p class="recommendation-desc" x-text="rec.description"></p>

                                <!-- URL list expandable -->
                                <template x-if="recUrlsOpen[rec.title]">
                                  <div style="margin-top:.5rem;padding:.5rem .65rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;animation:fadeInUp .2s ease">
                                    <template x-if="recUrls[rec.title]?.loading">
                                      <div class="loading-overlay" style="padding:.35rem;justify-content:flex-start"><div class="spinner" style="width:14px;height:14px"></div> <span class="text-dim text-sm">Cargando URLs...</span></div>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length === 0">
                                      <p class="text-dim text-sm">No se encontraron URLs afectadas.</p>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length > 0">
                                      <div>
                                        <div style="display:flex;flex-direction:column;gap:.15rem;max-height:240px;overflow-y:auto">
                                          <template x-for="u in recUrls[rec.title].urls" :key="u.id">
                                            <div @click="openUrlDetail(u.id)" style="display:flex;align-items:center;gap:.5rem;padding:.25rem .4rem;border-radius:4px;cursor:pointer;font-size:.8rem;transition:background .15s" class="rec-url-row">
                                              <span class="exp-status" :class="expStatusClass(u.status_code)" x-text="u.status_code" style="font-size:.7rem;padding:.05rem .3rem"></span>
                                              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)" :title="u.url" x-text="u.url"></span>
                                            </div>
                                          </template>
                                        </div>
                                        <div style="margin-top:.4rem;display:flex;align-items:center;gap:.5rem;padding-top:.35rem;border-top:1px solid var(--border)">
                                          <span class="text-dim" style="font-size:.72rem" x-text="recUrls[rec.title].urls.length + ' de ' + rec.affected_count + ' URLs'"></span>
                                          <button class="btn btn-sm" @click.stop="openRecInExplorer(rec)" style="margin-left:auto;font-size:.7rem;padding:.2rem .5rem;display:flex;align-items:center;gap:.25rem">
                                            <i data-lucide="external-link" style="width:10px;height:10px"></i> Ver todas
                                          </button>
                                        </div>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="cat.recommendations.length === 0">
                          <p class="text-dim text-sm" style="padding:.5rem 0">Sin problemas detectados en esta categoria.</p>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

      </div>
    </template>


    <!-- ============================================================ -->
    <!--            VISTA: DETALLE COMPLETO DE UNA URL                -->
    <!-- ============================================================ -->
    <!-- ============================================================ -->
    <!--      VISTA: INFORME PARA EL CLIENTE (decision 138)            -->
    <!-- ============================================================ -->
    <template x-if="view === 'informe'">
      <div class="informe" data-testid="informe">
        <div class="informe-acciones no-print">
          <a class="btn btn-sm" x-show="!compartido" :href="'#/rastreos/' + (job && job.id)">
            <i data-lucide="arrow-left" style="width:13px;height:13px"></i> Volver al rastreo</a>
          <!-- Modo compartido (decision 143): elegir entre los censos del cliente. -->
          <template x-if="compartido && compartido.censos.length">
            <select @change="verInformeCompartido($event.target.value)" aria-label="Informe" style="width:auto;max-width:22rem" data-testid="informe-censos">
              <template x-for="c in compartido.censos" :key="c.id">
                <option :value="c.id" :selected="c.id === compartido.elegido" x-text="fmt.dia(c.fecha) + ' · ' + c.nombre"></option>
              </template>
            </select>
          </template>
          <button class="btn btn-sm btn-primary" @click="window.print()" :disabled="!informe">
            <i data-lucide="printer" style="width:13px;height:13px"></i> Imprimir o guardar como PDF</button>
        </div>
        <template x-if="informeCargando">
          <div class="loading-overlay"><div class="spinner"></div> Preparando el informe…</div>
        </template>
        <template x-if="compartido && compartido.error && !informe">
          <div class="card" style="margin-top:2rem" x-text="compartido.error"></div>
        </template>
        <template x-if="!informeCargando && informe">
          <article>
            <header class="informe-cabecera">
              <div class="text-dim text-sm" x-text="informe.cliente ? informe.cliente.nombre : 'Auditoría SEO técnica'"></div>
              <h1 x-text="informe.job.sitio"></h1>
              <div class="text-dim text-sm">
                Rastreo del <span x-text="fmt.date(informe.job.fecha)"></span>
                · <span x-text="fmt.num(informe.cifras.urls)"></span> URLs
                <span x-show="informe.job.modo_lista" x-text="'· lista de ' + fmt.num(informe.job.semillas) + ' URLs'"></span>
              </div>
            </header>

            <template x-if="informe.fiabilidad.length">
              <section class="informe-aviso" data-testid="informe-fiabilidad">
                <strong>Antes de leer las cifras</strong>
                <ul><template x-for="(t, i) in informe.fiabilidad" :key="i"><li x-text="t"></li></template></ul>
              </section>
            </template>

            <section class="informe-nota">
              <div class="informe-nota-global" :class="'nota-' + (informe.nota.global >= 80 ? 'buena' : informe.nota.global >= 50 ? 'media' : 'mala')">
                <div class="informe-nota-num" x-text="informe.nota.global"></div>
                <div class="text-sm">de 100</div>
              </div>
              <div>
                <h2>Estado del sitio</h2>
                <p x-show="informe.nota.tope" class="text-sm"
                   x-text="informe.nota.tope ? 'La media de las categorías sería ' + informe.nota.sin_tope + ', pero con ' + fmt.num(informe.nota.tope.paginas_con_error) + ' URLs con errores la nota no puede pasar de ' + informe.nota.tope.tope + '.' : ''"></p>
                <div class="informe-categorias">
                  <template x-for="c in informe.nota.categorias" :key="c.key">
                    <div><span x-text="c.nombre"></span> <strong x-text="c.nota"></strong></div>
                  </template>
                </div>
              </div>
            </section>

            <section>
              <h2>Cifras</h2>
              <div class="informe-cifras">
                <div><strong x-text="fmt.num(informe.cifras.paginas_html)"></strong><span>páginas HTML</span></div>
                <div><strong x-text="fmt.num(informe.cifras.indexables)"></strong><span>indexables</span></div>
                <div><strong x-text="fmt.num(informe.cifras.no_indexables)"></strong><span>no indexables</span></div>
                <div><strong x-text="fmt.num((informe.cifras.por_estado['4xx'] || 0) + (informe.cifras.por_estado['5xx'] || 0))"></strong><span>URLs rotas (4xx y 5xx)</span></div>
                <div><strong x-text="fmt.num(informe.cifras.por_estado['3xx'] || 0)"></strong><span>redirecciones</span></div>
              </div>
            </section>

            <template x-if="informe.comparacion && informe.comparacion.comparado_con">
              <section data-testid="informe-cambios">
                <h2>Qué ha cambiado desde el rastreo anterior</h2>
                <template x-if="informe.comparacion.alertas.length">
                  <ul class="informe-alertas">
                    <template x-for="(a, i) in informe.comparacion.alertas" :key="i">
                      <li :class="'sev-' + a.severidad">
                        <strong x-text="fmt.num(a.paginas) + ' de ' + fmt.num(a.de) + ' páginas (' + fmt.num(a.pct) + ' %)'"></strong>
                        — <span x-text="a.que_decide_google"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-for="(t, i) in informe.comparacion.reglas_cliente || []" :key="'r' + i">
                  <p class="text-sm" x-text="t"></p>
                </template>
                <p x-show="!informe.comparacion.alertas.length && !(informe.comparacion.reglas_cliente || []).length">
                  Ningún cambio grave frente al rastreo anterior.</p>
                <p x-show="informe.comparacion.incidencias" class="text-sm"
                   x-text="informe.comparacion.incidencias ? fmt.num(informe.comparacion.incidencias.nuevas) + ' incidencias nuevas' + (informe.comparacion.incidencias.resueltas != null ? ', ' + fmt.num(informe.comparacion.incidencias.resueltas) + ' resueltas' : '') + ' y ' + fmt.num(informe.comparacion.incidencias.siguen) + ' que siguen.' : ''"></p>
                <p x-show="informe.comparacion.incidencias_motivo" class="text-sm text-dim"
                   x-text="compartido ? 'En este informe las incidencias no se comparan una a una con el anterior.' : 'Las incidencias no se comparan: ' + (informe.comparacion.incidencias_motivo || '')"></p>
              </section>
            </template>

            <!-- Search Console (decision 142) -->
            <template x-if="informe.trafico">
              <section data-testid="informe-trafico">
                <h2>Tráfico de Google</h2>
                <p>Entre el <span x-text="fmt.dia(informe.trafico.desde)"></span> y el <span x-text="fmt.dia(informe.trafico.hasta)"></span>,
                  <strong x-text="fmt.num(informe.trafico.clics)"></strong> clics y
                  <strong x-text="fmt.num(informe.trafico.impresiones)"></strong> impresiones en Google.</p>
                <ul class="informe-alertas">
                  <li x-show="informe.trafico.trafico_en_pagina_perdida.paginas" class="sev-error">
                    <strong x-text="(n => fmt.num(n) + (n === 1 ? ' página con tráfico que hoy da error, tiene noindex o está bloqueada' : ' páginas con tráfico que hoy dan error, tienen noindex o están bloqueadas'))(informe.trafico.trafico_en_pagina_perdida.paginas)"></strong>
                    <span x-text="'(' + fmt.num(informe.trafico.trafico_en_pagina_perdida.clics) + ' clics en riesgo)'"></span></li>
                  <li x-show="informe.trafico.huerfana_con_trafico.paginas">
                    <span x-text="fmt.num(informe.trafico.huerfana_con_trafico.paginas) + (informe.trafico.huerfana_con_trafico.paginas === 1 ? ' página' : ' páginas') + ' con tráfico que ninguna otra página del sitio enlaza (' + fmt.num(informe.trafico.huerfana_con_trafico.clics) + ' clics)'"></span></li>
                  <li x-show="informe.trafico.trafico_en_variante_con_parametros.paginas">
                    <span x-text="fmt.num(informe.trafico.trafico_en_variante_con_parametros.paginas) + (informe.trafico.trafico_en_variante_con_parametros.paginas === 1 ? ' página cuyo tráfico se reparte' : ' páginas cuyo tráfico se reparte') + ' con variantes con parámetros (' + fmt.num(informe.trafico.trafico_en_variante_con_parametros.clics) + ' clics en las variantes)'"></span></li>
                  <template x-if="informe.trafico.inspeccion && informe.trafico.inspeccion.inspeccionadas">
                    <li x-text="'Google confirma indexadas ' + fmt.num(informe.trafico.inspeccion.indexadas) + ' de ' + fmt.num(informe.trafico.inspeccion.inspeccionadas) + ' páginas comprobadas una a una' + (informe.trafico.inspeccion.no_indexadas ? '; ' + fmt.num(informe.trafico.inspeccion.no_indexadas) + ' que deberían estarlo no lo están' : '') + (informe.trafico.inspeccion.canonical_distinto ? '; en ' + fmt.num(informe.trafico.inspeccion.canonical_distinto) + ' ha elegido otro canonical' : '') + (informe.trafico.inspeccion.canonical_antiguo ? '; en ' + fmt.num(informe.trafico.inspeccion.canonical_antiguo) + ' aún tiene un canonical que la página ya no declara' : '') + '.'"></li>
                  </template>
                  <li x-show="informe.trafico.urls_fuera_del_censo">
                    <span x-text="fmt.num(informe.trafico.urls_fuera_del_censo) + ' URLs con clics que el rastreo no encontró (' + fmt.num(informe.trafico.clics_fuera_del_censo) + ' clics)'"></span></li>
                </ul>
              </section>
            </template>

            <!-- Buscadores de IA (decisiones 129, 137 y 140) -->
            <template x-if="informe.ia">
              <section data-testid="informe-ia">
                <h2>Buscadores de IA</h2>
                <template x-if="informe.ia.bots.length">
                  <div class="informe-bots">
                    <template x-for="b in informe.ia.bots" :key="b.token">
                      <div>
                        <span x-text="b.proveedor + ' · ' + b.token"></span>
                        <span class="text-dim text-sm" x-text="b.tipo === 'busqueda_ia' ? '(búsqueda)' : '(entrenamiento)'"></span>
                        <strong :class="b.alcance === 'todo' ? (b.tipo === 'busqueda_ia' ? 'text-red' : '') : b.alcance === 'parte' ? 'text-orange' : ''"
                                x-text="({todo: 'bloqueado', parte: 'bloqueado en parte', nada: 'permitido'})[b.alcance] || 'sin evaluar'"></strong>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="text-sm text-dim" x-show="informe.ia.bots.length">Los de búsqueda deciden si el sitio puede salir en las respuestas de ChatGPT, Claude o Perplexity; bloquear los de entrenamiento no quita de ninguna búsqueda.</p>
                <ul class="informe-alertas">
                  <li x-show="informe.ia.nosnippet" class="sev-warning"
                      x-text="(n => fmt.num(n) + (n === 1 ? ' página indexable lleva' : ' páginas indexables llevan'))(informe.ia.nosnippet) + ' «nosnippet»: Google no las usa en AI Overviews ni enseña su texto en el resultado.'"></li>
                  <li x-show="informe.ia.data_nosnippet" class="sev-warning"
                      x-text="(n => fmt.num(n) + (n === 1 ? ' página indexable esconde' : ' páginas indexables esconden'))(informe.ia.data_nosnippet) + ' su H1 o la mayor parte de su contenido con «data-nosnippet»: ese texto no sale en el fragmento ni en AI Overviews.'"></li>
                  <li x-show="informe.ia.max_snippet"
                      x-text="fmt.num(informe.ia.max_snippet) + (informe.ia.max_snippet === 1 ? ' página limita' : ' páginas limitan') + ' su fragmento con «max-snippet»: la IA de Google solo puede citar ese trozo.'"></li>
                  <li x-show="informe.ia.solo_con_js.plantillas" class="sev-warning"
                      x-text="'En ' + informe.ia.solo_con_js.plantillas + (informe.ia.solo_con_js.plantillas === 1 ? ' plantilla' : ' plantillas') + ' (' + fmt.num(informe.ia.solo_con_js.paginas) + ' de ' + fmt.num(informe.ia.solo_con_js.muestreadas) + ' páginas comprobadas), parte del texto o de los enlaces solo aparece con JavaScript: los rastreadores de IA no lo ven.'"></li>
                </ul>
              </section>
            </template>

            <section data-testid="informe-prioridades">
              <h2>Qué arreglar primero</h2>
              <p class="text-sm text-dim">Ordenado por la gravedad y por lo importantes que son las páginas afectadas
                (su autoridad interna, a cuántos clics de la portada están, si el sitemap las declara y, con Search Console, los clics que reciben de Google).
                <span x-text="'Son los ' + informe.prioridades.length + ' primeros de ' + informe.tipos_de_incidencia + ' tipos de incidencia.'"></span></p>
              <ol class="informe-prioridades">
                <template x-for="r in informe.prioridades" :key="r.issue_type + r.severity">
                  <li>
                    <div class="informe-prio-cabecera">
                      <span class="sev-chip" :class="'sev-' + r.severity" x-text="fmt.severity(r.severity)"></span>
                      <strong x-text="fmt.issue(r.issue_type)"></strong>
                      <span class="text-dim text-sm" x-text="textoAlcanceInforme(r)"></span>
                    </div>
                    <template x-if="ISSUE_INFO[r.issue_type]">
                      <dl class="issue-explica">
                        <dt>Qué es</dt><dd x-text="ISSUE_INFO[r.issue_type].que"></dd>
                        <dt>Qué decide Google</dt><dd x-text="ISSUE_INFO[r.issue_type].google"></dd>
                        <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[r.issue_type].arreglo"></dd>
                      </dl>
                    </template>
                    <div class="text-sm" x-show="r.ejemplos.length">
                      <span class="text-dim">Ejemplos:</span>
                      <template x-for="(e, n) in r.ejemplos" :key="n"><div class="informe-url" x-text="e.url"></div></template>
                    </div>
                  </li>
                </template>
              </ol>
            </section>

            <footer class="informe-pie text-sm text-dim">
              Generado el <span x-text="fmt.date(informe.generado)"></span>
              <span x-show="informe.job.crawler_version" x-text="'· rastreo ' + informe.job.crawler_version"></span>
              <span x-show="informe.job.analisis_version" x-text="'· análisis ' + informe.job.analisis_version"></span>
              <span x-show="informe.job.render_js">· con JavaScript renderizado</span>
            </footer>
          </article>
        </template>
      </div>
    </template>

    <template x-if="view === 'url-detail'">
      <div>
        <!-- Cargando -->
        <template x-if="urlDetailLoading">
          <div class="loading-overlay"><div class="spinner"></div> Cargando datos de la URL...</div>
        </template>

        <template x-if="!urlDetailLoading && urlDetail">
          <div>
            <!-- Cabecera de URL -->
            <div class="url-header-card card mb-2">
              <div class="flex items-center justify-between" style="gap:.75rem;flex-wrap:wrap">
                <div style="flex:1;min-width:0">
                  <div class="flex items-center gap-1 mb-1">
                    <span class="badge" :class="{
                      'badge-completed': urlDetail.status_group === '2xx',
                      'badge-running': urlDetail.status_group === '3xx',
                      'badge-cancelled': urlDetail.status_group === '4xx',
                      'badge-failed': urlDetail.status_group === '5xx'
                    }" x-text="(urlDetail.status_code || '—') + ' ' + (urlDetail.status_text || '')"></span>
                    <span class="badge" :class="urlDetail.indexable ? 'badge-completed' : 'badge-cancelled'"
                      x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : 'No indexable')"></span>
                    <template x-if="urlDetail.is_internal !== null">
                      <span class="badge badge-pending" x-text="urlDetail.is_internal ? 'Interna' : 'Externa'"></span>
                    </template>
                  </div>
                  <!-- La URL se abre y se copia (revision de UX del 25-oct, 1.10). -->
                  <div class="url-full-display" style="display:flex;gap:.4rem;align-items:baseline">
                    <a :href="urlDetail.url" target="_blank" rel="noopener" x-text="urlDetail.url" :title="'Abrir ' + urlDetail.url" style="word-break:break-all"></a>
                    <button class="btn btn-sm" type="button" title="Copiar la URL" style="flex-shrink:0"
                            @click="navigator.clipboard ? navigator.clipboard.writeText(urlDetail.url).then(() => showToast('URL copiada')).catch(() => showToast('No se pudo copiar', 'error')) : showToast('El navegador no deja copiar aquí', 'error')">Copiar</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Veredicto (UX-17): las tres preguntas que se hacen al abrir una
                 URL —¿se indexa?, ¿que le pasa?, ¿le llegan enlaces?— arriba,
                 antes de los 30 campos. -->
            <div class="url-veredicto mb-2">
              <div class="card">
                <div class="veredicto-titulo">Indexabilidad</div>
                <div class="veredicto-valor" :class="urlDetail.indexable ? 'green' : (urlDetail.indexable === false ? 'orange' : '')"
                     x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : urlDetail.indexable === false ? 'No indexable' : 'Sin analizar')"></div>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.canonical_href && !urlDetail.indexable">
                  <div class="text-sm text-dim truncate" :title="urlDetail.html_meta.canonical_href"
                       x-text="'Canonical: ' + urlDetail.html_meta.canonical_href"></div>
                </template>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.meta_robots">
                  <div class="text-sm text-dim" x-text="'Meta robots: ' + urlDetail.html_meta.meta_robots"></div>
                </template>
                <template x-if="urlDetail.redirect_url">
                  <div class="text-sm text-dim truncate" :title="urlDetail.redirect_url" x-text="'Redirige a ' + urlDetail.redirect_url"></div>
                </template>
                <!-- La linea de robots.txt que la bloquea (decision 129): es lo
                     que hay que tocar, y sin ella habia que abrir el fichero y
                     repetir a mano la regla mas larga. -->
                <template x-if="urlDetail.robots_regla">
                  <div class="text-sm robots-regla">
                    <template x-for="lado in [['googlebot','Googlebot'],['rastreador','Nuestro rastreo']]" :key="lado[0]">
                      <template x-if="urlDetail.robots_regla[lado[0]]">
                        <div>
                          <span class="text-dim" x-text="lado[1] + ': línea ' + urlDetail.robots_regla[lado[0]].linea + ' de '"></span>
                          <a :href="urlDetail.robots_regla.robots_url" target="_blank" rel="noopener">robots.txt</a>
                          <code x-text="urlDetail.robots_regla[lado[0]].texto"></code>
                          <span class="text-dim" x-text="'(grupo «' + (urlDetail.robots_regla[lado[0]].grupo || '*') + '», línea ' + (urlDetail.robots_regla[lado[0]].linea_grupo ?? '—') + ')'"></span>
                        </div>
                      </template>
                    </template>
                  </div>
                </template>
                <div class="text-sm text-dim" x-text="urlDetail.in_sitemap ? 'En el sitemap' : 'No está en el sitemap'"></div>
                <!-- De qué fichero(s) de sitemap viene y con qué lastmod (decisión 126) -->
                <template x-for="(sm, n) in (urlDetail.sitemaps || [])" :key="'sm' + n">
                  <div class="text-sm text-dim truncate" :title="sm.fichero + ((sm.hreflang || []).length ? '\n' + sm.hreflang.map(h => h[0] + ' → ' + h[1]).join('\n') : '')"
                       x-text="'Sitemap: ' + sm.fichero + (sm.lastmod ? ' · lastmod ' + sm.lastmod : ' · sin lastmod') + ((sm.hreflang || []).length ? ' · hreflang: ' + sm.hreflang.map(h => h[0]).join(', ') : '')"></div>
                </template>
                <!-- La entidad de WordPress que es esta URL (decisión 168) -->
                <template x-for="(w, n) in (urlDetail.wordpress || [])" :key="'wp' + n">
                  <div class="text-sm text-dim" data-testid="url-wordpress" x-text="'WordPress: ' + textoEntidadWp(w)"></div>
                </template>
              </div>
              <!-- Un tipo por fila, con cuantas veces y si es de plantilla
                   (revision de UX del 25-oct, 2.7; V27): antes el mismo tipo
