                   salia repetido hasta llenar las cinco filas. -->
              <div class="card">
                <div class="veredicto-titulo">
                  Problemas
                  <a href="#" class="text-sm" style="margin-left:auto" x-show="urlProblemas.length"
                     @click.prevent="urlDetailTab = 'issues'">ver qué le pasa</a>
                </div>
                <template x-if="!urlProblemas.length">
                  <div class="veredicto-valor green">Ninguno</div>
                </template>
                <ul class="veredicto-lista">
                  <template x-for="g in urlProblemas.slice(0, 5)" :key="g.tipo">
                    <li>
                      <span class="sev-chip" :class="'sev-' + g.severity" x-text="fmt.severity(g.severity)"></span>
                      <span class="url-problema-nombre">
                        <span x-text="fmt.issue(g.tipo)"></span><span class="text-dim" x-show="g.n > 1" x-text="' × ' + g.n"></span>
                        <span class="chip-alcance" x-show="g.alcance === 'plantilla' || g.alcance === 'servidor'"
                              x-text="g.alcance === 'servidor' ? 'del servidor' : 'de plantilla'"></span>
                      </span>
                    </li>
                  </template>
                </ul>
                <div class="text-sm text-dim" x-show="urlProblemas.length > 5"
                     x-text="'y ' + (urlProblemas.length - 5) + (urlProblemas.length - 5 === 1 ? ' tipo más' : ' tipos más')"></div>
              </div>
              <!-- Google (90 dias) (revision de UX del 25-oct, 2.7; V28): lo que
                   Search Console dice de esta URL. Sin datos, una frase que dice
                   por que; nunca ceros que parezcan datos. -->
              <template x-for="g in [googleDeUrl()].filter(Boolean)" :key="'google'">
                <div class="card url-google">
                  <div class="veredicto-titulo">
                    Google (90 días)
                    <span class="text-sm" style="margin-left:auto;text-transform:none;letter-spacing:0" x-show="g.ventana" x-text="g.ventana"></span>
                  </div>
                  <template x-if="g.cifras">
                    <div class="url-google-cifras">
                      <div><strong x-text="fmt.num(g.cifras.clics)"></strong><span class="text-sm text-dim">clics</span></div>
                      <div><strong x-text="fmt.num(g.cifras.impresiones)"></strong><span class="text-sm text-dim">impresiones</span></div>
                      <div x-show="g.cifras.posicion != null"><strong x-text="fmt.num(g.cifras.posicion)"></strong><span class="text-sm text-dim">posición media</span></div>
                    </div>
                  </template>
                  <div class="text-sm" x-show="g.frase" x-text="g.frase"></div>
                  <div class="text-sm text-dim" x-show="g.parcial" x-text="g.parcial"></div>
                  <template x-if="g.canonical">
                    <div class="text-sm url-google-canonical">
                      <span class="text-dim">Canonical que elige Google:</span>
                      <a :href="g.canonical" target="_blank" rel="noopener" x-text="g.canonical"></a>
                    </div>
                  </template>
                  <div class="text-sm text-dim" x-show="g.canonicalFrase" x-text="g.canonicalFrase"></div>
                  <template x-if="g.inspeccion && g.inspeccion.fecha">
                    <div class="text-sm text-dim"
                         x-text="'Según la inspección de Google del ' + fmt.diaCorto(g.inspeccion.fecha) + (g.inspeccion.visita ? ' (su última visita: ' + fmt.diaCorto(g.inspeccion.visita) + ')' : '') + (g.inspeccion.cobertura ? ': ' + g.inspeccion.cobertura.charAt(0).toLowerCase() + g.inspeccion.cobertura.slice(1) + '.' : '.')"></div>
                  </template>
                </div>
              </template>
              <!-- Capturas de pantalla por muestra de plantilla (decisión 173):
                   la primera pantalla con el dispositivo del censo y, si se
                   pidió, con el otro. Solo las URLs muestreadas tienen. -->
              <template x-if="(urlDetail.capturas_pantalla || []).length">
                <div class="card" data-testid="url-capturas">
                  <div class="veredicto-titulo">Captura de pantalla</div>
                  <div style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-start">
                    <template x-for="c in urlDetail.capturas_pantalla" :key="c.perfil">
                      <figure style="margin:0;max-width:100%">
                        <a :href="c.src" target="_blank" rel="noopener">
                          <img :src="c.src" loading="lazy" :alt="'Captura ' + c.perfil"
                               :style="'display:block;max-width:100%;border:1px solid var(--border);border-radius:4px;width:' + (c.perfil === 'movil' ? '206px' : '420px')">
                        </a>
                        <figcaption class="text-sm text-dim"
                                    :title="c.user_agent || ''"
                                    x-text="(c.perfil === 'movil' ? 'Móvil' : 'Escritorio') + (c.ancho ? ' · ' + c.ancho + '×' + c.alto : '') + (c.plantilla ? ' · plantilla ' + c.plantilla : '') + (c.url_final ? ' · acabó en ' + c.url_final : '')"></figcaption>
                      </figure>
                    </template>
                  </div>
                </div>
              </template>
              <!-- Extraccion a medida (decision 104): lo que dieron las reglas
                   en esta URL. «No evaluada» no es «vacío». -->
              <template x-if="expAMedida.length">
                <div class="card">
                  <div class="veredicto-titulo">Extracción a medida</div>
                  <ul class="veredicto-lista">
                    <template x-for="d in expAMedida" :key="d.key">
                      <li>
                        <strong x-text="d.etiqueta + ': '"></strong>
                        <span x-text="EXP_COLUMN_DEFS[d.key].tip(urlDetail)"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <div class="card">
                <div class="veredicto-titulo">Enlazado interno</div>
                <!-- NULL no siempre es «sin camino»: en un censo analizado antes
                     de la decision 90 la columna no se calculo. -->
                <div class="veredicto-valor" x-text="urlDetail.click_depth != null ? (urlDetail.click_depth === 0 ? 'Es una portada' : 'A ' + urlDetail.click_depth + (urlDetail.click_depth === 1 ? ' clic' : ' clics') + ' de la home') : (stats && stats.click_depth_calculada ? 'Sin camino desde la home' : 'Profundidad sin calcular')"
                     :class="urlDetail.click_depth == null && urlDetail.indexable && stats && stats.click_depth_calculada ? 'orange' : ''"></div>
                <div class="text-sm text-dim" x-show="urlDetail.click_depth == null && !(stats && stats.click_depth_calculada)">
                  Este censo se analizó antes de medir los clics desde la home: hay que volver a analizarlo.</div>
                <div class="text-sm text-dim"
                     x-text="(n => fmt.num(n) + (n === 1 ? ' página la enlaza · ' : ' páginas la enlazan · '))(urlDetail.unique_inlinks_count ?? urlDetail.inlinks_count) + fmt.num(urlDetail.inlinks_count) + (urlDetail.inlinks_count === 1 ? ' enlace entrante' : ' enlaces entrantes')"></div>
                <div class="text-sm text-dim" x-show="urlDetail.pagerank_score != null"
                     x-text="'PageRank ' + urlDetail.pagerank_score + ' de 100'"></div>
              </div>
            </div>

            <!-- Mini stats de la URL -->
            <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.ms(urlDetail.response_time_ms)"></div>
                <div class="stat-label">Tiempo</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.bytes(urlDetail.transfer_size || urlDetail.content_length)"></div>
                <div class="stat-label">Tamaño</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.word_count)"></div>
                <div class="stat-label">Palabras</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.inlinks_count)"></div>
                <div class="stat-label">Inlinks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.outlinks_count)"></div>
                <div class="stat-label">Outlinks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem;color:var(--accent)" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : (urlDetail.pagerank != null ? urlDetail.pagerank.toFixed(2) : '—')"></div>
                <div class="stat-label" data-tip="Importancia de esta página según los enlaces internos que recibe, en escala 0-100 logaritmica anclada al máximo del sitio: cada 25 puntos son diez veces menos autoridad que la página mas fuerte.">PageRank (0-100)</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" :class="urlProblemas.length > 0 ? 'orange' : 'green'"
                  x-text="urlProblemas.length"></div>
                <div class="stat-label">Tipos de problema</div>
              </div>
            </div>

            <!-- Pestanas del detalle de URL -->
            <div class="tabs">
              <button type="button" class="tab" :class="urlDetailTab === 'seo' && 'active'" @click="urlDetailTab = 'seo'">SEO</button>
              <button type="button" class="tab" :class="urlDetailTab === 'content' && 'active'" @click="urlDetailTab = 'content'">
                Contenido <span class="count" x-text="urlDetail.page_content ? fmt.num(urlDetail.page_content.content_length) : '—'"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'headings' && 'active'" @click="urlDetailTab = 'headings'">
                Encabezados <span class="count" x-text="urlDetail.headings?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'links' && 'active'" @click="urlDetailTab = 'links'">
                <!-- Filas de la respuesta, con «+» si alguna lista llego al tope de 200

                     (apariciones, solo internos), revision de la 1.10. -->
                Enlaces <span class="count" x-text="fmt.num((urlDetail.inlinks?.length || 0) + (urlDetail.outlinks?.length || 0)) + (((urlDetail.inlinks?.length || 0) >= 200 || (urlDetail.outlinks?.length || 0) >= 200) ? '+' : '')"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'resources' && 'active'" @click="urlDetailTab = 'resources'">
                Recursos <span class="count" x-text="urlDetail.resources?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'issues' && 'active'" @click="urlDetailTab = 'issues'">
                Problemas <span class="count" x-text="urlProblemas.length"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'general' && 'active'" @click="urlDetailTab = 'general'">Todos los campos</button>
              <button type="button" class="tab" :class="urlDetailTab === 'security' && 'active'" @click="urlDetailTab = 'security'">Seguridad</button>
              <button type="button" class="tab" :class="urlDetailTab === 'structured' && 'active'" @click="urlDetailTab = 'structured'">
                Datos estr. <span class="count" x-text="urlDetail.structured_data?.length || 0"></span>
              </button>
            </div>

            <!-- ===== TAB: GENERAL ===== -->
            <template x-if="urlDetailTab === 'general'">
              <div class="card">
                <div class="detail-grid">
                  <div class="detail-row"><span class="detail-label">URL</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.url"></span></div>
                  <div class="detail-row"><span class="detail-label">Host</span><span class="detail-value" x-text="urlDetail.host || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Path</span><span class="detail-value" x-text="urlDetail.path || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Scheme</span><span class="detail-value" x-text="urlDetail.scheme || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Interna</span><span class="detail-value" x-text="urlDetail.is_internal ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Clics desde la home</span><span class="detail-value" x-text="urlDetail.click_depth ?? 'sin camino desde la home'"></span></div>
                  <div class="detail-row"><span class="detail-label">Prof. de rastreo</span><span class="detail-value text-dim" x-text="urlDetail.crawl_depth ?? '—'" title="Saltos del rastreador desde la semilla mas cercana (cada semilla es 0, lo del sitemap 1). Es la que limita max_depth, no la que mide Google"></span></div>
                  <div class="detail-row"><span class="detail-label">Código estado</span><span class="detail-value" x-text="(urlDetail.status_code || '—') + ' ' + (urlDetail.status_text || '')"></span></div>
                  <div class="detail-row"><span class="detail-label">Grupo estado</span><span class="detail-value" x-text="urlDetail.status_group || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Content-Type</span><span class="detail-value" x-text="urlDetail.content_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño contenido</span><span class="detail-value" x-text="fmt.bytes(urlDetail.content_length)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño transferencia</span><span class="detail-value" x-text="fmt.bytes(urlDetail.transfer_size)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tiempo respuesta</span><span class="detail-value" x-text="fmt.ms(urlDetail.response_time_ms)"></span></div>
                  <div class="detail-row"><span class="detail-label">Version HTTP</span><span class="detail-value" x-text="urlDetail.http_version || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Es HTML</span><span class="detail-value" x-text="urlDetail.is_html ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tipo recurso</span><span class="detail-value" x-text="urlDetail.resource_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Indexable</span><span class="detail-value" x-text="urlDetail.indexable ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Estado indexabilidad</span><span class="detail-value" x-text="urlDetail.indexability_status || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Respuesta</span><span class="detail-value" :class="['challenge_waf','captcha','rate_limited','respuesta_binaria'].includes(urlDetail.response_class) && 'orange'" x-text="fmt.claseRespuesta(urlDetail.response_class)" title="Si lo que llegó era la página o un muro delante (desafío de un WAF, captcha, límite de peticiones, cuerpo binario). Decisión 103"></span></div>
                  <div class="detail-row"><span class="detail-label">Longitud URL</span><span class="detail-value" x-text="urlDetail.url_length || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Prof. carpetas</span><span class="detail-value" x-text="urlDetail.folder_depth ?? '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Palabras</span><span class="detail-value" x-text="fmt.num(urlDetail.word_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Ratio texto</span><span class="detail-value" x-text="urlDetail.text_ratio != null ? urlDetail.text_ratio.toFixed(1) + '%' : '—'"></span></div>

                  <div class="detail-row"><span class="detail-label">Last-Modified</span><span class="detail-value" x-text="urlDetail.last_modified || '—'"></span></div>

                  <div class="detail-row"><span class="detail-label">Inlinks únicos</span><span class="detail-value" x-text="fmt.num(urlDetail.unique_inlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks</span><span class="detail-value" x-text="fmt.num(urlDetail.outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks externos</span><span class="detail-value" x-text="fmt.num(urlDetail.external_outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="Escala 0-100 logaritmica anclada al máximo del sitio. Es la que hay que leer y ordenar.">PageRank (0-100)</span><span class="detail-value" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : '—'"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="La escala 0-10 de siempre, aquí solo por compatibilidad con los informes ya entregados.">PageRank (0-10, antiguo)</span><span class="detail-value text-dim" x-text="urlDetail.pagerank != null ? urlDetail.pagerank.toFixed(2) : '—'"></span></div>

                </div>
              </div>
            </template>

            <!-- ===== TAB: SEO ===== -->
            <template x-if="urlDetailTab === 'seo'">
              <div>
                <template x-if="!urlDetail.html_meta">
                  <div class="empty"><h3>Sin metadatos HTML</h3><p class="text-dim">Esta URL no es HTML o no se pudieron extraer los metadatos</p></div>
                </template>

                <template x-if="urlDetail.html_meta">
                  <div class="seo-sections">
                    <!-- Title -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Title</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.title || '(vacio)'"></div>
                      <div class="seo-meta-row mt-1">
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_pixel_width || 0) + 'px SERP'"></span>
                        <template x-if="urlDetail.html_meta.title_len > 60">
                          <span class="badge badge-cancelled">Demasiado largo</span>
                        </template>
                        <template x-if="urlDetail.html_meta.title_len && urlDetail.html_meta.title_len < 30">
                          <span class="badge badge-cancelled">Demasiado corto</span>
                        </template>
                      </div>
                    </div>

                    <!-- Meta Description -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Meta Description</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.meta_description || '(vacio)'"></div>

                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_pixel_width || 0) + 'px SERP'"></span>
                      </div>
                    </div>

                    <template x-if="urlDetail.html_meta.meta_keywords">
                      <div class="card mb-2">
                        <h3 class="seo-section-title">Meta Keywords</h3>

                        <div class="detail-row"><span class="detail-label">X-Robots-Tag</span><span class="detail-value" x-text="urlDetail.html_meta.x_robots_tag || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.canonical_href || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical (header)</span><span class="detail-value" x-text="urlDetail.html_meta.canonical_header || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Meta Refresh</span><span class="detail-value" x-text="urlDetail.html_meta.meta_refresh || '—'"></span></div>

                        <div class="detail-row"><span class="detail-label">rel=next</span><span class="detail-value" x-text="urlDetail.html_meta.rel_next || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">rel=prev</span><span class="detail-value" x-text="urlDetail.html_meta.rel_prev || '—'"></span></div>
                      </div>

                    <div class="card mb-2">
                      <h3 class="seo-section-title">Open Graph</h3>
                      <div class="detail-grid" style="grid-template-columns:1fr 1fr">
                        <div class="detail-row"><span class="detail-label">og:title</span><span class="detail-value" x-text="urlDetail.html_meta.og_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:description</span><span class="detail-value" x-text="urlDetail.html_meta.og_description || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:image</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.og_image || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:url</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.og_url || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:type</span><span class="detail-value" x-text="urlDetail.html_meta.og_type || '—'"></span></div>
                      </div>

                    <!-- Twitter Cards -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Twitter Cards</h3>
                      <div class="detail-grid" style="grid-template-columns:1fr 1fr">
                        <div class="detail-row"><span class="detail-label">twitter:card</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_card || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:title</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:description</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_description || '—'"></span></div>

                    </div>

            </template>

            <!-- ===== TAB: CONTENIDO ===== -->
            <template x-if="urlDetailTab === 'content'">
              <div class="card">
                <template x-if="urlDetail.page_content">
                  <div>

                      <h3 class="seo-section-title" style="margin:0">Contenido principal extraido</h3>
                      <div class="flex items-center gap-1">
                        <span class="badge badge-pending" x-text="fmt.num(urlDetail.page_content.content_length) + ' caracteres'"></span>

                      </div>

                    <template x-if="contentViewMode === 'markdown' && urlDetail.page_content.content_markdown">

                      <div class="content-preview" style="max-height:600px" x-text="urlDetail.page_content.content_text"></div>

                  </div>
                </template>
                <template x-if="!urlDetail.page_content">
                  <div class="empty">
                    <h3>Sin contenido</h3>
                    <p class="text-dim">No se pudo extraer el contenido principal de esta página</p>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: ENCABEZADOS ===== -->
            <template x-if="urlDetailTab === 'headings'">
              <div class="card">
                <template x-if="urlDetail.headings && urlDetail.headings.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Jerarquía de encabezados</h3>
                      <span class="text-dim text-sm" x-text="urlDetail.headings.length + ' encabezados'"></span>
                    </div>

                      <template x-for="h in urlDetail.headings" :key="h.id">
                        <div class="heading-item" :style="'padding-left:' + headingIndent(h.tag) + 'rem'">
                          <span class="heading-tag" :style="'color:' + headingColor(h.tag)" x-text="h.tag.toUpperCase()"></span>

                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.headings || urlDetail.headings.length === 0">
                  <div class="empty"><h3>Sin encabezados</h3></div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: ENLACES ===== -->
            <template x-if="urlDetailTab === 'links'">
              <div>
                <!-- Outlinks -->
                <div class="card mb-2">
                  <div class="card-header">
                    <h2>Outlinks (enlaces salientes)</h2>
                    <span class="badge badge-pending"
                          x-text="fmt.num(urlDetail.outlinks?.length || 0) + ((urlDetail.outlinks?.length || 0) >= 200 ? ' primeras filas: hay más' : ' filas')"></span>
                  </div>
                  <template x-if="urlDetail.outlinks && urlDetail.outlinks.length > 0">
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>URL Destino</th>
                            <th>Texto ancla</th>
                            <th>Posición</th>
                            <th>Tipo</th>
                            <th>Follow</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="l in urlDetail.outlinks" :key="l.id">
                            <tr>
                              <td style="max-width:350px" :title="l.to_url"><div class="truncate" x-text="l.to_url"></div></td>
                              <td style="max-width:200px" :title="l.anchor_text || ''"><div class="truncate" x-text="l.anchor_text || '—'"></div></td>
                              <td x-text="fmt.position(l.link_position)"></td>
                              <td x-text="l.link_type || '—'"></td>
                              <td :class="l.follow === false ? 'severity-warning' : ''" x-text="l.follow ? 'Sí' : l.follow === false ? 'No' : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!urlDetail.outlinks || urlDetail.outlinks.length === 0">
                    <div class="text-dim text-sm" style="padding:.5rem 0">Sin outlinks</div>
                  </template>
                </div>

                <!-- Inlinks -->
                <div class="card">
                  <div class="card-header">
                    <h2>Inlinks (enlaces entrantes)</h2>
                    <!-- La API manda como mucho 200: se dice de cuantos, y no se llama
                         huerfana a una pagina con enlaces que no vinieron (1.10). -->
                    <span class="badge badge-pending"
                          x-text="fmt.num(urlDetail.inlinks?.length || 0) + ((urlDetail.inlinks?.length || 0) >= 200 ? ' primeras filas: hay más' : ' filas')"></span>
                  </div>
                  <div class="text-sm text-dim" style="margin-bottom:.5rem" x-show="(urlDetail.inlinks?.length || 0) >= 200"
                       x-text="'La ficha trae como mucho 200 filas. El análisis cuenta ' + fmt.num(urlDetail.inlinks_count || 0) + ' enlaces internos que llegan aquí (por aparición). La lista entera: pestaña URLs › CSV › Enlaces que apuntan a estas URLs.'"></div>
                  <template x-if="urlDetail.inlinks && urlDetail.inlinks.length > 0">
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>URL origen</th>
                            <th>Texto ancla</th>
                            <th>Posición</th>
                            <th>Tipo</th>
                            <th>Follow</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="l in urlDetail.inlinks" :key="l.id">
                            <tr>
                              <td style="max-width:350px" :title="l.from_url || ''"><div class="truncate">
                                <a x-show="l.from_url_id" :href="'#/rastreos/' + job.id + '/url/' + l.from_url_id" x-text="l.from_url || '—'"></a>
                                <span x-show="!l.from_url_id" x-text="l.from_url || '—'"></span></div></td>
                              <td style="max-width:200px" :title="l.anchor_text || ''"><div class="truncate" x-text="l.anchor_text || '—'"></div></td>
                              <td x-text="fmt.position(l.link_position)"></td>
                              <td x-text="l.link_type || '—'"></td>
                              <td :class="l.follow === false ? 'severity-warning' : ''" x-text="l.follow ? 'Sí' : l.follow === false ? 'No' : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!urlDetail.inlinks || urlDetail.inlinks.length === 0">
                    <div class="text-dim text-sm" style="padding:.5rem 0"
                         x-text="urlDetail.inlinks_count === 0 ? 'Sin enlaces entrantes internos.' : (urlDetail.inlinks_count ? 'No se han podido leer sus enlaces entrantes (el análisis cuenta ' + fmt.num(urlDetail.inlinks_count) + ').' : 'Sin enlaces entrantes en la respuesta.')"></div>
                  </template>
                </div>
              </div>
            </template>

            <!-- ===== TAB: RECURSOS ===== -->
            <template x-if="urlDetailTab === 'resources'">
              <div class="card">
                <template x-if="urlDetail.resources && urlDetail.resources.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Recursos de la página</h3>
                      <span class="text-dim text-sm" x-text="urlDetail.resources.length + ' recursos'"></span>
                    </div>
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Tipo</th>
                            <th>URL</th>
                            <th>Alt</th>
                            <th>Dimensiones</th>
                            <th>Mixto</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="r in urlDetail.resources" :key="r.id">
                            <tr>
                              <td><span class="badge badge-pending" x-text="r.resource_type"></span></td>
                              <td style="max-width:400px" :title="r.resource_url"><div class="truncate" x-text="r.resource_url"></div></td>
                              <td style="max-width:150px" :title="r.alt_text || ''"><div class="truncate" x-text="r.alt_text || '—'"></div></td>
                              <td x-text="r.width && r.height ? r.width + 'x' + r.height : '—'"></td>
                              <td :class="r.is_mixed_content ? 'severity-error' : ''" x-text="r.is_mixed_content ? 'Si' : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.resources || urlDetail.resources.length === 0">
                  <div class="empty"><h3>Sin recursos</h3><p class="text-dim">No se encontraron imagenes, CSS, JS u otros recursos en esta página</p></div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: PROBLEMAS ===== -->
            <template x-if="urlDetailTab === 'issues'">
              <!-- Que le pasa a la URL, un bloque por tipo (revision de UX del
                   25-oct, 2.7; V27): que es, el detalle legible y sin repetir,
                   que decide Google, como se arregla, si es de plantilla y el
                   enlace a las demas paginas con el mismo problema. -->
              <div class="card">
                <template x-if="urlProblemas.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2" style="flex-wrap:wrap;gap:.25rem .75rem">
                      <h3 class="seo-section-title" style="margin:0">Qué le pasa a esta página</h3>
                      <span class="text-dim text-sm"
                            x-text="fmt.num(urlProblemas.length) + (urlProblemas.length === 1 ? ' tipo de problema' : ' tipos de problema') + ((urlDetail.issues || []).length !== urlProblemas.length ? ' · ' + fmt.num(urlDetail.issues.length) + ' avisos' : '')"></span>
                    </div>
                    <div class="issues-list">
                      <template x-for="g in urlProblemas" :key="g.tipo">
                        <div class="issue-item url-problema" :class="'issue-' + g.severity" x-data="{ todos: false }">
                          <div class="issue-header" style="flex-wrap:wrap">
                            <span class="sev-chip" :class="'sev-' + g.severity" x-text="fmt.severity(g.severity)"></span>
                            <strong x-text="fmt.issue(g.tipo)"></strong>
                            <span class="text-dim text-sm" x-show="g.n > 1" x-text="g.n + ' veces'"></span>
                            <span class="chip-alcance" x-show="g.alcance"
                                  x-text="g.alcance === 'servidor' ? 'es del servidor: se arregla una vez' : g.alcance === 'plantilla' ? 'es de plantilla: se arregla una vez' : 'en parte de plantilla'"></span>
                          </div>
                          <p class="text-sm" x-show="(ISSUE_INFO[g.tipo] || {}).que" x-text="(ISSUE_INFO[g.tipo] || {}).que"></p>
                          <p class="text-sm text-dim" x-show="g.paginasAfectadas > 1"
                             x-text="(g.alcance === 'servidor' ? 'Lo da el servidor en ' : 'Se repite en ') + (g.n > 1 ? 'hasta ' : '') + fmt.num(g.paginasAfectadas) + ' páginas del censo; se anota una vez, en una página de ejemplo como esta.'"></p>
                          <template x-if="g.detalles.length">
                            <ul class="url-problema-detalles">
                              <template x-for="(d, n) in (todos ? g.detalles : g.detalles.slice(0, 6))" :key="n">
                                <li><span x-text="d.texto"></span><span class="text-dim" x-show="d.n > 1" x-text="' (× ' + d.n + ')'"></span></li>
                              </template>
                              <template x-if="g.detalles.length > 6 && !todos">
                                <li style="list-style:none"><a href="#" @click.prevent="todos = true" x-text="'Ver los ' + (g.detalles.length - 6) + ' restantes'"></a></li>
                              </template>
                            </ul>
                          </template>
                          <template x-if="ISSUE_INFO[g.tipo]">
                            <dl class="issue-explica text-sm">
                              <dt>Qué decide Google</dt><dd x-text="ISSUE_INFO[g.tipo].google"></dd>
                              <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[g.tipo].arreglo"></dd>
                            </dl>
                          </template>
                          <div class="text-sm" style="margin-top:.35rem">
                            <template x-if="textoVerPaginasTipo(g).startsWith('Solo')">
                              <span class="text-dim" x-text="textoVerPaginasTipo(g)"></span>
                            </template>
                            <template x-if="!textoVerPaginasTipo(g).startsWith('Solo')">
                              <a :href="'#/rastreos/' + job.id + '/explorador?problema=' + encodeURIComponent(g.tipo)"
                                 :title="g.alcance === 'plantilla' || g.alcance === 'servidor' ? 'Un hallazgo de plantilla o de servidor se anota una vez, en una página de ejemplo; afecta a muchas más' : ''"
                                 x-text="textoVerPaginasTipo(g) + ' →'"></a>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="urlProblemas.length === 0">
                  <div class="empty">
                    <div style="font-size:2rem;margin-bottom:.5rem">&#10003;</div>
                    <h3 style="color:var(--green)">Sin problemas</h3>
                    <p class="text-dim">No se detectaron problemas SEO en esta página</p>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: SEGURIDAD ===== -->
            <template x-if="urlDetailTab === 'security'">
              <div class="card">
                <template x-if="urlDetail.security">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Cabeceras de seguridad</h3>
                      <template x-if="securityScore()">
                        <span class="badge" :class="securityScore().pct >= 70 ? 'badge-completed' : securityScore().pct >= 40 ? 'badge-cancelled' : 'badge-failed'"
                          x-text="securityScore().score + '/' + securityScore().total + ' (' + securityScore().pct + '%)'"></span>
                      </template>
                    </div>
                    <div class="security-checks">
                      <div class="security-item" :class="urlDetail.security.is_https ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.is_https ? '&#10003;' : '&#10007;'"></span>
                        <span>HTTPS</span>
                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_mixed_content ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_mixed_content ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin contenido mixto</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_hsts ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_hsts ? '&#10003;' : '&#10007;'"></span>
                        <span>Strict-Transport-Security (HSTS)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_csp ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_csp ? '&#10003;' : '&#10007;'"></span>
                        <span>Content-Security-Policy (CSP)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_content_type_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_content_type_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Content-Type-Options</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_frame_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_frame_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Frame-Options</span>
                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_unsafe_crossorigin ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_unsafe_crossorigin ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin crossorigin inseguro</span>
                      </div>
                      <template x-if="urlDetail.security.referrer_policy">
                        <div class="security-item check-pass">
                          <span class="check-icon">&#10003;</span>
                          <span>Referrer-Policy: <strong x-text="urlDetail.security.referrer_policy"></strong></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.security">
                  <div class="empty"><h3>Sin datos de seguridad</h3></div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: DATOS ESTRUCTURADOS ===== -->
            <template x-if="urlDetailTab === 'structured'">
              <div class="card">
                <template x-if="urlDetail.structured_data && urlDetail.structured_data.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Datos estructurados</h3>
                      <span class="text-dim text-sm" x-text="urlDetail.structured_data.length + ' bloques'"></span>
                    </div>
                    <div class="structured-list">
                      <template x-for="s in urlDetail.structured_data" :key="s.id">
                        <div class="structured-item card mb-1" style="padding:.75rem">
                          <div class="flex items-center gap-1 mb-1">
                            <span class="badge badge-pending" x-text="s.format"></span>
                            <span class="badge" :class="({ok: 'badge-completed', error: 'badge-failed', warning: 'badge-cancelled', info: 'badge-info'})[s.validation_status] || 'badge-pending'"
                              x-text="s.validation_status || '—'"></span>
                            <template x-if="s.schema_type">
                              <span style="font-weight:500" x-text="s.schema_type"></span>
                            </template>
                          </div>
                          <template x-if="s.raw">
                            <div class="content-preview" style="max-height:200px;font-size:.75rem" x-text="JSON.stringify(s.raw, null, 2)"></div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.structured_data || urlDetail.structured_data.length === 0">
                  <div class="empty"><h3>Sin datos estructurados</h3><p class="text-dim">No se encontraron JSON-LD, Microdata ni RDFa en esta página</p></div>
                </template>
              </div>
            </template>

          </div>
        </template>
      </div>
    </template>


    <!-- ============================================================ -->
    <!--                  VISTA: EXPLORER (Screaming Frog)            -->
    <!-- ============================================================ -->
    <template x-if="view === 'explorer' && job">
      <div class="explorer" x-init="$nextTick(() => ajustarAltoExplorador())">

        <!-- Sidebar -->
        <div class="exp-sidebar">
          <!-- Vistas guardadas del cliente (#131) -->
          <template x-if="job.cliente_id">
            <div class="exp-vistas">
              <div class="exp-sidebar-titulo" style="border-top:0;margin-top:0">Vistas de <span x-text="job.cliente_nombre || 'este cliente'"></span></div>
              <template x-for="v in expVistas" :key="v.id">
                <div class="exp-vista">
                  <button type="button" class="exp-tab" @click="abrirVista(v)" :title="v.nombre">
                    <i data-lucide="bookmark" class="exp-tab-icon"></i><span class="truncate" x-text="v.nombre"></span>
                  </button>
                  <button type="button" class="exp-vista-borrar" @click="borrarVista(v)" :aria-label="'Borrar la vista ' + v.nombre" title="Borrar">&times;</button>
                </div>
              </template>
              <button type="button" class="exp-tab exp-vista-nueva" @click="guardarVista()">
                <i data-lucide="bookmark-plus" class="exp-tab-icon"></i><span>Guardar esta vista</span>
              </button>
            </div>
          </template>
          <div class="exp-sidebar-group">
            <template x-for="tab in EXP_TABS" :key="tab.key">
              <div>
                <template x-if="tab.divider">
                  <div class="exp-divider"></div>
                </template>
                <template x-if="tab.header">
                  <div class="exp-sidebar-titulo" x-text="tab.header"></div>
                </template>
                <template x-if="!tab.divider && !tab.header && (!tab.requiere || expAMedida.length)">
                  <button type="button" class="exp-tab" :class="expTab === tab.key && !expWp && 'active'" @click="setExplorerTab(tab.key)">
                    <i :data-lucide="tab.icon" class="exp-tab-icon"></i>
                    <span x-text="tab.label"></span>
                    <template x-if="!tab.ambito">
                      <span class="exp-tab-badge" x-text="expBadgeCounts[tab.key] != null ? fmt.num(expBadgeCounts[tab.key]) : ''"></span>
                    </template>
                    <template x-if="tab.ambito">
                      <span class="exp-tab-punto" :class="'p-' + gravedadDelAmbito(tab)"
                            :title="({error:'Hay errores', warning:'Hay avisos', info:'Solo info', ok:'Sin problemas'})[gravedadDelAmbito(tab)] || ''"></span>
                    </template>
                  </button>
                </template>
              </div>
            </template>
          </div>
          <!-- «Solo en WordPress» (decisión 168): lo que la REST API publica y
               el censo no tiene. Otra fuente que la tabla de URLs: panel propio. -->
          <template x-if="resumenWordPress(job) && resumenWordPress(job).abierta">
            <div class="exp-sidebar-group">
              <div class="exp-sidebar-titulo">WordPress</div>
              <button type="button" class="exp-tab" :class="expWp && 'active'" @click="abrirSoloWordPress('')" data-testid="exp-solo-wordpress">
                <i data-lucide="file-question" class="exp-tab-icon"></i>
                <span>Solo en WordPress</span>
              </button>
            </div>
          </template>
        </div>

        <!-- Main area -->
        <div class="exp-main" :class="expWp && 'con-wp'">
          <template x-if="expWp">
            <div class="exp-wp" data-testid="exp-wp" x-data="{ get wp() { return resumenWordPress(job) || { filas: [] } } }">
              <div class="exp-toolbar">
                <button class="exp-back" @click="cerrarSoloWordPress()"><i data-lucide="arrow-left" class="exp-wp-icono"></i><span>Volver a la tabla</span></button>
                <div class="exp-search-wrap">
                  <i data-lucide="search"></i>
                  <input type="text" class="exp-search" placeholder="Buscar en la URL..." x-model="wpSolo.buscar" @input="buscarSoloWordPress()">
                </div>
                <select class="exp-problema" :class="wpSolo.tipo && 'has-value'" aria-label="Filtrar por tipo de WordPress" @change="elegirTipoSoloWordPress($event.target.value)">

                                     :inputmode="EXP_COLUMN_DEFS[col].type === 'numeric' ? 'decimal' : 'text'"
                                     class="exp-filter-input"
                                     :class="expColumnFilters[col]?.value && 'has-value'"
                                     :placeholder="expFilterPlaceholder(col)"
                                     :title="(EXP_COLUMN_DEFS[col].label || col) + ': ' + expFilterPlaceholder(col)"
                                     :value="expColumnFilters[col]?.value || ''"
                                     :disabled="['vacio','con_valor'].includes(expColumnFilters[col]?.op)"
                                     @input="expColumnFilterInput(col, { value: $event.target.value })">
                            </template>
                          </div>
                        </template>
                        <template x-if="!EXP_COLUMN_DEFS[col]?.filterKey">
                          <div class="exp-filter-cell empty">&nbsp;</div>
                        </template>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, idx) in expUrls" :key="row.id">
                    <tr :class="expSelectedUrl?.id === row.id && 'exp-row-selected'"
                        @click="selectExplorerUrl(row, idx)"
                        @dblclick="openUrlFromExplorer(row.id)">
                      <template x-for="col in getExpColumns()" :key="row.id + '_' + col">
                        <td :title="getExpCellTitle(row, col)">
                          <template x-if="col === 'status_code'">
                            <span class="exp-status" :class="expStatusClass(row.status_code)" x-text="row.status_code || ''"></span>
                          </template>
                          <template x-if="col !== 'status_code'">
                            <span x-text="getExpCellValue(row, col)"></span>
                          </template>
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </div>

          <!-- Detail panel -->
          <template x-if="expDetailOpen && expSelectedUrl">
            <div class="exp-detail">
              <div class="exp-detail-header">
                <span class="exp-status" :class="expStatusClass(expSelectedUrl.status_code)" x-text="expSelectedUrl.status_code"></span>
                <span class="exp-detail-url" :title="expSelectedUrl.url" x-text="expSelectedUrl.url"></span>
                <span class="text-dim text-sm" style="font-size:.7rem">↑↓ navegar · Esc cerrar</span>
                <button class="btn btn-sm" @click="openUrlFromExplorer(expSelectedUrl.id)" style="font-size:.72rem;padding:.2rem .5rem">
                  Abrir completo
                </button>
                <button class="exp-detail-close" @click="closeExplorerDetail()">&times;</button>
              </div>
              <div class="exp-detail-tabs">
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'resumen' && 'active'" @click="expDetailTab = 'resumen'">
                  Resumen SEO
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'content' && 'active'" @click="expDetailTab = 'content'">
                  Contenido
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'headings' && 'active'" @click="expDetailTab = 'headings'">
                  Encabezados <span class="count" x-text="expUrlDetail?.headings?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'inlinks' && 'active'" @click="expDetailTab = 'inlinks'">
                  Inlinks <span class="count" x-text="expUrlDetail?.inlinks?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'outlinks' && 'active'" @click="expDetailTab = 'outlinks'">
                  Outlinks <span class="count" x-text="expUrlDetail?.outlinks?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'issues' && 'active'" @click="expDetailTab = 'issues'">
                  Problemas <span class="count" x-text="expUrlDetail?.issues?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'resources' && 'active'" @click="expDetailTab = 'resources'">
                  Recursos <span class="count" x-text="expUrlDetail?.resources?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'structured' && 'active'" @click="expDetailTab = 'structured'">
                  Datos estr. <span class="count" x-text="expUrlDetail?.structured_data?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'hreflang' && 'active'" @click="expDetailTab = 'hreflang'">
                  Hreflang <span class="count" x-text="expUrlDetail?.hreflangs?.length || 0"></span>
                </button>
              </div>
              <div class="exp-detail-body">
                <!-- Loading -->
                <template x-if="!expUrlDetail">
                  <div class="loading-overlay" style="padding:.5rem"><div class="spinner"></div></div>
                </template>
                <template x-if="expUrlDetail">
                  <div>
                    <!-- Resumen SEO: lo primero que se busca al seleccionar una fila
                         (antes abria en el markdown del contenido). -->
                    <template x-if="expDetailTab === 'resumen'">
                      <dl class="exp-resumen">
                        <dt>Indexabilidad</dt>
                        <dd :class="expUrlDetail.indexable ? 'green' : (expUrlDetail.indexable === false ? 'orange' : '')"
                            x-text="expUrlDetail.indexability_status || (expUrlDetail.indexable ? 'Indexable' : '—')"></dd>
                        <template x-if="expUrlDetail.response_class && expUrlDetail.response_class !== 'contenido'">
                          <dt>Respuesta</dt>
                        </template>
                        <template x-if="expUrlDetail.response_class && expUrlDetail.response_class !== 'contenido'">
                          <dd class="orange" x-text="fmt.claseRespuesta(expUrlDetail.response_class)"></dd>
                        </template>
                        <dt>Título</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.title || '(sin título)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.title_pixel_width"
                                :class="expUrlDetail.html_meta?.title_pixel_width > 580 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.title_pixel_width + ' px' + (expUrlDetail.html_meta?.title_pixel_width > 580 ? ' (Google lo corta)' : '')"></span>
                        </dd>
                        <dt>Descripción</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.meta_description || '(sin descripción)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.meta_description_pixel_width"
                                :class="expUrlDetail.html_meta?.meta_description_pixel_width > 985 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.meta_description_pixel_width + ' px'"></span>
                        </dd>
                        <dt>H1</dt>
                        <dd x-text="((expUrlDetail.headings || []).filter(h => h.tag === 'h1' && !h.oculto).map(h => h.text).join(' · ')) || '(sin H1 visible)'"></dd>
                        <dt>Canonical</dt>
                        <dd class="truncate" :title="expUrlDetail.html_meta?.canonical_href || ''"
                            x-text="expUrlDetail.html_meta?.canonical_href ? (expUrlDetail.html_meta.canonical_href === expUrlDetail.url ? 'a sí misma' : expUrlDetail.html_meta.canonical_href) : '(sin canonical)'"></dd>
                        <dt>Robots</dt>
                        <dd x-text="[expUrlDetail.html_meta?.meta_robots, expUrlDetail.html_meta?.x_robots_tag && ('X-Robots-Tag: ' + expUrlDetail.html_meta.x_robots_tag)].filter(Boolean).join(' · ') || '—'"></dd>
                        <dt>Enlazado</dt>
                        <dd x-text="(n => fmt.num(n) + (n === 1 ? ' página la enlaza · ' : ' páginas la enlazan · '))(expUrlDetail.unique_inlinks_count ?? expUrlDetail.inlinks_count ?? 0) + (expUrlDetail.click_depth != null ? expUrlDetail.click_depth + ' clics desde la home' : 'sin profundidad calculada') + (expUrlDetail.pagerank_score != null ? ' · PageRank ' + expUrlDetail.pagerank_score : '') + (expUrlDetail.in_sitemap ? ' · en el sitemap' : ' · fuera del sitemap')"></dd>
                        <template x-if="(expUrlDetail.sitemaps || []).length">
                          <dt>Sitemap</dt>
                        </template>
                        <template x-if="(expUrlDetail.sitemaps || []).length">
                          <dd>
                            <template x-for="(sm, n) in expUrlDetail.sitemaps" :key="'esm' + n">
                              <div class="truncate" :title="sm.fichero + ((sm.hreflang || []).length ? '\n' + sm.hreflang.map(h => h[0] + ' → ' + h[1]).join('\n') : '')"
                                   x-text="sm.fichero + (sm.lastmod ? ' · lastmod ' + sm.lastmod : ' · sin lastmod') + ((sm.hreflang || []).length ? ' · hreflang: ' + sm.hreflang.map(h => h[0]).join(', ') : '')"></div>
                            </template>
                          </dd>
                        </template>
                        <template x-if="(expUrlDetail.wordpress || []).length">
                          <dt>WordPress</dt>
                        </template>
                        <template x-if="(expUrlDetail.wordpress || []).length">
                          <dd><template x-for="(w, n) in expUrlDetail.wordpress" :key="'ewp' + n"><div x-text="textoEntidadWp(w)"></div></template></dd>
                        </template>
                        <dt>Problemas</dt>
                        <dd>
                          <template x-if="!(expUrlDetail.issues || []).length"><span class="green">Ninguno</span></template>
                          <template x-for="(i, n) in [...(expUrlDetail.issues || [])].sort((a, b) => ({error:0,warning:1,info:2}[a.severity] ?? 3) - ({error:0,warning:1,info:2}[b.severity] ?? 3))" :key="n">
                            <div><span class="sev-chip" :class="'sev-' + i.severity" x-text="fmt.severity(i.severity)"></span>
                              <span x-text="fmt.issue(i.issue_type)"></span>
                              <span class="text-dim text-sm" x-text="fmt.detalles(i.details) ? '· ' + fmt.detalles(i.details) : ''"></span></div>
                          </template>
                        </dd>
                        <template x-for="d in expAMedida" :key="d.key">
                          <div style="display:contents">
                            <dt x-text="d.etiqueta"></dt>
                            <dd x-text="EXP_COLUMN_DEFS[d.key].tip(expUrlDetail)"></dd>
                          </div>
                        </template>
                      </dl>
                    </template>
                    <!-- Content tab: full text + markdown -->
                    <template x-if="expDetailTab === 'content'">
                      <div>
                        <template x-if="!expUrlDetail.page_content || (!expUrlDetail.page_content.content_text && !expUrlDetail.page_content.content_markdown)">
                          <div class="text-dim" style="padding:.5rem 0">Sin contenido extraído para esta URL.</div>
                        </template>
                        <template x-if="expUrlDetail.page_content?.content_markdown">
                          <div style="margin-bottom:.75rem">
                            <div style="font-weight:600;font-size:.75rem;color:var(--accent);margin-bottom:.35rem">Markdown</div>
                            <pre class="content-preview" style="white-space:pre-wrap;max-height:none;font-family:'Consolas','Monaco',monospace;font-size:.75rem" x-text="expUrlDetail.page_content.content_markdown"></pre>
                          </div>
                        </template>
                        <template x-if="expUrlDetail.page_content?.content_text">
                          <div>
                            <div style="font-weight:600;font-size:.75rem;color:var(--accent);margin-bottom:.35rem">
                              Texto plano (<span x-text="fmt.num(expUrlDetail.page_content.content_length)"></span> car.)
                            </div>
                            <div class="content-preview" style="white-space:pre-wrap;max-height:none" x-text="expUrlDetail.page_content.content_text"></div>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Headings tab -->
                    <template x-if="expDetailTab === 'headings'">
                      <div>
                        <template x-if="!expUrlDetail.headings || expUrlDetail.headings.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin encabezados detectados.</div>
                        </template>
                        <template x-if="expUrlDetail.headings && expUrlDetail.headings.length > 0">
                          <div class="heading-tree">
                            <template x-for="h in expUrlDetail.headings" :key="h.id">
                              <div class="heading-item" :style="'padding-left:' + headingIndent(h.tag) + 'rem'">
                                <span class="heading-tag" :style="'color:' + headingColor(h.tag)" x-text="h.tag"></span>
                                <span class="heading-text" x-text="h.text || '(vacío)'"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Inlinks tab: full table -->
                    <template x-if="expDetailTab === 'inlinks'">
                      <div>
                        <template x-if="!expUrlDetail.inlinks || expUrlDetail.inlinks.length === 0">
                          <div class="text-dim" style="padding:.5rem 0"
                               x-text="expUrlDetail.inlinks_count === 0 ? 'Esta URL no recibe enlaces internos (página huérfana).' : (expUrlDetail.inlinks_count ? 'No se han podido leer sus enlaces entrantes (el análisis cuenta ' + fmt.num(expUrlDetail.inlinks_count) + ').' : 'Sin enlaces entrantes en la respuesta.')"></div>
                        </template>
                        <template x-if="expUrlDetail.inlinks && expUrlDetail.inlinks.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>URL origen</th>
                                <th style="width:200px">Anchor</th>
                                <th style="width:80px">Follow</th>
                                <th style="width:100px">Posición</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="l in expUrlDetail.inlinks" :key="l.id">
                                <tr>
                                  <td :title="l.from_url || ''" style="max-width:380px">
                                    <div class="truncate"><a x-show="l.from_url_id" :href="'#/rastreos/' + job.id + '/url/' + l.from_url_id" x-text="l.from_url || '—'"></a>
                                      <span x-show="!l.from_url_id" x-text="l.from_url || '—'"></span></div>
                                  </td>
                                  <td :title="l.anchor_text || ''" style="max-width:200px">
                                    <div class="truncate" x-text="l.anchor_text || '—'"></div>
                                  </td>
                                  <td x-text="l.follow === false ? 'nofollow' : 'follow'"></td>
                                  <td x-text="l.link_position || '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Outlinks tab: full table -->
                    <template x-if="expDetailTab === 'outlinks'">
                      <div>
                        <template x-if="!expUrlDetail.outlinks || expUrlDetail.outlinks.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Esta URL no tiene enlaces salientes.</div>
                        </template>
                        <template x-if="expUrlDetail.outlinks && expUrlDetail.outlinks.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>URL destino</th>
                                <th style="width:200px">Anchor</th>
                                <th style="width:80px">Follow</th>
                                <th style="width:80px">Interno</th>
                                <th style="width:100px">Posición</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="l in expUrlDetail.outlinks" :key="l.id">
                                <tr>
                                  <td :title="l.to_url" style="max-width:380px">
                                    <div class="truncate" x-text="l.to_url"></div>
                                  </td>
                                  <td :title="l.anchor_text || ''" style="max-width:200px">
                                    <div class="truncate" x-text="l.anchor_text || '—'"></div>
                                  </td>
                                  <td x-text="l.follow === false ? 'nofollow' : 'follow'"></td>
                                  <td x-text="l.is_internal ? 'Sí' : 'No'"></td>
                                  <td x-text="l.link_position || '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Issues tab with details JSON -->
                    <template x-if="expDetailTab === 'issues'">
                      <div>
                        <template x-if="!expUrlDetail.issues || expUrlDetail.issues.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin problemas detectados.</div>
                        </template>
                        <template x-if="expUrlDetail.issues && expUrlDetail.issues.length > 0">
                          <div class="issues-list">
                            <template x-for="iss in expUrlDetail.issues" :key="iss.id">
                              <div class="issue-item" :class="'issue-' + iss.severity">
                                <div class="issue-header">
                                  <span class="badge" :class="'severity-' + iss.severity" x-text="fmt.severity(iss.severity)" style="font-size:.68rem"></span>
                                  <span style="font-weight:600;font-size:.8rem" x-text="fmt.issue(iss.issue_type)"></span>
                                </div>
                                <template x-if="iss.details && Object.keys(iss.details).length > 0">
                                  <div style="margin-top:.3rem;padding-left:.5rem;font-size:.72rem;color:var(--text-dim)">
                                    <template x-for="[k,v] in Object.entries(iss.details)" :key="k">
                                      <div><span style="font-weight:600" x-text="k + ':'"></span> <span x-text="String(v)"></span></div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Resources tab -->
                    <template x-if="expDetailTab === 'resources'">
                      <div>
                        <template x-if="!expUrlDetail.resources || expUrlDetail.resources.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin recursos asociados.</div>
                        </template>
                        <template x-if="expUrlDetail.resources && expUrlDetail.resources.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>Recurso</th>
                                <th style="width:80px">Tipo</th>
                                <th style="width:160px">Alt</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="r in expUrlDetail.resources" :key="r.id">
                                <tr>
                                  <td :title="r.resource_url" style="max-width:380px">
                                    <div class="truncate" x-text="r.resource_url"></div>
                                  </td>
                                  <td x-text="r.resource_type"></td>
                                  <td :title="r.alt_text || ''" style="max-width:160px">
                                    <div class="truncate" x-text="r.alt_text || '—'"></div>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Structured data -->
                    <template x-if="expDetailTab === 'structured'">
                      <div>
                        <template x-if="!expUrlDetail.structured_data || expUrlDetail.structured_data.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin datos estructurados.</div>
                        </template>
                        <template x-for="sd in expUrlDetail.structured_data" :key="sd.id">
                          <div style="margin-bottom:.5rem">
                            <div style="font-weight:600;font-size:.75rem;color:var(--accent);margin-bottom:.25rem">
                              <span x-text="sd.schema_type || '(sin tipo)'"></span>
                              <span class="text-dim" style="font-weight:400" x-text="'· ' + sd.format"></span>
                            </div>
                            <pre style="background:var(--bg-input);padding:.5rem;border-radius:3px;font-size:.72rem;max-height:200px;overflow:auto" x-text="JSON.stringify(sd.raw, null, 2)"></pre>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Hreflang -->
                    <template x-if="expDetailTab === 'hreflang'">
                      <div>
                        <template x-if="!expUrlDetail.hreflangs || expUrlDetail.hreflangs.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin anotaciones hreflang.</div>
                        </template>
                        <template x-if="expUrlDetail.hreflangs && expUrlDetail.hreflangs.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr><th style="width:80px">Lang</th><th>Href</th><th style="width:100px">Return OK</th></tr>
                            </thead>
                            <tbody>
                              <template x-for="hl in expUrlDetail.hreflangs" :key="hl.id">
                                <tr>
                                  <td x-text="hl.lang"></td>
                                  <td :title="hl.href" style="max-width:380px"><div class="truncate" x-text="hl.href"></div></td>
                                  <td x-text="hl.return_tag_ok === true ? 'Sí' : hl.return_tag_ok === false ? 'No' : '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Status bar -->
          <div class="exp-statusbar">
            <span x-text="'Pág. ' + expPage + ' de ' + expPages"></span>
            <div class="exp-pager">
              <button :disabled="expPage <= 1" @click="setExpPage(1)">&#171;</button>
              <button :disabled="expPage <= 1" @click="setExpPage(expPage - 1)">&#8249;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPage + 1)">&#8250;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPages)">&#187;</button>
            </div>
          </div>

        </div>
      </div>
    </template>

  </main>
</div>


<!-- ===== MODAL: CREAR NUEVO RASTREO ===== -->
<template x-if="showCreate">
  <div class="modal-backdrop" @click.self="showCreate = false" @keydown.escape.window="showCreate = false">
    <div class="modal modal--wide">
      <div class="modal-header">
        <div>
          <h3 style="display:flex;align-items:center;gap:.4rem">
            <i data-lucide="radar" style="width:18px;height:18px;color:#5BAE23"></i> Nuevo rastreo
          </h3>
          <p class="text-dim text-sm" style="margin-top:.25rem">Configura y lanza un rastreo SEO completo de un sitio web</p>
        </div>
        <button class="btn-icon" @click="showCreate = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body">
        <template x-if="createError">
          <div class="card mb-2" style="border-color:var(--red);color:var(--red);padding:.5rem .75rem;font-size:.85rem" x-text="createError"></div>
        </template>

        <!-- El cliente se elige, no se escribe: con texto libre una errata
             creaba otro cliente (#36). Al elegirlo, el formulario se precarga
             con su configuracion y la del perfil. -->
        <div class="form-row">
          <div class="form-group">
            <label>Cliente</label>
            <select x-model="createForm.cliente_id" @change="cambiarClienteModal()">
              <option value="">Sin cliente</option>
              <template x-for="c in clientes" :key="c.id">
                <option :value="c.id" x-text="c.nombre" :selected="c.id === createForm.cliente_id"></option>
              </template>
              <option value="__nuevo__">Nuevo cliente…</option>
            </select>
          </div>
          <div class="form-group" x-show="createForm.cliente_id">
            <label>Perfil de rastreo</label>
            <select x-model="createForm.profile_id" @change="aplicarHerencia()">
              <option value="">Rastreo puntual (sin perfil)</option>
              <template x-for="p in createPerfiles" :key="p.id">
                <option :value="p.id" :selected="p.id === createForm.profile_id"
                        x-text="p.nombre + (p.rol === 'competidor' ? ' (competidor)' : '')"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="form-hint orange" x-show="!createForm.cliente_id" style="margin:-.4rem 0 .8rem" data-testid="aviso-sin-cliente">
          Sin cliente, el rastreo no hereda ninguna configuración ni cuenta en la evolución,
          las alertas o la portada de nadie. Elige uno salvo que sea una prueba suelta.
        </div>
        <div class="form-hint" x-show="createForm.cliente_id" style="margin:-.4rem 0 .8rem">
          La configuracion viene precargada con la del cliente y la del perfil. Lo que cambies aqui
          solo vale para este rastreo; lo que el formulario no muestra (plantillas, umbrales extra)
          se hereda igual.
        </div>

        <!-- Campos siempre visibles -->
