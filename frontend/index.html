                   no contra la fila de debajo: con dos programaciones, la fila
                   de debajo es de la otra serie (revision de UX del 25-oct, 2.3). -->
              <div class="flex items-center mb-1 gap-50 flex-wrap">
                <h3 class="fs-base">Evolución de los rastreos</h3>
                <label class="checkbox-label text-sm ml-auto">
                  <input type="checkbox" x-model="serieSoloCensos"> Solo censos
                </label>
              </div>
              <template x-if="!clienteSerie.length">
                <div class="text-dim text-sm">Ningún rastreo todavía.</div>
              </template>
              <template x-if="clienteSerie.length">
                <div class="table-wrap con-tarjetas">
                <!-- En movil, tarjetas con el rastreo arriba (revision de UX del
                     25-oct, 3.2). -->
                <table class="tabla-tarjetas tarjetas-orden w-full fs-sm" data-testid="tabla-serie">
                  <thead><tr>
                    <th class="ta-l">fecha</th>
                    <th class="ta-l">rastreo</th>
                    <th class="ta-r">URLs</th>
                    <th class="ta-r">páginas</th>
                    <th class="ta-r">indexables</th>
                    <th class="ta-r" :title="serieVisible().some(j => paginasConError(j) == null) ? 'Las filas sin la cifra de páginas (versión anterior del servidor) dicen las incidencias de error, con «incid.»' : 'Páginas con al menos un error: la misma cifra que la tarjeta del censo y la gráfica'">páginas con error</th>
                    <th class="ta-r" title="Incidencias de gravedad aviso">avisos</th>
                    <th class="ta-l">frente al anterior</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="(j, n) in serieVisible()" :key="j.id">
                      <tr @click="location.hash = '#/rastreos/' + j.id" class="pointer">
                        <td class="nowrap" data-label="Fecha" x-text="fmt.dia(j.created_at)" :title="fmt.date(j.created_at)"></td>
                        <td class="td-cabeza">
                          <span x-text="j.name"></span>
                          <span class="tipo-chip" x-show="j.tipo !== 'censo'" x-text="j.tipo" :title="({canario: 'Canario: unas pocas páginas para comprobar bloqueos, render y ritmo antes del censo. No cuenta en la evolución', prueba: 'Prueba: un rastreo para probar algo. No cuenta en la evolución ni en la portada', lista: 'Lista: solo las URLs de una lista, sin seguir enlaces'})[j.tipo] || ''"></span>
                          <span class="badge" :class="statusColor(j.status)" x-show="j.status !== 'completed'" x-text="fmt.status(j.status)"></span>
                        </td>
                        <td class="solo-escritorio ta-r" x-text="fmt.num(j.urls)"></td>
                        <td class="ta-r" data-label="Páginas" x-text="fmt.num(j.paginas_html)"></td>
                        <td class="solo-escritorio ta-r" x-text="j.paginas_html ? Math.round(j.indexables / j.paginas_html * 100) + ' %' : '—'"></td>
                        <!-- Paginas con error (decision 202), como la grafica y la
                             tarjeta; sin la cifra (API anterior), las incidencias. La
                             referencia, en la MISMA unidad que la fila: si no, «85
                             incid. ▲13» restaba paginas a incidencias (revision del 27-oct). -->
                        <td class="ta-r nowrap" data-label="Páginas con error"
                            x-data="{ get v() { return (x => x != null ? x : null)(paginasConError(j)) }, get r() { const r = referenciaDe(j); return r ? (this.v != null ? paginasConError(r) : r.errores) : null } }">
                          <span x-text="v != null ? fmt.num(v) : fmt.num(j.errores) + ' incid.'"
                                :title="v != null ? '' : 'Incidencias de gravedad error: esta versión del servidor no dice cuántas páginas'"></span>
                          <template x-if="r != null">
                            <span class="delta" :class="(v ?? j.errores) > r ? 'peor' : ((v ?? j.errores) < r ? 'mejor' : '')"
                                  :title="'Frente al ' + fmt.dia(referenciaDe(j).created_at) + ': ' + fmt.num(r)"
                                  x-text="(v ?? j.errores) === r ? '=' : ((v ?? j.errores) > r ? '▲' : '▼') + fmt.num(Math.abs((v ?? j.errores) - r))"></span>
                          </template>
                        </td>
                        <td class="ta-r" data-label="Avisos" x-text="fmt.num(j.avisos)"></td>
                        <!-- «frente al 19 oct: saltaron 3 alertas»: las que salto ESA
                             comparacion, con la fecha de su referencia. -->
                        <td class="text-sm td-ancha nowrap" data-label="Alertas">
                          <template x-if="!j.comparado_con"><span class="text-dim">—</span></template>
                          <template x-if="j.comparado_con">
                            <a :href="'#/rastreos/' + j.id + '/comparar'" @click.stop
                               :class="j.alertas_criticas ? 'text-red' : (j.alertas ? 'text-orange' : (j.alertas === null ? 'text-dim' : ''))"
                               x-text="textoFrenteAlAnterior(j)"></a>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- --- Pestana Alertas: solo las alertas (revision de UX del 25-oct,
             2.1); las reglas que las disparan estan en Configuracion. -->
        <template x-if="cliente && clienteTab === 'alertas'">
          <div data-testid="cliente-alertas">
            <template x-if="reglasError">
              <div class="card mb-2 btn-rojo" x-text="reglasError"></div>
            </template>
            <!-- Incidentes (decision 139): cada alerta de una serie con su
                 estado. La abre el primer rastreo que la ve, la cierra solo el
                 que puede afirmar que ya no esta; aqui se marca vista o se
                 silencia. En la interfaz se llaman «alertas», como en la
                 portada y en Estado: un solo termino (revision 2.3). -->
            <div class="card mb-2" data-testid="incidentes">
              <div class="flex items-center gap-1 flex-wrap mb-40">
                <h3 class="m-0 fs-base">Alertas</h3>
                <template x-for="o in [['vivos', 'Abiertas'], ['cerrados', 'Cerradas']]" :key="o[0]">
                  <button class="btn btn-sm chip" :class="incidentesVer === o[0] && 'chip-on'"
                          @click="incidentesVer = o[0]; cargarIncidentes()" x-text="o[1]"></button>
                </template>
              </div>
              <p class="text-sm text-dim mt-20 mb-50 mx-0">Una alerta de un perfil o de una programación se abre la primera vez que salta y solo entonces se avisa. Se cierra sola cuando un rastreo posterior que puede comprobarlo ya no la ve.
                Cuándo salta cada una se decide en <a href="#" @click.prevent="irASeccionConfig('reglas-alertas')">Configuración › Reglas de alertas</a>.</p>
              <template x-if="incidentes === null"><div class="text-dim text-sm">Cargando…</div></template>
              <template x-if="incidentes && !incidentes.length">
                <div class="text-dim text-sm">
                  <span x-text="incidentesVer === 'vivos' ? 'Ninguna alerta abierta.' : 'Ninguna alerta cerrada todavía.'"></span>
                  <a href="#" x-show="incidentesVer === 'vivos'" @click.prevent="verAlertasCerradas()">Ver las cerradas</a>
                </div>
              </template>
              <!-- Agrupadas por regla y las info aparte (revision de UX del 25-oct,
                   1.12; V08; decision 204). Ver agruparIncidentes. -->
              <template x-for="seccion in [[false, ''], [true, 'Cambios a favor']]" :key="String(seccion[0])">
                <div x-show="gruposIncidentes(seccion[0]).length">
                  <h4 class="fs-sm mt-75 mb-25" x-show="seccion[1]" x-text="seccion[1]"></h4>
                  <p class="text-sm text-dim mt-0 mb-50" x-show="seccion[0]">Alertas informativas: cambios que no piden arreglar nada.</p>
                  <ul class="incidentes" :data-testid="seccion[0] ? 'incidentes-a-favor' : 'incidentes-grupos'">
                    <template x-for="g in gruposIncidentes(seccion[0])" :key="g.clave">
                      <li :class="'sev-' + g.severidad">
                        <div class="incidente-cabecera">
                          <!-- La gravedad con su color y el estado en neutro (1.12). -->
                          <span class="badge" :style="'background:transparent;color:' + fmt.colorSeveridad(g.severidad) + ';border:1px solid ' + fmt.colorSeveridad(g.severidad)"
                                x-text="({critical: 'Crítica', warning: 'Aviso', info: 'Info'})[g.severidad] || g.severidad"></span>
                          <strong x-text="tituloIncidente(g.ultimo)"></strong>
                          <span class="text-sm text-dim" x-text="g.estados.map(e => ({abierto: 'abierta', visto: 'vista', cerrado: 'cerrada'})[e] || e).join(' y ')"></span>
                        </div>
                        <!-- Varias: en que censos se vio, una vez (decision 204). -->
                        <template x-if="g.items.length > 1">
                          <div class="text-sm text-dim" data-testid="incidente-visto-en">
                            <span>Vista en los censos del </span>
                            <template x-for="(i, n) in g.items" :key="i.id">
                              <span><span x-text="n === 0 ? '' : (n === g.items.length - 1 ? ' y del ' : ', del ')"></span><a :href="'#/rastreos/' + (i.abierto_job_id || i.ultimo_job_id)" x-show="i.abierto_job_id || i.ultimo_job_id" x-text="fmt.diaCorto(i.abierto_en)"></a><span x-show="!(i.abierto_job_id || i.ultimo_job_id)" x-text="fmt.diaCorto(i.abierto_en)"></span></span>
                            </template>
                            <span x-text="g.series.length > 1 ? ' · en ' + g.series.join(' y ') : (g.series.length ? ' · ' + g.series[0] : '')"></span>
                          </div>
                        </template>
                        <template x-for="i in g.items" :key="'d' + i.id">
                          <div class="text-sm text-dim">
                            <span x-show="g.items.length === 1" x-text="i.nombre_serie || i.serie"></span>
                            <span x-show="g.items.length > 1" x-text="'La del ' + fmt.diaCorto(i.abierto_en)"></span>
                            <span x-show="g.items.length === 1">· desde el <a :href="'#/rastreos/' + i.abierto_job_id" x-show="i.abierto_job_id" x-text="fmt.dia(i.abierto_en)"></a><span x-show="!i.abierto_job_id" x-text="fmt.dia(i.abierto_en)"></span></span>
                            <span x-show="i.veces > 1" x-text="'· en ' + i.veces + ' rastreos seguidos'"></span>
                            <template x-if="i.cerrado_en && !i.motivo_cierre && i.cerrado_job_id">
                              <span>· cerrada el <a :href="'#/rastreos/' + i.cerrado_job_id" x-text="fmt.dia(i.cerrado_en)"></a></span>
                            </template>
                            <!-- Cerrada sin rastreo (decision 188): se dice por que, y no que el fallo se fuera. -->
                            <template x-if="i.cerrado_en && i.motivo_cierre">
                              <span x-text="'· cerrada el ' + fmt.dia(i.cerrado_en) + ({serie_pausada: ': se pausó su programación', serie_borrada: ': se borró su programación o su perfil', serie_unida: ': su programación pasó a su perfil, que ya tenía esta alerta abierta'}[i.motivo_cierre] || '') + ' (no se comprobó si sigue)'"></span>
                            </template>
                            <!-- Cerrada por un rastreo que luego se borro: se sabe la fecha y nada mas. -->
                            <template x-if="i.cerrado_en && !i.motivo_cierre && !i.cerrado_job_id">
                              <span x-text="'· cerrada el ' + fmt.dia(i.cerrado_en)"></span>
                            </template>
                            <span x-show="i.estado !== 'cerrado' && g.items.length > 1" x-text="'· ' + (({abierto: 'abierta', visto: 'vista'})[i.estado] || i.estado)"></span>
                            <span x-show="i.silenciado_hasta && i.estado !== 'cerrado'" x-text="'· sin avisos hasta el ' + fmt.dia(i.silenciado_hasta)"></span>
                          </div>
                        </template>
                        <div class="flex gap-1 mt-1 flex-wrap">
                          <!-- Las paginas de la ultima vez que salto, en Comparar de ese censo. -->
                          <a class="btn btn-sm" data-testid="incidente-ver-paginas" x-show="(g.ultimo.detalle || {}).paginas != null && g.ultimo.ultimo_job_id"
                             :href="'#/rastreos/' + g.ultimo.ultimo_job_id + '/comparar'"
                             x-text="(n => n === 1 ? 'Ver la página' : 'Ver las ' + fmt.num(n) + ' páginas')((g.ultimo.detalle || {}).paginas)"></a>
                          <template x-if="g.estados.some(e => e !== 'cerrado')">
                            <div class="flex gap-1 flex-wrap items-center">
                              <button class="btn btn-sm" x-show="g.estados.includes('abierto')" @click="cambiarGrupoIncidentes(g, {estado: 'visto'}, 'abierto')">Marcar como vista</button>
                              <button class="btn btn-sm" x-show="g.estados.includes('visto') && !g.estados.includes('abierto')" @click="cambiarGrupoIncidentes(g, {estado: 'abierto'}, 'visto')">Volver a abierta</button>
                              <label class="text-sm flex gap-30 items-center">Silenciar hasta
                                <input type="date" :value="(g.items.find(i => i.estado !== 'cerrado') || {}).silenciado_hasta || ''" @change="cambiarGrupoIncidentes(g, {silenciado_hasta: $event.target.value || null})">
                              </label>
                              <a class="btn btn-sm" x-show="g.ultimo.ultimo_job_id" :href="'#/rastreos/' + g.ultimo.ultimo_job_id">Último rastreo que la vio</a>
                            </div>
                          </template>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- --- Pestana Configuracion: perfiles, datos del cliente y reglas de
             alertas (revision de UX del 25-oct, 2.1). Los perfiles venian
             primero en la ficha y el editor de reglas ocupaba la pestana
             Alertas; aqui estan juntos «que se rastrea» y «cuando avisar». -->
        <!-- Alta guiada (revision de UX del 25-oct, 2.14; decision 194): solo
             nombre y dominio. Se crea solo un perfil «Sitio principal» con la
             home y la ficha abre en Estado con el siguiente paso. -->
        <template x-if="!cliente && altaForm">
          <div class="card alta-cliente" data-testid="alta-cliente">
            <h3>Dar de alta un cliente</h3>
            <p class="text-dim text-sm">Con el nombre y el dominio basta para el primer rastreo. La configuración,
              Search Console, Slack y las alertas se rellenan después en Configuración.</p>
            <form @submit.prevent="crearClienteGuiado()">
              <div class="form-group">
                <label for="alta-nombre">Nombre del cliente</label>
                <input id="alta-nombre" type="text" x-model="altaForm.nombre" placeholder="Ej.: Lopesan Hotels" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="alta-dominio">Dominio principal</label>
                <input id="alta-dominio" type="text" x-model="altaForm.dominio" placeholder="www.cliente.com" autocomplete="off" inputmode="url">
                <div class="form-hint" x-show="altaHome()">
                  Se creará el perfil «Sitio principal», que empieza en <strong x-text="altaHome()"></strong>.
                </div>
              </div>
              <template x-if="altaForm.error">
                <div class="card mb-1 btn-rojo-sm" x-text="altaForm.error"></div>
              </template>
              <div class="flex gap-1 items-center flex-wrap">
                <button type="submit" class="btn btn-primary" :disabled="altaForm.guardando" data-testid="alta-crear">Crear cliente</button>
                <a href="#/clientes" class="btn">Cancelar</a>
              </div>
            </form>
          </div>
        </template>

        <template x-if="cliente && clienteTab === 'config'">
          <!-- Con la clave del cliente: al pasar de un cliente a otro con la
               pestaña abierta, las secciones se montan de nuevo y sus x-init
               (Search Console, Slack, enlaces, configuración) piden las del
               nuevo; antes se quedaban con las del anterior o vacías. -->
          <template x-for="cid in [cliente.id]" :key="cid">
          <div data-testid="cliente-config">
            <!-- Secciones plegables con un indice (revision de UX del 25-oct,
                 2.4): la pestaña medía unos 4.000 px con todo abierto. Lo que es
                 de la agencia (el bot de Slack, las llaves de Search Console,
                 las claves de los modelos) esta en Ajustes (2.5). -->
            <nav class="text-sm config-indice" aria-label="Secciones de la configuración">
              <template x-for="[id, texto] in SECCIONES_CONFIG_CLIENTE" :key="id">
                <a href="#" @click.prevent="irASeccionConfig(id)" x-text="texto"></a>
              </template>
            </nav>
            <template x-if="cliente">
            <details class="cfg-seccion" id="cfg-perfiles" open data-testid="seccion-cfg-perfiles">
              <summary>
                <span class="cfg-seccion-titulo">Perfiles de rastreo</span>
                <span class="cfg-seccion-resumen text-sm text-dim" x-text="resumenSeccionConfig('cfg-perfiles')"></span>
              </summary>
              <div class="cfg-seccion-cuerpo">
              <div>
                <div class="flex items-center justify-end mb-1">
                  <button class="btn btn-sm" @click="nuevoPerfil()">Nuevo perfil</button>
                </div>
                <p class="text-dim text-sm mb-1">
                  Qué se rastrea, cómo y cada cuánto: el sitio principal, el blog, otro idioma o un competidor.
                  Un rastreo lanzado o programado desde un perfil hereda la configuración del cliente y la del
                  perfil del momento, y su evolución y sus alertas son las del perfil.
                </p>
                <template x-if="!clientePerfiles.length">
                  <div class="text-dim text-sm">Sin perfiles todavía.</div>
                </template>
                <!-- Una tarjeta por perfil (revision de UX del 25-oct, 2.2): que
                     rastrea, cuando se repite y sus acciones. Sin tabla: a 390 px
                     cada perfil se lee entero sin desplazar de lado. -->
                <template x-for="p in clientePerfiles" :key="p.id">
                  <div class="perfil-fila" :class="!p.activo && 'perfil-inactivo'" data-testid="perfil-fila">
                    <div class="perfil-que">
                      <div class="perfil-nombre">
                        <strong x-text="p.nombre"></strong>
                        <span class="badge" :class="p.rol === 'competidor' ? 'badge-pending' : 'badge-completed'"
                              x-text="p.rol === 'competidor' ? 'competidor' : 'propio'"></span>
                        <span class="badge" x-show="!p.activo">desactivado</span>
                      </div>
                      <div class="text-dim text-sm perfil-semillas"
                           x-text="(p.seeds || []).slice(0, 2).join(', ') + ((p.seeds || []).length > 2 ? ' y ' + fmt.num(p.seeds.length - 2) + ' más' : '')"></div>
                      <div class="text-sm">
                        <template x-if="p.last_job_id">
                          <a :href="'#/rastreos/' + p.last_job_id">Último rastreo</a>
                        </template>
                        <span class="text-dim" x-show="!p.last_job_id">Nunca se ha lanzado</span>
                      </div>
                    </div>
                    <div class="perfil-cuando" data-testid="perfil-programacion">
                      <template x-for="g in programacionesDePerfil(p.id)" :key="g.id">
                        <div class="perfil-prog" :class="!g.activa && 'fila-en-pausa'">
                          <i data-lucide="calendar-clock" class="ico-14 shrink-0"></i>
