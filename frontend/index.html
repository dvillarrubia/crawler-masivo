                </template>

                <template x-if="urlDetail.html_meta">
                  <div class="seo-sections">
                    <!-- Title -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Title</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.title || '(vacío)'"></div>
                      <div class="seo-meta-row mt-1">
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_pixel_width || 0) + 'px SERP'"></span>
                        <template x-if="urlDetail.html_meta.title_len > 60">
                          <span class="badge badge-cancelled">Demasiado largo</span>
                        </template>
                        <template x-if="urlDetail.html_meta.title_len && urlDetail.html_meta.title_len < 30">
                          <span class="badge badge-cancelled">Demasiado corto</span>
                        </template>
                      </div>
                    </div>

                    <!-- Meta Description -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Meta Description</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.meta_description || '(vacío)'"></div>
                      <div class="seo-meta-row mt-1">
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_pixel_width || 0) + 'px SERP'"></span>
                      </div>
                    </div>

                    <!-- Meta Keywords -->
                    <template x-if="urlDetail.html_meta.meta_keywords">
                      <div class="card mb-2">
                        <h3 class="seo-section-title">Meta Keywords</h3>
                        <div class="seo-value-box" x-text="urlDetail.html_meta.meta_keywords"></div>
                      </div>
                    </template>

                    <!-- Directivas -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Directivas</h3>
                      <div class="detail-grid cols-2">
                        <div class="detail-row"><span class="detail-label">Meta Robots</span><span class="detail-value" x-text="urlDetail.html_meta.meta_robots || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">X-Robots-Tag</span><span class="detail-value" x-text="urlDetail.html_meta.x_robots_tag || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical</span><span class="detail-value break-all" x-text="urlDetail.html_meta.canonical_href || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical (header)</span><span class="detail-value" x-text="urlDetail.html_meta.canonical_header || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Meta Refresh</span><span class="detail-value" x-text="urlDetail.html_meta.meta_refresh || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Meta fuera de head</span><span class="detail-value" x-text="urlDetail.html_meta.has_meta_outside_head ? 'Sí' : 'No'"></span></div>
                        <div class="detail-row"><span class="detail-label">rel=next</span><span class="detail-value" x-text="urlDetail.html_meta.rel_next || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">rel=prev</span><span class="detail-value" x-text="urlDetail.html_meta.rel_prev || '—'"></span></div>
                      </div>
                    </div>

                    <!-- Open Graph -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Open Graph</h3>
                      <div class="detail-grid cols-2">
                        <div class="detail-row"><span class="detail-label">og:title</span><span class="detail-value" x-text="urlDetail.html_meta.og_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:description</span><span class="detail-value" x-text="urlDetail.html_meta.og_description || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:image</span><span class="detail-value break-all" x-text="urlDetail.html_meta.og_image || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:url</span><span class="detail-value break-all" x-text="urlDetail.html_meta.og_url || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:type</span><span class="detail-value" x-text="urlDetail.html_meta.og_type || '—'"></span></div>
                      </div>
                    </div>

                    <!-- Twitter Cards -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Twitter Cards</h3>
                      <div class="detail-grid cols-2">
                        <div class="detail-row"><span class="detail-label">twitter:card</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_card || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:title</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:description</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_description || '—'"></span></div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: CONTENIDO ===== -->
            <template x-if="urlDetailTab === 'content'">
              <div class="card">
                <template x-if="urlDetail.page_content">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title m-0">Contenido principal extraido</h3>
                      <div class="flex items-center gap-1">
                        <span class="badge badge-pending" x-text="fmt.num(urlDetail.page_content.content_length) + ' caracteres'"></span>
                        <button class="btn btn-sm" :class="contentViewMode === 'markdown' ? 'btn-primary' : ''"
                          @click="contentViewMode = contentViewMode === 'markdown' ? 'text' : 'markdown'"
                          x-text="contentViewMode === 'markdown' ? 'Ver texto plano' : 'Ver Markdown'"></button>
                      </div>
                    </div>
                    <!-- Markdown rendered view -->
                    <template x-if="contentViewMode === 'markdown' && urlDetail.page_content.content_markdown">
                      <div class="markdown-body maxh-600px ovy-auto"
                        x-html="renderMarkdown(urlDetail.page_content.content_markdown)"></div>
                    </template>
                    <!-- Plain text fallback -->
                    <template x-if="contentViewMode !== 'markdown' || !urlDetail.page_content.content_markdown">
                      <div class="content-preview maxh-600px" x-text="urlDetail.page_content.content_text"></div>
                    </template>
                  </div>
                </template>
                <template x-if="!urlDetail.page_content">
                  <div class="empty">
                    <h3>Sin contenido</h3>
                    <p class="text-dim">No se pudo extraer el contenido principal de esta página</p>
                  </div>
                </template>
              </div>
            </template>

              <div class="card">
                <template x-if="urlDetail.headings && urlDetail.headings.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">

                  </div>

                      <table>
                        <thead>
                          <tr>
                            <th>URL Destino</th>
                            <th>Texto ancla</th>
                            <th>Posición</th>
                            <th>Tipo</th>
                            <th>Follow</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="l in urlDetail.outlinks" :key="l.id">
                            <tr>
                              <td class="maxw-350px" :title="l.to_url"><div class="truncate" x-text="l.to_url"></div></td>
                              <td class="maxw-200px" :title="l.anchor_text || ''"><div class="truncate" x-text="l.anchor_text || '—'"></div></td>
                              <td x-text="fmt.position(l.link_position)"></td>
                              <td x-text="l.link_type || '—'"></td>
                              <td :class="l.follow === false ? 'severity-warning' : ''" x-text="l.follow ? 'Sí' : l.follow === false ? 'No' : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!urlDetail.outlinks || urlDetail.outlinks.length === 0">
                    <div class="text-dim text-sm py-50 px-0">Sin outlinks</div>
                  </template>
                </div>

                <div class="card">
                  <div class="card-header">
                    <h2>Inlinks (enlaces entrantes)</h2>

                    <span class="badge badge-pending"
                          x-text="fmt.num(urlDetail.inlinks?.length || 0) + ((urlDetail.inlinks?.length || 0) >= 200 ? ' primeras filas: hay más' : ' filas')"></span>
                  </div>
                  <div class="text-sm text-dim mb-50" x-show="(urlDetail.inlinks?.length || 0) >= 200"
                       x-text="'La ficha trae como mucho 200 filas. El análisis cuenta ' + fmt.num(urlDetail.inlinks_count || 0) + ' enlaces internos que llegan aquí (por aparición). La lista entera, con filtros, en la pestaña Enlaces.'"></div>

                  <template x-if="urlDetail.inlinks && urlDetail.inlinks.length > 0">
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>URL origen</th>
                            <th>Texto ancla</th>
                            <th>Posición</th>
                            <th>Tipo</th>
                            <th>Follow</th>
                          </tr>
                        </thead>

                                <a x-show="l.from_url_id" :href="'#/rastreos/' + job.id + '/url/' + l.from_url_id" x-text="l.from_url || '—'"></a>
                                <span x-show="!l.from_url_id" x-text="l.from_url || '—'"></span></div></td>
                              <td class="maxw-200px" :title="l.anchor_text || ''"><div class="truncate" x-text="l.anchor_text || '—'"></div></td>
                              <td x-text="fmt.position(l.link_position)"></td>
                              <td x-text="l.link_type || '—'"></td>
                              <td :class="l.follow === false ? 'severity-warning' : ''" x-text="l.follow ? 'Sí' : l.follow === false ? 'No' : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!urlDetail.inlinks || urlDetail.inlinks.length === 0">
                    <div class="text-dim text-sm py-50 px-0"

                  </template>
                </div>
              </div>
            </template>

                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Tipo</th>
                            <th>URL</th>
                            <th>Alt</th>
                            <th>Dimensiones</th>
                            <th>Mixto</th>
                          </tr>
                        </thead>

            <!-- ===== TAB: PROBLEMAS ===== -->

                          <template x-if="ISSUE_INFO[g.tipo]">

                              <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[g.tipo].arreglo"></dd>
                            </dl>

                        </div>
                      </template>
                    </div>
                  </div>

                <template x-if="urlProblemas.length === 0">

                    <div class="security-checks">
                      <div class="security-item" :class="urlDetail.security.is_https ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.is_https ? '&#10003;' : '&#10007;'"></span>
                        <span>HTTPS</span>
                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_mixed_content ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_mixed_content ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin contenido mixto</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_hsts ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_hsts ? '&#10003;' : '&#10007;'"></span>
                        <span>Strict-Transport-Security (HSTS)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_csp ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_csp ? '&#10003;' : '&#10007;'"></span>
                        <span>Content-Security-Policy (CSP)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_content_type_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_content_type_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Content-Type-Options</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_frame_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_frame_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Frame-Options</span>
                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_unsafe_crossorigin ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_unsafe_crossorigin ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin crossorigin inseguro</span>
                      </div>
                      <template x-if="urlDetail.security.referrer_policy">
                        <div class="security-item check-pass">
                          <span class="check-icon">&#10003;</span>
                          <span>Referrer-Policy: <strong x-text="urlDetail.security.referrer_policy"></strong></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.security">
                  <div class="empty"><h3>Sin datos de seguridad</h3></div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: DATOS ESTRUCTURADOS ===== -->
            <template x-if="urlDetailTab === 'structured'">
              <div class="card">
                <template x-if="urlDetail.structured_data && urlDetail.structured_data.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title m-0">Datos estructurados</h3>
                      <span class="text-dim text-sm" x-text="urlDetail.structured_data.length + ' bloques'"></span>

                      <template x-for="s in urlDetail.structured_data" :key="s.id">
                        <div class="structured-item card mb-1 p-75">
                          <div class="flex items-center gap-1 mb-1">
                            <span class="badge badge-pending" x-text="s.format"></span>
                            <span class="badge" :class="({ok: 'badge-completed', error: 'badge-failed', warning: 'badge-cancelled', info: 'badge-info'})[s.validation_status] || 'badge-pending'"
                              x-text="s.validation_status || '—'"></span>
                            <template x-if="s.schema_type">
                              <span class="fw-500" x-text="s.schema_type"></span>
                            </template>
                          </div>
                          <template x-if="s.raw">
                            <div class="content-preview maxh-200px fs-sm" x-text="JSON.stringify(s.raw, null, 2)"></div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!urlDetail.structured_data || urlDetail.structured_data.length === 0">
                  <div class="empty"><h3>Sin datos estructurados</h3><p class="text-dim">No se encontraron JSON-LD, Microdata ni RDFa en esta página</p></div>

              </div>

          </div>
        </template>
      </div>

    <!-- ============================================================ -->
    <!--                  VISTA: EXPLORER (Screaming Frog)            -->
    <!-- ============================================================ -->
    <template x-if="view === 'explorer' && job">
      <div class="explorer" x-init="$nextTick(() => ajustarAltoExplorador())">

        <!-- Sidebar -->
        <div class="exp-sidebar">
          <!-- Vistas guardadas del cliente (#131) -->
          <template x-if="job.cliente_id">
            <div class="exp-vistas">
              <div class="exp-sidebar-titulo" style="border-top:0;margin-top:0">Vistas de <span x-text="job.cliente_nombre || 'este cliente'"></span></div>
              <template x-for="v in expVistas" :key="v.id">
                <div class="exp-vista">
                  <button type="button" class="exp-tab" @click="abrirVista(v)" :title="v.nombre">

                  </button>
                  <button type="button" class="exp-vista-borrar" @click="borrarVista(v)" :aria-label="'Borrar la vista ' + v.nombre" title="Borrar">&times;</button>
                </div>
              </template>
              <button type="button" class="exp-tab exp-vista-nueva" @click="guardarVista()">
                <i data-lucide="bookmark-plus" class="exp-tab-icon"></i><span>Guardar esta vista</span>
              </button>
            </div>
          </template>
          <div class="exp-sidebar-group">
            <template x-for="tab in EXP_TABS" :key="tab.key">
              <div>
                <template x-if="tab.divider">
                  <div class="exp-divider"></div>
                </template>
                <template x-if="tab.header">
                  <div class="exp-sidebar-titulo" x-text="tab.header"></div>
                </template>
                <template x-if="!tab.divider && !tab.header && (!tab.requiere || expAMedida.length)">
                  <button type="button" class="exp-tab" :class="expTab === tab.key && !expWp && 'active'" @click="setExplorerTab(tab.key)"
                          :title="tab.titulo || (tab.ambito ? (explorerAnalizado() ? 'Páginas con algún problema de ' + tab.label.toLowerCase() : 'Sin analizar: no hay problemas calculados') : '')">
                    <i :data-lucide="tab.icon" class="exp-tab-icon"></i>
                    <span x-text="tab.label"></span>
                    <!-- Contador en todas las entradas, tambien en los ambitos
                         (revision de UX del 25-oct, 3.4): «0» si no hay ninguna;
                         sin cifra mientras se cuenta, si no se pudo o, en los ambitos,
                         si el censo no esta analizado. -->
                    <span class="exp-tab-badge" x-text="expBadgeCounts[tab.key] != null ? fmt.num(expBadgeCounts[tab.key]) : ''"></span>
                    <template x-if="tab.ambito">
                      <span class="exp-tab-punto" :class="'p-' + gravedadDelAmbito(tab)"
                            :title="({error:'Hay errores', warning:'Hay avisos', info:'Solo info', ok:'Sin problemas'})[gravedadDelAmbito(tab)] || ''"></span>
                    </template>
                  </button>
                </template>
              </div>
            </template>
          </div>
          <!-- «Solo en WordPress» (decisión 168): lo que la REST API publica y
               el censo no tiene. Otra fuente que la tabla de URLs: panel propio. -->
          <template x-if="resumenWordPress(job) && resumenWordPress(job).abierta">
            <div class="exp-sidebar-group">
              <div class="exp-sidebar-titulo">WordPress</div>
              <button type="button" class="exp-tab" :class="expWp && 'active'" @click="abrirSoloWordPress('')" data-testid="exp-solo-wordpress">
                <i data-lucide="file-question" class="exp-tab-icon"></i>
                <span>Solo en WordPress</span>
              </button>
            </div>
          </template>
        </div>

        <!-- Main area -->
        <div class="exp-main" :class="expWp && 'con-wp'">

              <div class="exp-toolbar">
                <button class="exp-back" @click="cerrarSoloWordPress()"><i data-lucide="arrow-left" class="exp-wp-icono"></i><span>Volver a la tabla</span></button>
                <div class="exp-search-wrap">
                  <i data-lucide="search"></i>
                  <input type="text" class="exp-search" placeholder="Buscar en la URL..." x-model="wpSolo.buscar" @input="buscarSoloWordPress()">
                </div>
                <select class="exp-problema" :class="wpSolo.tipo && 'has-value'" aria-label="Filtrar por tipo de WordPress" @change="elegirTipoSoloWordPress($event.target.value)">

                  <template x-for="f in wp.filas" :key="f.tipo">
                    <option :value="f.tipo" :selected="wpSolo.tipo === f.tipo" x-text="f.nombre + (f.solo_wp != null ? ' · ' + fmt.num(f.solo_wp) : '')"></option>
                  </template>
                </select>
                <span class="exp-results-count" x-text="wpSolo.cargando ? 'Cargando…' : fmt.n(wpSolo.total, 'resultado', 'resultados')"></span>
              </div>
              <div class="exp-wp-cuerpo">
                <p class="text-sm text-dim">La REST API las publica y el censo no tiene ninguna fila con su URL (ni con el otro esquema). No es por sí solo un hallazgo: pueden estar fuera del alcance del rastreo, en un tipo sin página pública o colgar de páginas que el rastreo no llegó a ver.</p>
                <p class="text-sm text-orange" x-show="wp.no_afirmable" x-text="'En este censo no se afirma: ' + wp.no_afirmable + '.'"></p>
                <p class="text-sm text-red" x-show="wpSolo.error" x-text="wpSolo.error"></p>
                <div class="table-wrap"><table class="tbl wp-tabla">
                  <thead><tr><th>URL</th><th>Tipo</th><th>ID</th><th title="Si la URL pasa los filtros del rastreo">En el alcance</th><th>Modificada</th></tr></thead>
                  <tbody>
                    <template x-for="e in wpSolo.items" :key="e.tipo + ':' + e.id_externo">
                      <tr>
                        <td class="exp-wp-url"><a :href="e.url" target="_blank" rel="noopener" x-text="e.url || '(sin URL)'"></a></td>
                        <td :title="e.tipo" x-text="tipoWp(e.tipo)"></td>
                        <td x-text="e.id_externo ?? '—'"></td>
                        <td :class="e.en_alcance === false ? 'text-dim' : ''" x-text="e.en_alcance == null ? '—' : (e.en_alcance ? 'Sí' : 'No')"></td>
                        <td x-text="e.modificado ? String(e.modificado).slice(0, 10) : '—'"></td>
                      </tr>
                    </template>
                    <template x-if="!wpSolo.cargando && !wpSolo.items.length && !wpSolo.error">

                    </template>
                  </tbody>
                </table></div>
                <div class="exp-wp-paginas" x-show="wpSolo.pages > 1">

                  <span class="text-sm" x-text="'Página ' + wpSolo.page + ' de ' + wpSolo.pages"></span>
                  <button class="btn btn-sm" :disabled="wpSolo.page >= wpSolo.pages" @click="paginaSoloWordPress(wpSolo.page + 1)">Siguiente</button>
                </div>
              </div>
            </div>
          </template>

                </template>
              </optgroup>
              <optgroup label="Por ámbito SEO">
                <template x-for="tab in EXP_TABS.slice(EXP_TABS.findIndex(t => t.header) + 1)" :key="'m_' + tab.key">
                  <option :value="tab.key" :selected="expTab === tab.key && !expWp" x-text="textoVistaMovil(tab)"></option>

              <template x-if="expVistas.length">

                  <template x-for="v in expVistas" :key="'m_v' + v.id">
                    <option :value="'vista:' + v.id" x-text="v.nombre"></option>

              </template>

                    @change="setExpProblema($event.target.value)">

                   el desglose si tiene varias (revision de UX del 25-oct, 1.7;
                   decision 202). -->
              <template x-for="g in [['error','Errores'],['warning','Avisos'],['info','Info']]" :key="g[0]">

              <template x-if="expProblema && !(issuesResumen || []).some(r => r.issue_type === expProblema)">

          <!-- Una vista guardada con una regla a medida que este censo no tiene

          <template x-if="expAvisoRegla">

              <template x-if="explorerAnalizado()">

                </span>

                                     :disabled="['vacio','con_valor'].includes(expColumnFilters[col]?.op)"
                                     @input="expColumnFilterInput(col, { value: $event.target.value })">
                            </template>
                          </div>
                        </template>

                <template x-if="expUrlDetail">

                    <!-- Resumen SEO: lo primero que se busca al seleccionar una fila

                    <template x-if="expDetailTab === 'resumen'">
                      <dl class="exp-resumen">
                        <dt>Indexabilidad</dt>
                        <dd :class="expUrlDetail.indexable ? 'green' : (expUrlDetail.indexable === false ? 'orange' : '')"

                          <dt>Respuesta</dt>
                        </template>
                        <template x-if="expUrlDetail.response_class && expUrlDetail.response_class !== 'contenido'">
                          <dd class="orange" x-text="fmt.claseRespuesta(expUrlDetail.response_class)"></dd>
                        </template>
                        <dt>Título</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.title || '(sin título)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.title_pixel_width"
                                :class="expUrlDetail.html_meta?.title_pixel_width > 580 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.title_pixel_width + ' px' + (expUrlDetail.html_meta?.title_pixel_width > 580 ? ' (Google lo corta)' : '')"></span>
                        </dd>
                        <dt>Descripción</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.meta_description || '(sin descripción)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.meta_description_pixel_width"
                                :class="expUrlDetail.html_meta?.meta_description_pixel_width > 985 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.meta_description_pixel_width + ' px'"></span>
                        </dd>
                        <dt>H1</dt>
                        <dd x-text="((expUrlDetail.headings || []).filter(h => h.tag === 'h1' && !h.oculto).map(h => h.text).join(' · ')) || '(sin H1 visible)'"></dd>
                        <dt>Canonical</dt>
                        <dd class="truncate" :title="expUrlDetail.html_meta?.canonical_href || ''"

                        <dt>Robots</dt>
                        <dd x-text="[expUrlDetail.html_meta?.meta_robots, expUrlDetail.html_meta?.x_robots_tag && ('X-Robots-Tag: ' + expUrlDetail.html_meta.x_robots_tag)].filter(Boolean).join(' · ') || '—'"></dd>
                        <dt>Enlazado</dt>

                        <template x-if="(expUrlDetail.sitemaps || []).length">

                        <template x-if="(expUrlDetail.sitemaps || []).length">

                            <template x-for="(sm, n) in expUrlDetail.sitemaps" :key="'esm' + n">

                            </template>
                          </dd>

                        <template x-if="(expUrlDetail.wordpress || []).length">

                              <template x-if="g.detalles.length">

                        <template x-for="d in expAMedida" :key="d.key">

                    <!-- Content tab: full text + markdown -->

                          </div>
                        </template>
                        <template x-if="expUrlDetail.page_content?.content_text">
                          <div>
                            <div class="rotulo-accent">

                    <template x-if="expDetailTab === 'inlinks'">

                            <a href="#" @click.prevent="irAEnlaces(expUrlDetail.url_hash ? { destino_hash: expUrlDetail.url_hash } : { destino: expUrlDetail.url, exacto: true }, 'enlaces')">Ver quién la enlaza</a>

                                  <td :title="l.anchor_text || ''" class="maxw-200px">

                    <!-- Outlinks tab: full table -->
                    <template x-if="expDetailTab === 'outlinks'">
                      <div>

                              <tr>

                                <th class="w-200px">Anchor</th>
                                <th class="w-80px">Follow</th>
                                <th class="w-80px">Interno</th>
                                <th class="w-100px">Posición</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="l in expUrlDetail.outlinks" :key="l.id">
                                <tr>
                                  <td :title="l.to_url" class="maxw-380px">
                                    <div class="truncate" x-text="l.to_url"></div>
                                  </td>
                                  <td :title="l.anchor_text || ''" class="maxw-200px">
                                    <div class="truncate" x-text="l.anchor_text || '—'"></div>
                                  </td>
                                  <td x-text="l.follow === false ? 'nofollow' : 'follow'"></td>
                                  <td x-text="l.is_internal ? 'Sí' : 'No'"></td>

                      </div>
                    </template>

                    <!-- Problemas: uno por tipo con su gravedad mas alta y el

                    <template x-if="expDetailTab === 'issues'">
                      <div>
                        <template x-if="!expProblemasAgrupados().length">
                          <div class="text-dim py-50 px-0">Sin problemas detectados.</div>
                        </template>
                        <template x-if="expProblemasAgrupados().length">
                          <div class="issues-list">
                            <template x-for="g in expProblemasAgrupados()" :key="g.tipo">
                              <div class="issue-item" :class="'issue-' + g.severity">
                                <div class="issue-header">
                                  <span class="badge fs-sm" :class="'severity-' + g.severity" x-text="fmt.severity(g.severity)"></span>
                                  <span class="fw-600 fs-sm" x-text="fmt.issue(g.tipo)"></span>
                                  <span class="text-dim fs-sm" x-show="g.n > 1" x-text="'×' + fmt.num(g.n)"></span>
                                </div>
                                <div class="text-dim fs-sm pl-50" x-show="g.tipo === 'not_in_sitemap' && dudaSitemaps(job)" x-text="dudaSitemaps(job)"></div>
                                <template x-for="d in g.detalles" :key="d.texto">
                                  <div class="text-dim fs-sm pl-50" x-text="d.texto + (d.n > 1 ? ' (×' + fmt.num(d.n) + ')' : '')"></div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Resources tab -->
                    <template x-if="expDetailTab === 'resources'">
                      <div>
                        <template x-if="!expUrlDetail.resources || expUrlDetail.resources.length === 0">

                        </template>
                        <template x-if="expUrlDetail.resources && expUrlDetail.resources.length > 0">
                          <table class="table fs-sm">
                            <thead>
                              <tr>
                                <th>Recurso</th>
                                <th class="w-80px">Tipo</th>
                                <th style="width:160px">Alt</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="r in expUrlDetail.resources" :key="r.id">
                                <tr>
                                  <td :title="r.resource_url" class="maxw-380px">
                                    <div class="truncate" x-text="r.resource_url"></div>
                                  </td>
                                  <td x-text="r.resource_type"></td>
                                  <td :title="r.alt_text || ''" style="max-width:160px">
                                    <div class="truncate" x-text="r.alt_text || '—'"></div>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Structured data -->
                    <template x-if="expDetailTab === 'structured'">
                      <div>
                        <template x-if="!expUrlDetail.structured_data || expUrlDetail.structured_data.length === 0">
                          <div class="text-dim py-50 px-0">Sin datos estructurados.</div>
                        </template>
                        <template x-for="sd in expUrlDetail.structured_data" :key="sd.id">
                          <div class="mb-50">
                            <div class="fw-600 fs-sm c-accent mb-25">
                              <span x-text="sd.schema_type || '(sin tipo)'"></span>
                              <span class="text-dim" style="font-weight:400" x-text="'· ' + sd.format"></span>
                            </div>
                            <pre style="background:var(--bg-input);padding:.5rem;border-radius:3px;font-size:var(--fs-sm);max-height:200px;overflow:auto" x-text="JSON.stringify(sd.raw, null, 2)"></pre>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Hreflang -->
                    <template x-if="expDetailTab === 'hreflang'">
                      <div>
                        <template x-if="!expUrlDetail.hreflangs || expUrlDetail.hreflangs.length === 0">
                          <div class="text-dim py-50 px-0">Sin anotaciones hreflang.</div>
                        </template>
                        <template x-if="expUrlDetail.hreflangs && expUrlDetail.hreflangs.length > 0">
                          <table class="table fs-sm">
                            <thead>
                              <tr><th class="w-80px">Lang</th><th>Href</th><th class="w-100px">Return OK</th></tr>
                            </thead>
                            <tbody>
                              <template x-for="hl in expUrlDetail.hreflangs" :key="hl.id">
                                <tr>
                                  <td x-text="hl.lang"></td>
                                  <td :title="hl.href" class="maxw-380px"><div class="truncate" x-text="hl.href"></div></td>
                                  <td x-text="hl.return_tag_ok === true ? 'Sí' : hl.return_tag_ok === false ? 'No' : '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Status bar -->
          <div class="exp-statusbar">
            <span x-text="'Pág. ' + expPage + ' de ' + expPages"></span>
            <div class="exp-pager">
              <button :disabled="expPage <= 1" @click="setExpPage(1)">&#171;</button>
              <button :disabled="expPage <= 1" @click="setExpPage(expPage - 1)">&#8249;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPage + 1)">&#8250;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPages)">&#187;</button>
            </div>
          </div>

        </div>
      </div>
    </template>

    <!-- Cambios sin guardar (revision de UX del 25-oct, 3.5): una barra fija
         con un solo «Guardar» para lo editado en la ficha del cliente
         (configuracion, datos, integraciones, reglas) o en Ajustes. Antes cada
         seccion tenia su boton al final y salir no avisaba. El hueco evita que
         la barra tape lo ultimo de la pagina. -->
    <div class="barra-cambios-hueco" x-show="cambiosSinGuardar().length" aria-hidden="true"></div>
    <div class="barra-cambios" x-show="cambiosSinGuardar().length" x-transition.opacity role="region" aria-label="Cambios sin guardar" data-testid="barra-cambios">

      <span class="barra-cambios-texto" x-text="textoCambiosSinGuardar()"></span>

      <button class="btn btn-sm btn-primary" @click="guardarCambiosPendientes()" data-testid="guardar-cambios"
              :disabled="guardandoCambios || cfgClienteGuardando || (cambiosSinGuardar().some(x => x.id === 'config') && cfgHayErrores(cfgCliente))"
              x-text="guardandoCambios ? 'Guardando…' : 'Guardar'"></button>

  </main>
