                        <template x-if="expUrlDetail.inlinks && expUrlDetail.inlinks.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>URL origen</th>
                                <th style="width:200px">Anchor</th>
                                <th style="width:80px">Follow</th>
                                <th style="width:100px">Posición</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="l in expUrlDetail.inlinks" :key="l.id">
                                <tr>
                                  <td :title="l.from_url || ''" style="max-width:380px">
                                    <div class="truncate" x-text="l.from_url || '—'"></div>
                                  </td>
                                  <td :title="l.anchor_text || ''" style="max-width:200px">
                                    <div class="truncate" x-text="l.anchor_text || '—'"></div>
                                  </td>
                                  <td x-text="l.follow === false ? 'nofollow' : 'follow'"></td>
                                  <td x-text="l.link_position || '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Outlinks tab: full table -->
                    <template x-if="expDetailTab === 'outlinks'">
                      <div>
                        <template x-if="!expUrlDetail.outlinks || expUrlDetail.outlinks.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Esta URL no tiene enlaces salientes.</div>
                        </template>
                        <template x-if="expUrlDetail.outlinks && expUrlDetail.outlinks.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>URL destino</th>
                                <th style="width:200px">Anchor</th>
                                <th style="width:80px">Follow</th>
                                <th style="width:80px">Interno</th>
                                <th style="width:100px">Posición</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="l in expUrlDetail.outlinks" :key="l.id">
                                <tr>
                                  <td :title="l.to_url" style="max-width:380px">
                                    <div class="truncate" x-text="l.to_url"></div>
                                  </td>
                                  <td :title="l.anchor_text || ''" style="max-width:200px">
                                    <div class="truncate" x-text="l.anchor_text || '—'"></div>
                                  </td>
                                  <td x-text="l.follow === false ? 'nofollow' : 'follow'"></td>
                                  <td x-text="l.is_internal ? 'Sí' : 'No'"></td>
                                  <td x-text="l.link_position || '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Issues tab with details JSON -->
                    <template x-if="expDetailTab === 'issues'">
                      <div>
                        <template x-if="!expUrlDetail.issues || expUrlDetail.issues.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin problemas detectados.</div>
                        </template>
                        <template x-if="expUrlDetail.issues && expUrlDetail.issues.length > 0">
                          <div class="issues-list">
                            <template x-for="iss in expUrlDetail.issues" :key="iss.id">
                              <div class="issue-item" :class="'issue-' + iss.severity">
                                <div class="issue-header">
                                  <span class="badge" :class="'severity-' + iss.severity" x-text="fmt.severity(iss.severity)" style="font-size:.68rem"></span>
                                  <span style="font-weight:600;font-size:.8rem" x-text="fmt.issue(iss.issue_type)"></span>
                                </div>
                                <template x-if="iss.details && Object.keys(iss.details).length > 0">
                                  <div style="margin-top:.3rem;padding-left:.5rem;font-size:.72rem;color:var(--text-dim)">
                                    <template x-for="[k,v] in Object.entries(iss.details)" :key="k">
                                      <div><span style="font-weight:600" x-text="k + ':'"></span> <span x-text="String(v)"></span></div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Resources tab -->
                    <template x-if="expDetailTab === 'resources'">
                      <div>
                        <template x-if="!expUrlDetail.resources || expUrlDetail.resources.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin recursos asociados.</div>
                        </template>
                        <template x-if="expUrlDetail.resources && expUrlDetail.resources.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr>
                                <th>Recurso</th>
                                <th style="width:80px">Tipo</th>
                                <th style="width:160px">Alt</th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="r in expUrlDetail.resources" :key="r.id">
                                <tr>
                                  <td :title="r.resource_url" style="max-width:380px">
                                    <div class="truncate" x-text="r.resource_url"></div>
                                  </td>
                                  <td x-text="r.resource_type"></td>
                                  <td :title="r.alt_text || ''" style="max-width:160px">
                                    <div class="truncate" x-text="r.alt_text || '—'"></div>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                    <!-- Structured data -->
                    <template x-if="expDetailTab === 'structured'">
                      <div>
                        <template x-if="!expUrlDetail.structured_data || expUrlDetail.structured_data.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin datos estructurados.</div>
                        </template>
                        <template x-for="sd in expUrlDetail.structured_data" :key="sd.id">
                          <div style="margin-bottom:.5rem">
                            <div style="font-weight:600;font-size:.75rem;color:var(--accent);margin-bottom:.25rem">
                              <span x-text="sd.schema_type || '(sin tipo)'"></span>
                              <span class="text-dim" style="font-weight:400" x-text="'· ' + sd.format"></span>
                            </div>
                            <pre style="background:var(--bg-input);padding:.5rem;border-radius:3px;font-size:.72rem;max-height:200px;overflow:auto" x-text="JSON.stringify(sd.raw, null, 2)"></pre>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Hreflang -->
                    <template x-if="expDetailTab === 'hreflang'">
                      <div>
                        <template x-if="!expUrlDetail.hreflangs || expUrlDetail.hreflangs.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Sin anotaciones hreflang.</div>
                        </template>
                        <template x-if="expUrlDetail.hreflangs && expUrlDetail.hreflangs.length > 0">
                          <table class="table" style="font-size:.75rem">
                            <thead>
                              <tr><th style="width:80px">Lang</th><th>Href</th><th style="width:100px">Return OK</th></tr>
                            </thead>
                            <tbody>
                              <template x-for="hl in expUrlDetail.hreflangs" :key="hl.id">
                                <tr>
                                  <td x-text="hl.lang"></td>
                                  <td :title="hl.href" style="max-width:380px"><div class="truncate" x-text="hl.href"></div></td>
                                  <td x-text="hl.return_tag_ok === true ? 'Sí' : hl.return_tag_ok === false ? 'No' : '—'"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>

                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Status bar -->
          <div class="exp-statusbar">
            <span x-text="'Pág. ' + expPage + ' de ' + expPages"></span>
            <div class="exp-pager">
              <button :disabled="expPage <= 1" @click="setExpPage(1)">&#171;</button>
              <button :disabled="expPage <= 1" @click="setExpPage(expPage - 1)">&#8249;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPage + 1)">&#8250;</button>
              <button :disabled="expPage >= expPages" @click="setExpPage(expPages)">&#187;</button>
            </div>
          </div>

        </div>
      </div>
    </template>

  </main>
</div>


<!-- ===== MODAL: CREAR NUEVO RASTREO ===== -->
<template x-if="showCreate">
  <div class="modal-backdrop" @click.self="showCreate = false" @keydown.escape.window="showCreate = false">
    <div class="modal modal--wide">
      <div class="modal-header">
        <div>
          <h3 style="display:flex;align-items:center;gap:.4rem">
            <i data-lucide="radar" style="width:18px;height:18px;color:#5BAE23"></i> Nuevo rastreo
          </h3>
          <p class="text-dim text-sm" style="margin-top:.25rem">Configura y lanza un rastreo SEO completo de un sitio web</p>
        </div>
        <button class="btn-icon" @click="showCreate = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body">
        <template x-if="createError">
          <div class="card mb-2" style="border-color:var(--red);color:var(--red);padding:.5rem .75rem;font-size:.85rem" x-text="createError"></div>
        </template>

        <!-- El cliente se elige, no se escribe: con texto libre una errata
             creaba otro cliente (#36). Al elegirlo, el formulario se precarga
             con su configuracion y la del perfil. -->
        <div class="form-row">
          <div class="form-group">
            <label>Cliente</label>
            <select x-model="createForm.cliente_id" @change="cambiarClienteModal()">
              <option value="">Sin cliente</option>
              <template x-for="c in clientes" :key="c.id">
                <option :value="c.id" x-text="c.nombre" :selected="c.id === createForm.cliente_id"></option>
              </template>
              <option value="__nuevo__">Nuevo cliente…</option>
            </select>
          </div>
          <div class="form-group" x-show="createForm.cliente_id">
            <label>Perfil de rastreo</label>
            <select x-model="createForm.profile_id" @change="aplicarHerencia()">
              <option value="">Rastreo puntual (sin perfil)</option>
              <template x-for="p in createPerfiles" :key="p.id">
                <option :value="p.id" :selected="p.id === createForm.profile_id"
                        x-text="p.nombre + (p.rol === 'competidor' ? ' (competidor)' : '')"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="form-hint" x-show="createForm.cliente_id" style="margin:-.4rem 0 .8rem">
          La configuracion viene precargada con la del cliente y la del perfil. Lo que cambies aqui
          solo vale para este rastreo; lo que el formulario no muestra (plantillas, umbrales extra)
          se hereda igual.
        </div>

        <!-- Campos siempre visibles -->
        <div class="form-group">
          <label>Nombre del trabajo *</label>
          <input type="text" x-model="createForm.name" placeholder="Ej: midominio.com - auditoria completa">
        </div>
        <div class="form-group">
          <label>URLs semilla * (una por linea)</label>
          <textarea x-model="createForm.seeds" placeholder="https://midominio.com" rows="3"></textarea>
        </div>
        <!-- Lo tecnico, plegado (UX-19): seis pestanas de spider, HTTP y
             velocidad delante de quien solo quiere lanzar el censo de un
             cliente con su perfil. El resumen dice lo que se va a usar. -->
        <details class="config-avanzada" :open="!createForm.cliente_id">
          <summary>
            <span>Configuración avanzada</span>
            <span class="text-dim text-sm" x-text="resumenConfig()"></span>
          </summary>
        <!-- Barra de pestanas -->
        <div class="config-tabs">
          <button type="button" class="tab" :class="createForm.configTab === 'general' && 'active'" @click="createForm.configTab = 'general'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="settings" style="width:13px;height:13px"></i> General
          </button>
          <button type="button" class="tab" :class="createForm.configTab === 'spider' && 'active'" @click="createForm.configTab = 'spider'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="bug" style="width:13px;height:13px"></i> Spider
          </button>
          <button type="button" class="tab" :class="createForm.configTab === 'content' && 'active'" @click="createForm.configTab = 'content'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="file-text" style="width:13px;height:13px"></i> Contenido
          </button>
          <button type="button" class="tab" :class="createForm.configTab === 'speed' && 'active'" @click="createForm.configTab = 'speed'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="gauge" style="width:13px;height:13px"></i> Velocidad
          </button>
          <button type="button" class="tab" :class="createForm.configTab === 'http' && 'active'" @click="createForm.configTab = 'http'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="globe" style="width:13px;height:13px"></i> HTTP
          </button>
          <button type="button" class="tab" :class="createForm.configTab === 'analysis' && 'active'" @click="createForm.configTab = 'analysis'" style="display:flex;align-items:center;gap:.3rem">
            <i data-lucide="bar-chart-2" style="width:13px;height:13px"></i> Análisis
          </button>
        </div>

        <!-- ===== TAB: General ===== -->
        <div x-show="createForm.configTab === 'general'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="sliders-horizontal" style="width:14px;height:14px;opacity:.6"></i> Límites de rastreo
          </div>
          <div class="form-row">
            <div class="form-group">
              <label data-tip="0 = modo lista: solo las semillas, sin seguir enlaces ni leer el sitemap (QA de despliegues; veredicto en /api/jobs/{id}/veredicto)">Profundidad máxima</label>
              <input type="number" x-model="createForm.max_depth" min="0" max="1000"
                     @change="if (parseInt(createForm.max_depth) === 0) createForm.use_sitemap = false">
            </div>
            <div class="form-group">
              <label>Máximo de URLs</label>
              <input type="number" x-model="createForm.max_urls" min="1" max="5000000">
            </div>
          </div>
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="zap" style="width:14px;height:14px;opacity:.6"></i> Concurrencia
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Peticiones concurrentes</label>
              <input type="number" x-model="createForm.concurrent_requests" min="1" max="256">
            </div>
            <div class="form-group">
              <label>Por dominio</label>
              <input type="number" x-model="createForm.concurrent_requests_per_domain" min="1" max="64">
            </div>
          </div>
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="shield" style="width:14px;height:14px;opacity:.6"></i> Identidad del crawler
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>User Agent</label>
              <select x-model="createForm.user_agent_preset">
                <option value="chrome_win">Chrome - Windows (recomendado)</option>
                <option value="chrome_mac">Chrome - macOS</option>
                <option value="safari_mac">Safari - macOS</option>
                <option value="firefox_win">Firefox - Windows</option>
                <option value="edge_win">Edge - Windows</option>
                <optgroup label="Buscadores">
                  <option value="googlebot_mobile">Googlebot smartphone</option>
                  <option value="googlebot">Googlebot escritorio (cadena antigua)</option>
                  <option value="bingbot">Bingbot</option>
                </optgroup>
                <optgroup label="Asistentes de IA">
                  <option value="gptbot">GPTBot (OpenAI, entrenamiento)</option>
                  <option value="oai_searchbot">OAI-SearchBot (búsqueda de ChatGPT)</option>
                  <option value="claudebot">ClaudeBot (Anthropic)</option>
                  <option value="perplexitybot">PerplexityBot</option>
                </optgroup>
                <option value="custom">Personalizado</option>
              </select>
            </div>
            <div class="form-group">
              <label>Huella TLS (anti-WAF)</label>
              <select x-model="createForm.impersonate">
                <option value="chrome124">Chrome (recomendado)</option>
                <option value="safari17_0">Safari</option>
                <option value="edge101">Edge</option>
              </select>
            </div>
          </div>
          <div class="form-group" x-show="createForm.user_agent_preset === 'custom'">
            <label>User Agent personalizado</label>
            <input type="text" x-model="createForm.user_agent_custom" placeholder="Mozilla/5.0 ...">
          </div>
          <div class="form-hint aviso-ua-bot" x-show="botDelFormulario()" style="margin-bottom:.5rem">
            <strong>Te haces pasar por <span x-text="botDelFormulario()"></span>.</strong>
            robots.txt se evalúa con este User Agent: se aplican las reglas del grupo
            <code x-text="'User-agent: ' + botDelFormulario()"></code> (o las de <code>*</code> si no hay), no las de un navegador.
            Y la petición sale con huella TLS de navegador (y desde nuestra IP, no la del proveedor): un WAF que verifica bots
            ve un bot falso y puede bloquearlo o servirle otra cosa. Si las cifras salen raras, compáralo con un rastreo con UA de Chrome.
          </div>
          <div class="form-hint" style="margin-bottom:.75rem">El User Agent y la huella TLS se envian juntos. Para maxima eficacia, usa el mismo navegador en ambos (ej: Chrome + Chrome)</div>
          <div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center">
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.follow_external"> Seguir externos</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.render_js"> Renderizar JS</label>
            <label class="checkbox-label" data-tip="Lee robots.txt y sitemap.xml, rastrea las URLs listadas y detecta huérfanas (en sitemap sin enlaces) y páginas indexables ausentes del sitemap"><input type="checkbox" x-model="createForm.use_sitemap"> Usar sitemap.xml</label>
          </div>
          <div class="form-group" style="margin-top:.75rem">
            <label>Robots.txt</label>
            <select x-model="createForm.robots_mode">
              <option value="respect">Respetar (no entrar en URLs bloqueadas)</option>
              <option value="ignore">Ignorar (no leer robots.txt)</option>
              <option value="audit">Ignorar pero auditar (crawlear todo y reportar qué bloquearía)</option>
            </select>
          </div>
        </div>

        <!-- ===== TAB: Spider ===== -->
        <div x-show="createForm.configTab === 'spider'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="layers" style="width:14px;height:14px;opacity:.6"></i> Tipos de recurso
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;margin-bottom:1rem">
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_images"> Imagenes</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_css"> CSS</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_js"> JavaScript</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_pdfs"> PDFs</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_fonts"> Fuentes</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_svg"> SVG</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_other"> Otros</label>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="compass" style="width:14px;height:14px;opacity:.6"></i> Comportamiento
          </div>
          <div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem">
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.crawl_subdomains"> Rastrear subdominios</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.follow_nofollow"> Seguir nofollow</label>
          </div>
          <!-- Sondas fuera del censo: paridad movil (119), enlaces externos
               (123) y recursos embebidos (124). Apagadas de serie: multiplican
               las peticiones. Las de 123/124 solo se mandan si se tocan. -->
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="radar" style="width:14px;height:14px;opacity:.6"></i> Sondas fuera del censo
          </div>
          <p class="text-sm text-dim" style="margin:0 0 .5rem" data-testid="sondas-aviso">
            Piden URLs que no son del censo y no cuentan para el máximo de URLs:
            cada una es una petición más al sitio (o a un tercero). Respetan el
            robots.txt de cada host y no llevan cabeceras, cookies ni credenciales del rastreo.
          </p>
          <div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:.5rem">
            <label class="checkbox-label" title="Pide con HEAD (y GET si hace falta) cada URL de otro sitio que enlaza el sitio, para avisar de enlaces externos rotos y dominios muertos. A diferencia de «Seguir externos», que mete las páginas externas en el censo."><input type="checkbox" x-model="createForm.comprobar_enlaces_externos" data-testid="sonda-enlaces"> Comprobar enlaces externos</label>
            <label class="checkbox-label" title="Pide con HEAD las imágenes, CSS y JS del propio sitio que la página carga y el censo no rastrea, para avisar de recursos rotos y anotar su peso."><input type="checkbox" x-model="createForm.comprobar_recursos" data-testid="sonda-recursos"> Comprobar recursos embebidos</label>
            <label class="checkbox-label" title="Comprueba también las imágenes, CSS y JS que la página carga de OTROS hosts (un CDN, un script de terceros), con el mismo tope que los recursos."><input type="checkbox" x-model="createForm.check_external_resources"> Recursos de otros hosts</label>
          </div>
          <div class="form-row-3" x-show="createForm.comprobar_enlaces_externos || createForm.comprobar_recursos || createForm.check_external_resources">
            <div class="form-group" x-show="createForm.comprobar_enlaces_externos">
              <label title="URLs externas distintas que se comprueban como mucho">Enlaces externos: tope</label>
              <input type="number" x-model="createForm.enlaces_externos_max" min="0" max="100000">
            </div>
            <div class="form-group" x-show="createForm.comprobar_recursos || createForm.check_external_resources">
              <label title="Recursos distintos (internos y externos) que se comprueban como mucho">Recursos: tope</label>
              <input type="number" x-model="createForm.recursos_max" min="0" max="500000">
            </div>
            <div class="form-group">
              <label title="URLs como mucho por host externo, enlaces y recursos juntos. 0 = sin tope">Por host externo (0 = sin tope)</label>
              <input type="number" x-model="createForm.sondas_por_host" min="0" max="10000">
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label title="Páginas que se vuelven a pedir con el perfil móvil (o escritorio, si el UA ya es de móvil) para compararlas. 0 = apagado">Paridad móvil: páginas (0 = no)</label>
              <input type="number" x-model="createForm.paridad_movil_muestra" min="0" max="500">
            </div>
            <div class="form-group">
              <label>Por plantilla</label>
              <input type="number" x-model="createForm.paridad_movil_por_plantilla" min="1" max="50">
            </div>
            <div class="form-group">
              <label title="Con Googlebot desde nuestra IP, un WAF que verifica bots puede bloquearlo o servirle otra cosa (decisión 98)">UA móvil</label>
              <select x-model="createForm.paridad_movil_ua">
                <option value="chrome_android">Chrome Android</option>
                <option value="googlebot_smartphone">Googlebot smartphone</option>
              </select>
            </div>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="filter" style="width:14px;height:14px;opacity:.6"></i> Filtros de URL
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Longitud maxima URL (0 = sin limite)</label>
              <input type="number" x-model="createForm.max_url_length" min="0" max="10000">
            </div>
            <div class="form-group">
              <label>Profundidad de carpetas max (0 = sin limite)</label>
              <input type="number" x-model="createForm.max_folder_depth" min="0" max="100">
            </div>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="regex" style="width:14px;height:14px;opacity:.6"></i> Patrones
          </div>
          <div class="form-group">
            <label>Patrones de exclusion (uno por linea)</label>
            <textarea x-model="createForm.exclude_patterns" rows="2" placeholder="Ej: /admin/*&#10;*.pdf"></textarea>
          </div>
          <div class="form-group">
            <label>Patrones de inclusion (uno por linea)</label>
            <textarea x-model="createForm.include_patterns" rows="2" placeholder="Ej: /blog/*"></textarea>
          </div>
        </div>

        <!-- ===== TAB: Contenido ===== -->
        <div x-show="createForm.configTab === 'content'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="database" style="width:14px;height:14px;opacity:.6"></i> Extraccion de datos
          </div>
          <div style="display:flex;flex-direction:column;gap:.5rem">
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.extract_structured_data"> Datos estructurados (JSON-LD, Microdata)</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.extract_hreflang"> Etiquetas hreflang</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.extract_security_headers"> Cabeceras de seguridad</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.extract_page_content"> Contenido de pagina (texto + markdown)</label>
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.store_raw_html"> Almacenar HTML crudo</label>
          </div>
        </div>

        <!-- ===== TAB: Velocidad ===== -->
        <div x-show="createForm.configTab === 'speed'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="timer" style="width:14px;height:14px;opacity:.6"></i> Tiempos y reintentos
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label>Timeout descarga (s)</label>
              <input type="number" x-model="createForm.download_timeout" min="5" max="120">
            </div>
            <div class="form-group">
              <label>Reintentos</label>
              <input type="number" x-model="createForm.retry_count" min="0" max="10">
            </div>
            <div class="form-group">
              <label>Delay entre peticiones (s)</label>
              <input type="number" x-model="createForm.request_delay" min="0" max="30" step="0.5">
            </div>
          </div>
          <div class="form-group">
            <label>Tiempo maximo del crawl (horas)</label>
            <input type="number" x-model="createForm.max_runtime_hours" min="1" max="72">
            <div class="form-hint">Si el crawl no termina en este tiempo, se marca como fallido. Por defecto 6h, máximo 72h.</div>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="activity" style="width:14px;height:14px;opacity:.6"></i> AutoThrottle
          </div>
          <div style="display:flex;flex-direction:column;gap:.5rem">
            <label class="checkbox-label"><input type="checkbox" x-model="createForm.autothrottle_enabled"> Habilitar autothrottle</label>
          </div>
          <div class="form-group" style="margin-top:.75rem" x-show="createForm.autothrottle_enabled">
            <label>Concurrencia objetivo</label>
            <input type="number" x-model="createForm.autothrottle_target_concurrency" min="1" max="100" step="0.5">
            <div class="form-hint">Número de peticiones simultaneas que el autothrottle intentara mantener</div>
          </div>
        </div>

        <!-- ===== TAB: HTTP ===== -->
        <div x-show="createForm.configTab === 'http'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="file-code" style="width:14px;height:14px;opacity:.6"></i> Cabeceras personalizadas
          </div>
          <div class="form-group">
            <label>Headers (uno por linea, formato "Nombre: Valor")</label>
            <textarea x-model="createForm.custom_headers" rows="3" placeholder="X-Custom-Header: valor&#10;Cache-Control: no-cache"></textarea>
          </div>

          <div class="form-group">
            <label>Accept-Language</label>
            <input type="text" x-model="createForm.accept_language" placeholder="Ej: es-ES,es;q=0.9,en;q=0.8">
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="cookie" style="width:14px;height:14px;opacity:.6"></i> Cookies
          </div>
          <div class="form-group">
            <label>Cookies (una por linea, formato "nombre=valor")</label>
            <textarea x-model="createForm.cookies" rows="3" placeholder="session_id=abc123&#10;lang=es"></textarea>
          </div>
          <div style="margin-bottom:1rem">
            <label class="checkbox-label" title="Por defecto no, como Googlebot. Las cookies de arriba se mandan siempre, y solo a los hosts de las semillas."><input type="checkbox" x-model="createForm.conservar_cookies"> Guardar las cookies que pone el sitio entre páginas</label>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="lock" style="width:14px;height:14px;opacity:.6"></i> Autenticacion basica
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Usuario</label>
              <input type="text" x-model="createForm.basic_auth_user" placeholder="usuario">
            </div>
            <div class="form-group">
              <label>Contrasena</label>
              <input type="text" x-model="createForm.basic_auth_password" placeholder="contrasena">
            </div>
          </div>
        </div>

        <!-- ===== TAB: Analisis ===== -->
        <div x-show="createForm.configTab === 'analysis'" style="margin-top:1rem">
          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="type" style="width:14px;height:14px;opacity:.6"></i> Título
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Longitud minima</label>
              <input type="number" x-model="createForm.title_min_length" min="0" max="200">
            </div>
            <div class="form-group">
              <label>Longitud máxima</label>
              <input type="number" x-model="createForm.title_max_length" min="1" max="500">
            </div>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="align-left" style="width:14px;height:14px;opacity:.6"></i> Meta descripción
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Longitud minima</label>
              <input type="number" x-model="createForm.description_min_length" min="0" max="500">
            </div>
            <div class="form-group">
              <label>Longitud máxima</label>
              <input type="number" x-model="createForm.description_max_length" min="1" max="1000">
            </div>
          </div>

          <div class="config-section" style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="text-cursor-input" style="width:14px;height:14px;opacity:.6"></i> Contenido y enlaces
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label>Palabras minimas</label>
              <input type="number" x-model="createForm.min_word_count" min="0" max="10000">
            </div>
            <div class="form-group">
              <label>Max cadena redirecciones</label>
              <input type="number" x-model="createForm.max_redirect_chain_length" min="1" max="20">
            </div>
            <div class="form-group">
              <label>Max enlaces salientes</label>
              <input type="number" x-model="createForm.max_outlinks" min="1" max="10000">
            </div>
          </div>
        </div>

        </details>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showCreate = false">Cancelar</button>
        <!-- El canario antes que el censo: 250 URLs para ver si el sitio
             bloquea, si hace falta render y cuanto tarda (crawl-domains). -->
        <button class="btn" @click="lanzarCanario()" :disabled="creating || !createForm.seeds"
                data-tip="Lanza primero 250 URLs para comprobar bloqueos, render y ritmo antes del censo"
                style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="bird" style="width:14px;height:14px"></i> Lanzar canario
        </button>
        <button class="btn btn-primary" @click="submitCreate()" :disabled="creating || !createForm.name || !createForm.seeds" style="display:flex;align-items:center;gap:.4rem">
          <template x-if="creating"><span class="spinner" style="width:14px;height:14px"></span></template>
          <i data-lucide="rocket" style="width:14px;height:14px" x-show="!creating"></i>
          Iniciar rastreo
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: IMPORTAR BACKUP ===== -->
<template x-if="showImportModal">
  <div class="modal-backdrop" @click.self="showImportModal = false" @keydown.escape.window="showImportModal = false">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3 style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="upload" style="width:18px;height:18px;color:var(--accent)"></i>
          Importar backup
        </h3>
        <button class="btn-icon" @click="showImportModal = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem">
        <p class="text-dim text-sm" style="margin-bottom:1rem">
          Selecciona un archivo ZIP generado con la funcion "Backup" para restaurar un rastreo completo con todos sus datos.
        </p>

        <label class="form-label">Archivo ZIP</label>
        <input type="file" accept=".zip" @change="importFile = $event.target.files[0]"
               class="form-input" style="padding:.4rem">

        <label class="form-label mt-2" style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
          <input type="checkbox" x-model="importPreserveId">
          Conservar el ID original del job
        </label>
        <p class="text-dim text-sm" style="margin-top:.25rem">
          Si esta activo y ya existe un job con el mismo ID, la importacion fallara (409).
        </p>

        <template x-if="importError">
          <div class="text-sm mt-2" style="color:var(--red)" x-text="importError"></div>
        </template>

        <template x-if="importResult">
          <div class="card mt-2" style="background:var(--green-bg);border-color:var(--green);padding:.75rem">
            <p style="font-weight:600;color:var(--green);margin-bottom:.5rem">Importacion completada</p>
            <p class="text-sm">URLs importadas: <strong x-text="importResult.rows_imported.urls || 0"></strong></p>
            <template x-if="importResult.warnings && importResult.warnings.length > 0">
              <details class="mt-1">
                <summary class="text-sm text-dim" style="cursor:pointer" x-text="importResult.warnings.length + ' advertencias'"></summary>
                <ul class="text-sm" style="margin-top:.25rem;padding-left:1rem">
                  <template x-for="w in importResult.warnings.slice(0, 20)">
                    <li x-text="w" class="text-dim"></li>
                  </template>
                </ul>
              </details>
            </template>
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="closeImportModal()">Cerrar</button>
        <button class="btn btn-primary" @click="submitImport()" :disabled="importing || !importFile || importResult"
                style="display:flex;align-items:center;gap:.4rem">
          <template x-if="importing"><span class="spinner" style="width:14px;height:14px"></span></template>
          <i data-lucide="upload" style="width:14px;height:14px" x-show="!importing"></i>
          Importar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: REANUDAR JOB ===== -->
<template x-if="showResumeModal">
  <div class="modal-backdrop" @click.self="showResumeModal = false" @keydown.escape.window="showResumeModal = false">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3 style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="play-circle" style="width:18px;height:18px;color:var(--accent)"></i>
          Reanudar rastreo
        </h3>
        <button class="btn-icon" @click="showResumeModal = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem">
        <p class="text-dim text-sm" style="margin-bottom:1rem">
          Las URLs ya rastreadas se preservan. El crawler continuara desde la frontera descubierta. Puedes ajustar los parámetros mas relevantes antes de relanzar.
        </p>

        <div class="form-group">
          <label>Tiempo maximo (horas)</label>
          <input type="number" x-model="resumeForm.max_runtime_hours" min="1" max="72">
          <div class="form-hint">Si el crawl no termina en este tiempo, se marca como fallido.</div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label class="checkbox-label">
            <input type="checkbox" x-model="resumeForm.autothrottle_enabled">
            Habilitar autothrottle
          </label>
          <div class="form-hint">Desactivalo si tienes IP whitelisteada y quieres exprimir la concurrencia.</div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label>Concurrencia por dominio</label>
          <input type="number" x-model="resumeForm.concurrent_requests_per_domain" min="1" max="64">
          <div class="form-hint">Sin autothrottle, este es el techo real. Con whitelist, 16-32 es seguro.</div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label>Concurrencia global</label>
          <input type="number" x-model="resumeForm.concurrent_requests" min="1" max="256">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showResumeModal = false">Cancelar</button>
        <button class="btn btn-primary" @click="confirmResume()" :disabled="resuming"
                style="display:flex;align-items:center;gap:.4rem">
          <template x-if="resuming"><span class="spinner" style="width:14px;height:14px"></span></template>
          <i data-lucide="play-circle" style="width:14px;height:14px" x-show="!resuming"></i>
          Reanudar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: ANALISIS ENRIQUECIDO (#40) ===== -->
<template x-if="enriqAbierto">
  <div class="modal-backdrop" @click.self="enriqAbierto = false" @keydown.escape.window="enriqAbierto = false">
    <div class="modal" style="max-width:40rem">
      <div class="modal-header">
        <h3 style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="sparkles" style="width:18px;height:18px;color:var(--accent)"></i>
          Análisis enriquecido
        </h3>
        <button class="btn-icon" @click="enriqAbierto = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem">
        <p class="text-dim text-sm" style="margin-bottom:1rem">
          Pregunta a un modelo de pago sobre las URLs de este rastreo. Antes de lanzar ves cuánto costaría;
          lo que ya se preguntó en otra ejecución sale de la caché y no se vuelve a pagar.
        </p>

        <div class="form-group">
          <label>Módulos</label>
          <template x-for="m in enriqCatalogo" :key="m.nombre">
            <div style="margin:.3rem 0">
              <label class="checkbox-label">
                <input type="checkbox" :checked="enriqForm.modulos.includes(m.nombre)"
                       @change="alternarModuloEnriq(m.nombre, $el.checked)">
                <span x-text="m.titulo"></span>
              </label>
              <div class="form-hint" x-text="m.descripcion"></div>
              <div class="form-hint" x-show="m.depende_de.length" x-text="'Necesita: ' + m.depende_de.join(', ') + ' (se añade solo)'"></div>
            </div>
          </template>
          <div class="form-hint" x-show="enriqEstimacion && enriqEstimacion.anadidos.length"
               x-text="'Añadidos por dependencia: ' + (enriqEstimacion ? enriqEstimacion.anadidos.join(', ') : '')"></div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label>Alcance</label>
          <select x-model="enriqForm.tipo" @change="estimarEnriquecido()">
            <option value="todas">Todas las HTML internas, 200 e indexables</option>
            <option value="carpeta">Solo una carpeta</option>
            <option value="max">Un máximo de URLs (por orden de rastreo)</option>
            <option value="muestra">Modo muestra (repartida por todo el sitio)</option>
          </select>
          <template x-if="enriqForm.tipo === 'carpeta'">
            <input type="text" x-model="enriqForm.carpeta" placeholder="/blog/" @change="estimarEnriquecido()" style="margin-top:.4rem">
          </template>
          <template x-if="['max','muestra'].includes(enriqForm.tipo)">
            <input type="number" min="1" x-model="enriqForm.max_urls" @change="estimarEnriquecido()" style="margin-top:.4rem">
          </template>
        </div>

        <div class="card" style="margin-top:.75rem;padding:.75rem 1rem">
          <template x-if="enriqEstimando"><div class="text-dim text-sm">Estimando…</div></template>
          <template x-if="enriqEstimacion && !enriqEstimando">
            <div class="text-sm" style="display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;font-variant-numeric:tabular-nums">
              <span>URLs en el alcance</span><strong x-text="fmt.num(enriqEstimacion.urls)"></strong>
              <span>Llamadas (después de la caché)</span><strong x-text="fmt.num(enriqEstimacion.llamadas)"></strong>
              <span>Ya en caché, no se repagan</span><strong x-text="fmt.num(enriqEstimacion.aciertos_cache) + ' de ' + fmt.num(enriqEstimacion.decisiones)"></strong>
              <span>Tokens estimados</span><strong x-text="fmt.num(enriqEstimacion.tokens_estimados)"></strong>
              <span>Coste estimado</span><strong x-text="fmt.usd(enriqEstimacion.coste_estimado_usd)"></strong>
              <span>Tiempo estimado</span><strong x-text="fmt.duracion(enriqEstimacion.segundos_estimados)"></strong>
              <template x-if="enriqEstimacion.cliente">
                <span x-text="'Gasto del mes de ' + (enriqEstimacion.cliente.nombre || 'el cliente')"></span>
              </template>
              <template x-if="enriqEstimacion.cliente">
                <strong x-text="fmt.usd(enriqEstimacion.cliente.gastado_mes_usd) + ' de ' + (enriqEstimacion.cliente.tope_mensual_usd == null ? 'sin tope' : fmt.usd(enriqEstimacion.cliente.tope_mensual_usd))"></strong>
              </template>
              <span>Gasto del mes de la instancia</span>
              <strong x-text="fmt.usd(enriqEstimacion.global.gastado_mes_usd) + ' de ' + (enriqEstimacion.global.tope_mensual_usd == null ? 'sin tope' : fmt.usd(enriqEstimacion.global.tope_mensual_usd))"></strong>
            </div>
          </template>
          <div class="form-hint" style="margin-top:.4rem">
            Estimación por caracteres; el coste real sale de lo que cobra OpenRouter y la ejecución se para en seco al llegar al presupuesto.
          </div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label>Presupuesto máximo de esta ejecución ($)</label>
          <input type="number" min="0" step="0.01" x-model="enriqForm.presupuesto">
          <div class="form-hint">Al llegar aquí se para y queda «parcial» con lo hecho guardado. Por defecto, la estimación más un 50%.</div>
        </div>

        <div class="form-group" style="margin-top:.75rem">
          <label>Token de lanzamiento</label>
          <input type="password" x-model="enriqToken" autocomplete="off" placeholder="ENRICHMENT_TOKEN del servidor">
          <div class="form-hint">Se guarda solo en esta pestaña del navegador (sessionStorage) y se borra al cerrarla.</div>
        </div>
        <template x-if="!enriqLanzable">
          <div class="card" style="border-left:3px solid var(--orange);padding:.6rem .8rem;font-size:.82rem">
            El lanzamiento está desactivado en este servidor: falta <code>ENRICHMENT_TOKEN</code>. Puedes estimar, pero no lanzar.
          </div>
        </template>
        <template x-if="enriqError">
          <div class="card" style="border-left:3px solid var(--red);padding:.6rem .8rem;font-size:.82rem;margin-top:.5rem" x-text="enriqError"></div>
        </template>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="enriqAbierto = false">Cancelar</button>
        <button class="btn btn-primary" @click="lanzarEnriquecido()"
                :disabled="enriqLanzando || enriqEstimando || !enriqEstimacion || !enriqLanzable || !enriqToken || !enriqForm.modulos.length"
                style="display:flex;align-items:center;gap:.4rem">
          <template x-if="enriqLanzando"><span class="spinner" style="width:14px;height:14px"></span></template>
          <i data-lucide="sparkles" style="width:14px;height:14px" x-show="!enriqLanzando"></i>
          Confirmar y lanzar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: SUBIR CUENTA GSC ===== -->
<template x-if="showGscUploadModal">
  <div class="modal-backdrop" @click.self="showGscUploadModal = false" @keydown.escape.window="showGscUploadModal = false">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h3 style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="key" style="width:18px;height:18px;color:var(--accent)"></i>
          Subir cuenta de servicio GSC
        </h3>
        <button class="btn-icon" @click="showGscUploadModal = false" style="font-size:1.25rem">&times;</button>
      </div>
      <div class="modal-body" style="padding:1.25rem">
        <div class="form-group" style="margin-bottom:1rem">
          <label>Nombre de la cuenta</label>
          <input type="text" x-model="gscUploadName" placeholder="Ej: Mi proyecto GSC" style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
        </div>
        <div class="form-group">
          <label>Archivo JSON de cuenta de servicio</label>
          <input type="file" accept=".json" @change="gscUploadFile = $event.target.files[0]" style="font-size:.85rem">
          <div class="form-hint">El JSON de la cuenta de servicio de Google Cloud con permisos de lectura en Search Console.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showGscUploadModal = false">Cancelar</button>
        <button class="btn btn-primary" @click="uploadGscAccount()" :disabled="!gscUploadFile || !gscUploadName.trim()" style="display:flex;align-items:center;gap:.4rem">
          <i data-lucide="upload" style="width:14px;height:14px"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== DIALOGO PROPIO (UX-21) =====
     Sustituye a confirm()/alert()/prompt(). Los borrados que se llevan mucho
     por delante piden escribir una palabra para habilitar el boton. -->
<template x-if="dialogo">
  <div class="modal-backdrop" @click.self="cerrarDialogo(false)" @keydown.escape.window="cerrarDialogo(false)">
    <div class="modal dialogo" style="max-width:30rem" role="alertdialog" aria-modal="true"
         aria-labelledby="dialogo-titulo" aria-describedby="dialogo-mensaje">
      <div class="modal-header">
        <h2 id="dialogo-titulo" style="display:flex;align-items:center;gap:.45rem">
          <template x-if="dialogo.peligro"><i data-lucide="alert-triangle" style="width:18px;height:18px;color:var(--red)"></i></template>
          <span x-text="dialogo.titulo"></span>
        </h2>
      </div>
      <div class="modal-body">
        <p id="dialogo-mensaje" class="text-sm" style="line-height:1.55;white-space:pre-line" x-text="dialogo.mensaje"></p>
        <template x-if="dialogo.pedir">
          <div style="margin-top:.8rem">
            <label class="text-sm" for="dialogo-libre" x-text="dialogo.pedir"></label>
            <input id="dialogo-libre" type="text" x-model="dialogo.entrada" data-foco autocomplete="off" maxlength="80"
                   @keydown.enter="cerrarDialogo(true)" style="width:100%;margin-top:.3rem">
          </div>
        </template>
        <template x-if="dialogo.escribir">
          <div style="margin-top:.8rem">
            <label class="text-sm" for="dialogo-entrada">Escribe <strong x-text="dialogo.escribir"></strong> para confirmar</label>
            <input id="dialogo-entrada" type="text" x-model="dialogo.entrada" data-foco autocomplete="off"
                   @keydown.enter="cerrarDialogo(true)" style="width:100%;margin-top:.3rem">
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <template x-if="!dialogo.solo_aviso">
          <button class="btn" @click="cerrarDialogo(false)" :data-foco="dialogo.peligro && !dialogo.escribir ? '' : null">Volver</button>
        </template>
        <button class="btn" :class="dialogo.peligro ? 'btn-danger' : 'btn-primary'" @click="cerrarDialogo(true)"
                :disabled="(dialogo.escribir && dialogo.entrada.trim() !== dialogo.escribir) || (dialogo.pedir && !dialogo.entrada.trim())"
                :data-foco="!dialogo.peligro && !dialogo.escribir && !dialogo.pedir ? '' : null" x-text="dialogo.aceptar"></button>
      </div>
    </div>
  </div>
</template>

<!-- ===== BORRADO EN MASA (decision 96) =====
     Tres pasos en el mismo modal: lo que se va a borrar (con su tamaño y lo
     que el servidor se niega a tocar), el borrado con su avance, y lo que
     quedó. La vista previa la calcula el MISMO endpoint que borra, con
     `simular`, así que no puede decir una cosa y hacer otra. -->
<template x-if="borrado">
  <div class="modal-backdrop" @click.self="borrado.paso !== 'borrando' && cerrarBorrado()"
       @keydown.escape.window="borrado.paso !== 'borrando' && cerrarBorrado()">
    <div class="modal" style="max-width:46rem" role="alertdialog" aria-modal="true">
      <div class="modal-header">
        <h2 style="display:flex;align-items:center;gap:.45rem">
          <i data-lucide="trash-2" style="width:18px;height:18px;color:var(--red)"></i>
          <span x-text="borrado.paso === 'hecho' ? 'Rastreos eliminados' : 'Eliminar rastreos'"></span>
        </h2>
      </div>

      <div class="modal-body">
        <template x-if="borrado.paso === 'cargando'">
          <div class="loading-overlay"><div class="spinner"></div> Midiendo lo que ocupan…</div>
        </template>

        <!-- ---------- Vista previa ---------- -->
        <template x-if="borrado.paso === 'previa'">
          <div>
            <p class="text-sm" style="line-height:1.55" x-show="borrado.previa.eliminados.length">
              Se borran
              <strong x-text="fmt.num(borrado.previa.eliminados.length)"></strong>
              rastreos con todos sus datos: URLs, enlaces, incidencias, contenido y comparaciones.
              <strong>No se puede deshacer.</strong>
              Si alguno es un censo entregado, descarga antes su backup.
            </p>
            <p class="text-sm" style="line-height:1.55" x-show="!borrado.previa.eliminados.length">
              Ninguno de los rastreos seleccionados se puede borrar tal cual. Abajo está el
              motivo de cada uno.
            </p>

            <!-- Lo que el servidor NO va a tocar, y por qué. Va arriba: es lo
                 que hay que leer antes de teclear la palabra. -->
            <template x-if="borrado.previa.omitidos.length > 0">
              <div class="card" style="margin-top:.8rem;border-left:3px solid var(--orange)">
                <strong x-text="fmt.num(borrado.previa.omitidos.length) + (borrado.previa.omitidos.length === 1 ? ' no se borra' : ' no se borran')"></strong>
                <ul style="margin:.4rem 0 0 1rem;line-height:1.5">
                  <template x-for="o in borrado.previa.omitidos" :key="o.id">
                    <li class="text-sm">
                      <strong x-text="o.nombre || o.id"></strong>: <span x-text="o.motivo"></span>
                    </li>
                  </template>
                </ul>
                <!-- Solo lo protegido por una programación se puede forzar: un
                     rastreo en marcha hay que cancelarlo antes, siempre. -->
                <label class="checkbox-label text-sm" style="margin-top:.5rem"
                       x-show="borrado.forzar || borrado.previa.omitidos.some(o => o.forzable)">
                  <input type="checkbox" x-model="borrado.forzar" @change="recargarPrevia()">
                  Borrar igualmente los que son referencia de una programación
                </label>
              </div>
            </template>

            <template x-if="borrado.previa.eliminados.some(e => e.aviso)">
              <div class="card" style="margin-top:.8rem;border-left:3px solid var(--blue)">
                <ul style="margin:0 0 0 1rem;line-height:1.5">
                  <template x-for="e in borrado.previa.eliminados.filter(x => x.aviso)" :key="e.id">
                    <li class="text-sm"><strong x-text="e.nombre"></strong>: <span x-text="e.aviso"></span></li>
                  </template>
                </ul>
              </div>
            </template>

            <div class="table-wrap" x-show="borrado.previa.eliminados.length"
                 style="margin-top:.8rem;max-height:17rem;overflow:auto">
              <table>
                <thead>
                  <tr>
                    <th>Rastreo</th><th>Estado</th><th>Creado</th>
                    <th style="text-align:right">URLs</th>
                    <th style="text-align:right" title="Filas de la tabla de enlaces: cada una agrupa las apariciones idénticas de un enlace en su página (decisión 94)">Filas de enlaces</th>
                    <th style="text-align:right">Ocupa</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="e in borrado.previa.eliminados" :key="e.id">
                    <tr>
                      <td x-text="e.nombre"></td>
                      <td><span class="badge" :class="statusColor(e.status)" x-text="fmt.status(e.status)"></span></td>
                      <td class="text-dim text-sm" x-text="fmt.dia(e.created_at)"></td>
                      <td style="text-align:right" x-text="e.filas ? fmt.num(e.filas.urls) : '—'"></td>
                      <!-- Archivado (decision 95): sin filas en la base; lo que
                           ocupa es su Parquet, medido, y se suma en «Ocupa». -->
                      <td style="text-align:right" x-show="!e.archivado" x-text="e.filas ? fmt.num(e.filas.links) : '—'"></td>
                      <td style="text-align:right" class="text-dim" x-show="e.archivado"
                          :title="'Enlaces archivados en Parquet: ' + fmt.bytes(e.archivo_bytes) + ' en disco'">archivados</td>
                      <td style="text-align:right" x-text="fmt.bytes(e.bytes)"
                          :title="e.bytes == null ? 'No se pudo medir dentro del tiempo disponible' : 'Estimado a partir de sus filas'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <p class="text-sm" style="margin-top:.6rem" x-show="borrado.previa.eliminados.length">
              Liberan <strong x-text="fmt.bytes(borrado.previa.bytes_aprox)"></strong> aproximadamente<span
                x-show="borrado.previa.bytes_incompletos" class="text-dim">, y alguno más que no se pudo medir</span><span
                x-show="borrado.previa.archivo_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.previa.archivo_bytes)"></strong> de enlaces archivados</span><span
                x-show="borrado.previa.archivo_incompleto" class="text-dim">, y algún archivo de enlaces que no se pudo medir</span>.
            </p>
            <p class="text-dim text-sm" style="margin-top:.35rem;line-height:1.5"
               x-show="borrado.previa.eliminados.length" x-text="borrado.previa.nota"></p>

            <div style="margin-top:.8rem" x-show="borrado.previa.eliminados.length">
              <label class="text-sm" for="borrado-palabra">Escribe <strong>eliminar</strong> para confirmar</label>
              <input id="borrado-palabra" type="text" x-model="borrado.escribir" data-foco autocomplete="off"
                     @keydown.enter="confirmarBorrado()" style="width:100%;margin-top:.3rem">
            </div>
          </div>
        </template>

        <!-- ---------- Borrando ---------- -->
        <template x-if="borrado.paso === 'borrando'">
          <div>
            <p class="text-sm">Borrando <strong x-text="fmt.num(borrado.hechos)"></strong> de
              <strong x-text="fmt.num(borrado.total)"></strong>…</p>
            <!-- Un censo de millones de enlaces no cabe en una peticion: el
                 servidor devuelve lo que le queda y esto sigue pidiendolo. -->
            <div class="progress-bar">
              <div class="progress-fill" :style="'width:' + Math.round(100 * borrado.hechos / Math.max(1, borrado.total)) + '%'"></div>
            </div>
            <p class="text-dim text-sm" style="margin-top:.6rem">No cierres la pestaña. Un censo
              grande puede tardar varios minutos: se borra por lotes y lo que quede a medias se
              retoma solo.</p>
          </div>
        </template>

        <!-- ---------- Hecho ---------- -->
        <template x-if="borrado.paso === 'hecho'">
          <div>
            <p class="text-sm" style="line-height:1.55">
              Eliminados <strong x-text="fmt.num(borrado.resultado.eliminados.length)"></strong> rastreos
              y <strong x-text="fmt.num(Object.values(borrado.resultado.filas).reduce((a, b) => a + b, 0))"></strong> filas
              (<span x-text="Object.entries(borrado.resultado.filas).filter(e => e[1]).map(e => fmt.num(e[1]) + ' en ' + e[0]).join(', ')"></span>).
            </p>
            <p class="text-sm" style="margin-top:.4rem">
              Liberados <strong x-text="fmt.bytes(borrado.resultado.bytes_aprox)"></strong> aproximadamente<span
                x-show="borrado.resultado.bytes_incompletos" class="text-dim">, y alguno más que no se pudo medir</span><span
                x-show="borrado.resultado.archivo_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.resultado.archivo_bytes)"></strong> de enlaces archivados</span><span
                x-show="borrado.resultado.archivo_incompleto" class="text-dim">, y algún archivo de enlaces que no se pudo medir</span>.
            </p>
            <p class="text-sm" style="margin-top:.4rem;color:var(--orange)" x-show="borrado.resultado.sin_terminar > 0">
              <strong x-text="fmt.num(borrado.resultado.sin_terminar)"></strong> quedaron a medias: salen en la
              lista como «Borrándose» y se terminan seleccionándolos y repitiendo el borrado.
            </p>
            <p class="text-dim text-sm" style="margin-top:.35rem;line-height:1.5" x-text="borrado.resultado.nota"></p>
            <template x-if="borrado.resultado.omitidos.length > 0">
              <div class="card" style="margin-top:.8rem;border-left:3px solid var(--orange)">
                <ul style="margin:0 0 0 1rem;line-height:1.5">
                  <template x-for="o in borrado.resultado.omitidos" :key="o.id">
                    <li class="text-sm"><strong x-text="o.nombre || o.id"></strong>: <span x-text="o.motivo"></span></li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </template>
      </div>

      <div class="modal-footer">
        <template x-if="borrado.paso === 'previa'">
          <button class="btn" @click="cerrarBorrado()">Volver</button>
        </template>
        <template x-if="borrado.paso === 'previa'">
          <button class="btn btn-danger" @click="confirmarBorrado()"
                  :disabled="borrado.escribir.trim() !== 'eliminar' || !borrado.previa.eliminados.length">
            Eliminar para siempre
          </button>
        </template>
        <template x-if="borrado.paso === 'hecho'">
          <button class="btn btn-primary" @click="cerrarBorrado()" data-foco>Entendido</button>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ===== ESPACIO EN DISCO (decision 96) ===== -->
<template x-if="verAlmacenamiento && almacenamiento">
  <div class="modal-backdrop" @click.self="verAlmacenamiento = false" @keydown.escape.window="verAlmacenamiento = false">
    <div class="modal" style="max-width:34rem" role="dialog" aria-modal="true">
      <div class="modal-header"><h2>Espacio en disco</h2></div>
      <div class="modal-body">
        <p class="text-sm">La base de datos ocupa
          <strong x-text="fmt.bytes(almacenamiento.total_bytes)"></strong>, de los cuales
          <strong x-text="fmt.bytes(almacenamiento.censo_bytes)"></strong> son datos de rastreos.<span
            x-show="almacenamiento.archivo_ficheros"> Fuera de ella, los enlaces archivados de
            <strong x-text="fmt.num(almacenamiento.archivo_ficheros)"></strong> censos ocupan
            <strong x-text="fmt.bytes(almacenamiento.archivo_bytes)"></strong>.</span></p>
        <div class="table-wrap" style="margin-top:.8rem;max-height:18rem;overflow:auto">
          <table>
            <thead><tr><th>Tabla</th><th style="text-align:right">Ocupa</th><th style="text-align:right">Filas</th></tr></thead>
            <tbody>
              <template x-for="t in almacenamiento.tablas" :key="t.tabla">
                <tr>
                  <td x-text="t.tabla"></td>
                  <td style="text-align:right" x-text="fmt.bytes(t.bytes)"></td>
                  <td style="text-align:right" class="text-dim" x-text="fmt.num(t.filas_aprox)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="text-dim text-sm" style="margin-top:.6rem;line-height:1.5">
          Las filas son la estimación del planificador, no una cuenta exacta.
        </p>
        <p class="text-dim text-sm" style="margin-top:.35rem;line-height:1.5" x-text="almacenamiento.nota"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" @click="verAlmacenamiento = false" data-foco>Cerrar</button>
      </div>
    </div>
  </div>
</template>

<!-- ===== AVISOS BREVES =====
     showToast() los anadia a una lista que nadie pintaba: «Rastreo iniciado»,
     «Cliente guardado» o «Trabajo eliminado» no se habian visto nunca. -->
<div class="toasts" role="status" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="'toast-' + t.type" x-text="t.msg"></div>
  </template>
</div>

</body>
</html>
