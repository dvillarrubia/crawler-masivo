<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Crawler</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
  <!-- Tema antes de pintar: evita el parpadeo del tema claro al cargar -->
  <script>
    (function () {
      var t = 'light';  // el terminal es opcional: solo si se ha elegido
      try { t = localStorage.getItem('seo-crawler-theme') || t; } catch (_) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme-terminal.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="/static/incidencias.js"></script>
  <script src="/static/app.js"></script>
</head>
<!-- Sin x-init: Alpine 3 ya llama solo al init() del componente, y con los
     dos arrancaba todo dos veces (dos peticiones de la lista, dos atajos de
     teclado y, con las rutas, dos navegaciones pisandose). -->
<body x-data="app()" x-effect="$nextTick(() => lucide.createIcons())">

<div class="app">

  <!-- ===== BARRA SUPERIOR =====
       La misma en todas las vistas (UX-06): antes cambiaba de botones segun
       donde estuvieras, y desde la ficha de un rastreo no habia forma de ir a
       Clientes ni a Programados (hoy, apartado de Produccion). Las secciones son enlaces de verdad (#/...),
       asi que se pueden abrir en otra pestana y el boton atras funciona. -->
  <header class="topbar" style="border-top: 3px solid var(--brand);">
    <a href="#/clientes" class="topbar-brand" title="Ir al panel de clientes">
      <i data-lucide="radar" class="topbar-icon" style="width:22px;height:22px;color:var(--brand)"></i>
      <span>SEO Crawler</span>
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a href="#/clientes" :class="seccion() === 'clientes' && 'active'" :aria-current="seccion() === 'clientes' ? 'page' : null">
        <i data-lucide="building-2" class="ico-14"></i> Clientes</a>
      <!-- Produccion reune lo que antes eran Rastreos y Programados: lo que
           corre, lo que espera, lo que va a dispararse y el historico
           (revision de UX del 25-oct, 2.12). -->
      <a href="#/produccion" :class="seccion() === 'produccion' && 'active'" :aria-current="seccion() === 'produccion' ? 'page' : null">
        <i data-lucide="activity" class="ico-14"></i> Producción</a>
    </nav>
    <div class="topbar-actions">
      <!-- En la ficha del cliente hay uno propio con el cliente puesto: dos
           verdes a la vez era V47 (revision de UX del 25-oct, 2.1). -->
      <!-- Verde solo donde la vista no tiene su propio boton principal (3.5). -->
      <button class="btn btn-sm flex items-center gap-35" :class="principalPropia() ? '' : 'btn-primary'" x-show="!(view === 'client' && cliente)" @click="openCreate(_presetDelContexto())" data-tip="Crear un nuevo rastreo (atajo: n); si estás en un cliente, ya viene elegido">
        <i data-lucide="plus-circle" class="ico-14"></i> Nuevo rastreo
      </button>
      <div class="menu-wrap" @click.outside="menuAbierto === 'app' && (menuAbierto = '')">
        <button class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'app' ? '' : 'app'"
                aria-haspopup="menu" :aria-expanded="menuAbierto === 'app'" aria-label="Más opciones" title="Más opciones">
          <i data-lucide="more-horizontal" class="ico-16"></i>
        </button>
        <div class="menu" x-show="menuAbierto === 'app'" x-transition.opacity role="menu">
          <!-- Ajustes de la agencia (revision de UX del 25-oct, 2.5): Slack,
               Search Console, modelos, importar backup y tema. -->
          <a role="menuitem" href="#/ajustes" @click="menuAbierto = ''" data-testid="menu-ajustes">
            <i data-lucide="settings" class="ico-14"></i> Ajustes de la agencia</a>
          <button role="menuitem" @click="menuAbierto = ''; salirDeLaSesion()">
            <i data-lucide="log-out" class="ico-14"></i> Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Miga de pan: donde estoy y como vuelvo. Sustituye a los botones
       «← Trabajo» / «← Trabajos» / «← Clientes» que cambiaban por vista. -->
  <template x-if="migas().length">
    <nav class="breadcrumbs" aria-label="Ruta">
      <template x-for="(m, i) in migas()" :key="i">
        <span class="crumb">
          <template x-if="m.href && i < migas().length - 1"><a :href="m.href" x-text="m.texto" :title="m.texto"></a></template>
          <template x-if="!m.href || i === migas().length - 1"><span x-text="m.texto" :title="m.texto" aria-current="page"></span></template>
        </span>
      </template>
    </nav>
  </template>

  <main class="main">

    <!-- ===== BANNER DE ERROR ===== -->
    <template x-if="error">
      <div class="card mb-2 bc-red c-red flex items-center justify-between">
        <span x-text="error"></span>
        <button class="btn-icon" @click="error=null">&times;</button>
      </div>
    </template>

    <!-- ============================================================ -->
    <!--                  VISTA: LISTA DE TRABAJOS                    -->
    <!-- ============================================================ -->
    <!-- ===== MODAL: PROGRAMAR ESTE RASTREO ===== -->
    <template x-if="programarAbierto && job">
      <div class="modal-backdrop" @click.self="programarAbierto = false">
        <div class="modal maxw-34rem">
          <div class="modal-header">
            <h2 class="flex items-center gap-40">
              <i data-lucide="calendar-clock" class="ico-18"></i> Repetir este rastreo
            </h2>
          </div>
          <div class="modal-body">
            <p class="text-dim text-sm mb-80">
              Copia fija: se repetirá con las mismas semillas y la misma configuración que
              <strong x-text="job.name"></strong>, y cada vez se comparará con el
              censo anterior del mismo sitio. Los cambios que hagas después en el cliente
              no le llegarán.
            </p>
            <p class="text-sm mt-n30 mb-80 mx-0" x-show="!job.cliente_id">
              Para que herede los cambios, asigna antes este rastreo a un cliente (menú ⋯) y programa su perfil.
            </p>

            <label class="text-sm">Nombre</label>
            <input type="text" x-model="programarNombre" class="w-full mb-80">

            <!-- La expresion cron solo en «Otra», como en el modal de programar
                 un perfil (revision de UX del 25-oct, 3.9 y V44) -->
            <div x-data="{ otra: !cadencias.some(o => o.cron === programarCron) }">
              <label class="text-sm">Cada cuánto</label>
              <div class="flex gap-1 flex-wrap mb-50">
                <template x-for="o in cadencias" :key="o.cron">
                  <button class="btn btn-sm" :class="!otra && programarCron === o.cron ? 'btn-primary' : ''"
                          @click="programarCron = o.cron; otra = false" x-text="o.etiqueta"></button>
                </template>
                <button class="btn btn-sm" :class="otra && 'btn-primary'" @click="otra = true" data-testid="repetir-otra">Otra</button>
              </div>
              <template x-if="otra">
                <div>
                  <input type="text" x-model="programarCron" class="w-full mono" aria-label="Frecuencia en formato cron"
                         placeholder="minuto hora día-del-mes mes día-de-la-semana">
                  <div class="text-dim fs-sm mt-30">
                    Cinco campos: minuto, hora, día del mes, mes y día de la semana (0 3 * * 1 es cada lunes a las 03:00).
                  </div>
                </div>
              </template>
              <div class="text-dim fs-sm mt-30 mb-80 mx-0">
                Se repetirá <strong x-text="fmt.cron(programarCron)"></strong>.
              </div>
            </div>

            <label class="text-sm">Zona horaria</label>
            <input type="text" x-model="programarZona" class="w-full mb-40">
            <div class="text-dim fs-sm">
              La hora se lee en esta zona, con su cambio de horario.
            </div>
            <div x-show="programarError" class="card filete-red mt-80">
              <div class="text-sm" x-text="programarError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="programarAbierto = false">Cancelar</button>
            <button class="btn btn-primary" @click="guardarProgramacion()">Programar</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== MODAL: PROGRAMAR UN PERFIL (revision de UX del 25-oct, 2.2) =====
         Cada programacion cuelga de un perfil y en cada disparo hereda lo que
         tengan ese dia el cliente y el perfil (decision 193). El cuando, en
         lenguaje llano; la expresion cron solo en «Otra frecuencia». -->
    <template x-if="progForm">
      <div class="modal-backdrop" @click.self="progForm = null" @keydown.escape.window="progForm = null">
        <div class="modal" style="max-width:36rem" role="dialog" aria-modal="true" aria-labelledby="titulo-prog" data-testid="modal-programacion">
          <div class="modal-header">
            <h2 id="titulo-prog" class="flex items-center gap-40">
              <i data-lucide="calendar-clock" class="ico-18"></i>
              <span x-text="progForm.id ? 'Editar programación' : 'Nueva programación'"></span>
            </h2>
            <button class="btn-icon fs-md" @click="progForm = null" aria-label="Cerrar">&times;</button>
          </div>
          <div class="modal-body">
            <!-- Que se repite -->
            <template x-if="!progForm.id">
              <div class="form-row">
                <div class="form-group">
                  <label for="prog-cliente">Cliente</label>
                  <select id="prog-cliente" x-model="progForm.cliente_id" @change="progCambiarCliente()">
                    <option value="">Elige un cliente…</option>
                    <template x-for="c in clientes" :key="c.id">
                      <option :value="c.id" x-text="c.nombre" :selected="c.id === progForm.cliente_id"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group">
                  <label for="prog-perfil">Perfil</label>
                  <select id="prog-perfil" x-model="progForm.profile_id" :disabled="!progForm.cliente_id">
                    <option value="" x-text="progForm.cliente_id && !progForm.perfiles.length ? 'Este cliente no tiene perfiles' : 'Elige un perfil…'"></option>
                    <template x-for="p in progForm.perfiles" :key="p.id">
                      <option :value="p.id" x-text="p.nombre + (p.activo ? '' : ' (desactivado)')" :selected="p.id === progForm.profile_id"></option>
                    </template>
                  </select>
                </div>
              </div>
            </template>
            <template x-if="progForm.id">
              <p class="text-sm mb-1">
                <strong x-text="progForm.clienteNombre || 'Sin cliente'"></strong> ·
                <span x-text="progForm.perfilNombre ? 'perfil «' + progForm.perfilNombre + '»' : 'sin perfil'"></span>
              </p>
            </template>

            <!-- Desde un rastreo: si ningun perfil tiene sus semillas -->
            <template x-if="!progForm.id && progForm.desdeJob && progForm.cliente_id && !progForm.profile_id">
              <div class="card mb-1 prog-nota">
                <p class="text-sm mt-0 mb-40 mx-0">Ningún perfil de este cliente empieza por las mismas
                  <span x-text="fmt.num((progForm.desdeJob.seeds || []).length)"></span> semillas que
                  «<span x-text="progForm.desdeJob.name"></span>». Puedes crear uno con sus semillas y con lo que su
                  configuración cambia respecto al cliente.</p>
                <div class="flex gap-1 flex-wrap">
                  <button class="btn btn-sm" @click="progCrearPerfilDesdeJob()" :disabled="progForm.creandoPerfil"
                          data-tip="El perfil nuevo guarda las semillas de este rastreo y lo que su configuración tiene de distinto respecto al cliente (exclusiones, profundidad…); lo demás lo sigue heredando del cliente">Crear un perfil con este rastreo</button>
                  <button class="btn btn-sm btn-link" @click="abrirCopiaFija()">o repetir este rastreo tal cual (copia fija)</button>
                </div>
              </div>
            </template>

            <template x-if="progPerfil()">
              <p class="text-dim text-sm prog-nota-perfil">
                Empieza en <span class="prog-semillas" x-text="(progPerfil().seeds || []).slice(0, 2).join(', ') + ((progPerfil().seeds || []).length > 2 ? ' y ' + fmt.num(progPerfil().seeds.length - 2) + ' más' : '')"></span>.
                En cada disparo usa las semillas y la configuración que tengan ese día el cliente y el
                perfil: si cambias el perfil, el próximo censo ya sale con el cambio.
              </p>
            </template>
            <template x-if="(progForm.avisosPerfil || []).length">
              <ul class="text-sm prog-aviso-fija mt-20 mb-60 mx-0 pl-110">
                <template x-for="a in progForm.avisosPerfil" :key="a"><li x-text="a"></li></template>
              </ul>
            </template>
            <template x-if="progForm.id && progForm.hereda">
              <p class="text-dim text-sm prog-nota-perfil">En cada disparo usa las semillas y la configuración que tengan
                ese día el cliente y el perfil: lo que cambies en el perfil llega al próximo censo.</p>
            </template>
            <template x-if="progForm.id && !progForm.hereda">
              <p class="text-sm prog-aviso-fija">
                Copia fija de un rastreo: lanza siempre las mismas <span x-text="fmt.num(progForm.n_semillas || 0)"></span>
                semillas y la configuración de cuando se creó; los cambios del cliente no le llegan. Para que los herede,
                programa un perfil con esas semillas y pausa esta.
              </p>
            </template>

            <!-- Cuando -->
            <fieldset class="prog-cuando">
              <legend class="text-sm">Cuándo se repite</legend>
              <div class="flex gap-1 prog-frecuencias" role="radiogroup" aria-label="Frecuencia">
                <template x-for="o in [['semanal', 'Cada semana'], ['diaria', 'Cada día'], ['quincenal', 'Cada 15 días'], ['mensual', 'Cada mes'], ['avanzada', 'Otra']]" :key="o[0]">
                  <button type="button" class="btn btn-sm" role="radio" :aria-checked="progForm.frecuencia === o[0]"
                          :class="progForm.frecuencia === o[0] && 'btn-primary'" @click="progForm.frecuencia = o[0]" x-text="o[1]"></button>
                </template>
              </div>
              <div class="form-row prog-dia-hora" x-show="progForm.frecuencia !== 'avanzada'">
                <div class="form-group" x-show="progForm.frecuencia === 'semanal'">
                  <label for="prog-dia">Día</label>
                  <select id="prog-dia" x-model.number="progForm.dia">
                    <template x-for="d in diasProgramacion" :key="d[0]">
                      <option :value="d[0]" x-text="d[1]" :selected="d[0] === progForm.dia"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group" x-show="progForm.frecuencia === 'mensual'">
                  <label for="prog-diames">Día del mes</label>
                  <select id="prog-diames" x-model.number="progForm.diaMes">
                    <template x-for="d in 28" :key="d">
                      <option :value="d" x-text="d" :selected="d === progForm.diaMes"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group">
                  <label for="prog-hora">Hora</label>
                  <select id="prog-hora" x-model="progForm.hora">
                    <template x-for="h in progHoras()" :key="h">
                      <option :value="h" x-text="h" :selected="h === progForm.hora"></option>
                    </template>
                  </select>
                </div>
              </div>
              <div x-show="progForm.frecuencia === 'avanzada'" class="form-group">
                <label for="prog-cron">Expresión cron (minuto hora día-del-mes mes día-de-semana)</label>
                <input id="prog-cron" type="text" x-model="progForm.cron" class="mono" placeholder="0 3 * * 1">
              </div>
              <p class="text-sm prog-resumen" data-testid="prog-resumen">
                Se lanzará <strong x-text="fmt.cron(progCron()) !== progCron() ? fmt.cron(progCron()) : 'según la expresión ' + (progCron() || '—')"></strong>,
                <span x-text="fmt.zona(progForm.zona)"></span>.
              </p>
              <details class="text-sm">
                <summary class="text-dim pointer">Otra zona horaria</summary>
                <input type="text" x-model="progForm.zona" class="mt-35" placeholder="Europe/Madrid" aria-label="Zona horaria">
                <div class="form-hint">La hora se lee en esta zona, con su cambio de horario.</div>
              </details>
            </fieldset>

            <div class="form-group mt-60">
              <label for="prog-nombre">Nombre <span class="text-dim">(opcional)</span></label>
              <input id="prog-nombre" type="text" x-model="progForm.nombre"
                     :placeholder="progPerfil() ? progPerfil().nombre : 'el del perfil'">
              <div class="form-hint">Cada rastreo que lance se llamará así, con su fecha.</div>
            </div>

            <!-- Repetida: mismo perfil ya programado (V06) -->
            <template x-if="progYaProgramadas().length">
              <div class="card prog-repetida" role="alert" data-testid="prog-ya-programada">
                <strong>Este perfil ya se repite solo:</strong>
                <span x-text="progYaProgramadas().map(p => fmt.cron(p.cron)).join(' y ')"></span>.
                Otra programación rastrearía el mismo sitio dos veces y haría dos avisos de cada alerta.
                Edita la que hay salvo que quieras las dos a propósito (por ejemplo, un canario diario y un censo semanal).
              </div>
            </template>

            <div x-show="progForm.error" class="card filete-red mt-80">
              <div class="text-sm" x-text="progForm.error"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="progForm = null">Cancelar</button>
            <button class="btn btn-primary" @click="guardarProgForm()" data-testid="prog-guardar"
                    :disabled="progForm.guardando || (!progForm.id && !progForm.profile_id)"
                    x-text="progForm.id ? 'Guardar' : 'Programar'"></button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== MODAL: NOMBRE, TIPO Y CLIENTE DE UN RASTREO (UX-07/08) ===== -->
    <template x-if="editarJob && job">
      <div class="modal-backdrop" @click.self="editarJob = null" @keydown.escape.window="editarJob = null">
        <div class="modal maxw-32rem" role="dialog" aria-modal="true" aria-labelledby="titulo-editar-job">
          <div class="modal-header">
            <h2 id="titulo-editar-job" class="flex items-center gap-40">
              <i data-lucide="pencil" class="ico-18"></i> Ordenar este rastreo
            </h2>
          </div>
          <div class="modal-body">
            <p class="text-dim text-sm mb-80">
              No cambia nada de lo rastreado ni de lo analizado: solo dónde aparece y cómo se compara.
            </p>
            <label class="text-sm" for="ej-nombre">Nombre</label>
            <input id="ej-nombre" type="text" x-model="editarJob.name" class="w-full mb-80">

            <label class="text-sm">Tipo</label>
            <div class="grupo-chips mb-30" role="radiogroup">
              <template x-for="t in [['censo', 'Censo'], ['canario', 'Canario'], ['prueba', 'Prueba']]" :key="t[0]">
                <button class="btn btn-sm chip" role="radio" :aria-checked="editarJob.tipo === t[0]"
                        :class="editarJob.tipo === t[0] && 'chip-on'" @click="editarJob.tipo = t[0]" x-text="t[1]"></button>
              </template>
            </div>
            <div class="text-dim fs-sm mb-80">
              Solo los censos cuentan en la evolución del cliente y en el panel. Ahora:
              <span x-text="job.tipo ? 'marcado a mano' : 'deducido del nombre'"></span>.
            </div>

            <label class="text-sm" for="ej-cliente">Cliente</label>
            <select id="ej-cliente" x-model="editarJob.cliente_id" class="w-full">
              <option value="">Sin cliente</option>
              <template x-for="c in clientes" :key="c.id">
                <option :value="c.id" :selected="c.id === editarJob.cliente_id" x-text="c.nombre"></option>
              </template>
            </select>
            <div x-show="editarError" class="card filete-red mt-80">
              <div class="text-sm" x-text="editarError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="editarJob = null">Cancelar</button>
            <button class="btn btn-primary" @click="guardarJob()">Guardar</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== PRODUCCION: apartados =====
         Ahora (en curso, en cola, proximos disparos, sin cliente),
         Programados y Todos los rastreos. Las rutas viejas #/rastreos y
         #/programados siguen siendo los dos ultimos apartados (revision de
         UX del 25-oct, 2.12). -->
    <template x-if="['produccion', 'programados', 'jobs'].includes(view)">
      <nav class="tabs prod-apartados" aria-label="Apartados de Producción">
        <a class="tab" href="#/produccion" :class="view === 'produccion' && 'active'" :aria-current="view === 'produccion' ? 'page' : null">
          <i data-lucide="activity" class="ico-14"></i> Ahora</a>
        <a class="tab" href="#/programados" :class="view === 'programados' && 'active'" :aria-current="view === 'programados' ? 'page' : null">
          <i data-lucide="calendar-clock" class="ico-14"></i> Programados</a>
        <a class="tab" href="#/rastreos" :class="view === 'jobs' && 'active'" :aria-current="view === 'jobs' ? 'page' : null">
          <i data-lucide="list" class="ico-14"></i> Todos los rastreos</a>
      </nav>
    </template>

    <!-- ===== PRODUCCION · AHORA ===== -->
    <template x-if="view === 'produccion'">
      <div class="prod">
        <template x-if="prod.estado === 'cargando' && !prod.enCurso.length">
          <div class="empty text-dim">Mirando qué hay en marcha…</div>
        </template>
        <template x-if="prod.estado === 'error'">
          <div class="card mb-2 filete-red">
            <strong>No se pudo saber qué hay en marcha.</strong>
            <span class="text-dim text-sm" x-text="prod.error"></span>
            <button class="btn btn-sm ml-50" @click="cargarProduccion()">Reintentar</button>
          </div>
        </template>

        <template x-if="prod.estado === 'ok'">
          <div>
            <!-- La respuesta a «¿puedo desplegar?» en una frase. -->
            <p class="prod-resumen" data-testid="prod-resumen">
              <template x-if="!prod.enCurso.length && !prod.enCola.length">
                <span><strong>Producción libre:</strong> no hay ningún rastreo en marcha ni esperando.</span>
              </template>
              <template x-if="prod.enCurso.length || prod.enCola.length">
                <span>
                  <strong x-text="resumenProduccion"></strong>.
                  <span class="text-dim" x-show="prod.enCurso.length">Desplegar ahora los cortaría.</span>
                </span>
              </template>
              <span class="text-dim text-sm prod-refresco">Se actualiza sola cada 10 s</span>
            </p>

            <!-- En curso -->
            <section class="prod-bloque">
              <h3 class="prod-titulo">En curso</h3>
              <template x-if="!prod.enCurso.length">
                <p class="text-dim text-sm">Nada rastreando ahora mismo.</p>
              </template>
              <template x-for="j in prod.enCurso" :key="j.id">
                <a class="card prod-fila" :href="'#/rastreos/' + j.id" data-testid="prod-en-curso">
                  <div class="prod-cabeza">
                    <div class="prod-nombre">
                      <strong x-text="j.name"></strong>
                      <span class="text-dim text-sm" x-text="j.cliente_nombre || 'sin cliente'"></span>
                    </div>
                    <span class="badge" :class="statusColor(j.status)" x-text="fmt.status(j.status)"></span>
                  </div>
                  <template x-if="j.status === 'running'">
                    <div>
                      <div class="progress-bar prod-barra" role="progressbar" aria-label="Progreso del rastreo"
                           :aria-valuenow="estimacion(j).pct != null ? Math.round(estimacion(j).pct) : null" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill" :class="estimacion(j).pct == null && 'prod-indeterminada'"
                             :style="'width:' + (estimacion(j).pct != null ? Math.max(1, estimacion(j).pct) : 100) + '%'"></div>
                      </div>
                      <div class="prod-cifras">
                        <span x-text="textoEstimacion(j)"></span>
                        <span class="text-dim" x-show="j.started_at" x-text="'empezó ' + fmt.ago(j.started_at)" :title="fmt.date(j.started_at)"></span>
                      </div>
                    </div>
                  </template>
                  <template x-if="j.status === 'analyzing'">
                    <div class="prod-cifras">
                      <span x-text="fmt.n(j.total_urls_crawled, 'página rastreada', 'páginas rastreadas') + ' · analizando los resultados'"></span>
                    </div>
                  </template>
                </a>
              </template>
            </section>

            <!-- En cola -->
            <section class="prod-bloque">
              <h3 class="prod-titulo">En cola</h3>
              <template x-if="!prod.enCola.length">
                <p class="text-dim text-sm">No espera ninguno.</p>
              </template>
              <template x-if="prod.enCola.length && !prod.cola">
                <p class="text-dim text-sm">No se ha podido leer la cola del worker: van por orden de creación, que no siempre es el orden en que entrarán (una reanudación vuelve al final).</p>
              </template>
              <template x-for="j in prod.enCola" :key="j.id">
                <a class="card prod-fila prod-fila-cola" :href="'#/rastreos/' + j.id" data-testid="prod-en-cola">
                  <span class="prod-puesto" x-text="puestoEnCola(j) ? puestoEnCola(j) + '.º' : '—'"
                        :title="puestoEnCola(j) ? 'Puesto en la cola del worker' : 'Sin puesto en la cola: o está arrancando en este momento o se quedó fuera y el worker lo recuperará'"></span>
                  <div class="prod-nombre">
                    <strong x-text="j.name"></strong>
                    <span class="text-dim text-sm" x-text="(j.cliente_nombre || 'sin cliente') + ' · creado ' + fmt.ago(j.created_at)" :title="fmt.date(j.created_at)"></span>
                  </div>
                </a>
              </template>
            </section>

            <!-- Proximos disparos -->
            <section class="prod-bloque">
              <h3 class="prod-titulo">Próximos programados
                <a class="text-sm prod-ver" href="#/programados">Ver todos</a></h3>
              <template x-if="!proximosDisparos.length">
                <p class="text-dim text-sm">No hay ninguna programación activa.</p>
              </template>
              <template x-for="p in proximosDisparos.slice(0, 5)" :key="p.id">
                <div class="prod-disparo">
                  <span class="prod-cuando">
                    <strong x-text="fmt.enZona(p.proxima_ejecucion, p.zona_horaria)"></strong>
                    <span class="text-dim text-sm" x-text="fmt.zona(p.zona_horaria) + ' · ' + fmt.dentroDe(p.proxima_ejecucion)"></span>
                  </span>
                  <span class="prod-nombre">
                    <span x-text="(p.cliente_nombre ? p.cliente_nombre + ' · ' : '') + (p.perfil_nombre || p.nombre)"></span>
                    <span class="text-dim text-sm" x-text="fmt.cron(p.cron) !== p.cron ? fmt.cron(p.cron) : 'calendario a medida'"></span>
                  </span>
                </div>
              </template>
            </section>

            <!-- Sin cliente -->
            <template x-if="prod.sinCliente">
              <a class="card aviso-sin-cliente" href="#/rastreos?cliente=ninguno" data-testid="prod-sin-cliente">
                <i data-lucide="alert-circle" class="ico-16 c-orange"></i>
                <span><strong x-text="fmt.num(prod.sinCliente)"></strong>
                  <span x-text="prod.sinCliente === 1 ? 'rastreo no tiene cliente y no cuenta en la evolución de nadie. Asígnalo desde su ficha (menú ⋯).' : 'rastreos no tienen cliente y no cuentan en la evolución de nadie. Asígnalos desde su ficha (menú ⋯).'"></span></span>
              </a>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== RASTREOS PROGRAMADOS =====
         Revision de UX del 25-oct, 2.2 (V06, V07, V44): cada fila dice de que
         cliente y de que perfil es, se crea y se edita desde aqui (dia y hora
         en castellano, zona de Madrid) y se avisa de las repetidas. -->
    <template x-if="view === 'programados'">
      <div>
        <div class="flex items-center gap-1 mb-2 flex-wrap">
          <span class="text-dim text-sm" style="flex:1 1 18rem">Rastreos que se repiten solos. Cada uno repite un perfil
            de un cliente y, al terminar, se compara con el censo anterior de ese perfil.</span>
          <span class="text-dim text-sm"
                x-text="programaciones.length === 1 ? '1 programación' : fmt.num(programaciones.length) + ' programaciones'"></span>
          <button class="btn btn-primary btn-sm flex items-center gap-35" @click="abrirNuevaProgramacion()" data-testid="nueva-programacion">
            <i data-lucide="plus" class="ico-14"></i> Nueva programación
          </button>
        </div>

        <!-- Repetidas: dos activas del mismo perfil o con las mismas semillas -->
        <template x-for="g in gruposRepetidos()" :key="g.nombres.join('|') + g.cuando.join('|')">
          <div class="card mb-2 aviso-repetidas" role="alert" data-testid="aviso-repetidas">
            <i data-lucide="copy" class="ico-16 shrink-0 c-orange"></i>
            <div>
              <strong x-text="g.cliente + ': ' + g.nombres.length + ' programaciones activas rastrean lo mismo'"></strong>
              <span class="text-sm" x-text="'(' + g.motivo + ': ' + g.cuando.join(' y ') + ').'"></span>
              <div class="text-sm text-dim">Gastan producción dos veces y cada alerta llega repetida. Pausa la que sobre.</div>
            </div>
          </div>
        </template>

        <template x-if="!programaciones.length">
          <div class="empty py-250 px-150">
            <h3 class="mb-50 fs-base">No hay ningún rastreo programado</h3>
            <p class="text-dim maxw-420px lh-150">
              Mientras no los haya, de un cambio en un sitio te enteras cuando se te ocurre mirar.
              Programa un perfil con «Nueva programación» o desde la configuración del cliente.
            </p>
          </div>
        </template>

        <!-- Sin cron crudo a la vista (V44): el calendario en castellano y la
             zona dicha; la expresion queda en el title. Las fechas, en la
             zona de la programacion y no en la del navegador. En movil la
             tabla se apila (cada celda con su etiqueta). -->
        <template x-if="programaciones.length">
          <div class="card">
            <table class="tabla-apilable tabla-programados w-full fs-sm">
              <thead><tr>
                <th class="ta-l">Cliente</th>
                <th class="ta-l">Perfil</th>
                <th class="ta-l">Cuándo</th>
                <th class="ta-l">Próximo</th>
                <th class="ta-l">Último</th>
                <th style="width:10rem"><span class="sr-only">Acciones</span></th>
              </tr></thead>
              <tbody>
                <template x-for="p in programaciones" :key="p.id">
                  <tr :class="[!p.activa && 'fila-en-pausa', (p.repetida_con || []).length && 'fila-repetida']" data-testid="fila-programacion">
                    <td data-etiqueta="Cliente">
                      <template x-if="p.cliente_id">
                        <a :href="'#/clientes/' + p.cliente_id" x-text="p.cliente_nombre || p.client_id"></a>
                      </template>
                      <span class="text-dim" x-show="!p.cliente_id" x-text="p.client_id || 'sin cliente'"></span>
                      <div class="text-dim fs-sm" x-show="p.nombre !== p.perfil_nombre" x-text="p.nombre"></div>
                    </td>
                    <td data-etiqueta="Perfil">
                      <template x-if="p.perfil_nombre">
                        <a :href="'#/clientes/' + p.cliente_id + '/configuracion'" x-text="p.perfil_nombre"></a>
                      </template>
                      <template x-if="!p.hereda_perfil">
                        <span class="badge badge-pending" data-tip="Lanza siempre las semillas y la configuración copiadas del rastreo del que se creó: los cambios del cliente no le llegan">copia fija</span>
                      </template>
                      <div class="text-dim truncate" style="font-size:var(--fs-sm);max-width:18rem"
                           x-text="(p.seeds || []).join(', ') + (p.n_semillas > (p.seeds || []).length ? ' y ' + fmt.num(p.n_semillas - p.seeds.length) + ' más' : '')"></div>
                      <template x-if="(p.repetida_con || []).length">
                        <div class="text-orange" style="font-size:var(--fs-sm);white-space:normal;overflow-wrap:anywhere" x-text="'Repite a ' + p.repetida_con.map(r => '«' + r.nombre + '»').join(', ') + ' (' + p.repetida_con[0].motivo + ')'"></div>
                      </template>
                    </td>
                    <td data-etiqueta="Cuándo" :title="'Expresión: ' + p.cron">
                      <div x-text="fmt.cron(p.cron) !== p.cron ? fmt.cron(p.cron) : 'calendario a medida'"></div>
                      <div class="text-dim fs-sm" x-text="fmt.zona(p.zona_horaria)"></div>
                    </td>
                    <td data-etiqueta="Próximo">
                      <template x-if="p.activa">
                        <div>
                          <div x-text="fmt.enZona(p.proxima_ejecucion, p.zona_horaria)"></div>
                          <div class="text-dim fs-sm" x-show="p.proxima_ejecucion" x-text="fmt.dentroDe(p.proxima_ejecucion)"></div>
                        </div>
                      </template>
                      <template x-if="!p.activa"><span class="text-dim">en pausa</span></template>
                    </td>
                    <td data-etiqueta="Último">
                      <template x-if="p.ultimo_job_id">
                        <a :href="'#/rastreos/' + p.ultimo_job_id"
                           x-text="fmt.enZona(p.ultima_ejecucion, p.zona_horaria)"></a>
                      </template>
                      <template x-if="!p.ultimo_job_id"><span class="text-dim">nunca</span></template>
                      <!-- Por que no se lanzo la ultima vez. Una programacion que
                           deja de dispararse sin decir por que es indistinguible
                           de una que nadie miro. -->
                      <div class="text-dim fs-sm" x-show="p.ultimo_motivo"
                           x-text="fmt.motivo(p.ultimo_motivo)" :title="p.ultimo_motivo"></div>
                    </td>
                    <td class="celda-acciones ta-r nowrap">
                      <button class="btn btn-sm" @click="editarProgramacion(p)" :aria-label="'Editar la programación ' + p.nombre">Editar</button>
                      <button class="btn btn-sm" @click="alternarProgramacion(p)"
                              x-text="p.activa ? 'Pausar' : 'Reanudar'"></button>
                      <!-- «Eliminar» dentro de «⋯» (revision de UX del 25-oct, 3.5) -->
                      <div class="menu-wrap menu-wrap-fila" @click.outside="menuAbierto === 'prog-' + p.id && (menuAbierto = '')">
                        <button class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'prog-' + p.id ? '' : 'prog-' + p.id"
                                aria-haspopup="menu" :aria-expanded="menuAbierto === 'prog-' + p.id" :aria-label="'Más acciones de la programación ' + p.nombre" title="Más acciones"
                                data-testid="prog-mas">
                          <i data-lucide="more-horizontal" class="ico-16"></i>
                        </button>
                        <div class="menu" x-show="menuAbierto === 'prog-' + p.id" role="menu">
                          <button role="menuitem" class="danger" @click="menuAbierto = ''; borrarProgramacion(p)" data-testid="prog-eliminar">
                            <i data-lucide="trash-2" class="ico-14"></i>
                            <span>Eliminar la programación<span class="menu-sub">Deja de lanzarse sola. Los rastreos que ya lanzó no se borran</span></span></button>
                        </div>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ -->
    <!--                  VISTA: CLIENTES (#36)                       -->
    <!-- ============================================================ -->
    <template x-if="view === 'clients'">
      <div>
        <div class="flex items-center gap-1 mb-2 flex-wrap">
          <span class="text-dim text-sm">El último censo de cada cliente y cómo ha cambiado desde el anterior.
            Un rastreo lanzado desde un cliente hereda su configuración.</span>
          <button class="btn btn-primary btn-sm ml-auto flex items-center gap-35"
                  @click="nuevoCliente()">
            <i data-lucide="plus" class="ico-14"></i> Nuevo cliente
          </button>
        </div>

        <template x-if="!clientes.length && clientesEstado === 'cargando'">
          <div class="empty text-dim py-250 px-150" data-testid="clientes-cargando">Cargando clientes…</div>
        </template>
        <template x-if="clientesEstado === 'error'">
          <div class="card mb-2 filete-red" data-testid="clientes-error">
            <strong>No se pudieron cargar los clientes.</strong>
            <span class="text-dim text-sm" x-text="clientesError"></span>
            <button class="btn btn-sm ml-50" @click="cargarClientes()">Reintentar</button>
          </div>
        </template>
        <template x-if="!clientes.length && clientesEstado === 'ok'">
          <div class="empty py-250 px-150">
            <h3 class="mb-50 fs-base">Todavía no hay clientes</h3>
            <p class="text-dim maxw-440px lh-150">
              Los rastreos antiguos que tenían un ID de cliente escrito a mano se convierten en
              clientes solos al desplegar. Para dar de alta uno nuevo, «Nuevo cliente».
            </p>
          </div>
        </template>

        <!-- Rastreos sin cliente (UX-08): los anteriores a la decision 83 y
             los lanzados sin elegir cliente. Mientras no se asignen, no
             cuentan en la serie de nadie. -->
        <template x-if="panelClientes && panelClientes.rastreos_sin_cliente">
          <a class="card mb-2 aviso-sin-cliente" href="#/rastreos?cliente=ninguno">
            <i data-lucide="link-2-off" class="ico-16"></i>
            <!-- Singular o plural (revision de UX del 25-oct, 3.9): salia «1 rastreos no tienen cliente». -->
            <span><strong x-text="fmt.num(panelClientes.rastreos_sin_cliente)"></strong>
              <span x-text="panelClientes.rastreos_sin_cliente === 1 ? 'rastreo no tiene cliente y no cuenta en la evolución de nadie. Asígnalo desde su ficha (menú ⋯).' : 'rastreos no tienen cliente y no cuentan en la evolución de nadie. Asígnalos desde su ficha (menú ⋯).'"></span></span>
          </a>
        </template>

        <!-- Panel de cartera (UX-07 y decision 130): una fila por cliente con
             su ultimo CENSO y la tendencia de errores de su serie, de
             `profile_runs`. Los canarios y las pruebas no cuentan, y a traves
             de un cambio de version del analisis no hay flecha. -->
        <template x-if="clientes.length">
          <!-- A 390 px, cada cliente una tarjeta con su ultimo censo, errores y
               alertas (revision de UX del 25-oct, 3.2; V41). -->
          <div class="card table-wrap con-tarjetas">
            <table class="panel-cartera tabla-tarjetas w-full fs-sm" data-testid="panel-cartera">
              <thead><tr>
                <th class="ta-l">cliente</th>
                <th class="ta-l">último censo</th>
                <th class="ta-r">páginas</th>
                <th class="ta-r">indexables</th>
                <!-- Con una API anterior (sin `paginas_con_error`) la columna son
                     incidencias y la cabecera lo dice (decision 202). -->
                <th class="ta-r" :title="panelSinPaginasError() ? 'Incidencias de gravedad error: esta versión del servidor no dice cuántas páginas' : 'Páginas con al menos un error: la misma cifra que la tarjeta del censo'"
                    x-text="panelSinPaginasError() ? 'errores (incidencias)' : 'páginas con error'">páginas con error</th>
                <th class="ta-l">tendencia</th>
                <th class="ta-l" title="Alertas abiertas: las que saltaron y ningún rastreo posterior ha visto resueltas. Si no hay ninguna abierta, las que saltaron en el último censo">alertas</th>
              </tr></thead>
              <tbody>
                <template x-for="p in filasPanelOrdenadas()" :key="p.id">
                  <tr @click="location.hash = '#/clientes/' + p.id" class="pointer">
                    <td>
                      <a :href="'#/clientes/' + p.id" @click.stop><strong x-text="p.nombre"></strong></a>
                      <span class="text-dim text-sm" x-text="p.n_rastreos + (p.n_rastreos === 1 ? ' rastreo' : ' rastreos')"></span>
                      <div class="panel-integ">
                        <template x-for="i in ((clientes.find(c => c.id === p.id) || {}).integraciones || [])" :key="i.tipo + (i.credencial_env || '')">
                          <span class="badge" :class="i.configurada ? 'badge-completed' : 'badge-pending'" x-text="i.tipo"></span>
                        </template>
                      </div>
                    </td>
                    <td data-label="Último censo" class="td-ancha">
                      <template x-if="!p.ultimo"><span class="text-dim">sin censo completado</span></template>
                      <template x-if="p.ultimo">
                        <div>
                          <div x-text="fmt.dia(p.ultimo.created_at)"></div>
                          <div class="text-dim text-sm truncate maxw-16rem" :title="p.ultimo.name" x-text="p.ultimo.name"></div>
                        </div>
                      </template>
                    </td>
                    <td class="solo-escritorio ta-r" x-text="p.ultimo ? fmt.num(p.ultimo.paginas_html) : '—'"></td>
                    <td class="solo-escritorio ta-r"
                        :class="p.ultimo && p.ultimo.paginas_html && p.ultimo.indexables / p.ultimo.paginas_html < .5 ? 'text-orange' : ''"
                        x-text="p.ultimo && p.ultimo.paginas_html ? Math.round(p.ultimo.indexables / p.ultimo.paginas_html * 100) + ' %' : '—'"></td>
                    <!-- Paginas con error (decision 202): la portada decia «85» y la
                         tarjeta del mismo censo «72 páginas con error». Con una API
                         anterior, las incidencias, dicho en el title. Solo el campo
                         de la fila, como la cabecera: paginasConError() mira la
                         evolucion del ultimo cliente abierto y esa fila pasaba a
                         paginas bajo «errores (incidencias)» (revision del 27-oct). -->
                    <td class="ta-r" data-label="Páginas con error" :class="p.ultimo && (p.ultimo.paginas_con_error ?? p.ultimo.errores) ? 'text-red' : ''">
                      <template x-if="!p.ultimo"><span>—</span></template>
                      <template x-if="p.ultimo && p.ultimo.paginas_con_error != null"><span x-text="fmt.num(p.ultimo.paginas_con_error)"></span></template>
                      <template x-if="p.ultimo && p.ultimo.paginas_con_error == null">
                        <span title="Incidencias de gravedad error: esta versión del servidor no dice cuántas páginas" x-text="fmt.num(p.ultimo.errores)"></span>
                      </template>
                      <!-- Un censo que paro en el tope no es el sitio entero (1.6;
                           decision 203). -->
                      <div class="text-sm orange" x-show="p.ultimo && p.ultimo.topado" data-testid="panel-topado"
                           x-text="p.ultimo && p.ultimo.topado ? 'topado en ' + fmt.num(p.ultimo.topado) + ' URLs' : ''"></div>
                    </td>
                    <td class="nowrap" data-label="Tendencia">
                      <template x-if="!p.evolucion || !p.evolucion.tendencia"><span class="text-dim text-sm">—</span></template>
                      <template x-if="p.evolucion && p.evolucion.tendencia">
                        <span class="evo-tendencia" :title="(p.evolucion.metrica === 'urls_con_error' ? 'Páginas con error' : 'Incidencias de error') + ', serie «' + p.evolucion.serie + '». ' + ((textoTendencia(p.evolucion.tendencia) || {}).titulo || '')">
                          <span x-html="sparkline(p.evolucion.valores, p.evolucion.cortes, { mejor: 'baja' })"></span>
                          <span class="delta" :class="(textoTendencia(p.evolucion.tendencia) || {}).clase"
                                x-text="(textoTendencia(p.evolucion.tendencia) || {}).texto"></span>
                        </span>
                      </template>
                    </td>
                    <!-- Las alertas abiertas (incidentes vivos, decision 139): la
                         misma cifra que la ficha del cliente y su pestana Alertas.
                         Antes salian a la vez «3 alertas» (las de la ultima
                         comparacion) y «5 incidentes» (revision de UX del
                         25-oct, 2.3; el porque, en cargarAlertasAbiertas). -->
                    <td class="text-sm" data-label="Alertas">
                      <template x-if="p.incidentes_vivos">
                        <a :href="'#/clientes/' + p.id + '/alertas'" @click.stop class="text-orange"
                           x-text="fmt.num(p.incidentes_vivos) + (p.incidentes_vivos === 1 ? ' abierta' : ' abiertas')"></a>
                      </template>
                      <!-- Sin alertas abiertas, lo que salto el ultimo censo no se
                           calla (un censo sin perfil ni programacion no las abre). -->
                      <template x-if="alertasSinAbrirPanel(p)">
                        <a :href="'#/rastreos/' + p.ultimo.id + '/comparar'" @click.stop
                           :class="alertasSinAbrirPanel(p).criticas ? 'text-red' : 'text-orange'"
                           :title="'Saltaron al comparar el censo del ' + fmt.diaCorto(p.ultimo.created_at) + ' con el anterior; no constan abiertas porque el rastreo no es de un perfil ni de una programación, o porque ya se cerraron'"
                           x-text="'saltaron ' + fmt.num(alertasSinAbrirPanel(p).total) + ' en el último censo' + (alertasSinAbrirPanel(p).criticas ? ' (' + fmt.num(alertasSinAbrirPanel(p).criticas) + (alertasSinAbrirPanel(p).criticas === 1 ? ' crítica)' : ' críticas)') : '')"></a>
                      </template>
                      <template x-if="!p.incidentes_vivos && !alertasSinAbrirPanel(p)"><span class="text-dim">—</span></template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== FICHA DE UN CLIENTE ===== -->
    <template x-if="view === 'client'">
      <div>
        <div class="flex items-center justify-between mb-2 flex-wrap gap-50">
          <div>
            <h2 class="fs-md fw-700" x-text="cliente ? cliente.nombre : 'Nuevo cliente'"></h2>
            <div class="text-dim text-sm" x-show="cliente"
                 x-text="cliente ? (cliente.slug + ' · ' + ((cliente.dominios || []).join(', ') || 'sin dominios')) : ''"></div>
          </div>
          <!-- El unico «Nuevo rastreo» de la ficha (revision de UX del 25-oct,
               2.1 y V47): el de la barra de arriba se esconde aqui. Viene con
               el cliente y su perfil principal (revision del 26-oct: antes solo el
               cliente, y el rastreo salia sin perfil ni semillas). -->
          <template x-if="cliente">
            <button class="btn btn-primary btn-sm flex items-center gap-35" @click="openCreate(_presetDelContexto())" data-testid="cliente-nuevo-rastreo">
              <i data-lucide="plus-circle" class="ico-14"></i> Nuevo rastreo
            </button>
          </template>
        </div>

        <!-- Cuatro pestanas (revision de UX del 25-oct, 2.1): Estado es la de
             entrada (que esta roto, que ha empeorado, que hay abierto);
             Historial, la evolucion; Alertas, solo las alertas; y
             Configuracion, los perfiles, el cliente y las reglas. -->
        <div class="tabs tabs-cliente" x-show="cliente" role="tablist">
          <template x-for="t in [['estado', 'activity', 'Estado'], ['historial', 'line-chart', 'Historial'], ['alertas', 'bell', 'Alertas'], ['config', 'settings', 'Configuración']]" :key="t[0]">
            <button type="button" class="tab flex items-center gap-35" role="tab" :class="clienteTab === t[0] && 'active'" :aria-selected="clienteTab === t[0]"
                    @click="cambiarTabCliente(t[0])" :data-testid="'tab-' + t[0]">
              <i :data-lucide="t[1]" class="ico-14"></i>
              <span x-text="t[2]"></span>
              <span class="count" x-show="t[0] === 'alertas' && alertasAbiertas && alertasAbiertas.length"
                    :class="(alertasAbiertas || []).some(a => a.severidad === 'critical') ? 'count-critica' : ((alertasAbiertas || []).every(a => a.severidad === 'info') ? 'count-info' : 'count-aviso')"
                    x-text="alertasAbiertas ? alertasAbiertas.length : ''"></span>
            </button>
          </template>
        </div>

        <template x-if="clienteError">
          <div class="card mb-2 btn-rojo"
               x-text="clienteError"></div>
        </template>

        <!-- --- Pestana Estado (revision de UX del 25-oct, 2.1) --- -->
        <template x-if="cliente && clienteTab === 'estado'">
          <div data-testid="cliente-estado">
            <template x-if="rastreoEnCursoCliente()">
              <a class="card mb-2 estado-en-curso text-sm" :href="'#/rastreos/' + rastreoEnCursoCliente().id">
                <span class="badge" :class="statusColor(rastreoEnCursoCliente().status)" x-text="fmt.status(rastreoEnCursoCliente().status)"></span>
                <span x-text="rastreoEnCursoCliente().name"></span>
                <span class="text-dim" x-text="'· lanzado ' + fmt.ago(rastreoEnCursoCliente().created_at)"></span>
              </a>
            </template>

            <!-- Siguiente paso (revision de UX del 25-oct, 2.14): sin censo
                 todavia y con un perfil, lo que toca es lanzar o programar.
                 Es lo primero que se ve tras el alta guiada. -->
            <template x-if="!ultimoCensoCliente() && !serieTruncadaCliente() && !rastreoEnCursoCliente() && perfilSiguientePaso()">
              <div class="card siguiente-paso" data-testid="siguiente-paso">
                <p class="text-sm siguiente-ok" x-show="altaReciente === cliente.id">
                  <i data-lucide="check-circle" class="ico-15"></i>
                  <span x-text="'Cliente creado con el perfil «' + perfilSiguientePaso().nombre + '».'"></span>
                </p>
                <h3>Siguiente paso: el primer censo</h3>
                <p class="text-dim text-sm">
                  Perfil «<span x-text="perfilSiguientePaso().nombre"></span>», que empieza en
                  <span class="siguiente-semilla" x-text="(perfilSiguientePaso().seeds || [])[0]"></span><span x-show="(perfilSiguientePaso().seeds || []).length > 1" x-text="' y ' + fmt.num(perfilSiguientePaso().seeds.length - 1) + ' más'"></span>.
                  <a href="#" @click.prevent="editarPerfil(perfilSiguientePaso())">Cambiarlo</a>
                </p>
                <div class="siguiente-opciones">
                  <div class="siguiente-opcion">
                    <button class="btn btn-primary flex items-center gap-35" @click="lanzarDesdeSiguientePaso('canario')" data-testid="siguiente-canario">
                      <i data-lucide="bird" class="ico-14"></i> Lanzar canario</button>
                    <span class="text-sm text-dim">Primero 250 páginas, en minutos: dice si el sitio bloquea o necesita render antes de rastrearlo entero.</span>
                  </div>
                  <div class="siguiente-opcion">
                    <button class="btn flex items-center gap-35" @click="lanzarDesdeSiguientePaso('censo')" data-testid="siguiente-censo">
                      <i data-lucide="rocket" class="ico-14"></i> Lanzar censo</button>
                    <span class="text-sm text-dim">El sitio entero. Según el tamaño, de minutos a horas.</span>
                  </div>
                  <div class="siguiente-opcion">
                    <template x-if="!programacionesDePerfil(perfilSiguientePaso().id).length">
                      <button class="btn flex items-center gap-35" @click="abrirNuevaProgramacion({ cliente_id: cliente.id, profile_id: perfilSiguientePaso().id, cron: '0 3 * * 1' })"
                              data-testid="siguiente-programar">
                        <i data-lucide="calendar-clock" class="ico-14"></i> Programar cada semana</button>
                    </template>
                    <template x-if="programacionesDePerfil(perfilSiguientePaso().id).length">
                      <button class="btn flex items-center gap-35" @click="editarProgramacion(programacionesDePerfil(perfilSiguientePaso().id)[0])">
                        <i data-lucide="calendar-check" class="ico-14"></i>
                        <span x-text="'Programado ' + fmt.cron(programacionesDePerfil(perfilSiguientePaso().id)[0].cron)"></span></button>
                    </template>
                    <span class="text-sm text-dim">Se repite solo y cada censo se compara con el anterior: así llegan las alertas.</span>
                  </div>
                </div>
              </div>
            </template>

            <!-- Sin censos todavia -->
            <template x-if="!ultimoCensoCliente() && !(!serieTruncadaCliente() && !rastreoEnCursoCliente() && perfilSiguientePaso())">
              <div class="card empty" data-testid="estado-vacio">
                <!-- /serie trae los 30 mas recientes: con 30 rastreos que no son
                     censo no se puede afirmar que no haya ninguno (revision 2.3). -->
                <h3 x-text="serieTruncadaCliente() ? 'Ningún censo terminado entre los ' + fmt.num(clienteSerie.length) + ' rastreos más recientes' : 'Todavía no hay ningún censo de este cliente'"></h3>
                <p class="text-sm mt-30 mb-0 mx-0" x-show="serieTruncadaCliente()">
                  <a :href="'#/rastreos?cliente=' + cliente.id">Ver todos sus rastreos</a></p>
                <p class="text-dim text-sm" style="max-width:440px;margin:.3rem auto 0;line-height:1.5" x-show="!serieTruncadaCliente()"
                   x-text="clientePerfiles.length
                     ? 'Lanza el primero con «Nuevo rastreo» o desde uno de sus perfiles, en Configuración. Cuando termine, aquí verás qué está roto, qué ha cambiado y qué alertas hay abiertas.'
                     : 'Crea un perfil en Configuración (qué se rastrea y cómo) y lanza el primer rastreo con «Nuevo rastreo». Cuando termine, aquí verás qué está roto, qué ha cambiado y qué alertas hay abiertas.'"></p>
              </div>
            </template>

            <template x-if="ultimoCensoCliente()">
              <div>
                <!-- El ultimo censo y sus cifras -->
                <div class="card mb-2" data-testid="estado-ultimo-censo">
                  <div class="estado-censo-cab">
                    <div class="minw-0">
                      <div class="text-dim text-sm">Último censo</div>
                      <a class="estado-censo-nombre" :href="'#/rastreos/' + ultimoCensoCliente().id" x-text="ultimoCensoCliente().name"></a>
                      <div class="text-sm text-dim">
                        <span x-text="fmt.dia(ultimoCensoCliente().created_at)"></span> ·
                        <span class="badge" :class="statusColor(ultimoCensoCliente().status)" x-text="fmt.status(ultimoCensoCliente().status)"></span>
                      </div>
                    </div>
                    <div class="estado-censo-botones">
                      <a class="btn btn-sm" :href="'#/rastreos/' + ultimoCensoCliente().id">Ver censo</a>
                      <a class="btn btn-sm" :href="'#/rastreos/' + ultimoCensoCliente().id + '/informe-cliente'"
                         data-tip="Nota, qué arreglar primero y qué ha cambiado; se guarda como PDF">Informe para el cliente</a>
                    </div>
                  </div>
                  <div class="estado-cifras">
                    <div>
                      <div class="estado-cifra" x-text="fmt.num(ultimoCensoCliente().paginas_html)"></div>
                      <div class="text-sm text-dim">páginas</div>
                    </div>
                    <div>
                      <div class="estado-cifra" x-text="fmt.num(ultimoCensoCliente().indexables)"></div>
                      <div class="text-sm text-dim"
                           x-text="'indexables' + (ultimoCensoCliente().paginas_html ? ' (' + fmt.num(Math.round(ultimoCensoCliente().indexables / ultimoCensoCliente().paginas_html * 100)) + ' %)' : '')"></div>
                    </div>
                    <!-- Paginas con error de /stats (revision 1.11), la misma
                         cifra que la tarjeta del censo; si no llega, «—». -->
                    <div>
                      <div class="estado-cifra"
                           :class="estadoCliente && estadoCliente.stats && estadoCliente.stats.paginas_con_error != null ? (estadoCliente.stats.paginas_con_error ? 'red' : 'green') : ''"
                           x-text="estadoCliente && estadoCliente.stats && estadoCliente.stats.paginas_con_error != null ? fmt.num(estadoCliente.stats.paginas_con_error) : '—'"></div>
                      <div class="text-sm text-dim">páginas con error</div>
                    </div>
                  </div>
                </div>

                <!-- Google en el ultimo censo (revision de UX del 25-oct, 3.3):
                     las mismas cifras y la misma frase que su Resumen. Sin
                     Search Console no se pinta. -->
                <template x-if="estadoCliente && estadoCliente.job && bloqueGoogle(estadoCliente.job)">
                  <div class="card mb-2 text-sm google-bloque" data-testid="estado-google" x-data="{ get bg() { return bloqueGoogle(estadoCliente && estadoCliente.job) || BLOQUE_GOOGLE_VACIO } }">
                    <div class="card-header"><h2>Google</h2>
                      <a class="text-sm" :href="'#/rastreos/' + estadoCliente.jobId">Ver en el censo</a></div>
                    <div class="google-cifras" x-show="bg.cifras.length">
                      <template x-for="c in bg.cifras" :key="c.etiqueta">
                        <div class="google-cifra">
                          <div class="google-valor" x-text="c.valor"></div>
                          <div class="text-dim"><span x-text="c.etiqueta"></span> · <span x-text="c.ventana"></span></div>
                        </div>
                      </template>
                    </div>
                    <template x-for="(c, n) in bg.conclusiones" :key="'c' + n">
                      <p class="google-frase" :class="c.nivel === 'dim' ? 'text-dim' : c.nivel" x-text="c.texto"></p>
                    </template>
                    <ul class="google-lista" x-show="bg.textos.length">
                      <template x-for="(x, n) in bg.textos" :key="'t' + n"><li><span x-text="x"></span><!-- Sus paginas (3.3): solo si se sabe de que grupo sale la frase. --><template x-for="u in paginasDeFraseTrafico(x, bg.trafico)" :key="u"><span class="google-enlace-frase"> · <a href="#" class="informe-url" @click.prevent="abrirFichaDeCenso(estadoCliente.jobId, u)" :title="'Abrir la ficha de ' + u" x-text="rutaCorta(u)"></a></span></template></li></template>
                    </ul>
                    <div x-show="bg.inspeccion" class="google-frase" x-text="bg.inspeccion"></div>
                  </div>
                </template>

                <div class="estado-rejilla">
                  <!-- Los cinco primeros problemas, por prioridad (la consulta de
                       «Que arreglar primero» del Resumen del censo) -->
                  <div class="card" data-testid="estado-problemas">
                    <div class="card-header"><h2>Qué arreglar primero</h2>
                      <a class="text-sm" :href="'#/rastreos/' + ultimoCensoCliente().id + '/problemas'">Ver todos</a></div>
                    <div class="text-dim text-sm mt-n30 mb-60 mx-0">Páginas afectadas en el último censo, por prioridad (gravedad × importancia de las páginas).</div>
                    <template x-if="!estadoCliente || (estadoCliente.principales === null && !estadoCliente.principalesError)">
                      <div class="text-dim text-sm">Cargando…</div>
                    </template>
                    <template x-if="estadoCliente && estadoCliente.principalesError">
                      <div class="text-sm text-orange">No se pudieron cargar.
                        <button class="btn btn-sm" @click="estadoCliente = null; cargarEstadoCliente()">Reintentar</button></div>
                    </template>
                    <template x-if="estadoCliente && estadoCliente.principales && !estadoCliente.principales.length">
                      <div class="text-dim text-sm">No hay errores ni avisos.</div>
                    </template>
                    <ol class="estado-problemas" x-show="estadoCliente && estadoCliente.principales && estadoCliente.principales.length">
                      <template x-for="i in (estadoCliente && estadoCliente.principales) || []" :key="i.issue_type">
                        <li>
                          <span class="estado-sev" :style="'background:' + issueBarColor(i.severity)" :title="fmt.severity(i.severity)"></span>
                          <a class="estado-problema" :href="'#/rastreos/' + ultimoCensoCliente().id + '/problemas?tipo=' + encodeURIComponent(i.issue_type) + ((i.partes || []).length > 1 ? '' : '&gravedad=' + i.severity)"
                             x-text="fmt.issue(i.issue_type)"></a>
                          <a class="text-sm estado-paginas" :href="'#/rastreos/' + ultimoCensoCliente().id + '/explorador?problema=' + encodeURIComponent(i.issue_type) + ((i.partes || []).length > 1 ? '' : '&gravedad=' + i.severity)"
                             :title="'Ver las URLs con «' + fmt.issue(i.issue_type) + '» en el Explorador'"
                             x-text="i.paginas != null ? fmt.n(i.paginas, 'página', 'páginas') : 'páginas: ' + desgloseGravedad(i)"></a>
                        </li>
                      </template>
                    </ol>
                  </div>

                  <!-- Lo que cambio frente al anterior: las alertas de la
                       comparacion del ultimo censo, con la fecha del censo con el
                       que se comparo (revision de UX del 25-oct, 2.3). -->
                  <div class="card" data-testid="estado-cambios">
                    <template x-if="!estadoCliente || (!estadoCliente.job && !estadoCliente.error)">
                      <div>
                        <div class="card-header"><h2>Qué ha cambiado</h2></div>
                        <div class="text-dim text-sm">Cargando…</div>
                      </div>
                    </template>
                    <template x-if="estadoCliente && estadoCliente.error && !estadoCliente.job">
                      <div>
                        <div class="card-header"><h2>Qué ha cambiado</h2></div>
                        <div class="text-sm text-orange">No se pudo cargar la comparación.
                          <button class="btn btn-sm" @click="estadoCliente = null; cargarEstadoCliente()">Reintentar</button></div>
                      </div>
                    </template>
                    <template x-if="estadoCliente && estadoCliente.job">
                      <div>
                        <div class="card-header">
                          <h2 x-text="cmpEstado() && cmpEstado().fecha_anterior ? 'Qué ha cambiado frente al ' + fmt.diaCorto(cmpEstado().fecha_anterior) : 'Qué ha cambiado'"></h2>
                          <a class="text-sm" x-show="cmpEstado()" :href="'#/rastreos/' + estadoCliente.jobId + '/comparar'">Comparar</a>
                        </div>
                        <template x-if="!cmpEstado()">
                          <div class="text-dim text-sm">Este censo no se comparó con ninguno: es el primero de su sitio o se analizó sin comparación automática.</div>
                        </template>
                        <template x-if="cmpEstado() && !cmpEstado().comparable">
                          <div class="text-dim text-sm" x-text="'No se puede comparar con ' + (cmpEstado().nombre_anterior || 'el anterior') + (cmpEstado().motivo ? ': ' + cmpEstado().motivo : '') + '. Lo que no se puede afirmar no se afirma.'"></div>
                        </template>
                        <template x-if="cmpEstado() && cmpEstado().comparable">
                          <div>
                            <!-- Solo el nombre de la referencia: la comparacion no dice si
                                 es de la misma programacion o de la regla del host
                                 (shared/clientes.censo_anterior), y lo que no se sabe no
                                 se afirma. Sus avisos (versiones distintas del crawler...)
                                 van delante de las cifras: decisiones 66, 67 y 72. -->
                            <div class="text-dim text-sm mt-n30 mb-50 mx-0" x-text="'Frente a ' + (cmpEstado().nombre_anterior || 'el censo anterior') + ', el censo con el que se comparó al terminar.'"></div>
                            <template x-for="(av, k) in (cmpEstado().avisos || [])" :key="k">
                              <div class="text-sm text-orange estado-aviso-cmp" x-text="av"></div>
                            </template>
                            <!-- «Saltaron»: las alertas de ESTA comparacion. Las abiertas
                                 (incidentes) son las de la tarjeta de abajo; un solo
                                 sustantivo con su estado (revision de UX del 25-oct, 2.3). -->
                            <template x-if="!(cmpEstado().alertas || []).length">
                              <div class="text-sm"><span class="text-green">No saltó ninguna alerta:</span> ningún cambio pasa los umbrales de las reglas del cliente.</div>
                            </template>
                            <div class="text-sm" x-show="(cmpEstado().alertas || []).length"
                                 x-text="(n => (n === 1 ? 'Saltó 1 alerta' : 'Saltaron ' + fmt.num(n) + ' alertas') + ':')((cmpEstado().alertas || []).length)"></div>
                            <ul class="estado-alertas" x-show="(cmpEstado().alertas || []).length">
                              <template x-for="al in (cmpEstado().alertas || [])" :key="al.regla + (al.extraccion || '')">
                                <li :style="'border-left-color:' + fmt.colorSeveridad(al.severidad)">
                                  <strong x-text="fmt.tituloAlerta(al)"></strong>
                                  <span class="text-sm text-dim" x-show="al.paginas != null"
                                        x-text="fmt.num(al.paginas) + ' de ' + fmt.num(al.de) + ' páginas (' + fmt.num(al.pct) + ' %)'"></span>
                                </li>
                              </template>
                            </ul>
                            <!-- Sin «No incluida en el sitemap» si un censo leyo sus
                                 sitemaps a medias, y dicho (decision 205). -->
                            <template x-if="incidenciasEstado()">
                              <div class="text-sm text-dim mt-50" data-testid="estado-incidencias">
                                <div x-text="(a => fmt.num(a.nuevas || 0) + ' incidencias nuevas y ' + fmt.num(a.resueltas || 0) + ' resueltas')(incidenciasEstado() || {})"></div>
                                <div x-show="(incidenciasEstado() || {}).sinSitemap" x-text="TEXTO_SIN_SITEMAP"></div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Las alertas abiertas: la misma cifra que la portada y la
                 pestana Alertas (revision de UX del 25-oct, 2.3). -->
            <div class="card mt-2" data-testid="estado-alertas-abiertas">
              <div class="card-header">
                <h2 x-text="alertasAbiertas && alertasAbiertas.length ? 'Alertas abiertas (' + fmt.num(alertasAbiertas.length) + ')' : 'Alertas abiertas'"></h2>
                <a class="text-sm" :href="'#/clientes/' + cliente.id + '/alertas'">Ver todas</a>
              </div>
              <template x-if="alertasAbiertas === null"><div class="text-dim text-sm">Cargando…</div></template>
              <!-- Las que salto un censo y ya se cerraron estan en Cerradas: sin
                   el enlace, «Ninguna alerta abierta» junto a «frente al 14 oct:
                   saltaron 3» parecia una contradiccion (revision 2.3). -->
              <template x-if="alertasAbiertas && !alertasAbiertas.length">
                <div class="text-dim text-sm">Ninguna alerta abierta.
                  <a href="#" @click.prevent="verAlertasCerradas()">Ver las cerradas</a></div>
              </template>
              <ul class="estado-alertas" x-show="alertasAbiertas && alertasAbiertas.length">
                <template x-for="i in (alertasAbiertas || []).slice(0, 5)" :key="i.id">
                  <li :style="'border-left-color:' + fmt.colorSeveridad(i.severidad)">
                    <strong x-text="tituloIncidente(i)"></strong>
                    <span class="text-sm text-dim" x-text="(i.nombre_serie || i.serie) + ' · desde el ' + fmt.diaCorto(i.abierto_en) + (i.estado === 'visto' ? ' · vista' : '')"></span>
                  </li>
                </template>
              </ul>
              <div class="text-sm" x-show="alertasAbiertas && alertasAbiertas.length > 5">
                <a :href="'#/clientes/' + cliente.id + '/alertas'" x-text="'Y ' + fmt.num((alertasAbiertas || []).length - 5) + ' más'"></a>
              </div>
            </div>
          </div>
        </template>

        <!-- --- Pestana Historial: trafico, evolucion por perfil y tabla --- -->
        <template x-if="cliente && clienteTab === 'historial'">
          <div data-testid="cliente-historial">
            <!-- Trafico de Google entre los dos ultimos censos de cada perfil
                 (decisiones 158 y 165). Las frases vienen del servidor, del
                 mismo redactor que la ficha del rastreo y el aviso de Slack. -->
            <template x-if="clienteTrafico && clienteTrafico.length">
              <div class="card mb-2 text-sm" data-testid="trafico-cliente">
                <h3 class="mb-1 fs-base">Tráfico de Google entre censos</h3>
                <template x-for="t in clienteTrafico" :key="t.job_id">
                  <div class="mb-50">
                    <a :href="'#/rastreos/' + t.job_id" x-text="(t.perfil ? t.perfil + ' · ' : '') + t.job"></a>
                    <!-- La fecha solo si el nombre no la lleva ya: salia
                         «2026-10-26 · 2026-10-26» (V46). -->
                    <span class="text-dim" x-show="t.fecha && !(t.job || '').includes((t.fecha || '').slice(0, 10))" x-text="' · ' + fmt.dia(t.fecha)"></span>
                    <span class="badge badge-pending" x-show="t.pendiente" style="margin-left:.3rem">esperando datos</span>
                    <ul class="mt-20 mb-0 mx-0 pl-110">
                      <template x-for="(x, n) in t.textos" :key="n">
                        <li x-text="x"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </template>

            <!-- Evolucion por perfil (decision 130): graficas de `profile_runs`.
                 Solo los censos comparables hacen linea; lo fallido, truncado,
                 canario o lista va abajo con una ×. Un corte «v» marca que entre
                 dos puntos cambio la version del analisis. -->
            <template x-if="clienteEvolucion && clienteEvolucion.series && clienteEvolucion.series.length">
              <div class="card mb-2 evo">
                <div class="flex items-center mb-1 gap-50 flex-wrap">
                  <h3 class="fs-base">Evolución por perfil</h3>
                  <template x-if="clienteEvolucion.series.length > 1">
                    <select x-model="evolucionClave" class="text-sm" style="margin-left:auto;max-width:min(100%,24rem)">
                      <template x-for="s in clienteEvolucion.series" :key="s.clave">
                        <option :value="s.clave" :selected="s.clave === evolucionClave"
                                x-text="s.nombre + ' (' + s.comparables + (s.comparables === 1 ? ' censo' : ' censos') + (s.puntos.length ? ', hasta el ' + fmt.diaCorto(s.puntos[s.puntos.length - 1].fecha) : '') + ')'"></option>
                      </template>
                    </select>
                  </template>
                </div>
                <template x-if="serieEvolucion() && serieEvolucion().comparables < 2">
                  <p class="text-dim text-sm">Hacen falta dos censos comparables (completos, ni canarios ni pruebas) para dibujar una evolución.</p>
                </template>
                <template x-if="serieEvolucion() && serieEvolucion().comparables >= 2">
                  <div>
                    <!-- La referencia de las flechas, con su fecha: el censo
                         comparable anterior de la serie, el mismo con el que se
                         compararon sus alertas (revision de UX del 25-oct, 2.3). -->
                    <p class="text-sm text-dim" style="margin:-.2rem 0 .6rem" x-show="referenciaSerie()" data-testid="evo-referencia"
                       x-text="'Cada flecha compara el último censo comparable de la serie (' + fmt.diaCorto(serieEvolucion().puntos.filter(p => p.comparable).slice(-1)[0].fecha) + ') con el anterior, el del ' + fmt.diaCorto(referenciaSerie() && referenciaSerie().fecha) + '.'"></p>
                    <div class="evo-rejilla">
                      <template x-for="k in METRICAS_GRAFICADAS" :key="k">
                        <div class="evo-grafica">
                          <div class="evo-cab">
                            <span class="text-sm" x-text="etiquetaMetrica(k)"></span>
                            <span class="evo-valor">
                              <span x-text="resumenMetrica(k).valor"></span>
                              <template x-if="resumenMetrica(k).tendencia">
                                <span class="delta" :class="resumenMetrica(k).tendencia.clase"
                                      :title="resumenMetrica(k).tendencia.titulo"
                                      x-text="resumenMetrica(k).tendencia.texto"></span>
                              </template>
                            </span>
                          </div>
                          <div x-html="graficaEvolucion(k)"></div>
                        </div>
                      </template>
                    </div>
                    <p class="text-dim text-sm evo-leyenda">
                      <span class="evo-ley-punto"></span> censo comparable ·
                      <span class="evo-ley-tramo mejora"></span> mejora ·
                      <span class="evo-ley-tramo empeora"></span> empeora ·
                      <span class="evo-fuera-txt">×</span> no comparable (fallido, truncado, canario, prueba o lista; pasa el ratón para el motivo) ·
                      <span class="evo-ley-corte">v</span> cambió la versión del análisis: el salto puede ser nuestro, no del sitio.
                      <br>El eje vertical no siempre empieza en 0, pero abarca al menos un 20 % del valor más alto: una variación pequeña se ve pequeña.
                    </p>
                  </div>
                </template>
                <template x-if="clienteEvolucion.sin_agregado">
                  <p class="text-dim text-sm" x-text="fmt.num(clienteEvolucion.sin_agregado) + (clienteEvolucion.sin_agregado === 1 ? ' rastreo terminado no tiene' : ' rastreos terminados no tienen') + ' sus cifras agregadas (son anteriores a la evolución): scripts/rellenar_evolucion.py los rellena.'"></p>
                </template>
              </div>
            </template>

            <div class="card">
              <!-- La serie (UX-08): cada rastreo con las cifras que se comparan
                   de un censo a otro. La diferencia de errores y las alertas se
                   miden contra el censo con el que se comparo (`comparado_con`),
