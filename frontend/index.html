<!-- ===== MODAL: CREAR NUEVO RASTREO ===== -->
<template x-if="showCreate">
  <div class="modal-backdrop" @click.self="showCreate = false" @keydown.escape.window="showCreate = false">
    <div class="modal modal--wide">
      <div class="modal-header">
        <div>
          <h3 class="flex items-center gap-40">
            <i data-lucide="radar" class="ico-18 c-brand"></i> Nuevo rastreo
          </h3>
          <p class="text-dim text-sm mt-25">Configura y lanza un rastreo SEO completo de un sitio web</p>
        </div>
        <button class="btn-icon fs-md" @click="showCreate = false">&times;</button>
      </div>
      <div class="modal-body">
        <template x-if="createError">
          <div class="card mb-2 btn-rojo" x-text="createError"></div>
        </template>
        <!-- Desde el siguiente paso del alta (revision de UX del 25-oct, 2.14) -->
        <template x-if="createSugerencia === 'canario'">
          <div class="card mb-2 sugerencia-lanzar text-sm" data-testid="sugerencia-canario">
            <strong>Canario:</strong> revisa lo de abajo y pulsa «Lanzar canario». Rastrea las primeras 250 páginas
            con esta misma configuración y no cuenta en la evolución del cliente.
          </div>
        </template>

        <!-- El cliente se elige, no se escribe: con texto libre una errata
             creaba otro cliente (#36). Al elegirlo, el formulario se precarga
             con su configuracion y la del perfil. -->
        <div class="form-row">
          <div class="form-group">
            <label>Cliente</label>
            <select x-model="createForm.cliente_id" @change="cambiarClienteModal()">
              <option value="">Sin cliente</option>
              <template x-for="c in clientes" :key="c.id">
                <option :value="c.id" x-text="c.nombre" :selected="c.id === createForm.cliente_id"></option>
              </template>
              <option value="__nuevo__">Nuevo cliente…</option>
            </select>
          </div>
          <div class="form-group" x-show="createForm.cliente_id">
            <label>Perfil de rastreo</label>
            <select x-model="createForm.profile_id" @change="aplicarHerencia()">
              <option value="">Rastreo puntual (sin perfil)</option>
              <template x-for="p in createPerfiles" :key="p.id">
                <option :value="p.id" :selected="p.id === createForm.profile_id"
                        x-text="p.nombre + (p.rol === 'competidor' ? ' (competidor)' : '')"></option>
              </template>
            </select>
          </div>
        </div>
        <!-- Sin cliente, aviso claro y el boton lo dice (revision de UX del 25-oct, 2.4) -->
        <div class="cfg-aviso cfg-aviso--aviso aviso-modal-sin-cliente" x-show="!createForm.cliente_id" data-testid="aviso-sin-cliente">
          <strong>Sin cliente.</strong> Este rastreo no hereda ninguna configuración ni cuenta en la evolución,
          las alertas o la portada de nadie. Elige uno salvo que sea una prueba suelta.
        </div>
        <div class="form-hint mt-n40 mb-80 mx-0" x-show="createForm.cliente_id">
          Sale con la configuración del cliente y la del perfil. Lo que cambies en «Configuración»
          solo vale para este rastreo; lo que no toques se hereda tal cual.
        </div>

        <!-- El tipo, siempre a la vista y siempre con uno marcado (revision de
             UX del 25-oct, 1.6; decision 203): prueba de serie sin perfil,
             censo con perfil. Solo un censo cuenta en la portada y la evolucion. -->
        <div class="form-group" data-testid="nr-tipo">
          <label>Tipo *</label>
          <div class="flex gap-75 flex-wrap" role="radiogroup" aria-label="Tipo de rastreo">
            <template x-for="t in [['censo', 'Censo', 'El sitio entero: cuenta en la portada, la evolución y las alertas'], ['prueba', 'Prueba', 'Para probar algo: no cuenta en la portada ni en la evolución'], ['canario', 'Canario', 'Unas pocas páginas para comprobar bloqueos y ritmo antes del censo']]" :key="t[0]">
              <label class="checkbox-label" :title="t[2]">
                <input type="radio" name="nr-tipo" :value="t[0]" :checked="tipoRastreoModal() === t[0]" @change="createForm.tipo = t[0]">
                <span x-text="t[1]"></span>
              </label>
            </template>
          </div>
          <div class="form-hint" x-text="({censo: 'Censo: el sitio entero; cuenta en la portada, la evolución y las alertas.', prueba: 'Prueba: no cuenta en la portada ni en la evolución.' + (createForm.profile_id ? '' : ' Sin perfil sale como prueba salvo que elijas otra cosa.'), canario: 'Canario: unas pocas páginas para comprobar bloqueos, render y ritmo; no cuenta en la evolución.'})[tipoRastreoModal()]"></div>
        </div>

        <!-- Campos siempre visibles -->
        <div class="form-group">
          <label>Nombre del trabajo *</label>
          <input type="text" x-model="createForm.name" placeholder="Ej.: midominio.com - auditoría completa">
        </div>
        <div class="form-group">
          <label>URLs semilla * (una por línea)<span class="ayuda" tabindex="0" role="img" aria-label="Qué son las semillas"
                data-tip="Las páginas por las que empieza el rastreo: desde ellas sigue los enlaces internos. Normalmente basta la portada; añade otras si hay partes del sitio a las que no se llega enlazando.">?</span></label>
          <textarea x-model="createForm.seeds" placeholder="https://midominio.com" rows="3"></textarea>
        </div>
        <!-- La configuracion, plegada (UX-19) y con el MISMO formulario que el
             cliente y el perfil (decision 196; revision de UX del 25-oct, 2.4):
             cada campo dice si viene del cliente, del perfil o de serie, y solo
             se manda lo que se cambia aqui. Los avisos graves, fuera del pliegue. -->
        <template x-if="cfgRastreo && cfgRastreo.resuelta">
          <div>
            <template x-for="(a, n) in (cfgRastreo.resuelta.avisos || []).filter(a => a.nivel === 'peligro')" :key="'p' + n">
              <p class="cfg-aviso cfg-aviso--peligro" data-testid="aviso-modal" x-text="a.texto"></p>
            </template>
          </div>
        </template>
        <details class="config-avanzada" data-testid="config-rastreo">
          <summary>
            <span>Configuración</span>
            <span class="text-dim text-sm" x-text="resumenConfig()"></span>
          </summary>
          <template x-if="cfgRastreo">
            <div class="cfg-host" x-data="{ get i() { return cfgRastreo } }" x-html="plantillaCfg()"></div>
          </template>
        <!-- ===== TAB: Extraccion a medida (#34, decision 166) =====
             Reglas CSS/XPath/regex que el rastreo aplica a cada pagina HTML 2xx.
             Las heredadas del cliente o del perfil llevan su marca: si no se
             tocan no se mandan (se heredan en el servidor), si se cambian se
             sustituyen enteras y si se quitan se manda `null`. La validacion
             es la del servidor (422) y sale arriba, en el aviso del modal. -->
        <details class="cfg-grupo xm-grupo" :open="createExtraccionAbierta" @toggle="createExtraccionAbierta = $event.target.open" data-testid="pestana-extraccion">
          <summary>
            <span>Extracción a medida</span>
            <span class="text-sm text-dim" x-text="extraccionActivas() ? '· ' + extraccionActivas() + (extraccionActivas() === 1 ? ' regla' : ' reglas') : '· ninguna'"></span>
          </summary>
          <div class="xm-pestana">
          <p class="text-sm text-dim xm-intro">
            Datos que se sacan de cada página HTML 2xx del rastreo (precio, SKU, autor…): salen como
            columnas <code>x.&lt;nombre&gt;</code> en la pestaña URLs y en el CSV. Una página sin fila es
            «no evaluada», que no es «vacía».
          </p>
          <template x-if="!createForm.extraccion.length">
            <p class="text-sm text-dim xm-vacio">Sin reglas. Añade una para empezar.</p>
          </template>
          <template x-for="(r, i) in createForm.extraccion" :key="r._id">
            <div class="xm-regla" :class="{ 'xm-regla--quitada': r.quitada, 'xm-regla--heredada': r.heredada }"
                 data-testid="regla-extraccion">
              <div class="xm-regla-cabecera">
                <template x-if="r.heredada">
                  <span class="xm-marca" :title="'Viene de la configuración del ' + r.origen + '. Si la cambias, solo cambia para este rastreo.'"
                        x-text="(r.quitada ? 'Quitada · ' : (extraccionTocada(r) ? 'Cambiada · ' : 'Heredada · ')) + r.origen"></span>
                </template>
                <span class="xm-error" x-show="extraccionErrorNombre(r, i)" x-text="extraccionErrorNombre(r, i)"></span>
                <span class="xm-hueco"></span>
                <template x-if="r.heredada && (r.quitada || extraccionTocada(r))">
                  <button type="button" class="btn btn-sm" @click="extraccionRestaurar(i)">Restaurar</button>
                </template>
                <button type="button" class="btn btn-sm" x-show="!r.quitada" @click="extraccionQuitar(i)"
                        :title="r.heredada ? 'No aplicarla en este rastreo (se manda null)' : 'Quitar la regla'">Quitar</button>
              </div>
              <div class="xm-campos" x-show="!r.quitada">
                <div class="form-group">
                  <label>Nombre</label>
                  <input type="text" x-model="r.nombre" placeholder="precio" maxlength="40" :disabled="r.heredada"
                         :title="r.heredada ? 'El nombre de una heredada no se cambia: quítala y crea otra' : 'Minúsculas, cifras y _; empieza por letra'">
                </div>
                <div class="form-group">
                  <label>Tipo</label>
                  <select x-model="r.tipo">
                    <option value="css">Selector CSS</option>
                    <option value="xpath">XPath</option>
                    <option value="regex">Regex</option>
                  </select>
                </div>
                <div class="form-group xm-campo-ancho">
                  <label x-text="r.tipo === 'regex' ? 'Expresión regular (sobre el HTML)' : (r.tipo === 'xpath' ? 'XPath' : 'Selector CSS')"></label>
                  <input type="text" x-model="r.expresion" class="mono"
                         :placeholder="r.tipo === 'regex' ? 'sku: (\\w+)' : (r.tipo === 'xpath' ? '//span[@itemprop=\'price\']' : '.precio .final')">
                </div>
                <div class="form-group" x-show="r.tipo !== 'regex'">
                  <label>Devuelve</label>
                  <select x-model="r.devuelve">
                    <option value="texto">Texto</option>
                    <option value="html_interno">HTML interno</option>
                    <option value="html">HTML del elemento</option>
                    <option value="atributo">Atributo</option>
                  </select>
                </div>
                <div class="form-group" x-show="r.tipo !== 'regex' && r.devuelve === 'atributo'">
                  <label>Atributo</label>
                  <input type="text" x-model="r.atributo" placeholder="content" class="mono">
                </div>
                <div class="form-group">
                  <label>Coincidencias</label>
                  <select x-model="r.cuantos">
                    <option value="primero">La primera</option>
                    <option value="todos">Todas</option>
                    <option value="recuento">Solo contarlas</option>
                  </select>
                </div>
                <div class="form-group" x-show="r.cuantos !== 'recuento'">
                  <label>Valor</label>
                  <select x-model="r.valor">
                    <option value="texto">Texto</option>
                    <option value="numero">Número (filtrable por rango)</option>
                  </select>
                </div>
              </div>
            </div>
          </template>
          <div class="xm-acciones">
            <button type="button" class="btn btn-sm" @click="extraccionNueva()" data-testid="extraccion-nueva">
              <i data-lucide="plus" class="icono-13"></i> Añadir regla
            </button>
          </div>

          <div class="config-section xm-seccion">
            <i data-lucide="flask-conical" class="icono-14"></i> Probar contra una URL en vivo
          </div>
          <p class="text-sm text-dim xm-intro">
            La descarga el worker (no tu navegador) con el User Agent y la huella del formulario, y aplica
            las reglas de esta pestaña más las heredadas. <strong>Sin render de JavaScript</strong>: lee el
            HTML de la respuesta, así que lo que monte el JavaScript puede no salir aquí.
          </p>
          <div class="xm-probar">
            <input type="url" x-model="extraccionPrueba.url" placeholder="https://midominio.com/una-ficha"
                   @keydown.enter.prevent="probarExtraccion()" data-testid="extraccion-url">
            <button type="button" class="btn btn-sm" @click="probarExtraccion()" data-testid="extraccion-probar"
                    :disabled="extraccionPrueba.cargando || !(extraccionPrueba.url || createForm.seeds)">
              <span class="spinner xm-spinner" x-show="extraccionPrueba.cargando"></span> Probar
            </button>
          </div>
          <template x-if="extraccionPrueba.error">
            <div class="xm-prueba-error" x-text="extraccionPrueba.error" data-testid="extraccion-error"></div>
          </template>
          <template x-if="extraccionPrueba.resultado">
            <div class="xm-resultado" data-testid="extraccion-resultado">
              <p class="text-sm text-dim" x-text="extraccionPrueba.resultado.fuente"></p>
              <template x-for="a in extraccionPrueba.resultado.avisos" :key="a">
                <p class="form-hint xm-aviso" x-text="a"></p>
              </template>
              <div class="table-wrap" x-show="extraccionPrueba.resultado.reglas.length">
                <table>
                  <thead><tr><th>Regla</th><th>Estado</th><th>Valor</th><th>Detalle</th></tr></thead>
                  <tbody>
                    <template x-for="f in extraccionPrueba.resultado.reglas" :key="f.nombre">
                      <tr>
                        <td class="mono" x-text="f.nombre"></td>
                        <td><span class="xm-estado" :class="'xm-estado--' + f.estado" x-text="f.estado"></span></td>
                        <td class="xm-valor" :title="f.valores ? f.valores.join(' | ') : (f.valor || '')"
                            x-text="f.valores ? f.valores.join(' | ') : (f.valor ?? '—')"></td>
                        <td class="text-dim" x-text="f.detalle || (f.n != null ? fmt.n(f.n, 'coincidencia', 'coincidencias') : '')"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p class="text-sm text-dim" x-show="extraccionPrueba.resultado.no_evaluadas.length"
                 x-text="'Sin evaluar en esta URL: ' + extraccionPrueba.resultado.no_evaluadas.join(', ')"></p>
            </div>
          </template>
        </div>
        </details>
        </details>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showCreate = false">Cancelar</button>
        <!-- El canario antes que el censo: 250 URLs para ver si el sitio
             bloquea, si hace falta render y cuanto tarda (crawl-domains). -->
        <button class="btn flex items-center gap-40" :class="createSugerencia === 'canario' && 'btn-primary'" @click="lanzarCanario()" :disabled="creating || !createForm.seeds"
                data-tip="Lanza primero 250 URLs para comprobar bloqueos, render y ritmo antes del censo">
          <i data-lucide="bird" class="ico-14"></i> Lanzar canario
        </button>
        <button class="btn flex items-center gap-40" :class="createSugerencia !== 'canario' && 'btn-primary'" @click="submitCreate()" :disabled="creating || !createForm.name || !createForm.seeds">
          <template x-if="creating"><span class="spinner ico-14"></span></template>
          <i data-lucide="rocket" class="ico-14" x-show="!creating"></i>
          <span x-text="createForm.cliente_id ? 'Iniciar rastreo' : 'Iniciar sin cliente'"></span>
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: IMPORTAR BACKUP ===== -->
<template x-if="showImportModal">
  <div class="modal-backdrop" @click.self="showImportModal = false" @keydown.escape.window="showImportModal = false">
    <div class="modal maxw-480px">
      <div class="modal-header">
        <h3 class="flex items-center gap-40">
          <i data-lucide="upload" class="ico-18 c-accent"></i>
          Importar backup
        </h3>
        <button class="btn-icon fs-md" @click="showImportModal = false">&times;</button>
      </div>
      <div class="modal-body p-125">
        <p class="text-dim text-sm mb-100">
          Selecciona un archivo ZIP generado con la función «Backup completo» para restaurar un rastreo completo con todos sus datos.
        </p>

        <label class="form-label">Archivo ZIP</label>
        <input type="file" accept=".zip" @change="importFile = $event.target.files[0]"
               class="form-input" style="padding:.4rem">

        <label class="form-label mt-2 flex items-center gap-40 pointer">
          <input type="checkbox" x-model="importPreserveId">
          Conservar el ID original del job
        </label>
        <p class="text-dim text-sm mt-25">
          Si está activo y ya existe un rastreo con el mismo identificador, la importación fallará.
        </p>

        <template x-if="importError">
          <div class="text-sm mt-2 c-red" x-text="importError"></div>
        </template>

        <template x-if="importResult">
          <div class="card mt-2" style="background:var(--green-bg);border-color:var(--green);padding:.75rem">
            <p class="fw-600 c-green mb-50">Importación completada</p>
            <p class="text-sm">URLs importadas: <strong x-text="importResult.rows_imported.urls || 0"></strong></p>
            <template x-if="importResult.warnings && importResult.warnings.length > 0">
              <details class="mt-1">
                <summary class="text-sm text-dim pointer" x-text="importResult.warnings.length + ' advertencias'"></summary>
                <ul class="text-sm" style="margin-top:.25rem;padding-left:1rem">
                  <template x-for="w in importResult.warnings.slice(0, 20)">
                    <li x-text="w" class="text-dim"></li>
                  </template>
                </ul>
              </details>
            </template>
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="closeImportModal()">Cerrar</button>
        <button class="btn btn-primary flex items-center gap-40" @click="submitImport()" :disabled="importing || !importFile || importResult">
          <template x-if="importing"><span class="spinner ico-14"></span></template>
          <i data-lucide="upload" class="ico-14" x-show="!importing"></i>
          Importar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: REANUDAR JOB ===== -->
<template x-if="showResumeModal">
  <div class="modal-backdrop" @click.self="showResumeModal = false" @keydown.escape.window="showResumeModal = false">
    <div class="modal maxw-480px">
      <div class="modal-header">
        <h3 class="flex items-center gap-40">
          <i data-lucide="play-circle" class="ico-18 c-accent"></i>
          Reanudar rastreo
        </h3>
        <button class="btn-icon fs-md" @click="showResumeModal = false">&times;</button>
      </div>
      <div class="modal-body p-125">
        <p class="text-dim text-sm mb-100">
          Las URLs ya rastreadas se preservan. El rastreador continuará desde la frontera descubierta. Puedes ajustar los parámetros más relevantes antes de relanzar.
        </p>

        <div class="form-group">
          <label>Tiempo máximo (horas)</label>
          <input type="number" x-model="resumeForm.max_runtime_hours" min="1" max="72">
          <div class="form-hint">Si el crawl no termina en este tiempo, se marca como fallido.</div>
        </div>

        <div class="form-group mt-75">
          <label class="checkbox-label">
            <input type="checkbox" x-model="resumeForm.autothrottle_enabled">
            Habilitar autothrottle
          </label>
          <div class="form-hint">Desactívalo si tienes la IP en lista blanca y quieres exprimir la concurrencia.</div>
        </div>

        <div class="form-group mt-75">
          <label>Concurrencia por dominio</label>
          <input type="number" x-model="resumeForm.concurrent_requests_per_domain" min="1" max="64">
          <div class="form-hint">Sin autothrottle, este es el techo real. Con whitelist, 16-32 es seguro.</div>
        </div>

        <div class="form-group mt-75">
          <label>Concurrencia global</label>
          <input type="number" x-model="resumeForm.concurrent_requests" min="1" max="256">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showResumeModal = false">Cancelar</button>
        <button class="btn btn-primary flex items-center gap-40" @click="confirmResume()" :disabled="resuming">
          <template x-if="resuming"><span class="spinner ico-14"></span></template>
          <i data-lucide="play-circle" class="ico-14" x-show="!resuming"></i>
          Reanudar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: NUEVA CONSULTA A LA IA (#40; revision de UX del 25-oct, 2.9) =====
     Lo unico que gasta dinero: estima siempre antes de dejar lanzar, pide la
     clave y el boton dice cuanto se puede pagar como mucho. Lo tecnico
     (llamadas, cache, tokens, presupuesto, tope de todos los clientes) va
     plegado; un aviso de tope o de repeticion sale siempre a la vista. -->
<template x-if="enriqAbierto">
  <div class="modal-backdrop" @click.self="enriqAbierto = false" @keydown.escape.window="enriqAbierto = false">
    <div class="modal" style="max-width:40rem" data-testid="ia-lanzador">
      <div class="modal-header">
        <h3 class="flex items-center gap-40">
          <i data-lucide="sparkles" class="ico-18 c-accent"></i>
          Nueva consulta a la IA
        </h3>
        <button class="btn-icon fs-md" @click="enriqAbierto = false" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body p-125">
        <p class="text-dim text-sm mb-100">
          Pregunta a un modelo de pago sobre las páginas de este censo. Antes de lanzar ves cuánto costaría;
          lo que ya se preguntó, aquí o en otro censo, sale de la memoria y no se vuelve a pagar.
        </p>

        <div class="form-group">
          <label>Qué preguntar</label>
          <template x-for="m in enriqCatalogo" :key="m.nombre">
            <div class="my-30 mx-0">
              <label class="checkbox-label">
                <input type="checkbox" :checked="enriqForm.modulos.includes(m.nombre)"
                       @change="alternarModuloEnriq(m.nombre, $el.checked)">
                <span x-text="etiquetaModuloEnriq(m)" :title="explicacionModuloEnriq(m)"></span>
              </label>
              <!-- La explicacion, solo de lo marcado: once parrafos tapaban
                   el coste, que es lo que hay que ver antes de lanzar. -->
              <div class="form-hint" x-show="enriqForm.modulos.includes(m.nombre)" x-text="explicacionModuloEnriq(m)"></div>
              <div class="form-hint" x-show="m.depende_de.length && enriqForm.modulos.includes(m.nombre)" x-text="'Necesita: ' + m.depende_de.map(n => tituloModuloEnriq(n)).join(', ') + ' (se añade solo)'"></div>
            </div>
          </template>
          <div class="form-hint" x-show="enriqEstimacion && enriqEstimacion.anadidos.length"
               x-text="'Añadidos porque los necesita otro: ' + (enriqEstimacion ? enriqEstimacion.anadidos.map(n => tituloModuloEnriq(n)).join(', ') : '')"></div>
        </div>

        <!-- Por defecto, las candidatas: cada modulo pregunta solo a las
             paginas que le tocan (el soft 404, a las sospechosas), no a
             «todas las indexables», que decia 3.216 para 17 (V32). -->
        <div class="form-group mt-75">
          <label>Sobre qué páginas</label>
          <select x-model="enriqForm.tipo" @change="estimarEnriquecido()">
            <option value="todas">Las candidatas de cada módulo (recomendado)</option>
            <option value="carpeta">Solo las de una carpeta</option>
            <option value="max">Un máximo de páginas (por orden de rastreo)</option>
            <option value="muestra">Una muestra repartida por todo el sitio</option>
          </select>
          <div class="form-hint" x-show="enriqForm.tipo === 'todas'">
            Cada módulo pregunta solo a las páginas indexables que le tocan (lo dice bajo cada uno, al marcarlo); abajo ves a cuántas.
          </div>
          <template x-if="enriqForm.tipo === 'carpeta'">
            <input type="text" x-model="enriqForm.carpeta" placeholder="/blog/" @change="estimarEnriquecido()" class="mt-40">
          </template>
          <template x-if="['max','muestra'].includes(enriqForm.tipo)">
            <input type="number" min="1" x-model="enriqForm.max_urls" @change="estimarEnriquecido()" class="mt-40">
          </template>
        </div>

        <!-- Antes de pagar otra vez (2.9) -->
        <template x-if="!enriqEstimando && ejecucionRepetidaEnriq()">
          <div class="card ia-repetida" data-testid="ia-repetida">
            <span x-text="(x => x ? 'Ya se preguntó lo mismo en este censo el ' + fmt.dia(x.run.created_at)
                          + ' (' + fmt.estadoEnriq(x.run.estado).toLowerCase()
                          + (x.mismoAlcance ? ', sobre las mismas páginas' : ', sobre ' + fmt.alcanceEnriq(x.run.alcance)) + '): ' : '')(ejecucionRepetidaEnriq())"></span>
            <a href="#" @click.prevent="(x => x && verEjecucionDesdeLanzador(x.run.id))(ejecucionRepetidaEnriq())">ver resultado</a>.
            <span class="text-dim" x-show="(ejecucionRepetidaEnriq() || {}).mismoAlcance">Repetirlo sale casi gratis (está en la memoria), pero no dirá nada nuevo.</span>
          </div>
        </template>

        <div class="card mt-75 py-75 px-100" data-testid="ia-estimacion">
          <template x-if="enriqEstimando"><div class="text-dim text-sm">Calculando el coste…</div></template>
          <template x-if="!enriqEstimando && !enriqEstimacion && !enriqError">
            <div class="text-dim text-sm">Marca qué preguntar para ver el coste.</div>
          </template>
          <template x-if="enriqEstimacion && !enriqEstimando">
            <div class="text-sm" style="display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;font-variant-numeric:tabular-nums">
              <!-- A cuantas paginas (o pares) pregunta cada modulo de verdad -->
              <template x-for="[nombre, pm] in Object.entries(enriqEstimacion.por_modulo || {})" :key="nombre">
                <div class="contenidos">
                  <span x-text="tituloModuloEnriq(nombre) + (pm.unidad === 'grupos' ? ': pares de páginas que juzga' : ': páginas a las que pregunta')"></span>
                  <strong x-text="fmt.num(pm.urls) + (pm.unidad !== 'grupos' && pm.urls !== enriqEstimacion.urls ? ' de ' + fmt.num(enriqEstimacion.urls) : '')"></strong>
                </div>
              </template>
              <span>Coste estimado</span><strong data-testid="ia-coste" x-text="fmt.usd(enriqEstimacion.coste_estimado_usd)"></strong>
              <span>Tiempo estimado</span><strong x-text="fmt.duracion(enriqEstimacion.segundos_estimados)"></strong>
              <template x-if="enriqEstimacion.cliente">
                <span x-text="'Gasto del mes de ' + (enriqEstimacion.cliente.nombre || 'el cliente')"></span>
              </template>
              <template x-if="enriqEstimacion.cliente">
                <strong x-text="fmt.usd(enriqEstimacion.cliente.gastado_mes_usd) + (enriqEstimacion.cliente.tope_mensual_usd == null ? ', sin tope' : ' de ' + fmt.usd(enriqEstimacion.cliente.tope_mensual_usd))"></strong>
              </template>
            </div>
          </template>
          <template x-for="a in ((enriqEstimacion && !enriqEstimando && enriqEstimacion.avisos) || [])" :key="a">
            <div class="form-hint mt-40 c-orange" x-text="a"></div>
          </template>
          <!-- El tope de todos los clientes va plegado, salvo si no alcanza -->
          <template x-if="enriqEstimacion && !enriqEstimando && enriqEstimacion.global && enriqEstimacion.global.restante_usd != null && enriqEstimacion.global.restante_usd < enriqEstimacion.coste_estimado_usd">
            <div class="form-hint mt-40 c-orange"
                 x-text="'Al gasto del mes en todos los clientes le quedan ' + fmt.usd(enriqEstimacion.global.restante_usd) + ' hasta su tope de ' + fmt.usd(enriqEstimacion.global.tope_mensual_usd) + ': la consulta se parará antes de acabar.'"></div>
          </template>
        </div>

        <details class="ia-opciones" :open="enriqAvanzado" @toggle="enriqAvanzado = $el.open">
          <summary>Opciones avanzadas</summary>
          <template x-if="enriqEstimacion && !enriqEstimando">
            <div class="text-sm" style="display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;font-variant-numeric:tabular-nums;margin-top:.5rem">
              <span>Llamadas al modelo (sin contar lo que ya está en la memoria)</span><strong x-text="fmt.num(enriqEstimacion.llamadas)"></strong>
              <span>Respuestas que ya están en la memoria</span><strong x-text="fmt.num(enriqEstimacion.aciertos_cache) + ' de ' + fmt.num(enriqEstimacion.decisiones)"></strong>
              <span>Tokens estimados</span><strong x-text="fmt.num(enriqEstimacion.tokens_estimados)"></strong>
              <template x-if="enriqEstimacion.global">
                <span>Gasto del mes en todos los clientes</span>
              </template>
              <template x-if="enriqEstimacion.global">
                <strong x-text="fmt.usd(enriqEstimacion.global.gastado_mes_usd) + (enriqEstimacion.global.tope_mensual_usd == null ? ', sin tope' : ', con tope de ' + fmt.usd(enriqEstimacion.global.tope_mensual_usd))"></strong>
              </template>
            </div>
          </template>
          <div class="form-hint mt-40">
            El coste se estima por caracteres; el real es lo que cobra OpenRouter, y la consulta se para en seco al llegar al presupuesto.
          </div>
          <div class="form-group mt-75">
            <label>Presupuesto máximo de esta consulta ($)</label>
            <input type="number" min="0" step="0.01" x-model="enriqForm.presupuesto">
            <div class="form-hint">Al llegar aquí se para y queda «parcial», con lo hecho guardado. Por defecto, la estimación más un 50 %.</div>
          </div>
        </details>

        <div class="form-group mt-75">
          <label>Clave de autorización</label>
          <input type="password" x-model="enriqToken" autocomplete="off" placeholder="Pídesela a quien administra el crawler">
          <div class="form-hint">Se guarda solo en esta pestaña del navegador y se borra al cerrarla.</div>
        </div>
        <template x-if="!enriqLanzable">
          <div class="card filete-orange py-60 px-80 fs-sm">
            Este servidor no tiene configurada la clave de autorización: puedes ver el coste, pero no lanzar.
          </div>
        </template>
        <template x-if="enriqError">
          <div class="card filete-red py-60 px-80 fs-sm mt-50" x-text="textoErrorEnriq(enriqError)"></div>
        </template>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="enriqAbierto = false">Cancelar</button>
        <button class="btn btn-primary flex items-center gap-40" @click="lanzarEnriquecido()" data-testid="ia-lanzar"
                :disabled="enriqLanzando || enriqEstimando || !enriqEstimacion || !enriqLanzable || !enriqToken || !enriqForm.modulos.length"
                :data-tip="!enriqToken ? 'Escribe la clave de autorización' : ''">
          <template x-if="enriqLanzando"><span class="spinner ico-14"></span></template>
          <i data-lucide="sparkles" class="ico-14" x-show="!enriqLanzando"></i>
          <span x-text="'Lanzar y pagar hasta ' + fmt.usd(parseFloat(enriqForm.presupuesto) || 0)"></span>
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== MODAL: SUBIR CUENTA GSC ===== -->
<template x-if="showGscUploadModal">
  <div class="modal-backdrop" @click.self="showGscUploadModal = false" @keydown.escape.window="showGscUploadModal = false">
    <div class="modal maxw-420px">
      <div class="modal-header">
        <h3 class="flex items-center gap-40">
          <i data-lucide="key" class="ico-18 c-accent"></i>
          Subir cuenta de servicio GSC
        </h3>
        <button class="btn-icon fs-md" @click="showGscUploadModal = false">&times;</button>
      </div>
      <div class="modal-body p-125">
        <div class="form-group mb-100">
          <label>Nombre de la cuenta</label>
          <input type="text" x-model="gscUploadName" placeholder="Ej: Mi proyecto GSC" style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
        </div>
        <div class="form-group">
          <label>Archivo JSON de cuenta de servicio</label>
          <input type="file" accept=".json" @change="gscUploadFile = $event.target.files[0]" class="fs-sm">
          <div class="form-hint">El JSON de la cuenta de servicio de Google Cloud con permisos de lectura en Search Console.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showGscUploadModal = false">Cancelar</button>
        <button class="btn btn-primary flex items-center gap-40" @click="uploadGscAccount()" :disabled="!gscUploadFile || !gscUploadName.trim()">
          <i data-lucide="upload" class="ico-14"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ===== DIALOGO PROPIO (UX-21) =====
     Sustituye a confirm()/alert()/prompt(). Los borrados que se llevan mucho
     por delante piden escribir una palabra para habilitar el boton. -->
<template x-if="dialogo">
  <div class="modal-backdrop" @click.self="cerrarDialogo(false)" @keydown.escape.window="cerrarDialogo(false)">
    <div class="modal dialogo" style="max-width:30rem" role="alertdialog" aria-modal="true"
         aria-labelledby="dialogo-titulo" aria-describedby="dialogo-mensaje">
      <div class="modal-header">
        <h2 id="dialogo-titulo" class="flex items-center gap-45">
          <template x-if="dialogo.peligro"><i data-lucide="alert-triangle" class="ico-18 c-red"></i></template>
          <span x-text="dialogo.titulo"></span>
        </h2>
      </div>
      <div class="modal-body">
        <p id="dialogo-mensaje" class="text-sm" style="line-height:1.55;white-space:pre-line" x-text="dialogo.mensaje"></p>
        <template x-if="dialogo.pedir">
          <div class="mt-80">
            <label class="text-sm" for="dialogo-libre" x-text="dialogo.pedir"></label>
            <input id="dialogo-libre" type="text" x-model="dialogo.entrada" data-foco autocomplete="off" maxlength="80"
                   @keydown.enter="cerrarDialogo(true)" class="w-full mt-30">
          </div>
        </template>
        <template x-if="dialogo.escribir">
          <div class="mt-80">
            <label class="text-sm" for="dialogo-entrada">Escribe <strong x-text="dialogo.escribir"></strong> para confirmar</label>
            <input id="dialogo-entrada" type="text" x-model="dialogo.entrada" data-foco autocomplete="off"
                   @keydown.enter="cerrarDialogo(true)" class="w-full mt-30">
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <template x-if="!dialogo.solo_aviso">
          <button class="btn" @click="cerrarDialogo(false)" :data-foco="dialogo.peligro && !dialogo.escribir ? '' : null">Volver</button>
        </template>
        <!-- `!!`: sin «escribir» ni «pedir» la expresion daba '' y Alpine pone
             `disabled` con cualquier valor que no sea false, null o undefined:
             «Eliminar», «Descartar»... salian desactivados (revision de UX del
             25-oct, 3.5). -->
        <button class="btn" :class="dialogo.peligro ? 'btn-danger' : 'btn-primary'" @click="cerrarDialogo(true)"
                :disabled="!!((dialogo.escribir && dialogo.entrada.trim() !== dialogo.escribir) || (dialogo.pedir && !dialogo.entrada.trim()))"
                :data-foco="!dialogo.peligro && !dialogo.escribir && !dialogo.pedir ? '' : null" x-text="dialogo.aceptar"></button>
      </div>
    </div>
  </div>
</template>

<!-- ===== BORRADO EN MASA (decision 96) =====
     Tres pasos en el mismo modal: lo que se va a borrar (con su tamaño y lo
     que el servidor se niega a tocar), el borrado con su avance, y lo que
     quedó. La vista previa la calcula el MISMO endpoint que borra, con
     `simular`, así que no puede decir una cosa y hacer otra. -->
<template x-if="borrado">
  <div class="modal-backdrop" @click.self="borrado.paso !== 'borrando' && cerrarBorrado()"
       @keydown.escape.window="borrado.paso !== 'borrando' && cerrarBorrado()">
    <div class="modal" style="max-width:46rem" role="alertdialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="flex items-center gap-45">
          <i data-lucide="trash-2" class="ico-18 c-red"></i>
          <span x-text="borrado.paso === 'hecho' ? 'Rastreos eliminados' : 'Eliminar rastreos'"></span>
        </h2>
      </div>

      <div class="modal-body">
        <template x-if="borrado.paso === 'cargando'">
          <div class="loading-overlay"><div class="spinner"></div> Midiendo lo que ocupan…</div>
        </template>

        <!-- ---------- Vista previa ---------- -->
        <template x-if="borrado.paso === 'previa'">
          <div>
            <p class="text-sm lh-155" x-show="borrado.previa.eliminados.length">
              Se borran
              <strong x-text="fmt.num(borrado.previa.eliminados.length)"></strong>
              rastreos con todos sus datos: URLs, enlaces, incidencias, contenido y comparaciones.
              <strong>No se puede deshacer.</strong>
              Si alguno es un censo entregado, descarga antes su backup.
            </p>
            <p class="text-sm lh-155" x-show="!borrado.previa.eliminados.length">
              Ninguno de los rastreos seleccionados se puede borrar tal cual. Abajo está el
              motivo de cada uno.
            </p>

            <!-- Lo que el servidor NO va a tocar, y por qué. Va arriba: es lo
                 que hay que leer antes de teclear la palabra. -->
            <template x-if="borrado.previa.omitidos.length > 0">
              <div class="card mt-80 filete-orange">
                <strong x-text="fmt.num(borrado.previa.omitidos.length) + (borrado.previa.omitidos.length === 1 ? ' no se borra' : ' no se borran')"></strong>
                <ul class="mt-40 mb-0 mr-0 ml-100 lh-150">
                  <template x-for="o in borrado.previa.omitidos" :key="o.id">
                    <li class="text-sm">
                      <strong x-text="o.nombre || o.id"></strong>: <span x-text="o.motivo"></span>
                    </li>
                  </template>
                </ul>
                <!-- Solo lo protegido por una programación se puede forzar: un
                     rastreo en marcha hay que cancelarlo antes, siempre. -->
                <label class="checkbox-label text-sm mt-50"
                       x-show="borrado.forzar || borrado.previa.omitidos.some(o => o.forzable)">
                  <input type="checkbox" x-model="borrado.forzar" @change="recargarPrevia()">
                  Borrar igualmente los que son referencia de una programación
                </label>
              </div>
            </template>

            <template x-if="borrado.previa.eliminados.some(e => e.aviso)">
              <div class="card mt-80 filete-blue">
                <ul class="my-0 mr-0 ml-100 lh-150">
                  <template x-for="e in borrado.previa.eliminados.filter(x => x.aviso)" :key="e.id">
                    <li class="text-sm"><strong x-text="e.nombre"></strong>: <span x-text="e.aviso"></span></li>
                  </template>
                </ul>
              </div>
            </template>

            <div class="table-wrap" x-show="borrado.previa.eliminados.length"
                 style="margin-top:.8rem;max-height:17rem;overflow:auto">
              <table>
                <thead>
                  <tr>
                    <th>Rastreo</th><th>Estado</th><th>Creado</th>
                    <th class="ta-r">URLs</th>
                    <th class="ta-r" title="Filas de la tabla de enlaces: cada una agrupa las apariciones idénticas de un enlace en su página (decisión 94)">Filas de enlaces</th>
                    <th class="ta-r">Ocupa</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="e in borrado.previa.eliminados" :key="e.id">
                    <tr>
                      <td x-text="e.nombre"></td>
                      <td><span class="badge" :class="statusColor(e.status)" x-text="fmt.status(e.status)"></span></td>
                      <td class="text-dim text-sm" x-text="fmt.dia(e.created_at)"></td>
                      <td class="ta-r" x-text="e.filas ? fmt.num(e.filas.urls) : '—'"></td>
                      <!-- Archivado (decision 95): sin filas en la base; lo que
                           ocupa es su Parquet, medido, y se suma en «Ocupa». -->
                      <td class="ta-r" x-show="!e.archivado" x-text="e.filas ? fmt.num(e.filas.links) : '—'"></td>
                      <td class="text-dim ta-r" x-show="e.archivado"
                          :title="'Enlaces archivados en Parquet: ' + fmt.bytes(e.archivo_bytes) + ' en disco'">archivados</td>
                      <td class="ta-r" x-text="fmt.bytes(e.bytes)"
                          :title="e.bytes == null ? 'No se pudo medir dentro del tiempo disponible' : 'Estimado a partir de sus filas'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <p class="text-sm mt-60" x-show="borrado.previa.eliminados.length">
              Liberan <strong x-text="fmt.bytes(borrado.previa.bytes_aprox)"></strong> aproximadamente<span
                x-show="borrado.previa.bytes_incompletos" class="text-dim">, y alguno más que no se pudo medir</span><span
                x-show="borrado.previa.archivo_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.previa.archivo_bytes)"></strong> de enlaces archivados</span><span
                x-show="borrado.previa.capturas_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.previa.capturas_bytes)"></strong> de capturas</span><span
                x-show="borrado.previa.archivo_incompleto" class="text-dim">, y algún archivo de enlaces que no se pudo medir</span>.
            </p>
            <p class="text-dim text-sm mt-35 lh-150"
               x-show="borrado.previa.eliminados.length" x-text="borrado.previa.nota"></p>

            <div class="mt-80" x-show="borrado.previa.eliminados.length">
              <label class="text-sm" for="borrado-palabra">Escribe <strong>eliminar</strong> para confirmar</label>
              <input id="borrado-palabra" type="text" x-model="borrado.escribir" data-foco autocomplete="off"
                     @keydown.enter="confirmarBorrado()" class="w-full mt-30">
            </div>
          </div>
        </template>

        <!-- ---------- Borrando ---------- -->
        <template x-if="borrado.paso === 'borrando'">
          <div>
            <p class="text-sm">Borrando <strong x-text="fmt.num(borrado.hechos)"></strong> de
              <strong x-text="fmt.num(borrado.total)"></strong>…</p>
            <!-- Un censo de millones de enlaces no cabe en una peticion: el
                 servidor devuelve lo que le queda y esto sigue pidiendolo. -->
            <div class="progress-bar">
              <div class="progress-fill" :style="'width:' + Math.round(100 * borrado.hechos / Math.max(1, borrado.total)) + '%'"></div>
            </div>
            <p class="text-dim text-sm mt-60">No cierres la pestaña. Un censo
              grande puede tardar varios minutos: se borra por lotes y lo que quede a medias se
              retoma solo.</p>
          </div>
        </template>

        <!-- ---------- Hecho ---------- -->
        <template x-if="borrado.paso === 'hecho'">
          <div>
            <p class="text-sm lh-155">
              Eliminados <strong x-text="fmt.num(borrado.resultado.eliminados.length)"></strong> rastreos
              y <strong x-text="fmt.num(Object.values(borrado.resultado.filas).reduce((a, b) => a + b, 0))"></strong> filas
              (<span x-text="Object.entries(borrado.resultado.filas).filter(e => e[1]).map(e => fmt.num(e[1]) + ' en ' + e[0]).join(', ')"></span>).
            </p>
            <p class="text-sm mt-40">
              Liberados <strong x-text="fmt.bytes(borrado.resultado.bytes_aprox)"></strong> aproximadamente<span
                x-show="borrado.resultado.bytes_incompletos" class="text-dim">, y alguno más que no se pudo medir</span><span
                x-show="borrado.resultado.archivo_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.resultado.archivo_bytes)"></strong> de enlaces archivados</span><span
                x-show="borrado.resultado.capturas_bytes > 0">, más
                <strong x-text="fmt.bytes(borrado.resultado.capturas_bytes)"></strong> de capturas</span><span
                x-show="borrado.resultado.archivo_incompleto" class="text-dim">, y algún archivo de enlaces que no se pudo medir</span>.
            </p>
            <p class="text-sm mt-40 c-orange" x-show="borrado.resultado.sin_terminar > 0">
              <strong x-text="fmt.num(borrado.resultado.sin_terminar)"></strong> quedaron a medias: salen en la
              lista como «Borrándose» y se terminan seleccionándolos y repitiendo el borrado.
            </p>
            <p class="text-dim text-sm mt-35 lh-150" x-text="borrado.resultado.nota"></p>
            <template x-if="borrado.resultado.omitidos.length > 0">
              <div class="card mt-80 filete-orange">
                <ul class="my-0 mr-0 ml-100 lh-150">
                  <template x-for="o in borrado.resultado.omitidos" :key="o.id">
                    <li class="text-sm"><strong x-text="o.nombre || o.id"></strong>: <span x-text="o.motivo"></span></li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </template>
      </div>

      <div class="modal-footer">
        <template x-if="borrado.paso === 'previa'">
          <button class="btn" @click="cerrarBorrado()">Volver</button>
        </template>
        <template x-if="borrado.paso === 'previa'">
          <button class="btn btn-danger" @click="confirmarBorrado()"
                  :disabled="borrado.escribir.trim() !== 'eliminar' || !borrado.previa.eliminados.length">
            Eliminar para siempre
          </button>
        </template>
        <template x-if="borrado.paso === 'hecho'">
          <button class="btn btn-primary" @click="cerrarBorrado()" data-foco>Entendido</button>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ===== ESPACIO EN DISCO (decision 96) ===== -->
<template x-if="verAlmacenamiento && almacenamiento">
  <div class="modal-backdrop" @click.self="verAlmacenamiento = false" @keydown.escape.window="verAlmacenamiento = false">
    <div class="modal maxw-34rem" role="dialog" aria-modal="true">
      <div class="modal-header"><h2>Espacio en disco</h2></div>
      <div class="modal-body">
        <p class="text-sm">La base de datos ocupa
          <strong x-text="fmt.bytes(almacenamiento.total_bytes)"></strong>, de los cuales
          <strong x-text="fmt.bytes(almacenamiento.censo_bytes)"></strong> son datos de rastreos.<span
            x-show="almacenamiento.archivo_ficheros"> Fuera de ella, los enlaces archivados de
            <strong x-text="fmt.num(almacenamiento.archivo_ficheros)"></strong> censos ocupan
            <strong x-text="fmt.bytes(almacenamiento.archivo_bytes)"></strong>.</span><span
            x-show="almacenamiento.capturas_bytes > 0"> Las capturas de pantalla ocupan
            <strong x-text="fmt.bytes(almacenamiento.capturas_bytes)"></strong>.</span><span
            x-show="almacenamiento.capturas_bytes === null"> No se pudo medir la carpeta de
            capturas de pantalla.</span></p>
        <div class="table-wrap" style="margin-top:.8rem;max-height:18rem;overflow:auto">
          <table>
            <thead><tr><th>Tabla</th><th class="ta-r">Ocupa</th><th class="ta-r">Filas</th></tr></thead>
            <tbody>
              <template x-for="t in almacenamiento.tablas" :key="t.tabla">
                <tr>
                  <td x-text="t.tabla"></td>
                  <td class="ta-r" x-text="fmt.bytes(t.bytes)"></td>
                  <td class="text-dim ta-r" x-text="fmt.num(t.filas_aprox)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="text-dim text-sm mt-60 lh-150">
          Las filas son la estimación del planificador, no una cuenta exacta.
        </p>
        <p class="text-dim text-sm mt-35 lh-150" x-text="almacenamiento.nota"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" @click="verAlmacenamiento = false" data-foco>Cerrar</button>
      </div>
    </div>
  </div>
</template>

<!-- ===== PLANTILLA: CONFIGURACION EN TRES NIVELES (decision 196) =====
     Revision de UX del 25-oct, 2.4: el MISMO formulario para el cliente, el
     perfil y el rastreo, sin JSON a mano (queda en «Avanzado»). Se inserta con
     x-html (`plantillaCfg()`) en un contenedor que define `i`, la instancia
     del nivel (`cfgNuevo`). Cada campo dice de donde viene su valor y, si se
     ha cambiado aqui, deja volver al heredado. -->
<template id="tpl-config-niveles">
  <div class="cfg-form" :data-nivel="i.nivel" data-testid="cfg-form">
    <!-- Asi rastreara: la config de verdad (la resuelve la API con este
         borrador) y los avisos que se pueden afirmar -->
    <div class="cfg-asi" data-testid="asi-rastreara">
      <div class="cfg-asi-cab">
        <strong>Así rastreará</strong>
        <span class="text-dim text-sm" x-text="i.nivel === 'cliente' ? 'un rastreo de este cliente sin perfil ni cambios propios' : (i.nivel === 'perfil' ? 'el próximo rastreo de este perfil' : 'este rastreo')"></span>
        <span class="spinner cfg-spinner" x-show="i.resolviendo"></span>
      </div>
      <template x-if="i.resueltaError">
        <p class="text-sm cfg-aviso cfg-aviso--peligro" x-text="'No se puede calcular: ' + i.resueltaError"></p>
      </template>
      <template x-if="cfgHayErrores(i)">
        <p class="text-sm cfg-aviso cfg-aviso--aviso">Hay un campo con error: corrígelo para ver cómo quedaría.</p>
      </template>
      <template x-if="!i.resuelta && !i.resueltaError">
        <p class="text-sm text-dim">Calculando…</p>
      </template>
      <template x-if="i.resuelta">
        <div>
          <ul class="cfg-asi-lista">
            <template x-for="l in cfgAsiLineas(i)" :key="l.ruta">
              <li>
                <span class="cfg-asi-etq" x-text="l.etiqueta"></span>
                <strong class="cfg-asi-valor" x-text="l.valor" :title="l.valor"></strong>
                <span class="cfg-chip" :class="'cfg-chip--' + (l.origen === i.nivel ? 'aqui' : l.origen)" x-text="cfgOrigenAsi(l.origen, i.nivel)"></span>
              </li>
            </template>
          </ul>
          <template x-for="(a, n) in (i.resuelta.avisos || [])" :key="'a' + n">
            <p class="cfg-aviso" :class="'cfg-aviso--' + a.nivel" data-testid="cfg-aviso" x-text="a.texto"></p>
          </template>
          <template x-for="p in (i.resuelta.programaciones || [])" :key="p.id">
            <p class="cfg-aviso cfg-aviso--info" x-text="cfgTextoProgramacion(p)"></p>
          </template>
        </div>
      </template>
    </div>

    <!-- Los campos, por grupos: lo principal abierto, lo raro plegado -->
    <template x-for="g in GRUPOS_CONFIG" :key="g[0]">
      <details class="cfg-grupo" :open="g[0] === 'principal' || !!i.abiertos[g[0]]"
               @toggle="i.abiertos[g[0]] = $event.target.open" :data-grupo="g[0]">
        <summary>
          <span x-text="g[1]"></span>
          <span class="text-sm cfg-resumen-grupo" :class="cfgResumenGrupo(i, g[0]).includes('error') ? 'text-red' : 'text-dim'"
                x-text="cfgResumenGrupo(i, g[0])"></span>
        </summary>
        <div class="cfg-campos">
          <template x-for="c in cfgCamposDe(i, g[0])" :key="c.ruta">
            <div class="cfg-campo" :data-ruta="c.ruta"
                 :class="{ 'cfg-campo--aqui': cfgTiene(i, c.ruta), 'cfg-campo--ancho': ['lineas', 'kv', 'topes', 'ua'].includes(c.tipo), 'cfg-campo--error': !!i.errores[c.ruta] }">
              <div class="cfg-cab">
                <label :for="'cfg-' + i.nivel + '-' + c.ruta" x-text="c.etiqueta"></label>
              </div>
              <template x-if="c.tipo === 'si_no'">
                <label class="checkbox-label cfg-casilla">
                  <input type="checkbox" :id="'cfg-' + i.nivel + '-' + c.ruta" :checked="!!cfgEfectivo(i, c.ruta)"
                         @change="cfgCambiarCampo(i, c.ruta, $event.target.checked)">
                  <span x-text="cfgEfectivo(i, c.ruta) ? 'Sí' : 'No'"></span>
                </label>
              </template>
              <template x-if="c.tipo === 'entero' || c.tipo === 'decimal' || c.tipo === 'texto'">
                <input type="text" :id="'cfg-' + i.nivel + '-' + c.ruta" :inputmode="c.tipo === 'texto' ? 'text' : 'decimal'"
                       :value="cfgTextoCampo(i, c.ruta)" :placeholder="c.nulo || c.ejemplo || ''"
                       :aria-invalid="!!i.errores[c.ruta]" @change="cfgCambiarCampo(i, c.ruta, $event.target.value)">
              </template>
              <template x-if="c.tipo === 'clave'">
                <input type="password" autocomplete="off" :id="'cfg-' + i.nivel + '-' + c.ruta" :value="cfgTextoCampo(i, c.ruta)"
                       @change="cfgCambiarCampo(i, c.ruta, $event.target.value)">
              </template>
              <template x-if="c.tipo === 'opciones'">
                <select :id="'cfg-' + i.nivel + '-' + c.ruta" @change="cfgCambiarCampo(i, c.ruta, $event.target.value)">
                  <template x-for="o in c.opciones" :key="o[0]">
                    <option :value="o[0]" :selected="o[0] === cfgTextoCampo(i, c.ruta)" x-text="o[1]"></option>
                  </template>
                </select>
              </template>
              <template x-if="c.tipo === 'huella'">
                <select :id="'cfg-' + i.nivel + '-' + c.ruta" @change="cfgCambiarCampo(i, c.ruta, $event.target.value)">
                  <template x-for="o in cfgOpcionesHuella(i)" :key="o[0]">
                    <option :value="o[0]" :selected="o[0] === cfgTextoCampo(i, c.ruta)" x-text="o[1]"></option>
                  </template>
                </select>
              </template>
              <template x-if="c.tipo === 'ua'">
                <div class="cfg-ua">
                  <select :id="'cfg-' + i.nivel + '-' + c.ruta" @change="cfgElegirUa(i, $event.target.value)">
                    <template x-for="[k, etq] in Object.entries(UA_LABELS)" :key="k">
                      <option :value="k" :selected="k === (cfgUaPersonalizado(i) ? 'custom' : cfgTextoCampo(i, c.ruta))" x-text="etq"></option>
                    </template>
                  </select>
                  <template x-if="cfgUaPersonalizado(i)">
                    <input type="text" class="mono" :value="cfgEfectivo(i, 'user_agent')" placeholder="Mozilla/5.0 …"
                           aria-label="User agent personalizado" @change="cfgCambiarCampo(i, 'user_agent', $event.target.value)">
                  </template>
                </div>
              </template>
              <template x-if="['lineas', 'kv', 'topes'].includes(c.tipo)">
                <textarea rows="2" class="mono" :id="'cfg-' + i.nivel + '-' + c.ruta" :value="cfgTextoCampo(i, c.ruta)"
                          :placeholder="c.ejemplo || ''" :aria-invalid="!!i.errores[c.ruta]"
                          @change="cfgCambiarCampo(i, c.ruta, $event.target.value)"></textarea>
              </template>
              <div class="cfg-pie">
                <span class="cfg-origen" :class="'cfg-origen--' + cfgOrigen(i, c.ruta)" x-text="cfgEtiquetaOrigen(i, c.ruta)"></span>
                <button type="button" class="cfg-volver" x-show="cfgTiene(i, c.ruta) || !!i.errores[c.ruta]"
                        @click="cfgVolver(i, c.ruta)" data-testid="cfg-volver">volver al heredado</button>
              </div>
              <div class="cfg-error" x-show="!!i.errores[c.ruta]" x-text="i.errores[c.ruta]" role="alert"></div>
              <div class="form-hint" x-show="c.ayuda" x-text="c.ayuda"></div>
            </div>
          </template>
        </div>
      </details>
    </template>

    <!-- Avanzado: el JSON de este nivel, para lo que el formulario no tiene -->
    <details class="cfg-grupo cfg-json" data-grupo="json">
      <summary>
        <span>Avanzado: este nivel en JSON</span>
        <span class="text-sm text-dim" x-text="Object.keys(i.propia).length ? '· ' + Object.keys(i.propia).length + (Object.keys(i.propia).length === 1 ? ' clave' : ' claves') : '· vacío'"></span>
      </summary>
      <div class="cfg-json-cuerpo">
        <p class="text-sm text-dim">Solo lo que fija este nivel; lo demás se hereda. Aquí va también lo que el formulario no tiene
          (plantillas, segmentos, marcas, extracción a medida…). Las mismas claves que <code>projects/&lt;cliente&gt;/config.json</code>;
          <code>null</code> quita lo heredado.</p>
        <textarea rows="7" class="mono" x-model="i.json" @input="cfgEscribirJson(i)" @blur="i.jsonSucio && cfgAplicar(i)"
                  aria-label="Configuración de este nivel en JSON"></textarea>
        <div class="cfg-error" x-show="i.jsonError" x-text="i.jsonError" role="alert"></div>
        <!-- Se aplica solo al dejar de escribir y antes de guardar o lanzar
             (revision del 26-oct de la decision 196): con un boton aparte, lo
             escrito sin pulsarlo se perdia en silencio. -->
        <p class="form-hint">Se aplica al dejar de escribir; los campos de arriba se ponen al día.</p>
      </div>
    </details>
  </div>
</template>

<!-- ===== AVISOS BREVES =====
     showToast() los anadia a una lista que nadie pintaba: «Rastreo iniciado»,
     «Cliente guardado» o «Trabajo eliminado» no se habian visto nunca. -->
<div class="toasts" role="status" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="'toast-' + t.type" x-text="t.msg"></div>
  </template>
</div>

</body>
</html>
