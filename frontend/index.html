<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Crawler</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
  <!-- Tema antes de pintar: evita el parpadeo del tema claro al cargar -->
  <script>
    (function () {
      var t = 'light';  // el terminal es opcional: solo si se ha elegido
      try { t = localStorage.getItem('seo-crawler-theme') || t; } catch (_) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme-terminal.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="/static/incidencias.js"></script>
  <script src="/static/app.js"></script>
</head>
<!-- Sin x-init: Alpine 3 ya llama solo al init() del componente, y con los
     dos arrancaba todo dos veces (dos peticiones de la lista, dos atajos de
     teclado y, con las rutas, dos navegaciones pisandose). -->
<body x-data="app()" x-effect="$nextTick(() => lucide.createIcons())">

<div class="app">

  <!-- ===== BARRA SUPERIOR =====
       La misma en todas las vistas (UX-06): antes cambiaba de botones segun
       donde estuvieras, y desde la ficha de un rastreo no habia forma de ir a
       Clientes ni a Programados. Las secciones son enlaces de verdad (#/...),
       asi que se pueden abrir en otra pestana y el boton atras funciona. -->
  <header class="topbar" style="border-top: 3px solid #5BAE23;">
    <a href="#/clientes" class="topbar-brand" title="Ir al panel de clientes">
      <i data-lucide="radar" class="topbar-icon" style="width:22px;height:22px;color:#5BAE23"></i>
      <span>SEO Crawler</span>
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a href="#/clientes" :class="seccion() === 'clientes' && 'active'" :aria-current="seccion() === 'clientes' ? 'page' : null">
        <i data-lucide="building-2" style="width:14px;height:14px"></i> Clientes</a>
      <a href="#/rastreos" :class="seccion() === 'rastreos' && 'active'" :aria-current="seccion() === 'rastreos' ? 'page' : null">
        <i data-lucide="list" style="width:14px;height:14px"></i> Rastreos</a>
      <a href="#/programados" :class="seccion() === 'programados' && 'active'" :aria-current="seccion() === 'programados' ? 'page' : null">
        <i data-lucide="calendar-clock" style="width:14px;height:14px"></i> Programados</a>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" @click="openCreate()" data-tip="Crear un nuevo rastreo (atajo: n)" style="display:flex;align-items:center;gap:.35rem">
        <i data-lucide="plus-circle" style="width:14px;height:14px"></i> Nuevo rastreo
      </button>
      <div class="menu-wrap" @click.outside="menuAbierto === 'app' && (menuAbierto = '')">
        <button class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'app' ? '' : 'app'"
                aria-haspopup="menu" :aria-expanded="menuAbierto === 'app'" aria-label="Más opciones" title="Más opciones">
          <i data-lucide="more-horizontal" style="width:16px;height:16px"></i>
        </button>
        <div class="menu" x-show="menuAbierto === 'app'" x-transition.opacity role="menu">
          <button role="menuitem" @click="menuAbierto = ''; showImportModal = true">
            <i data-lucide="upload" style="width:14px;height:14px"></i> Importar backup de un rastreo</button>
          <button role="menuitem" @click="menuAbierto = ''; toggleTheme()">
            <i data-lucide="contrast" style="width:14px;height:14px"></i>
            <span x-text="theme === 'terminal' ? 'Tema claro' : 'Tema terminal'"></span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Miga de pan: donde estoy y como vuelvo. Sustituye a los botones
       «← Trabajo» / «← Trabajos» / «← Clientes» que cambiaban por vista. -->
  <template x-if="migas().length">
    <nav class="breadcrumbs" aria-label="Ruta">
      <template x-for="(m, i) in migas()" :key="i">
        <span class="crumb">
          <template x-if="m.href && i < migas().length - 1"><a :href="m.href" x-text="m.texto" :title="m.texto"></a></template>
          <template x-if="!m.href || i === migas().length - 1"><span x-text="m.texto" :title="m.texto" aria-current="page"></span></template>
        </span>
      </template>
    </nav>
  </template>

  <main class="main">

    <!-- ===== BANNER DE ERROR ===== -->
    <template x-if="error">
      <div class="card mb-2" style="border-color:var(--red);color:var(--red);display:flex;align-items:center;justify-content:space-between">
        <span x-text="error"></span>
        <button class="btn-icon" @click="error=null">&times;</button>
      </div>
    </template>

    <!-- ============================================================ -->
    <!--                  VISTA: LISTA DE TRABAJOS                    -->
    <!-- ============================================================ -->
    <!-- ===== MODAL: PROGRAMAR ESTE RASTREO ===== -->
    <template x-if="programarAbierto && job">
      <div class="modal-backdrop" @click.self="programarAbierto = false">
        <div class="modal" style="max-width:34rem">
          <div class="modal-header">
            <h2 style="display:flex;align-items:center;gap:.4rem">
              <i data-lucide="calendar-clock" style="width:18px;height:18px"></i> Repetir este rastreo
            </h2>
          </div>
          <div class="modal-body">
            <p class="text-dim text-sm" style="margin-bottom:.8rem">
              Se repetirá con las mismas semillas y la misma configuración que
              <strong x-text="job.name"></strong>, y cada vez se comparará con el
              censo anterior del mismo sitio.
            </p>

            <label class="text-sm">Nombre</label>
            <input type="text" x-model="programarNombre" style="width:100%;margin-bottom:.8rem">

            <label class="text-sm">Cada cuanto</label>
            <div class="flex gap-1" style="flex-wrap:wrap;margin-bottom:.5rem">
              <template x-for="o in cadencias" :key="o.cron">
                <button class="btn btn-sm" :class="programarCron === o.cron ? 'btn-primary' : ''"
                        @click="programarCron = o.cron" x-text="o.etiqueta"></button>
              </template>
            </div>
            <input type="text" x-model="programarCron" style="width:100%;font-family:monospace"
                   placeholder="minuto hora dia-del-mes mes dia-de-semana">
            <div class="text-dim" style="font-size:.76rem;margin:.3rem 0 .8rem">
              Cinco campos, como un crontab. Se lee: <strong x-text="fmt.cron(programarCron)"></strong>.
            </div>

            <label class="text-sm">Zona horaria</label>
            <input type="text" x-model="programarZona" style="width:100%;margin-bottom:.4rem">
            <div class="text-dim" style="font-size:.76rem">
              La hora se lee en esta zona, con su cambio de horario.
            </div>
            <div x-show="programarError" class="card"
                 style="border-left:3px solid var(--red,#d32f2f);margin-top:.8rem">
              <div class="text-sm" x-text="programarError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="programarAbierto = false">Cancelar</button>
            <button class="btn btn-primary" @click="guardarProgramacion()">Programar</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== MODAL: NOMBRE, TIPO Y CLIENTE DE UN RASTREO (UX-07/08) ===== -->
    <template x-if="editarJob && job">
      <div class="modal-backdrop" @click.self="editarJob = null" @keydown.escape.window="editarJob = null">
        <div class="modal" style="max-width:32rem" role="dialog" aria-modal="true" aria-labelledby="titulo-editar-job">
          <div class="modal-header">
            <h2 id="titulo-editar-job" style="display:flex;align-items:center;gap:.4rem">
              <i data-lucide="pencil" style="width:18px;height:18px"></i> Ordenar este rastreo
            </h2>
          </div>
          <div class="modal-body">
            <p class="text-dim text-sm" style="margin-bottom:.8rem">
              No cambia nada de lo rastreado ni de lo analizado: solo dónde aparece y cómo se compara.
            </p>
            <label class="text-sm" for="ej-nombre">Nombre</label>
            <input id="ej-nombre" type="text" x-model="editarJob.name" style="width:100%;margin-bottom:.8rem">

            <label class="text-sm">Tipo</label>
            <div class="grupo-chips" style="margin-bottom:.3rem" role="radiogroup">
              <template x-for="t in [['censo', 'Censo'], ['canario', 'Canario'], ['prueba', 'Prueba']]" :key="t[0]">
                <button class="btn btn-sm chip" role="radio" :aria-checked="editarJob.tipo === t[0]"
                        :class="editarJob.tipo === t[0] && 'chip-on'" @click="editarJob.tipo = t[0]" x-text="t[1]"></button>
              </template>
            </div>
            <div class="text-dim" style="font-size:.76rem;margin-bottom:.8rem">
              Solo los censos cuentan en la evolución del cliente y en el panel. Ahora:
              <span x-text="job.tipo ? 'marcado a mano' : 'deducido del nombre'"></span>.
            </div>

            <label class="text-sm" for="ej-cliente">Cliente</label>
            <select id="ej-cliente" x-model="editarJob.cliente_id" style="width:100%">
              <option value="">Sin cliente</option>
              <template x-for="c in clientes" :key="c.id">
                <option :value="c.id" :selected="c.id === editarJob.cliente_id" x-text="c.nombre"></option>
              </template>
            </select>
            <div x-show="editarError" class="card" style="border-left:3px solid var(--red);margin-top:.8rem">
              <div class="text-sm" x-text="editarError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="editarJob = null">Cancelar</button>
            <button class="btn btn-primary" @click="guardarJob()">Guardar</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== RASTREOS PROGRAMADOS ===== -->
    <template x-if="view === 'programados'">
      <div>
        <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
          <span class="text-dim text-sm">Rastreos que se repiten solos. Los dispara el worker;
            cada uno se compara con el censo anterior del mismo sitio al terminar.</span>
          <span class="text-dim text-sm" style="margin-left:auto"
                x-text="programaciones.length + ' programaciones'"></span>
        </div>

        <template x-if="!programaciones.length">
          <div class="empty" style="padding:2.5rem 1.5rem">
            <h3 style="margin-bottom:.5rem;font-size:1.05rem">No hay ningún rastreo programado</h3>
            <p class="text-dim" style="max-width:420px;line-height:1.5">
              Mientras no los haya, de un cambio en un sitio te enteras cuando se te ocurre mirar.
            </p>
          </div>
        </template>

        <template x-if="programaciones.length">
          <div class="card">
            <table style="width:100%;font-size:.85rem">
              <thead><tr>
                <th style="text-align:left">nombre</th>
                <th style="text-align:left">cuando</th>
                <th style="text-align:left">próximo</th>
                <th style="text-align:left">último</th>
                <th style="width:7rem"></th>
              </tr></thead>
              <tbody>
                <template x-for="p in programaciones" :key="p.id">
                  <tr :style="p.activa ? '' : 'opacity:.5'">
                    <td>
                      <div x-text="p.nombre"></div>
                      <div class="text-dim" style="font-size:.75rem"
                           x-text="(p.seeds || []).join(', ').slice(0, 70)"></div>
                    </td>
                    <td>
                      <div x-text="fmt.cron(p.cron)"></div>
                      <div class="text-dim" style="font-size:.75rem">
                        <code x-text="p.cron"></code> · <span x-text="p.zona_horaria || 'Europe/Madrid'"></span>
                      </div>
                    </td>
                    <td>
                      <span x-text="p.activa ? fmt.date(p.proxima_ejecucion) : 'en pausa'"></span>
                    </td>
                    <td>
                      <template x-if="p.ultimo_job_id">
                        <a href="#" @click.prevent="openJob(p.ultimo_job_id)"
                           x-text="fmt.date(p.ultima_ejecucion)"></a>
                      </template>
                      <template x-if="!p.ultimo_job_id"><span class="text-dim">nunca</span></template>
                      <!-- Por que no se lanzo la ultima vez. Una programacion que
                           deja de dispararse sin decir por que es indistinguible
                           de una que nadie miro. -->
                      <div class="text-dim" style="font-size:.73rem" x-show="p.ultimo_motivo"
                           x-text="p.ultimo_motivo"></div>
                    </td>
                    <td style="text-align:right;white-space:nowrap">
                      <button class="btn btn-sm" @click="alternarProgramacion(p)"
                              x-text="p.activa ? 'Pausar' : 'Reanudar'"></button>
                      <button class="btn btn-sm" @click="borrarProgramacion(p)"
                              data-tip="Quita el calendario. Los rastreos que ya lanzo NO se borran">&times;</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ -->
    <!--                  VISTA: CLIENTES (#36)                       -->
    <!-- ============================================================ -->
    <template x-if="view === 'clients'">
      <div>
        <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
          <span class="text-dim text-sm">El último censo de cada cliente y cómo ha cambiado desde el anterior.
            Un rastreo lanzado desde un cliente hereda su configuración.</span>
          <button class="btn btn-primary btn-sm" style="margin-left:auto;display:flex;align-items:center;gap:.35rem"
                  @click="nuevoCliente()">
            <i data-lucide="plus" style="width:14px;height:14px"></i> Nuevo cliente
          </button>
        </div>

        <template x-if="!clientes.length">
          <div class="empty" style="padding:2.5rem 1.5rem">
            <h3 style="margin-bottom:.5rem;font-size:1.05rem">Todavía no hay clientes</h3>
            <p class="text-dim" style="max-width:440px;line-height:1.5">
              Los rastreos antiguos que tenian un ID de cliente escrito a mano se convierten en
              clientes solos al desplegar. Para dar de alta uno nuevo, «Nuevo cliente».
            </p>
          </div>
        </template>

        <!-- Rastreos sin cliente (UX-08): los anteriores a la decision 83 y
             los lanzados sin elegir cliente. Mientras no se asignen, no
             cuentan en la serie de nadie. -->
        <template x-if="panelClientes && panelClientes.rastreos_sin_cliente">
          <a class="card mb-2 aviso-sin-cliente" href="#/rastreos?cliente=ninguno">
            <i data-lucide="link-2-off" style="width:16px;height:16px"></i>
            <span><strong x-text="fmt.num(panelClientes.rastreos_sin_cliente)"></strong>
              rastreos no tienen cliente y no cuentan en la evolución de nadie. Asígnalos desde su ficha (menú ⋯).</span>
          </a>
        </template>

        <!-- Panel de cartera (UX-07 y decision 130): una fila por cliente con
             su ultimo CENSO y la tendencia de errores de su serie, de
             `profile_runs`. Los canarios y las pruebas no cuentan, y a traves
             de un cambio de version del analisis no hay flecha. -->
        <template x-if="clientes.length">
          <div class="card table-wrap">
            <table class="panel-cartera" style="width:100%;font-size:.85rem">
              <thead><tr>
                <th style="text-align:left">cliente</th>
                <th style="text-align:left">último censo</th>
                <th style="text-align:right">páginas</th>
                <th style="text-align:right">indexables</th>
                <th style="text-align:right">errores</th>
                <th style="text-align:left">tendencia de errores</th>
                <th style="text-align:left">alertas</th>
              </tr></thead>
              <tbody>
                <template x-for="p in (panelClientes ? panelClientes.clientes : [])" :key="p.id">
                  <tr @click="location.hash = '#/clientes/' + p.id" style="cursor:pointer">
                    <td>
                      <a :href="'#/clientes/' + p.id" @click.stop><strong x-text="p.nombre"></strong></a>
                      <span class="text-dim text-sm" x-text="p.n_rastreos + (p.n_rastreos === 1 ? ' rastreo' : ' rastreos')"></span>
                      <div class="panel-integ">
                        <template x-for="i in ((clientes.find(c => c.id === p.id) || {}).integraciones || [])" :key="i.tipo + (i.credencial_env || '')">
                          <span class="badge" :class="i.configurada ? 'badge-completed' : 'badge-pending'" x-text="i.tipo"></span>
                        </template>
                      </div>
                    </td>
                    <td>
                      <template x-if="!p.ultimo"><span class="text-dim">sin censo completado</span></template>
                      <template x-if="p.ultimo">
                        <div>
                          <div x-text="fmt.dia(p.ultimo.created_at)"></div>
                          <div class="text-dim text-sm truncate" style="max-width:16rem" :title="p.ultimo.name" x-text="p.ultimo.name"></div>
                        </div>
                      </template>
                    </td>
                    <td style="text-align:right" x-text="p.ultimo ? fmt.num(p.ultimo.paginas_html) : '—'"></td>
                    <td style="text-align:right"
                        :class="p.ultimo && p.ultimo.paginas_html && p.ultimo.indexables / p.ultimo.paginas_html < .5 ? 'text-orange' : ''"
                        x-text="p.ultimo && p.ultimo.paginas_html ? Math.round(p.ultimo.indexables / p.ultimo.paginas_html * 100) + ' %' : '—'"></td>
                    <td style="text-align:right" :class="p.ultimo && p.ultimo.errores ? 'text-red' : ''"
                        x-text="p.ultimo ? fmt.num(p.ultimo.errores) : '—'"></td>
                    <td style="white-space:nowrap">
                      <template x-if="!p.evolucion || !p.evolucion.tendencia"><span class="text-dim text-sm">—</span></template>
                      <template x-if="p.evolucion && p.evolucion.tendencia">
                        <span class="evo-tendencia" :title="'Serie «' + p.evolucion.serie + '». ' + ((textoTendencia(p.evolucion.tendencia) || {}).titulo || '')">
                          <span x-html="sparkline(p.evolucion.valores, p.evolucion.cortes)"></span>
                          <span class="delta" :class="(textoTendencia(p.evolucion.tendencia) || {}).clase"
                                x-text="(textoTendencia(p.evolucion.tendencia) || {}).texto"></span>
                        </span>
                      </template>
                    </td>
                    <td class="text-sm">
                      <template x-if="p.ultimo && p.ultimo.alertas">
                        <span :class="p.ultimo.alertas_criticas ? 'text-red' : 'text-orange'"
                              x-text="(p.ultimo.alertas_criticas ? p.ultimo.alertas_criticas + ' críticas · ' : '') + p.ultimo.alertas + (p.ultimo.alertas === 1 ? ' alerta' : ' alertas')"></span>
                      </template>
                      <template x-if="!p.ultimo || !p.ultimo.alertas"><span class="text-dim">—</span></template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== FICHA DE UN CLIENTE ===== -->
    <template x-if="view === 'client'">
      <div>
        <div class="flex items-center justify-between mb-2" style="flex-wrap:wrap;gap:.5rem">
          <div>
            <h2 style="font-size:1.2rem;font-weight:700" x-text="cliente ? cliente.nombre : 'Nuevo cliente'"></h2>
            <div class="text-dim text-sm" x-show="cliente"
                 x-text="cliente ? (cliente.slug + ' · ' + ((cliente.dominios || []).join(', ') || 'sin dominios')) : ''"></div>
          </div>
          <template x-if="cliente">
            <button class="btn btn-primary btn-sm" @click="openCreate({ cliente_id: cliente.id })"
                    style="display:flex;align-items:center;gap:.35rem">
              <i data-lucide="plus-circle" style="width:14px;height:14px"></i> Nuevo rastreo
            </button>
          </template>
        </div>

        <div class="tabs" x-show="cliente">
          <button type="button" class="tab" :class="clienteTab === 'rastreos' && 'active'" @click="clienteTab = 'rastreos'"
               style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="radar" style="width:14px;height:14px"></i> Rastreos
          </button>
          <button type="button" class="tab" :class="clienteTab === 'config' && 'active'" @click="clienteTab = 'config'"
               style="display:flex;align-items:center;gap:.35rem">
            <i data-lucide="settings" style="width:14px;height:14px"></i> Configuración
          </button>
        </div>

        <template x-if="clienteError">
          <div class="card mb-2" style="border-color:var(--red);color:var(--red);padding:.5rem .75rem;font-size:.85rem"
               x-text="clienteError"></div>
        </template>

        <!-- --- Pestana: perfiles y rastreos --- -->
        <template x-if="cliente && clienteTab === 'rastreos'">
          <div>
            <div class="card mb-2">
              <div class="flex items-center justify-between mb-1">
                <h3 style="font-size:1rem">Perfiles de rastreo</h3>
                <button class="btn btn-sm" @click="nuevoPerfil()">Nuevo perfil</button>
              </div>
              <p class="text-dim text-sm mb-1">
                Que se rastrea y como: el sitio principal, el blog, otro idioma o un competidor. Un
                rastreo lanzado desde un perfil hereda la configuración del cliente y la del perfil.
              </p>
              <template x-if="!clientePerfiles.length">
                <div class="text-dim text-sm">Sin perfiles todavía.</div>
              </template>
              <template x-if="clientePerfiles.length">
                <div class="table-wrap">
                <table style="width:100%;font-size:.85rem">
                  <thead><tr>
                    <th style="text-align:left">perfil</th>
                    <th style="text-align:left">semillas</th>
                    <th style="text-align:left">último rastreo</th>
                    <th style="width:13rem"></th>
                  </tr></thead>
                  <tbody>
                    <template x-for="p in clientePerfiles" :key="p.id">
                      <tr :style="p.activo ? '' : 'opacity:.5'">
                        <td>
                          <div x-text="p.nombre"></div>
                          <span class="badge" :class="p.rol === 'competidor' ? 'badge-pending' : 'badge-completed'"
                                x-text="p.rol"></span>
                        </td>
                        <td class="text-dim" x-text="(p.seeds || []).join(', ').slice(0, 80)"></td>
                        <td>
                          <template x-if="p.last_job_id">
                            <a href="#" @click.prevent="openJob(p.last_job_id)">abrir</a>
                          </template>
                          <span class="text-dim" x-show="!p.last_job_id">nunca</span>
                        </td>
                        <td style="text-align:right;white-space:nowrap">
                          <button class="btn btn-sm btn-primary"
                                  @click="openCreate({ cliente_id: cliente.id, profile_id: p.id })">Lanzar</button>
                          <button class="btn btn-sm" @click="editarPerfil(p)">Editar</button>
                          <button class="btn btn-sm" @click="borrarPerfil(p)"
                                  data-tip="Borra el perfil. Sus rastreos NO se borran">&times;</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                </div>
              </template>
            </div>

            <!-- Evolucion por perfil (decision 130): graficas de `profile_runs`.
                 Solo los censos comparables hacen linea; lo fallido, truncado,
                 canario o lista va abajo con una ×. Un corte «v» marca que entre
                 dos puntos cambio la version del analisis. -->
            <template x-if="clienteEvolucion && clienteEvolucion.series && clienteEvolucion.series.length">
              <div class="card mb-2 evo">
                <div class="flex items-center mb-1" style="gap:.5rem;flex-wrap:wrap">
                  <h3 style="font-size:1rem">Evolución por perfil</h3>
                  <template x-if="clienteEvolucion.series.length > 1">
                    <select x-model="evolucionClave" class="text-sm" style="margin-left:auto;max-width:18rem">
                      <template x-for="s in clienteEvolucion.series" :key="s.clave">
                        <option :value="s.clave" :selected="s.clave === evolucionClave"
                                x-text="s.nombre + ' (' + s.comparables + (s.comparables === 1 ? ' censo' : ' censos') + ')'"></option>
                      </template>
                    </select>
                  </template>
                </div>
                <template x-if="serieEvolucion() && serieEvolucion().comparables < 2">
                  <p class="text-dim text-sm">Hacen falta dos censos comparables (completos, ni canarios ni pruebas) para dibujar una evolución.</p>
                </template>
                <template x-if="serieEvolucion() && serieEvolucion().comparables >= 2">
                  <div>
                    <div class="evo-rejilla">
                      <template x-for="k in METRICAS_GRAFICADAS" :key="k">
                        <div class="evo-grafica">
                          <div class="evo-cab">
                            <span class="text-sm" x-text="etiquetaMetrica(k)"></span>
                            <span class="evo-valor">
                              <span x-text="resumenMetrica(k).valor"></span>
                              <template x-if="resumenMetrica(k).tendencia">
                                <span class="delta" :class="resumenMetrica(k).tendencia.clase"
                                      :title="resumenMetrica(k).tendencia.titulo"
                                      x-text="resumenMetrica(k).tendencia.texto"></span>
                              </template>
                            </span>
                          </div>
                          <div x-html="graficaEvolucion(k)"></div>
                        </div>
                      </template>
                    </div>
                    <p class="text-dim text-sm evo-leyenda">
                      <span class="evo-ley-punto"></span> censo comparable ·
                      <span class="evo-fuera-txt">×</span> no comparable (fallido, truncado, canario, prueba o lista; pasa el ratón para el motivo) ·
                      <span class="evo-ley-corte">v</span> cambió la versión del análisis: el salto puede ser nuestro, no del sitio.
                    </p>
                  </div>
                </template>
                <template x-if="clienteEvolucion.sin_agregado">
                  <p class="text-dim text-sm" x-text="fmt.num(clienteEvolucion.sin_agregado) + (clienteEvolucion.sin_agregado === 1 ? ' rastreo terminado no tiene' : ' rastreos terminados no tienen') + ' sus cifras agregadas (son anteriores a la evolución): scripts/rellenar_evolucion.py los rellena.'"></p>
                </template>
              </div>
            </template>

            <div class="card">
              <!-- La serie (UX-08): cada rastreo con las cifras que se comparan
                   de un censo a otro. La diferencia de errores se mide contra el
                   censo ANTERIOR (no contra el canario de en medio). -->
              <div class="flex items-center mb-1" style="gap:.5rem;flex-wrap:wrap">
                <h3 style="font-size:1rem">Evolución de los rastreos</h3>
                <label class="checkbox-label text-sm" style="margin-left:auto">
                  <input type="checkbox" x-model="serieSoloCensos"> Solo censos
                </label>
              </div>
              <template x-if="!clienteSerie.length">
                <div class="text-dim text-sm">Ningún rastreo todavía.</div>
              </template>
              <template x-if="clienteSerie.length">
                <div class="table-wrap">
                <table style="width:100%;font-size:.85rem">
                  <thead><tr>
                    <th style="text-align:left">fecha</th>
                    <th style="text-align:left">rastreo</th>
                    <th style="text-align:right">URLs</th>
                    <th style="text-align:right">páginas</th>
                    <th style="text-align:right">indexables</th>
                    <th style="text-align:right">errores</th>
                    <th style="text-align:right">avisos</th>
                    <th style="text-align:left">frente al anterior</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="(j, n) in serieVisible()" :key="j.id">
                      <tr @click="location.hash = '#/rastreos/' + j.id" style="cursor:pointer">
                        <td style="white-space:nowrap" x-text="fmt.dia(j.created_at)" :title="fmt.date(j.created_at)"></td>
                        <td>
                          <span x-text="j.name"></span>
                          <span class="tipo-chip" x-show="j.tipo !== 'censo'" x-text="j.tipo"></span>
                          <span class="badge" :class="statusColor(j.status)" x-show="j.status !== 'completed'" x-text="fmt.status(j.status)"></span>
                        </td>
                        <td style="text-align:right" x-text="fmt.num(j.urls)"></td>
                        <td style="text-align:right" x-text="fmt.num(j.paginas_html)"></td>
                        <td style="text-align:right" x-text="j.paginas_html ? Math.round(j.indexables / j.paginas_html * 100) + ' %' : '—'"></td>
                        <td style="text-align:right;white-space:nowrap">
                          <span x-text="fmt.num(j.errores)"></span>
                          <template x-if="censoAnterior(j)">
                            <span class="delta" :class="j.errores > censoAnterior(j).errores ? 'peor' : (j.errores < censoAnterior(j).errores ? 'mejor' : '')"
                                  x-text="j.errores === censoAnterior(j).errores ? '=' : (j.errores > censoAnterior(j).errores ? '▲' : '▼') + fmt.num(Math.abs(j.errores - censoAnterior(j).errores))"></span>
                          </template>
                        </td>
                        <td style="text-align:right" x-text="fmt.num(j.avisos)"></td>
                        <td class="text-sm">
                          <template x-if="j.alertas === null"><span class="text-dim">—</span></template>
                          <template x-if="j.alertas !== null">
                            <a :href="'#/rastreos/' + j.id + '/comparar'" @click.stop
                               :class="j.alertas_criticas ? 'text-red' : ''"
                               x-text="j.alertas ? j.alertas + (j.alertas === 1 ? ' alerta' : ' alertas') : 'sin alertas'"></a>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- --- Pestana: configuracion del cliente --- -->
        <template x-if="clienteTab === 'config' || !cliente">
          <div class="card">
            <div class="form-row">
              <div class="form-group">
                <label>Nombre *</label>
                <input type="text" x-model="clienteForm.nombre" placeholder="Ej: Lopesan Hotels">
              </div>
              <div class="form-group">
                <label>Slug</label>
                <input type="text" x-model="clienteForm.slug" placeholder="sale del nombre si se deja vacio">
                <div class="form-hint">Identificador estable: con el se casa el cliente al importar un backup.</div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Dominios (uno por linea)</label>
                <textarea x-model="clienteForm.dominios" rows="3" placeholder="www.cliente.com&#10;blog.cliente.com"></textarea>
              </div>
              <div class="form-group">
                <label>Zona horaria</label>
                <input type="text" x-model="clienteForm.zona_horaria" placeholder="Europe/Madrid">
              </div>
            </div>
            <div class="form-group">
              <label>Notas</label>
              <textarea x-model="clienteForm.notas" rows="2"></textarea>
            </div>

            <div class="form-group">
              <label>Configuracion de rastreo por defecto (JSON)</label>
              <textarea x-model="clienteForm.config_defecto" rows="6" style="font-family:monospace;font-size:.8rem"
                        placeholder='{"render_js": true, "exclude_patterns": ["/carrito/"]}'></textarea>
              <div class="form-hint">
                Solo lo que este cliente fija; lo demas queda con los valores de siempre. Mismas claves que
                <code>projects/&lt;cliente&gt;/config.json</code>. Una clave que no existe se rechaza al guardar.
              </div>
            </div>

            <!-- Integraciones: NUNCA el secreto. Se guarda el nombre de la
                 variable de entorno; la API solo dice si esta puesta. -->
            <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)">
              <div class="flex items-center justify-between mb-1">
                <h3 style="font-size:1rem">Integraciones</h3>
                <button class="btn btn-sm" @click="agregarIntegracion()">Anadir integracion</button>
              </div>
              <p class="text-dim text-sm mb-1">
                APIs externas del cliente (Search Console, DataForSEO, Ahrefs, Semrush...). <strong>Las claves no se
                guardan aquí</strong>: la API no tiene autenticación y cualquiera que llegue a ella podría leerlas.
                Se escribe el <em>nombre</em> de la variable de entorno y el secreto se pone en el
                <code>.env</code> del servidor, por ejemplo <code>DATAFORSEO_LIN3S=login:password</code>.
              </p>
              <template x-for="(i, idx) in clienteForm.integraciones" :key="idx">
                <div class="card mb-1" style="padding:.6rem .75rem">
                  <div class="form-row">
                    <div class="form-group">
                      <label>Tipo</label>
                      <select x-model="i.tipo">
                        <option value="gsc">Search Console</option>
                        <option value="dataforseo">DataForSEO</option>
                        <option value="ahrefs">Ahrefs</option>
                        <option value="semrush">Semrush</option>
                        <option value="majestic">Majestic</option>
                        <option value="pagespeed">PageSpeed</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Etiqueta</label>
                      <input type="text" x-model="i.etiqueta" placeholder="opcional">
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>Variable de entorno con la credencial</label>
                      <input type="text" x-model="i.credencial_env" style="font-family:monospace"
                             :placeholder="prefijoIntegracion(i.tipo) + 'NOMBRECLIENTE'">
                      <div class="form-hint">
                        Tiene que empezar por <code x-text="prefijoIntegracion(i.tipo)"></code>.
                        <template x-if="i.configurada === true">
                          <span style="color:var(--green,#2e7d32)">&#10003; configurada en el servidor</span>
                        </template>
                        <template x-if="i.configurada === false">
                          <span style="color:var(--orange,#e67e22)">no esta puesta en el servidor</span>
                        </template>
                        <template x-if="i.configurada === null">
                          <span class="text-dim">se comprueba al guardar</span>
                        </template>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>Parametros (clave=valor, uno por linea)</label>
                      <textarea x-model="i.parametros" rows="2" style="font-family:monospace;font-size:.8rem"
                                :placeholder="i.tipo === 'gsc' ? 'propiedad=sc-domain:cliente.com' : 'location_code=2724\nlanguage_code=es'"></textarea>
                    </div>
                  </div>
                  <div class="flex items-center justify-between">
                    <label class="checkbox-label"><input type="checkbox" x-model="i.activa"> Activa</label>
                    <button class="btn btn-sm" @click="quitarIntegracion(idx)">Quitar</button>
                  </div>
                </div>
              </template>
            </div>

            <div class="flex items-center gap-1" style="margin-top:1rem">
              <button class="btn btn-primary" @click="guardarCliente()"
                      x-text="cliente ? 'Guardar cambios' : 'Crear cliente'"></button>
              <button class="btn" @click="cliente ? (clienteForm = _formCliente(cliente)) : verClientes()">Cancelar</button>
              <template x-if="cliente">
                <button class="btn btn-danger" style="margin-left:auto" @click="borrarCliente()"
                        data-tip="Borra el cliente y sus perfiles. Sus rastreos NO se borran">Borrar cliente</button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== MODAL: PERFIL DE RASTREO ===== -->
    <template x-if="perfilForm && cliente">
      <div class="modal-backdrop" @click.self="perfilForm = null">
        <div class="modal" style="max-width:38rem">
          <div class="modal-header">
            <h3 x-text="perfilForm.id ? 'Editar perfil' : 'Nuevo perfil'"></h3>
            <button class="btn-icon" @click="perfilForm = null" style="font-size:1.25rem">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-row">
              <div class="form-group">
                <label>Nombre *</label>
                <input type="text" x-model="perfilForm.nombre" placeholder="Sitio principal, Blog, Competidor X...">
              </div>
              <div class="form-group">
                <label>Rol</label>
                <select x-model="perfilForm.rol">
                  <option value="propio">Propio</option>
                  <option value="competidor">Competidor</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>URLs semilla * (una por linea)</label>
              <textarea x-model="perfilForm.seeds" rows="3" placeholder="https://www.cliente.com/"></textarea>
            </div>
            <div class="form-group">
              <label>Configuracion del perfil (JSON)</label>
              <textarea x-model="perfilForm.config" rows="5" style="font-family:monospace;font-size:.8rem"></textarea>
              <div class="form-hint">Se aplica encima de la del cliente. <code>null</code> quita lo heredado
                (por ejemplo <code>{"max_urls": null}</code> deja sin tope a un cliente que lo fija).</div>
            </div>
            <div class="form-group">
              <label>Notas</label>
              <textarea x-model="perfilForm.notas" rows="2"></textarea>
            </div>
            <label class="checkbox-label"><input type="checkbox" x-model="perfilForm.activo"> Activo</label>
            <div x-show="perfilError" class="card" style="border-left:3px solid var(--red,#d32f2f);margin-top:.8rem">
              <div class="text-sm" x-text="perfilError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="perfilForm = null">Cancelar</button>
            <button class="btn btn-primary" @click="guardarPerfil()">Guardar</button>
          </div>
        </div>
      </div>
    </template>

    <template x-if="view === 'jobs'">
      <div>
        <!-- Filtros (UX-07): buscar, cliente, tipo y estado. Todo va a la
             URL, asi que «los canarios de Lopesan» es un enlace. -->
        <div class="filtros-rastreos mb-2">
          <div class="exp-search-wrap" style="max-width:320px">
            <i data-lucide="search"></i>
            <input type="search" class="exp-search" placeholder="Buscar por nombre o dominio…"
                   x-model="jobsBuscar" @input.debounce.400ms="jobsPage = 1; loadJobs()" aria-label="Buscar rastreos">
          </div>
          <select x-model="jobsCliente" @change="jobsPage = 1; loadJobs()" aria-label="Cliente">
            <option value="">Todos los clientes</option>
            <option value="ninguno">Sin cliente</option>
            <template x-for="c in clientes" :key="c.id">
              <option :value="c.id" :selected="c.id === jobsCliente" x-text="c.nombre"></option>
            </template>
          </select>
          <div class="grupo-chips" role="group" aria-label="Tipo">
            <template x-for="t in [['', 'Todos'], ['censo', 'Censos'], ['canario', 'Canarios'], ['prueba', 'Pruebas']]" :key="t[0]">
              <button class="btn btn-sm chip" :class="jobsTipo === t[0] && 'chip-on'" @click="jobsTipo = t[0]; jobsPage = 1; loadJobs()" x-text="t[1]"></button>
            </template>
          </div>
          <select x-model="jobsFilter" @change="jobsPage = 1; loadJobs()" aria-label="Estado">
            <option value="">Cualquier estado</option>
            <template x-for="st in ['pending','running','analyzing','completed','failed','cancelled']" :key="st">
              <option :value="st" :selected="st === jobsFilter" x-text="fmt.status(st)"></option>
            </template>
          </select>
          <span class="text-dim text-sm" style="margin-left:auto" x-text="fmt.num(jobsTotal) + (jobsTotal === 1 ? ' rastreo' : ' rastreos')"></span>
          <!-- Lo que ocupa la base, donde se decide que borrar: sin esto, la
               unica forma de enterarse de que el disco se llena es que se
               llene (decision 96). -->
          <template x-if="almacenamiento && almacenamiento.total_bytes">
            <button class="btn btn-sm" @click="verAlmacenamiento = true"
                    :title="'Base de datos: ' + fmt.bytes(almacenamiento.total_bytes) + ' — ver el desglose'">
              <i data-lucide="hard-drive" style="width:14px;height:14px"></i>
              <span x-text="fmt.bytes(almacenamiento.total_bytes)"></span>
            </button>
          </template>
        </div>

        <!-- Seleccion para borrar en masa. Aparece solo cuando hay algo
             seleccionado: en la lista normal no estorba. -->
        <template x-if="seleccionados.length > 0">
          <div class="barra-seleccion mb-2">
            <strong x-text="fmt.num(seleccionados.length) + (seleccionados.length === 1 ? ' rastreo seleccionado' : ' rastreos seleccionados')"></strong>
            <span class="text-dim text-sm">La selección se mantiene al cambiar de página o de filtro</span>
            <button class="btn btn-sm" @click="limpiarSeleccion()">Limpiar</button>
            <button class="btn btn-sm btn-danger" @click="abrirBorrado()">
              <i data-lucide="trash-2" style="width:14px;height:14px"></i> Eliminar seleccionados
            </button>
          </div>
        </template>

        <!-- Cargando -->
        <template x-if="loading && jobs.length === 0">
          <div class="loading-overlay"><div class="spinner"></div> Cargando trabajos...</div>
        </template>

        <!-- Vacio -->
        <template x-if="!loading && jobs.length === 0">
          <div class="empty" style="padding:3rem 1.5rem">
            <div class="empty-icon" style="margin-bottom:1rem;opacity:.6">
              <i data-lucide="search" style="width:48px;height:48px;color:var(--accent)"></i>
            </div>
            <h3 style="margin-bottom:.5rem;font-size:1.1rem">No hay trabajos de rastreo</h3>
            <p class="text-dim" style="margin-bottom:1.25rem;max-width:340px;line-height:1.5">Crea tu primer rastreo para empezar a auditar un sitio web y detectar problemas SEO automáticamente.</p>
            <button class="btn btn-primary mt-2" @click="openCreate()" style="display:flex;align-items:center;gap:.4rem;padding:.6rem 1.2rem">
              <i data-lucide="plus-circle" style="width:16px;height:16px"></i> Nuevo rastreo
            </button>
          </div>
        </template>

        <!-- Tabla de trabajos -->
        <template x-if="jobs.length > 0">
          <div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:2.2rem">
                      <input type="checkbox" :checked="paginaSeleccionada" @change="alternarPagina()"
                             aria-label="Seleccionar los rastreos de esta página"
                             title="Seleccionar los rastreos de esta página">
                    </th>
                    <th data-tip="Nombre identificativo del trabajo de rastreo">Nombre</th>
                    <th data-tip="Cliente al que pertenece el rastreo">Cliente</th>
                    <th data-tip="Estado actual: pendiente, en curso, completado, fallido o cancelado">Estado</th>
                    <th data-tip="Número de URLs semilla desde las que empieza el rastreo">Semillas</th>
                    <th data-tip="URLs rastreadas con éxito hasta ahora">Rastreadas</th>
                    <th data-tip="URLs que dieron error (timeout, DNS, conexión rechazada, etc.)">Fallidas</th>
                    <th data-tip="Cuando se creo el trabajo">Creado</th>
                    <th data-tip="Tiempo total desde el inicio hasta la finalización del rastreo">Duración</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="j in jobs" :key="j.id">
                    <tr @click="openJob(j.id)" style="cursor:pointer"
                        :class="jobsSel[j.id] && 'fila-marcada'">
                      <td @click.stop>
                        <input type="checkbox" :checked="!!jobsSel[j.id]" @change="alternarSeleccion(j.id)"
                               :aria-label="'Seleccionar ' + j.name">
                      </td>
                      <td>
                        <div style="font-weight:500">
                          <a :href="'#/rastreos/' + j.id" @click.stop class="enlace-fila" x-text="j.name"></a>
                          <span class="tipo-chip" x-show="j.tipo_efectivo && j.tipo_efectivo !== 'censo'" x-text="j.tipo_efectivo"></span>
                        </div>
                        <div class="text-dim text-sm truncate" style="max-width:250px" x-text="j.seeds?.[0] || ''"></div>
                      </td>
                      <td>
                        <template x-if="j.cliente_id">
                          <a href="#" @click.prevent.stop="abrirCliente(j.cliente_id)" x-text="j.cliente_nombre || j.client_id"></a>
                        </template>
                        <!-- Sin FK pero con texto: un job anterior a la migracion.
                             Se ensena el texto, atenuado, para no esconder la pista. -->
                        <template x-if="!j.cliente_id">
                          <span class="text-dim" x-text="j.client_id || '—'"></span>
                        </template>
                      </td>
                      <td><span class="badge" :class="statusColor(j.status)" x-text="fmt.status(j.status)"></span></td>
                      <td x-text="j.seeds?.length || 0"></td>
                      <td x-text="fmt.num(j.total_urls_crawled)"></td>
                      <td x-text="fmt.num(j.total_urls_failed)"></td>
                      <td x-text="fmt.ago(j.created_at)" :title="fmt.date(j.created_at)"></td>
                      <td>
                        <template x-if="j.started_at && j.completed_at">
                          <span x-text="fmt.lapso(new Date(j.completed_at) - new Date(j.started_at))"></span>
                        </template>
                        <template x-if="j.started_at && !j.completed_at && ['running','analyzing','pending'].includes(j.status)">
                          <span class="text-dim">en curso...</span>
                        </template>
                        <!-- Terminado y sin marca de fin: rastreos viejos y los
                             que murieron sin cerrar. Decir "en curso" de un job
                             completado es mentir sobre lo unico que mira ahi
                             quien pasa la vista por la lista. -->
                        <template x-if="j.started_at && !j.completed_at && !['running','analyzing','pending'].includes(j.status)">
                          <span class="text-dim" title="Terminado sin marca de fin">&mdash;</span>
                        </template>
                        <template x-if="!j.started_at">
                          <span class="text-dim">&mdash;</span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Paginacion -->
            <div class="pagination">
              <span>Página <strong x-text="jobsPage"></strong> de <strong x-text="jobsPages"></strong></span>
              <div class="pagination-buttons">
                <button class="btn btn-sm" :disabled="jobsPage <= 1" @click="setJobsPage(jobsPage - 1)">&laquo; Anterior</button>
                <button class="btn btn-sm" :disabled="jobsPage >= jobsPages" @click="setJobsPage(jobsPage + 1)">Siguiente &raquo;</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>


    <!-- ============================================================ -->
    <!--                  VISTA: DETALLE DEL TRABAJO                  -->
    <!-- ============================================================ -->
    <template x-if="view === 'detail' && job">
      <div>
        <!-- Hero gradient header -->
        <div class="ficha-cabecera">
          <!-- Cabecera -->
          <div class="flex items-center justify-between" style="flex-wrap:wrap;gap:.5rem">
            <div>
              <h2 style="font-size:1.2rem;font-weight:700" x-text="job.name"></h2>
              <div class="text-dim text-sm flex items-center gap-1 mt-1">
                <span class="badge" :class="statusColor(job.status)" x-text="fmt.status(job.status)"></span>
                <span>&middot;</span>
                <span x-text="'Creado ' + fmt.ago(job.created_at)"></span>
                <template x-if="job.cliente_id">
                  <span>&middot; <a href="#" @click.prevent="abrirCliente(job.cliente_id)"
                     x-text="job.cliente_nombre || job.client_id"></a></span>
                </template>
              </div>
            </div>
            <div class="flex gap-1">
              <template x-if="['pending','running'].includes(job.status)">
                <button class="btn btn-sm btn-danger" @click="cancelJob()" style="display:flex;align-items:center;gap:.3rem">
                  <i data-lucide="x-circle" style="width:13px;height:13px"></i> Cancelar
                </button>
              </template>
              <template x-if="['failed','cancelled'].includes(job.status)">
                <button class="btn btn-sm btn-primary" @click="openResumeDialog()" style="display:flex;align-items:center;gap:.3rem">
                  <i data-lucide="play-circle" style="width:13px;height:13px"></i> Reanudar
                </button>
              </template>
              <!-- Se programa DESDE un rastreo que ya salio bien: sus semillas y
                   su configuracion son las buenas, y repetirlas es un clic. -->
              <button class="btn btn-sm" @click="abrirProgramar()" style="display:flex;align-items:center;gap:.3rem"
                      data-tip="Repetir este mismo rastreo cada cierto tiempo">
                <i data-lucide="calendar-clock" style="width:13px;height:13px"></i> Programar
              </button>
              <!-- Analisis enriquecido (#40): lo UNICO que gasta dinero, siempre a
                   mano y con el coste a la vista antes de confirmar. -->
              <button class="btn btn-sm" @click="abrirEnriquecido()" :disabled="job.status !== 'completed'"
                      style="display:flex;align-items:center;gap:.3rem"
                      :data-tip="job.status === 'completed' ? 'Preguntas a un modelo sobre las URLs, con el coste estimado antes de lanzar' : 'Solo con el rastreo completado y analizado'">
                <i data-lucide="sparkles" style="width:13px;height:13px"></i> Análisis enriquecido
              </button>
              <!-- Las cuatro descargas en un menu (UX-09): sueltas ocupaban
                   media cabecera y competian con lo que se usa a diario. -->
              <div class="menu-wrap" @click.outside="menuAbierto === 'exportar' && (menuAbierto = '')">
                <button class="btn btn-sm" @click="menuAbierto = menuAbierto === 'exportar' ? '' : 'exportar'"
                        aria-haspopup="menu" :aria-expanded="menuAbierto === 'exportar'" style="display:flex;align-items:center;gap:.3rem">
                  <i data-lucide="download" style="width:13px;height:13px"></i> Exportar
                  <i data-lucide="chevron-down" style="width:12px;height:12px"></i>
                </button>
                <div class="menu" x-show="menuAbierto === 'exportar'" x-transition.opacity role="menu" style="min-width:19rem">
                  <button role="menuitem" @click="menuAbierto = ''; exportCSV()">
                    <i data-lucide="table" style="width:14px;height:14px"></i>
                    <span>URLs con sus metadatos (CSV)<span class="menu-sub">Una fila por URL, compatible con Excel</span></span></button>
                  <button role="menuitem" @click="menuAbierto = ''; exportLinksCSV()">
                    <i data-lucide="link" style="width:14px;height:14px"></i>
                    <span>Enlaces (CSV)<span class="menu-sub">Origen, destino, ancla, rel y follow</span></span></button>
                  <button role="menuitem" @click="menuAbierto = ''; exportContentCSV()">
                    <i data-lucide="file-text" style="width:14px;height:14px"></i>
                    <span>Contenido (CSV)<span class="menu-sub">Texto y markdown de cada página</span></span></button>
                  <hr>
                  <button role="menuitem" @click="menuAbierto = ''; exportBackup()" :disabled="!['completed','failed','cancelled'].includes(job.status)">
                    <i data-lucide="archive" style="width:14px;height:14px"></i>
                    <span>Backup completo (ZIP)<span class="menu-sub">Para importarlo en otra instalación</span></span></button>
                </div>
              </div>
              <div class="menu-wrap" @click.outside="menuAbierto === 'mas' && (menuAbierto = '')">
                <button class="btn btn-sm btn-icon-only" @click="menuAbierto = menuAbierto === 'mas' ? '' : 'mas'"
                        aria-haspopup="menu" :aria-expanded="menuAbierto === 'mas'" aria-label="Más acciones" title="Más acciones">
                  <i data-lucide="more-horizontal" style="width:16px;height:16px"></i>
                </button>
                <div class="menu" x-show="menuAbierto === 'mas'" x-transition.opacity role="menu">
                  <button role="menuitem" @click="menuAbierto = ''; abrirEditarJob()">
                    <i data-lucide="pencil" style="width:14px;height:14px"></i> Nombre, tipo y cliente</button>
                  <hr>
                  <button role="menuitem" class="danger" @click="menuAbierto = ''; deleteJob()">
                    <i data-lucide="trash-2" style="width:14px;height:14px"></i> Eliminar este rastreo</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Barra de progreso para trabajos en curso -->
        <template x-if="progress && ['pending','running','analyzing'].includes(job.status)">
          <div class="card mb-2">
            <div class="flex items-center justify-between text-sm">
              <span x-text="job.status === 'analyzing' ? 'Analizando resultados SEO...' : 'Rastreo en curso...'"></span>
              <span>
                <span x-text="fmt.num(progress.crawled_count) + ' URLs rastreadas'"></span>
                <!-- Frontera pendiente: evita tener que adivinar el tamano del
                     sitio. Si llega a 0, el rastreo cubrio todo lo enlazado. -->
                <template x-if="progress.pending_count !== null && progress.pending_count > 0">
                  <span class="text-dim" x-text="' · ' + fmt.num(progress.pending_count) + ' en cola'"></span>
                </template>
              </span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" :style="'width:' + crawledPercent() + '%'"></div>
            </div>
          </div>
        </template>

        <!-- Aviso de rastreo truncado. Sin esto, un crawl cortado por el tope
             de URLs se presentaba igual que uno completo, y las metricas de
             enlaces (PageRank incluido) salian de un grafo parcial. -->
        <template x-if="job.finish_reason === 'max_urls_reached'">
          <div class="card mb-2" style="border-left:3px solid var(--warning,#d97706)">
            <div class="text-sm">
              <strong>Rastreo incompleto.</strong>
              Se alcanzó el tope de URLs configurado, así que quedaron páginas sin
              rastrear. El grafo de enlaces y el PageRank estan calculados sobre
              una parte del sitio. Reanuda el rastreo con un tope mayor —o sin
              tope— antes de usar estos datos para un informe.
            </div>
          </div>
        </template>

        <!-- Rastreo detras de un muro (decision 103): el job queda failed con
             la causa y no se analiza. Sin esto se leia como un sitio con
             todo en 403, o peor, como un sitio limpio. -->
        <template x-if="['bloqueado_por_waf','rate_limited'].includes(job.finish_reason)
                        || (job.health && job.health.causa)">
          <div class="card mb-2" style="border-left:3px solid var(--error,#dc2626)">
            <div class="text-sm">
              <strong x-text="(job.finish_reason === 'rate_limited' || (job.health||{}).causa === 'rate_limited')
                ? 'Rastreo parado: el servidor limita las peticiones (429).'
                : 'Rastreo parado: un WAF o un captcha no deja ver las páginas.'"></strong>
              Las respuestas que no eran la página llegaron al umbral, así que el
              rastreo se detuvo y no se ha analizado: las cifras de este censo
              no describen el sitio. Prueba con render de JavaScript, menos
              concurrencia o la IP del rastreador en la lista blanca del cliente.
            </div>
            <template x-if="job.health && job.health.por_clase">
              <div class="text-dim" style="font-size:.78rem;margin-top:.4rem"
                   x-text="Object.entries(job.health.por_clase).map(([c,n]) => fmt.claseRespuesta(c) + ': ' + fmt.num(n)).join(' · ')"></div>
            </template>
          </div>
        </template>

        <!-- Modo lista (decision 128): el veredicto de GET /veredicto, arriba
             y antes que las alertas, que es lo que se mira en un QA de
             despliegue. Los motivos traen su mensaje y una muestra de URLs. -->
        <template x-if="veredicto && VEREDICTO_TEXTO[veredicto.veredicto]">
          <div class="card mb-2 chk" data-testid="veredicto-lista"
               :style="'border-left:3px solid var(--' + VEREDICTO_TEXTO[veredicto.veredicto][1] + ')'">
            <div class="text-sm" style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline;flex-wrap:wrap">
              <span>
                <strong :class="VEREDICTO_TEXTO[veredicto.veredicto][1]" x-text="VEREDICTO_TEXTO[veredicto.veredicto][0]"></strong>
                <span class="text-dim" x-text="' · lista de ' + fmt.num(veredicto.urls_de_la_lista) + (veredicto.urls_de_la_lista === 1 ? ' URL' : ' URLs')"></span>
              </span>
              <a class="text-sm" :href="'/api/jobs/' + job.id + '/veredicto'" target="_blank" rel="noopener">JSON para CI</a>
            </div>
            <template x-if="veredicto.veredicto === 'pasa'">
              <div class="text-sm text-dim">Todas las URLs de la lista responden 200, siguen indexables y con el mismo canonical que en el censo de referencia.</div>
            </template>
            <template x-for="(m, i) in (veredicto.motivos || []).concat(veredicto.no_concluyente_por || [])" :key="m.tipo + (m.regla || '') + i">
              <div :style="'margin-top:.5rem;padding-left:.6rem;border-left:2px solid var(--' + (i < (veredicto.motivos || []).length ? 'red' : 'orange') + ')'">
                <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline">
                  <span class="text-sm" x-text="m.mensaje.charAt(0).toUpperCase() + m.mensaje.slice(1) + (m.causa ? ' (' + m.causa + ')' : '')"></span>
                  <strong x-show="m.paginas" style="white-space:nowrap" x-text="fmt.num(m.paginas)"></strong>
                </div>
                <!-- Por posicion: las semillas pueden repetirse y un :key repetido deja el x-for sin pintar -->
                <template x-for="(e, j) in (m.ejemplos || []).slice(0, 5)" :key="j">
                  <div class="text-dim" style="font-size:.78rem;word-break:break-all"
                       x-text="e.url + (e.antes !== undefined ? '  ·  ' + (e.antes ?? '—') + ' → ' + (e.ahora ?? '—') : (e.ahora !== undefined && e.ahora !== null ? '  ·  ' + e.ahora : '')) + (e.destino ? '  → ' + e.destino : '')"></div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Que cambio respecto al censo anterior del mismo sitio, calculado
             al cerrar el rastreo. Va ARRIBA y antes que las cifras: una
             alerta a la que hay que ir no es una alerta. En Lopesan, media
             seccion canonicalizada a un servidor de pruebas se entrego como
             un aviso `info` entre 315.119 incidencias. -->
        <template x-if="job.comparacion && (job.comparacion.alertas || []).length">
          <div class="card mb-2"
               :style="'border-left:3px solid ' + fmt.colorSeveridad(job.comparacion.alertas[0].severidad)">
            <div class="text-sm">
              <strong>Ha cambiado algo respecto al rastreo anterior.</strong>
              Comparado con <span x-text="job.comparacion.nombre_anterior"></span>
              (<span x-text="(job.comparacion.fecha_anterior || '').slice(0,10)"></span>).
            </div>
            <template x-for="al in job.comparacion.alertas" :key="al.regla + (al.extraccion || '')">
              <div :style="'margin-top:.5rem;padding-left:.6rem;border-left:2px solid '
                            + fmt.colorSeveridad(al.severidad)">
                <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline">
                  <strong x-text="fmt.tituloAlerta(al)"></strong>
                  <span style="white-space:nowrap;font-variant-numeric:tabular-nums">
                    <strong x-text="fmt.num(al.paginas)"></strong>
                    <span class="text-dim" x-text="' de ' + fmt.num(al.de) + ' · ' + al.pct + '%'"></span>
                  </span>
                </div>
                <div class="text-sm" x-text="al.que_decide_google"></div>
                <div class="text-dim" style="font-size:.78rem" x-show="fmt.detalleAlerta(al)" x-text="fmt.detalleAlerta(al)"></div>
                <!-- Por segmento de negocio (decision 127): «el 100 % de las
                     fichas» dice que mirar; la forma de la ruta, no. -->
                <div class="text-dim" style="font-size:.78rem" x-show="(al.segmentos || []).length"
                     x-text="(al.segmentos || []).slice(0,3).map(sg => sg.segmento + ' ' + fmt.num(sg.paginas) + '/' + fmt.num(sg.de) + ' = ' + sg.pct + '%').join(' · ')"></div>
              </div>
            </template>
            <div class="text-dim" style="font-size:.78rem;margin-top:.5rem">
              El detalle, con ejemplos y plantillas, en la pestana Comparar.
            </div>
          </div>
        </template>

        <!-- Aviso de grafo incompleto por JavaScript. El PageRank se calcula
             igual y antes se entregaba sin decir nada: el aviso solo existia en
             el log del worker y en una columna del CSV, que no abre quien mira
             el job en pantalla (decision 35). -->
        <template x-if="job.js_check && job.js_check.grafo_fiable === false">
          <div class="card mb-2" style="border-left:3px solid var(--warning,#d97706)">
            <div class="text-sm">
              <strong>El PageRank no es fiable: faltan enlaces.</strong>
              Este rastreo se hizo sin render de JavaScript y hay plantillas que
              montan sus enlaces con JS, así que el grafo esta incompleto y el
              PageRank sale de el.
              <template x-if="(job.js_check.plantillas || []).some(p => p.enlaces_solo_js > 0)">
                <span>
                  Plantillas afectadas:
                  <span x-text="(job.js_check.plantillas || []).filter(p => p.enlaces_solo_js > 0).map(p => p.plantilla.split('  (')[0]).join(', ')"></span>.
                </span>
              </template>
              Relanza con <code>render_js</code> antes de usar estas cifras de
              enlazado en un informe.
            </div>
          </div>
        </template>

        <!-- Lo contrario: no se pudo comprobar. Tampoco es "fiable". -->
        <template x-if="job.js_check && job.js_check.grafo_fiable === null">
          <div class="card mb-2" style="border-left:3px solid var(--muted,#6b7280)">
            <div class="text-sm">
              <strong>No se pudo comprobar si faltan enlaces.</strong>
              En las plantillas muestreadas, Chromium no recibio una pagina con
              contenido (bloqueo del WAF, desafio o error), asi que el
              <em>grafo fiable</em> queda sin determinar: ni se afirma que falten
              enlaces ni que no falten.
            </div>
          </div>
        </template>

        <!-- Extraccion a medida (decision 104): una linea por regla con lo
             que dio, y enlaces al Explorador ya filtrado. -->
        <template x-if="resumenAMedida && resumenAMedida.reglas.length">
          <div class="card mb-2">
            <div class="veredicto-titulo">
              Extracción a medida
              <a href="#" class="text-sm" style="margin-left:auto" @click.prevent="verAMedida(resumenAMedida.reglas[0].nombre, null)">ver en el Explorador</a>
            </div>
            <template x-if="resumenAMedida.render_js">
              <div class="text-sm text-dim">Se extrae del DOM renderizado y sin banners: una etiqueta que inyecta el JavaScript sí está; un banner que el rastreo quitó, no.</div>
            </template>
            <div class="table-wrap"><table class="tbl">
              <thead><tr><th>Regla</th><th>Evaluadas</th><th>Con valor</th><th>Sin coincidencia</th><th>Bloqueadas / error</th><th>Valores más frecuentes</th></tr></thead>
              <tbody>
                <template x-for="r in resumenAMedida.reglas" :key="r.nombre">
                  <tr>
                    <td x-text="r.etiqueta"></td>
                    <td x-text="fmt.num(r.evaluadas)"></td>
                    <td x-text="fmt.num(r.ok)"></td>
                    <td><a href="#" @click.prevent="verAMedida(r.nombre, r.clase === 'busqueda' ? 'no' : 'vacio')" x-text="fmt.num(r.sin_coincidencia)"></a></td>
                    <td x-text="fmt.num(r.bloqueadas) + ' / ' + fmt.num(r.errores + r.desactivadas)"></td>
                    <td class="text-sm" x-text="(r.top || []).map(t => t.valor + ' (' + t.paginas + ')').join(' · ')"></td>
                  </tr>
                </template>
              </tbody>
            </table></div>
            <template x-for="a in (resumenAMedida.avisos || [])" :key="a">
              <div class="text-sm orange" x-text="a"></div>
            </template>
          </div>
        </template>

        <!-- Tarjetas (UX-13). Antes eran «URLs totales» y «Procesadas» con
             la misma cifra, y «Fallidas 0» en rojo. Ahora cada una contesta
             una pregunta y lleva a donde se mira el detalle. -->
        <template x-if="stats">
          <div class="stats-grid">
            <button class="stat-card stat-link" @click="openExplorer(); setExplorerTab('html')"
                    data-tip="Páginas HTML internas que responden 2xx: lo que el buscador puede indexar">
              <div class="stat-value" x-text="fmt.num(stats.paginas_html)"></div>
              <div class="stat-label">Páginas HTML</div>
              <div class="stat-sub" x-text="'de ' + fmt.num(stats.total_urls) + ' URLs rastreadas'"></div>
            </button>
            <button class="stat-card stat-link" @click="openExplorer(); setExplorerTab('noindex')"
                    data-tip="Páginas HTML que el buscador puede indexar; el resto lleva noindex, canonical a otra URL o similar">
              <div class="stat-value" :class="stats.paginas_html && stats.indexables / stats.paginas_html < .5 ? 'orange' : 'green'"
                   x-text="fmt.num(stats.indexables)"></div>
              <div class="stat-label">Indexables</div>
              <div class="stat-sub" x-show="stats.paginas_html"
                   x-text="Math.round(stats.indexables / Math.max(1, stats.paginas_html) * 100) + ' % · ' + fmt.num(stats.no_indexables) + ' no indexables'"></div>
            </button>
            <button class="stat-card stat-link" @click="issueFilters.severity = 'error'; issueFilters.issue_type = ''; issues = []; switchTab('issues')"
                    data-tip="Incidencias de gravedad error: lo primero que hay que mirar">
              <div class="stat-value" :class="erroresDelJob() ? 'red' : 'green'" x-text="fmt.num(erroresDelJob())"></div>
              <div class="stat-label">Errores</div>
              <div class="stat-sub" x-text="fmt.num(stats.issues_by_type.reduce((a,i) => a + i.count, 0)) + ' incidencias en total'"></div>
            </button>
            <button class="stat-card stat-link" @click="switchTab('diff')"
                    data-tip="Lo que ha cambiado respecto al censo anterior del mismo sitio">
              <template x-if="job.comparacion && job.comparacion.comparable">
                <div>
                  <div class="stat-value" :class="(job.comparacion.alertas || []).length ? 'orange' : 'green'"
                       x-text="(n => n ? n + (n === 1 ? ' alerta' : ' alertas') : 'Sin alertas')((job.comparacion.alertas || []).length)"></div>
                  <div class="stat-label">Frente al censo anterior</div>
                  <div class="stat-sub" x-text="fmt.dia(job.comparacion.fecha_anterior)"></div>
                </div>
              </template>
              <template x-if="!(job.comparacion && job.comparacion.comparable)">
                <div>
                  <div class="stat-value" style="color:var(--text-dim)">—</div>
                  <div class="stat-label">Frente al censo anterior</div>
                  <div class="stat-sub" x-text="job.comparacion ? 'no comparable' : 'sin comparación automática'"></div>
                </div>
              </template>
            </button>
          </div>
        </template>

        <!-- Pestanas (UX-09/10/11). Cinco de uso diario y lo especializado
             bajo «Avanzado». La antigua pestana URLs era una version pobre
             del Explorador: ahora la pestana Explorador abre el de verdad. -->
        <div class="tabs tabs-main" role="tablist">
          <button class="tab" role="tab" :aria-selected="detailTab === 'overview'" :class="detailTab === 'overview' && 'active'" @click="switchTab('overview')">
            <i data-lucide="layout-dashboard" style="width:14px;height:14px"></i> Resumen
          </button>
          <button class="tab" role="tab" aria-selected="false" @click="openExplorer()" data-tip="Todas las URLs, con filtros por columna">
            <i data-lucide="table-2" style="width:14px;height:14px"></i> Explorador
            <span class="count" x-text="stats ? fmt.num(stats.total_urls) : ''"></span>
          </button>
          <button class="tab" role="tab" :aria-selected="detailTab === 'issues'" :class="detailTab === 'issues' && 'active'" @click="switchTab('issues')">
            <i data-lucide="alert-triangle" style="width:14px;height:14px"></i> Problemas <span class="count" x-text="(n => n ? fmt.num(n) : '')(stats ? stats.issues_by_type.reduce((a,i) => a + i.count, 0) : 0)"></span>
          </button>
          <button class="tab" role="tab" :aria-selected="detailTab === 'links'" :class="detailTab === 'links' && 'active'" @click="switchTab('links')">
            <i data-lucide="share-2" style="width:14px;height:14px"></i> Enlaces <span class="count" x-text="linksTotal ? fmt.num(linksTotal) : ''"></span>
          </button>
          <button class="tab" role="tab" :aria-selected="detailTab === 'diff'" :class="detailTab === 'diff' && 'active'" @click="switchTab('diff')" data-tip="Que ha cambiado respecto a otro rastreo del mismo sitio">
            <i data-lucide="git-compare" style="width:14px;height:14px"></i> Comparar
          </button>
          <button class="tab" role="tab" :aria-selected="detailTab === 'insights'" :class="detailTab === 'insights' && 'active'" @click="switchTab('insights')" data-tip="Informe SEO con puntuaciones y recomendaciones">
            <i data-lucide="file-bar-chart" style="width:14px;height:14px"></i> Informe SEO
          </button>
          <div class="menu-wrap" @click.outside="menuAbierto === 'avanzado' && (menuAbierto = '')">
            <button class="tab" role="tab" :aria-selected="['semantic','enriquecido','cleaning'].includes(detailTab)"
                    :class="['semantic','enriquecido','cleaning'].includes(detailTab) && 'active'"
                    @click="menuAbierto = menuAbierto === 'avanzado' ? '' : 'avanzado'" aria-haspopup="menu">
              <i data-lucide="flask-conical" style="width:14px;height:14px"></i>
              <span x-text="({semantic:'Semántico', enriquecido:'Enriquecido', cleaning:'Limpieza'})[detailTab] || 'Avanzado'"></span>
              <i data-lucide="chevron-down" style="width:12px;height:12px"></i>
            </button>
            <div class="menu" x-show="menuAbierto === 'avanzado'" x-transition.opacity role="menu" style="left:0;right:auto;min-width:20rem">
              <button role="menuitem" @click="menuAbierto = ''; switchTab('semantic')">
                <i data-lucide="orbit" style="width:14px;height:14px"></i>
                <span>Semántico<span class="menu-sub">Mapa de temas, canibalización y huecos de contenido</span></span></button>
              <button role="menuitem" @click="menuAbierto = ''; switchTab('enriquecido')">
                <i data-lucide="sparkles" style="width:14px;height:14px"></i>
                <span>Enriquecido <span class="text-dim" x-show="enriqRuns.length" x-text="'(' + enriqRuns.length + ')'"></span>
                  <span class="menu-sub">Ejecuciones del análisis con modelo: progreso, coste y resultados</span></span></button>
              <button role="menuitem" @click="menuAbierto = ''; switchTab('cleaning')">
                <i data-lucide="eraser" style="width:14px;height:14px"></i>
                <span>Limpieza<span class="menu-sub">Quitar texto de plantilla del contenido extraído</span></span></button>
            </div>
          </div>
        </div>

        <!-- ===== PESTANA: ENRIQUECIDO (#40) ===== -->
        <template x-if="detailTab === 'enriquecido'">
          <div>
            <div class="card" style="margin-bottom:1rem" x-show="!enriqRuns.length">
              <div class="text-dim" style="font-size:.85rem">
                Este rastreo no tiene ejecuciones de análisis enriquecido. Nada de esto se lanza solo:
                pulsa <strong>Análisis enriquecido</strong> en la barra de arriba para ver el coste estimado antes de decidir.
              </div>
            </div>
            <template x-if="enriqRuns.length">
              <div class="card" style="margin-bottom:1rem">
                <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
                  <span style="font-size:.85rem">Ejecución:</span>
                  <select @change="verEjecucion($el.value)" style="padding:.35rem .5rem;font-size:.85rem;max-width:34rem">
                    <template x-for="r in enriqRuns" :key="r.id">
                      <option :value="r.id" :selected="enriqRun && r.id === enriqRun.id"
                              x-text="fmt.date(r.created_at) + '  ·  ' + fmt.estadoEnriq(r.estado) + '  ·  ' + fmt.usd(r.gastado_usd)"></option>
                    </template>
                  </select>
                </div>
              </div>
