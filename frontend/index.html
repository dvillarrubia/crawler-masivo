                    <span x-text="(nsAbierto ? wp.namespaces : wp.namespaces.slice(0, 12)).join(', ')"></span>
                    <a href="#" x-show="wp.namespaces.length > 12" @click.prevent="nsAbierto = !nsAbierto" x-text="nsAbierto ? 'menos' : 'y ' + (wp.namespaces.length - 12) + ' más'"></a>
                  </div>
                </template>
                <!-- Inventario por la ruta de los CSS y JS (decisión 168), bajo demanda -->
                <div class="wp-assets" data-testid="wp-assets">
                  <template x-if="wpAssetsError"><div class="text-sm text-dim" x-text="'Inventario por los ficheros: ' + wpAssetsError"></div></template>
                  <template x-if="!wpAssets && !wpAssetsError"><div class="text-sm text-dim">Leyendo plugins y tema de los CSS y JS…</div></template>
                  <template x-if="wpAssets && (wpAssets.plugins.length || wpAssets.temas.length)">
                    <div>
                      <div class="text-sm text-dim" x-text="'Por los CSS y JS de ' + fmt.num(wpAssets.paginas_miradas) + ' páginas HTML (las primeras del rastreo). La versión es la del ?ver= del fichero: suele ser la del plugin, pero la pone quien lo carga.'"></div>
                      <div class="table-wrap"><table class="tbl wp-tabla">
                        <thead><tr><th>Tema o plugin</th><th>Páginas</th><th>Versión en ?ver=</th></tr></thead>
                        <tbody>
                          <template x-for="a in [...wpAssets.temas.map(t => ({...t, clase: 'tema'})), ...wpAssets.plugins.map(t => ({...t, clase: 'plugin'}))]" :key="a.clase + a.slug">
                            <tr>
                              <td><span x-text="a.slug"></span> <span class="text-dim" x-text="a.clase"></span></td>
                              <td x-text="fmt.num(a.paginas)"></td>
                              <td x-text="a.versiones.length ? a.versiones.slice(0, 3).map(v => v.version + (v.igual_que_wordpress ? ' (la de WordPress)' : '')).join(', ') : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </div>
                  </template>
                  <template x-if="wpAssets && !wpAssets.plugins.length && !wpAssets.temas.length">
                    <div class="text-sm text-dim" x-text="'Ningún CSS ni JS de /wp-content/plugins/ ni /wp-content/themes/ en ' + fmt.num(wpAssets.paginas_miradas) + ' páginas (o el sitio renombra la carpeta).'"></div>
                  </template>
                </div>
              </div>
            </template>

            <div class="card col-completa">
              <div class="card-header"><h2>Configuración</h2></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem;font-size:var(--fs-sm)">
                <!-- Las semillas pueden ser miles (un censo sembrado desde el
                     sitemap): pintadas enteras, la ficha de Lopesan medía
                     114.000 px. Se ven tres y el resto bajo demanda. -->
                <div class="col-completa">
                  <span class="text-dim">Semillas</span>
                  <span class="text-dim" x-text="'(' + fmt.num((job.seeds || []).length) + '):'"></span>
                  <span x-text="(job.seeds || []).slice(0, 3).join(', ')" class="break-all"></span>
                  <template x-if="(job.seeds || []).length > 3">
                    <details class="seeds-more">
                      <summary x-text="'y ' + fmt.num(job.seeds.length - 3) + ' más · ver todas'"></summary>
                      <div class="seeds-list">
                        <template x-for="s in job.seeds" :key="s"><div x-text="s"></div></template>
                      </div>
                    </details>
                  </template>
                </div>
                <div><span class="text-dim">Prof. máxima:</span> <span x-text="job.config?.max_depth"></span></div>
                <div><span class="text-dim">Máximo de URLs:</span> <span x-text="job.config?.max_urls ? fmt.num(job.config.max_urls) : 'sin tope'"></span></div>
                <div><span class="text-dim">Concurrencia:</span> <span x-text="job.config?.concurrent_requests"></span></div>
                <div><span class="text-dim">Por dominio:</span> <span x-text="job.config?.concurrent_requests_per_domain"></span></div>
                <div><span class="text-dim">Seguir externos:</span> <span x-text="job.config?.follow_external ? 'Sí' : 'No'"></span></div>
                <div><span class="text-dim">Robots.txt:</span> <span x-text="({respect:'Respetar',ignore:'Ignorar',audit:'Auditar (no bloquea)'})[job.config?.robots_mode] || 'Respetar'"></span></div>
                <div><span class="text-dim">Renderizar JS:</span> <span x-text="job.config?.render_js ? 'Sí' : 'No'"></span></div>
                <div><span class="text-dim">Huella TLS:</span> <span x-text="job.config?.impersonate || 'Chrome'"></span></div>
                <div class="col-completa"><span class="text-dim">User Agent:</span> <span class="text-sm break-all" x-text="job.config?.user_agent"></span></div>
                <div><span class="text-dim">Iniciado:</span> <span x-text="fmt.date(job.started_at)"></span></div>
                <div><span class="text-dim">Finalizado:</span> <span x-text="fmt.date(job.completed_at)"></span></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: PROBLEMAS =====
             Por defecto, una fila por TIPO (UX-04): 38.922 filas sueltas en
             779 paginas no se leen. Cada tipo dice que es, que decide Google y
             como se arregla (incidencias.js). La lista plana sigue ahi: al
             elegir un tipo, o con «Ver como lista». -->
        <template x-if="detailTab === 'issues' && !issueFilters.issue_type && issuesVista === 'tipos'">
          <div x-data="{ get dp() { return diffProblemas() } }">
            <div class="flex gap-1 mb-2 items-center flex-wrap">
              <template x-for="g in [['', 'Todas'], ['error', 'Errores'], ['warning', 'Avisos'], ['info', 'Info']]" :key="g[0]">
                <button class="btn btn-sm chip" :class="issueFilters.severity === g[0] && 'chip-on'"
                        @click="issueFilters.severity = g[0]">
                  <span x-text="g[1]"></span>
                  <!-- Tipos, no paginas: una pagina con tres problemas sumaria tres
                       veces y el total pasaria del numero de paginas del sitio. -->
                  <span class="text-dim" x-show="issuesResumen"
                        x-text="(n => n + (n === 1 ? ' tipo' : ' tipos'))(resumenIssues(g[0]).length)"></span>
                </button>
              </template>
              <!-- Segmento de negocio (decision 125): el % es sobre SUS URLs. -->
              <select class="exp-problema w-auto maxw-16rem" :class="issuesSegmento && 'has-value'" aria-label="Segmento"
                      @focus="!segmentosJob && cargarSegmentos()" @change="elegirSegmentoProblemas($event.target.value)">
                <option value="" :selected="!issuesSegmento" x-text="segmentosParaElegir().regla.length ? 'Todas las secciones' : 'Todas las rutas'"></option>
                <template x-if="segmentosParaElegir().regla.length">
                  <optgroup label="Secciones del negocio">
                    <template x-for="g in segmentosParaElegir().regla" :key="g.segmento">
                      <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                    </template>
                  </optgroup>
                </template>
                <optgroup label="Sin regla: forma de la ruta">
                  <template x-for="g in segmentosParaElegir().forma" :key="g.segmento">
                    <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                  </template>
                </optgroup>
              </select>
              <!-- Decision 136: prioridad = gravedad x importancia de las paginas
                   afectadas (PageRank, clics desde la home, sitemap). -->
              <div class="flex gap-1 items-center" role="group" aria-label="Orden">
                <span class="text-sm text-dim">Ordenar:</span>
                <button class="btn btn-sm chip" :class="issuesOrden === 'gravedad' && 'chip-on'"
                        @click="issuesOrden = 'gravedad'; loadIssuesResumen()">Gravedad</button>
                <button class="btn btn-sm chip" :class="issuesOrden === 'prioridad' && 'chip-on'"
                        data-tip="Gravedad × importancia de las páginas afectadas: su PageRank, a cuántos clics de la home están y si el sitemap las declara. Arriba, lo que hay que arreglar primero."
                        @click="issuesOrden = 'prioridad'; loadIssuesResumen()">Prioridad</button>
              </div>
              <button class="btn btn-sm ml-auto" @click="issuesVista = 'lista'; issues = []; loadIssues()">
                <i data-lucide="list" class="ico-13"></i> Ver todas como lista</button>
            </div>
            <!-- Secciones del negocio (decision 125) como primer nivel: solo si el
                 cliente las tiene; sin reglas, Problemas queda como estaba
                 (revision de UX del 25-oct, 2.10). -->
            <template x-if="seccionesNegocio()">
              <div class="secciones-negocio mb-2" data-testid="secciones-negocio">
                <div class="text-sm text-dim mb-1">Por sección del negocio</div>
                <div class="secciones-lista">
                  <button class="seccion" :class="!issuesSegmento && 'seccion-on'" @click="elegirSegmentoProblemas('')">
                    <strong>Todo el sitio</strong>
                  </button>
                  <template x-for="g in seccionesNegocio().secciones" :key="g.segmento">
                    <button class="seccion" :class="issuesSegmento === g.segmento && 'seccion-on'" @click="elegirSegmentoProblemas(g.segmento)"
                            :title="'Ver solo los problemas de ' + g.segmento">
                      <strong x-text="g.segmento"></strong>
                      <span class="text-dim" x-text="fmt.num(g.urls) + ' URLs'"></span>
                      <span class="seccion-cifras">
                        <span :class="g.paginas_con_error ? 'red' : 'text-dim'" x-text="fmt.num(g.paginas_con_error || 0) + ' con errores'"></span>
                        <span class="text-dim" x-text="fmt.num(g.paginas_con_aviso || 0) + ' con avisos'"></span>
                      </span>
                    </button>
                  </template>
                </div>
                <div class="text-sm text-dim mt-1" x-show="seccionesNegocio().sinSeccion"
                     x-text="fmt.num(seccionesNegocio().sinSeccion) + ' URLs no caen en ninguna sección: se pueden elegir por la forma de su ruta en el desplegable.'"></div>
              </div>
            </template>

            <!-- Cuanto ha cambiado cada tipo frente al censo con el que se comparo
                 al terminar (la misma referencia que el resto, 2.3), o por que
                 no se puede decir (decisiones 67, 70, 89, 91 y 191). -->
            <template x-if="dp && dp.ok === true">
              <div class="text-sm mb-2 diff-problemas" data-testid="diff-problemas">
                <span>Cambio en incidencias <strong x-text="dp.ref"></strong>
                  (<a :href="'#/rastreos/' + dp.jobAnterior + '/resumen'" x-text="dp.nombre"></a>):</span>
                <span class="cambio cambio-peor" x-text="'+' + fmt.num(dp.nuevas) + (dp.nuevas === 1 ? ' nueva' : ' nuevas')"></span>
                <span class="cambio cambio-mejor" x-text="'−' + fmt.num(dp.resueltas) + (dp.resueltas === 1 ? ' resuelta' : ' resueltas')"></span>
                <span class="text-dim" x-show="dp.sinPagina"
                      x-text="fmt.num(dp.sinPagina) + ' estaban en páginas que esta vez no se rastrearon: no se cuentan como resueltas.'"></span>
                <span class="text-dim" x-show="issuesSegmento"> · La diferencia es del sitio entero; con una sección elegida no se reparte.</span>
                <template x-for="a in dp.avisos" :key="a"><div class="text-dim fs-sm" x-text="a"></div></template>
              </div>
            </template>
            <template x-if="dp && dp.ok === false">
              <div class="text-sm mb-2 diff-problemas orange" data-testid="diff-problemas-no">
                <span>Diferencia <span x-text="dp.ref"></span>: <span x-text="dp.motivo"></span>.</span>
                <span class="text-dim">Las cifras de abajo son las de este censo.</span>
              </div>
            </template>

            <template x-if="!issuesResumen">
              <div class="loading-overlay"><div class="spinner"></div> Agrupando incidencias…</div>
            </template>
            <template x-if="issuesResumen && !resumenIssues(issueFilters.severity).length">
              <div class="empty"><h3>No hay incidencias de esta gravedad</h3></div>
            </template>
            <div class="issue-groups">
              <template x-for="r in resumenIssues(issueFilters.severity)" :key="r.issue_type + r.severity">
                <div class="issue-group" :class="'sev-' + r.severity">
                  <button class="issue-group-head" @click="grupoAbierto[r.issue_type] = !grupoAbierto[r.issue_type]"
                          :aria-expanded="!!grupoAbierto[r.issue_type]">
                    <span class="sev-chip" :class="'sev-' + r.severity" x-text="fmt.severity(r.severity)"></span>
                    <span class="issue-group-name">
                      <strong x-text="fmt.issue(r.issue_type)"></strong>
                      <span class="text-dim" x-text="(ISSUE_INFO[r.issue_type] || {}).que || ''"></span>
                    </span>
                    <span class="issue-group-count">
                      <!-- Una fila por tipo (decision 202): con varias gravedades, las
                           paginas distintas si la API las da y el desglose al lado. -->
                      <template x-if="cuentaDeTipo(r).n != null">
                        <span><strong x-text="fmt.num(cuentaDeTipo(r).n)"></strong> <span x-text="cuentaDeTipo(r).unidad"></span></span>
                      </template>
                      <span x-show="(r.partes || []).length > 1" data-testid="problema-desglose"
                            :class="cuentaDeTipo(r).n != null && 'text-dim'"
                            x-text="cuentaDeTipo(r).n != null ? '· ' + desgloseGravedad(r) : 'páginas: ' + desgloseGravedad(r)"></span>
                      <span class="text-dim" x-show="r.incidencias !== r.paginas && !cuentaDeTipo(r).propia" x-text="'· ' + fmt.n(r.incidencias, 'incidencia', 'incidencias')"></span>
                      <!-- Sin leer todos los sitemaps, «no incluida» no se afirma
                           tampoco en la fila (V13; revision de UX del 25-oct, 3.6). -->
                      <span class="orange" x-show="r.issue_type === 'not_in_sitemap' && dudaSitemaps(job)" :title="dudaSitemaps(job)"
                            data-testid="problema-no-concluyente">· no concluyente</span>
                      <span class="text-dim" x-show="r.pct_paginas != null" x-text="'· ' + fmt.num(r.pct_paginas) + ' % de ' + fmt.num(r.urls_denominador) + ' URLs del segmento'"></span>
                      <!-- Un tipo que solo tiene incidencias de un hallazgo para muchas
                           paginas no se puede repartir: sale con 0 y lo dice, no desaparece. -->
                      <span class="text-dim" x-show="issuesSegmento && r.agregadas" x-text="'· ' + fmt.num(r.agregadas) + ' sin repartir por segmento'"></span>
                      <span class="text-dim" x-show="issuesOrden === 'prioridad' && r.prioridad != null"
                            :title="'Equivale a ' + fmt.num(r.importancia) + ' páginas de máxima importancia'"
                            x-text="'· prioridad ' + fmt.num(Math.round(r.prioridad))"></span>
                      <template x-if="cambioDeTipo(r, dp)">
                        <span class="cambio" :class="cambioDeTipo(r, dp).clase" :title="cambioDeTipo(r, dp).title"
                              x-text="cambioDeTipo(r, dp).texto"></span>
                      </template>
                    </span>
                    <i data-lucide="chevron-down" class="issue-group-caret ico-14"></i>
                  </button>
                  <!-- Lo que ya contesto la IA sobre este problema (revision de
                       UX del 25-oct, 2.9), a la vista sin desplegar la fila. -->
                  <template x-if="lineaIAProblema(r)">
                    <div class="ia-linea issue-ia" data-testid="problema-ia">
                      <i data-lucide="sparkles" class="ico-12"></i>
                      <span x-text="(lineaIAProblema(r) || {}).texto"></span>
                      <a href="#" @click.prevent="(x => x && verResultadoIA(x.run.id, x.pregunta))(lineaIAProblema(r))">ver resultado</a>
                    </div>
                  </template>
                  <div class="issue-group-body" x-show="grupoAbierto[r.issue_type]">
                    <template x-if="ISSUE_INFO[r.issue_type]">
                      <dl class="issue-explica">
                        <dt>Qué decide Google</dt><dd x-text="ISSUE_INFO[r.issue_type].google"></dd>
                        <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[r.issue_type].arreglo"></dd>
                      </dl>
                    </template>
                    <template x-if="r.issue_type === 'not_in_sitemap' && dudaSitemaps(job)">
                      <div class="text-sm orange" x-text="dudaSitemaps(job)"></div>
                    </template>

                    <template x-if="!seccionesNegocio() && r.por_segmento && r.por_segmento.length && !issuesSegmento">

                          <template x-for="p in r.por_segmento" :key="p.segmento">

                              <button class="chip-tramo" @click="elegirSegmentoProblemas(p.segmento)" :title="'Ver solo ' + p.segmento">

                              </button>
                              <strong x-text="fmt.num(p.pct) + ' %'"></strong>
                              <span class="text-dim" x-text="fmt.num(p.paginas) + ' de ' + fmt.num(p.urls)"></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                    <template x-if="r.agregadas">
                      <div class="text-sm text-dim" style="margin:.25rem 0"

                    </template>
                    <!-- 2.11: las plantillas que fallan, con la URL inventada que se pidio.

                          <template x-for="(f, n) in resumenSoft404(job).responden200" :key="n">
                            <li class="text-sm">
                              <code x-text="nombreDePlantilla(f.plantilla)" :title="f.plantilla || ''"></code>
                              <span class="text-dim" x-text="'· se pidió '"></span><a :href="f.url" target="_blank" rel="noopener" x-text="f.url" :title="f.url"></a>
                              <span class="text-dim" x-show="f.alcance != null" x-text="'· ' + fmt.num(f.alcance) + (f.alcance === 1 ? ' página del censo la usa' : ' páginas del censo la usan')"></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                    <div class="text-sm text-dim mt-50 mb-25 mx-0" x-text="r.issue_type === 'soft_404_plantilla' ? 'Una página de ejemplo con esa plantilla' : 'Ejemplos'"></div>
                    <ul class="issue-ejemplos">
                      <template x-for="(e, n) in r.ejemplos" :key="n + '-' + e.url_id">
                        <li><a :href="'#/rastreos/' + job.id + '/url/' + e.url_id" x-text="e.url" :title="e.url"></a></li>

                    </ul>
                    <div class="flex gap-1 mt-1 flex-wrap" x-show="r.incidencias > 0">
                      <button class="btn btn-sm" @click="verTipoDeIncidencia(r.issue_type, (r.partes || []).length > 1 ? '' : r.severity)">
                        <span x-text="r.incidencias === 1 ? 'Ver la incidencia' : 'Ver las ' + fmt.num(r.incidencias) + ' incidencias'"></span>
                      </button>
                      <!-- Las paginas afectadas con todas sus columnas, filtrables y
                           exportables (docs/INVESTIGACION_EXPLORADOR.md). Sin la
                           cifra de paginas distintas, sin numero (decision 202). -->
                      <button class="btn btn-sm" @click="verProblemaEnExplorador(r.issue_type)" x-show="r.issue_type !== 'soft_404_plantilla' && (r.paginas > 0 || (r.paginas == null && (r.partes || []).length > 1))">
                        <i data-lucide="table-2" class="ico-13"></i>
                        <span x-text="r.paginas == null ? 'Ver las páginas en URLs' : r.paginas === 1 ? 'Ver la página en URLs' : 'Ver las ' + fmt.num(r.paginas) + ' páginas en URLs'"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
            <template x-if="issuesResumen && resueltosDelTodo(dp).length">
              <div class="text-sm mt-2 resueltos-del-todo" data-testid="resueltos-del-todo">
                <span class="text-dim" x-text="'Ya no aparecen ' + dp.ref + ':'"></span>
                <template x-for="d in resueltosDelTodo(dp)" :key="d.tipo">
                  <span class="cambio cambio-mejor" :title="fmt.num(d.resueltas) + (d.resueltas === 1 ? ' incidencia resuelta' : ' incidencias resueltas')"
                        x-text="fmt.issue(d.tipo) + ' −' + fmt.num(d.resueltas)"></span>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template x-if="detailTab === 'issues' && (issueFilters.issue_type || issuesVista === 'lista')">
          <div>
            <div class="flex gap-1 mb-2 items-center flex-wrap">
              <button class="btn btn-sm" @click="volverAGrupos()">
                <i data-lucide="arrow-left" class="ico-13"></i> Todos los tipos</button>
              <select x-model="issueFilters.severity" @change="applyIssueFilters()" class="w-auto py-35 px-50 fs-sm">
                <option value="">Todas las gravedades</option>
                <option value="error">Error</option>
                <option value="warning">Aviso</option>
                <option value="info">Info</option>
              </select>
              <select x-model="issueFilters.issue_type" @change="applyIssueFilters()" class="w-auto py-35 px-50 fs-sm">
                <option value="">Todos los tipos</option>
                <template x-for="t in issueTypes" :key="t">
                  <option :value="t" :selected="t === issueFilters.issue_type" x-text="fmt.issue(t)"></option>
                </template>
              </select>
              <template x-if="issuesSegmento">
                <!-- Solo las de paginas del segmento: las de un hallazgo para muchas
                     paginas no se reparten (decision 125). -->
                <button class="btn btn-sm" @click="elegirSegmentoProblemas('')" :title="'Quitar el segmento ' + issuesSegmento">
                  <i data-lucide="x" class="ico-12"></i>
                  Segmento: <span class="truncate maxw-16rem" x-text="issuesSegmento"></span>
                </button>
              </template>
              <span class="text-dim text-sm ml-auto" x-text="loading ? 'Cargando…' : fmt.n(issuesTotal, 'incidencia', 'incidencias')"></span>
            </div>
            <template x-if="issueFilters.issue_type && ISSUE_INFO[issueFilters.issue_type]">
              <div class="card mb-2 issue-explica-card">
                <div><strong x-text="fmt.issue(issueFilters.issue_type)"></strong> ·
                  <span x-text="ISSUE_INFO[issueFilters.issue_type].que"></span></div>
                <div class="text-sm"><span class="text-dim">Qué decide Google:</span> <span x-text="ISSUE_INFO[issueFilters.issue_type].google"></span></div>
                <div class="text-sm"><span class="text-dim">Cómo se arregla:</span> <span x-text="ISSUE_INFO[issueFilters.issue_type].arreglo"></span></div>
                <!-- Sin leer todos los sitemaps, «no incluida» no se afirma
                     (revision de UX del 25-oct, 3.6; V13). Solo presentacion. -->
                <div class="text-sm orange" x-show="issueFilters.issue_type === 'not_in_sitemap' && dudaSitemaps(job)" x-text="dudaSitemaps(job)" data-testid="problemas-duda-sitemap"></div>
              </div>
            </template>

            <template x-if="loading">
              <div class="loading-overlay"><div class="spinner"></div> Cargando...</div>
            </template>

            <template x-if="!loading && issues.length === 0">
              <div class="empty"><h3>No se encontraron problemas</h3></div>
            </template>

            <template x-if="issues.length > 0">
              <div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Gravedad</th>
                        <th>Tipo</th>
                        <th>URL</th>
                        <th>Detalles</th>
                        <th>Detectado</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="i in issues" :key="i.id">
                        <tr>
                          <td>
                            <span :class="'severity-' + i.severity" style="font-weight:500;text-transform:uppercase;font-size:var(--fs-sm)"
                              x-text="fmt.severity(i.severity)"></span>
                          </td>
                          <td class="nowrap" x-text="fmt.issue(i.issue_type)"></td>
                          <td class="maxw-350px" :title="i.url || ''">
                            <a class="truncate bloque" :href="'#/rastreos/' + job.id + '/url/' + i.url_id" x-text="i.url || '—'"></a>
                          </td>
                          <td class="maxw-420px">
                            <div class="truncate text-sm" :title="fmt.detalles(i.details) || ''"
                              x-text="fmt.detalles(i.details) || '—'"></div>
                          </td>
                          <td class="text-dim nowrap" x-text="fmt.ago(i.detected_at)" :title="fmt.date(i.detected_at)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="pagination">
                  <span>Página <strong x-text="issuesPage"></strong> de <strong x-text="issuesPages"></strong></span>
                  <div class="pagination-buttons">
                    <button class="btn btn-sm" :disabled="issuesPage <= 1" @click="setIssuesPage(issuesPage - 1)">&laquo;</button>
                    <button class="btn btn-sm" :disabled="issuesPage >= issuesPages" @click="setIssuesPage(issuesPage + 1)">&raquo;</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: ENLACES =====
             Revision de UX del 25-oct, 2.8 (decision 195): filtros en el
             servidor, vista por destino y los destinos rotos primero. Con una
             API anterior (linksFiltra === false) queda la lista de siempre y un
             aviso que dice por que no hay filtros. -->
        <template x-if="detailTab === 'links'">
          <div class="enlaces" data-testid="enlaces">
            <template x-if="linksFiltra === false">
              <div class="card aviso-enlaces mb-2" data-testid="enlaces-api-anterior">
                Este servidor todavía no sabe filtrar los enlaces: se muestra la lista completa, agrupada por destino.
                Los filtros, la vista por destino y el estado de cada destino llegan con la próxima versión.
              </div>
            </template>

            <template x-if="linksFiltra !== false">
              <div>
                <div class="enlaces-cabecera">
                  <div class="flex gap-1" role="group" aria-label="Vista">
                    <button type="button" class="btn btn-sm chip" :class="linksVista === 'destinos' && 'chip-on'"
                            @click="cambiarVistaEnlaces('destinos')" data-testid="enlaces-vista-destinos">Por destino</button>
                    <button type="button" class="btn btn-sm chip" :class="linksVista === 'enlaces' && 'chip-on'"
                            @click="cambiarVistaEnlaces('enlaces')" data-testid="enlaces-vista-enlaces">Todos los enlaces</button>
                  </div>
                  <!-- Mientras carga no hay cifra: «0 enlaces» se lee como que no hay ninguno. -->
                  <span class="text-dim text-sm" data-testid="enlaces-total"
                        x-text="linksCargando && !links.length ? 'Contando…'
                          : linksVista === 'destinos'
                            ? fmt.num(linksTotal) + (linksTotal === 1 ? ' destino' : ' destinos') + (linksHayFiltros() ? ' con estos filtros' : '') + ' · los rotos primero'
                            : fmt.num(linksTotal) + (linksTotal === 1 ? ' enlace' : ' enlaces') + (linksHayFiltros() ? ' con estos filtros' : '') + (linksOrden === 'destino' ? ' · por destino' : ' · los de destino roto primero')"></span>
                </div>

                <template x-if="linksVista === 'enlaces' && linksFiltros.destino_hash">
                  <div class="enlaces-hacia" data-testid="enlaces-hacia">
                    <span>Páginas que enlazan a</span>
                    <strong class="truncate" :title="linksDestinoUrl" x-text="linksDestinoUrl || 'este destino'"></strong>
                    <button type="button" class="btn btn-sm" @click="cambiarVistaEnlaces('destinos')">Volver a los destinos</button>
                  </div>
                </template>

                <div class="enlaces-filtros" data-testid="enlaces-filtros">
                  <label class="ef ef-destino">
                    <span>Destino</span>
                    <div class="ef-par">
                      <select aria-label="Cómo se busca el destino" :disabled="!!linksFiltros.destino_hash"
                              @change="linksFiltros.exacto = $event.target.value === '1'; linksFiltros.destino && aplicarFiltroEnlaces()">
                        <option value="0" :selected="!linksFiltros.exacto">contiene</option>
                        <option value="1" :selected="linksFiltros.exacto">es exactamente</option>
                      </select>
                      <input type="text" :placeholder="linksFiltros.exacto ? 'https://…' : '/es/hoteles/'" x-model="linksFiltros.destino"
                             :disabled="!!linksFiltros.destino_hash" @input="aplicarFiltroEnlaces(null, null, { esperar: true })">
                    </div>
                  </label>
                  <label class="ef">
                    <span>Página que enlaza</span>
                    <input type="text" placeholder="contiene… /blog/" x-model="linksFiltros.origen"
                           @input="aplicarFiltroEnlaces(null, null, { esperar: true })">
                  </label>
                  <label class="ef">
                    <span>Texto del enlace</span>
                    <input type="text" placeholder="contiene… «leer más»" x-model="linksFiltros.ancla"
                           @input="aplicarFiltroEnlaces(null, null, { esperar: true })">
                  </label>
                  <label class="ef ef-corto">
                    <span>Tipo</span>
                    <select @change="aplicarFiltroEnlaces('tipo', $event.target.value)">
                      <option value="" :selected="!linksFiltros.tipo">Todos</option>
                      <option value="interno" :selected="linksFiltros.tipo === 'interno'">Internos</option>
                      <option value="externo" :selected="linksFiltros.tipo === 'externo'">Externos</option>
                    </select>
                  </label>
                  <label class="ef ef-corto">
                    <span>Follow</span>
                    <select @change="aplicarFiltroEnlaces('follow', $event.target.value)">
                      <option value="" :selected="!linksFiltros.follow">Todos</option>
                      <option value="si" :selected="linksFiltros.follow === 'si'">Follow</option>
                      <option value="no" :selected="linksFiltros.follow === 'no'">Nofollow</option>
                    </select>
                  </label>
                  <label class="ef ef-corto">
                    <span>Posición</span>
                    <select @change="aplicarFiltroEnlaces('posicion', $event.target.value)">
                      <option value="" :selected="!linksFiltros.posicion">Todas</option>
                      <template x-for="p in ['nav', 'header', 'content', 'sidebar', 'footer']" :key="p">
                        <option :value="p" :selected="linksFiltros.posicion === p" x-text="POSITION_LABEL[p]"></option>
                      </template>
                      <option value="sin" :selected="linksFiltros.posicion === 'sin'">Sin posición</option>
                    </select>
                  </label>
                  <label class="ef ef-codigo">
                    <span>Código</span>
                    <input type="text" inputmode="numeric" maxlength="3" placeholder="404" x-model="linksFiltros.codigo"
                           @input="linksFiltros.codigo = linksFiltros.codigo.replace(/\D/g, ''); aplicarFiltroEnlaces(null, null, { esperar: true })">
                  </label>
                </div>

                <div class="enlaces-estados" role="group" aria-label="Estado del destino" data-testid="enlaces-estados">
                  <span class="text-sm text-dim">Estado del destino:</span>
                  <button type="button" class="btn btn-sm chip" :class="!linksFiltros.estado && 'chip-on'"
                          @click="aplicarFiltroEnlaces('estado', '')">
                    <span>Todos</span>
                    <span class="text-dim" x-show="cuentaEstadoEnlaces('') != null" x-text="fmt.num(cuentaEstadoEnlaces(''))"></span>
                  </button>
                  <template x-for="g in ESTADOS_DESTINO" :key="g">
                    <button type="button" class="btn btn-sm chip" :class="(linksFiltros.estado === g ? 'chip-on ' : '') + 'chip-estado-' + g"
                            :data-tip="estadoDestino(g).tip" @click="aplicarFiltroEnlaces('estado', linksFiltros.estado === g ? '' : g)">
                      <span x-text="estadoDestino(g).texto"></span>
                      <span class="text-dim" x-show="cuentaEstadoEnlaces(g) != null" x-text="fmt.num(cuentaEstadoEnlaces(g))"></span>
                    </button>
                  </template>
                  <button type="button" class="btn btn-sm enlaces-quitar" x-show="linksHayFiltros()" @click="quitarFiltrosEnlaces()">
                    <i data-lucide="x" class="ico-13"></i> Quitar filtros</button>
                </div>
              </div>
            </template>

            <template x-if="linksError">
              <div class="card aviso-enlaces aviso-enlaces-error mb-2" data-testid="enlaces-error">
                <span x-text="linksError"></span>
                <button type="button" class="btn btn-sm" @click="loadLinks()">Reintentar</button>
              </div>
            </template>

            <template x-if="linksCargando && links.length === 0 && !linksError">
              <div class="loading-overlay"><div class="spinner"></div> Cargando enlaces…</div>
            </template>

            <template x-if="!linksCargando && !linksError && links.length === 0 && linksFiltra !== null">
              <div class="empty" data-testid="enlaces-vacio">
                <h3 x-text="linksHayFiltros() || linksFiltros.estado ? 'Ningún enlace cumple estos filtros' : 'Este censo no tiene enlaces guardados'"></h3>
                <p class="text-sm" x-show="linksHayFiltros()">Prueba con menos filtros o con otro estado del destino.</p>
                <button type="button" class="btn btn-sm" x-show="linksHayFiltros()" @click="quitarFiltrosEnlaces()">Quitar filtros</button>
              </div>
            </template>

            <!-- Por destino: cuantas paginas lo enlazan, con que anclas, y su estado. -->
            <template x-if="links.length > 0 && linksVista === 'destinos' && linksFiltra !== false">
              <div :class="linksCargando && 'enlaces-recargando'">
                <div class="table-wrap">
                  <table class="tabla-tarjetas tabla-destinos" data-testid="enlaces-tabla-destinos">
                    <thead>
                      <tr>
                        <th>Destino</th>
                        <th>Estado</th>
                        <th data-tip="Páginas distintas del censo que lo enlazan">Páginas</th>
                        <th data-tip="Veces que aparece el enlace, contando cada repetición en la misma página (el menú de escritorio y el de móvil son dos)">Apariciones</th>
                        <th>Anclas más usadas</th>
                        <th><span class="sr-only">Acciones</span></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="d in links" :key="d.to_url_hash">
                        <tr>
                          <td class="td-url" data-label="Destino" :title="d.to_url">
                            <div class="truncate">
                              <template x-if="d.url_id">
                                <a :href="'#/rastreos/' + job.id + '/url/' + d.url_id" x-text="d.to_url"></a>
                              </template>
                              <template x-if="!d.url_id">
                                <span x-text="d.to_url"></span>
                              </template>
                            </div>
                            <span class="text-dim text-xs" x-text="(d.is_internal ? 'Interno' : 'Externo') + (d.nofollow ? ' · ' + fmt.num(d.nofollow) + ' nofollow' : '')"></span>
                          </td>
                          <td data-label="Estado"><span class="badge" :class="estadoDestino(d.estado_destino).clase" :data-tip="tipEstadoDestino(d)" x-text="textoEstadoDestino(d)"></span></td>
                          <td class="num" data-label="Páginas" x-text="fmt.num(d.paginas)"></td>
                          <td class="num" data-label="Apariciones" x-text="fmt.num(d.apariciones)"></td>
                          <td class="td-anclas" data-label="Anclas" :title="textoAnclas(d)"><div class="truncate" x-text="textoAnclas(d)"></div></td>
                          <td class="td-accion"><button type="button" class="btn btn-sm" @click="quienEnlaza(d)">Quién la enlaza</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Enlace a enlace. -->
            <template x-if="links.length > 0 && (linksVista === 'enlaces' || linksFiltra === false)">

                      <tr>
                        <th>Página que enlaza</th>
                        <th>Destino</th>
                        <template x-if="linksFiltra !== false"><th>Estado del destino</th></template>
                        <th>Texto del enlace</th>
                        <th>Posición</th>
                        <th>Tipo</th>
                        <th>Follow</th>
                        <th data-tip="Cuántas veces aparece este mismo enlace (mismo destino, texto y posición) en la página de origen: el menú de escritorio y el de móvil son dos apariciones">Veces</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="l in links" :key="l.id">
                        <tr>
                          <td class="td-url" data-label="Página" :title="l.from_url || ''">
                            <div class="truncate">
                              <a x-show="l.from_url_id" :href="'#/rastreos/' + job.id + '/url/' + l.from_url_id" x-text="l.from_url || '—'"></a>
                            </div>
                          </td>
                          <td class="td-url" data-label="Destino" :title="l.to_url"><div class="truncate" x-text="l.to_url"></div></td>
                          <template x-if="linksFiltra !== false">
                            <td data-label="Estado"><span class="badge" :class="estadoDestino(l.estado_destino).clase" :data-tip="tipEstadoDestino(l)" x-text="textoEstadoDestino(l)"></span></td>
                          </template>
                          <td data-label="Texto" :title="l.anchor_text || l.alt_text || ''">
                            <div class="truncate" x-text="l.anchor_text || (l.alt_text ? 'Imagen: ' + l.alt_text : '—')"></div>
                          </td>
                          <td data-label="Posición" x-text="fmt.position(l.link_position)"></td>
                          <td data-label="Tipo" x-text="l.is_internal ? 'Interno' : 'Externo'"></td>
                          <td data-label="Follow" :class="l.follow === false ? 'severity-warning' : ''" x-text="l.follow ? 'Sí' : l.follow === false ? 'No' : '—'"></td>
                          <td class="num" data-label="Veces" x-text="l.repeticiones || 1"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <template x-if="links.length > 0">
              <div class="pagination">
                <span>Página <strong x-text="fmt.num(linksPage)"></strong> de <strong x-text="fmt.num(linksPages)"></strong></span>
                <div class="pagination-buttons">
                  <button class="btn btn-sm" :disabled="linksPage <= 1 || linksCargando" @click="setLinksPage(linksPage - 1)" aria-label="Página anterior">&laquo;</button>
                  <button class="btn btn-sm" :disabled="linksPage >= linksPages || linksCargando" @click="setLinksPage(linksPage + 1)" aria-label="Página siguiente">&raquo;</button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: SEMANTICO ===== -->
        <template x-if="detailTab === 'semantic'">
          <div>
            <!-- Header: metricas globales -->
            <template x-if="semanticResults && semanticResults.site_metrics">
              <div style="display:flex;align-items:center;gap:1.5rem;padding:.75rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap">
                <span class="text-sm" data-tip="Coherencia temática del sitio (0-100). Cuanto más alto, más enfocado está el contenido en un mismo tema. Sitios nicho suelen tener >70, sitios genéricos <40."><strong>Focus:</strong> <span x-text="fmt.pctDe(semanticResults.site_metrics.focus_score)"></span></span>
                <span class="text-sm" data-tip="Distancia máxima de cualquier página al centro semántico. Indica cuánto se dispersa el contenido. Valores altos = contenido muy variado."><strong>Radius:</strong> <span x-text="fmt.num(semanticResults.site_metrics.semantic_radius)"></span></span>
                <span class="text-sm" data-tip="Impacto de las páginas con más autoridad que están lejos del centro. Si una página importante (alto PageRank/clics) está lejos del tema principal, arrastra el centro semántico del sitio."><strong>Drift:</strong> <span x-text="fmt.num(semanticResults.site_metrics.drift_score)"></span></span>
                <span class="text-sm" data-tip="Total de páginas indexables con contenido suficiente (min 150 palabras) incluidas en el análisis."><strong>Páginas:</strong> <span x-text="fmt.num(semanticResults.site_metrics.total_pages)"></span></span>
                <span class="text-sm" data-tip="Grupos temáticos detectados automáticamente (HDBSCAN). Cada cluster agrupa páginas con contenido semánticamente similar."><strong>Clusters:</strong> <span x-text="semanticResults.site_metrics.n_clusters"></span></span>
                <span class="text-sm" data-tip="Pares de páginas con contenido tan similar que compiten entre sí en buscadores. Cuantos más pares, más canibalización tiene el sitio."><strong>Canibalización:</strong> <span x-text="semanticResults.site_metrics.n_cannibal_pairs"></span> pares</span>
                <button class="btn btn-sm ml-auto flex items-center gap-30" @click="exportSemanticCsv()">
                  <i data-lucide="download" class="ico-13"></i> Export CSV
                </button>
              </div>
            </template>

            <!-- GSC Summary -->
            <template x-if="semanticResults && semanticResults.gsc_summary">
              <div style="display:flex;align-items:center;gap:1.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap;border-left:3px solid var(--blue)">
                <span class="text-sm fw-600 c-blue flex items-center gap-30">
                  <i data-lucide="bar-chart-3" class="ico-14"></i> GSC
                </span>
                <span class="text-sm" data-tip="Total de clics orgánicos de Google Search Console para las URLs del análisis."><strong>Clicks:</strong> <span x-text="fmt.num(semanticResults.gsc_summary.total_clicks)"></span></span>
                <span class="text-sm" data-tip="Total de impresiones en resultados de Google para las URLs del análisis."><strong>Impressions:</strong> <span x-text="fmt.num(semanticResults.gsc_summary.total_impressions)"></span></span>
                <span class="text-sm" data-tip="CTR medio (Click-Through Rate). Porcentaje de impresiones que generan click."><strong>CTR medio:</strong> <span x-text="fmt.pctDe(semanticResults.gsc_summary.avg_ctr, 2)"></span></span>
                <span class="text-sm" data-tip="Posición media en los resultados de Google. Menor = mejor posicionamiento."><strong>Pos. media:</strong> <span x-text="fmt.num(semanticResults.gsc_summary.avg_position)"></span></span>
                <span class="text-sm text-dim" data-tip="Número de URLs del análisis que tienen datos en GSC."><span x-text="semanticResults.gsc_summary.urls_with_data"></span> URLs con datos</span>
              </div>
            </template>

            <!-- Ring summary cards -->
            <template x-if="semanticResults && semanticResults.site_metrics && semanticResults.site_metrics.ring_counts">
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem">
                <template x-for="ring in ['Core','Focus','Expansion','Peripheral']" :key="ring">
                  <div class="card" style="padding:.75rem 1rem;border-left:3px solid"
                       :style="'border-left-color:' + ({Core:'var(--green)',Focus:'var(--blue)',Expansion:'var(--orange)',Peripheral:'var(--red)'})[ring]"
                       :data-tip="({Core:'Páginas más cercanas al centro semántico (Q1). Son el núcleo temático del sitio: el contenido que mejor define de qué trata.',Focus:'Páginas cercanas al centro (Q1-Q2). Refuerzan el tema principal con contenido relevante y complementario.',Expansion:'Páginas a distancia media (Q2-Q3). Cubren temas relacionados pero no centrales. Oportunidad de reforzar o redirigir.',Peripheral:'Páginas más alejadas del centro (>Q3). Contenido tangencial o fuera de tema. Candidatas a revisar, consolidar o eliminar.'})[ring]">
                    <div class="fs-sm fw-600" :style="'color:' + ({Core:'var(--green)',Focus:'var(--blue)',Expansion:'var(--orange)',Peripheral:'var(--red)'})[ring]" x-text="ring"></div>
                    <div class="fs-lg fw-700" :style="'color:' + ({Core:'var(--green)',Focus:'var(--blue)',Expansion:'var(--orange)',Peripheral:'var(--red)'})[ring]"
                         x-text="semanticResults.site_metrics.ring_counts[ring] || 0"></div>
                    <div class="text-dim text-sm" x-text="fmt.pct((semanticResults.site_metrics.ring_counts[ring] || 0) / semanticResults.total_pages * 100)"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Panel: GSC + Parametros + Analisis -->
            <template x-if="!semanticResults">
              <div class="card p-150">
                <h3 class="mb-100 flex items-center gap-40">
                  <i data-lucide="brain" class="ico-18"></i> Análisis semántico
                </h3>
                <!-- Que da, antes de pedir nada (UX-18): antes se abria con una
                     cuenta de GSC, una clave y tres deslizadores. -->
                <div class="semantico-intro">
                  <p>Convierte el contenido de cada página indexable en un vector (embeddings de Gemini) y contesta:</p>
                  <ul>
                    <li><strong>De qué va el sitio</strong>: cuánto se concentra en su tema y qué páginas se alejan de él.</li>
                    <li><strong>Canibalización</strong>: parejas de páginas tan parecidas que compiten entre sí.</li>
                    <li><strong>Huecos</strong>: qué página tuya cubre mejor un tema concreto, o si no hay ninguna.</li>
                  </ul>
                  <p class="text-dim text-sm">Necesita una API key de Gemini (los embeddings cuestan céntimos por miles de páginas). Search Console es opcional: si se añade, las páginas con más clics pesan más.</p>
                </div>

                <!-- GSC Section -->
                <div style="margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)">
                  <h4 class="mb-50 fs-sm flex items-center gap-30" data-tip="Conecta GSC para incluir clicks reales de Google en el cálculo de autoridad. Sin GSC, solo se usa PageRank interno. Con GSC, las páginas con más tráfico orgánico influyen más en el centro semántico.">
                    <i data-lucide="bar-chart-3" class="ico-14"></i> Google Search Console (opcional)
                  </h4>
                  <!-- El Search Console del cliente (decision 141) es otro sistema: el
                       Resumen y URLs lo usan, este analisis todavia no (lee las cuentas
                       de antes, `/semantic/gsc-accounts`). Salia «Sin GSC» y «Subir
                       cuenta» con Lopesan sincronizado, y «Subir cuenta» llamaba a una
                       ruta cerrada (410). Se dice lo que hay (revision del 27-oct, V31). -->
                  <p class="text-sm mb-50" data-testid="semantico-gsc-cliente"
                     x-text="job.gsc_resumen ? 'Este cliente tiene Search Console sincronizado (lo usan el Resumen y URLs), pero el análisis semántico todavía no lo lee: sin una cuenta de las de abajo, solo pesa el PageRank.' : 'Search Console se conecta en la ficha del cliente → Configuración → Search Console. El análisis semántico todavía no usa esa conexión: sin una cuenta de las de abajo, solo pesa el PageRank.'"></p>
                  <template x-if="job.cliente_id">
                    <a class="text-sm" :href="'#/clientes/' + job.cliente_id + '/configuracion'">Ver Search Console del cliente</a>
                  </template>
                  <template x-if="!gscAccounts.length">
                    <p class="text-sm text-dim mt-50">No hay cuentas de Search Console de las de antes guardadas.</p>
                  </template>
                  <div class="flex gap-50 items-end flex-wrap mt-50" x-show="gscAccounts.length">
                    <div>
                      <label class="text-dim text-sm">Cuenta GSC</label>
                      <select class="campo-simple-bloque"
                              x-model="semanticGscAccountId" @change="semanticGscProps = []; semanticGscProp = ''">
                        <option value="">Sin GSC</option>
                        <template x-for="acc in gscAccounts" :key="acc.id">
                          <option :value="acc.id" x-text="acc.name"></option>
                        </template>
                      </select>
                    </div>
                    <template x-if="semanticGscAccountId">
                      <button class="btn btn-sm flex items-center gap-25" @click="loadGscProperties()" :disabled="gscPropsLoading">
                        <template x-if="gscPropsLoading"><span class="spinner ico-12"></span></template>
                        Cargar propiedades
                      </button>
                    </template>
                    <template x-if="semanticGscProps.length > 0">
                      <div>
                        <select style="padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:var(--fs-sm)"
                                x-model="semanticGscProp">
                          <option value="">Seleccionar propiedad</option>
                          <template x-for="prop in semanticGscProps" :key="prop">
                            <option :value="prop" x-text="prop"></option>
                          </template>
                        </select>
                      </div>
                    </template>
                    <template x-if="semanticGscProp">
                      <div>
                        <label class="text-dim text-sm">Rango</label>
                        <select class="campo-simple-bloque"
                                x-model="semanticGscDays">
                          <option value="90">90 días</option>
                          <option value="180">6 meses</option>
                          <option value="365">12 meses</option>
                          <option value="480">16 meses (max)</option>
                        </select>
                      </div>
                    </template>
                    <template x-if="semanticGscProp">
                      <button class="btn btn-sm btn-primary flex items-center gap-25" @click="fetchGscData()" :disabled="gscFetchLoading">
                        <template x-if="gscFetchLoading"><span class="spinner ico-12"></span></template>
                        Obtener datos GSC
                      </button>
                    </template>
                  </div>
                  <template x-if="gscFetchResult">
                    <p class="text-sm mt-50 c-green" x-text="'Search Console: ' + fmt.num(gscFetchResult.matched) + ' URLs emparejadas de ' + fmt.num(gscFetchResult.total_gsc_rows) + ' filas' + (gscFetchResult.query_rows ? ' · ' + fmt.num(gscFetchResult.query_rows) + ' filas de búsqueda por página' : '')"></p>
                  </template>
                </div>

                <!-- Gemini API key (cada cliente paga su consumo de embeddings) -->
                <div class="mb-125" data-tip="El análisis genera embeddings vía la API de Gemini. Cada cliente usa su propia API key para que el coste se facture en su cuenta de Google AI. La key se guarda solo aquí y nunca se devuelve completa al frontend.">
                  <h4 class="mb-50 fs-sm">API key de Gemini</h4>
                  <div class="flex gap-50 items-center flex-wrap">
                    <select x-model="semanticGeminiAccountId" class="flex-1 minw-200px">
                      <option value="">— Selecciona una API key —</option>
                      <template x-for="acc in geminiAccounts" :key="acc.id">
                        <option :value="acc.id" x-text="acc.name + ' (' + acc.api_key_preview + ')'"></option>
                      </template>
                    </select>
                    <button class="btn btn-sm" @click="showGeminiModal = true; geminiFormError = null">+ Nueva</button>
                    <template x-if="semanticGeminiAccountId">
                      <button class="btn btn-sm btn-danger" @click="deleteGeminiAccount(semanticGeminiAccountId)">Eliminar</button>
                    </template>
                  </div>
                  <template x-if="geminiAccounts.length === 0">
                    <p class="text-sm text-dim mt-50">No hay claves de API guardadas. Añade una para poder lanzar el análisis.</p>
                  </template>
                </div>

                <!-- Modal: nueva API key Gemini -->
                <template x-if="showGeminiModal">
                  <div class="modal-backdrop" @click.self="showGeminiModal = false" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000">
                    <div class="card" style="max-width:480px;width:90%;padding:1.5rem">
                      <h3 class="mb-100">Nueva API key de Gemini</h3>
                      <div class="mb-75">
                        <label class="text-dim text-sm">Nombre identificativo</label>
                        <input type="text" x-model="geminiFormName" placeholder="Cliente X" class="w-full">
                      </div>
                      <div class="mb-75">
                        <label class="text-dim text-sm">API key</label>
                        <input type="password" x-model="geminiFormKey" placeholder="AIza..." class="w-full" autocomplete="off">
                        <p class="text-sm text-dim mt-25">Obtenla en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
                      </div>
                      <template x-if="geminiFormError">
                        <p class="text-sm c-red mb-50" x-text="geminiFormError"></p>
                      </template>
                      <div class="flex gap-50 justify-end">
                        <button class="btn btn-sm" @click="showGeminiModal = false">Cancelar</button>
                        <button class="btn btn-sm btn-primary" @click="saveGeminiAccount()">Guardar</button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Parametros: plegados, los valores por defecto sirven casi siempre -->
                <details class="config-avanzada mb-125">
                  <summary><span>Parámetros</span>
                    <span class="text-dim text-sm" x-text="'PageRank ' + fmt.dec(semanticAlpha, 2) + ' · clics ' + fmt.dec(semanticBeta, 2) + ' · canibalización desde ' + fmt.dec(semanticThreshold, 2)"></span></summary>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem">
                    <div data-tip="Peso del PageRank interno en el cálculo de autoridad. Con 1 solo cuenta el PageRank. Si hay datos de Search Console, bájalo para dar peso a los clics reales.">
                      <label class="text-dim text-sm">Peso del PageRank: <span x-text="fmt.dec(semanticAlpha, 2)"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticAlpha" class="w-full">
                    </div>
                    <div data-tip="Peso de los clics de Search Console. Solo cuenta si el censo tiene sus datos. Con 0,4, las páginas con más tráfico orgánico pesan más en el centro semántico.">
                      <label class="text-dim text-sm">Peso de los clics de Google: <span x-text="fmt.dec(semanticBeta, 2)"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticBeta" class="w-full">
                    </div>
                    <div data-tip="Similitud coseno mínima para considerar dos páginas como canibalización. 0,92 = conservador (solo pares muy similares). Baja a 0,85 para detectar más pares, sube a 0,95 para solo los más críticos.">
                      <label class="text-dim text-sm">Umbral de canibalización: <span x-text="fmt.dec(semanticThreshold, 2)"></span></label>
                      <input type="range" min="0.8" max="0.99" step="0.01" x-model.number="semanticThreshold" class="w-full">
                    </div>
                  </div>
                </details>

                <!-- Boton Analizar -->
                <!-- Sin clave de Gemini no se puede lanzar: desactivado y con el
                     motivo al lado (revision de UX del 25-oct, 1.15; V31). -->
                <div class="flex items-center gap-75 flex-wrap">
                  <button class="btn btn-primary flex items-center gap-40 fs-base py-60 px-150" @click="runSemanticAnalysis()"
                          :disabled="semanticLoading || !semanticGeminiAccountId" data-testid="semantico-analizar">
                    <template x-if="semanticLoading"><span class="spinner ico-16"></span></template>
                    <i data-lucide="brain" class="ico-16" x-show="!semanticLoading"></i>
                    Analizar
                  </button>
                  <span class="text-sm text-dim" x-show="!semanticGeminiAccountId" data-testid="semantico-sin-clave"
                        x-text="geminiAccounts.length ? 'Elige una clave de Gemini para poder analizar.' : 'Hace falta una clave de Gemini: añádela con «+ Nueva».'"></span>
                </div>
              </div>
            </template>

            <!-- Progress bar -->
            <template x-if="semanticLoading && semanticProgress">
              <div class="card p-100 mb-100">
                <div class="flex items-center gap-75 mb-50">
                  <span class="spinner ico-16"></span>
                  <span class="text-sm" x-text="semanticStageLabel(semanticProgress.stage)"></span>
                  <span class="text-sm text-dim ml-auto" x-text="fmt.num(semanticProgress.progress) + ' %'"></span>
                </div>
                <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;background:var(--accent);border-radius:3px;transition:width .3s" :style="'width:' + semanticProgress.progress + '%'"></div>
                </div>
              </div>
            </template>

            <!-- Error -->
            <template x-if="semanticError">
              <div class="card p-100 bc-red c-red mb-100">
                <span x-text="semanticError"></span>
                <button class="btn btn-sm ml-100" @click="semanticError=null;semanticResults=null">Reintentar</button>
              </div>
            </template>

            <!-- Sub-tabs de resultados -->
            <template x-if="semanticResults">
              <div>
                <div class="tabs mb-100">
                  <button type="button" class="tab" :class="semanticSubTab === 'rings' && 'active'" @click="semanticSubTab='rings'; renderSemanticChart('rings')" data-tip="Visualización en anillos concéntricos. Las páginas se colocan según su distancia al centro semántico del sitio. Core = tema principal, Peripheral = contenido lejano.">Anillos</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'scatter' && 'active'" @click="semanticSubTab='scatter'; renderSemanticChart('scatter')" data-tip="Mapa 2D donde cada punto es una página. Las páginas cercanas tratan temas similares. Los colores agrupan clusters temáticos detectados automáticamente.">Mapa de temas</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'cannibal' && 'active'" @click="semanticSubTab='cannibal'; loadCannibalization()" data-tip="Pares de páginas con contenido casi idéntico que compiten entre sí en Google. La URL dominante es la de mayor autoridad (PageRank/clics). La débil es candidata a consolidar, redirigir o diferenciar.">Canibalización</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'drift' && 'active'" @click="semanticSubTab='drift'; loadDrift()" data-tip="Páginas con alta autoridad que están lejos del tema central. Al tener mucho peso, arrastran el centro semántico del sitio. Candidatas a reenfocar o desacoplar.">Desvío del tema</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'gap' && 'active'" @click="semanticSubTab='gap'" data-tip="Busca qué páginas de tu sitio son más relevantes para un tema concreto. Compara embeddings directamente para encontrar contenido existente que cubra o se acerque al tema buscado.">Huecos</button>
                </div>

                <!-- Ring Map -->
                <template x-if="semanticSubTab === 'rings'">
                  <div>
                    <p class="text-dim text-sm mb-75">Cada punto es una página posicionada según su distancia al <strong>centro semántico actual</strong> del sitio. El centro se calcula como la media ponderada de todos los embeddings (peso = PageRank + clics de Search Console). <strong>PageRank</strong> mide la importancia de cada página según cuántos enlaces internos recibe y de qué páginas: una URL enlazada desde muchas páginas (o desde páginas importantes) tiene más PageRank. Es la misma lógica que usa Google internamente. Las páginas del anillo <strong class="c-green">Core</strong> definen el tema principal, las del <strong class="c-red">Peripheral</strong> están fuera de foco. El tamaño del punto refleja su autoridad.</p>
                    <div id="semantic-ring-chart" class="marco-grafica"></div>

                    <!-- Target Theme -->
                    <div class="card p-100 mt-100">
                      <h4 class="mb-50 fs-sm flex items-center gap-30" data-tip="Define el tema ideal de tu sitio. El sistema re-centra los anillos alrededor de ese tema y te dice qué páginas reforzar (están cerca del objetivo pero con poca autoridad) y cuáles reenfocar (tienen mucha autoridad pero están lejos del objetivo).">
                        <i data-lucide="target" class="ico-14"></i> Tema objetivo
                      </h4>
                      <p class="text-dim text-sm mb-50">Describe el tema central ideal de tu sitio (5-15 palabras para más precisión). El sistema volverá a centrar los anillos alrededor de ese tema y mostrará cómo mover el centro semántico hacia él.</p>
                      <div class="flex gap-50 items-end">
                        <div class="flex-1">
                          <input type="text" x-model="targetTheme" placeholder="Ej: Formación Profesional online a distancia, ciclos de grado medio y superior"
                                 style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:var(--fs-sm)">
                        </div>
                        <button class="btn btn-primary btn-sm flex items-center gap-25" @click="analyzeTarget()" :disabled="targetLoading || !targetTheme.trim()">
                          <template x-if="targetLoading"><span class="spinner ico-12"></span></template>
                          <i data-lucide="target" class="ico-13" x-show="!targetLoading"></i>
                          Re-centrar
                        </button>
                      </div>

                      <!-- Target Results -->
                      <template x-if="targetResults">
                        <div class="mt-100">
                          <!-- Alignment Score -->
                          <div style="display:flex;align-items:center;gap:1.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap">
                            <span class="text-sm" data-tip="Similitud coseno entre el centro semántico actual del sitio y el tema objetivo. 100 % = perfectamente alineado.">
                              <strong>Alineamiento:</strong>
                              <span :style="'font-weight:700;color:' + (targetResults.alignment >= 0.9 ? 'var(--green)' : targetResults.alignment >= 0.8 ? 'var(--orange)' : 'var(--red)')"
                                    x-text="fmt.pctDe(targetResults.alignment)"></span>
                            </span>
                            <span class="text-sm text-dim" x-text="'Tema: ' + targetResults.target_theme"></span>
                            <template x-for="ring in ['Core','Focus','Expansion','Peripheral']" :key="ring">
                              <span class="text-sm" :style="'color:' + ({Core:'var(--green)',Focus:'var(--blue)',Expansion:'var(--orange)',Peripheral:'var(--red)'})[ring]">
                                <strong x-text="ring + ': '"></strong><span x-text="targetResults.ring_counts[ring] || 0"></span>
                              </span>
                            </template>
                          </div>

                          <!-- Target Ring Map -->
                          <div id="semantic-target-ring-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden;margin-bottom:1rem"></div>

                          <!-- Recommendations -->
                          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                            <!-- Reinforce -->
                            <div>
                              <h5 class="fs-sm mb-50 c-blue flex items-center gap-30" data-tip="Páginas cercanas al tema objetivo pero con poca autoridad. Refuerza el enlazado interno hacia ellas para mover el centro semántico hacia tu objetivo.">
                                <i data-lucide="arrow-up-circle" class="ico-14"></i> Reforzar (enlazar más)
                              </h5>
                              <template x-if="targetResults.reinforce.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.reinforce.length > 0">
                                <div class="maxh-300px ovy-auto">
                                  <table class="tbl fs-sm">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.reinforce" :key="r.url_id">
                                        <tr>
                                          <td class="maxw-200px ov-hidden ellipsis nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="fmt.dec(r.weight, 3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--orange)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>

                            <!-- Refocus -->
                            <div>
                              <h5 class="fs-sm mb-50 c-orange flex items-center gap-30" data-tip="Páginas con alta autoridad pero alejadas del tema objetivo. Están arrastrando el centro semántico en otra dirección. Opciones: reenfocar su contenido hacia el objetivo, o reducir su enlazado interno.">
                                <i data-lucide="arrow-down-circle" class="ico-14"></i> Reenfocar (alejadas del objetivo)
                              </h5>
                              <template x-if="targetResults.refocus.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.refocus.length > 0">
                                <div class="maxh-300px ovy-auto">
                                  <table class="tbl fs-sm">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.refocus" :key="r.url_id">
                                        <tr>
                                          <td class="maxw-200px ov-hidden ellipsis nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="fmt.dec(r.weight, 3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--red)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Scatter UMAP -->
                <template x-if="semanticSubTab === 'scatter'">
                  <div>
                    <p class="text-dim text-sm mb-75">Proyección 2D del espacio de embeddings (UMAP). Páginas cercanas tratan temas similares. Los colores representan grupos temáticos (HDBSCAN). Los puntos con borde rojo son páginas que no encajan en ningún grupo. Pasa el ratón sobre un punto para ver la URL y sus métricas.</p>
                    <div id="semantic-scatter-chart" class="marco-grafica"></div>
                  </div>
                </template>

                <!-- Canibalizacion -->
                <template x-if="semanticSubTab === 'cannibal'">
                  <div>
                    <p class="text-dim text-sm mb-75">Pares de páginas con contenido similar que compiten por las mismas keywords en Google. Si hay datos GSC con queries, se valida que ambas páginas ranqueen para las mismas keywords no-marca. Sin datos GSC, se muestra solo la similitud semántica.</p>

                    <!-- Brand filter + reload -->
                    <div class="flex gap-50 items-end mb-75 flex-wrap">
                      <div class="flex-1 minw-200px">
                        <label class="text-dim text-sm" data-tip="Keywords de marca a excluir. Separadas por coma. Ej: ilerna, ilerna fp. Dos páginas que solo comparten queries de marca NO son canibalización real.">Keywords de marca (excluir)</label>
                        <input type="text" x-model="cannibalBrand" placeholder="Ej: ilerna, ilerna fp" class="campo-simple">
                      </div>
                      <button class="btn btn-sm flex items-center gap-25" @click="cannibalPairs=[]; loadCannibalization()" :disabled="cannibalLoading">
                        <template x-if="cannibalLoading"><span class="spinner ico-12"></span></template>
                        Recargar
                      </button>
                      <template x-if="cannibalHasQueryData && cannibalPairs.length > 0">
                        <div class="flex gap-25">
                          <button class="btn btn-sm" :class="cannibalFilter === 'all' && 'btn-primary'" @click="cannibalFilter='all'">Todos</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'confirmed' && 'btn-primary'" @click="cannibalFilter='confirmed'" data-tip="Solo pares que comparten keywords no-marca en GSC">Confirmados</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'unconfirmed' && 'btn-primary'" @click="cannibalFilter='unconfirmed'" data-tip="Pares sin keywords compartidas (posibles falsos positivos)">Sin validar</button>
                        </div>
                      </template>
                    </div>

                    <template x-if="cannibalLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando canibalización...</div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length === 0">
                      <div class="empty p-200">
                        <i data-lucide="check-circle" style="width:32px;height:32px;color:var(--green);margin-bottom:.5rem"></i>
                        <p>No se detectaron pares de canibalización con el umbral actual.</p>
                      </div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length > 0">
                      <div class="ovx-auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>URL Dominante</th>
                              <th data-tip="Clics orgánicos de la URL dominante (GSC).">Clicks</th>
                              <th>URL Debil</th>
                              <th data-tip="Clics orgánicos de la URL débil (GSC).">Clicks</th>
                              <th>Similitud</th>
                              <th data-tip="Keywords no-marca compartidas entre ambas URLs en GSC. Si hay queries compartidas = canibalización confirmada.">KWs compartidas</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="pair in cannibalPairs.filter(p => {
                              if (cannibalFilter === 'all') return true;
                              if (cannibalFilter === 'confirmed') return p.shared_query_count > 0;
                              return p.shared_query_count === 0;
                            })" :key="pair.url_dominant + pair.url_weak">
                              <tr>
                                <td class="maxw-250px ov-hidden ellipsis nowrap" :title="pair.url_dominant" x-text="pair.url_dominant"></td>
                                <td x-text="fmt.num(pair.dominant_clicks)"></td>
                                <td class="maxw-250px ov-hidden ellipsis nowrap" :title="pair.url_weak" x-text="pair.url_weak"></td>
                                <td x-text="fmt.num(pair.weak_clicks)"></td>
                                <td><span class="fw-600" :style="pair.cosine_similarity >= 0.95 ? 'color:var(--red)' : 'color:var(--orange)'" x-text="fmt.pctDe(pair.cosine_similarity)"></span></td>
                                <td>
                                  <template x-if="pair.shared_query_count > 0">
                                    <span style="cursor:help" :title="pair.shared_queries.join(', ')" :style="'color:var(--red);font-weight:600'">
                                      <span x-text="pair.shared_query_count"></span> kws
                                    </span>
                                  </template>
                                  <template x-if="pair.shared_query_count === 0 && cannibalHasQueryData">
                                    <span class="text-dim">0</span>
                                  </template>
                                  <template x-if="!cannibalHasQueryData">
                                    <span class="text-dim">—</span>
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </tbody>
