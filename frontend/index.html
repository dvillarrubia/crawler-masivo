                         de problema llevan a ese tipo, donde sale «Revisado con IA». -->
                    <div class="fs-sm mt-35" x-show="problemaDePreguntaIA(preg)" data-testid="ia-a-problemas">
                      <a :href="'#/rastreos/' + job.id + '/problemas?tipo=' + problemaDePreguntaIA(preg)"
                         x-text="'Ver «' + fmt.issue(problemaDePreguntaIA(preg) || '') + '» en Problemas'"></a>
                    </div>
                    <div class="fs-sm mt-35" x-show="['tipo_pagina', 'categoria_cliente'].includes(preg)">
                      <a href="#" @click.prevent="cargarPlantillasEnriq(preg)">Ver la respuesta por plantilla</a>
                      <span class="text-dim">: se pregunta por unas pocas URLs de cada plantilla y se propone para todas.</span>
                    </div>
                    <div class="text-dim fs-sm mt-35" x-show="r.umbral != null">
                      Solo las «decididas» pasan el umbral de la pregunta (<span x-text="Math.round(100 * r.umbral) + ' %'"></span> de confianza, medido con su juego de evaluación); las demás son orientativas.
                    </div>
                  </div>
                </template>

                <template x-if="enriqPlantillas">
                  <div class="card mb-100">
                    <div class="fila-extremos flex-wrap">
                      <strong>Por plantilla: <span x-text="tituloPreguntaEnriq(enriqPlantillas.pregunta)"></span></strong>
                      <span class="text-dim fs-sm"
                            x-text="fmt.n(enriqPlantillas.total_plantillas, 'plantilla', 'plantillas') + ' · ' + fmt.num(enriqPlantillas.urls_cubiertas) + ' URLs con propuesta'"></span>
                    </div>
                    <div class="text-dim fs-sm mt-30 mb-50 mx-0">
                      «Mixta»: sus muestras no coinciden y no se propone nada (habrá que decidirla URL a URL).
                      <span x-show="enriqPlantillas.umbral == null">La pregunta aún no está calibrada: ninguna plantilla se da por buena, todo es orientativo y no se escribe en ninguna URL.</span>
                    </div>
                    <div class="ovx-auto">
                      <table>
                        <thead><tr><th class="ta-l">Plantilla</th><th>URLs</th><th>Respuesta</th><th>Acuerdo</th><th>Confianza</th><th class="ta-l">Estado</th></tr></thead>
                        <tbody>
                          <template x-for="f in enriqPlantillas.plantillas" :key="f.plantilla">
                            <tr>
                              <td style="max-width:28rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="f.plantilla" :title="f.plantilla"></td>
                              <td class="ta-r" x-text="fmt.num(f.urls)"></td>
                              <td x-text="f.respuesta == null ? '—' : fmt.respuestaEnriq(f.respuesta)"
                                  :title="Object.entries(f.respuestas || {}).map(([k, v]) => fmt.respuestaEnriq(k) + ': ' + v).join(' · ')"></td>
                              <td class="ta-r" x-text="f.acuerdo == null ? '—' : fmt.num(Math.round(f.respondidas * f.acuerdo)) + ' de ' + fmt.num(f.muestras)"></td>
                              <td class="ta-r" x-text="fmt.pctDe(f.confianza_media, 0)"></td>
                              <td x-text="fmt.estadoPlantillaEnriq(f.estado)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>

                <!-- Intencion de la pagina frente a sus busquedas y embudo con trafico (decision 176) -->
                <template x-if="enriqIntencion && (enriqIntencion.resumen || enriqIntencion.embudo)">
                  <div class="card mb-100">
                    <strong>Intención: página frente a búsquedas</strong>
                    <div class="text-dim fs-sm mt-25 mb-50 mx-0"
                         x-show="(enriqIntencion.resumen && enriqIntencion.resumen.orientativo) || (enriqIntencion.embudo && enriqIntencion.embudo.orientativo)">
                      Orientativo: las preguntas aún no están calibradas. Las búsquedas de marca o de otras
                      marcas (navegacionales) y las que no están claras no cuentan para el desajuste, y una página de
                      marca, o una con más clics de marca que de cualquier otra intención, no se da por desalineada.
                    </div>
                    <div class="text-dim fs-sm mt-25 mb-50 mx-0"
                         x-show="enriqIntencion.resumen && enriqIntencion.resumen.aviso_cobertura"
                         x-text="enriqIntencion.resumen && enriqIntencion.resumen.aviso_cobertura"></div>
                    <div class="text-dim fs-sm mt-25 mb-50 mx-0"
                         x-show="enriqIntencion.resumen && enriqIntencion.resumen.busquedas_sin_clics_hoy"
                         x-text="enriqIntencion.resumen && (fmt.num(enriqIntencion.resumen.busquedas_sin_clics_hoy) + ' búsquedas preguntadas ya no tienen clics en Search Console (se han borrado o rehecho esos días): salen sin clics y no pesan.')"></div>
                    <template x-if="enriqIntencion.resumen">
                      <div class="fs-sm">
                        <div class="flex gap-120 flex-wrap">
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.paginas_comparadas)"></strong> páginas comparadas</span>
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.desalineadas)"></strong> desalineadas</span>
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.clics_desalineados)"></strong> de
                            <span x-text="fmt.num(enriqIntencion.resumen.clics_que_cuentan)"></span> clics con otra intención</span>
                          <span class="text-dim" x-show="enriqIntencion.resumen.paginas_sin_intencion"
                                x-text="fmt.num(enriqIntencion.resumen.paginas_sin_intencion) + ' sin intención de página'"></span>
                        </div>
                        <div class="text-dim mt-30">
                          Clics por intención de la búsqueda:
                          <template x-for="[i, n] in Object.entries(enriqIntencion.resumen.clics_por_intencion).sort((a, b) => b[1] - a[1])" :key="i">
                            <span x-text="fmt.respuestaEnriq(i) + ' ' + fmt.num(n) + ' · '"></span>
                          </template>
                        </div>
                        <div class="ovx-auto mt-50" x-show="enriqIntencion.paginas.length">
                          <table>
                            <thead><tr><th class="ta-l">URL</th><th>Página</th><th>Búsquedas (más clics)</th><th class="ta-r">Clics con otra intención</th><th class="ta-r">Alineado</th></tr></thead>
                            <tbody>
                              <template x-for="p in enriqIntencion.paginas" :key="p.url_id">
                                <tr :style="p.desalineada ? 'background:var(--orange-bg, rgba(255,165,0,.08))' : ''">
                                  <td style="max-width:24rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="p.url"></td>
                                  <td x-text="p.intencion_pagina ? fmt.respuestaEnriq(p.intencion_pagina) : '—'"></td>
                                  <td class="maxw-22rem fs-sm"
                                      x-text="p.busquedas.slice(0, 3).map(b => (b.busqueda || '—') + ' (' + (b.intencion ? fmt.respuestaEnriq(b.intencion) : '—') + ', ' + (b.clics == null ? 'sin clics hoy' : b.clics) + ')').join(' · ')"></td>
                                  <td class="ta-r" x-text="fmt.num(p.clics_desalineados)"></td>
                                  <td class="ta-r" :title="fmt.sinAfirmarEnriq(p.sin_afirmar)"
                                      x-text="['pagina_de_marca', 'manda_la_marca'].includes(p.sin_afirmar) ? 'marca' : fmt.pctDe(p.parte_alineada, 0)"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </template>
                    <template x-if="enriqIntencion.embudo">
                      <div class="fs-sm mt-60">
                        <strong class="fs-sm">Embudo con tráfico real</strong>
                        <div class="flex gap-120 flex-wrap mt-30">
                          <template x-for="[e, v] in Object.entries(enriqIntencion.embudo.por_etapa)" :key="e">
                            <span><strong x-text="fmt.respuestaEnriq(e)"></strong>
                              <span x-text="fmt.n(v.paginas, 'página', 'páginas') + ', ' + fmt.n(v.clics, 'clic', 'clics')"></span></span>
                          </template>
                        </div>
                        <div class="text-dim mt-30 fs-sm">
                          Por plantilla (clics de la página en Search Console):
                          <template x-for="pl in enriqIntencion.embudo.por_plantilla.slice(0, 8)" :key="pl.plantilla">
                            <div x-text="pl.plantilla + ': ' + Object.entries(pl.clics_por_etapa).map(([e, n]) => fmt.respuestaEnriq(e) + ' ' + fmt.num(n)).join(', ')"></div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="enriqDecisiones">
                  <div class="card">
                    <div class="text-dim fs-sm mb-40"
                         x-text="fmt.n(enriqDecisiones.total, 'respuesta', 'respuestas') + (enriqFiltro.respuesta ? ' «' + etiquetaEnriq(enriqFiltro.pregunta, enriqFiltro.respuesta) + '»' : '')"></div>
                    <div class="ovx-auto">
                      <table>
                        <thead><tr><th class="ta-l">URL</th><th class="ta-l" x-show="enriqDecisiones.items.some(d => d.busqueda)">Búsqueda</th><th>Respuesta</th><th>Estado</th><th>Confianza</th><th>De dónde sale</th><th class="ta-r">Coste</th></tr></thead>
                        <tbody>
                          <template x-for="d in enriqDecisiones.items" :key="d.id">
                            <tr>
                              <td class="maxw-32rem ov-hidden ellipsis nowrap" x-text="d.url"></td>
                              <td x-show="enriqDecisiones.items.some(x => x.busqueda)">
                                <div x-text="d.busqueda || '—'"></div>
                                <div class="text-dim fs-sm" x-show="d.rutas" x-text="(d.rutas || []).join(' · ')"></div>
                              </td>
                              <td x-text="textoDecisionEnriq(d)"></td>
                              <td x-text="estadoUnaEnriq(d.estado)"></td>
                              <td x-text="fmt.pctDe(d.confianza, 0)"></td>
                              <td x-text="({modelo: 'la IA', cache: 'ya preguntado antes', arrastre: 'de su plantilla', regla: 'una regla', humano: 'a mano'})[d.origen] || d.origen"></td>
                              <td class="ta-r" x-text="fmt.usd(d.coste_usd)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div class="flex gap-50 justify-end mt-50" x-show="enriqDecisiones.total > enriqDecisiones.page_size">
                      <button class="btn btn-sm" :disabled="enriqFiltro.page <= 1" @click="enriqFiltro.page--; cargarDecisionesEnriq()">Anterior</button>
                      <button class="btn btn-sm" :disabled="enriqFiltro.page * enriqDecisiones.page_size >= enriqDecisiones.total" @click="enriqFiltro.page++; cargarDecisionesEnriq()">Siguiente</button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: COMPARAR ===== -->
        <!-- ===== PESTANA: COMPARAR =====
             Solo el seguimiento entre censos del mismo sitio. La migracion es
             una accion aparte, «Validar migración» (revision de UX del 25-oct,
             2.13; V23): su casilla con regex de Python estorbaba aqui cada semana. -->
        <template x-if="detailTab === 'diff'">
          <div>
            <div class="card mb-100">
              <div class="comparar-fila">
                <label for="diff-otro" class="fs-sm">Comparar con:</label>
                <!-- Por tipo y no por tamano (V22): la «réplica julio» de 5.000
                     URLs no es un censo de la serie aunque tenga su tamano. -->
                <select id="diff-otro" @change="diffOtro = $el.value; cargarDiff()" class="comparar-select">
                  <option value="">— elige otro rastreo del mismo sitio —</option>
                  <template x-for="g in gruposDiff()" :key="g.tipo">
                    <optgroup :label="g.etiqueta">
                      <template x-for="j in g.items" :key="j.id">
                        <option :value="j.id" :selected="j.id === diffOtro"
                                x-text="(j.id === (job.comparacion || {}).comparado_con ? '★ ' : '') + j.name + '  ·  ' + fmt.num(j.total_urls_crawled) + ' URLs  ·  ' + fmt.dia(j.started_at || j.created_at)"></option>
                      </template>
                    </optgroup>
                  </template>
                </select>
              </div>
              <!-- V21: lo guardado sale al instante y el detalle se calcula
                   despues, con un indicador que se ve (antes, solo un
                   «comparando…» gris mientras se volvia a pedir todo). -->
              <div x-show="diffCargando" class="diff-cargando mt-60" data-testid="diff-cargando">
                <span class="spinner ico-14"></span>
                <span x-text="diffVista() && diffVista()._guardada
                  ? 'Esto es lo que se guardó al terminar el rastreo. El detalle (qué cambió en cada página) se está calculando; tarda unos segundos en un censo grande.'
                  : 'Comparando los dos rastreos; tarda unos segundos en un censo grande.'"></span>
              </div>
              <div x-show="job.comparacion && job.comparacion.comparado_con === diffOtro" class="text-dim fs-sm mt-50">
                ★ Es el censo con el que se comparó automáticamente al terminar el rastreo.
              </div>
              <div x-show="!diffCandidatos.length" class="text-dim fs-sm mt-50">
                No hay otro rastreo completado del mismo sitio con el que comparar.
              </div>
              <div class="text-sm mt-60">
                ¿Han cambiado las direcciones de las páginas (migración, cambio de dominio)?
                <a href="#" data-testid="ir-a-migracion" @click.prevent="abrirMigracion()">Validar migración →</a>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== VALIDAR MIGRACION (revision de UX del 25-oct, 2.13; decision 192) =====
             Asistente en tres pasos: los dos censos, como cambian las URLs (casos
             comunes sin regex, con 5 URLs reales de muestra; las regex plegadas
             en «Avanzado») y el resultado, que es el GET /diff de siempre con el
             mapeo (decision 131). -->
        <template x-if="detailTab === 'migracion'">
          <div class="migracion" data-testid="migracion">
            <div class="card mb-2">
              <h2 class="migracion-titulo">Validar migración</h2>
              <div class="text-sm text-dim">
                Compara un censo de antes de la migración con uno de después, diciéndole cómo han cambiado las direcciones,
                para saber cuántas páginas viejas tienen su equivalente nueva y qué se ha roto por el camino.
              </div>
              <ol class="pasos" aria-label="Pasos">
                <template x-for="(t, i) in ['Censos', 'Cómo cambian las URLs', 'Resultado']" :key="i">
                  <li :class="{ 'paso-activo': migPaso === i + 1, 'paso-hecho': migPaso > i + 1 }"
                      :aria-current="migPaso === i + 1 ? 'step' : null">
                    <button type="button" class="paso-boton" @click="migIrAPaso(i + 1)" :disabled="i > 0 && !!migProblemaPareja()">
                      <span class="paso-num" x-text="i + 1"></span> <span x-text="t"></span>
                    </button>
                  </li>
                </template>
              </ol>
            </div>

            <!-- Paso 1: los dos censos, de cualquier tipo y dominio del cliente,
                 en grupos por tipo (V22). -->
            <template x-if="migPaso === 1">
              <div class="card mb-2" data-testid="migracion-paso-1">
                <div class="migracion-censos">
                  <label class="campo">
                    <span class="campo-etiqueta">Censo de antes de la migración</span>
                    <select x-model="migAntes" @change="migElegido()" data-testid="mig-antes">
                      <option value="">— elige —</option>
                      <template x-for="g in migGrupos()" :key="g.tipo">
                        <optgroup :label="g.etiqueta">
                          <template x-for="j in g.items" :key="j.id">
                            <option :value="j.id" :selected="j.id === migAntes" x-text="migEtiqueta(j)"></option>
                          </template>
                        </optgroup>
                      </template>
                    </select>
                    <span class="text-dim campo-ayuda" x-show="migJob(migAntes)" x-text="'Dominio: ' + (_hostDe(migJob(migAntes)) || '—')"></span>
                  </label>
                  <button type="button" class="btn btn-sm migracion-cambiar" @click="migIntercambiar()" title="Intercambiar antes y después" aria-label="Intercambiar antes y después">
                    <i data-lucide="arrow-left-right" class="ico-14"></i>
                  </button>
                  <label class="campo">
                    <span class="campo-etiqueta">Censo de después</span>
                    <select x-model="migDespues" @change="migElegido()" data-testid="mig-despues">
                      <option value="">— elige —</option>
                      <template x-for="g in migGrupos()" :key="g.tipo">
                        <optgroup :label="g.etiqueta">
                          <template x-for="j in g.items" :key="j.id">
                            <option :value="j.id" :selected="j.id === migDespues" x-text="migEtiqueta(j)"></option>
                          </template>
                        </optgroup>
                      </template>
                    </select>
                    <span class="text-dim campo-ayuda" x-show="migJob(migDespues)" x-text="'Dominio: ' + (_hostDe(migJob(migDespues)) || '—')"></span>
                  </label>
                </div>
                <div class="text-sm text-dim mt-50" x-show="migCandCargando">Cargando los rastreos…</div>
                <div class="text-sm red mt-50" x-show="migCandError" x-text="migCandError"></div>
                <div class="text-sm mt-50" x-show="!migCandCargando && !migCandError"
                     x-text="job.cliente_id ? 'Salen todos los rastreos completados de ' + (job.cliente_nombre || 'este cliente') + ', de cualquier dominio.' : 'Este rastreo no tiene cliente: salen los últimos rastreos completados de la agencia.'"></div>
                <div class="aviso-linea orange mt-60" x-show="migProblemaPareja()">
                  <span x-text="migProblemaPareja()"></span>
                  <a href="#" x-show="migProblemaPareja().startsWith('El censo de')" @click.prevent="migIntercambiar()">Intercambiarlos</a>
                </div>
                <div class="migracion-acciones">
                  <button class="btn btn-primary" @click="migIrAPaso(2)" :disabled="!!migProblemaPareja()" data-testid="mig-siguiente-1">Siguiente: cómo cambian las URLs</button>
                </div>
              </div>
            </template>

            <!-- Paso 2: como cambian las URLs. Casos comunes sin regex y vista
                 previa con 5 URLs reales del censo de antes. -->
            <template x-if="migPaso === 2">
              <div class="card mb-2" data-testid="migracion-paso-2">
                <div class="text-sm mb-60">
                  Marca lo que ha cambiado en las direcciones. Debajo ves cómo quedan cinco páginas reales del censo de antes
                  y si están en el de después.
                </div>

                <div class="caso">
                  <label class="caso-titulo"><input type="checkbox" x-model="migCasos.dominio" @change="migProgramarComprobacion()"> Cambia el dominio</label>
                  <div class="caso-cuerpo" x-show="migCasos.dominio">
                    <input type="text" x-model="migCasos.hostDe" @input="migProgramarComprobacion()" placeholder="www.viejo.com" aria-label="Dominio de antes" class="campo-mono">
                    <span aria-hidden="true">→</span>
                    <input type="text" x-model="migCasos.hostA" @input="migProgramarComprobacion()" placeholder="www.nuevo.com" aria-label="Dominio de después" class="campo-mono">
                  </div>
                  <div class="text-sm orange mt-30" x-show="migHostsDistintos() && !migMapHost()">
                    Los dos censos son de dominios distintos: sin decir cómo se corresponden no se pueden comparar.
                  </div>
                </div>

                <template x-if="!migAvanzado">
                  <div>
                    <div class="caso">
                      <label class="caso-titulo"><input type="checkbox" x-model="migCasos.prefijo" @change="migProgramarComprobacion()"> Una carpeta cambia de nombre o desaparece</label>
                      <div class="caso-cuerpo" x-show="migCasos.prefijo">
                        <span class="text-sm">Las que empiezan por</span>
                        <input type="text" x-model="migCasos.prefDe" @input="migProgramarComprobacion()" placeholder="/es/" aria-label="Carpeta de antes" class="campo-mono campo-corto">
                        <span class="text-sm">pasan a empezar por</span>
                        <input type="text" x-model="migCasos.prefA" @input="migProgramarComprobacion()" placeholder="/" aria-label="Carpeta de después" class="campo-mono campo-corto">
                        <div class="text-dim campo-ayuda basis-full">Con las dos barras: «/es/» → «/» deja /es/hoteles/ en /hoteles/.</div>
                      </div>
                    </div>
                    <div class="caso">
                      <label class="caso-titulo"><input type="checkbox" x-model="migCasos.texto" @change="migProgramarComprobacion()"> Cambia un trozo de la dirección</label>
                      <div class="caso-cuerpo" x-show="migCasos.texto">
                        <input type="text" x-model="migCasos.textoDe" @input="migProgramarComprobacion()" placeholder="/hoteles/" aria-label="Texto de antes" class="campo-mono campo-corto">
                        <span class="text-sm">pasa a ser</span>
                        <input type="text" x-model="migCasos.textoA" @input="migProgramarComprobacion()" placeholder="/hotel/" aria-label="Texto de después" class="campo-mono campo-corto">
                        <div class="text-dim campo-ayuda basis-full">La primera vez que aparece en cada dirección.</div>
                      </div>
                    </div>
                    <div class="caso">
                      <label class="caso-titulo" for="mig-final">El final de la dirección</label>
                      <div class="caso-cuerpo">
                        <select id="mig-final" x-model="migCasos.final" @change="migProgramarComprobacion()">
                          <template x-for="f in MIG_FINALES" :key="f.valor">
                            <option :value="f.valor" :selected="f.valor === migCasos.final" x-text="f.texto"></option>
                          </template>
                        </select>
                        <template x-if="['quitar_ext', 'quitar_ext_barra'].includes(migCasos.final)">
                          <span class="caso-ext">
                            <span class="text-sm">Extensión</span>
                            <input type="text" x-model="migCasos.ext" @input="migProgramarComprobacion()" placeholder=".html" aria-label="Extensión" class="campo-mono campo-corto">
                          </span>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Las expresiones regulares, plegadas: para quien las necesite. -->
                <details class="caso-avanzado" :open="migAvanzado">
                  <summary>Avanzado: expresiones regulares</summary>
                  <div class="text-sm text-dim" style="margin:.4rem 0">
                    Una regla por línea, <code>patrón =&gt; reemplazo</code>, en expresiones regulares de Python sobre la ruta y la query
                    (gana la primera que casa). Sustituyen a los casos de arriba.
                  </div>
                  <template x-if="!migAvanzado">
                    <button type="button" class="btn btn-sm" @click="migEditarRegex()" data-testid="mig-editar-regex">Escribirlas a mano (parto de lo marcado arriba)</button>
                  </template>
                  <template x-if="migAvanzado">
                    <div>
                      <textarea x-model="migReglasTexto" @input="migProgramarComprobacion()" rows="4" data-testid="mig-reglas"
                                placeholder="^/es/hoteles/([^/]+)\.html$ => /es/hotel/\1/" class="campo-mono w-full"></textarea>
                      <button type="button" class="btn btn-sm" @click="migVolverACasos()">Volver a los casos comunes</button>
                    </div>
                  </template>
                </details>

                <div class="vista-previa" data-testid="mig-vista-previa">
                  <div class="vista-previa-titulo">
                    <strong>Así quedan</strong>
                    <span class="text-dim text-sm" x-show="migMuestra.length && !migSinCambios()"
                          x-text="'(cambian ' + fmt.num(migCuantasCambian()) + ' de las ' + fmt.num(migMuestra.length) + ' primeras páginas del censo de antes)'"></span>
                  </div>
                  <div class="text-sm text-dim" x-show="migMuestraCargando">Cargando páginas del censo de antes…</div>
                  <div class="text-sm text-dim" x-show="!migMuestraCargando && !migMuestra.length">No hay páginas en el censo de antes para enseñar.</div>
                  <div class="text-sm text-dim" x-show="!migMuestraCargando && migMuestra.length && migSinCambios()">
                    No has marcado ningún cambio: se compararán las direcciones tal cual.
                  </div>
                  <template x-for="(f, i) in migVistaPrevia()" :key="i + (f.antes || '') + (f.despues || '')">
                    <div class="vista-previa-fila">
                      <template x-if="f.error">
                        <div class="text-sm red" x-text="f.error + '. El servidor la comprueba al calcular.'"></div>
                      </template>
                      <template x-if="!f.error">
                        <div>
                          <div class="vp-url vp-antes" x-text="f.antes"></div>
                          <div class="vp-url" :class="f.cambia ? 'vp-despues' : 'text-dim'">
                            <span aria-hidden="true">→ </span><span x-text="f.cambia ? f.despues : 'sin cambios'"></span>
                          </div>
                          <div class="vp-estado text-sm" :class="migExiste[f.despues] === true ? 'green' : (migExiste[f.despues] === false ? 'orange' : 'text-dim')"
                               x-text="migTextoExiste(f)"></div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="migracion-acciones">
                  <button class="btn" @click="migIrAPaso(1)">Atrás</button>
                  <button class="btn btn-primary" @click="migIrAPaso(3)" data-testid="mig-calcular">Calcular el resultado</button>
                </div>
              </div>
            </template>

            <!-- Paso 3: el resultado. Arriba, cuantas URLs de antes tienen pareja
                 despues y cuales no; debajo, el detalle de siempre de Comparar. -->
            <template x-if="migPaso === 3">
              <div data-testid="migracion-paso-3">
                <div class="card mb-2" x-show="migCargando">
                  <div class="diff-cargando">
                    <span class="spinner ico-14"></span>
                    Emparejando las URLs de los dos censos; tarda unos segundos en un censo grande.
                  </div>
                </div>
                <template x-if="migDiff && migDiff.comparable && migEmparejadas()">
                  <div class="card mb-2" data-testid="mig-resumen">
                    <div class="migracion-cifra">
                      <strong x-text="fmt.num(migEmparejadas().pct) + ' %'"></strong>
                      <span x-text="'De las ' + fmt.num(migEmparejadas().de) + ' URLs del censo de antes, ' + fmt.num(migEmparejadas().si) + ' tienen su equivalente en el de después.'"></span>
                    </div>
                    <div class="text-sm" x-show="migDiff.mapeo_rutas"
                         x-text="migDiff.mapeo_rutas ? fmt.num(migDiff.mapeo_rutas.reescritas) + ' direcciones cambian con lo que has marcado, y de ellas ' + fmt.num(migDiff.mapeo_rutas.reescritas_emparejadas) + ' están en el censo de después.' : ''"></div>
                    <div class="text-sm text-dim" x-show="migDiff.mapeo_rutas && migDiff.mapeo_rutas.colisiones"
                         x-text="migDiff.mapeo_rutas ? fmt.num(migDiff.mapeo_rutas.colisiones) + ' URLs viejas acaban en la misma dirección nueva que otra: solo una de cada grupo entra en la comparación.' : ''"></div>
                    <!-- Lo que no se puede afirmar no se afirma: con un censo
                         truncado o de otro alcance no hay «sin pareja». -->
                    <div class="migracion-listas">
                      <div>
                        <strong class="text-sm" x-text="migDiff.urls.desaparecidas === null ? 'Sin pareja: no se puede afirmar' : 'Sin pareja en el censo de después: ' + fmt.num(migDiff.urls.desaparecidas)"></strong>
                        <div class="text-sm text-dim" x-show="migDiff.urls.desaparecidas === null">
                          Uno de los dos censos no terminó entero o no rastreó lo mismo (mira los avisos de abajo): una URL que no sale puede no haberse visto.
                        </div>
                        <ul class="lista-urls" x-show="migDiff.urls.desaparecidas !== null">
                          <template x-for="u in (migDiff.urls.ejemplos_desaparecidas || []).slice(0, 8)" :key="u">
                            <li x-text="u"></li>
                          </template>
                        </ul>
                      </div>
                      <div>
                        <strong class="text-sm" x-text="'Nuevas, sin equivalente en el de antes: ' + fmt.num(migDiff.urls.nuevas)"></strong>
                        <ul class="lista-urls">
                          <template x-for="u in (migDiff.urls.ejemplos_nuevas || []).slice(0, 8)" :key="u">
                            <li x-text="u"></li>
                          </template>
                        </ul>
                      </div>
                    </div>
                    <template x-if="migAvanzado && migDiff.mapeo_rutas">
                      <div class="mt-50">
                        <template x-for="(rg, i) in migDiff.mapeo_rutas.reglas" :key="'mr' + i">
                          <div class="text-dim fs-sm">
                            <code x-text="rg.patron"></code> → <code x-text="rg.reemplazo"></code>:
                            <span x-text="fmt.num(rg.reescritas) + ' URLs'"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <div class="migracion-acciones">
                      <button class="btn" @click="migIrAPaso(2)">Ajustar cómo cambian las URLs</button>
                    </div>
                  </div>
                </template>
                <template x-if="migDiff && !migDiff.comparable">
                  <div class="migracion-acciones mb-75">
                    <button class="btn" @click="migIrAPaso(2)">Ajustar cómo cambian las URLs</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- El resultado de una comparacion: en Comparar (lo guardado al
             instante y luego el diff, V21) y en el paso 3 de «Validar
             migración». Una sola copia; `d` es el diff que toca. -->
        <template x-for="d in [detailTab === 'diff' ? diffVista() : (detailTab === 'migracion' && migPaso === 3 ? migDiff : null)].filter(Boolean)" :key="d._clave">
          <div>
            <template x-if="!d.comparable">
              <div class="card filete-red">
                <strong>No se pueden comparar</strong>
                <div class="mt-35 fs-sm" x-text="d.motivo"></div>
              </div>
            </template>

            <template x-if="d.comparable">
              <div>
                <div class="text-dim fs-sm mb-60"
                     x-show="d.antes && d.ahora">
                  Antes: <strong x-text="fmt.dia(d.antes.fecha)"></strong>
                  <span x-text="d.antes.nombre"></span>
                  · Ahora: <strong x-text="fmt.dia(d.ahora.fecha)"></strong>
                  <span x-text="d.ahora.nombre"></span>
                </div>
                <template x-for="aviso in d.avisos" :key="aviso">
                  <div class="card filete-orange mb-75">
                    <div class="fs-sm" x-text="aviso"></div>
                  </div>
                </template>

                <!-- Las alertas primero: un cambio que afecta a una parte
                     grande de las indexables no es trabajo editorial. -->
                <template x-for="al in (d.alertas || [])" :key="al.regla + (al.extraccion || '')">
                  <div class="card"
                       :style="'margin-bottom:.75rem;border-left:3px solid ' + fmt.colorSeveridad(al.severidad)">
                    <div class="fila-extremos">
                      <strong x-text="fmt.tituloAlerta(al)"></strong>
                      <span class="nowrap cifras-tab">
                        <strong x-text="fmt.num(al.paginas)"></strong>
                        <span class="text-dim" x-text="' de ' + fmt.num(al.de) + ' · ' + fmt.num(al.pct) + ' %'"></span>
                      </span>
                    </div>
                    <div class="fs-sm mt-35" x-text="al.que_decide_google"></div>
                    <div class="text-dim fs-sm mt-35"
                         x-show="fmt.detalleAlerta(al)" x-text="fmt.detalleAlerta(al)"></div>
                    <div class="text-dim fs-sm mt-40"
                         x-show="al.por === 'plantilla' || al.por === 'segmento'"
                         x-text="'Diluido en el total del sitio: salta por ' + al.por + '.'"></div>
                    <!-- Segmentos de negocio primero (decision 127). Si un
                         segmento son exactamente las paginas de una plantilla,
                         sale una vez, aqui, con la plantilla al lado. -->
                    <template x-for="sg in (al.segmentos || []).slice(0,4)" :key="'s' + sg.segmento">
                      <div class="text-dim fs-sm ml-60">
                        <strong x-text="sg.segmento"></strong>
                        <span x-text="' ' + fmt.num(sg.paginas) + '/' + fmt.num(sg.de) + ' = ' + fmt.num(sg.pct) + ' %'"></span>
                        <span x-show="sg.plantilla"> · plantilla <code x-text="sg.plantilla"></code></span>
                      </div>
                    </template>
                    <template x-for="pl in (al.plantillas || []).slice(0,4)" :key="pl.plantilla">
                      <div class="text-dim fs-sm ml-60">
                        <code x-text="pl.plantilla"></code>
                        <span x-text="' ' + fmt.num(pl.paginas) + '/' + fmt.num(pl.de) + ' = ' + fmt.num(pl.pct) + ' %'"></span>
                      </div>
                    </template>
                    <template x-for="e in al.ejemplos.slice(0,3)" :key="e.url">
                      <div class="text-dim" style="font-size:var(--fs-sm);margin-left:.6rem;margin-top:.15rem">
                        <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                        <span x-show="e.ahora !== undefined">: <s x-text="String(e.antes ?? '—').slice(0,36)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,36)"></strong></span>
                      </div>
                    </template>
                  </div>
                </template>

                <div class="stats-grid mb-100">
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(d.urls.en_ambos)"></div>
                    <div class="stat-label">en los dos</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(d.urls.nuevas)"></div>
                    <div class="stat-label">nuevas</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value"
                         x-text="d.urls.desaparecidas === null ? '—' : fmt.num(d.urls.desaparecidas)"></div>
                    <div class="stat-label" x-text="d.urls.desaparecidas === null ? 'desaparecidas (no afirmable)' : 'desaparecidas'"></div>
                  </div>
                </div>

                <!-- Extraccion a medida (decision 127): regla a regla, lo
                     comparado y lo que no se pudo comparar. Sin fila en uno
                     de los dos censos no es un cambio (decision 104). -->
                <template x-if="d.extraido && ((d.extraido.reglas || []).length || (d.extraido.no_comparadas || []).length)">
                  <div class="card mb-2">
                    <div class="text-sm"><strong>Extracción a medida</strong></div>
                    <template x-for="rg in d.extraido.reglas" :key="rg.nombre">
                      <div class="text-sm mt-35">
                        <strong x-text="'«' + rg.nombre + '»'"></strong>
                        <span x-text="' ' + fmt.num(rg.comparadas) + ' páginas comparadas · '
                          + Object.entries(rg.cambios).map(([k, v]) => fmt.reglaDiff(k).toLowerCase() + ': ' + fmt.num(v.total)).join(' · ')"></span>
                        <span class="text-dim" x-show="rg.sin_dato || rg.sin_saber || rg.render_distinto"
                              x-text="' · sin dato en uno de los dos: ' + fmt.num(rg.sin_dato) + ' · no se pudo evaluar: ' + fmt.num(rg.sin_saber)
                                + (rg.render_distinto ? ' · uno con render y otro sin: ' + fmt.num(rg.render_distinto) : '')"></span>
                      </div>
                    </template>
                    <template x-for="nc in (d.extraido.no_comparadas || [])" :key="'nc' + nc.nombre">
                      <div class="text-dim fs-sm mt-25"
                           x-text="'«' + nc.nombre + '» no se compara: ' + nc.motivo"></div>
                    </template>
                  </div>
                </template>

                <!-- Que se arreglo, que aparecio y que sigue (#32). Comparar
                     paginas no contesta "que arreglo el cliente desde la
                     auditoria anterior", que es para lo que se mira un
                     seguimiento mensual. -->
                <!-- Dos censos analizados con codigo distinto no se comparan
                     por incidencias: un hallazgo puede salir "resuelto" solo
                     porque la regla que lo emitia ha cambiado. Se dice, con
                     el motivo y como arreglarlo. -->
                <!-- Si el censo anterior se volvio a analizar para poder
                     comparar, se dice: sus cifras guardadas han cambiado y
                     quien viera un informe suyo tiene derecho a saberlo. -->
                <template x-if="d.anterior_reanalizado">
                  <div class="card mb-2 filete-blue">
                    <div class="text-sm">
                      El rastreo anterior se ha <strong>vuelto a analizar</strong> con
                      el código de hoy para poder comparar las incidencias. Sus
                      cifras han cambiado respecto a lo que se viera antes.
                    </div>
                  </div>
                </template>

                <template x-if="d._incidenciasViejas">
                  <div class="card mb-2 text-sm text-dim"
                       x-text="(d._incidenciasViejas === 'anterior' ? 'El censo anterior' : 'Este censo') + ' se volvió a analizar después de compararse: las incidencias guardadas ya no son las de hoy y se están volviendo a calcular.'"></div>
                </template>
                <template x-if="d._incidenciasPendientes">
                  <div class="card mb-2 text-sm text-dim">
                    Las incidencias llegan con la comparación completa: no se puede asegurar que las guardadas sigan valiendo.
                  </div>
                </template>

                <template x-if="d.incidencias && d.incidencias.comparable === false">
                  <div class="card mb-2 filete-text-dim">
                    <div class="text-sm">
                      <strong>No se pueden comparar las incidencias.</strong>
                      <span x-text="d.incidencias.motivo"></span>
                    </div>
                  </div>
                </template>

                <template x-if="d.incidencias && d.incidencias.comparable !== false">
                  <div class="stats-grid mb-100">
                    <div class="stat-card" style="border-top:2px solid var(--green,#2e8b57)">
                      <div class="stat-value"
                           x-text="d.incidencias.resueltas ? fmt.num(d.incidencias.resueltas.total) : '—'"></div>
                      <div class="stat-label"
                           x-text="d.incidencias.resueltas ? 'resueltas' : 'resueltas (no afirmable)'"></div>
                    </div>
                    <div class="stat-card" style="border-top:2px solid var(--red,#d32f2f)">
                      <div class="stat-value" x-text="fmt.num(d.incidencias.nuevas.total)"></div>
                      <div class="stat-label">nuevas</div>
                      <!-- Decision 131: en una URL que ya estaba es algo que se
                           ha roto; en una URL nueva, algo publicado mal. -->
                      <div class="text-dim fs-sm mt-20" id="diff-nuevas-reparto"
                           x-show="d.incidencias.nuevas.en_url_existente"
                           x-text="d.incidencias.nuevas.en_url_existente ? fmt.num(d.incidencias.nuevas.en_url_existente.total) + ' en URLs que ya existían · '
                             + fmt.num(d.incidencias.nuevas.en_url_nueva.total)
                             + (d.incidencias.nuevas.url_nueva_afirmable ? ' en URLs nuevas' : ' en URLs que el anterior no vio (estaba truncado)') : ''"></div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-value" x-text="fmt.num(d.incidencias.siguen.total)"></div>
                      <div class="stat-label">siguen</div>
                    </div>
                  </div>
                </template>

                <template x-if="d.incidencias && d.incidencias.comparable !== false">
                  <div class="card mb-100">
                    <div class="table-wrap"><table class="w-full fs-sm">
                      <thead><tr>
                        <th class="ta-l">Incidencias por tipo</th>
                        <th class="ta-r w-6rem">resueltas</th>
                        <th class="ta-r w-6rem">nuevas</th>
                        <th style="text-align:right;width:9rem" x-show="d.incidencias.nuevas.en_url_existente"
                            title="De las nuevas, cuántas en URLs que ya estaban en el censo anterior (regresiones) y cuántas en URLs nuevas">en URL existente / nueva</th>
                        <th class="ta-r w-6rem">siguen</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="t in tiposDeIncidencia(d)" :key="t.tipo">
                          <tr>
                            <td>
                              <span x-text="fmt.issue(t.tipo)"></span>
                              <span class="text-dim fs-sm"
                                    x-text="' · ' + fmt.severity(t.severidad)"></span>
                            </td>
                            <td class="ta-r c-green"
                                x-text="t.resueltas ? fmt.num(t.resueltas) : ''"></td>
                            <td class="ta-r c-red"
                                x-text="t.nuevas ? fmt.num(t.nuevas) : ''"></td>
                            <td class="text-dim ta-r" x-show="d.incidencias.nuevas.en_url_existente"
                                x-text="t.nuevas && nuevasPorUrl(t.tipo, d) ? nuevasPorUrl(t.tipo, d).existente + ' / ' + nuevasPorUrl(t.tipo, d).nueva : ''"></td>
                            <td class="text-dim ta-r"
                                x-text="t.siguen ? fmt.num(t.siguen) : ''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table></div>
                    <div class="text-dim fs-sm mt-50"
                         x-show="d.incidencias.sin_pagina_en_el_nuevo">
                      <span x-text="fmt.num(d.incidencias.sin_pagina_en_el_nuevo)"></span>
                      incidencias más estaban en páginas que este rastreo no ha
                      visitado: no se sabe si se arreglaron.
                    </div>
                    <div class="text-dim fs-sm mt-50"
                         x-show="d.incidencias.resueltas_no_afirmables">
                      <span x-text="fmt.num(d.incidencias.resueltas_no_afirmables)"></span>
                      incidencias no aparecen ahora, pero el censo anterior está
                      truncado: pueden no haberse resuelto, sino no haberse visto.
                    </div>
                    <div class="text-dim fs-sm mt-50"
                         x-show="d.incidencias.no_afirmables_por_muestra?.total">
                      <span x-text="fmt.num(d.incidencias.no_afirmables_por_muestra?.total)"></span>
                      avisos de accesibilidad aparecen o faltan en una plantilla
                      que uno de los dos censos no pasó por axe: no se cuentan
                      como nuevos ni como resueltos.
                    </div>
                  </div>
                </template>

                <!-- Lo que no guarda la comparacion automatica: llega con el
                     diff, y mientras tanto se dice que se esta calculando (V21). -->
                <template x-if="!d.cambios && d._guardada">
                  <div class="card diff-cargando" data-testid="diff-cargando-detalle">
                    <span class="spinner ico-14" x-show="diffCargando"></span>
                    <span x-text="diffCargando ? 'Calculando qué cambió página a página (títulos, canonical, enlazado…)' : 'El detalle página a página no ha llegado.'"></span>
                  </div>
                </template>
                <template x-if="d.cambios">
                <div class="card">
                  <div class="table-wrap"><table class="w-full fs-sm">
                    <thead><tr><th class="ta-l">Qué cambió</th><th style="text-align:right;width:7rem">páginas</th></tr></thead>
                    <tbody>
                      <template x-for="[campo, v] in Object.entries(d.cambios)" :key="campo">
                        <tr :style="v.total ? '' : 'opacity:.45'">
                          <td>
                            <div x-text="fmt.campoDiff(campo)"></div>
                            <!-- Sin el dato en los dos censos, o con el grafo
                                 incompleto, «0» mentiria: se dice por que no. -->
                            <div class="text-dim fs-sm ml-60" x-show="v.total === null" x-text="'No se compara: ' + (v.motivo || '')"></div>
                            <template x-for="e in v.ejemplos.slice(0,3)" :key="e.url">
                              <div class="text-dim fs-sm ml-60">
                                <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                                <span x-show="campo !== 'word_count' && !e.pierde">: <s x-text="String(e.antes ?? '—').slice(0,40)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,40)"></strong></span>
                                <span x-show="campo === 'word_count'">: <s x-text="e.antes"></s> → <strong x-text="e.ahora"></strong> palabras</span>
                                <span x-show="e.pierde" x-text="(e.pierde && e.pierde.length ? ': pierde ' + e.pierde.join(', ') : '') + (e.gana && e.gana.length ? (e.pierde && e.pierde.length ? ' · ' : ': ') + 'gana ' + e.gana.join(', ') : '')"></span>
                              </div>
                            </template>
                          </td>
                          <td style="text-align:right;vertical-align:top" x-text="v.total === null ? '—' : fmt.num(v.total)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: RESUMEN ===== -->
        <template x-if="detailTab === 'overview' && stats">
          <div class="overview-grid">
            <div class="card">
              <div class="card-header"><h2>Códigos de estado</h2></div>
              <template x-if="stats.urls_by_status_group.length === 0">
                <div class="text-dim text-sm">Sin datos todavía</div>
              </template>
              <div class="bar-chart">
                <template x-for="s in stats.urls_by_status_group" :key="s.status_group">
                  <div class="bar-row">
                    <div class="bar-label" x-text="s.status_group"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (s.count / maxStatusCount() * 100) + '%;background:' + barColor(s.status_group)"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(s.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Con un solo host no dice nada, y con uno que se lleva casi todo
                 basta una frase (revision de UX del 25-oct, 3.6; V19). -->
            <template x-if="(stats.top_hosts || []).length > 1">
            <div class="card col-completa" data-testid="hosts-frecuentes">
              <div class="card-header"><h2>Hosts más frecuentes</h2></div>
              <template x-if="hostDominante(stats.top_hosts)">
                <div class="text-sm" x-text="hostDominante(stats.top_hosts)"></div>
              </template>
              <div class="bar-chart" x-show="!hostDominante(stats.top_hosts)">
                <template x-for="h in stats.top_hosts.slice(0, 10)" :key="h.host">
                  <div class="bar-row">
                    <div class="bar-label" :title="h.host" x-text="h.host"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (h.count / (stats.top_hosts[0]?.count || 1) * 100) + '%;background:var(--neutral)'"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(h.count)"></div>
                  </div>
                </template>
              </div>
            </div>
            </template>

            <!-- Que bloquea cada bot por host (decision 129): la home y una
                 muestra por plantilla, con el robots.txt guardado. -->
            <template x-if="robotsBots && robotsBots.hosts.length">
              <div class="card col-completa">
                <div class="card-header"><h2>robots.txt por bot</h2>
                  <span class="text-sm text-dim">Home y una muestra por plantilla, sin pedir nada al sitio</span></div>
                <!-- Una frase arriba y las tablas plegadas (revision de UX del
                     25-oct, 1.16): eran doce filas por host casi siempre iguales. -->
                <div class="text-sm" data-testid="robots-resumen" :class="resumenRobots(robotsBots).nivel"
                     x-text="resumenRobots(robotsBots).texto"></div>
                <details class="mt-1" :open="resumenRobots(robotsBots).abrir">
                <summary class="text-sm text-dim pointer">Detalle por bot y por host</summary>
                <p class="text-sm text-dim">Bloquear un bot de <b>entrenamiento</b> (GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, CCBot) es una decisión legítima y no saca de ninguna búsqueda. Bloquear uno de <b>búsqueda de IA</b> (OAI-SearchBot, Claude-SearchBot, PerplexityBot) saca al sitio de esas respuestas. Los de <b>usuario</b> (ChatGPT-User, Claude-User) son descargas que pide una persona en el chat.</p>
                <template x-for="h in robotsBots.hosts" :key="h.origen">
                  <div class="mb-2">
                    <div class="text-sm"><a :href="h.url" target="_blank" rel="noopener" x-text="h.origen"></a>
                      <span class="text-dim" x-text="' · ' + (h.status_code || h.error || '—') + ' · ' + h.estado"></span></div>
                    <template x-if="!h.bots">
                      <div class="text-sm text-dim">Sin evaluar por bot: censo analizado antes de la decisión 129 o robots.txt no procesado. Re-analizar lo rellena.</div>
                    </template>
                    <template x-if="h.bots">
                      <div class="table-wrap"><table class="tbl fs-sm">
                        <thead><tr><th>Bot</th><th>Tipo</th><th>Home</th><th>Muestra bloqueada</th><th>Alcance</th><th>Regla de la home</th></tr></thead>
                        <tbody>
                          <template x-for="b in robotsBots.bots" :key="b.bot">
                            <tr x-data="{ r: h.bots[b.bot] || {} }">
                              <td x-text="b.token + ' (' + b.proveedor + ')'"></td>
                              <td x-text="({buscador:'Buscador', busqueda_ia:'Búsqueda IA', usuario_ia:'Usuario IA', entrenamiento:'Entrenamiento'})[b.tipo]"></td>
                              <td :class="r.home_bloqueada ? 'orange' : ''" x-text="r.alcance == null ? '—' : (r.home_bloqueada ? 'Bloqueada' : 'Permitida')"></td>
                              <td x-text="r.alcance == null ? '—' : (fmt.num(r.bloqueadas) + ' de ' + fmt.num(r.evaluadas) + (r.n_plantillas_bloqueadas ? ' · ' + fmt.n(r.n_plantillas_bloqueadas, 'plantilla entera', 'plantillas enteras') : ''))"
                                  :title="(r.plantillas_bloqueadas || []).join(', ')"></td>
                              <td :class="r.alcance === 'todo' && b.tipo === 'busqueda_ia' ? 'red' : (r.alcance === 'todo' || r.alcance === 'parte' ? 'orange' : '')"
                                  x-text="({todo:'Todo el sitio', parte:'Una parte', nada:'Nada'})[r.alcance] || 'No evaluado'"></td>
                              <td><code x-show="r.regla_home" x-text="r.regla_home ? ('l.' + r.regla_home.linea + ' ' + r.regla_home.texto) : ''"></code></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </template>
                  </div>
                </template>
                </details>
                <!-- robots.txt de prueba (decision 171): el veredicto y la linea
                     que decide, con la logica del crawler y sin descargar nada. -->
                <details class="mt-2" data-testid="robots-prueba">
                  <summary class="text-sm"><b>Probar un robots.txt</b> <span class="text-dim">antes de subirlo</span></summary>
                  <div class="text-sm text-dim mb-1">Pega el fichero o parte del guardado:
                    <template x-for="h in robotsBots.hosts" :key="'c' + h.origen">
                      <button type="button" class="btn btn-sm" @click="robotsPruebaCargar(h.origen)" x-text="h.origen"></button>
                    </template>
                  </div>
                  <textarea x-model="robotsPrueba.texto" rows="8" class="w-full mono fs-sm" placeholder="User-agent: *&#10;Disallow: /privado/"></textarea>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem" class="mt-1">
                    <label class="text-sm">URLs o rutas, una por línea
                      <textarea x-model="robotsPrueba.urls" rows="4" class="w-full"></textarea></label>
                    <label class="text-sm">Agentes, uno por línea
                      <textarea x-model="robotsPrueba.agentes" rows="4" class="w-full"></textarea></label>
                  </div>
                  <div class="mt-1 text-sm">
                    <select x-model="robotsPrueba.modo">
                      <option value="google">Como Google (token del bot: Googlebot, GPTBot…)</option>
                      <option value="rastreador">Como nuestro rastreo (User-Agent entero)</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm" :disabled="robotsPrueba.cargando || !robotsPrueba.urls.trim()" @click="robotsPruebaEvaluar()">Evaluar</button>
                    <span class="red" x-show="robotsPrueba.error" x-text="robotsPrueba.error"></span>
                  </div>
                  <template x-if="robotsPrueba.resultado">
                    <div class="mt-1">
                      <div class="text-sm text-dim" x-text="fmt.num(robotsPrueba.resultado.diagnostico.grupos) + ' grupos · ' + fmt.num(robotsPrueba.resultado.diagnostico.sitemaps.length) + ' sitemaps' + (robotsPrueba.resultado.diagnostico.recortado ? ' · pasa de 500 KiB: Google no lee lo de detrás' : '')"></div>
                      <template x-for="l in robotsPrueba.resultado.diagnostico.ignoradas" :key="'i' + l.linea">
                        <div class="text-sm orange">Línea <span x-text="l.linea"></span>: <code x-text="l.texto"></code> <span x-text="'— ' + robotsPruebaMotivo(l.motivo)"></span></div>
                      </template>
                      <div class="table-wrap"><table class="tbl fs-sm">
                        <thead><tr><th>Agente</th><th>URL</th><th>Veredicto</th><th>Línea que decide</th><th>Grupo</th></tr></thead>
                        <tbody>
                          <template x-for="(r, i) in robotsPrueba.resultado.resultados" :key="i">
                            <tr>
                              <td x-text="r.agente"></td>
                              <td x-text="r.url"></td>
                              <td :class="r.permitida ? '' : 'orange'" x-text="r.permitida ? 'Permitida' : 'Bloqueada'"></td>
                              <td><code x-show="r.linea" x-text="r.linea ? ('l.' + r.linea + ' ' + r.texto) : ''"></code><span class="text-dim" x-show="!r.linea">ninguna regla casa</span></td>
                              <td x-text="r.grupo ? (r.grupo + ' (l.' + r.linea_grupo + ')') : 'ninguno: todo permitido'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </div>
                  </template>
                </details>
              </div>
            </template>

            <!-- Accesibilidad con axe-core por muestra de plantilla (decision 174):
                 solo si el job lo pidio o trae capturas. Lo «a revisar» de axe
                 no se afirma, y sin paginas evaluadas no se dice «sin fallos». -->
            <template x-if="accesibilidad && (accesibilidad.pedida || accesibilidad.paginas.evaluadas || accesibilidad.paginas.no_evaluadas)">
              <div class="card col-completa" data-testid="tarjeta-accesibilidad">
                <div class="card-header"><h2>Accesibilidad (WCAG 2.x A/AA)</h2>
                  <span class="text-sm text-dim" x-text="'axe-core ' + (accesibilidad.axe || '') + ' · ' + fmt.num(accesibilidad.paginas.evaluadas) + ' páginas de ' + fmt.num(accesibilidad.plantillas) + ' plantillas' + (accesibilidad.coste && accesibilidad.coste.ms_pagina_mediana != null ? ' · ' + fmt.dec(accesibilidad.coste.ms_pagina_mediana / 1000) + ' s por página' : '')"></span></div>
                <p class="text-sm text-dim">Muestra por plantilla con el navegador. axe detecta lo automatizable, en torno a un 30-40&nbsp;% de los criterios WCAG A/AA: una plantilla sin fallos aquí no es una plantilla accesible (el teclado, el orden de lectura o si un texto alternativo describe la imagen se revisan a mano). Imágenes, fuentes e iframes no se cargan en el render.</p>
                <template x-if="!accesibilidad.paginas.evaluadas">
                  <div class="text-sm" data-testid="accesibilidad-sin-evaluar">Ninguna página evaluada<span x-show="accesibilidad.paginas.no_evaluadas" x-text="': ' + Object.entries(accesibilidad.paginas.motivos).map(([m, n]) => m + ' (' + n + ')').join(', ')"></span>. No se puede decir nada de la accesibilidad de este rastreo.</div>
                </template>
                <template x-if="accesibilidad.paginas.evaluadas && !accesibilidad.reglas.length">
                  <div class="text-sm">axe no encontró incumplimientos automatizables en las páginas de la muestra.</div>
                </template>
                <template x-if="accesibilidad.reglas.length">
                  <div class="table-wrap"><table class="tbl fs-sm" data-testid="accesibilidad-reglas">
                    <thead><tr><th>Impacto</th><th>Regla</th><th>WCAG</th><th>Plantillas</th><th>Páginas</th><th>Elementos</th></tr></thead>
                    <tbody>
                      <template x-for="r in accesibilidad.reglas.slice(0, 12)" :key="r.regla">
                        <tr>
                          <td :class="impactoAxe(r.impacto)[1]" x-text="impactoAxe(r.impacto)[0]"></td>
                          <td><a :href="r.url_ayuda" target="_blank" rel="noopener" x-text="r.ayuda || r.regla"></a> <code class="text-dim" x-text="r.regla"></code></td>
                          <td x-text="(r.criterios.join(', ') || '—') + (r.nivel ? ' (' + r.nivel + ')' : '')"></td>
                          <td :title="r.plantillas.map(p => p.plantilla + ': ' + p.paginas + ' de ' + p.de).join('\n')" x-text="fmt.num(r.plantillas.length)"></td>
                          <td x-text="fmt.num(r.paginas)"></td>
                          <td x-text="fmt.num(r.nodos)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </template>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.reglas.length > 12" x-text="'Y ' + (accesibilidad.reglas.length - 12) + ' reglas más en Problemas (Accesibilidad).'"></div>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.incompletas.length" data-testid="accesibilidad-incompletas"
                     x-text="'A revisar a mano, sin afirmar (axe no pudo decidir): ' + accesibilidad.incompletas.map(r => r.regla).join(', ')"></div>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.paginas.evaluadas && accesibilidad.paginas.no_evaluadas"
                     x-text="fmt.n(accesibilidad.paginas.no_evaluadas, 'página', 'páginas') + ' de la muestra sin evaluar: ' + Object.entries(accesibilidad.paginas.motivos).map(([m, n]) => m + ' (' + n + ')').join(', ')"></div>
              </div>
            </template>

            <!-- Comprobaciones fuera del censo: certificado (110), soft 404
                 (105), sondas de respuesta (123/124) y sitemaps (126). Cada
                 tarjeta solo si el job trae ese dato: sin el, un rastreo viejo
                 o con la sonda apagada se leeria como «sin problemas». -->
            <template x-if="filasTls(job)">
              <div class="card chk" data-testid="tarjeta-tls">
                <div class="card-header"><h2>Certificado TLS</h2>
                  <!-- Dos umbrales distintos, dichos los dos: aqui sale en naranja a 30
                       dias o menos (1.16) y el analisis abre el aviso en Problemas a
                       los de la config (7 de serie). Antes solo decia «aviso a 7
                       días» y pintaba en naranja a 14 (revision del 27-oct). -->
                  <span class="text-sm text-dim" data-testid="tls-umbrales" x-text="'el día del rastreo · en naranja a 30 días o menos; aviso en Problemas a ' + fmt.n((job.config.analysis_thresholds || {}).tls_dias_aviso || 7, 'día', 'días')"></span></div>
                <div class="table-wrap"><table class="tbl fs-sm">
                  <thead><tr><th>Host</th><th>Estado</th><th>Emisor</th><th>Caduca</th><th>Días</th><th>Versión</th></tr></thead>
                  <tbody>
                    <template x-for="t in filasTls(job)" :key="t.host">
                      <tr :title="t.detalle || ''">
                        <td x-text="t.host"></td>
                        <td :class="t.nivel === 'dim' ? 'text-dim' : t.nivel" x-text="t.estado"></td>
                        <td x-text="t.emisor || '—'"></td>
                        <td x-text="t.caduca ? fmt.dia(t.caduca) : '—'"></td>
                        <td :class="t.renovar ? 'orange' : ''"
                            :title="t.renovar ? 'Faltan 30 días o menos: conviene renovarlo' : ''"
                            x-text="t.dias == null ? '—' : fmt.num(t.dias)"></td>
                        <td x-text="t.version || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSoft404(job)">
              <div class="card chk" data-testid="tarjeta-soft404" x-data="{ get s4() { return resumenSoft404(job) } }">
                <div class="card-header"><h2>Soft 404</h2>
                  <span class="text-sm text-dim">qué responde el sitio a una URL que no existe</span></div>
                <div class="text-sm mb-1">
                  <template x-if="s4.analizado">
                    <span>
                      <strong :class="s4.soft_404 ? 'red' : (s4.plantillas_200 ? '' : 'green')" x-text="fmt.num(s4.soft_404) + (s4.soft_404 === 1 ? ' página' : ' páginas')"></strong>
                      del censo son la página de error del sitio con un 200<span x-show="s4.indexables" x-text="' (' + fmt.num(s4.indexables) + ' indexables)'"></span><span x-show="s4.candidatos" x-text="' · ' + fmt.num(s4.candidatos) + ' candidatas sin afirmar'"></span>.
                      <a href="#" @click.prevent="verTipoDeIncidencia('soft_404', ''); switchTab('issues')" x-show="s4.soft_404">Ver</a>
                    </span>
                  </template>
                  <!-- 2.11: que ninguna pagina del censo sea la de error no quiere
                       decir que el sitio responda bien a lo que no existe. -->
                  <template x-if="s4.plantillas_200">
                    <div class="orange mt-1" data-testid="soft404-plantillas">
                      <strong x-text="fmt.num(s4.plantillas_200) + (s4.plantillas_200 === 1 ? ' plantilla responde' : ' plantillas responden')"></strong>
                      200 a una URL que no existe, en lugar de 404: hay que pedir al cliente que las corrija.
                      <a href="#" x-show="s4.aviso_en_problemas" @click.prevent="verTipoDeIncidencia('soft_404_plantilla', ''); switchTab('issues')">Ver en Problemas</a>
                      <span class="text-dim" x-show="!s4.con_aviso_190">Este censo se analizó antes de que existiera el aviso: saldrá en Problemas cuando se vuelva a analizar.</span>
                    </div>
                  </template>
                  <template x-if="!s4.analizado">
                    <span class="text-dim">Sondas hechas, sin analizar todavía.</span>
                  </template>
                  <span class="text-dim" x-text="' ' + fmt.num(s4.sondas) + (s4.sondas === 1 ? ' sonda' : ' sondas') + (s4.con_huella != null ? ', ' + fmt.num(s4.con_huella) + ' con huella' : '') + '.'"></span>
                </div>
                <div class="table-wrap"><table class="tbl fs-sm">
                  <thead><tr><th>Host</th><th>Plantilla</th><th>Respuesta</th><th title="Páginas del censo con la huella de esta sonda, sobre las de su host o su plantilla">Con su huella</th></tr></thead>
                  <tbody>
                    <!-- Por posicion: una sonda que redirige se repite en el destino con la
                         MISMA clave (http -> https del mismo host) -->
                    <template x-for="(f, i) in s4.filas" :key="i">
                      <tr :title="f.url + (f.redirige_a ? ' → ' + f.redirige_a : '')">
                        <td x-text="f.host"></td>
                        <td x-text="f.plantilla || 'raíz'"></td>
                        <td :class="f.nivel === 'dim' ? 'text-dim' : f.nivel" x-text="f.lectura"></td>
                        <td x-text="f.coincidencias == null ? '—' : fmt.num(f.coincidencias) + ' de ' + fmt.num(f.alcance) + (f.devuelve_portada ? ' · devuelve la portada' : (f.ambigua ? ' · huella de plantilla' : ''))"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSondas(job)">
              <div class="card chk" data-testid="tarjeta-sondas">
                <div class="card-header"><h2>Enlaces externos y recursos</h2>
                  <span class="text-sm text-dim">sondas fuera del censo</span></div>
                <template x-for="b in resumenSondas(job)" :key="b.etiqueta">
                  <div class="mb-1">
                    <div class="text-sm">
                      <strong x-text="b.etiqueta"></strong>:
                      <span x-text="fmt.num(b.comprobados) + (b.distintos != null ? ' comprobados de ' + fmt.num(b.distintos) + ' distintos' : ' comprobados')"></span>
                      · <span :class="b.rotos ? 'red' : 'green'" x-text="fmt.num(b.rotos) + (b.rotos === 1 ? ' roto' : ' rotos')"></span>
                      <span x-show="b.dominios_muertos" class="orange" x-text="' · ' + fmt.num(b.dominios_muertos) + (b.dominios_muertos === 1 ? ' dominio muerto' : ' dominios muertos')"></span>
                    </div>
                    <div x-show="b.parcial" class="text-sm orange">No se comprobaron todos (tope alcanzado): que no haya aviso no dice que el resto esté bien.</div>
                    <div class="text-dim fs-sm" x-show="b.por_veredicto.length"
                         x-text="b.por_veredicto.map(([v, n]) => v.replace(/_/g, ' ') + ': ' + fmt.num(n)).join(' · ')"></div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="resumenSitemaps(job)">
              <div class="card chk" data-testid="tarjeta-sitemaps" x-data="{ get sm() { return resumenSitemaps(job) }, abierto: false }">
                <div class="card-header"><h2>Sitemaps</h2>
                  <span class="text-sm text-dim" x-text="fmt.num(sm.leidos) + ' de ' + fmt.num(sm.pedidos) + (sm.pedidos === 1 ? ' fichero descargado' : ' ficheros descargados')"></span></div>
                <!-- URLs de los urlset e indices aparte: «64 entradas de 459
                     declaradas» sumaba los 395 hijos de un indice como URLs
                     (revision de UX del 25-oct, 3.6; V13). -->
                <div class="text-sm" data-testid="sitemaps-cifras">
                  <strong x-text="fmt.num(sm.urls) + (sm.urls === 1 ? ' URL' : ' URLs')"></strong>
                  <span x-text="'en ' + fmt.num(sm.conUrls) + (sm.conUrls === 1 ? ' fichero' : ' ficheros')"></span><span x-show="sm.indices" x-text="'; ' + (sm.indices === 1 ? '1 índice' : fmt.num(sm.indices) + ' índices') + ' con ' + fmt.num(sm.hijos) + (sm.hijos === 1 ? ' fichero' : ' ficheros')"></span>.
                </div>
                <div x-show="sm.ilegibles" class="text-sm orange" data-testid="sitemaps-ilegibles"
                     x-text="fmt.num(sm.ilegibles) + ' de ' + fmt.num(sm.pedidos) + (sm.ilegibles === 1 ? ' fichero respondió 200 ' : ' ficheros respondieron 200 ') + (sm.vacios === sm.ilegibles ? (sm.ilegibles === 1 ? 'vacío' : 'vacíos') : 'sin un sitemap que se pueda leer') + ': no se sabe qué URLs declaran.'"></div>
                <div x-show="sm.parcial" class="text-sm orange">Lectura parcial: hubo ficheros sin leer o cortados.</div>
                <div x-show="sm.fallidos" class="text-sm orange" x-text="fmt.num(sm.fallidos) + (sm.fallidos === 1 ? ' fichero no respondió 200' : ' ficheros no respondieron 200')"></div>
                <div x-show="sm.dudoso" class="text-sm" data-testid="sitemaps-duda">
                  Por eso «No incluida en el sitemap» no se puede afirmar: la página puede estar en un fichero que no se leyó.
                  <a href="#" @click.prevent="verTipoDeIncidencia('not_in_sitemap', ''); switchTab('issues')">Ver en Problemas</a>
                </div>
                <div x-show="sm.recortadas" class="text-sm text-dim" x-text="'Se guardaron ' + fmt.num(sm.guardadas) + ' entradas (tope ' + fmt.num(sm.tope) + '): la ficha de una URL puede no decir de qué fichero viene.'"></div>
                <a href="#" class="text-sm" x-show="sm.ficheros.length" @click.prevent="abierto = !abierto" x-text="abierto ? 'Ocultar ficheros' : 'Ver ficheros'"></a>
                <div class="table-wrap" x-show="abierto"><table class="tbl fs-sm">
                  <thead><tr><th>Fichero</th><th>Código</th><th>Formato</th><th>Entradas</th><th>Hijos</th></tr></thead>
                  <tbody>
                    <template x-for="f in sm.ficheros.slice(0, 200)" :key="f.url">
                      <tr>
                        <td class="break-all"><a :href="f.url" target="_blank" rel="noopener" x-text="f.url"></a></td>
                        <td :class="f.status && f.status !== 200 ? 'orange' : ''" x-text="f.status ?? '—'"></td>
                        <td x-text="f.formato || '—'"></td>
                        <td x-text="f.devueltas == null ? '—' : fmt.num(f.devueltas) + (f.cortado ? ' (cortado)' : '')"></td>
                        <td x-text="f.hijos ? fmt.num(f.hijos) : '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <!-- WordPress por su REST API (decisiones 161 y 168). Solo si el job
                 trae el resumen del adaptador y hubo rastro de WordPress: un
                 rastreo anterior o con el adaptador apagado no dice «no es WordPress». -->
            <template x-if="resumenWordPress(job)">
              <div class="card chk wp-tarjeta" data-testid="tarjeta-wordpress" x-data="{ get wp() { return resumenWordPress(job) }, nsAbierto: false }" x-init="cargarWpAssets()">
                <div class="card-header"><h2>WordPress</h2>
                  <span class="text-sm text-dim" x-text="wp.nombre || wp.raiz || ''"></span></div>
                <dl class="wp-datos">
                  <dt>Versión</dt>
                  <dd x-text="wp.version || 'no la publica (sin meta generator)'"></dd>
                  <dt>Plugin SEO</dt>
                  <dd x-text="wp.plugin_seo || (wp.abierta ? 'ninguno conocido en la REST API' : '—')"></dd>
                  <dt>REST API</dt>
                  <dd :class="wp.rest_nivel" x-text="wp.rest_texto"></dd>
                </dl>
                <div x-show="wp.cortada" class="text-sm orange" x-text="'Lectura cortada (' + String(wp.cortada).replace(/_/g, ' ') + '): los totales de cada tipo salen de X-WP-Total, pero no se leyeron todas las entidades.'"></div>
                <div x-show="wp.reanudacion" class="text-sm text-dim">Datos de una ejecución anterior del rastreo: esta no llegó a confirmar la REST API.</div>
                <template x-if="wp.filas.length">
                  <div class="table-wrap"><table class="tbl wp-tabla">
                    <thead><tr><th>Tipo</th><th>Clase</th><th title="X-WP-Total: lo que el sitio dice que publica">Publicadas</th><th>Leídas</th><th title="Leídas que tienen fila en el censo (por la URL, o la misma con el otro esquema)">En el censo</th><th title="Leídas sin fila en el censo: no es por sí solo un hallazgo">Solo en WordPress</th></tr></thead>
                    <tbody>
                      <template x-for="f in wp.filas" :key="f.tipo">
                        <tr>
                          <td :title="f.tipo" x-text="f.nombre"></td>
                          <td x-text="f.clase_texto"></td>
                          <td x-text="f.publicadas == null ? (f.status ? 'sin acceso (' + f.status + ')' : '—') : fmt.num(f.publicadas)"></td>
                          <td x-text="f.leidas == null ? '—' : fmt.num(f.leidas) + (f.recortado ? ' (tope)' : '')"></td>
                          <td x-text="f.en_el_censo == null ? '—' : fmt.num(f.en_el_censo)"></td>
                          <td>
                            <template x-if="f.solo_wp && wp.abierta"><a href="#" @click.prevent="verSoloWordPress(f.tipo)" x-text="fmt.num(f.solo_wp)"></a></template>
                            <template x-if="!(f.solo_wp && wp.abierta)"><span x-text="f.solo_wp == null ? '—' : fmt.num(f.solo_wp)"></span></template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </template>
                <div x-show="wp.abierta && !wp.analizado" class="text-sm text-dim">Leída, sin analizar todavía: «En el censo» sale al acabar el análisis.</div>
                <div x-show="wp.no_afirmable" class="text-sm orange"
                     x-text="fmt.num(wp.sin_afirmar) + ' publicadas sin rastrear que no se afirman como hallazgo: el censo tiene otro alcance (' + wp.no_afirmable + '). La lista está en «Solo en WordPress».'"></div>
                <div x-show="wp.emitidos" class="text-sm"><a href="#" @click.prevent="verTipoDeIncidencia('wp_publicado_no_rastreado', ''); switchTab('issues')">Ver los avisos de contenido publicado y no rastreado</a></div>
                <template x-if="wp.namespaces.length">
                  <div class="text-sm wp-plugins">
                    <span class="text-dim" title="Cada plugin que registra rutas en la REST API lo hace con su espacio de nombres. No todos lo hacen: no es la lista entera.">Plugins con rutas en la REST API:</span>
