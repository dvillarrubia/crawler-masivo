                               style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem;margin-top:.2rem">
                      </div>
                      <button class="btn btn-sm" @click="cannibalPairs=[]; loadCannibalization()" :disabled="cannibalLoading" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="cannibalLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Recargar
                      </button>
                      <template x-if="cannibalHasQueryData && cannibalPairs.length > 0">
                        <div style="display:flex;gap:.25rem">
                          <button class="btn btn-sm" :class="cannibalFilter === 'all' && 'btn-primary'" @click="cannibalFilter='all'">Todos</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'confirmed' && 'btn-primary'" @click="cannibalFilter='confirmed'" data-tip="Solo pares que comparten keywords no-marca en GSC">Confirmados</button>
                          <button class="btn btn-sm" :class="cannibalFilter === 'unconfirmed' && 'btn-primary'" @click="cannibalFilter='unconfirmed'" data-tip="Pares sin keywords compartidas (posibles falsos positivos)">Sin validar</button>
                        </div>
                      </template>
                    </div>

                    <template x-if="cannibalLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando canibalización...</div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length === 0">
                      <div class="empty" style="padding:2rem">
                        <i data-lucide="check-circle" style="width:32px;height:32px;color:var(--green);margin-bottom:.5rem"></i>
                        <p>No se detectaron pares de canibalización con el umbral actual.</p>
                      </div>
                    </template>
                    <template x-if="!cannibalLoading && cannibalPairs.length > 0">
                      <div style="overflow-x:auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>URL Dominante</th>
                              <th data-tip="Clicks organicos de la URL dominante (GSC).">Clicks</th>
                              <th>URL Debil</th>
                              <th data-tip="Clicks organicos de la URL debil (GSC).">Clicks</th>
                              <th>Similitud</th>
                              <th data-tip="Keywords no-marca compartidas entre ambas URLs en GSC. Si hay queries compartidas = canibalización confirmada.">KWs compartidas</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="pair in cannibalPairs.filter(p => {
                              if (cannibalFilter === 'all') return true;
                              if (cannibalFilter === 'confirmed') return p.shared_query_count > 0;
                              return p.shared_query_count === 0;
                            })" :key="pair.url_dominant + pair.url_weak">
                              <tr>
                                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="pair.url_dominant" x-text="pair.url_dominant"></td>
                                <td x-text="pair.dominant_clicks != null ? pair.dominant_clicks.toLocaleString('es-ES') : '—'"></td>
                                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="pair.url_weak" x-text="pair.url_weak"></td>
                                <td x-text="pair.weak_clicks != null ? pair.weak_clicks.toLocaleString('es-ES') : '—'"></td>
                                <td><span style="font-weight:600" :style="pair.cosine_similarity >= 0.95 ? 'color:var(--red)' : 'color:var(--orange)'" x-text="(pair.cosine_similarity * 100).toFixed(1) + '%'"></span></td>
                                <td>
                                  <template x-if="pair.shared_query_count > 0">
                                    <span style="cursor:help" :title="pair.shared_queries.join(', ')" :style="'color:var(--red);font-weight:600'">
                                      <span x-text="pair.shared_query_count"></span> kws
                                    </span>
                                  </template>
                                  <template x-if="pair.shared_query_count === 0 && cannibalHasQueryData">
                                    <span class="text-dim">0</span>
                                  </template>
                                  <template x-if="!cannibalHasQueryData">
                                    <span class="text-dim">—</span>
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Drift -->
                <template x-if="semanticSubTab === 'drift'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Páginas que mas desplazan el centro semántico del sitio. Son URLs con <strong>alta autoridad</strong> (peso) pero <strong>alejadas del tema principal</strong> (distancia). El Drift Score = peso x distancia. Si una pagina importante habla de algo muy diferente al resto del sitio, arrastra el centroide. Accion: reenfocar su contenido o reducir su autoridad interna.</p>
                    <template x-if="driftLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando drift...</div>
                    </template>
                    <template x-if="!driftLoading && driftData.length > 0">
                      <div style="overflow-x:auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th><th>URL</th>
                              <th data-tip="Distancia euclidea al centroide. Mayor = mas alejada del tema central.">Distancia</th>
                              <th data-tip="Autoridad normalizada (PageRank + clicks GSC). Mayor = mas influyente.">Peso</th>
                              <th data-tip="Impacto en el desplazamiento del centro semántico. Drift = peso x distancia.">Drift Score</th>
                              <th data-tip="Clicks organicos de Google (GSC). Contexto: por que esta página importa.">Clicks</th>
                              <th data-tip="Posicion media en Google (GSC). Menor = mejor posicionamiento.">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(d, idx) in driftData" :key="d.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="d.url" x-text="d.url"></td>
                                <td x-text="d.distance"></td>
                                <td x-text="d.weight"></td>
                                <td><strong x-text="d.drift_score"></strong></td>
                                <td x-text="d.clicks != null ? d.clicks.toLocaleString('es-ES') : '—'"></td>
                                <td x-text="d.position != null ? d.position.toFixed(1) : '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Gap Analysis -->
                <template x-if="semanticSubTab === 'gap'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Escribe un tema y el sistema busca que paginas de tu sitio cubren mejor ese contenido. Compara el embedding del tema con el de cada pagina. Las mas similares son candidatas para enlazar, expandir o reforzar. Tambien muestra la centralidad de cada pagina (similitud al centroide) para saber si esta en el nucleo o en la periferia del sitio.</p>
                    <div style="display:flex;gap:.5rem;align-items:end;margin-bottom:.5rem">
                      <div style="flex:1">
                        <label class="text-dim text-sm">Topico objetivo</label>
                        <input type="text" x-model="gapTopic" placeholder="Ej: guia de cuidado dental infantil"
                               style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.9rem;margin-top:.2rem">
                      </div>
                      <button class="btn btn-primary btn-sm" @click="runGapAnalysis()" :disabled="gapLoading || !gapTopic.trim()" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="gapLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Analizar gap
                      </button>
                    </div>
                    <div style="margin-bottom:1rem">
                      <label class="text-dim text-sm" data-tip="Patrones de URL a excluir de los resultados, separados por coma. Ej: /page/, /tag/, /category/. Se aplica como 'contiene'.">Excluir URLs que contengan</label>
                      <input type="text" x-model="gapExclude" placeholder="Ej: /page/, /tag/, /category/"
                             style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem;margin-top:.2rem">
                    </div>
                    <template x-if="gapResults && gapResults.candidates">
                      <div>
                        <p class="text-sm text-dim" style="margin-bottom:.5rem">Páginas mas relevantes para "<span x-text="gapResults.topic"></span>":</p>
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th>
                              <th>URL</th>
                              <th data-tip="Similitud coseno entre el embedding de la página y el del tema buscado. Mayor = mas relevante.">Similitud al tema</th>
                              <th data-tip="Similitud coseno al centroide del sitio. Alto = página central. Bajo = página periferica.">Centralidad</th>
                              <th data-tip="Clicks organicos de Google (GSC).">Clicks</th>
                              <th data-tip="Posicion media en Google (GSC).">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(c, idx) in gapResults.candidates.filter(c => {
                              if (!gapExclude || !gapExclude.trim()) return true;
                              const patterns = gapExclude.split(',').map(p => p.trim().toLowerCase()).filter(Boolean);
                              return !patterns.some(p => c.url.toLowerCase().includes(p));
                            })" :key="c.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td style="max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="c.url" x-text="c.url"></td>
                                <td><strong x-text="(c.similarity_to_topic * 100).toFixed(1) + '%'"></strong></td>
                                <td x-text="(c.similarity_to_centroid * 100).toFixed(1) + '%'"></td>
                                <td x-text="c.clicks != null ? c.clicks.toLocaleString('es-ES') : '—'"></td>
                                <td x-text="c.position != null ? c.position.toFixed(1) : '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: LIMPIEZA ===== -->
        <template x-if="detailTab === 'cleaning'">
          <div>
            <!-- Nota informativa -->
            <div style="display:flex;align-items:flex-start;gap:.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;border-left:3px solid var(--blue);font-size:.85rem">
              <i data-lucide="info" style="width:15px;height:15px;flex-shrink:0;margin-top:.15rem;color:var(--blue)"></i>
              <span>Proceso opcional a posteriori. Los originales se conservan &mdash; puedes revertir en cualquier momento. Si una regla eliminaría más del 60% del contenido de una página, esa página se salta automáticamente.</span>
            </div>

            <template x-if="cleaningError">
              <p class="text-sm" style="color:var(--red);margin-bottom:.75rem" x-text="cleaningError"></p>
            </template>
            <template x-if="cleaningMessage">
              <p class="text-sm" style="color:var(--green);margin-bottom:.75rem" x-text="cleaningMessage"></p>
            </template>

            <!-- Grupos -->
            <div class="card" style="margin-bottom:1rem">
              <div class="card-header">
                <h2>Grupos</h2>
                <button class="btn btn-sm" @click="loadCleaningGroups()" :disabled="cleaningGroupsLoading" style="display:flex;align-items:center;gap:.25rem">
                  <i data-lucide="refresh-cw" style="width:12px;height:12px"></i> Actualizar
                </button>
              </div>
              <template x-if="cleaningGroupsLoading">
                <div class="loading-overlay"><div class="spinner"></div> Cargando grupos...</div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length === 0">
                <div class="empty"><h3>No hay grupos de contenido</h3></div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th data-tip="Patron de forma de URL que agrupa páginas con estructura similar">Forma de URL</th>
                        <th data-tip="Número de páginas del grupo">Páginas</th>
                        <th data-tip="Páginas del grupo con limpieza aplicada">Limpiadas</th>
                        <th data-tip="Longitud media del contenido en caracteres">Long. media</th>
                        <th data-tip="URL de ejemplo del grupo">Ejemplo</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="g in cleaningGroups" :key="g.group_key">
                        <tr @click="selectCleaningGroup(g)" style="cursor:pointer" :class="cleaningSelectedGroup === g.group_key && 'row-selected'">
                          <td style="font-family:monospace;font-size:.8rem" x-text="g.group_key"></td>
                          <td x-text="fmt.num(g.pages)"></td>
                          <td x-text="fmt.num(g.cleaned_pages)"></td>
                          <td x-text="fmt.num(g.avg_content_length)"></td>
                          <td style="max-width:300px" :title="g.sample_urls?.[0] || ''">
                            <div class="truncate text-dim text-sm" x-text="g.sample_urls?.[0] || '—'"></div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>

            <!-- Reglas -->
            <template x-if="cleaningSelectedGroup">
              <div class="card" style="margin-bottom:1rem">
                <div class="card-header">
                  <h2>Reglas &mdash; <span style="font-family:monospace;font-size:.85rem;font-weight:400" x-text="cleaningSelectedGroup"></span></h2>
                </div>
                <template x-for="(rule, idx) in cleaningRules" :key="idx">
                  <div style="display:flex;gap:.5rem;margin-bottom:.5rem;align-items:center">
                    <select x-model="rule.type" style="width:auto;padding:.35rem .5rem;font-size:.8rem">
                      <option value="line_exact">Línea exacta</option>
                      <option value="line_prefix">Línea que empieza por</option>
                      <option value="line_contains">Línea que contiene</option>
                      <option value="cut_from_line">Cortar desde línea que contiene</option>
                      <option value="remove_substring">Quitar texto literal</option>
                      <option value="regex">Expresión regular</option>
                    </select>
                    <input type="text" x-model="rule.value" placeholder="Valor de la regla" style="flex:1">
                    <button class="btn btn-sm btn-danger" @click="removeCleaningRule(idx)" title="Quitar regla">&#10005;</button>
                  </div>
                </template>
                <button class="btn btn-sm" @click="addCleaningRule()" style="margin-bottom:1rem">+ Añadir regla</button>

                <div style="display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem">
                  <div>
                    <label class="text-dim text-sm">Aplicar a</label>
                    <select x-model="cleaningTargets" style="display:block;margin-top:.2rem;width:auto;padding:.35rem .5rem;font-size:.8rem">
                      <option value="text">Texto</option>
                      <option value="markdown">Markdown</option>
                      <option value="both">Ambos</option>
                    </select>
                  </div>
                  <div style="flex:1;min-width:220px">
                    <label class="text-dim text-sm">Filtro regex de URL (opcional)</label>
                    <input type="text" x-model="cleaningUrlRegex" placeholder="^https://ejemplo\.com/blog/" style="display:block;margin-top:.2rem;width:100%">
                  </div>
                </div>

                <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                  <button class="btn btn-sm" @click="previewCleaning()" :disabled="cleaningPreviewLoading || cleaningApplying || cleaningReverting" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningPreviewLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Vista previa
                  </button>
                  <button class="btn btn-sm btn-primary" @click="applyCleaning()" :disabled="cleaningApplying || cleaningPreviewLoading || cleaningReverting" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningApplying"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Aplicar al grupo
                  </button>
                  <button class="btn btn-sm btn-danger" @click="revertCleaning()" :disabled="cleaningReverting || cleaningApplying || cleaningPreviewLoading" style="display:flex;align-items:center;gap:.25rem">
                    <template x-if="cleaningReverting"><span class="spinner" style="width:12px;height:12px"></span></template>
                    Revertir grupo
                  </button>
                </div>
              </div>
            </template>

            <!-- Vista previa -->
            <template x-if="cleaningPreview">
              <div class="card" style="margin-bottom:1rem">
                <div class="card-header"><h2>Vista previa</h2></div>
                <p class="text-sm" style="margin-bottom:.75rem">
                  <strong x-text="fmt.num(cleaningPreview.total_chars_removed)"></strong> caracteres eliminados en total en la muestra.
                  <template x-if="cleaningPreview.pages_skipped_safety > 0">
                    <span style="color:var(--orange)" x-text="fmt.num(cleaningPreview.pages_skipped_safety) + ' páginas se saltarían por la válvula de seguridad (>60% eliminado)'"></span>
                  </template>
                </p>
                <template x-if="cleaningPreview.samples.length === 0">
                  <div class="empty"><h3>Ninguna página de la muestra cambia con estas reglas</h3></div>
                </template>
                <template x-for="s in cleaningPreview.samples" :key="s.url">
                  <div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
                    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap">
                      <a :href="s.url" target="_blank" rel="noopener" class="text-sm truncate" style="max-width:60%" :title="s.url" x-text="s.url"></a>
                      <span class="text-sm" style="padding:.1rem .5rem;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600"
                            x-text="'-' + fmt.num(s.chars_removed) + ' chars (' + (s.removed_pct ?? 0).toFixed(1) + '%)'"></span>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                      <div>
                        <div class="text-dim text-sm" style="margin-bottom:.25rem">Antes</div>
                        <pre style="max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem;font-size:.72rem;font-family:monospace;white-space:pre-wrap;word-break:break-word" x-text="s.before_excerpt"></pre>
                      </div>
                      <div>
                        <div class="text-dim text-sm" style="margin-bottom:.25rem">Después</div>
                        <pre style="max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem;font-size:.72rem;font-family:monospace;white-space:pre-wrap;word-break:break-word" x-text="s.after_excerpt"></pre>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Historial -->
            <div class="card">
              <div class="card-header"><h2>Historial de limpiezas</h2></div>
              <template x-if="cleaningRulesets.length === 0">
                <div class="text-dim text-sm">Sin limpiezas aplicadas todavía</div>
              </template>
              <template x-if="cleaningRulesets.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Fecha</th>
                        <th>Grupo</th>
                        <th>Reglas</th>
                        <th>Páginas actualizadas</th>
                        <th>Saltadas</th>
                        <th>Chars eliminados</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rs in cleaningRulesets" :key="rs.id">
                        <tr>
                          <td x-text="fmt.date(rs.created_at)"></td>
                          <td style="font-family:monospace;font-size:.8rem" x-text="rs.group_key || rs.url_regex || '—'"></td>
                          <td x-text="rs.rules?.length || 0"></td>
                          <td x-text="fmt.num(rs.pages_updated)"></td>
                          <td x-text="fmt.num(rs.pages_skipped)"></td>
                          <td x-text="fmt.num(rs.chars_removed)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: INFORME SEO ===== -->
        <template x-if="detailTab === 'insights'">
          <div>
            <!-- Loading -->
            <template x-if="insightsLoading">
              <div class="loading-overlay"><div class="spinner"></div> Generando informe SEO...</div>
            </template>

            <template x-if="!insightsLoading && insights">
              <div>
                <!-- Puntuacion global -->
                <div class="insights-header">
                  <div class="score-ring-wrap">
                    <svg class="score-ring" viewBox="0 0 120 120">
                      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8"/>
                      <circle cx="60" cy="60" r="52" fill="none" :stroke="scoreColor(insights.overall_score)" stroke-width="8"
                        stroke-linecap="round"
                        :stroke-dasharray="ringDash(insights.overall_score, 52)"
                        stroke-dashoffset="0"
                        transform="rotate(-90 60 60)"/>
                      <text x="60" y="55" text-anchor="middle" fill="var(--text)" font-size="28" font-weight="700" x-text="insights.overall_score"></text>
                      <text x="60" y="73" text-anchor="middle" fill="var(--text-dim)" font-size="11" x-text="scoreLabel(insights.overall_score)"></text>
                    </svg>
                  </div>
                  <div class="insights-header-text">
                    <h2>Puntuación SEO global</h2>
                    <!-- El tope va ANTES que la explicacion de la media: si la
                         nota esta recortada, es lo primero que hay que saber. -->
                    <template x-if="insights.tope">
                      <div class="nota-tope">
                        <i data-lucide="alert-octagon" style="width:15px;height:15px"></i>
                        <div>
                          <strong x-text="'Limitada a ' + insights.tope.tope + ' por errores'"></strong>
                          (sin el tope saldría <span x-text="insights.overall_score_sin_tope"></span>).
                          <span x-text="fmt.num(insights.tope.paginas_con_error) + ' de ' + fmt.num(insights.tope.de) + ' URLs internas (' + String(insights.tope.pct).replace('.', ',') + ' %) tienen algún error.'"></span>
                          <a :href="'#/rastreos/' + job.id + '/problemas?gravedad=error'">Ver los errores</a>
                        </div>
                      </div>
                    </template>
                    <p class="text-dim text-sm">Media ponderada de 6 categorías: rastreabilidad 25 %, contenido 25 %, enlaces 20 %, seguridad 15 %, datos estructurados 10 %, internacionalización 5 %. Con errores abiertos no pasa de 79, y si afectan al 10 % de las URLs o más, de 49.</p>
                  </div>
                </div>

                <!-- Categorias -->
                <div class="insights-categories">
                  <template x-for="cat in insights.categories" :key="cat.key">
                    <div class="insight-card" :style="'border-left-color:' + scoreColor(cat.score)">
                      <!-- Cabecera de categoria -->
                      <div class="insight-card-header" role="button" tabindex="0" @keydown.enter.prevent="$el.click()" @keydown.space.prevent="$el.click()" @click="toggleCategory(cat.key)">
                        <div class="flex items-center gap-1">
                          <span class="insight-icon" x-text="cat.icon"></span>
                          <span class="insight-name" x-text="cat.name"></span>
                        </div>
                        <div class="flex items-center gap-1">
                          <div class="insight-score-bar">
                            <div class="insight-score-fill" :style="'width:' + cat.score + '%;background:' + scoreColor(cat.score)"></div>
                          </div>
                          <span class="insight-score-num" :style="'color:' + scoreColor(cat.score)" x-text="cat.score"></span>
                          <span class="insight-toggle" x-text="isCategoryExpanded(cat.key) ? '&#9650;' : '&#9660;'"></span>
                        </div>
                      </div>

                      <!-- Cuerpo expandible -->
                      <div class="insight-card-body" x-show="isCategoryExpanded(cat.key)" x-transition.duration.200ms>
                        <!-- Metricas -->
                        <div class="metric-grid">
                          <!-- Crawlability metrics -->
                          <template x-if="cat.key === 'crawlability'">
                            <template x-for="m in [
                              {l:'URLs internas', v:fmt.num(cat.metrics.total_internal)},
                              {l:'% respuesta 2xx', v:fmt.pct(cat.metrics.pct_2xx)},
                              {l:'% indexables', v:fmt.pct(cat.metrics.pct_indexable)},
                              {l:'% redirecciones', v:fmt.pct(cat.metrics.pct_redirects)},
                              {l:'Errores 4xx', v:fmt.num(cat.metrics.errors_4xx)},
                              {l:'Errores 5xx', v:fmt.num(cat.metrics.errors_5xx)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Content metrics -->
                          <template x-if="cat.key === 'content'">
                            <template x-for="m in [
                              {l:'Paginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'% titulos OK', v:fmt.pct(cat.metrics.pct_title_ok)},
                              {l:'% descripciones OK', v:fmt.pct(cat.metrics.pct_desc_ok)},
                              {l:'% H1 OK', v:fmt.pct(cat.metrics.pct_h1_ok)},
                              {l:'Media palabras', v:fmt.num(cat.metrics.avg_word_count)},
                              {l:'Contenido delgado', v:fmt.num(cat.metrics.thin_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Links metrics -->
                          <template x-if="cat.key === 'links'">
                            <template x-for="m in [
                              {l:'Paginas internas', v:fmt.num(cat.metrics.total_internal_pages)},
                              {l:'Paginas huerfanas', v:fmt.num(cat.metrics.orphan_count)},
                              {l:'Media inlinks', v:cat.metrics.avg_inlinks},
                              {l:'Enlaces nofollow', v:fmt.num(cat.metrics.nofollow_links)},
                              {l:'Paginas con errores', v:fmt.num(cat.metrics.broken_link_issues)},
                              {l:'Exceso de enlaces', v:fmt.num(cat.metrics.high_outlinks)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Security metrics -->
                          <template x-if="cat.key === 'security'">
                            <template x-for="m in [
                              {l:'Paginas analizadas', v:fmt.num(cat.metrics.total_checked)},
                              {l:'% HTTPS', v:fmt.pct(cat.metrics.pct_https)},
                              {l:'% HSTS', v:fmt.pct(cat.metrics.pct_hsts)},
                              {l:'% CSP', v:fmt.pct(cat.metrics.pct_csp)},
                              {l:'% contenido mixto', v:fmt.pct(cat.metrics.pct_mixed)},
                              {l:'Con contenido mixto', v:fmt.num(cat.metrics.mixed_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Structured Data metrics -->
                          <template x-if="cat.key === 'structured_data'">
                            <template x-for="m in [
                              {l:'Paginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'Con datos estructurados', v:fmt.num(cat.metrics.pages_with_sd)},
                              {l:'% con SD', v:fmt.pct(cat.metrics.pct_with_sd)},
                              {l:'Bloques totales', v:fmt.num(cat.metrics.total_sd_blocks)},
                              {l:'Errores validacion', v:fmt.num(cat.metrics.sd_errors)},
                              {l:'% errores', v:fmt.pct(cat.metrics.pct_errors)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- i18n metrics -->
                          <template x-if="cat.key === 'i18n'">
                            <template x-for="m in [
                              {l:'Etiquetas hreflang', v:fmt.num(cat.metrics.total_hreflang)},
                              {l:'Idiomas', v:cat.metrics.languages?.join(', ') || '—'},
                              {l:'% retorno OK', v:fmt.pct(cat.metrics.pct_return_ok)},
                              {l:'Hreflang a URL descartada', v:fmt.num(cat.metrics.destino_malo ?? 0)},
                              {l:'% idioma valido', v:fmt.pct(cat.metrics.pct_lang_valid)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                        </div>

                        <!-- Recomendaciones -->
                        <template x-if="cat.recommendations.length > 0">
                          <div class="recommendations-section">
                            <h4 class="text-dim text-sm mb-1" style="text-transform:uppercase;letter-spacing:.05em">Recomendaciones</h4>
                            <template x-for="rec in cat.recommendations" :key="rec.title">
                              <div class="recommendation">
                                <div class="recommendation-header">
                                  <span class="priority-badge" :class="priorityClass(rec.priority)" x-text="priorityLabel(rec.priority)"></span>
                                  <span class="recommendation-title" x-text="rec.title"></span>
                                  <template x-if="recHasUrls(rec)">
                                    <button class="btn-icon" @click.stop="toggleRecUrls(rec)"
                                      style="margin-left:.25rem;font-size:.72rem;padding:.15rem .4rem;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;gap:.25rem;color:var(--accent);background:rgba(91,174,35,.06);cursor:pointer">
                                      <i data-lucide="list" style="width:11px;height:11px"></i>
                                      <span x-text="recUrlsOpen[rec.title] ? 'Ocultar URLs' : 'Ver URLs'"></span>
                                    </button>
                                  </template>
                                  <span class="recommendation-count" x-text="rec.affected_count + ' URLs'" x-show="rec.affected_count > 0"></span>
                                </div>
                                <p class="recommendation-desc" x-text="rec.description"></p>

                                <!-- URL list expandable -->
                                <template x-if="recUrlsOpen[rec.title]">
                                  <div style="margin-top:.5rem;padding:.5rem .65rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;animation:fadeInUp .2s ease">
                                    <template x-if="recUrls[rec.title]?.loading">
                                      <div class="loading-overlay" style="padding:.35rem;justify-content:flex-start"><div class="spinner" style="width:14px;height:14px"></div> <span class="text-dim text-sm">Cargando URLs...</span></div>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length === 0">
                                      <p class="text-dim text-sm">No se encontraron URLs afectadas.</p>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length > 0">
                                      <div>
                                        <div style="display:flex;flex-direction:column;gap:.15rem;max-height:240px;overflow-y:auto">
                                          <template x-for="u in recUrls[rec.title].urls" :key="u.id">
                                            <div @click="openUrlDetail(u.id)" style="display:flex;align-items:center;gap:.5rem;padding:.25rem .4rem;border-radius:4px;cursor:pointer;font-size:.8rem;transition:background .15s" class="rec-url-row">
                                              <span class="exp-status" :class="expStatusClass(u.status_code)" x-text="u.status_code" style="font-size:.7rem;padding:.05rem .3rem"></span>
                                              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)" :title="u.url" x-text="u.url"></span>
                                            </div>
                                          </template>
                                        </div>
                                        <div style="margin-top:.4rem;display:flex;align-items:center;gap:.5rem;padding-top:.35rem;border-top:1px solid var(--border)">
                                          <span class="text-dim" style="font-size:.72rem" x-text="recUrls[rec.title].urls.length + ' de ' + rec.affected_count + ' URLs'"></span>
                                          <button class="btn btn-sm" @click.stop="openRecInExplorer(rec)" style="margin-left:auto;font-size:.7rem;padding:.2rem .5rem;display:flex;align-items:center;gap:.25rem">
                                            <i data-lucide="external-link" style="width:10px;height:10px"></i> Ver todas
                                          </button>
                                        </div>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="cat.recommendations.length === 0">
                          <p class="text-dim text-sm" style="padding:.5rem 0">Sin problemas detectados en esta categoria.</p>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

      </div>
    </template>


    <!-- ============================================================ -->
    <!--            VISTA: DETALLE COMPLETO DE UNA URL                -->
    <!-- ============================================================ -->
    <template x-if="view === 'url-detail'">
      <div>
        <!-- Cargando -->
        <template x-if="urlDetailLoading">
          <div class="loading-overlay"><div class="spinner"></div> Cargando datos de la URL...</div>
        </template>

        <template x-if="!urlDetailLoading && urlDetail">
          <div>
            <!-- Cabecera de URL -->
            <div class="url-header-card card mb-2">
              <div class="flex items-center justify-between" style="gap:.75rem;flex-wrap:wrap">
                <div style="flex:1;min-width:0">
                  <div class="flex items-center gap-1 mb-1">
                    <span class="badge" :class="{
                      'badge-completed': urlDetail.status_group === '2xx',
                      'badge-running': urlDetail.status_group === '3xx',
                      'badge-cancelled': urlDetail.status_group === '4xx',
                      'badge-failed': urlDetail.status_group === '5xx'
                    }" x-text="(urlDetail.status_code || '—') + ' ' + (urlDetail.status_text || '')"></span>
                    <span class="badge" :class="urlDetail.indexable ? 'badge-completed' : 'badge-cancelled'"
                      x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : 'No indexable')"></span>
                    <template x-if="urlDetail.is_internal !== null">
                      <span class="badge badge-pending" x-text="urlDetail.is_internal ? 'Interna' : 'Externa'"></span>
                    </template>
                  </div>
                  <div class="url-full-display" x-text="urlDetail.url" :title="urlDetail.url"></div>
                </div>
                <button class="btn btn-sm" @click="backToDetail()" style="display:flex;align-items:center;gap:.3rem">
                  <i data-lucide="arrow-left" style="width:13px;height:13px"></i> Volver
                </button>
              </div>
            </div>

            <!-- Veredicto (UX-17): las tres preguntas que se hacen al abrir una
                 URL —¿se indexa?, ¿que le pasa?, ¿le llegan enlaces?— arriba,
                 antes de los 30 campos. -->
            <div class="url-veredicto mb-2">
              <div class="card">
                <div class="veredicto-titulo">Indexabilidad</div>
                <div class="veredicto-valor" :class="urlDetail.indexable ? 'green' : (urlDetail.indexable === false ? 'orange' : '')"
                     x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : urlDetail.indexable === false ? 'No indexable' : 'Sin analizar')"></div>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.canonical_href && !urlDetail.indexable">
                  <div class="text-sm text-dim truncate" :title="urlDetail.html_meta.canonical_href"
                       x-text="'Canonical: ' + urlDetail.html_meta.canonical_href"></div>
                </template>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.meta_robots">
                  <div class="text-sm text-dim" x-text="'Meta robots: ' + urlDetail.html_meta.meta_robots"></div>
                </template>
                <template x-if="urlDetail.redirect_url">
                  <div class="text-sm text-dim truncate" :title="urlDetail.redirect_url" x-text="'Redirige a ' + urlDetail.redirect_url"></div>
                </template>
                <!-- La linea de robots.txt que la bloquea (decision 129): es lo
                     que hay que tocar, y sin ella habia que abrir el fichero y
                     repetir a mano la regla mas larga. -->
                <template x-if="urlDetail.robots_regla">
                  <div class="text-sm robots-regla">
                    <template x-for="lado in [['googlebot','Googlebot'],['rastreador','Nuestro rastreo']]" :key="lado[0]">
                      <template x-if="urlDetail.robots_regla[lado[0]]">
                        <div>
                          <span class="text-dim" x-text="lado[1] + ': línea ' + urlDetail.robots_regla[lado[0]].linea + ' de '"></span>
                          <a :href="urlDetail.robots_regla.robots_url" target="_blank" rel="noopener">robots.txt</a>
                          <code x-text="urlDetail.robots_regla[lado[0]].texto"></code>
                          <span class="text-dim" x-text="'(grupo «' + (urlDetail.robots_regla[lado[0]].grupo || '*') + '», línea ' + (urlDetail.robots_regla[lado[0]].linea_grupo ?? '—') + ')'"></span>
                        </div>
                      </template>
                    </template>
                  </div>
                </template>
                <div class="text-sm text-dim" x-text="urlDetail.in_sitemap ? 'En el sitemap' : 'No está en el sitemap'"></div>
                <!-- De qué fichero(s) de sitemap viene y con qué lastmod (decisión 126) -->
                <template x-for="(sm, n) in (urlDetail.sitemaps || [])" :key="'sm' + n">
                  <div class="text-sm text-dim truncate" :title="sm.fichero"
                       x-text="'Sitemap: ' + sm.fichero + (sm.lastmod ? ' · lastmod ' + sm.lastmod : ' · sin lastmod')"></div>
                </template>
              </div>
              <div class="card">
                <div class="veredicto-titulo">
                  Problemas
                  <a href="#" class="text-sm" style="margin-left:auto" x-show="(urlDetail.issues || []).length"
                     @click.prevent="urlDetailTab = 'issues'">ver detalle</a>
                </div>
                <template x-if="!(urlDetail.issues || []).length">
                  <div class="veredicto-valor green">Ninguno</div>
                </template>
                <ul class="veredicto-lista">
                  <template x-for="(i, n) in [...(urlDetail.issues || [])].sort((a, b) => ({error:0,warning:1,info:2}[a.severity] ?? 3) - ({error:0,warning:1,info:2}[b.severity] ?? 3)).slice(0, 5)" :key="n">
                    <li>
                      <span class="sev-chip" :class="'sev-' + i.severity" x-text="fmt.severity(i.severity)"></span>
                      <span x-text="fmt.issue(i.issue_type)" :title="fmt.detalles(i.details)"></span>
                    </li>
                  </template>
                </ul>
                <div class="text-sm text-dim" x-show="(urlDetail.issues || []).length > 5"
                     x-text="'y ' + ((urlDetail.issues || []).length - 5) + ' más'"></div>
              </div>
              <!-- Extraccion a medida (decision 104): lo que dieron las reglas
                   en esta URL. «No evaluada» no es «vacío». -->
              <template x-if="expAMedida.length">
                <div class="card">
                  <div class="veredicto-titulo">Extracción a medida</div>
                  <ul class="veredicto-lista">
                    <template x-for="d in expAMedida" :key="d.key">
                      <li>
                        <strong x-text="d.etiqueta + ': '"></strong>
                        <span x-text="EXP_COLUMN_DEFS[d.key].tip(urlDetail)"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <div class="card">
                <div class="veredicto-titulo">Enlazado interno</div>
                <!-- NULL no siempre es «sin camino»: en un censo analizado antes
                     de la decision 90 la columna no se calculo. -->
                <div class="veredicto-valor" x-text="urlDetail.click_depth != null ? (urlDetail.click_depth === 0 ? 'Es una portada' : 'A ' + urlDetail.click_depth + (urlDetail.click_depth === 1 ? ' clic' : ' clics') + ' de la home') : (stats && stats.click_depth_calculada ? 'Sin camino desde la home' : 'Profundidad sin calcular')"
                     :class="urlDetail.click_depth == null && urlDetail.indexable && stats && stats.click_depth_calculada ? 'orange' : ''"></div>
                <div class="text-sm text-dim" x-show="urlDetail.click_depth == null && !(stats && stats.click_depth_calculada)">
                  Este censo se analizó antes de medir los clics desde la home: hay que volver a analizarlo.</div>
                <div class="text-sm text-dim"
                     x-text="fmt.num(urlDetail.unique_inlinks_count ?? urlDetail.inlinks_count) + ' páginas la enlazan · ' + fmt.num(urlDetail.inlinks_count) + ' enlaces entrantes'"></div>
                <div class="text-sm text-dim" x-show="urlDetail.pagerank_score != null"
                     x-text="'PageRank ' + urlDetail.pagerank_score + ' de 100'"></div>
              </div>
            </div>

            <!-- Mini stats de la URL -->
            <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.ms(urlDetail.response_time_ms)"></div>
                <div class="stat-label">Tiempo</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.bytes(urlDetail.transfer_size || urlDetail.content_length)"></div>
                <div class="stat-label">Tamaño</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.word_count)"></div>
                <div class="stat-label">Palabras</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.inlinks_count)"></div>
                <div class="stat-label">Inlinks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" x-text="fmt.num(urlDetail.outlinks_count)"></div>
                <div class="stat-label">Outlinks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem;color:var(--accent)" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : (urlDetail.pagerank != null ? urlDetail.pagerank.toFixed(2) : '—')"></div>
                <div class="stat-label" data-tip="Importancia de esta página según los enlaces internos que recibe, en escala 0-100 logaritmica anclada al máximo del sitio: cada 25 puntos son diez veces menos autoridad que la página mas fuerte.">PageRank (0-100)</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" style="font-size:1.3rem" :class="urlDetail.issues?.length > 0 ? 'orange' : 'green'"
                  x-text="urlDetail.issues?.length || 0"></div>
                <div class="stat-label">Problemas</div>
              </div>
            </div>

            <!-- Pestanas del detalle de URL -->
            <div class="tabs">
              <button type="button" class="tab" :class="urlDetailTab === 'seo' && 'active'" @click="urlDetailTab = 'seo'">SEO</button>
              <button type="button" class="tab" :class="urlDetailTab === 'content' && 'active'" @click="urlDetailTab = 'content'">
                Contenido <span class="count" x-text="urlDetail.page_content ? fmt.num(urlDetail.page_content.content_length) : '—'"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'headings' && 'active'" @click="urlDetailTab = 'headings'">
                Encabezados <span class="count" x-text="urlDetail.headings?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'links' && 'active'" @click="urlDetailTab = 'links'">
                Enlaces <span class="count" x-text="(urlDetail.inlinks?.length || 0) + (urlDetail.outlinks?.length || 0)"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'resources' && 'active'" @click="urlDetailTab = 'resources'">
                Recursos <span class="count" x-text="urlDetail.resources?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'issues' && 'active'" @click="urlDetailTab = 'issues'">
                Problemas <span class="count" x-text="urlDetail.issues?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'general' && 'active'" @click="urlDetailTab = 'general'">Todos los campos</button>
              <button type="button" class="tab" :class="urlDetailTab === 'security' && 'active'" @click="urlDetailTab = 'security'">Seguridad</button>
              <button type="button" class="tab" :class="urlDetailTab === 'structured' && 'active'" @click="urlDetailTab = 'structured'">
                Datos estr. <span class="count" x-text="urlDetail.structured_data?.length || 0"></span>
              </button>
            </div>

            <!-- ===== TAB: GENERAL ===== -->
            <template x-if="urlDetailTab === 'general'">
              <div class="card">
                <div class="detail-grid">
                  <div class="detail-row"><span class="detail-label">URL</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.url"></span></div>
                  <div class="detail-row"><span class="detail-label">Host</span><span class="detail-value" x-text="urlDetail.host || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Path</span><span class="detail-value" x-text="urlDetail.path || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Scheme</span><span class="detail-value" x-text="urlDetail.scheme || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Interna</span><span class="detail-value" x-text="urlDetail.is_internal ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Clics desde la home</span><span class="detail-value" x-text="urlDetail.click_depth ?? 'sin camino desde la home'"></span></div>
                  <div class="detail-row"><span class="detail-label">Prof. de rastreo</span><span class="detail-value text-dim" x-text="urlDetail.crawl_depth ?? '—'" title="Saltos del rastreador desde la semilla mas cercana (cada semilla es 0, lo del sitemap 1). Es la que limita max_depth, no la que mide Google"></span></div>
                  <div class="detail-row"><span class="detail-label">Código estado</span><span class="detail-value" x-text="(urlDetail.status_code || '—') + ' ' + (urlDetail.status_text || '')"></span></div>
                  <div class="detail-row"><span class="detail-label">Grupo estado</span><span class="detail-value" x-text="urlDetail.status_group || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Content-Type</span><span class="detail-value" x-text="urlDetail.content_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño contenido</span><span class="detail-value" x-text="fmt.bytes(urlDetail.content_length)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño transferencia</span><span class="detail-value" x-text="fmt.bytes(urlDetail.transfer_size)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tiempo respuesta</span><span class="detail-value" x-text="fmt.ms(urlDetail.response_time_ms)"></span></div>
                  <div class="detail-row"><span class="detail-label">Version HTTP</span><span class="detail-value" x-text="urlDetail.http_version || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Es HTML</span><span class="detail-value" x-text="urlDetail.is_html ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tipo recurso</span><span class="detail-value" x-text="urlDetail.resource_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Indexable</span><span class="detail-value" x-text="urlDetail.indexable ? 'Si' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Estado indexabilidad</span><span class="detail-value" x-text="urlDetail.indexability_status || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Respuesta</span><span class="detail-value" :class="['challenge_waf','captcha','rate_limited','respuesta_binaria'].includes(urlDetail.response_class) && 'orange'" x-text="fmt.claseRespuesta(urlDetail.response_class)" title="Si lo que llegó era la página o un muro delante (desafío de un WAF, captcha, límite de peticiones, cuerpo binario). Decisión 103"></span></div>
                  <div class="detail-row"><span class="detail-label">Longitud URL</span><span class="detail-value" x-text="urlDetail.url_length || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Prof. carpetas</span><span class="detail-value" x-text="urlDetail.folder_depth ?? '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Palabras</span><span class="detail-value" x-text="fmt.num(urlDetail.word_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Ratio texto</span><span class="detail-value" x-text="urlDetail.text_ratio != null ? urlDetail.text_ratio.toFixed(1) + '%' : '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Redirección a</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.redirect_url || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tipo redirección</span><span class="detail-value" x-text="urlDetail.redirect_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Last-Modified</span><span class="detail-value" x-text="urlDetail.last_modified || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Inlinks</span><span class="detail-value" x-text="fmt.num(urlDetail.inlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Inlinks únicos</span><span class="detail-value" x-text="fmt.num(urlDetail.unique_inlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks</span><span class="detail-value" x-text="fmt.num(urlDetail.outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks externos</span><span class="detail-value" x-text="fmt.num(urlDetail.external_outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="Escala 0-100 logaritmica anclada al máximo del sitio. Es la que hay que leer y ordenar.">PageRank (0-100)</span><span class="detail-value" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : '—'"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="La escala 0-10 de siempre, aquí solo por compatibilidad con los informes ya entregados.">PageRank (0-10, antiguo)</span><span class="detail-value text-dim" x-text="urlDetail.pagerank != null ? urlDetail.pagerank.toFixed(2) : '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Primera vez</span><span class="detail-value" x-text="fmt.date(urlDetail.first_seen_at)"></span></div>
                  <div class="detail-row"><span class="detail-label">Último rastreo</span><span class="detail-value" x-text="fmt.date(urlDetail.last_crawled_at)"></span></div>
                </div>
              </div>
            </template>

            <!-- ===== TAB: SEO ===== -->
            <template x-if="urlDetailTab === 'seo'">
              <div>
                <template x-if="!urlDetail.html_meta">
                  <div class="empty"><h3>Sin metadatos HTML</h3><p class="text-dim">Esta URL no es HTML o no se pudieron extraer los metadatos</p></div>
                </template>

                <template x-if="urlDetail.html_meta">
                  <div class="seo-sections">
                    <!-- Title -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Title</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.title || '(vacio)'"></div>
                      <div class="seo-meta-row mt-1">
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.title_pixel_width || 0) + 'px SERP'"></span>
                        <template x-if="urlDetail.html_meta.title_len > 60">
                          <span class="badge badge-cancelled">Demasiado largo</span>
                        </template>
                        <template x-if="urlDetail.html_meta.title_len && urlDetail.html_meta.title_len < 30">
                          <span class="badge badge-cancelled">Demasiado corto</span>
                        </template>
                      </div>
                    </div>

                    <!-- Meta Description -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Meta Description</h3>
                      <div class="seo-value-box" x-text="urlDetail.html_meta.meta_description || '(vacio)'"></div>
                      <div class="seo-meta-row mt-1">
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_len || 0) + ' caracteres'"></span>
                        <span class="badge badge-pending" x-text="(urlDetail.html_meta.meta_description_pixel_width || 0) + 'px SERP'"></span>
                      </div>
                    </div>

                    <!-- Meta Keywords -->
                    <template x-if="urlDetail.html_meta.meta_keywords">
                      <div class="card mb-2">
                        <h3 class="seo-section-title">Meta Keywords</h3>
                        <div class="seo-value-box" x-text="urlDetail.html_meta.meta_keywords"></div>
                      </div>
                    </template>

                    <!-- Directivas -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Directivas</h3>
                      <div class="detail-grid" style="grid-template-columns:1fr 1fr">
                        <div class="detail-row"><span class="detail-label">Meta Robots</span><span class="detail-value" x-text="urlDetail.html_meta.meta_robots || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">X-Robots-Tag</span><span class="detail-value" x-text="urlDetail.html_meta.x_robots_tag || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.canonical_href || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Canonical (header)</span><span class="detail-value" x-text="urlDetail.html_meta.canonical_header || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Meta Refresh</span><span class="detail-value" x-text="urlDetail.html_meta.meta_refresh || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">Meta fuera de head</span><span class="detail-value" x-text="urlDetail.html_meta.has_meta_outside_head ? 'Si' : 'No'"></span></div>
                        <div class="detail-row"><span class="detail-label">rel=next</span><span class="detail-value" x-text="urlDetail.html_meta.rel_next || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">rel=prev</span><span class="detail-value" x-text="urlDetail.html_meta.rel_prev || '—'"></span></div>
                      </div>
                    </div>

                    <!-- Open Graph -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Open Graph</h3>
                      <div class="detail-grid" style="grid-template-columns:1fr 1fr">
                        <div class="detail-row"><span class="detail-label">og:title</span><span class="detail-value" x-text="urlDetail.html_meta.og_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:description</span><span class="detail-value" x-text="urlDetail.html_meta.og_description || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:image</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.og_image || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:url</span><span class="detail-value" style="word-break:break-all" x-text="urlDetail.html_meta.og_url || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">og:type</span><span class="detail-value" x-text="urlDetail.html_meta.og_type || '—'"></span></div>
                      </div>
                    </div>

                    <!-- Twitter Cards -->
                    <div class="card mb-2">
                      <h3 class="seo-section-title">Twitter Cards</h3>
                      <div class="detail-grid" style="grid-template-columns:1fr 1fr">
                        <div class="detail-row"><span class="detail-label">twitter:card</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_card || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:title</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_title || '—'"></span></div>
                        <div class="detail-row"><span class="detail-label">twitter:description</span><span class="detail-value" x-text="urlDetail.html_meta.twitter_description || '—'"></span></div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: CONTENIDO ===== -->
            <template x-if="urlDetailTab === 'content'">
              <div class="card">
                <template x-if="urlDetail.page_content">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Contenido principal extraido</h3>
                      <div class="flex items-center gap-1">
                        <span class="badge badge-pending" x-text="fmt.num(urlDetail.page_content.content_length) + ' caracteres'"></span>
                        <button class="btn btn-sm" :class="contentViewMode === 'markdown' ? 'btn-primary' : ''"
                          @click="contentViewMode = contentViewMode === 'markdown' ? 'text' : 'markdown'"
                          x-text="contentViewMode === 'markdown' ? 'Ver texto plano' : 'Ver Markdown'"></button>
                      </div>
                    </div>
                    <!-- Markdown rendered view -->
                    <template x-if="contentViewMode === 'markdown' && urlDetail.page_content.content_markdown">
                      <div class="markdown-body" style="max-height:600px;overflow-y:auto"
                        x-html="renderMarkdown(urlDetail.page_content.content_markdown)"></div>
                    </template>
                    <!-- Plain text fallback -->
                    <template x-if="contentViewMode !== 'markdown' || !urlDetail.page_content.content_markdown">
                      <div class="content-preview" style="max-height:600px" x-text="urlDetail.page_content.content_text"></div>
                    </template>
                  </div>
                </template>
                <template x-if="!urlDetail.page_content">
                  <div class="empty">
                    <h3>Sin contenido</h3>
                    <p class="text-dim">No se pudo extraer el contenido principal de esta página</p>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===== TAB: ENCABEZADOS ===== -->
            <template x-if="urlDetailTab === 'headings'">
              <div class="card">
                <template x-if="urlDetail.headings && urlDetail.headings.length > 0">
                  <div>
                    <div class="flex items-center justify-between mb-2">

                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_mixed_content ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_mixed_content ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin contenido mixto</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_hsts ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_hsts ? '&#10003;' : '&#10007;'"></span>
                        <span>Strict-Transport-Security (HSTS)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_csp ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_csp ? '&#10003;' : '&#10007;'"></span>
                        <span>Content-Security-Policy (CSP)</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_content_type_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_content_type_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Content-Type-Options</span>
                      </div>
                      <div class="security-item" :class="urlDetail.security.has_x_frame_options ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="urlDetail.security.has_x_frame_options ? '&#10003;' : '&#10007;'"></span>
                        <span>X-Frame-Options</span>
                      </div>
                      <div class="security-item" :class="!urlDetail.security.has_unsafe_crossorigin ? 'check-pass' : 'check-fail'">
                        <span class="check-icon" x-text="!urlDetail.security.has_unsafe_crossorigin ? '&#10003;' : '&#10007;'"></span>
                        <span>Sin crossorigin inseguro</span>

                          <span class="check-icon">&#10003;</span>

                    <div class="flex items-center justify-between mb-2">
                      <h3 class="seo-section-title" style="margin:0">Datos estructurados</h3>
                      <span class="text-dim text-sm" x-text="urlDetail.structured_data.length + ' bloques'"></span>
                    </div>
                    <div class="structured-list">
                      <template x-for="s in urlDetail.structured_data" :key="s.id">
                        <div class="structured-item card mb-1" style="padding:.75rem">
                          <div class="flex items-center gap-1 mb-1">
                            <span class="badge badge-pending" x-text="s.format"></span>
                            <span class="badge" :class="({ok: 'badge-completed', error: 'badge-failed', warning: 'badge-cancelled', info: 'badge-info'})[s.validation_status] || 'badge-pending'"

                            <template x-if="s.schema_type">
                              <span style="font-weight:500" x-text="s.schema_type"></span>
                            </template>
                          </div>
                          <template x-if="s.raw">
                            <div class="content-preview" style="max-height:200px;font-size:.75rem" x-text="JSON.stringify(s.raw, null, 2)"></div>

    <!-- ============================================================ -->

    <template x-if="view === 'explorer' && job">
      <div class="explorer">

        <!-- Sidebar -->
        <div class="exp-sidebar">
          <div class="exp-sidebar-header">
            <i data-lucide="table-2" style="width:14px;height:14px;color:var(--accent)"></i>
            Explorador
          </div>
          <!-- Vistas guardadas del cliente (#131) -->
          <template x-if="job.cliente_id">
            <div class="exp-vistas">
              <div class="exp-sidebar-titulo" style="border-top:0;margin-top:0">Vistas de <span x-text="job.cliente_nombre || 'este cliente'"></span></div>
              <template x-for="v in expVistas" :key="v.id">
                <div class="exp-vista">
                  <button type="button" class="exp-tab" @click="abrirVista(v)" :title="v.nombre">
                    <i data-lucide="bookmark" class="exp-tab-icon"></i><span class="truncate" x-text="v.nombre"></span>
                  </button>
                  <button type="button" class="exp-vista-borrar" @click="borrarVista(v)" :aria-label="'Borrar la vista ' + v.nombre" title="Borrar">&times;</button>
                </div>
              </template>
              <button type="button" class="exp-tab exp-vista-nueva" @click="guardarVista()">
                <i data-lucide="bookmark-plus" class="exp-tab-icon"></i><span>Guardar esta vista</span>
              </button>
            </div>
          </template>
          <div class="exp-sidebar-group">
            <template x-for="tab in EXP_TABS" :key="tab.key">
              <div>
                <template x-if="tab.divider">
                  <div class="exp-divider"></div>
                </template>
                <template x-if="tab.header">
                  <div class="exp-sidebar-titulo" x-text="tab.header"></div>
                </template>
                <template x-if="!tab.divider && !tab.header && (!tab.requiere || expAMedida.length)">

                    <i :data-lucide="tab.icon" class="exp-tab-icon"></i>
                    <span x-text="tab.label"></span>
                    <template x-if="!tab.ambito">
                      <span class="exp-tab-badge" x-text="expBadgeCounts[tab.key] != null ? fmt.num(expBadgeCounts[tab.key]) : ''"></span>
                    </template>
                    <template x-if="tab.ambito">
                      <span class="exp-tab-punto" :class="'p-' + gravedadDelAmbito(tab)"
                            :title="({error:'Hay errores', warning:'Hay avisos', info:'Solo info', ok:'Sin problemas'})[gravedadDelAmbito(tab)] || ''"></span>
                    </template>
                  </button>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- Main area -->
        <div class="exp-main">

          <!-- Toolbar -->
          <div class="exp-toolbar">
            <button class="exp-back" @click="backFromExplorer()">

            </button>
            <div class="exp-search-wrap">
              <i data-lucide="search"></i>
              <input type="text" class="exp-search" placeholder="Buscar URL o título..." x-model="expSearch" @input="explorerSearchInput()">
            </div>
            <!-- «Con el problema…» (docs/INVESTIGACION_EXPLORADOR.md): el puente con
                 Problemas. El servidor ya filtraba /urls por issue_type y la
                 interfaz no lo ofrecia. -->
            <select class="exp-problema" :class="(expProblema || expGravedad) && 'has-value'" aria-label="Filtrar por problema"
                    @focus="!issuesResumen && loadIssuesResumen()"
                    @change="setExpProblema($event.target.value)">
              <option value="" :selected="!expValorProblema()">Con cualquier problema o ninguno</option>
              <option value="sev:error" :selected="expValorProblema() === 'sev:error'">Con algún error</option>
              <option value="sev:warning" :selected="expValorProblema() === 'sev:warning'">Con algún aviso</option>
              <template x-for="g in [['error','Errores'],['warning','Avisos'],['info','Info']]" :key="g[0]">
                <optgroup :label="g[1]">
                  <template x-for="r in resumenIssues(g[0])" :key="r.issue_type">
                    <option :value="r.issue_type" :selected="expProblema === r.issue_type"

                  </template>
                </optgroup>
              </template>
              <!-- Si se llega con un problema y aun no hay resumen cargado, que se vea cual. -->
              <template x-if="expProblema && !(issuesResumen || []).some(r => r.issue_type === expProblema)">
                <option :value="expProblema" selected x-text="expProblema.split(',').map(fmt.issue).join(', ')"></option>
              </template>
            </select>
            <span class="exp-results-count" x-text="fmt.num(expTotal) + ' resultados'"></span>
            <!-- Agrupar por plantilla (#131): la unidad de trabajo del SEO tecnico. -->
            <button class="exp-toolbar-btn" :class="expAgrupar && expAgruparPor === 'plantilla' && 'active'" @click="alternarAgrupar('plantilla')"
                    :aria-pressed="expAgrupar && expAgruparPor === 'plantilla'" data-tip="Agrupa las URLs de esta vista por la forma de su ruta">
              <i data-lucide="layers" style="width:13px;height:13px"></i>
              <span>Por plantilla</span>
            </button>
            <!-- Segmentos de negocio (decision 125): los de las reglas del

            <button class="exp-toolbar-btn" :class="expAgrupar && expAgruparPor === 'segmento' && 'active'" @click="alternarAgrupar('segmento')"

              <span>Por segmento</span>
            </button>

                  </template>
                </optgroup>
              </template>
              <optgroup label="Sin regla: forma de la ruta">
                <template x-for="g in segmentosParaElegir().forma" :key="g.segmento">
                  <option :value="g.segmento" :selected="expSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls)"></option>
                </template>
              </optgroup>
              <template x-if="expSegmento && !((segmentosJob && segmentosJob.segmentos) || []).some(g => g.segmento === expSegmento)">
                <option :value="expSegmento" selected x-text="expSegmento"></option>

            <template x-if="expPlantilla">
