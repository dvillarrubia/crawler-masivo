                    <div class="text-dim" style="font-size:.75rem;margin:.25rem 0 .5rem"
                         x-show="enriqIntencion.resumen && enriqIntencion.resumen.aviso_cobertura"
                         x-text="enriqIntencion.resumen && enriqIntencion.resumen.aviso_cobertura"></div>
                    <div class="text-dim" style="font-size:.75rem;margin:.25rem 0 .5rem"
                         x-show="enriqIntencion.resumen && enriqIntencion.resumen.busquedas_sin_clics_hoy"
                         x-text="enriqIntencion.resumen && (fmt.num(enriqIntencion.resumen.busquedas_sin_clics_hoy) + ' búsquedas preguntadas ya no tienen clics en Search Console (se han borrado o rehecho esos días): salen sin clics y no pesan.')"></div>
                    <template x-if="enriqIntencion.resumen">
                      <div style="font-size:.82rem">
                        <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.paginas_comparadas)"></strong> páginas comparadas</span>
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.desalineadas)"></strong> desalineadas</span>
                          <span><strong x-text="fmt.num(enriqIntencion.resumen.clics_desalineados)"></strong> de
                            <span x-text="fmt.num(enriqIntencion.resumen.clics_que_cuentan)"></span> clics con otra intención</span>
                          <span class="text-dim" x-show="enriqIntencion.resumen.paginas_sin_intencion"
                                x-text="fmt.num(enriqIntencion.resumen.paginas_sin_intencion) + ' sin intención de página'"></span>
                        </div>
                        <div class="text-dim" style="margin-top:.3rem">
                          Clics por intención de la búsqueda:
                          <template x-for="[i, n] in Object.entries(enriqIntencion.resumen.clics_por_intencion).sort((a, b) => b[1] - a[1])" :key="i">
                            <span x-text="fmt.respuestaEnriq(i) + ' ' + fmt.num(n) + ' · '"></span>
                          </template>
                        </div>
                        <div style="overflow-x:auto;margin-top:.5rem" x-show="enriqIntencion.paginas.length">
                          <table>
                            <thead><tr><th style="text-align:left">URL</th><th>página</th><th>búsquedas (más clics)</th><th style="text-align:right">clics con otra intención</th><th style="text-align:right">alineado</th></tr></thead>
                            <tbody>
                              <template x-for="p in enriqIntencion.paginas" :key="p.url_id">
                                <tr :style="p.desalineada ? 'background:var(--orange-bg, rgba(255,165,0,.08))' : ''">
                                  <td style="max-width:24rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="p.url"></td>
                                  <td x-text="p.intencion_pagina ? fmt.respuestaEnriq(p.intencion_pagina) : '—'"></td>
                                  <td style="max-width:22rem;font-size:.75rem"
                                      x-text="p.busquedas.slice(0, 3).map(b => (b.busqueda || '—') + ' (' + (b.intencion ? fmt.respuestaEnriq(b.intencion) : '—') + ', ' + (b.clics == null ? 'sin clics hoy' : b.clics) + ')').join(' · ')"></td>
                                  <td style="text-align:right" x-text="fmt.num(p.clics_desalineados)"></td>
                                  <td style="text-align:right" :title="fmt.sinAfirmarEnriq(p.sin_afirmar)"
                                      x-text="['pagina_de_marca', 'manda_la_marca'].includes(p.sin_afirmar) ? 'marca' : (p.parte_alineada == null ? '—' : Math.round(100 * p.parte_alineada) + '%')"></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </template>
                    <template x-if="enriqIntencion.embudo">
                      <div style="font-size:.82rem;margin-top:.6rem">
                        <strong style="font-size:.85rem">Embudo con tráfico real</strong>
                        <div style="display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.3rem">
                          <template x-for="[e, v] in Object.entries(enriqIntencion.embudo.por_etapa)" :key="e">
                            <span><strong x-text="fmt.respuestaEnriq(e)"></strong>
                              <span x-text="fmt.num(v.paginas) + ' páginas, ' + fmt.num(v.clics) + ' clics'"></span></span>
                          </template>
                        </div>
                        <div class="text-dim" style="margin-top:.3rem;font-size:.75rem">
                          Por plantilla (clics de la página en Search Console):
                          <template x-for="pl in enriqIntencion.embudo.por_plantilla.slice(0, 8)" :key="pl.plantilla">
                            <div x-text="pl.plantilla + ': ' + Object.entries(pl.clics_por_etapa).map(([e, n]) => fmt.respuestaEnriq(e) + ' ' + fmt.num(n)).join(', ')"></div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="enriqDecisiones">
                  <div class="card">
                    <div class="text-dim" style="font-size:.8rem;margin-bottom:.4rem"
                         x-text="fmt.num(enriqDecisiones.total) + ' respuestas' + (enriqFiltro.respuesta ? ' «' + etiquetaEnriq(enriqFiltro.pregunta, enriqFiltro.respuesta) + '»' : '')"></div>
                    <div style="overflow-x:auto">
                      <table>
                        <thead><tr><th style="text-align:left">URL</th><th style="text-align:left" x-show="enriqDecisiones.items.some(d => d.busqueda)">búsqueda</th><th>respuesta</th><th>estado</th><th>confianza</th><th>origen</th><th style="text-align:right">coste</th></tr></thead>
                        <tbody>
                          <template x-for="d in enriqDecisiones.items" :key="d.id">
                            <tr>
                              <td style="max-width:32rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="d.url"></td>
                              <td x-show="enriqDecisiones.items.some(x => x.busqueda)">
                                <div x-text="d.busqueda || '—'"></div>
                                <div class="text-dim" style="font-size:.72rem" x-show="d.rutas" x-text="(d.rutas || []).join(' · ')"></div>
                              </td>
                              <td x-text="textoDecisionEnriq(d)"></td>
                              <td x-text="estadoUnaEnriq(d.estado)"></td>
                              <td x-text="d.confianza == null ? '—' : (100 * d.confianza).toFixed(0) + '%'"></td>
                              <td x-text="d.origen"></td>
                              <td style="text-align:right" x-text="fmt.usd(d.coste_usd)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem" x-show="enriqDecisiones.total > enriqDecisiones.page_size">
                      <button class="btn btn-sm" :disabled="enriqFiltro.page <= 1" @click="enriqFiltro.page--; cargarDecisionesEnriq()">Anterior</button>
                      <button class="btn btn-sm" :disabled="enriqFiltro.page * enriqDecisiones.page_size >= enriqDecisiones.total" @click="enriqFiltro.page++; cargarDecisionesEnriq()">Siguiente</button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: COMPARAR ===== -->
        <template x-if="detailTab === 'diff'">
          <div>
            <div class="card" style="margin-bottom:1rem">
              <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
                <span style="font-size:.85rem">Comparar con:</span>
                <!-- Censos comparables primero; las pruebas pequenas aparte
                     (UX-12): comparar un censo de 5.000 URLs con un canario de
                     26 no dice nada de lo que ha cambiado. -->
                <select @change="diffOtro = $el.value; cargarDiff()" style="padding:.35rem .5rem;font-size:.85rem;max-width:34rem">
                  <option value="">— elige otro rastreo del mismo sitio —</option>
                  <optgroup label="Censos de tamaño parecido">
                    <template x-for="j in candidatosDiff(true)" :key="j.id">
                      <option :value="j.id" :selected="j.id === diffOtro"
                              x-text="(j.id === (job.comparacion || {}).comparado_con ? '★ ' : '') + j.name + '  ·  ' + fmt.num(j.total_urls_crawled) + ' URLs  ·  ' + fmt.dia(j.created_at)"></option>
                    </template>
                  </optgroup>
                  <optgroup label="Rastreos de prueba o parciales">
                    <template x-for="j in candidatosDiff(false)" :key="j.id">
                      <option :value="j.id" :selected="j.id === diffOtro"
                              x-text="j.name + '  ·  ' + fmt.num(j.total_urls_crawled) + ' URLs  ·  ' + fmt.dia(j.created_at)"></option>
                    </template>
                  </optgroup>
                </select>
                <span x-show="diffCargando" class="text-dim" style="font-size:.8rem">comparando…</span>
              </div>
              <div x-show="job.comparacion && job.comparacion.comparado_con === diffOtro" class="text-dim" style="font-size:.8rem;margin-top:.5rem">
                ★ Es el censo con el que se comparó automáticamente al terminar el rastreo.
              </div>
              <div x-show="!diffCandidatos.length" class="text-dim" style="font-size:.8rem;margin-top:.5rem">
                No hay otro rastreo completado del mismo sitio con el que comparar.
              </div>
              <!-- Migracion (decision 131): sin decirle como se corresponden
                   las rutas viejas con las nuevas, una migracion se lee como
                   «han desaparecido 3.000 paginas y han aparecido 3.000». -->
              <div style="margin-top:.6rem">
                <label style="font-size:.8rem;display:inline-flex;gap:.35rem;align-items:center">
                  <input type="checkbox" id="diff-migracion" x-model="diffMigracion"> Es una migración: mapear URLs del censo anterior
                </label>
              </div>
              <div x-show="diffMigracion" style="margin-top:.5rem;max-width:44rem">
                <label style="font-size:.8rem;display:flex;gap:.35rem;align-items:center;margin-bottom:.45rem">
                  <input type="checkbox" x-model="diffOtrosSitios" @change="cargarCandidatosDiff()"> Ofrecer rastreos de otros sitios (cambio de dominio)
                </label>
                <label style="font-size:.8rem;display:block;margin-bottom:.45rem">Host (opcional): <code>viejo.com=nuevo.com</code>, separados por comas
                  <input type="text" id="diff-map-host" x-model="diffMapHost" placeholder="www.viejo.com=www.nuevo.com"
                         style="width:100%;padding:.3rem .45rem;font-size:.85rem;font-family:monospace">
                </label>
                <label style="font-size:.8rem;display:block;margin-bottom:.45rem">Rutas: una regla por línea, <code>patrón =&gt; reemplazo</code> (regex de Python sobre la ruta y la query; gana la primera que casa)
                  <textarea id="diff-map-rutas" x-model="diffMapRutas" rows="3"
                            placeholder="^/es/hoteles/([^/]+)\.html$ => /es/hotel/\1/"
                            style="width:100%;padding:.3rem .45rem;font-size:.85rem;font-family:monospace"></textarea>
                </label>
                <div><button class="btn btn-sm" id="diff-aplicar-mapeo" @click="cargarDiff()" :disabled="!diffOtro || diffCargando">Comparar con el mapeo</button></div>
              </div>
            </div>

            <template x-if="diff && !diff.comparable">
              <div class="card" style="border-left:3px solid var(--red)">
                <strong>No se pueden comparar</strong>
                <div style="margin-top:.35rem;font-size:.85rem" x-text="diff.motivo"></div>
              </div>
            </template>

            <template x-if="diff && diff.comparable">
              <div>
                <div class="text-dim" style="font-size:.8rem;margin-bottom:.6rem"
                     x-show="diff.antes && diff.ahora">
                  Antes: <strong x-text="(diff.antes.fecha || '').slice(0,10)"></strong>
                  <span x-text="diff.antes.nombre"></span>
                  · Ahora: <strong x-text="(diff.ahora.fecha || '').slice(0,10)"></strong>
                  <span x-text="diff.ahora.nombre"></span>
                </div>
                <template x-for="aviso in diff.avisos" :key="aviso">
                  <div class="card" style="border-left:3px solid var(--orange);margin-bottom:.75rem">
                    <div style="font-size:.85rem" x-text="aviso"></div>
                  </div>
                </template>

                <!-- Las alertas primero: un cambio que afecta a una parte
                     grande de las indexables no es trabajo editorial. -->
                <template x-for="al in (diff.alertas || [])" :key="al.regla + (al.extraccion || '')">
                  <div class="card"
                       :style="'margin-bottom:.75rem;border-left:3px solid ' + fmt.colorSeveridad(al.severidad)">
                    <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline">
                      <strong x-text="fmt.tituloAlerta(al)"></strong>
                      <span style="white-space:nowrap;font-variant-numeric:tabular-nums">
                        <strong x-text="fmt.num(al.paginas)"></strong>
                        <span class="text-dim" x-text="' de ' + fmt.num(al.de) + ' · ' + al.pct + '%'"></span>
                      </span>
                    </div>
                    <div style="font-size:.85rem;margin-top:.35rem" x-text="al.que_decide_google"></div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.35rem"
                         x-show="fmt.detalleAlerta(al)" x-text="fmt.detalleAlerta(al)"></div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.4rem"
                         x-show="al.por === 'plantilla' || al.por === 'segmento'"
                         x-text="'Diluido en el total del sitio: salta por ' + al.por + '.'"></div>
                    <!-- Segmentos de negocio primero (decision 127). Si un
                         segmento son exactamente las paginas de una plantilla,
                         sale una vez, aqui, con la plantilla al lado. -->
                    <template x-for="sg in (al.segmentos || []).slice(0,4)" :key="'s' + sg.segmento">
                      <div class="text-dim" style="font-size:.78rem;margin-left:.6rem">
                        <strong x-text="sg.segmento"></strong>
                        <span x-text="' ' + fmt.num(sg.paginas) + '/' + fmt.num(sg.de) + ' = ' + sg.pct + '%'"></span>
                        <span x-show="sg.plantilla"> · plantilla <code x-text="sg.plantilla"></code></span>
                      </div>
                    </template>
                    <template x-for="pl in (al.plantillas || []).slice(0,4)" :key="pl.plantilla">
                      <div class="text-dim" style="font-size:.78rem;margin-left:.6rem">
                        <code x-text="pl.plantilla"></code>
                        <span x-text="' ' + fmt.num(pl.paginas) + '/' + fmt.num(pl.de) + ' = ' + pl.pct + '%'"></span>
                      </div>
                    </template>
                    <template x-for="e in al.ejemplos.slice(0,3)" :key="e.url">
                      <div class="text-dim" style="font-size:.75rem;margin-left:.6rem;margin-top:.15rem">
                        <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                        <span x-show="e.ahora !== undefined">: <s x-text="String(e.antes ?? '—').slice(0,36)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,36)"></strong></span>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="diff.mapeo_rutas">
                  <div class="card mb-2" id="diff-mapeo-resultado">
                    <div class="text-sm">
                      <strong>Mapeo de rutas:</strong>
                      <strong x-text="fmt.num(diff.mapeo_rutas.emparejadas)"></strong> de
                      <span x-text="fmt.num(diff.mapeo_rutas.urls_del_anterior)"></span> URLs del censo anterior emparejadas
                      (<strong x-text="diff.mapeo_rutas.pct_emparejadas + '%'"></strong>);
                      <span x-text="fmt.num(diff.mapeo_rutas.reescritas)"></span> reescritas por el mapeo, de las que casan
                      <span x-text="fmt.num(diff.mapeo_rutas.reescritas_emparejadas)"></span>.
                    </div>
                    <template x-for="(rg, i) in diff.mapeo_rutas.reglas" :key="'mr' + i">
                      <div class="text-dim" style="font-size:.78rem;margin-left:.6rem">
                        <code x-text="rg.patron"></code> → <code x-text="rg.reemplazo"></code>:
                        <span x-text="fmt.num(rg.reescritas) + ' URLs'"></span>
                      </div>
                    </template>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.3rem" x-show="diff.mapeo_rutas.colisiones"
                         x-text="fmt.num(diff.mapeo_rutas.colisiones) + ' URLs viejas caen en la misma URL nueva que otra: solo una de cada grupo entra en la comparación.'"></div>
                  </div>
                </template>

                <div class="stats-grid" style="margin-bottom:1rem">
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(diff.urls.en_ambos)"></div>
                    <div class="stat-label">en los dos</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(diff.urls.nuevas)"></div>
                    <div class="stat-label">nuevas</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value"
                         x-text="diff.urls.desaparecidas === null ? '—' : fmt.num(diff.urls.desaparecidas)"></div>
                    <div class="stat-label" x-text="diff.urls.desaparecidas === null ? 'desaparecidas (no afirmable)' : 'desaparecidas'"></div>
                  </div>
                </div>

                <!-- Extraccion a medida (decision 127): regla a regla, lo
                     comparado y lo que no se pudo comparar. Sin fila en uno
                     de los dos censos no es un cambio (decision 104). -->
                <template x-if="diff.extraido && ((diff.extraido.reglas || []).length || (diff.extraido.no_comparadas || []).length)">
                  <div class="card mb-2">
                    <div class="text-sm"><strong>Extracción a medida</strong></div>
                    <template x-for="rg in diff.extraido.reglas" :key="rg.nombre">
                      <div class="text-sm" style="margin-top:.35rem">
                        <strong x-text="'«' + rg.nombre + '»'"></strong>
                        <span x-text="' ' + fmt.num(rg.comparadas) + ' páginas comparadas · '
                          + Object.entries(rg.cambios).map(([k, v]) => fmt.reglaDiff(k).toLowerCase() + ': ' + fmt.num(v.total)).join(' · ')"></span>
                        <span class="text-dim" x-show="rg.sin_dato || rg.sin_saber || rg.render_distinto"
                              x-text="' · sin dato en uno de los dos: ' + fmt.num(rg.sin_dato) + ' · no se pudo evaluar: ' + fmt.num(rg.sin_saber)
                                + (rg.render_distinto ? ' · uno con render y otro sin: ' + fmt.num(rg.render_distinto) : '')"></span>
                      </div>
                    </template>
                    <template x-for="nc in (diff.extraido.no_comparadas || [])" :key="'nc' + nc.nombre">
                      <div class="text-dim" style="font-size:.78rem;margin-top:.25rem"
                           x-text="'«' + nc.nombre + '» no se compara: ' + nc.motivo"></div>
                    </template>
                  </div>
                </template>

                <!-- Que se arreglo, que aparecio y que sigue (#32). Comparar
                     paginas no contesta "que arreglo el cliente desde la
                     auditoria anterior", que es para lo que se mira un
                     seguimiento mensual. -->
                <!-- Dos censos analizados con codigo distinto no se comparan
                     por incidencias: un hallazgo puede salir "resuelto" solo
                     porque la regla que lo emitia ha cambiado. Se dice, con
                     el motivo y como arreglarlo. -->
                <!-- Si el censo anterior se volvio a analizar para poder
                     comparar, se dice: sus cifras guardadas han cambiado y
                     quien viera un informe suyo tiene derecho a saberlo. -->
                <template x-if="diff.anterior_reanalizado">
                  <div class="card mb-2" style="border-left:3px solid var(--blue,#2979b5)">
                    <div class="text-sm">
                      El rastreo anterior se ha <strong>vuelto a analizar</strong> con
                      el codigo de hoy para poder comparar las incidencias. Sus
                      cifras han cambiado respecto a lo que se viera antes.
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable === false">
                  <div class="card mb-2" style="border-left:3px solid var(--muted,#6b7280)">
                    <div class="text-sm">
                      <strong>No se pueden comparar las incidencias.</strong>
                      <span x-text="diff.incidencias.motivo"></span>
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable !== false">
                  <div class="stats-grid" style="margin-bottom:1rem">
                    <div class="stat-card" style="border-top:2px solid var(--green,#2e8b57)">
                      <div class="stat-value"
                           x-text="diff.incidencias.resueltas ? fmt.num(diff.incidencias.resueltas.total) : '—'"></div>
                      <div class="stat-label"
                           x-text="diff.incidencias.resueltas ? 'resueltas' : 'resueltas (no afirmable)'"></div>
                    </div>
                    <div class="stat-card" style="border-top:2px solid var(--red,#d32f2f)">
                      <div class="stat-value" x-text="fmt.num(diff.incidencias.nuevas.total)"></div>
                      <div class="stat-label">nuevas</div>
                      <!-- Decision 131: en una URL que ya estaba es algo que se
                           ha roto; en una URL nueva, algo publicado mal. -->
                      <div class="text-dim" style="font-size:.75rem;margin-top:.2rem" id="diff-nuevas-reparto"
                           x-show="diff.incidencias.nuevas.en_url_existente"
                           x-text="diff.incidencias.nuevas.en_url_existente ? fmt.num(diff.incidencias.nuevas.en_url_existente.total) + ' en URLs que ya existían · '
                             + fmt.num(diff.incidencias.nuevas.en_url_nueva.total)
                             + (diff.incidencias.nuevas.url_nueva_afirmable ? ' en URLs nuevas' : ' en URLs que el anterior no vio (estaba truncado)') : ''"></div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-value" x-text="fmt.num(diff.incidencias.siguen.total)"></div>
                      <div class="stat-label">siguen</div>
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable !== false">
                  <div class="card" style="margin-bottom:1rem">
                    <table style="width:100%;font-size:.85rem">
                      <thead><tr>
                        <th style="text-align:left">incidencias por tipo</th>
                        <th style="text-align:right;width:6rem">resueltas</th>
                        <th style="text-align:right;width:6rem">nuevas</th>
                        <th style="text-align:right;width:9rem" x-show="diff.incidencias.nuevas.en_url_existente"
                            title="De las nuevas, cuántas en URLs que ya estaban en el censo anterior (regresiones) y cuántas en URLs nuevas">en URL existente / nueva</th>
                        <th style="text-align:right;width:6rem">siguen</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="t in tiposDeIncidencia()" :key="t.tipo">
                          <tr>
                            <td>
                              <span x-text="fmt.issue(t.tipo)"></span>
                              <span class="text-dim" style="font-size:.75rem"
                                    x-text="' · ' + fmt.severity(t.severidad)"></span>
                            </td>
                            <td style="text-align:right;color:var(--green,#2e8b57)"
                                x-text="t.resueltas || ''"></td>
                            <td style="text-align:right;color:var(--red,#d32f2f)"
                                x-text="t.nuevas || ''"></td>
                            <td style="text-align:right" class="text-dim" x-show="diff.incidencias.nuevas.en_url_existente"
                                x-text="t.nuevas && nuevasPorUrl(t.tipo) ? nuevasPorUrl(t.tipo).existente + ' / ' + nuevasPorUrl(t.tipo).nueva : ''"></td>
                            <td style="text-align:right" class="text-dim"
                                x-text="t.siguen || ''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.5rem"
                         x-show="diff.incidencias.sin_pagina_en_el_nuevo">
                      <span x-text="fmt.num(diff.incidencias.sin_pagina_en_el_nuevo)"></span>
                      incidencias mas estaban en páginas que este rastreo no ha
                      visitado: no se sabe si se arreglaron.
                    </div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.5rem"
                         x-show="diff.incidencias.resueltas_no_afirmables">
                      <span x-text="fmt.num(diff.incidencias.resueltas_no_afirmables)"></span>
                      incidencias no aparecen ahora, pero el censo anterior esta
                      truncado: pueden no haberse resuelto, sino no haberse visto.
                    </div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.5rem"
                         x-show="diff.incidencias.no_afirmables_por_muestra?.total">
                      <span x-text="fmt.num(diff.incidencias.no_afirmables_por_muestra?.total)"></span>
                      avisos de accesibilidad aparecen o faltan en una plantilla
                      que uno de los dos censos no paso por axe: no se cuentan
                      como nuevos ni como resueltos.
                    </div>
                  </div>
                </template>

                <div class="card">
                  <table style="width:100%;font-size:.85rem">
                    <thead><tr><th style="text-align:left">que cambio</th><th style="text-align:right;width:7rem">páginas</th></tr></thead>
                    <tbody>
                      <template x-for="[campo, v] in Object.entries(diff.cambios)" :key="campo">
                        <tr :style="v.total ? '' : 'opacity:.45'">
                          <td>
                            <div x-text="fmt.campoDiff(campo)"></div>
                            <!-- Sin el dato en los dos censos, o con el grafo
                                 incompleto, «0» mentiria: se dice por que no. -->
                            <div class="text-dim" style="font-size:.75rem;margin-left:.6rem" x-show="v.total === null" x-text="'No se compara: ' + (v.motivo || '')"></div>
                            <template x-for="e in v.ejemplos.slice(0,3)" :key="e.url">
                              <div class="text-dim" style="font-size:.75rem;margin-left:.6rem">
                                <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                                <span x-show="campo !== 'word_count' && !e.pierde">: <s x-text="String(e.antes ?? '—').slice(0,40)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,40)"></strong></span>
                                <span x-show="campo === 'word_count'">: <s x-text="e.antes"></s> → <strong x-text="e.ahora"></strong> palabras</span>
                                <span x-show="e.pierde" x-text="(e.pierde && e.pierde.length ? ': pierde ' + e.pierde.join(', ') : '') + (e.gana && e.gana.length ? (e.pierde && e.pierde.length ? ' · ' : ': ') + 'gana ' + e.gana.join(', ') : '')"></span>
                              </div>
                            </template>
                          </td>
                          <td style="text-align:right;vertical-align:top" x-text="v.total === null ? '—' : fmt.num(v.total)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: RESUMEN ===== -->
        <template x-if="detailTab === 'overview' && stats">
          <div class="overview-grid">
            <div class="card">
              <div class="card-header"><h2>Códigos de estado</h2></div>
              <template x-if="stats.urls_by_status_group.length === 0">
                <div class="text-dim text-sm">Sin datos todavía</div>
              </template>
              <div class="bar-chart">
                <template x-for="s in stats.urls_by_status_group" :key="s.status_group">
                  <div class="bar-row">
                    <div class="bar-label" x-text="s.status_group"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (s.count / maxStatusCount() * 100) + '%;background:' + barColor(s.status_group)"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(s.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card" x-init="cargarPrincipales()" data-testid="que-arreglar-primero">
              <div class="card-header"><h2>Qué arreglar primero</h2>
                <a :href="'#/rastreos/' + job.id + '/problemas'" class="text-sm">Ver todos</a></div>
              <div class="text-dim text-sm" style="margin:-.3rem 0 .6rem">Páginas afectadas, por prioridad (gravedad × importancia de las páginas), como en Problemas; sin los de tipo info.</div>
              <template x-if="!principales || (principales.filas === null && !principales.error)">
                <div class="text-dim text-sm">Cargando…</div>
              </template>
              <template x-if="principales && principales.error">
                <div class="text-sm orange">No se pudieron cargar: <span x-text="principales.error"></span>
                  <button class="btn btn-sm" @click="principales = null; cargarPrincipales()">Reintentar</button></div>
              </template>
              <template x-if="principales && principales.filas && principales.filas.length === 0">
                <div class="text-dim text-sm">No hay errores ni avisos.</div>
              </template>
              <div class="bar-chart">
                <template x-for="i in (principales && principales.filas) || []" :key="i.issue_type + i.severity">
                  <div class="bar-row bar-row-link" role="link" tabindex="0" :title="'Ver ' + fmt.issue(i.issue_type)"
                       @click="verTipoDeIncidencia(i.issue_type, i.severity); switchTab('issues')"
                       @keydown.enter="verTipoDeIncidencia(i.issue_type, i.severity); switchTab('issues')">
                    <div class="bar-label" :title="fmt.issue(i.issue_type) + ' · ' + fmt.severity(i.severity)" x-text="fmt.issue(i.issue_type)"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + Math.max(2, (i.prioridad || 0) / Math.max(1e-9, principales.filas[0].prioridad || 0) * 100) + '%;background:' + issueBarColor(i.severity)"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(i.paginas)"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card" style="grid-column:1/-1">
              <div class="card-header"><h2>Hosts mas frecuentes</h2></div>
              <template x-if="stats.top_hosts.length === 0">
                <div class="text-dim text-sm">Sin datos todavía</div>
              </template>
              <div class="bar-chart">
                <template x-for="h in stats.top_hosts.slice(0, 10)" :key="h.host">
                  <div class="bar-row">
                    <div class="bar-label" :title="h.host" x-text="h.host"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (h.count / (stats.top_hosts[0]?.count || 1) * 100) + '%;background:var(--accent)'"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(h.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Que bloquea cada bot por host (decision 129): la home y una
                 muestra por plantilla, con el robots.txt guardado. -->
            <template x-if="robotsBots && robotsBots.hosts.length">
              <div class="card" style="grid-column:1/-1">
                <div class="card-header"><h2>robots.txt por bot</h2>
                  <span class="text-sm text-dim">Home y una muestra por plantilla, sin pedir nada al sitio</span></div>
                <!-- Una frase arriba y las tablas plegadas (revision de UX del
                     25-oct, 1.16): eran doce filas por host casi siempre iguales. -->
                <div class="text-sm" data-testid="robots-resumen" :class="resumenRobots(robotsBots).nivel"
                     x-text="resumenRobots(robotsBots).texto"></div>
                <details class="mt-1" :open="resumenRobots(robotsBots).abrir">
                <summary class="text-sm text-dim" style="cursor:pointer">Detalle por bot y por host</summary>
                <p class="text-sm text-dim">Bloquear un bot de <b>entrenamiento</b> (GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, CCBot) es una decisión legítima y no saca de ninguna búsqueda. Bloquear uno de <b>búsqueda de IA</b> (OAI-SearchBot, Claude-SearchBot, PerplexityBot) saca al sitio de esas respuestas. Los de <b>usuario</b> (ChatGPT-User, Claude-User) son descargas que pide una persona en el chat.</p>
                <template x-for="h in robotsBots.hosts" :key="h.origen">
                  <div class="mb-2">
                    <div class="text-sm"><a :href="h.url" target="_blank" rel="noopener" x-text="h.origen"></a>
                      <span class="text-dim" x-text="' · ' + (h.status_code || h.error || '—') + ' · ' + h.estado"></span></div>
                    <template x-if="!h.bots">
                      <div class="text-sm text-dim">Sin evaluar por bot: censo analizado antes de la decisión 129 o robots.txt no procesado. Re-analizar lo rellena.</div>
                    </template>
                    <template x-if="h.bots">
                      <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                        <thead><tr><th>Bot</th><th>Tipo</th><th>Home</th><th>Muestra bloqueada</th><th>Alcance</th><th>Regla de la home</th></tr></thead>
                        <tbody>
                          <template x-for="b in robotsBots.bots" :key="b.bot">
                            <tr x-data="{ r: h.bots[b.bot] || {} }">
                              <td x-text="b.token + ' (' + b.proveedor + ')'"></td>
                              <td x-text="({buscador:'Buscador', busqueda_ia:'Búsqueda IA', usuario_ia:'Usuario IA', entrenamiento:'Entrenamiento'})[b.tipo]"></td>
                              <td :class="r.home_bloqueada ? 'orange' : ''" x-text="r.alcance == null ? '—' : (r.home_bloqueada ? 'Bloqueada' : 'Permitida')"></td>
                              <td x-text="r.alcance == null ? '—' : (fmt.num(r.bloqueadas) + ' de ' + fmt.num(r.evaluadas) + (r.n_plantillas_bloqueadas ? ' · ' + r.n_plantillas_bloqueadas + ' plantillas enteras' : ''))"
                                  :title="(r.plantillas_bloqueadas || []).join(', ')"></td>
                              <td :class="r.alcance === 'todo' && b.tipo === 'busqueda_ia' ? 'red' : (r.alcance === 'todo' || r.alcance === 'parte' ? 'orange' : '')"
                                  x-text="({todo:'Todo el sitio', parte:'Una parte', nada:'Nada'})[r.alcance] || 'No evaluado'"></td>
                              <td><code x-show="r.regla_home" x-text="r.regla_home ? ('l.' + r.regla_home.linea + ' ' + r.regla_home.texto) : ''"></code></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </template>
                  </div>
                </template>
                </details>
                <!-- robots.txt de prueba (decision 171): el veredicto y la linea
                     que decide, con la logica del crawler y sin descargar nada. -->
                <details class="mt-2" data-testid="robots-prueba">
                  <summary class="text-sm"><b>Probar un robots.txt</b> <span class="text-dim">antes de subirlo</span></summary>
                  <div class="text-sm text-dim mb-1">Pega el fichero o parte del guardado:
                    <template x-for="h in robotsBots.hosts" :key="'c' + h.origen">
                      <button type="button" class="btn btn-sm" @click="robotsPruebaCargar(h.origen)" x-text="h.origen"></button>
                    </template>
                  </div>
                  <textarea x-model="robotsPrueba.texto" rows="8" style="width:100%;font-family:monospace;font-size:.8rem" placeholder="User-agent: *&#10;Disallow: /privado/"></textarea>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem" class="mt-1">
                    <label class="text-sm">URLs o rutas, una por línea
                      <textarea x-model="robotsPrueba.urls" rows="4" style="width:100%"></textarea></label>
                    <label class="text-sm">Agentes, uno por línea
                      <textarea x-model="robotsPrueba.agentes" rows="4" style="width:100%"></textarea></label>
                  </div>
                  <div class="mt-1 text-sm">
                    <select x-model="robotsPrueba.modo">
                      <option value="google">Como Google (token del bot: Googlebot, GPTBot…)</option>
                      <option value="rastreador">Como nuestro rastreo (User-Agent entero)</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm" :disabled="robotsPrueba.cargando || !robotsPrueba.urls.trim()" @click="robotsPruebaEvaluar()">Evaluar</button>
                    <span class="red" x-show="robotsPrueba.error" x-text="robotsPrueba.error"></span>
                  </div>
                  <template x-if="robotsPrueba.resultado">
                    <div class="mt-1">
                      <div class="text-sm text-dim" x-text="fmt.num(robotsPrueba.resultado.diagnostico.grupos) + ' grupos · ' + fmt.num(robotsPrueba.resultado.diagnostico.sitemaps.length) + ' sitemaps' + (robotsPrueba.resultado.diagnostico.recortado ? ' · pasa de 500 KiB: Google no lee lo de detrás' : '')"></div>
                      <template x-for="l in robotsPrueba.resultado.diagnostico.ignoradas" :key="'i' + l.linea">
                        <div class="text-sm orange">Línea <span x-text="l.linea"></span>: <code x-text="l.texto"></code> <span x-text="'— ' + robotsPruebaMotivo(l.motivo)"></span></div>
                      </template>
                      <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                        <thead><tr><th>Agente</th><th>URL</th><th>Veredicto</th><th>Línea que decide</th><th>Grupo</th></tr></thead>
                        <tbody>
                          <template x-for="(r, i) in robotsPrueba.resultado.resultados" :key="i">
                            <tr>
                              <td x-text="r.agente"></td>
                              <td x-text="r.url"></td>
                              <td :class="r.permitida ? '' : 'orange'" x-text="r.permitida ? 'Permitida' : 'Bloqueada'"></td>
                              <td><code x-show="r.linea" x-text="r.linea ? ('l.' + r.linea + ' ' + r.texto) : ''"></code><span class="text-dim" x-show="!r.linea">ninguna regla casa</span></td>
                              <td x-text="r.grupo ? (r.grupo + ' (l.' + r.linea_grupo + ')') : 'ninguno: todo permitido'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </div>
                  </template>
                </details>
              </div>
            </template>

            <!-- Accesibilidad con axe-core por muestra de plantilla (decision 174):
                 solo si el job lo pidio o trae capturas. Lo «a revisar» de axe
                 no se afirma, y sin paginas evaluadas no se dice «sin fallos». -->
            <template x-if="accesibilidad && (accesibilidad.pedida || accesibilidad.paginas.evaluadas || accesibilidad.paginas.no_evaluadas)">
              <div class="card" style="grid-column:1/-1" data-testid="tarjeta-accesibilidad">
                <div class="card-header"><h2>Accesibilidad (WCAG 2.x A/AA)</h2>
                  <span class="text-sm text-dim" x-text="'axe-core ' + (accesibilidad.axe || '') + ' · ' + fmt.num(accesibilidad.paginas.evaluadas) + ' páginas de ' + fmt.num(accesibilidad.plantillas) + ' plantillas' + (accesibilidad.coste && accesibilidad.coste.ms_pagina_mediana != null ? ' · ' + (accesibilidad.coste.ms_pagina_mediana / 1000).toFixed(1) + ' s por página' : '')"></span></div>
                <p class="text-sm text-dim">Muestra por plantilla con el navegador. axe detecta lo automatizable, en torno a un 30-40&nbsp;% de los criterios WCAG A/AA: una plantilla sin fallos aquí no es una plantilla accesible (el teclado, el orden de lectura o si un texto alternativo describe la imagen se revisan a mano). Imágenes, fuentes e iframes no se cargan en el render.</p>
                <template x-if="!accesibilidad.paginas.evaluadas">
                  <div class="text-sm" data-testid="accesibilidad-sin-evaluar">Ninguna página evaluada<span x-show="accesibilidad.paginas.no_evaluadas" x-text="': ' + Object.entries(accesibilidad.paginas.motivos).map(([m, n]) => m + ' (' + n + ')').join(', ')"></span>. No se puede decir nada de la accesibilidad de este rastreo.</div>
                </template>
                <template x-if="accesibilidad.paginas.evaluadas && !accesibilidad.reglas.length">
                  <div class="text-sm">axe no encontró incumplimientos automatizables en las páginas de la muestra.</div>
                </template>
                <template x-if="accesibilidad.reglas.length">
                  <div class="table-wrap"><table class="tbl" style="font-size:.8rem" data-testid="accesibilidad-reglas">
                    <thead><tr><th>Impacto</th><th>Regla</th><th>WCAG</th><th>Plantillas</th><th>Páginas</th><th>Elementos</th></tr></thead>
                    <tbody>
                      <template x-for="r in accesibilidad.reglas.slice(0, 12)" :key="r.regla">
                        <tr>
                          <td :class="impactoAxe(r.impacto)[1]" x-text="impactoAxe(r.impacto)[0]"></td>
                          <td><a :href="r.url_ayuda" target="_blank" rel="noopener" x-text="r.ayuda || r.regla"></a> <code class="text-dim" x-text="r.regla"></code></td>
                          <td x-text="(r.criterios.join(', ') || '—') + (r.nivel ? ' (' + r.nivel + ')' : '')"></td>
                          <td :title="r.plantillas.map(p => p.plantilla + ': ' + p.paginas + ' de ' + p.de).join('\n')" x-text="fmt.num(r.plantillas.length)"></td>
                          <td x-text="fmt.num(r.paginas)"></td>
                          <td x-text="fmt.num(r.nodos)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </template>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.reglas.length > 12" x-text="'Y ' + (accesibilidad.reglas.length - 12) + ' reglas más en Problemas (Accesibilidad).'"></div>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.incompletas.length" data-testid="accesibilidad-incompletas"
                     x-text="'A revisar a mano, sin afirmar (axe no pudo decidir): ' + accesibilidad.incompletas.map(r => r.regla).join(', ')"></div>
                <div class="text-sm text-dim mt-1" x-show="accesibilidad.paginas.evaluadas && accesibilidad.paginas.no_evaluadas"
                     x-text="fmt.num(accesibilidad.paginas.no_evaluadas) + ' páginas de la muestra sin evaluar: ' + Object.entries(accesibilidad.paginas.motivos).map(([m, n]) => m + ' (' + n + ')').join(', ')"></div>
              </div>
            </template>

            <!-- Comprobaciones fuera del censo: certificado (110), soft 404
                 (105), sondas de respuesta (123/124) y sitemaps (126). Cada
                 tarjeta solo si el job trae ese dato: sin el, un rastreo viejo
                 o con la sonda apagada se leeria como «sin problemas». -->
            <template x-if="filasTls(job)">
              <div class="card chk" data-testid="tarjeta-tls">
                <div class="card-header"><h2>Certificado TLS</h2>
                  <span class="text-sm text-dim" x-text="'el día del rastreo · aviso a ' + ((job.config.analysis_thresholds || {}).tls_dias_aviso || 7) + ' días'"></span></div>
                <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Host</th><th>Estado</th><th>Emisor</th><th>Caduca</th><th>Días</th><th>Versión</th></tr></thead>
                  <tbody>
                    <template x-for="t in filasTls(job)" :key="t.host">
                      <tr :title="t.detalle || ''">
                        <td x-text="t.host"></td>
                        <td :class="t.nivel === 'dim' ? 'text-dim' : t.nivel" x-text="t.estado"></td>
                        <td x-text="t.emisor || '—'"></td>
                        <td x-text="t.caduca ? fmt.dia(t.caduca) : '—'"></td>
                        <td :class="t.renovar && t.nivel === 'green' ? 'orange' : ''"
                            :title="t.renovar && t.nivel === 'green' ? 'Faltan 30 días o menos: conviene renovarlo' : ''"
                            x-text="t.dias == null ? '—' : fmt.num(t.dias) + (t.renovar && t.nivel === 'green' ? ' · renovar' : '')"></td>
                        <td x-text="t.version || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSoft404(job)">
              <div class="card chk" data-testid="tarjeta-soft404" x-data="{ get s4() { return resumenSoft404(job) } }">
                <div class="card-header"><h2>Soft 404</h2>
                  <span class="text-sm text-dim">qué responde el sitio a una URL que no existe</span></div>
                <div class="text-sm mb-1">
                  <template x-if="s4.analizado">
                    <span>
                      <strong :class="s4.soft_404 ? 'red' : (s4.plantillas_200 ? '' : 'green')" x-text="fmt.num(s4.soft_404) + (s4.soft_404 === 1 ? ' página' : ' páginas')"></strong>
                      del censo son la página de error del sitio con un 200<span x-show="s4.indexables" x-text="' (' + fmt.num(s4.indexables) + ' indexables)'"></span><span x-show="s4.candidatos" x-text="' · ' + fmt.num(s4.candidatos) + ' candidatas sin afirmar'"></span>.
                      <a href="#" @click.prevent="verTipoDeIncidencia('soft_404', ''); switchTab('issues')" x-show="s4.soft_404">Ver</a>
                    </span>
                  </template>
                  <!-- 2.11: que ninguna pagina del censo sea la de error no quiere
                       decir que el sitio responda bien a lo que no existe. -->
                  <template x-if="s4.plantillas_200">
                    <div class="orange mt-1" data-testid="soft404-plantillas">
                      <strong x-text="fmt.num(s4.plantillas_200) + (s4.plantillas_200 === 1 ? ' plantilla responde' : ' plantillas responden')"></strong>
                      200 a una URL que no existe, en lugar de 404: hay que pedir al cliente que las corrija.
                      <a href="#" x-show="s4.aviso_en_problemas" @click.prevent="verTipoDeIncidencia('soft_404_plantilla', ''); switchTab('issues')">Ver en Problemas</a>
                      <span class="text-dim" x-show="!s4.con_aviso_190">Este censo se analizó antes de que existiera el aviso: saldrá en Problemas cuando se vuelva a analizar.</span>
                    </div>
                  </template>
                  <template x-if="!s4.analizado">
                    <span class="text-dim">Sondas hechas, sin analizar todavía.</span>
                  </template>
                  <span class="text-dim" x-text="' ' + fmt.num(s4.sondas) + (s4.sondas === 1 ? ' sonda' : ' sondas') + (s4.con_huella != null ? ', ' + fmt.num(s4.con_huella) + ' con huella' : '') + '.'"></span>
                </div>
                <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Host</th><th>Plantilla</th><th>Respuesta</th><th title="Páginas del censo con la huella de esta sonda, sobre las de su host o su plantilla">Con su huella</th></tr></thead>
                  <tbody>
                    <!-- Por posicion: una sonda que redirige se repite en el destino con la
                         MISMA clave (http -> https del mismo host) -->
                    <template x-for="(f, i) in s4.filas" :key="i">
                      <tr :title="f.url + (f.redirige_a ? ' → ' + f.redirige_a : '')">
                        <td x-text="f.host"></td>
                        <td x-text="f.plantilla || 'raíz'"></td>
                        <td :class="f.nivel === 'dim' ? 'text-dim' : f.nivel" x-text="f.lectura"></td>
                        <td x-text="f.coincidencias == null ? '—' : fmt.num(f.coincidencias) + ' de ' + fmt.num(f.alcance) + (f.devuelve_portada ? ' · devuelve la portada' : (f.ambigua ? ' · huella de plantilla' : ''))"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSondas(job)">
              <div class="card chk" data-testid="tarjeta-sondas">
                <div class="card-header"><h2>Enlaces externos y recursos</h2>
                  <span class="text-sm text-dim">sondas fuera del censo</span></div>
                <template x-for="b in resumenSondas(job)" :key="b.etiqueta">
                  <div class="mb-1">
                    <div class="text-sm">
                      <strong x-text="b.etiqueta"></strong>:
                      <span x-text="fmt.num(b.comprobados) + (b.distintos != null ? ' comprobados de ' + fmt.num(b.distintos) + ' distintos' : ' comprobados')"></span>
                      · <span :class="b.rotos ? 'red' : 'green'" x-text="fmt.num(b.rotos) + (b.rotos === 1 ? ' roto' : ' rotos')"></span>
                      <span x-show="b.dominios_muertos" class="orange" x-text="' · ' + fmt.num(b.dominios_muertos) + (b.dominios_muertos === 1 ? ' dominio muerto' : ' dominios muertos')"></span>
                    </div>
                    <div x-show="b.parcial" class="text-sm orange">No se comprobaron todos (tope alcanzado): que no haya aviso no dice que el resto esté bien.</div>
                    <div class="text-dim" style="font-size:.78rem" x-show="b.por_veredicto.length"
                         x-text="b.por_veredicto.map(([v, n]) => v.replace(/_/g, ' ') + ': ' + fmt.num(n)).join(' · ')"></div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="resumenSitemaps(job)">
              <div class="card chk" data-testid="tarjeta-sitemaps" x-data="{ get sm() { return resumenSitemaps(job) }, abierto: false }">
                <div class="card-header"><h2>Sitemaps</h2>
                  <span class="text-sm text-dim" x-text="fmt.num(sm.leidos) + ' de ' + fmt.num(sm.pedidos) + (sm.pedidos === 1 ? ' fichero leído' : ' ficheros leídos')"></span></div>
                <div class="text-sm">
                  <span x-text="fmt.num(sm.devueltas) + ' entradas' + (sm.declaradas && sm.declaradas !== sm.devueltas ? ' de ' + fmt.num(sm.declaradas) + ' declaradas' : '')"></span>
                  <span class="text-dim" x-show="sm.formatos.length" x-text="' · ' + sm.formatos.map(([f, n]) => f + (n > 1 ? ' ×' + n : '')).join(', ')"></span>
                </div>
                <div x-show="sm.parcial" class="text-sm orange">Lectura parcial: hubo ficheros sin leer o cortados, así que «fuera del sitemap» no se puede afirmar para todo el sitio.</div>
                <div x-show="sm.fallidos" class="text-sm orange" x-text="fmt.num(sm.fallidos) + (sm.fallidos === 1 ? ' fichero no respondió 200' : ' ficheros no respondieron 200')"></div>
                <div x-show="sm.recortadas" class="text-sm text-dim" x-text="'Se guardaron ' + fmt.num(sm.guardadas) + ' entradas (tope ' + fmt.num(sm.tope) + '): la ficha de una URL puede no decir de qué fichero viene.'"></div>
                <a href="#" class="text-sm" x-show="sm.ficheros.length" @click.prevent="abierto = !abierto" x-text="abierto ? 'Ocultar ficheros' : 'Ver ficheros'"></a>
                <div class="table-wrap" x-show="abierto"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Fichero</th><th>Código</th><th>Formato</th><th>Entradas</th><th>Hijos</th></tr></thead>
                  <tbody>
                    <template x-for="f in sm.ficheros.slice(0, 200)" :key="f.url">
                      <tr>
                        <td style="word-break:break-all"><a :href="f.url" target="_blank" rel="noopener" x-text="f.url"></a></td>
                        <td :class="f.status && f.status !== 200 ? 'orange' : ''" x-text="f.status ?? '—'"></td>
                        <td x-text="f.formato || '—'"></td>
                        <td x-text="f.devueltas == null ? '—' : fmt.num(f.devueltas) + (f.cortado ? ' (cortado)' : '')"></td>
                        <td x-text="f.hijos ? fmt.num(f.hijos) : '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <!-- WordPress por su REST API (decisiones 161 y 168). Solo si el job
                 trae el resumen del adaptador y hubo rastro de WordPress: un
                 rastreo anterior o con el adaptador apagado no dice «no es WordPress». -->
            <template x-if="resumenWordPress(job)">
              <div class="card chk wp-tarjeta" data-testid="tarjeta-wordpress" x-data="{ get wp() { return resumenWordPress(job) }, nsAbierto: false }" x-init="cargarWpAssets()">
                <div class="card-header"><h2>WordPress</h2>
                  <span class="text-sm text-dim" x-text="wp.nombre || wp.raiz || ''"></span></div>
                <dl class="wp-datos">
                  <dt>Versión</dt>
                  <dd x-text="wp.version || 'no la publica (sin meta generator)'"></dd>
                  <dt>Plugin SEO</dt>
                  <dd x-text="wp.plugin_seo || (wp.abierta ? 'ninguno conocido en la REST API' : '—')"></dd>
                  <dt>REST API</dt>
                  <dd :class="wp.rest_nivel" x-text="wp.rest_texto"></dd>
                </dl>
                <div x-show="wp.cortada" class="text-sm orange" x-text="'Lectura cortada (' + String(wp.cortada).replace(/_/g, ' ') + '): los totales de cada tipo salen de X-WP-Total, pero no se leyeron todas las entidades.'"></div>
                <div x-show="wp.reanudacion" class="text-sm text-dim">Datos de una ejecución anterior del rastreo: esta no llegó a confirmar la REST API.</div>
                <template x-if="wp.filas.length">
                  <div class="table-wrap"><table class="tbl wp-tabla">
                    <thead><tr><th>Tipo</th><th>Clase</th><th title="X-WP-Total: lo que el sitio dice que publica">Publicadas</th><th>Leídas</th><th title="Leídas que tienen fila en el censo (por la URL, o la misma con el otro esquema)">En el censo</th><th title="Leídas sin fila en el censo: no es por sí solo un hallazgo">Solo en WordPress</th></tr></thead>
                    <tbody>
                      <template x-for="f in wp.filas" :key="f.tipo">
                        <tr>
                          <td :title="f.tipo" x-text="f.nombre"></td>
                          <td x-text="f.clase_texto"></td>
                          <td x-text="f.publicadas == null ? (f.status ? 'sin acceso (' + f.status + ')' : '—') : fmt.num(f.publicadas)"></td>
                          <td x-text="f.leidas == null ? '—' : fmt.num(f.leidas) + (f.recortado ? ' (tope)' : '')"></td>
                          <td x-text="f.en_el_censo == null ? '—' : fmt.num(f.en_el_censo)"></td>
                          <td>
                            <template x-if="f.solo_wp && wp.abierta"><a href="#" @click.prevent="verSoloWordPress(f.tipo)" x-text="fmt.num(f.solo_wp)"></a></template>
                            <template x-if="!(f.solo_wp && wp.abierta)"><span x-text="f.solo_wp == null ? '—' : fmt.num(f.solo_wp)"></span></template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </template>
                <div x-show="wp.abierta && !wp.analizado" class="text-sm text-dim">Leída, sin analizar todavía: «En el censo» sale al acabar el análisis.</div>
                <div x-show="wp.no_afirmable" class="text-sm orange"
                     x-text="fmt.num(wp.sin_afirmar) + ' publicadas sin rastrear que no se afirman como hallazgo: el censo tiene otro alcance (' + wp.no_afirmable + '). La lista está en «Solo en WordPress».'"></div>
                <div x-show="wp.emitidos" class="text-sm"><a href="#" @click.prevent="verTipoDeIncidencia('wp_publicado_no_rastreado', ''); switchTab('issues')">Ver los avisos de contenido publicado y no rastreado</a></div>
                <template x-if="wp.namespaces.length">
                  <div class="text-sm wp-plugins">
                    <span class="text-dim" title="Cada plugin que registra rutas en la REST API lo hace con su espacio de nombres. No todos lo hacen: no es la lista entera.">Plugins con rutas en la REST API:</span>
                    <span x-text="(nsAbierto ? wp.namespaces : wp.namespaces.slice(0, 12)).join(', ')"></span>
                    <a href="#" x-show="wp.namespaces.length > 12" @click.prevent="nsAbierto = !nsAbierto" x-text="nsAbierto ? 'menos' : 'y ' + (wp.namespaces.length - 12) + ' más'"></a>
                  </div>
                </template>
                <!-- Inventario por la ruta de los CSS y JS (decisión 168), bajo demanda -->
                <div class="wp-assets" data-testid="wp-assets">
                  <template x-if="wpAssetsError"><div class="text-sm text-dim" x-text="'Inventario por los ficheros: ' + wpAssetsError"></div></template>
                  <template x-if="!wpAssets && !wpAssetsError"><div class="text-sm text-dim">Leyendo plugins y tema de los CSS y JS…</div></template>
                  <template x-if="wpAssets && (wpAssets.plugins.length || wpAssets.temas.length)">
                    <div>
                      <div class="text-sm text-dim" x-text="'Por los CSS y JS de ' + fmt.num(wpAssets.paginas_miradas) + ' páginas HTML (las primeras del rastreo). La versión es la del ?ver= del fichero: suele ser la del plugin, pero la pone quien lo carga.'"></div>
                      <div class="table-wrap"><table class="tbl wp-tabla">
                        <thead><tr><th>Tema o plugin</th><th>Páginas</th><th>Versión en ?ver=</th></tr></thead>
                        <tbody>
                          <template x-for="a in [...wpAssets.temas.map(t => ({...t, clase: 'tema'})), ...wpAssets.plugins.map(t => ({...t, clase: 'plugin'}))]" :key="a.clase + a.slug">
                            <tr>
                              <td><span x-text="a.slug"></span> <span class="text-dim" x-text="a.clase"></span></td>
                              <td x-text="fmt.num(a.paginas)"></td>
                              <td x-text="a.versiones.length ? a.versiones.slice(0, 3).map(v => v.version + (v.igual_que_wordpress ? ' (la de WordPress)' : '')).join(', ') : '—'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </div>
                  </template>
                  <template x-if="wpAssets && !wpAssets.plugins.length && !wpAssets.temas.length">
                    <div class="text-sm text-dim" x-text="'Ningún CSS ni JS de /wp-content/plugins/ ni /wp-content/themes/ en ' + fmt.num(wpAssets.paginas_miradas) + ' páginas (o el sitio renombra la carpeta).'"></div>
                  </template>
                </div>
              </div>
            </template>

            <div class="card" style="grid-column:1/-1">
              <div class="card-header"><h2>Configuración</h2></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem;font-size:.85rem">
                <!-- Las semillas pueden ser miles (un censo sembrado desde el
                     sitemap): pintadas enteras, la ficha de Lopesan medía
                     114.000 px. Se ven tres y el resto bajo demanda. -->
                <div style="grid-column:1/-1">
                  <span class="text-dim">Semillas</span>
                  <span class="text-dim" x-text="'(' + fmt.num((job.seeds || []).length) + '):'"></span>
                  <span x-text="(job.seeds || []).slice(0, 3).join(', ')" style="word-break:break-all"></span>
                  <template x-if="(job.seeds || []).length > 3">
                    <details class="seeds-more">
                      <summary x-text="'y ' + fmt.num(job.seeds.length - 3) + ' más · ver todas'"></summary>
                      <div class="seeds-list">
                        <template x-for="s in job.seeds" :key="s"><div x-text="s"></div></template>
                      </div>
                    </details>
                  </template>
                </div>
                <div><span class="text-dim">Prof. máxima:</span> <span x-text="job.config?.max_depth"></span></div>
                <div><span class="text-dim">Max URLs:</span> <span x-text="fmt.num(job.config?.max_urls)"></span></div>
                <div><span class="text-dim">Concurrencia:</span> <span x-text="job.config?.concurrent_requests"></span></div>
                <div><span class="text-dim">Por dominio:</span> <span x-text="job.config?.concurrent_requests_per_domain"></span></div>
                <div><span class="text-dim">Seguir externos:</span> <span x-text="job.config?.follow_external ? 'Si' : 'No'"></span></div>
                <div><span class="text-dim">Robots.txt:</span> <span x-text="({respect:'Respetar',ignore:'Ignorar',audit:'Auditar (no bloquea)'})[job.config?.robots_mode] || 'Respetar'"></span></div>
                <div><span class="text-dim">Renderizar JS:</span> <span x-text="job.config?.render_js ? 'Si' : 'No'"></span></div>
                <div><span class="text-dim">Huella TLS:</span> <span x-text="job.config?.impersonate || 'Chrome'"></span></div>
                <div style="grid-column:1/-1"><span class="text-dim">User Agent:</span> <span class="text-sm" x-text="job.config?.user_agent" style="word-break:break-all"></span></div>
                <div><span class="text-dim">Iniciado:</span> <span x-text="fmt.date(job.started_at)"></span></div>
                <div><span class="text-dim">Finalizado:</span> <span x-text="fmt.date(job.completed_at)"></span></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: PROBLEMAS =====
             Por defecto, una fila por TIPO (UX-04): 38.922 filas sueltas en
             779 paginas no se leen. Cada tipo dice que es, que decide Google y
             como se arregla (incidencias.js). La lista plana sigue ahi: al
             elegir un tipo, o con «Ver como lista». -->
        <template x-if="detailTab === 'issues' && !issueFilters.issue_type && issuesVista === 'tipos'">
          <div x-data="{ get dp() { return diffProblemas() } }">
            <div class="flex gap-1 mb-2 items-center" style="flex-wrap:wrap">
              <template x-for="g in [['', 'Todas'], ['error', 'Errores'], ['warning', 'Avisos'], ['info', 'Info']]" :key="g[0]">
                <button class="btn btn-sm chip" :class="issueFilters.severity === g[0] && 'chip-on'"
                        @click="issueFilters.severity = g[0]">
                  <span x-text="g[1]"></span>
                  <!-- Tipos, no paginas: una pagina con tres problemas sumaria tres
                       veces y el total pasaria del numero de paginas del sitio. -->
                  <span class="text-dim" x-show="issuesResumen"
                        x-text="(n => n + (n === 1 ? ' tipo' : ' tipos'))(resumenIssues(g[0]).length)"></span>
                </button>
              </template>
              <!-- Segmento de negocio (decision 125): el % es sobre SUS URLs. -->
              <select class="exp-problema" :class="issuesSegmento && 'has-value'" aria-label="Segmento"
                      @focus="!segmentosJob && cargarSegmentos()" @change="elegirSegmentoProblemas($event.target.value)"
                      style="width:auto;max-width:16rem">
                <option value="" :selected="!issuesSegmento" x-text="segmentosParaElegir().regla.length ? 'Todas las secciones' : 'Todas las rutas'"></option>
                <template x-if="segmentosParaElegir().regla.length">
                  <optgroup label="Secciones del negocio">
                    <template x-for="g in segmentosParaElegir().regla" :key="g.segmento">
                      <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                    </template>
                  </optgroup>
                </template>
                <optgroup label="Sin regla: forma de la ruta">
                  <template x-for="g in segmentosParaElegir().forma" :key="g.segmento">
                    <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                  </template>
                </optgroup>
              </select>
              <!-- Decision 136: prioridad = gravedad x importancia de las paginas
                   afectadas (PageRank, clics desde la home, sitemap). -->
              <div class="flex gap-1 items-center" role="group" aria-label="Orden">
                <span class="text-sm text-dim">Ordenar:</span>
                <button class="btn btn-sm chip" :class="issuesOrden === 'gravedad' && 'chip-on'"
                        @click="issuesOrden = 'gravedad'; loadIssuesResumen()">Gravedad</button>
                <button class="btn btn-sm chip" :class="issuesOrden === 'prioridad' && 'chip-on'"
                        data-tip="Gravedad × importancia de las páginas afectadas: su PageRank, a cuántos clics de la home están y si el sitemap las declara. Arriba, lo que hay que arreglar primero."
                        @click="issuesOrden = 'prioridad'; loadIssuesResumen()">Prioridad</button>
              </div>
              <button class="btn btn-sm" style="margin-left:auto" @click="issuesVista = 'lista'; issues = []; loadIssues()">
                <i data-lucide="list" style="width:13px;height:13px"></i> Ver todas como lista</button>
            </div>
            <!-- Secciones del negocio (decision 125) como primer nivel: solo si el
                 cliente las tiene; sin reglas, Problemas queda como estaba
                 (revision de UX del 25-oct, 2.10). -->
            <template x-if="seccionesNegocio()">
              <div class="secciones-negocio mb-2" data-testid="secciones-negocio">
                <div class="text-sm text-dim mb-1">Por sección del negocio</div>
                <div class="secciones-lista">
                  <button class="seccion" :class="!issuesSegmento && 'seccion-on'" @click="elegirSegmentoProblemas('')">
                    <strong>Todo el sitio</strong>
                  </button>
                  <template x-for="g in seccionesNegocio().secciones" :key="g.segmento">
                    <button class="seccion" :class="issuesSegmento === g.segmento && 'seccion-on'" @click="elegirSegmentoProblemas(g.segmento)"
                            :title="'Ver solo los problemas de ' + g.segmento">
                      <strong x-text="g.segmento"></strong>
                      <span class="text-dim" x-text="fmt.num(g.urls) + ' URLs'"></span>
                      <span class="seccion-cifras">
                        <span :class="g.paginas_con_error ? 'red' : 'text-dim'" x-text="fmt.num(g.paginas_con_error || 0) + ' con errores'"></span>
                        <span class="text-dim" x-text="fmt.num(g.paginas_con_aviso || 0) + ' con avisos'"></span>
                      </span>
                    </button>
                  </template>
                </div>
                <div class="text-sm text-dim mt-1" x-show="seccionesNegocio().sinSeccion"
                     x-text="fmt.num(seccionesNegocio().sinSeccion) + ' URLs no caen en ninguna sección: se pueden elegir por la forma de su ruta en el desplegable.'"></div>
              </div>
            </template>

            <!-- Cuanto ha cambiado cada tipo frente al censo con el que se comparo
                 al terminar (la misma referencia que el resto, 2.3), o por que
                 no se puede decir (decisiones 67, 70, 89, 91 y 191). -->
            <template x-if="dp && dp.ok === true">
              <div class="text-sm mb-2 diff-problemas" data-testid="diff-problemas">
                <span>Cambio en incidencias <strong x-text="dp.ref"></strong>
                  (<a :href="'#/rastreos/' + dp.jobAnterior + '/resumen'" x-text="dp.nombre"></a>):</span>
                <span class="cambio cambio-peor" x-text="'+' + fmt.num(dp.nuevas) + (dp.nuevas === 1 ? ' nueva' : ' nuevas')"></span>
                <span class="cambio cambio-mejor" x-text="'−' + fmt.num(dp.resueltas) + (dp.resueltas === 1 ? ' resuelta' : ' resueltas')"></span>
                <span class="text-dim" x-show="dp.sinPagina"
                      x-text="fmt.num(dp.sinPagina) + ' estaban en páginas que esta vez no se rastrearon: no se cuentan como resueltas.'"></span>
                <span class="text-dim" x-show="issuesSegmento"> · La diferencia es del sitio entero; con una sección elegida no se reparte.</span>
                <template x-for="a in dp.avisos" :key="a"><div class="text-dim" style="font-size:.78rem" x-text="a"></div></template>
              </div>
            </template>
            <template x-if="dp && dp.ok === false">
              <div class="text-sm mb-2 diff-problemas orange" data-testid="diff-problemas-no">
                <span>Diferencia <span x-text="dp.ref"></span>: <span x-text="dp.motivo"></span>.</span>
                <span class="text-dim">Las cifras de abajo son las de este censo.</span>
              </div>
            </template>

            <template x-if="!issuesResumen">
              <div class="loading-overlay"><div class="spinner"></div> Agrupando incidencias…</div>
            </template>
            <template x-if="issuesResumen && !resumenIssues(issueFilters.severity).length">
              <div class="empty"><h3>No hay incidencias de esta gravedad</h3></div>
            </template>
            <div class="issue-groups">
              <template x-for="r in resumenIssues(issueFilters.severity)" :key="r.issue_type + r.severity">
                <div class="issue-group" :class="'sev-' + r.severity">
                  <button class="issue-group-head" @click="grupoAbierto[r.issue_type] = !grupoAbierto[r.issue_type]"
                          :aria-expanded="!!grupoAbierto[r.issue_type]">
                    <span class="sev-chip" :class="'sev-' + r.severity" x-text="fmt.severity(r.severity)"></span>
                    <span class="issue-group-name">
                      <strong x-text="fmt.issue(r.issue_type)"></strong>
                      <span class="text-dim" x-text="(ISSUE_INFO[r.issue_type] || {}).que || ''"></span>
                    </span>
                    <span class="issue-group-count">
                      <strong x-text="fmt.num(cuentaDeTipo(r).n)"></strong> <span x-text="cuentaDeTipo(r).unidad"></span>
                      <span class="text-dim" x-show="r.incidencias !== r.paginas && !cuentaDeTipo(r).propia" x-text="'· ' + fmt.num(r.incidencias) + ' incidencias'"></span>
                      <span class="text-dim" x-show="r.pct_paginas != null" x-text="'· ' + fmt.num(r.pct_paginas) + ' % de ' + fmt.num(r.urls_denominador) + ' URLs del segmento'"></span>
                      <!-- Un tipo que solo tiene incidencias de un hallazgo para muchas
                           paginas no se puede repartir: sale con 0 y lo dice, no desaparece. -->
                      <span class="text-dim" x-show="issuesSegmento && r.agregadas" x-text="'· ' + fmt.num(r.agregadas) + ' sin repartir por segmento'"></span>

                      <div>
                        <label class="text-dim text-sm">Rango</label>
                        <select style="display:block;margin-top:.2rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem"
                                x-model="semanticGscDays">
                          <option value="90">90 dias</option>
                          <option value="180">6 meses</option>
                          <option value="365">12 meses</option>
                          <option value="480">16 meses (max)</option>
                        </select>
                      </div>
                    </template>
                    <template x-if="semanticGscProp">
                      <button class="btn btn-sm btn-primary" @click="fetchGscData()" :disabled="gscFetchLoading" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="gscFetchLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Obtener datos GSC
                      </button>
                    </template>
                  </div>
                  <template x-if="gscFetchResult">
                    <p class="text-sm" style="margin-top:.5rem;color:var(--green)" x-text="'GSC: ' + gscFetchResult.matched + ' URLs emparejadas de ' + gscFetchResult.total_gsc_rows + ' filas' + (gscFetchResult.query_rows ? ' | ' + gscFetchResult.query_rows.toLocaleString('es-ES') + ' query-page rows' : '')"></p>
                  </template>
                </div>

                <!-- Gemini API key (cada cliente paga su consumo de embeddings) -->
                <div style="margin-bottom:1.25rem" data-tip="El análisis genera embeddings via la API de Gemini. Cada cliente usa su propia API key para que el coste se facture en su cuenta de Google AI. La key se guarda solo aquí y nunca se devuelve completa al frontend.">
                  <h4 style="margin-bottom:.5rem;font-size:.9rem">API key de Gemini</h4>
                  <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
                    <select x-model="semanticGeminiAccountId" style="flex:1;min-width:200px">
                      <option value="">— Selecciona una API key —</option>
                      <template x-for="acc in geminiAccounts" :key="acc.id">
                        <option :value="acc.id" x-text="acc.name + ' (' + acc.api_key_preview + ')'"></option>
                      </template>
                    </select>
                    <button class="btn btn-sm" @click="showGeminiModal = true; geminiFormError = null">+ Nueva</button>
                    <template x-if="semanticGeminiAccountId">
                      <button class="btn btn-sm btn-danger" @click="deleteGeminiAccount(semanticGeminiAccountId)">Eliminar</button>
                    </template>
                  </div>
                  <template x-if="geminiAccounts.length === 0">
                    <p class="text-sm text-dim" style="margin-top:.5rem">No hay API keys guardadas. Anade una para poder lanzar análisis.</p>
                  </template>
                </div>

                <!-- Modal: nueva API key Gemini -->
                <template x-if="showGeminiModal">
                  <div class="modal-backdrop" @click.self="showGeminiModal = false" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000">
                    <div class="card" style="max-width:480px;width:90%;padding:1.5rem">
                      <h3 style="margin-bottom:1rem">Nueva API key de Gemini</h3>
                      <div style="margin-bottom:.75rem">
                        <label class="text-dim text-sm">Nombre identificativo</label>
                        <input type="text" x-model="geminiFormName" placeholder="Cliente X" style="width:100%">
                      </div>
                      <div style="margin-bottom:.75rem">
                        <label class="text-dim text-sm">API key</label>
                        <input type="password" x-model="geminiFormKey" placeholder="AIza..." style="width:100%" autocomplete="off">
