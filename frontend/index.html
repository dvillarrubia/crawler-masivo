                <i data-lucide="x" style="width:12px;height:12px"></i>
                <span class="truncate" style="max-width:16rem" x-text="expPlantilla"></span>
              </button>
            </template>

                <span class="badge-inline" x-text="getExpColumns().length"></span>

                  </div>

                  <template x-for="g in expGruposVisibles()" :key="g[0]">

                  </div>
                </div>
              </template>
            </div>

                 entero sigue en Exportar, en la ficha del rastreo. -->
            <div class="menu-wrap" @click.outside="menuAbierto === 'csv-exp' && (menuAbierto = '')">

                  <span>Esta vista<span class="menu-sub" x-text="fmt.num(expTotal) + ' URLs con las columnas visibles, en el mismo orden'"></span></span></button>

              </div>
            </div>

          <!-- Una vista guardada con una regla a medida que este censo no tiene
               (decision 104): el 422 se explica en vez de enseñar el censo entero. -->
          <template x-if="expAvisoRegla">
            <div class="card mb-2" style="border-left:3px solid var(--warning,#d97706)">

          <template x-if="expTab === 'a_medida' && resumenAMedida">
            <div class="exp-ambito">
              <template x-for="r in resumenAMedida.reglas" :key="r.nombre">
                <span class="chip-grupo-a-medida">

                  <span class="text-dim text-sm" x-text="fmt.num(r.ok) + ' de ' + fmt.num(r.evaluadas)"></span>
                  <template x-if="r.sin_coincidencia">
                    <button class="chip-ambito" :class="{ on: chipAMedidaActivo(r.nombre, r.clase === 'busqueda' ? 'no' : 'vacio') }" @click="verAMedida(r.nombre, r.clase === 'busqueda' ? 'no' : 'vacio')">
                      <span x-text="r.clase === 'busqueda' ? 'no contiene' : 'sin coincidencia'"></span> <strong x-text="fmt.num(r.sin_coincidencia)"></strong>
                    </button>
                  </template>
                  <template x-if="r.bloqueadas">
                    <button class="chip-ambito sev-warning" :class="{ on: chipAMedidaActivo(r.nombre, 'estado:pagina_bloqueada') }" @click="verAMedida(r.nombre, 'estado:pagina_bloqueada')">

                    <button class="chip-ambito sev-error" :class="{ on: chipAMedidaActivo(r.nombre, 'estado:error,tiempo_agotado,presupuesto_pagina') }" @click="verAMedida(r.nombre, 'estado:error,tiempo_agotado,presupuesto_pagina')">
                      error <strong x-text="fmt.num(r.errores)"></strong>
                    </button>

              </template>
              <template x-for="a in (resumenAMedida.avisos || [])" :key="a">
                <span class="text-sm orange" x-text="a"></span>
              </template>
            </div>
          </template>

          <!-- Chips de la vista por ambito: un tipo de incidencia por chip -->
          <template x-if="(EXP_TABS.find(t => t.key === expTab) || {}).ambito">
            <div class="exp-ambito">
              <button class="chip-ambito" :class="!expProblema && 'on'" @click="elegirTipoDelAmbito('')">Todas las páginas</button>
              <template x-if="tiposDelAmbito().length > 1">
                <button class="chip-ambito" :class="expProblema === (EXP_TABS.find(t => t.key === expTab).ambito.join(',')) && 'on'"
                        @click="elegirTipoDelAmbito('*')">Con cualquier problema de este ámbito</button>
              </template>
              <template x-for="r in tiposDelAmbito()" :key="r.issue_type">
                <button class="chip-ambito" :class="[expProblema === r.issue_type && 'on', 'sev-' + r.severity]"
                        @click="elegirTipoDelAmbito(r.issue_type)" :title="(ISSUE_INFO[r.issue_type] || {}).que || ''">
                  <span x-text="fmt.issue(r.issue_type)"></span> <strong x-text="fmt.num(r.paginas)"></strong>
                </button>
              </template>
              <template x-if="issuesResumen && !tiposDelAmbito().length">
                <span class="text-dim text-sm">Ningún problema de este ámbito en este rastreo.</span>
              </template>
            </div>
          </template>

          <!-- Con la columna de cambios visible: contra que censo se compara y,
               si los dos se hicieron con codigo distinto, que parte del cambio
               puede ser nuestra (decisiones 66, 67 y 72). -->
          <template x-if="getExpColumns().includes('cambio')">
            <div class="exp-aviso-cambios">
              <template x-if="job.comparacion && job.comparacion.comparado_con">
                <span>
                  Cambios frente a <strong x-text="job.comparacion.nombre_anterior"></strong>
                  (<span x-text="fmt.dia(job.comparacion.fecha_anterior)"></span>).
                  <template x-for="a in (job.comparacion.avisos || [])" :key="a"><span class="orange" x-text="' ' + a"></span></template>
                </span>
              </template>
              <template x-if="!(job.comparacion && job.comparacion.comparado_con)">
                <span>Este rastreo no tiene censo anterior con el que compararse: la columna sale vacía.</span>
              </template>
            </div>
          </template>

          <!-- Helper hint about how filters work -->
          <div class="exp-filter-hint">
            <i data-lucide="info" style="width:12px;height:12px;flex-shrink:0"></i>
            <span>
              Filtra cada columna debajo de su nombre. En las numéricas, elige el operador
              (<strong>≥</strong> al menos, <strong>&gt;</strong> mayor que, <strong>=</strong> igual,
              <strong>≤</strong> máximo, <strong>&lt;</strong> menor que) y escribe el valor. En las de texto,
              <strong>a|b</strong> contiene a o b, <strong>!a</strong> no contiene a, <strong>∅</strong> vacías y <strong>≠∅</strong> con valor.
              Usa ↑↓ para moverte por las filas.
            </span>
          </div>

          <!-- Vista agrupada por plantilla -->
          <template x-if="expAgrupar">
            <div class="exp-table-wrap">
              <template x-if="expLoading && !expPlantillas">
                <div class="loading-overlay"><div class="spinner"></div> Agrupando…</div>
              </template>
              <template x-if="expPlantillas">
                <div>
                  <template x-if="expPlantillas.tramos_repetidos.length">
                    <div class="exp-repetidos">
                      <i data-lucide="repeat" style="width:13px;height:13px"></i>
                      <span>Se repiten como último tramo en esta vista (suele ser un fallo de plantilla):</span>
                      <template x-for="t in expPlantillas.tramos_repetidos" :key="t.tramo">
                        <button class="chip-tramo" @click="filtrarPorTramo(t.tramo)" :title="'Ver las URLs que acaban en /' + t.tramo">
                          <code x-text="decodeURIComponent(t.tramo).slice(0, 40)"></code> × <span x-text="t.veces"></span>
                        </button>
                      </template>
                    </div>
                  </template>
                  <table class="exp-table">
                    <thead><tr>
                      <th style="min-width:280px" x-text="expAgruparPor === 'segmento' ? 'Segmento' : 'Plantilla'"></th><th>URLs</th><th>Indexables</th><th>Estados</th>
                      <th>Con errores</th><th data-tip="Mediana de palabras del contenido propio">Palabras</th>
                      <th data-tip="Mediana del PageRank (0-100)">PageRank</th><th data-tip="Mediana de clics desde la home">Clics</th>
                      <th>Inlinks</th><th>Tramos repetidos</th><th style="min-width:240px">Ejemplo</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="p in expPlantillas.plantillas" :key="p.plantilla">
                        <tr @click="entrarEnPlantilla(p.plantilla)" style="cursor:pointer" :title="'Ver las ' + p.urls + ' URLs de ' + p.plantilla">
                          <td><code x-text="p.plantilla"></code></td>
                          <td x-text="fmt.num(p.urls)"></td>
                          <td x-text="p.urls ? Math.round(p.indexables / p.urls * 100) + ' %' : '—'"></td>
                          <td>
                            <template x-for="[g, n] in Object.entries(p.por_estado)" :key="g">
                              <span class="exp-status" :class="'exp-status-' + g" style="margin-right:.2rem" x-text="g + ' ' + n"></span>
                            </template>
                          </td>
                          <td :class="p.con_errores && 'text-red'" x-text="fmt.num(p.con_errores)"></td>
                          <td x-text="p.palabras_mediana != null ? fmt.num(Math.round(p.palabras_mediana)) : '—'"></td>
                          <td x-text="p.pagerank_mediana != null ? Math.round(p.pagerank_mediana) : '—'"></td>
                          <td x-text="p.clics_mediana != null ? p.clics_mediana : '—'"></td>
                          <td x-text="fmt.num(p.inlinks)"></td>
                          <td><template x-for="t in p.tramos_repetidos" :key="t.tramo">
                            <code class="tramo" x-text="decodeURIComponent(t.tramo).slice(0, 24) + ' ×' + t.veces"></code>
                          </template></td>
                          <td class="truncate" style="max-width:280px" x-text="(p.ejemplos[0] || '').replace(/^https?:\/\/[^/]+/, '')"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </template>

          <!-- Table -->
          <div class="exp-table-wrap" x-show="!expAgrupar">
            <template x-if="expLoading && expUrls.length === 0">
              <div class="loading-overlay"><div class="spinner"></div> Cargando...</div>
            </template>
            <template x-if="!expLoading && expUrls.length === 0">
              <div class="empty" style="padding:2rem">
                <p class="text-dim">No se encontraron URLs con estos filtros.</p>
              </div>
            </template>
            <template x-if="expUrls.length > 0">
              <table class="exp-table">
                <thead>
                  <tr>
                    <template x-for="col in getExpColumns()" :key="col">
                      <th :class="expSort === col && 'sorted'"
                          :data-sortable="EXP_COLUMN_DEFS[col]?.sortable ? '1' : '0'"
                          :style="EXP_COLUMN_DEFS[col]?.width ? ('min-width:' + EXP_COLUMN_DEFS[col].width + 'px') : ''"
                          @click="EXP_COLUMN_DEFS[col]?.sortable && explorerSort(col)"
                          :title="EXP_COLUMN_DEFS[col]?.label || col">
                        <span x-text="EXP_COLUMN_DEFS[col]?.label || col"></span>
                        <template x-if="expSort === col">
                          <span class="exp-sort-icon" x-text="expSortDir === 'asc' ? '▲' : '▼'"></span>
                        </template>
                      </th>
                    </template>
                  </tr>
                  <!-- Inline filter row (Screaming Frog style) -->
                  <tr class="exp-filter-row">
                    <template x-for="col in getExpColumns()" :key="'f_' + col">
                      <th>
                        <template x-if="EXP_COLUMN_DEFS[col]?.filterKey">
                          <div class="exp-filter-cell" :class="EXP_COLUMN_DEFS[col].type === 'boolean' && 'boolean'">
                            <template x-if="EXP_COLUMN_DEFS[col].type === 'numeric'">
                              <select class="exp-filter-op"
                                      :class="expColumnFilters[col]?.value && 'has-value'"
                                      :value="expCurrentOp(col)"
                                      :title="expOpTooltip(col)"
                                      @change="expColumnFilterInput(col, { op: $event.target.value, value: expColumnFilters[col]?.value || '' })">
                                <option value=">=" title="al menos">≥</option>
                                <option value=">"  title="mayor que">&gt;</option>
                                <option value="="  title="igual a">=</option>
                                <option value="<=" title="como máximo">≤</option>
                                <option value="<"  title="menor que">&lt;</option>
                              </select>
                            </template>
                            <template x-if="EXP_COLUMN_DEFS[col].type === 'string' && EXP_COLUMN_DEFS[col].vacio">
                              <select class="exp-filter-op exp-filter-op-texto"
                                      :class="['vacio','con_valor'].includes(expColumnFilters[col]?.op) && 'has-value'"
                                      :value="expCurrentOp(col)" title="contiene · vacío · con valor"
                                      @change="expColumnFilterInput(col, { op: $event.target.value, value: $event.target.value === 'contiene' ? (expColumnFilters[col]?.value || '') : '' })">
                                <option value="contiene" title="contiene">∋</option>
                                <option value="vacio" title="vacío">∅</option>
                                <option value="con_valor" title="con valor">≠∅</option>
                              </select>
                            </template>
                            <template x-if="EXP_COLUMN_DEFS[col].type === 'boolean'">
                              <select class="exp-filter-input"
                                      :class="expColumnFilters[col]?.value && 'has-value'"
                                      :title="(EXP_COLUMN_DEFS[col].label || col) + ': filtrar Sí/No'"
                                      :value="expColumnFilters[col]?.value ?? ''"
                                      @change="expColumnFilterInput(col, { value: $event.target.value })">
                                <option value="">Todos</option>
                                <option value="true">Sólo Sí</option>
                                <option value="false">Sólo No</option>
                              </select>
                            </template>
                            <template x-if="EXP_COLUMN_DEFS[col].type !== 'boolean'">
                              <input type="text"
                                     :inputmode="EXP_COLUMN_DEFS[col].type === 'numeric' ? 'decimal' : 'text'"
                                     class="exp-filter-input"
                                     :class="expColumnFilters[col]?.value && 'has-value'"
                                     :placeholder="expFilterPlaceholder(col)"
                                     :title="(EXP_COLUMN_DEFS[col].label || col) + ': ' + expFilterPlaceholder(col)"
                                     :value="expColumnFilters[col]?.value || ''"
                                     :disabled="['vacio','con_valor'].includes(expColumnFilters[col]?.op)"
                                     @input="expColumnFilterInput(col, { value: $event.target.value })">
                            </template>
                          </div>
                        </template>
                        <template x-if="!EXP_COLUMN_DEFS[col]?.filterKey">
                          <div class="exp-filter-cell empty">&nbsp;</div>
                        </template>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, idx) in expUrls" :key="row.id">
                    <tr :class="expSelectedUrl?.id === row.id && 'exp-row-selected'"
                        @click="selectExplorerUrl(row, idx)"
                        @dblclick="openUrlFromExplorer(row.id)">
                      <template x-for="col in getExpColumns()" :key="row.id + '_' + col">
                        <td :title="getExpCellTitle(row, col)">
                          <template x-if="col === 'status_code'">
                            <span class="exp-status" :class="expStatusClass(row.status_code)" x-text="row.status_code || ''"></span>
                          </template>
                          <template x-if="col !== 'status_code'">
                            <span x-text="getExpCellValue(row, col)"></span>
                          </template>
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </div>

          <!-- Detail panel -->
          <template x-if="expDetailOpen && expSelectedUrl">
            <div class="exp-detail">
              <div class="exp-detail-header">
                <span class="exp-status" :class="expStatusClass(expSelectedUrl.status_code)" x-text="expSelectedUrl.status_code"></span>
                <span class="exp-detail-url" :title="expSelectedUrl.url" x-text="expSelectedUrl.url"></span>
                <span class="text-dim text-sm" style="font-size:.7rem">↑↓ navegar · Esc cerrar</span>
                <button class="btn btn-sm" @click="openUrlFromExplorer(expSelectedUrl.id)" style="font-size:.72rem;padding:.2rem .5rem">
                  Abrir completo
                </button>
                <button class="exp-detail-close" @click="closeExplorerDetail()">&times;</button>
              </div>
              <div class="exp-detail-tabs">
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'resumen' && 'active'" @click="expDetailTab = 'resumen'">
                  Resumen SEO
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'content' && 'active'" @click="expDetailTab = 'content'">
                  Contenido
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'headings' && 'active'" @click="expDetailTab = 'headings'">
                  Encabezados <span class="count" x-text="expUrlDetail?.headings?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'inlinks' && 'active'" @click="expDetailTab = 'inlinks'">
                  Inlinks <span class="count" x-text="expUrlDetail?.inlinks?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'outlinks' && 'active'" @click="expDetailTab = 'outlinks'">
                  Outlinks <span class="count" x-text="expUrlDetail?.outlinks?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'issues' && 'active'" @click="expDetailTab = 'issues'">
                  Problemas <span class="count" x-text="expUrlDetail?.issues?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'resources' && 'active'" @click="expDetailTab = 'resources'">
                  Recursos <span class="count" x-text="expUrlDetail?.resources?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'structured' && 'active'" @click="expDetailTab = 'structured'">
                  Datos estr. <span class="count" x-text="expUrlDetail?.structured_data?.length || 0"></span>
                </button>
                <button type="button" class="exp-detail-tab" :class="expDetailTab === 'hreflang' && 'active'" @click="expDetailTab = 'hreflang'">
                  Hreflang <span class="count" x-text="expUrlDetail?.hreflangs?.length || 0"></span>
                </button>
              </div>
              <div class="exp-detail-body">
                <!-- Loading -->
                <template x-if="!expUrlDetail">
                  <div class="loading-overlay" style="padding:.5rem"><div class="spinner"></div></div>
                </template>
                <template x-if="expUrlDetail">
                  <div>
                    <!-- Resumen SEO: lo primero que se busca al seleccionar una fila
                         (antes abria en el markdown del contenido). -->
                    <template x-if="expDetailTab === 'resumen'">
                      <dl class="exp-resumen">
                        <dt>Indexabilidad</dt>
                        <dd :class="expUrlDetail.indexable ? 'green' : (expUrlDetail.indexable === false ? 'orange' : '')"
                            x-text="expUrlDetail.indexability_status || (expUrlDetail.indexable ? 'Indexable' : '—')"></dd>
                        <template x-if="expUrlDetail.response_class && expUrlDetail.response_class !== 'contenido'">
                          <dt>Respuesta</dt>
                        </template>
                        <template x-if="expUrlDetail.response_class && expUrlDetail.response_class !== 'contenido'">
                          <dd class="orange" x-text="fmt.claseRespuesta(expUrlDetail.response_class)"></dd>
                        </template>
                        <dt>Título</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.title || '(sin título)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.title_pixel_width"
                                :class="expUrlDetail.html_meta?.title_pixel_width > 580 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.title_pixel_width + ' px' + (expUrlDetail.html_meta?.title_pixel_width > 580 ? ' (Google lo corta)' : '')"></span>
                        </dd>
                        <dt>Descripción</dt>
                        <dd>
                          <span x-text="expUrlDetail.html_meta?.meta_description || '(sin descripción)'"></span>
                          <span class="text-dim" x-show="expUrlDetail.html_meta?.meta_description_pixel_width"
                                :class="expUrlDetail.html_meta?.meta_description_pixel_width > 985 && 'orange'"
                                x-text="' · ' + expUrlDetail.html_meta?.meta_description_pixel_width + ' px'"></span>
                        </dd>
                        <dt>H1</dt>
                        <dd x-text="((expUrlDetail.headings || []).filter(h => h.tag === 'h1' && !h.oculto).map(h => h.text).join(' · ')) || '(sin H1 visible)'"></dd>

                        <dd class="truncate" :title="expUrlDetail.html_meta?.canonical_href || ''"
                            x-text="expUrlDetail.html_meta?.canonical_href ? (expUrlDetail.html_meta.canonical_href === expUrlDetail.url ? 'a sí misma' : expUrlDetail.html_meta.canonical_href) : '(sin canonical)'"></dd>
                        <dt>Robots</dt>
                        <dd x-text="[expUrlDetail.html_meta?.meta_robots, expUrlDetail.html_meta?.x_robots_tag && ('X-Robots-Tag: ' + expUrlDetail.html_meta.x_robots_tag)].filter(Boolean).join(' · ') || '—'"></dd>

                        <dd x-text="(n => fmt.num(n) + (n === 1 ? ' página la enlaza · ' : ' páginas la enlazan · '))(expUrlDetail.unique_inlinks_count ?? expUrlDetail.inlinks_count ?? 0) + (expUrlDetail.click_depth != null ? expUrlDetail.click_depth + ' clics desde la home' : 'sin profundidad calculada') + (expUrlDetail.pagerank_score != null ? ' · PageRank ' + expUrlDetail.pagerank_score : '') + (expUrlDetail.in_sitemap ? ' · en el sitemap' : ' · fuera del sitemap')"></dd>
                        <template x-if="(expUrlDetail.sitemaps || []).length">
                          <dt>Sitemap</dt>
                        </template>
                        <template x-if="(expUrlDetail.sitemaps || []).length">
                          <dd>
                            <template x-for="(sm, n) in expUrlDetail.sitemaps" :key="'esm' + n">
                              <div class="truncate" :title="sm.fichero"
                                   x-text="sm.fichero + (sm.lastmod ? ' · lastmod ' + sm.lastmod : ' · sin lastmod')"></div>
                            </template>
                          </dd>
                        </template>
                        <dt>Problemas</dt>
                        <dd>
                          <template x-if="!(expUrlDetail.issues || []).length"><span class="green">Ninguno</span></template>

                        <template x-if="expUrlDetail.page_content?.content_text">

                            <div style="font-weight:600;font-size:.75rem;color:var(--accent);margin-bottom:.35rem">

                            </div>
                            <div class="content-preview" style="white-space:pre-wrap;max-height:none" x-text="expUrlDetail.page_content.content_text"></div>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Headings tab -->
                    <template x-if="expDetailTab === 'headings'">
                      <div>
                        <template x-if="!expUrlDetail.headings || expUrlDetail.headings.length === 0">

                        </template>
                        <template x-if="expUrlDetail.headings && expUrlDetail.headings.length > 0">

                            <template x-for="h in expUrlDetail.headings" :key="h.id">
                              <div class="heading-item" :style="'padding-left:' + headingIndent(h.tag) + 'rem'">
                                <span class="heading-tag" :style="'color:' + headingColor(h.tag)" x-text="h.tag"></span>
                                <span class="heading-text" x-text="h.text || '(vacío)'"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Inlinks tab: full table -->
                    <template x-if="expDetailTab === 'inlinks'">
                      <div>
                        <template x-if="!expUrlDetail.inlinks || expUrlDetail.inlinks.length === 0">
                          <div class="text-dim" style="padding:.5rem 0">Esta URL no recibe enlaces internos (página huérfana).</div>
