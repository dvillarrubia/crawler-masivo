            </template>

            <template x-if="enriqRun">
              <div>
                <div class="card" style="margin-bottom:1rem"
                     :style="'margin-bottom:1rem;border-left:3px solid ' + fmt.colorEnriq(enriqRun.estado)">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap">
                    <div>
                      <strong x-text="fmt.estadoEnriq(enriqRun.estado)"></strong>
                      <span class="text-dim" style="font-size:.8rem" x-show="enriqRun.motivo" x-text="' · ' + fmt.motivoEnriq(enriqRun.motivo)"></span>
                      <div class="text-dim" style="font-size:.78rem;margin-top:.2rem">
                        Módulos: <span x-text="enriqRun.modulos.join(', ')"></span>
                        · Alcance: <span x-text="fmt.alcanceEnriq(enriqRun.alcance)"></span>
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
                      <span style="font-variant-numeric:tabular-nums">
                        <strong x-text="fmt.usd(enriqRun.gastado_usd)"></strong>
                        <span class="text-dim" x-text="' de ' + fmt.usd(enriqRun.presupuesto_usd) + ' (estimado ' + fmt.usd(enriqRun.estimacion && enriqRun.estimacion.coste_estimado_usd) + ')'"></span>
                      </span>
                      <template x-if="['pendiente','en_curso'].includes(enriqRun.estado)">
                        <button class="btn btn-sm btn-danger" @click="cancelarEnriquecido()" style="display:flex;align-items:center;gap:.3rem">
                          <i data-lucide="x-circle" style="width:13px;height:13px"></i> Cancelar
                        </button>
                      </template>
                    </div>
                  </div>
                  <template x-if="enriqRun.progreso">
                    <div style="margin-top:.6rem">
                      <div class="text-sm" style="display:flex;justify-content:space-between">
                        <span x-text="'Módulo: ' + (enriqRun.progreso.modulo || '—')"></span>
                        <span x-text="fmt.num(enriqRun.progreso.procesadas) + ' de ' + fmt.num(enriqRun.progreso.total) + ' URLs'"></span>
                      </div>
                      <div class="progress-bar">
                        <div class="progress-fill" :style="'width:' + (enriqRun.progreso.total ? Math.min(100, 100 * enriqRun.progreso.procesadas / enriqRun.progreso.total) : 0) + '%'"></div>
                      </div>
                    </div>
                  </template>
                  <template x-if="enriqRun.estado === 'cancelando'">
                    <div class="text-dim" style="font-size:.8rem;margin-top:.4rem">Se para al terminar el lote en curso. Lo ya pagado se conserva.</div>
                  </template>
                  <template x-for="e in (enriqRun.errores || []).slice(0, 5)" :key="e">
                    <div class="text-dim" style="font-size:.75rem;margin-top:.25rem" x-text="'· ' + e"></div>
                  </template>
                </div>

                <template x-for="[preg, r] in Object.entries(enriqRun.resultados || {})" :key="preg">
                  <div class="card" style="margin-bottom:1rem">
                    <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline">
                      <strong><code x-text="preg"></code></strong>
                      <span class="text-dim" style="font-size:.8rem" x-text="fmt.num(r.total) + ' URLs · ' + fmt.usd(r.coste_usd)"></span>
                    </div>
                    <div style="display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.5rem;font-size:.82rem">
                      <template x-for="[resp, n] in Object.entries(r.por_respuesta)" :key="resp">
                        <a href="#" @click.prevent="cargarDecisionesEnriq(preg, resp)">
                          <strong x-text="fmt.respuestaEnriq(resp)"></strong> <span x-text="fmt.num(n)"></span>
                        </a>
                      </template>
                      <template x-for="[est, n] in Object.entries(r.por_estado)" :key="est">
                        <span class="text-dim" x-text="est + ': ' + fmt.num(n)"></span>
                      </template>
                    </div>
                    <div class="text-dim" style="font-size:.75rem;margin-top:.35rem" x-show="!(r.por_estado || {}).decidido">
                      Sin umbral calibrado (#8) ninguna respuesta sale «decidido»: son orientativas.
                    </div>
                  </div>
                </template>

                <template x-if="enriqDecisiones">
                  <div class="card">
                    <div class="text-dim" style="font-size:.8rem;margin-bottom:.4rem"
                         x-text="fmt.num(enriqDecisiones.total) + ' respuestas' + (enriqFiltro.respuesta ? ' «' + fmt.respuestaEnriq(enriqFiltro.respuesta) + '»' : '')"></div>
                    <div style="overflow-x:auto">
                      <table>
                        <thead><tr><th style="text-align:left">URL</th><th>respuesta</th><th>confianza</th><th>origen</th><th style="text-align:right">coste</th></tr></thead>
                        <tbody>
                          <template x-for="d in enriqDecisiones.items" :key="d.id">
                            <tr>
                              <td style="max-width:32rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="d.url"></td>
                              <td x-text="d.respuesta === null ? (d.motivo || '—') : fmt.respuestaEnriq(d.respuesta)"></td>
                              <td x-text="d.confianza == null ? '—' : (100 * d.confianza).toFixed(0) + '%'"></td>
                              <td x-text="d.origen"></td>
                              <td style="text-align:right" x-text="fmt.usd(d.coste_usd)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem" x-show="enriqDecisiones.total > enriqDecisiones.page_size">
                      <button class="btn btn-sm" :disabled="enriqFiltro.page <= 1" @click="enriqFiltro.page--; cargarDecisionesEnriq()">Anterior</button>
                      <button class="btn btn-sm" :disabled="enriqFiltro.page * enriqDecisiones.page_size >= enriqDecisiones.total" @click="enriqFiltro.page++; cargarDecisionesEnriq()">Siguiente</button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: COMPARAR ===== -->
        <template x-if="detailTab === 'diff'">
          <div>
            <div class="card" style="margin-bottom:1rem">
              <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
                <span style="font-size:.85rem">Comparar con:</span>
                <!-- Censos comparables primero; las pruebas pequenas aparte
                     (UX-12): comparar un censo de 5.000 URLs con un canario de
                     26 no dice nada de lo que ha cambiado. -->
                <select @change="diffOtro = $el.value; cargarDiff()" style="padding:.35rem .5rem;font-size:.85rem;max-width:34rem">
                  <option value="">— elige otro rastreo del mismo sitio —</option>
                  <optgroup label="Censos de tamaño parecido">
                    <template x-for="j in candidatosDiff(true)" :key="j.id">
                      <option :value="j.id" :selected="j.id === diffOtro"
                              x-text="(j.id === (job.comparacion || {}).comparado_con ? '★ ' : '') + j.name + '  ·  ' + fmt.num(j.total_urls_crawled) + ' URLs  ·  ' + fmt.dia(j.created_at)"></option>
                    </template>
                  </optgroup>
                  <optgroup label="Rastreos de prueba o parciales">
                    <template x-for="j in candidatosDiff(false)" :key="j.id">
                      <option :value="j.id" :selected="j.id === diffOtro"
                              x-text="j.name + '  ·  ' + fmt.num(j.total_urls_crawled) + ' URLs  ·  ' + fmt.dia(j.created_at)"></option>
                    </template>
                  </optgroup>
                </select>
                <span x-show="diffCargando" class="text-dim" style="font-size:.8rem">comparando…</span>
              </div>
              <div x-show="job.comparacion && job.comparacion.comparado_con === diffOtro" class="text-dim" style="font-size:.8rem;margin-top:.5rem">
                ★ Es el censo con el que se comparó automáticamente al terminar el rastreo.
              </div>
              <div x-show="!diffCandidatos.length" class="text-dim" style="font-size:.8rem;margin-top:.5rem">
                No hay otro rastreo completado del mismo sitio con el que comparar.
              </div>
            </div>

            <template x-if="diff && !diff.comparable">
              <div class="card" style="border-left:3px solid var(--red)">
                <strong>No se pueden comparar</strong>
                <div style="margin-top:.35rem;font-size:.85rem" x-text="diff.motivo"></div>
              </div>
            </template>

            <template x-if="diff && diff.comparable">
              <div>
                <div class="text-dim" style="font-size:.8rem;margin-bottom:.6rem"
                     x-show="diff.antes && diff.ahora">
                  Antes: <strong x-text="(diff.antes.fecha || '').slice(0,10)"></strong>
                  <span x-text="diff.antes.nombre"></span>
                  · Ahora: <strong x-text="(diff.ahora.fecha || '').slice(0,10)"></strong>
                  <span x-text="diff.ahora.nombre"></span>
                </div>
                <template x-for="aviso in diff.avisos" :key="aviso">
                  <div class="card" style="border-left:3px solid var(--orange);margin-bottom:.75rem">
                    <div style="font-size:.85rem" x-text="aviso"></div>
                  </div>
                </template>

                <!-- Las alertas primero: un cambio que afecta a una parte
                     grande de las indexables no es trabajo editorial. -->
                <template x-for="al in (diff.alertas || [])" :key="al.regla + (al.extraccion || '')">
                  <div class="card"
                       :style="'margin-bottom:.75rem;border-left:3px solid ' + fmt.colorSeveridad(al.severidad)">
                    <div style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline">
                      <strong x-text="fmt.tituloAlerta(al)"></strong>
                      <span style="white-space:nowrap;font-variant-numeric:tabular-nums">
                        <strong x-text="fmt.num(al.paginas)"></strong>
                        <span class="text-dim" x-text="' de ' + fmt.num(al.de) + ' · ' + al.pct + '%'"></span>
                      </span>
                    </div>
                    <div style="font-size:.85rem;margin-top:.35rem" x-text="al.que_decide_google"></div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.35rem"
                         x-show="fmt.detalleAlerta(al)" x-text="fmt.detalleAlerta(al)"></div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.4rem"
                         x-show="al.por === 'plantilla' || al.por === 'segmento'"
                         x-text="'Diluido en el total del sitio: salta por ' + al.por + '.'"></div>
                    <!-- Segmentos de negocio primero (decision 127). Si un
                         segmento son exactamente las paginas de una plantilla,
                         sale una vez, aqui, con la plantilla al lado. -->
                    <template x-for="sg in (al.segmentos || []).slice(0,4)" :key="'s' + sg.segmento">
                      <div class="text-dim" style="font-size:.78rem;margin-left:.6rem">
                        <strong x-text="sg.segmento"></strong>
                        <span x-text="' ' + fmt.num(sg.paginas) + '/' + fmt.num(sg.de) + ' = ' + sg.pct + '%'"></span>
                        <span x-show="sg.plantilla"> · plantilla <code x-text="sg.plantilla"></code></span>
                      </div>
                    </template>
                    <template x-for="pl in (al.plantillas || []).slice(0,4)" :key="pl.plantilla">
                      <div class="text-dim" style="font-size:.78rem;margin-left:.6rem">
                        <code x-text="pl.plantilla"></code>
                        <span x-text="' ' + fmt.num(pl.paginas) + '/' + fmt.num(pl.de) + ' = ' + pl.pct + '%'"></span>
                      </div>
                    </template>
                    <template x-for="e in al.ejemplos.slice(0,3)" :key="e.url">
                      <div class="text-dim" style="font-size:.75rem;margin-left:.6rem;margin-top:.15rem">
                        <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                        <span x-show="e.ahora !== undefined">: <s x-text="String(e.antes ?? '—').slice(0,36)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,36)"></strong></span>
                      </div>
                    </template>
                  </div>
                </template>

                <div class="stats-grid" style="margin-bottom:1rem">
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(diff.urls.en_ambos)"></div>
                    <div class="stat-label">en los dos</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value" x-text="fmt.num(diff.urls.nuevas)"></div>
                    <div class="stat-label">nuevas</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-value"
                         x-text="diff.urls.desaparecidas === null ? '—' : fmt.num(diff.urls.desaparecidas)"></div>
                    <div class="stat-label" x-text="diff.urls.desaparecidas === null ? 'desaparecidas (no afirmable)' : 'desaparecidas'"></div>
                  </div>
                </div>

                <!-- Extraccion a medida (decision 127): regla a regla, lo
                     comparado y lo que no se pudo comparar. Sin fila en uno
                     de los dos censos no es un cambio (decision 104). -->
                <template x-if="diff.extraido && ((diff.extraido.reglas || []).length || (diff.extraido.no_comparadas || []).length)">
                  <div class="card mb-2">
                    <div class="text-sm"><strong>Extracción a medida</strong></div>
                    <template x-for="rg in diff.extraido.reglas" :key="rg.nombre">
                      <div class="text-sm" style="margin-top:.35rem">
                        <strong x-text="'«' + rg.nombre + '»'"></strong>
                        <span x-text="' ' + fmt.num(rg.comparadas) + ' páginas comparadas · '
                          + Object.entries(rg.cambios).map(([k, v]) => fmt.reglaDiff(k).toLowerCase() + ': ' + fmt.num(v.total)).join(' · ')"></span>
                        <span class="text-dim" x-show="rg.sin_dato || rg.sin_saber || rg.render_distinto"
                              x-text="' · sin dato en uno de los dos: ' + fmt.num(rg.sin_dato) + ' · no se pudo evaluar: ' + fmt.num(rg.sin_saber)
                                + (rg.render_distinto ? ' · uno con render y otro sin: ' + fmt.num(rg.render_distinto) : '')"></span>
                      </div>
                    </template>
                    <template x-for="nc in (diff.extraido.no_comparadas || [])" :key="'nc' + nc.nombre">
                      <div class="text-dim" style="font-size:.78rem;margin-top:.25rem"
                           x-text="'«' + nc.nombre + '» no se compara: ' + nc.motivo"></div>
                    </template>
                  </div>
                </template>

                <!-- Que se arreglo, que aparecio y que sigue (#32). Comparar
                     paginas no contesta "que arreglo el cliente desde la
                     auditoria anterior", que es para lo que se mira un
                     seguimiento mensual. -->
                <!-- Dos censos analizados con codigo distinto no se comparan
                     por incidencias: un hallazgo puede salir "resuelto" solo
                     porque la regla que lo emitia ha cambiado. Se dice, con
                     el motivo y como arreglarlo. -->
                <!-- Si el censo anterior se volvio a analizar para poder
                     comparar, se dice: sus cifras guardadas han cambiado y
                     quien viera un informe suyo tiene derecho a saberlo. -->
                <template x-if="diff.anterior_reanalizado">
                  <div class="card mb-2" style="border-left:3px solid var(--blue,#2979b5)">
                    <div class="text-sm">
                      El rastreo anterior se ha <strong>vuelto a analizar</strong> con
                      el codigo de hoy para poder comparar las incidencias. Sus
                      cifras han cambiado respecto a lo que se viera antes.
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable === false">
                  <div class="card mb-2" style="border-left:3px solid var(--muted,#6b7280)">
                    <div class="text-sm">
                      <strong>No se pueden comparar las incidencias.</strong>
                      <span x-text="diff.incidencias.motivo"></span>
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable !== false">
                  <div class="stats-grid" style="margin-bottom:1rem">
                    <div class="stat-card" style="border-top:2px solid var(--green,#2e8b57)">
                      <div class="stat-value"
                           x-text="diff.incidencias.resueltas ? fmt.num(diff.incidencias.resueltas.total) : '—'"></div>
                      <div class="stat-label"
                           x-text="diff.incidencias.resueltas ? 'resueltas' : 'resueltas (no afirmable)'"></div>
                    </div>
                    <div class="stat-card" style="border-top:2px solid var(--red,#d32f2f)">
                      <div class="stat-value" x-text="fmt.num(diff.incidencias.nuevas.total)"></div>
                      <div class="stat-label">nuevas</div>
                    </div>
                    <div class="stat-card">
                      <div class="stat-value" x-text="fmt.num(diff.incidencias.siguen.total)"></div>
                      <div class="stat-label">siguen</div>
                    </div>
                  </div>
                </template>

                <template x-if="diff.incidencias && diff.incidencias.comparable !== false">
                  <div class="card" style="margin-bottom:1rem">
                    <table style="width:100%;font-size:.85rem">
                      <thead><tr>
                        <th style="text-align:left">incidencias por tipo</th>
                        <th style="text-align:right;width:6rem">resueltas</th>
                        <th style="text-align:right;width:6rem">nuevas</th>
                        <th style="text-align:right;width:6rem">siguen</th>
                      </tr></thead>
                      <tbody>
                        <template x-for="t in tiposDeIncidencia()" :key="t.tipo">
                          <tr>
                            <td>
                              <span x-text="fmt.issue(t.tipo)"></span>
                              <span class="text-dim" style="font-size:.75rem"
                                    x-text="' · ' + fmt.severity(t.severidad)"></span>
                            </td>
                            <td style="text-align:right;color:var(--green,#2e8b57)"
                                x-text="t.resueltas || ''"></td>
                            <td style="text-align:right;color:var(--red,#d32f2f)"
                                x-text="t.nuevas || ''"></td>
                            <td style="text-align:right" class="text-dim"
                                x-text="t.siguen || ''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.5rem"
                         x-show="diff.incidencias.sin_pagina_en_el_nuevo">
                      <span x-text="fmt.num(diff.incidencias.sin_pagina_en_el_nuevo)"></span>
                      incidencias mas estaban en páginas que este rastreo no ha
                      visitado: no se sabe si se arreglaron.
                    </div>
                    <div class="text-dim" style="font-size:.78rem;margin-top:.5rem"
                         x-show="diff.incidencias.resueltas_no_afirmables">
                      <span x-text="fmt.num(diff.incidencias.resueltas_no_afirmables)"></span>
                      incidencias no aparecen ahora, pero el censo anterior esta
                      truncado: pueden no haberse resuelto, sino no haberse visto.
                    </div>
                  </div>
                </template>

                <div class="card">
                  <table style="width:100%;font-size:.85rem">
                    <thead><tr><th style="text-align:left">que cambio</th><th style="text-align:right;width:7rem">páginas</th></tr></thead>
                    <tbody>
                      <template x-for="[campo, v] in Object.entries(diff.cambios)" :key="campo">
                        <tr :style="v.total ? '' : 'opacity:.45'">
                          <td>
                            <div x-text="fmt.campoDiff(campo)"></div>
                            <template x-for="e in v.ejemplos.slice(0,3)" :key="e.url">
                              <div class="text-dim" style="font-size:.75rem;margin-left:.6rem">
                                <span x-text="e.url.replace(/^https?:\/\//,'').slice(0,70)"></span>
                                <span x-show="campo !== 'word_count'">: <s x-text="String(e.antes ?? '—').slice(0,40)"></s> → <strong x-text="String(e.ahora ?? '—').slice(0,40)"></strong></span>
                                <span x-show="campo === 'word_count'">: <s x-text="e.antes"></s> → <strong x-text="e.ahora"></strong> palabras</span>
                              </div>
                            </template>
                          </td>
                          <td style="text-align:right;vertical-align:top" x-text="fmt.num(v.total)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: RESUMEN ===== -->
        <template x-if="detailTab === 'overview' && stats">
          <div class="overview-grid">
            <div class="card">
              <div class="card-header"><h2>Códigos de estado</h2></div>
              <template x-if="stats.urls_by_status_group.length === 0">
                <div class="text-dim text-sm">Sin datos todavía</div>
              </template>
              <div class="bar-chart">
                <template x-for="s in stats.urls_by_status_group" :key="s.status_group">
                  <div class="bar-row">
                    <div class="bar-label" x-text="s.status_group"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (s.count / maxStatusCount() * 100) + '%;background:' + barColor(s.status_group)"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(s.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h2>Principales problemas</h2>
                <a :href="'#/rastreos/' + job.id + '/problemas'" class="text-sm">Ver todos por tipo</a></div>
              <template x-if="stats.issues_by_type.length === 0">
                <div class="text-dim text-sm">No se encontraron problemas</div>
              </template>
              <div class="bar-chart">
                <template x-for="i in issuesSorted.slice(0, 10)" :key="i.issue_type + i.severity">
                  <div class="bar-row bar-row-link" role="link" tabindex="0" :title="'Ver ' + fmt.issue(i.issue_type)"
                       @click="verTipoDeIncidencia(i.issue_type, i.severity); switchTab('issues')"
                       @keydown.enter="verTipoDeIncidencia(i.issue_type, i.severity); switchTab('issues')">
                    <div class="bar-label" :title="fmt.issue(i.issue_type)" x-text="fmt.issue(i.issue_type)"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (i.count / maxIssueCount() * 100) + '%;background:' + issueBarColor(i.severity)"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(i.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card" style="grid-column:1/-1">
              <div class="card-header"><h2>Hosts mas frecuentes</h2></div>
              <template x-if="stats.top_hosts.length === 0">
                <div class="text-dim text-sm">Sin datos todavía</div>
              </template>
              <div class="bar-chart">
                <template x-for="h in stats.top_hosts.slice(0, 10)" :key="h.host">
                  <div class="bar-row">
                    <div class="bar-label" :title="h.host" x-text="h.host"></div>
                    <div class="bar-track">
                      <div class="bar-fill" :style="'width:' + (h.count / (stats.top_hosts[0]?.count || 1) * 100) + '%;background:var(--accent)'"></div>
                    </div>
                    <div class="bar-count" x-text="fmt.num(h.count)"></div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Que bloquea cada bot por host (decision 129): la home y una
                 muestra por plantilla, con el robots.txt guardado. -->
            <template x-if="robotsBots && robotsBots.hosts.length">
              <div class="card" style="grid-column:1/-1">
                <div class="card-header"><h2>robots.txt por bot</h2>
                  <span class="text-sm text-dim">Home y una muestra por plantilla, sin pedir nada al sitio</span></div>
                <p class="text-sm text-dim">Bloquear un bot de <b>entrenamiento</b> (GPTBot, ClaudeBot, Google-Extended, Applebot-Extended, CCBot) es una decisión legítima y no saca de ninguna búsqueda. Bloquear uno de <b>búsqueda de IA</b> (OAI-SearchBot, Claude-SearchBot, PerplexityBot) saca al sitio de esas respuestas. Los de <b>usuario</b> (ChatGPT-User, Claude-User) son descargas que pide una persona en el chat.</p>
                <template x-for="h in robotsBots.hosts" :key="h.origen">
                  <div class="mb-2">
                    <div class="text-sm"><a :href="h.url" target="_blank" rel="noopener" x-text="h.origen"></a>
                      <span class="text-dim" x-text="' · ' + (h.status_code || h.error || '—') + ' · ' + h.estado"></span></div>
                    <template x-if="!h.bots">
                      <div class="text-sm text-dim">Sin evaluar por bot: censo analizado antes de la decisión 129 o robots.txt no procesado. Re-analizar lo rellena.</div>
                    </template>
                    <template x-if="h.bots">
                      <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                        <thead><tr><th>Bot</th><th>Tipo</th><th>Home</th><th>Muestra bloqueada</th><th>Alcance</th><th>Regla de la home</th></tr></thead>
                        <tbody>
                          <template x-for="b in robotsBots.bots" :key="b.bot">
                            <tr x-data="{ r: h.bots[b.bot] || {} }">
                              <td x-text="b.token + ' (' + b.proveedor + ')'"></td>
                              <td x-text="({buscador:'Buscador', busqueda_ia:'Búsqueda IA', usuario_ia:'Usuario IA', entrenamiento:'Entrenamiento'})[b.tipo]"></td>
                              <td :class="r.home_bloqueada ? 'orange' : ''" x-text="r.alcance == null ? '—' : (r.home_bloqueada ? 'Bloqueada' : 'Permitida')"></td>
                              <td x-text="r.alcance == null ? '—' : (fmt.num(r.bloqueadas) + ' de ' + fmt.num(r.evaluadas) + (r.n_plantillas_bloqueadas ? ' · ' + r.n_plantillas_bloqueadas + ' plantillas enteras' : ''))"
                                  :title="(r.plantillas_bloqueadas || []).join(', ')"></td>
                              <td :class="r.alcance === 'todo' && b.tipo === 'busqueda_ia' ? 'red' : (r.alcance === 'todo' || r.alcance === 'parte' ? 'orange' : '')"
                                  x-text="({todo:'Todo el sitio', parte:'Una parte', nada:'Nada'})[r.alcance] || 'No evaluado'"></td>
                              <td><code x-show="r.regla_home" x-text="r.regla_home ? ('l.' + r.regla_home.linea + ' ' + r.regla_home.texto) : ''"></code></td>
                            </tr>
                          </template>
                        </tbody>
                      </table></div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- Comprobaciones fuera del censo: certificado (110), soft 404
                 (105), sondas de respuesta (123/124) y sitemaps (126). Cada
                 tarjeta solo si el job trae ese dato: sin el, un rastreo viejo
                 o con la sonda apagada se leeria como «sin problemas». -->
            <template x-if="filasTls(job)">
              <div class="card chk" data-testid="tarjeta-tls">
                <div class="card-header"><h2>Certificado TLS</h2>
                  <span class="text-sm text-dim" x-text="'el día del rastreo · aviso a ' + ((job.config.analysis_thresholds || {}).tls_dias_aviso || 7) + ' días'"></span></div>
                <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Host</th><th>Estado</th><th>Emisor</th><th>Caduca</th><th>Días</th><th>Versión</th></tr></thead>
                  <tbody>
                    <template x-for="t in filasTls(job)" :key="t.host">
                      <tr :title="t.detalle || ''">
                        <td x-text="t.host"></td>
                        <td :class="t.nivel === 'dim' ? 'text-dim' : t.nivel" x-text="t.estado"></td>
                        <td x-text="t.emisor || '—'"></td>
                        <td x-text="t.caduca ? fmt.dia(t.caduca) : '—'"></td>
                        <td x-text="t.dias == null ? '—' : fmt.num(t.dias)"></td>
                        <td x-text="t.version || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSoft404(job)">
              <div class="card chk" data-testid="tarjeta-soft404" x-data="{ get s4() { return resumenSoft404(job) } }">
                <div class="card-header"><h2>Soft 404</h2>
                  <span class="text-sm text-dim">qué responde el sitio a una URL que no existe</span></div>
                <div class="text-sm mb-1">
                  <template x-if="s4.analizado">
                    <span>
                      <strong :class="s4.soft_404 ? 'red' : 'green'" x-text="fmt.num(s4.soft_404) + (s4.soft_404 === 1 ? ' página' : ' páginas')"></strong>
                      son la página de error del sitio con un 200<span x-show="s4.indexables" x-text="' (' + fmt.num(s4.indexables) + ' indexables)'"></span><span x-show="s4.candidatos" x-text="' · ' + fmt.num(s4.candidatos) + ' candidatas sin afirmar'"></span>.
                      <a href="#" @click.prevent="verTipoDeIncidencia('soft_404', ''); switchTab('issues')" x-show="s4.soft_404">Ver</a>
                    </span>
                  </template>
                  <template x-if="!s4.analizado">
                    <span class="text-dim">Sondas hechas, sin analizar todavía.</span>
                  </template>
                  <span class="text-dim" x-text="' ' + fmt.num(s4.sondas) + (s4.sondas === 1 ? ' sonda' : ' sondas') + (s4.con_huella != null ? ', ' + fmt.num(s4.con_huella) + ' con huella' : '') + '.'"></span>
                </div>
                <div class="table-wrap"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Host</th><th>Plantilla</th><th>Respuesta</th><th title="Páginas del censo con la huella de esta sonda, sobre las de su host o su plantilla">Con su huella</th></tr></thead>
                  <tbody>
                    <!-- Por posicion: una sonda que redirige se repite en el destino con la
                         MISMA clave (http -> https del mismo host) -->
                    <template x-for="(f, i) in s4.filas" :key="i">
                      <tr :title="f.url + (f.redirige_a ? ' → ' + f.redirige_a : '')">
                        <td x-text="f.host"></td>
                        <td x-text="f.plantilla || 'raíz'"></td>
                        <td :class="f.nivel === 'dim' ? 'text-dim' : f.nivel" x-text="f.lectura"></td>
                        <td x-text="f.coincidencias == null ? '—' : fmt.num(f.coincidencias) + ' de ' + fmt.num(f.alcance) + (f.devuelve_portada ? ' · devuelve la portada' : (f.ambigua ? ' · huella de plantilla' : ''))"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="resumenSondas(job)">
              <div class="card chk" data-testid="tarjeta-sondas">
                <div class="card-header"><h2>Enlaces externos y recursos</h2>
                  <span class="text-sm text-dim">sondas fuera del censo</span></div>
                <template x-for="b in resumenSondas(job)" :key="b.etiqueta">
                  <div class="mb-1">
                    <div class="text-sm">
                      <strong x-text="b.etiqueta"></strong>:
                      <span x-text="fmt.num(b.comprobados) + (b.distintos != null ? ' comprobados de ' + fmt.num(b.distintos) + ' distintos' : ' comprobados')"></span>
                      · <span :class="b.rotos ? 'red' : 'green'" x-text="fmt.num(b.rotos) + (b.rotos === 1 ? ' roto' : ' rotos')"></span>
                      <span x-show="b.dominios_muertos" class="orange" x-text="' · ' + fmt.num(b.dominios_muertos) + (b.dominios_muertos === 1 ? ' dominio muerto' : ' dominios muertos')"></span>
                    </div>
                    <div x-show="b.parcial" class="text-sm orange">No se comprobaron todos (tope alcanzado): que no haya aviso no dice que el resto esté bien.</div>
                    <div class="text-dim" style="font-size:.78rem" x-show="b.por_veredicto.length"
                         x-text="b.por_veredicto.map(([v, n]) => v.replace(/_/g, ' ') + ': ' + fmt.num(n)).join(' · ')"></div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="resumenSitemaps(job)">
              <div class="card chk" data-testid="tarjeta-sitemaps" x-data="{ get sm() { return resumenSitemaps(job) }, abierto: false }">
                <div class="card-header"><h2>Sitemaps</h2>
                  <span class="text-sm text-dim" x-text="fmt.num(sm.leidos) + ' de ' + fmt.num(sm.pedidos) + (sm.pedidos === 1 ? ' fichero leído' : ' ficheros leídos')"></span></div>
                <div class="text-sm">
                  <span x-text="fmt.num(sm.devueltas) + ' entradas' + (sm.declaradas && sm.declaradas !== sm.devueltas ? ' de ' + fmt.num(sm.declaradas) + ' declaradas' : '')"></span>
                  <span class="text-dim" x-show="sm.formatos.length" x-text="' · ' + sm.formatos.map(([f, n]) => f + (n > 1 ? ' ×' + n : '')).join(', ')"></span>
                </div>
                <div x-show="sm.parcial" class="text-sm orange">Lectura parcial: hubo ficheros sin leer o cortados, así que «fuera del sitemap» no se puede afirmar para todo el sitio.</div>
                <div x-show="sm.fallidos" class="text-sm orange" x-text="fmt.num(sm.fallidos) + (sm.fallidos === 1 ? ' fichero no respondió 200' : ' ficheros no respondieron 200')"></div>
                <div x-show="sm.recortadas" class="text-sm text-dim" x-text="'Se guardaron ' + fmt.num(sm.guardadas) + ' entradas (tope ' + fmt.num(sm.tope) + '): la ficha de una URL puede no decir de qué fichero viene.'"></div>
                <a href="#" class="text-sm" x-show="sm.ficheros.length" @click.prevent="abierto = !abierto" x-text="abierto ? 'Ocultar ficheros' : 'Ver ficheros'"></a>
                <div class="table-wrap" x-show="abierto"><table class="tbl" style="font-size:.8rem">
                  <thead><tr><th>Fichero</th><th>Código</th><th>Formato</th><th>Entradas</th><th>Hijos</th></tr></thead>
                  <tbody>
                    <template x-for="f in sm.ficheros.slice(0, 200)" :key="f.url">
                      <tr>
                        <td style="word-break:break-all"><a :href="f.url" target="_blank" rel="noopener" x-text="f.url"></a></td>
                        <td :class="f.status && f.status !== 200 ? 'orange' : ''" x-text="f.status ?? '—'"></td>
                        <td x-text="f.formato || '—'"></td>
                        <td x-text="f.devueltas == null ? '—' : fmt.num(f.devueltas) + (f.cortado ? ' (cortado)' : '')"></td>
                        <td x-text="f.hijos ? fmt.num(f.hijos) : '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <div class="card" style="grid-column:1/-1">
              <div class="card-header"><h2>Configuración</h2></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem;font-size:.85rem">
                <!-- Las semillas pueden ser miles (un censo sembrado desde el
                     sitemap): pintadas enteras, la ficha de Lopesan medía
                     114.000 px. Se ven tres y el resto bajo demanda. -->
                <div style="grid-column:1/-1">
                  <span class="text-dim">Semillas</span>
                  <span class="text-dim" x-text="'(' + fmt.num((job.seeds || []).length) + '):'"></span>
                  <span x-text="(job.seeds || []).slice(0, 3).join(', ')" style="word-break:break-all"></span>
                  <template x-if="(job.seeds || []).length > 3">
                    <details class="seeds-more">
                      <summary x-text="'y ' + fmt.num(job.seeds.length - 3) + ' más · ver todas'"></summary>
                      <div class="seeds-list">
                        <template x-for="s in job.seeds" :key="s"><div x-text="s"></div></template>
                      </div>
                    </details>
                  </template>
                </div>
                <div><span class="text-dim">Prof. máxima:</span> <span x-text="job.config?.max_depth"></span></div>
                <div><span class="text-dim">Max URLs:</span> <span x-text="fmt.num(job.config?.max_urls)"></span></div>
                <div><span class="text-dim">Concurrencia:</span> <span x-text="job.config?.concurrent_requests"></span></div>
                <div><span class="text-dim">Por dominio:</span> <span x-text="job.config?.concurrent_requests_per_domain"></span></div>
                <div><span class="text-dim">Seguir externos:</span> <span x-text="job.config?.follow_external ? 'Si' : 'No'"></span></div>
                <div><span class="text-dim">Robots.txt:</span> <span x-text="({respect:'Respetar',ignore:'Ignorar',audit:'Auditar (no bloquea)'})[job.config?.robots_mode] || 'Respetar'"></span></div>
                <div><span class="text-dim">Renderizar JS:</span> <span x-text="job.config?.render_js ? 'Si' : 'No'"></span></div>
                <div><span class="text-dim">Huella TLS:</span> <span x-text="({'chrome124':'Chrome','safari17_0':'Safari','edge101':'Edge'})[job.config?.impersonate] || job.config?.impersonate || 'Chrome'"></span></div>
                <div style="grid-column:1/-1"><span class="text-dim">User Agent:</span> <span class="text-sm" x-text="job.config?.user_agent" style="word-break:break-all"></span></div>
                <div><span class="text-dim">Iniciado:</span> <span x-text="fmt.date(job.started_at)"></span></div>
                <div><span class="text-dim">Finalizado:</span> <span x-text="fmt.date(job.completed_at)"></span></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: PROBLEMAS =====
             Por defecto, una fila por TIPO (UX-04): 38.922 filas sueltas en
             779 paginas no se leen. Cada tipo dice que es, que decide Google y
             como se arregla (incidencias.js). La lista plana sigue ahi: al
             elegir un tipo, o con «Ver como lista». -->
        <template x-if="detailTab === 'issues' && !issueFilters.issue_type && issuesVista === 'tipos'">
          <div>
            <div class="flex gap-1 mb-2 items-center" style="flex-wrap:wrap">
              <template x-for="g in [['', 'Todas'], ['error', 'Errores'], ['warning', 'Avisos'], ['info', 'Info']]" :key="g[0]">
                <button class="btn btn-sm chip" :class="issueFilters.severity === g[0] && 'chip-on'"
                        @click="issueFilters.severity = g[0]">
                  <span x-text="g[1]"></span>
                  <!-- Tipos, no paginas: una pagina con tres problemas sumaria tres
                       veces y el total pasaria del numero de paginas del sitio. -->
                  <span class="text-dim" x-show="issuesResumen"
                        x-text="(n => n + (n === 1 ? ' tipo' : ' tipos'))(resumenIssues(g[0]).length)"></span>
                </button>
              </template>
              <!-- Segmento de negocio (decision 125): el % es sobre SUS URLs. -->
              <select class="exp-problema" :class="issuesSegmento && 'has-value'" aria-label="Segmento"
                      @focus="!segmentosJob && cargarSegmentos()" @change="elegirSegmentoProblemas($event.target.value)"
                      style="width:auto;max-width:16rem">
                <option value="" :selected="!issuesSegmento">Todos los segmentos</option>
                <template x-if="segmentosParaElegir().regla.length">
                  <optgroup label="Segmentos de negocio">
                    <template x-for="g in segmentosParaElegir().regla" :key="g.segmento">
                      <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                    </template>
                  </optgroup>
                </template>
                <optgroup label="Sin regla: forma de la ruta">
                  <template x-for="g in segmentosParaElegir().forma" :key="g.segmento">
                    <option :value="g.segmento" :selected="issuesSegmento === g.segmento" x-text="g.segmento + ' · ' + fmt.num(g.urls) + ' URLs'"></option>
                  </template>
                </optgroup>
              </select>
              <button class="btn btn-sm" style="margin-left:auto" @click="issuesVista = 'lista'; issues = []; loadIssues()">
                <i data-lucide="list" style="width:13px;height:13px"></i> Ver todas como lista</button>
            </div>
            <template x-if="!issuesResumen">
              <div class="loading-overlay"><div class="spinner"></div> Agrupando incidencias…</div>
            </template>
            <template x-if="issuesResumen && !resumenIssues(issueFilters.severity).length">
              <div class="empty"><h3>No hay incidencias de esta gravedad</h3></div>
            </template>
            <div class="issue-groups">
              <template x-for="r in resumenIssues(issueFilters.severity)" :key="r.issue_type + r.severity">
                <div class="issue-group" :class="'sev-' + r.severity">
                  <button class="issue-group-head" @click="grupoAbierto[r.issue_type] = !grupoAbierto[r.issue_type]"
                          :aria-expanded="!!grupoAbierto[r.issue_type]">
                    <span class="sev-chip" :class="'sev-' + r.severity" x-text="fmt.severity(r.severity)"></span>
                    <span class="issue-group-name">
                      <strong x-text="fmt.issue(r.issue_type)"></strong>
                      <span class="text-dim" x-text="(ISSUE_INFO[r.issue_type] || {}).que || ''"></span>
                    </span>
                    <span class="issue-group-count">
                      <strong x-text="fmt.num(r.paginas)"></strong> <span x-text="r.paginas === 1 ? 'página' : 'páginas'"></span>
                      <span class="text-dim" x-show="r.incidencias !== r.paginas" x-text="'· ' + fmt.num(r.incidencias) + ' incidencias'"></span>
                      <span class="text-dim" x-show="r.pct_paginas != null" x-text="'· ' + fmt.num(r.pct_paginas) + ' % de ' + fmt.num(r.urls_denominador) + ' URLs del segmento'"></span>
                      <!-- Un tipo que solo tiene incidencias de un hallazgo para muchas
                           paginas no se puede repartir: sale con 0 y lo dice, no desaparece. -->
                      <span class="text-dim" x-show="issuesSegmento && r.agregadas" x-text="'· ' + fmt.num(r.agregadas) + ' sin repartir por segmento'"></span>
                    </span>
                    <i data-lucide="chevron-down" style="width:14px;height:14px" class="issue-group-caret"></i>
                  </button>
                  <div class="issue-group-body" x-show="grupoAbierto[r.issue_type]">
                    <template x-if="ISSUE_INFO[r.issue_type]">
                      <dl class="issue-explica">
                        <dt>Qué decide Google</dt><dd x-text="ISSUE_INFO[r.issue_type].google"></dd>
                        <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[r.issue_type].arreglo"></dd>
                      </dl>
                    </template>
                    <template x-if="r.por_segmento && r.por_segmento.length && !issuesSegmento">
                      <div class="issue-segmentos">
                        <div class="text-sm text-dim" style="margin:.5rem 0 .25rem">Por segmento · páginas afectadas sobre las URLs del segmento</div>
                        <ul>
                          <template x-for="p in r.por_segmento" :key="p.segmento">
                            <li>
                              <button class="chip-tramo" @click="elegirSegmentoProblemas(p.segmento)" :title="'Ver solo ' + p.segmento">
                                <code x-text="p.segmento || '(sin segmentar)'"></code>
                              </button>
                              <strong x-text="fmt.num(p.pct) + ' %'"></strong>
                              <span class="text-dim" x-text="fmt.num(p.paginas) + ' de ' + fmt.num(p.urls)"></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                    <template x-if="r.agregadas">

            <template x-if="issueFilters.issue_type && ISSUE_INFO[issueFilters.issue_type]">

                  <span x-text="ISSUE_INFO[issueFilters.issue_type].que"></span></div>

        <!-- ===== PESTANA: SEMANTICO ===== -->
        <template x-if="detailTab === 'semantic'">
          <div>
            <!-- Header: metricas globales -->
            <template x-if="semanticResults && semanticResults.site_metrics">
              <div style="display:flex;align-items:center;gap:1.5rem;padding:.75rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap">
                <span class="text-sm" data-tip="Coherencia tematica del sitio (0-100). Cuanto mas alto, mas enfocado esta el contenido en un mismo tema. Sitios nicho suelen tener >70, sitios genericos <40."><strong>Focus:</strong> <span x-text="(semanticResults.site_metrics.focus_score * 100).toFixed(1)"></span>%</span>
                <span class="text-sm" data-tip="Distancia máxima de cualquier página al centro semántico. Indica cuanto se dispersa el contenido. Valores altos = contenido muy variado."><strong>Radius:</strong> <span x-text="semanticResults.site_metrics.semantic_radius"></span></span>
                <span class="text-sm" data-tip="Impacto de las páginas con mas autoridad que estan lejos del centro. Si una página importante (alto PageRank/clicks) esta lejos del tema principal, arrastra el centro semántico del sitio."><strong>Drift:</strong> <span x-text="semanticResults.site_metrics.drift_score"></span></span>
                <span class="text-sm" data-tip="Total de páginas indexables con contenido suficiente (min 150 palabras) incluidas en el análisis."><strong>Páginas:</strong> <span x-text="semanticResults.site_metrics.total_pages"></span></span>
                <span class="text-sm" data-tip="Grupos temáticos detectados automáticamente (HDBSCAN). Cada cluster agrupa páginas con contenido semanticamente similar."><strong>Clusters:</strong> <span x-text="semanticResults.site_metrics.n_clusters"></span></span>
                <span class="text-sm" data-tip="Pares de páginas con contenido tan similar que compiten entre si en buscadores. Cuantos mas pares, mas canibalización tiene el sitio."><strong>Canibalización:</strong> <span x-text="semanticResults.site_metrics.n_cannibal_pairs"></span> pares</span>
                <button class="btn btn-sm" style="margin-left:auto;display:flex;align-items:center;gap:.3rem" @click="exportSemanticCsv()">
                  <i data-lucide="download" style="width:13px;height:13px"></i> Export CSV
                </button>
              </div>
            </template>

            <!-- GSC Summary -->
            <template x-if="semanticResults && semanticResults.gsc_summary">
              <div style="display:flex;align-items:center;gap:1.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap;border-left:3px solid #4285f4">
                <span class="text-sm" style="font-weight:600;color:#4285f4;display:flex;align-items:center;gap:.3rem">
                  <i data-lucide="bar-chart-3" style="width:14px;height:14px"></i> GSC
                </span>
                <span class="text-sm" data-tip="Total de clicks organicos de Google Search Console para las URLs del análisis."><strong>Clicks:</strong> <span x-text="semanticResults.gsc_summary.total_clicks.toLocaleString('es-ES')"></span></span>
                <span class="text-sm" data-tip="Total de impresiones en resultados de Google para las URLs del análisis."><strong>Impressions:</strong> <span x-text="semanticResults.gsc_summary.total_impressions.toLocaleString('es-ES')"></span></span>
                <span class="text-sm" data-tip="CTR medio (Click-Through Rate). Porcentaje de impresiones que generan click."><strong>CTR medio:</strong> <span x-text="(semanticResults.gsc_summary.avg_ctr * 100).toFixed(2) + '%'"></span></span>
                <span class="text-sm" data-tip="Posicion media en los resultados de Google. Menor = mejor posicionamiento."><strong>Pos. media:</strong> <span x-text="semanticResults.gsc_summary.avg_position"></span></span>
                <span class="text-sm text-dim" data-tip="Número de URLs del análisis que tienen datos en GSC."><span x-text="semanticResults.gsc_summary.urls_with_data"></span> URLs con datos</span>
              </div>
            </template>

            <!-- Ring summary cards -->
            <template x-if="semanticResults && semanticResults.site_metrics && semanticResults.site_metrics.ring_counts">
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem">
                <template x-for="ring in ['Core','Focus','Expansion','Peripheral']" :key="ring">
                  <div class="card" style="padding:.75rem 1rem;border-left:3px solid"
                       :style="'border-left-color:' + ({Core:'#34a853',Focus:'#4285f4',Expansion:'#fbbc04',Peripheral:'#ea4335'})[ring]"
                       :data-tip="({Core:'Paginas mas cercanas al centro semantico (Q1). Son el nucleo tematico del sitio: el contenido que mejor define de que trata.',Focus:'Paginas cercanas al centro (Q1-Q2). Refuerzan el tema principal con contenido relevante y complementario.',Expansion:'Paginas a distancia media (Q2-Q3). Cubren temas relacionados pero no centrales. Oportunidad de reforzar o redirigir.',Peripheral:'Paginas mas alejadas del centro (>Q3). Contenido tangencial o fuera de tema. Candidatas a revisar, consolidar o eliminar.'})[ring]">
                    <div style="font-size:.8rem;font-weight:600" :style="'color:' + ({Core:'#34a853',Focus:'#4285f4',Expansion:'#fbbc04',Peripheral:'#ea4335'})[ring]" x-text="ring"></div>
                    <div style="font-size:1.5rem;font-weight:700" :style="'color:' + ({Core:'#34a853',Focus:'#4285f4',Expansion:'#fbbc04',Peripheral:'#ea4335'})[ring]"
                         x-text="semanticResults.site_metrics.ring_counts[ring] || 0"></div>
                    <div class="text-dim text-sm" x-text="((semanticResults.site_metrics.ring_counts[ring] || 0) / semanticResults.total_pages * 100).toFixed(1) + '%'"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Panel: GSC + Parametros + Analisis -->
            <template x-if="!semanticResults">
              <div class="card" style="padding:1.5rem">
                <h3 style="margin-bottom:1rem;display:flex;align-items:center;gap:.4rem">
                  <i data-lucide="brain" style="width:18px;height:18px"></i> Análisis semántico
                </h3>
                <!-- Que da, antes de pedir nada (UX-18): antes se abria con una
                     cuenta de GSC, una clave y tres deslizadores. -->
                <div class="semantico-intro">
                  <p>Convierte el contenido de cada página indexable en un vector (embeddings de Gemini) y contesta:</p>
                  <ul>
                    <li><strong>De qué va el sitio</strong>: cuánto se concentra en su tema y qué páginas se alejan de él.</li>
                    <li><strong>Canibalización</strong>: parejas de páginas tan parecidas que compiten entre sí.</li>
                    <li><strong>Huecos</strong>: qué página tuya cubre mejor un tema concreto, o si no hay ninguna.</li>
                  </ul>
                  <p class="text-dim text-sm">Necesita una API key de Gemini (los embeddings cuestan céntimos por miles de páginas). Search Console es opcional: si se añade, las páginas con más clics pesan más.</p>
                </div>

                <!-- GSC Section -->
                <div style="margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)">
                  <h4 style="margin-bottom:.5rem;font-size:.9rem;display:flex;align-items:center;gap:.3rem" data-tip="Conecta GSC para incluir clicks reales de Google en el calculo de autoridad. Sin GSC, solo se usa PageRank interno. Con GSC, las páginas con mas trafico organico influyen mas en el centro semántico.">
                    <i data-lucide="bar-chart-3" style="width:14px;height:14px"></i> Google Search Console (opcional)
                  </h4>
                  <div style="display:flex;gap:.5rem;align-items:end;flex-wrap:wrap">
                    <div>
                      <label class="text-dim text-sm">Cuenta GSC</label>
                      <select style="display:block;margin-top:.2rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem"
                              x-model="semanticGscAccountId" @change="semanticGscProps = []; semanticGscProp = ''">
                        <option value="">Sin GSC</option>
                        <template x-for="acc in gscAccounts" :key="acc.id">
                          <option :value="acc.id" x-text="acc.name"></option>
                        </template>
                      </select>
                    </div>
                    <button class="btn btn-sm" @click="showGscUploadModal = true" style="display:flex;align-items:center;gap:.25rem">
                      <i data-lucide="upload" style="width:12px;height:12px"></i> Subir cuenta
                    </button>
                    <template x-if="semanticGscAccountId">
                      <button class="btn btn-sm" @click="loadGscProperties()" :disabled="gscPropsLoading" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="gscPropsLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Cargar propiedades
                      </button>
                    </template>
                    <template x-if="semanticGscProps.length > 0">
                      <div>
                        <select style="padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem"
                                x-model="semanticGscProp">
                          <option value="">Seleccionar propiedad</option>
                          <template x-for="prop in semanticGscProps" :key="prop">
                            <option :value="prop" x-text="prop"></option>
                          </template>
                        </select>
                      </div>
                    </template>
                    <template x-if="semanticGscProp">
                      <div>
                        <label class="text-dim text-sm">Rango</label>
                        <select style="display:block;margin-top:.2rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.85rem"
                                x-model="semanticGscDays">
                          <option value="90">90 dias</option>
                          <option value="180">6 meses</option>
                          <option value="365">12 meses</option>
                          <option value="480">16 meses (max)</option>
                        </select>
                      </div>
                    </template>
                    <template x-if="semanticGscProp">
                      <button class="btn btn-sm btn-primary" @click="fetchGscData()" :disabled="gscFetchLoading" style="display:flex;align-items:center;gap:.25rem">
                        <template x-if="gscFetchLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                        Obtener datos GSC
                      </button>
                    </template>
                  </div>
                  <template x-if="gscFetchResult">
                    <p class="text-sm" style="margin-top:.5rem;color:var(--green)" x-text="'GSC: ' + gscFetchResult.matched + ' URLs emparejadas de ' + gscFetchResult.total_gsc_rows + ' filas' + (gscFetchResult.query_rows ? ' | ' + gscFetchResult.query_rows.toLocaleString('es-ES') + ' query-page rows' : '')"></p>
                  </template>
                </div>

                <!-- Gemini API key (cada cliente paga su consumo de embeddings) -->
                <div style="margin-bottom:1.25rem" data-tip="El análisis genera embeddings via la API de Gemini. Cada cliente usa su propia API key para que el coste se facture en su cuenta de Google AI. La key se guarda solo aquí y nunca se devuelve completa al frontend.">
                  <h4 style="margin-bottom:.5rem;font-size:.9rem">API key de Gemini</h4>
                  <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
                    <select x-model="semanticGeminiAccountId" style="flex:1;min-width:200px">
                      <option value="">— Selecciona una API key —</option>
                      <template x-for="acc in geminiAccounts" :key="acc.id">
                        <option :value="acc.id" x-text="acc.name + ' (' + acc.api_key_preview + ')'"></option>
                      </template>
                    </select>
                    <button class="btn btn-sm" @click="showGeminiModal = true; geminiFormError = null">+ Nueva</button>
                    <template x-if="semanticGeminiAccountId">

                    </template>
                  </div>
                  <template x-if="geminiAccounts.length === 0">
                    <p class="text-sm text-dim" style="margin-top:.5rem">No hay API keys guardadas. Anade una para poder lanzar análisis.</p>
                  </template>
                </div>

                <!-- Modal: nueva API key Gemini -->
                <template x-if="showGeminiModal">
                  <div class="modal-backdrop" @click.self="showGeminiModal = false" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000">
                    <div class="card" style="max-width:480px;width:90%;padding:1.5rem">
                      <h3 style="margin-bottom:1rem">Nueva API key de Gemini</h3>
                      <div style="margin-bottom:.75rem">
                        <label class="text-dim text-sm">Nombre identificativo</label>
                        <input type="text" x-model="geminiFormName" placeholder="Cliente X" style="width:100%">
                      </div>
                      <div style="margin-bottom:.75rem">
                        <label class="text-dim text-sm">API key</label>

                        <p class="text-sm text-dim" style="margin-top:.25rem">Obtenla en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
                      </div>
                      <template x-if="geminiFormError">
                        <p class="text-sm" style="color:var(--red);margin-bottom:.5rem" x-text="geminiFormError"></p>

                        <button class="btn btn-sm btn-primary" @click="saveGeminiAccount()">Guardar</button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Parametros: plegados, los valores por defecto sirven casi siempre -->
                <details class="config-avanzada" style="margin-bottom:1.25rem">
                  <summary><span>Parámetros</span>
                    <span class="text-dim text-sm" x-text="'PageRank ' + semanticAlpha + ' · clics ' + semanticBeta + ' · canibalización desde ' + semanticThreshold"></span></summary>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem">
                    <div data-tip="Peso del PageRank interno en el calculo de autoridad. Con alpha=1.0 solo usa PageRank. Si tienes datos GSC, baja alpha para dar peso a clicks reales.">
                      <label class="text-dim text-sm">Alpha (PageRank): <span x-text="semanticAlpha"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticAlpha" style="width:100%">
                    </div>
                    <div data-tip="Peso de los clicks de Google Search Console. Solo aplica si has importado datos GSC. Con beta=0.4 las páginas con mas trafico organico tendran mas influencia en el centro semántico.">
                      <label class="text-dim text-sm">Beta (Clicks GSC): <span x-text="semanticBeta"></span></label>
                      <input type="range" min="0" max="1" step="0.05" x-model.number="semanticBeta" style="width:100%">
                    </div>
                    <div data-tip="Similitud coseno minima para considerar dos páginas como canibalización. 0.92 = conservador (solo pares muy similares). Baja a 0.85 para detectar mas pares, sube a 0.95 para solo los mas criticos.">
                      <label class="text-dim text-sm">Umbral canibalización: <span x-text="semanticThreshold"></span></label>
                      <input type="range" min="0.8" max="0.99" step="0.01" x-model.number="semanticThreshold" style="width:100%">
                    </div>
                  </div>
                </details>

                <!-- Boton Analizar -->
                <button class="btn btn-primary" @click="runSemanticAnalysis()" :disabled="semanticLoading"
                        style="display:flex;align-items:center;gap:.4rem;font-size:.95rem;padding:.6rem 1.5rem">
                  <template x-if="semanticLoading"><span class="spinner" style="width:16px;height:16px"></span></template>
                  <i data-lucide="brain" style="width:16px;height:16px" x-show="!semanticLoading"></i>
                  Analizar
                </button>
              </div>
            </template>

            <!-- Progress bar -->
            <template x-if="semanticLoading && semanticProgress">
              <div class="card" style="padding:1rem;margin-bottom:1rem">
                <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem">
                  <span class="spinner" style="width:16px;height:16px"></span>
                  <span class="text-sm" x-text="semanticStageLabel(semanticProgress.stage)"></span>
                  <span class="text-sm text-dim" x-text="semanticProgress.progress + '%'" style="margin-left:auto"></span>
                </div>
                <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;background:var(--accent);border-radius:3px;transition:width .3s" :style="'width:' + semanticProgress.progress + '%'"></div>
                </div>
              </div>
            </template>

            <!-- Error -->
            <template x-if="semanticError">
              <div class="card" style="padding:1rem;border-color:var(--red);color:var(--red);margin-bottom:1rem">
                <span x-text="semanticError"></span>
                <button class="btn btn-sm" style="margin-left:1rem" @click="semanticError=null;semanticResults=null">Reintentar</button>
              </div>
            </template>

            <!-- Sub-tabs de resultados -->
            <template x-if="semanticResults">
              <div>
                <div class="tabs" style="margin-bottom:1rem">
                  <button type="button" class="tab" :class="semanticSubTab === 'rings' && 'active'" @click="semanticSubTab='rings'; renderSemanticChart('rings')" data-tip="Visualizacion en anillos concentricos. Las páginas se colocan según su distancia al centro semántico del sitio. Core = tema principal, Peripheral = contenido lejano.">Anillos</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'scatter' && 'active'" @click="semanticSubTab='scatter'; renderSemanticChart('scatter')" data-tip="Mapa 2D donde cada punto es una página. Las páginas cercanas tratan temas similares. Los colores agrupan clusters temáticos detectados automáticamente.">Mapa de temas</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'cannibal' && 'active'" @click="semanticSubTab='cannibal'; loadCannibalization()" data-tip="Pares de páginas con contenido casi identico que compiten entre si en Google. La URL dominante es la de mayor autoridad (PageRank/clicks). La debil es candidata a consolidar, redirigir o diferenciar.">Canibalización</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'drift' && 'active'" @click="semanticSubTab='drift'; loadDrift()" data-tip="Páginas con alta autoridad que estan lejos del tema central. Al tener mucho peso, arrastran el centro semántico del sitio. Candidatas a reenfocar o desacoplar.">Desvío del tema</button>
                  <button type="button" class="tab" :class="semanticSubTab === 'gap' && 'active'" @click="semanticSubTab='gap'" data-tip="Busca que páginas de tu sitio son mas relevantes para un tema concreto. Compara embeddings directamente para encontrar contenido existente que cubra o se acerque al topico buscado.">Huecos</button>
                </div>

                <!-- Ring Map -->
                <template x-if="semanticSubTab === 'rings'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Cada punto es una página posicionada según su distancia al <strong>centro semántico actual</strong> del sitio. El centro se calcula como la media ponderada de todos los embeddings (peso = PageRank + clicks GSC). <strong>PageRank</strong> mide la importancia de cada pagina segun cuantos enlaces internos recibe y de que paginas: una URL enlazada desde muchas paginas (o desde paginas importantes) tiene mas PageRank. Es la misma logica que usa Google internamente. Las paginas del anillo <strong style="color:#34a853">Core</strong> definen el tema principal, las del <strong style="color:#ea4335">Peripheral</strong> estan fuera de foco. El tamaño del punto refleja su autoridad.</p>
                    <div id="semantic-ring-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden"></div>

                    <!-- Target Theme -->
                    <div class="card" style="padding:1rem;margin-top:1rem">
                      <h4 style="margin-bottom:.5rem;font-size:.9rem;display:flex;align-items:center;gap:.3rem" data-tip="Define el tema ideal de tu sitio. El sistema re-centra los anillos alrededor de ese tema y te dice que páginas reforzar (estan cerca del objetivo pero con poca autoridad) y cuales reenfocar (tienen mucha autoridad pero estan lejos del objetivo).">
                        <i data-lucide="target" style="width:14px;height:14px"></i> Tema objetivo
                      </h4>
                      <p class="text-dim text-sm" style="margin-bottom:.5rem">Describe el tema central ideal de tu sitio (5-15 palabras para mejor precision). El sistema re-centrara los anillos alrededor de ese tema y mostrara como mover el centro semantico hacia el.</p>
                      <div style="display:flex;gap:.5rem;align-items:end">
                        <div style="flex:1">
                          <input type="text" x-model="targetTheme" placeholder="Ej: Formacion Profesional online a distancia, ciclos de grado medio y superior"
                                 style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.9rem">
                        </div>
                        <button class="btn btn-primary btn-sm" @click="analyzeTarget()" :disabled="targetLoading || !targetTheme.trim()" style="display:flex;align-items:center;gap:.25rem">
                          <template x-if="targetLoading"><span class="spinner" style="width:12px;height:12px"></span></template>
                          <i data-lucide="target" style="width:13px;height:13px" x-show="!targetLoading"></i>
                          Re-centrar
                        </button>
                      </div>

                      <!-- Target Results -->
                      <template x-if="targetResults">
                        <div style="margin-top:1rem">
                          <!-- Alignment Score -->
                          <div style="display:flex;align-items:center;gap:1.5rem;padding:.6rem 1rem;background:var(--surface);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap">
                            <span class="text-sm" data-tip="Similitud coseno entre el centro semántico actual del sitio y el tema objetivo. 100% = perfectamente alineado.">
                              <strong>Alineamiento:</strong>
                              <span :style="'font-weight:700;color:' + (targetResults.alignment >= 0.9 ? 'var(--green)' : targetResults.alignment >= 0.8 ? 'var(--orange)' : 'var(--red)')"
                                    x-text="(targetResults.alignment * 100).toFixed(1) + '%'"></span>
                            </span>
                            <span class="text-sm text-dim" x-text="'Tema: ' + targetResults.target_theme"></span>
                            <template x-for="ring in ['Core','Focus','Expansion','Peripheral']" :key="ring">
                              <span class="text-sm" :style="'color:' + ({Core:'#34a853',Focus:'#4285f4',Expansion:'#fbbc04',Peripheral:'#ea4335'})[ring]">
                                <strong x-text="ring + ': '"></strong><span x-text="targetResults.ring_counts[ring] || 0"></span>
                              </span>
                            </template>
                          </div>

                          <!-- Target Ring Map -->
                          <div id="semantic-target-ring-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden;margin-bottom:1rem"></div>

                          <!-- Recommendations -->
                          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                            <!-- Reinforce -->
                            <div>
                              <h5 style="font-size:.85rem;margin-bottom:.5rem;color:#34a853;display:flex;align-items:center;gap:.3rem" data-tip="Páginas cercanas al tema objetivo pero con poca autoridad. Refuerza el enlazado interno hacia ellas para mover el centro semántico hacia tu objetivo.">
                                <i data-lucide="arrow-up-circle" style="width:14px;height:14px"></i> Reforzar (enlazar mas)
                              </h5>
                              <template x-if="targetResults.reinforce.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.reinforce.length > 0">
                                <div style="max-height:300px;overflow-y:auto">
                                  <table class="tbl" style="font-size:.8rem">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.reinforce" :key="r.url_id">
                                        <tr>
                                          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="r.weight.toFixed(3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--orange)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>

                            <!-- Refocus -->
                            <div>
                              <h5 style="font-size:.85rem;margin-bottom:.5rem;color:#ea4335;display:flex;align-items:center;gap:.3rem" data-tip="Páginas con alta autoridad pero alejadas del tema objetivo. Estan arrastrando el centro semántico en otra direccion. Opciones: reenfocar su contenido hacia el objetivo, o reducir su enlazado interno.">
                                <i data-lucide="arrow-down-circle" style="width:14px;height:14px"></i> Reenfocar (alejadas del objetivo)
                              </h5>
                              <template x-if="targetResults.refocus.length === 0">
                                <p class="text-dim text-sm">No hay candidatas.</p>
                              </template>
                              <template x-if="targetResults.refocus.length > 0">
                                <div style="max-height:300px;overflow-y:auto">
                                  <table class="tbl" style="font-size:.8rem">
                                    <thead><tr><th>URL</th><th>Peso</th><th data-tip="Anillo actual → anillo con el tema objetivo">Cambio</th></tr></thead>
                                    <tbody>
                                      <template x-for="r in targetResults.refocus" :key="r.url_id">
                                        <tr>
                                          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="r.url" x-text="r.url.replace(/^https?:\/\/[^\/]+/, '')"></td>
                                          <td x-text="r.weight.toFixed(3)"></td>
                                          <td><span :style="r.ring_current !== r.ring_target ? 'color:var(--red)' : ''" x-text="r.ring_current + ' → ' + r.ring_target"></span></td>
                                        </tr>
                                      </template>
                                    </tbody>
                                  </table>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Scatter UMAP -->
                <template x-if="semanticSubTab === 'scatter'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Proyeccion 2D del espacio de embeddings (UMAP). Paginas cercanas tratan temas similares. Los colores representan clusters tematicos (HDBSCAN). Puntos con borde rojo son outliers semanticos. Pasa el raton sobre un punto para ver la URL y sus metricas.</p>
                    <div id="semantic-scatter-chart" style="width:100%;height:600px;border-radius:8px;overflow:hidden"></div>
                  </div>
                </template>

                <!-- Canibalizacion -->
                <template x-if="semanticSubTab === 'cannibal'">
                  <div>
                    <p class="text-dim text-sm" style="margin-bottom:.75rem">Pares de páginas con contenido similar que compiten por las mismas keywords en Google. Si hay datos GSC con queries, se valida que ambas páginas ranqueen para las mismas keywords no-marca. Sin datos GSC, se muestra solo la similitud semántica.</p>

                    <!-- Brand filter + reload -->
                    <div style="display:flex;gap:.5rem;align-items:end;margin-bottom:.75rem;flex-wrap:wrap">
                      <div style="flex:1;min-width:200px">
                        <label class="text-dim text-sm" data-tip="Keywords de marca a excluir. Separadas por coma. Ej: ilerna, ilerna fp. Dos páginas que solo comparten queries de marca NO son canibalización real.">Keywords de marca (excluir)</label>
                        <input type="text" x-model="cannibalBrand" placeholder="Ej: ilerna, ilerna fp"
