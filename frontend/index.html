                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Drift -->
                <template x-if="semanticSubTab === 'drift'">
                  <div>
                    <p class="text-dim text-sm mb-75">Páginas que más desplazan el centro semántico del sitio. Son URLs con <strong>alta autoridad</strong> (peso) pero <strong>alejadas del tema principal</strong> (distancia). El Drift Score = peso x distancia. Si una página importante habla de algo muy diferente al resto del sitio, arrastra el centroide. Acción: reenfocar su contenido o reducir su autoridad interna.</p>
                    <template x-if="driftLoading">
                      <div class="loading-overlay"><div class="spinner"></div> Cargando drift...</div>
                    </template>
                    <template x-if="!driftLoading && driftData.length > 0">
                      <div class="ovx-auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th><th>URL</th>
                              <th data-tip="Distancia euclídea al centroide. Mayor = más alejada del tema central.">Distancia</th>
                              <th data-tip="Autoridad normalizada (PageRank + clics de Search Console). Mayor = más influyente.">Peso</th>
                              <th data-tip="Impacto en el desplazamiento del centro semántico. Drift = peso x distancia.">Drift Score</th>
                              <th data-tip="Clics orgánicos de Google (GSC). Contexto: por qué importa esta página.">Clicks</th>
                              <th data-tip="Posición media en Google (GSC). Menor = mejor posicionamiento.">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(d, idx) in driftData" :key="d.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td class="maxw-400px ov-hidden ellipsis nowrap" :title="d.url" x-text="d.url"></td>
                                <td x-text="d.distance"></td>
                                <td x-text="d.weight"></td>
                                <td><strong x-text="d.drift_score"></strong></td>
                                <td x-text="fmt.num(d.clicks)"></td>
                                <td x-text="fmt.dec(d.position)"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Gap Analysis -->
                <template x-if="semanticSubTab === 'gap'">
                  <div>
                    <p class="text-dim text-sm mb-75">Escribe un tema y el sistema busca qué páginas de tu sitio cubren mejor ese contenido. Compara el embedding del tema con el de cada página. Las más similares son candidatas para enlazar, ampliar o reforzar. También muestra la centralidad de cada página (similitud al centroide) para saber si está en el núcleo o en la periferia del sitio.</p>
                    <div class="flex gap-50 items-end mb-50">
                      <div class="flex-1">
                        <label class="text-dim text-sm">Tópico objetivo</label>
                        <input type="text" x-model="gapTopic" placeholder="Ej: guia de cuidado dental infantil"
                               style="width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:var(--fs-sm);margin-top:.2rem">
                      </div>
                      <button class="btn btn-primary btn-sm flex items-center gap-25" @click="runGapAnalysis()" :disabled="gapLoading || !gapTopic.trim()">
                        <template x-if="gapLoading"><span class="spinner ico-12"></span></template>
                        Analizar gap
                      </button>
                    </div>
                    <div class="mb-100">
                      <label class="text-dim text-sm" data-tip="Patrones de URL a excluir de los resultados, separados por coma. Ej: /page/, /tag/, /category/. Se aplica como 'contiene'.">Excluir URLs que contengan</label>
                      <input type="text" x-model="gapExclude" placeholder="Ej: /page/, /tag/, /category/" class="campo-simple">
                    </div>
                    <template x-if="gapResults && gapResults.candidates">
                      <div>
                        <p class="text-sm text-dim mb-50">Páginas más relevantes para "<span x-text="gapResults.topic"></span>":</p>
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>#</th>
                              <th>URL</th>
                              <th data-tip="Similitud coseno entre el embedding de la página y el del tema buscado. Mayor = más relevante.">Similitud al tema</th>
                              <th data-tip="Similitud coseno al centroide del sitio. Alto = página central. Bajo = página periférica.">Centralidad</th>
                              <th data-tip="Clics orgánicos de Google (GSC).">Clicks</th>
                              <th data-tip="Posición media en Google (GSC).">Pos.</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="(c, idx) in gapResults.candidates.filter(c => {
                              if (!gapExclude || !gapExclude.trim()) return true;
                              const patterns = gapExclude.split(',').map(p => p.trim().toLowerCase()).filter(Boolean);
                              return !patterns.some(p => c.url.toLowerCase().includes(p));
                            })" :key="c.url_id">
                              <tr>
                                <td x-text="idx + 1"></td>
                                <td class="maxw-350px ov-hidden ellipsis nowrap" :title="c.url" x-text="c.url"></td>
                                <td><strong x-text="fmt.pctDe(c.similarity_to_topic)"></strong></td>
                                <td x-text="fmt.pctDe(c.similarity_to_centroid)"></td>
                                <td x-text="fmt.num(c.clicks)"></td>
                                <td x-text="fmt.dec(c.position)"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== PESTANA: LIMPIEZA ===== -->
        <template x-if="detailTab === 'cleaning'">
          <div>
            <!-- Para que sirve y que toca despues (revision de UX del 25-oct,
                 3.6; V45): antes solo decia «Proceso opcional a posteriori». -->
            <div class="card limpieza-intro text-sm" data-testid="limpieza-intro">
              <p><strong>Quitar el texto que repite la plantilla</strong> (menús, pies, avisos de cookies) del contenido extraído, para que los duplicados, las páginas con pocas palabras y el semántico miren solo lo propio de cada página.</p>
              <p class="text-dim">No cambia nada del sitio ni lo rastreado: el original se guarda y se puede revertir. Si una regla quitaría más del 60&nbsp;% de una página, esa página se salta.</p>
              <p><strong>Después hay que volver a analizar el censo</strong> para que Problemas lo tenga en cuenta (hoy se pide al equipo técnico) y relanzar el análisis de la pestaña Semántico.</p>
            </div>

            <template x-if="cleaningError">
              <p class="text-sm c-red mb-75" x-text="cleaningError"></p>
            </template>
            <template x-if="cleaningMessage">
              <p class="text-sm c-green mb-75" x-text="cleaningMessage"></p>
            </template>

            <!-- Grupos, los de mas texto repetido primero (decision 198), con
                 el editor de reglas debajo de la fila elegida: antes iba al
                 final de 39 filas y habia que bajar a buscarlo. -->
            <div class="card mb-100">
              <div class="card-header">
                <h2>Grupos por forma de URL</h2>
                <button class="btn btn-sm flex items-center gap-25" @click="loadCleaningGroups()" :disabled="cleaningGroupsLoading">
                  <i data-lucide="refresh-cw" class="ico-12"></i> Actualizar
                </button>
              </div>
              <p class="text-sm text-dim mt-n30 mb-60 mx-0" x-text="textoOrdenLimpieza(cleaningGroups)"></p>
              <template x-if="cleaningGroupsLoading">
                <div class="loading-overlay"><div class="spinner"></div> Cargando grupos...</div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length === 0">
                <div class="empty"><h3>No hay grupos de contenido</h3></div>
              </template>
              <template x-if="!cleaningGroupsLoading && cleaningGroups.length > 0">
                <div class="table-wrap">
                  <table data-testid="limpieza-grupos">
                    <thead>
                      <tr>
                        <th data-tip="Las páginas con la misma forma de ruta: {s} es un tramo de texto y {n} uno que empieza por número">Forma de URL</th>
                        <th>Páginas</th>
                        <th x-show="limpiezaConRepetido(cleaningGroups)" data-tip="Parte del texto de una muestra del grupo que son líneas repetidas en al menos la mitad de sus páginas">Texto repetido</th>
                        <!-- Solo si alguna esta limpiada: «0» en todas no decia nada (V45). -->
                        <th x-show="limpiezaConLimpiadas(cleaningGroups)">Limpiadas</th>
                        <th>Ejemplo</th>
                      </tr>
                    </thead>
                    <template x-for="g in cleaningGroups" :key="g.group_key">
                      <tbody>
                        <tr @click="selectCleaningGroup(g)" class="pointer" :class="cleaningSelectedGroup === g.group_key && 'row-selected'"
                            :aria-expanded="cleaningSelectedGroup === g.group_key ? 'true' : 'false'">
                          <td class="mono fs-sm" x-text="g.group_key"></td>
                          <td x-text="fmt.num(g.pages)"></td>
                          <td x-show="limpiezaConRepetido(cleaningGroups)" x-text="textoRepetidoGrupo(g)"
                              :class="g.repetido_parte == null ? 'text-dim' : ''"></td>
                          <td x-show="limpiezaConLimpiadas(cleaningGroups)" x-text="g.cleaned_pages ? fmt.num(g.cleaned_pages) : '—'"></td>
                          <td style="max-width:300px" :title="g.sample_urls?.[0] || ''">
                            <div class="truncate text-dim text-sm" x-text="g.sample_urls?.[0] || '—'"></div>
                          </td>
                        </tr>
                        <template x-if="cleaningSelectedGroup === g.group_key">
                          <tr class="limpieza-editor" data-testid="limpieza-editor">
                            <td colspan="5"><div class="limpieza-editor-cuerpo">
                              <template x-if="(g.lineas_repetidas || []).length">
                                <div>
                                  <div class="text-sm"><strong>Lo que más se repite</strong>
                                    <span class="text-dim" x-text="'en ' + fmt.num(g.repetido_muestra) + ' páginas de muestra'"></span></div>
                                  <div class="text-sm text-dim mt-20 mb-30 mx-0 ws-normal" x-show="notaLineasLimpieza(g)" x-text="notaLineasLimpieza(g)"></div>
                                  <ul class="limpieza-repetidas">
                                    <template x-for="l in (cleaningVerTodasLineas ? g.lineas_repetidas : g.lineas_repetidas.slice(0, 8))" :key="l.texto">
                                      <li>
                                        <span class="text-dim text-sm nowrap" x-text="fmt.num(l.paginas) + ' de ' + fmt.num(g.repetido_muestra)"></span>
                                        <code x-text="l.texto"></code>
                                        <button class="btn btn-sm" @click.stop="anadirLineaLimpieza(l.texto)" :disabled="cleaningRules.some(r => r.type === 'line_exact' && r.value === l.texto)">Quitar esta línea</button>
                                      </li>
                                    </template>
                                  </ul>
                                  <div class="flex gap-50 flex-wrap mt-n40 mb-75 mx-0">
                                    <button class="btn btn-sm" x-show="g.lineas_repetidas.length > 8" @click.stop="cleaningVerTodasLineas = !cleaningVerTodasLineas"
                                            x-text="cleaningVerTodasLineas ? 'Ver solo las 8 primeras' : 'Ver las ' + fmt.num(g.lineas_repetidas.length)"></button>
                                    <button class="btn btn-sm" x-show="g.lineas_repetidas.length > 1"
                                            @click.stop="g.lineas_repetidas.forEach(l => anadirLineaLimpieza(l.texto))"
                                            x-text="'Quitar las ' + fmt.num(g.lineas_repetidas.length) + ' líneas'"></button>
                                  </div>
                                </div>
                              </template>
                              <div class="text-sm mb-40"><strong>Reglas para este grupo</strong></div>
                              <template x-for="(rule, idx) in cleaningRules" :key="idx">
                                <div class="limpieza-regla">
                                  <select x-model="rule.type" class="w-auto py-35 px-50 fs-sm">
                                    <option value="line_exact">Línea exacta</option>
                                    <option value="line_prefix">Línea que empieza por</option>
                                    <option value="line_contains">Línea que contiene</option>
                                    <option value="cut_from_line">Cortar desde línea que contiene</option>
                                    <option value="remove_substring">Quitar texto literal</option>
                                    <option value="regex">Expresión regular</option>
                                  </select>
                                  <input type="text" x-model="rule.value" placeholder="Valor de la regla">
                                  <button class="btn btn-sm btn-danger" @click="removeCleaningRule(idx)" title="Quitar regla">&#10005;</button>
                                </div>
                              </template>
                              <button class="btn btn-sm mb-100" @click="addCleaningRule()">+ Añadir regla</button>

                              <div class="flex gap-100 items-end flex-wrap mb-100">
                                <div>
                                  <label class="text-dim text-sm">Aplicar a</label>
                                  <select x-model="cleaningTargets" class="bloque mt-20 w-auto py-35 px-50 fs-sm">
                                    <option value="text">Texto</option>
                                    <option value="markdown">Markdown</option>
                                    <option value="both">Ambos</option>
                                  </select>
                                </div>
                                <div style="flex:1;min-width:220px">
                                  <label class="text-dim text-sm">Solo las URLs que casen con (expresión regular, opcional)</label>
                                  <input type="text" x-model="cleaningUrlRegex" placeholder="^https://ejemplo\.com/blog/" class="bloque mt-20 w-full">
                                </div>
                              </div>

                              <div class="flex gap-50 flex-wrap">
                                <button class="btn btn-sm flex items-center gap-25" @click="previewCleaning()" :disabled="cleaningPreviewLoading || cleaningApplying || cleaningReverting">
                                  <template x-if="cleaningPreviewLoading"><span class="spinner ico-12"></span></template>
                                  Vista previa
                                </button>
                                <button class="btn btn-sm btn-primary flex items-center gap-25" @click="applyCleaning()" :disabled="cleaningApplying || cleaningPreviewLoading || cleaningReverting">
                                  <template x-if="cleaningApplying"><span class="spinner ico-12"></span></template>
                                  Aplicar al grupo
                                </button>
                                <button class="btn btn-sm btn-danger flex items-center gap-25" @click="revertCleaning()" x-show="g.cleaned_pages" :disabled="cleaningReverting || cleaningApplying || cleaningPreviewLoading">
                                  <template x-if="cleaningReverting"><span class="spinner ico-12"></span></template>
                                  Revertir grupo
                                </button>
                              </div>

                              <!-- Vista previa, junto a sus reglas -->
                              <template x-if="cleaningPreview">
                                <div class="mt-100">
                                  <p class="text-sm mb-75">
                                    <strong x-text="fmt.num(cleaningPreview.total_chars_removed)"></strong> caracteres quitados en total en la muestra.
                                    <template x-if="cleaningPreview.pages_skipped_safety > 0">
                                      <span class="c-orange" x-text="fmt.num(cleaningPreview.pages_skipped_safety) + ' páginas se saltarían por quitar más del 60 %'"></span>
                                    </template>
                                  </p>
                                  <template x-if="cleaningPreview.samples.length === 0">
                                    <div class="empty"><h3>Ninguna página de la muestra cambia con estas reglas</h3></div>
                                  </template>
                                  <template x-for="s in cleaningPreview.samples" :key="s.url">
                                    <div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
                                      <div class="flex items-center gap-50 mb-40 flex-wrap">
                                        <a :href="s.url" target="_blank" rel="noopener" class="text-sm truncate" style="max-width:60%" :title="s.url" x-text="s.url"></a>
                                        <span class="text-sm" style="padding:.1rem .5rem;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600"
                                              x-text="'−' + fmt.num(s.chars_removed) + ' caracteres (' + fmt.pct(s.removed_pct ?? 0) + ')'"></span>
                                      </div>
                                      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem">
                                        <div>
                                          <div class="text-dim text-sm mb-25">Antes</div>
                                          <pre class="caja-codigo" x-text="s.before_excerpt"></pre>
                                        </div>
                                        <div>
                                          <div class="text-dim text-sm mb-25">Después</div>
                                          <pre class="caja-codigo" x-text="s.after_excerpt"></pre>
                                        </div>
                                      </div>
                                    </div>
                                  </template>
                                </div>
                              </template>
                            </div></td>
                          </tr>
                        </template>
                      </tbody>
                    </template>
                  </table>
                </div>
              </template>
            </div>

            <!-- Historial -->
            <div class="card">
              <div class="card-header"><h2>Historial de limpiezas</h2></div>
              <template x-if="cleaningRulesets.length === 0">
                <div class="text-dim text-sm">Sin limpiezas aplicadas todavía</div>
              </template>
              <template x-if="cleaningRulesets.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Fecha</th>
                        <th>Grupo</th>
                        <th>Reglas</th>
                        <th>Páginas actualizadas</th>
                        <th>Saltadas</th>
                        <th>Caracteres quitados</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rs in cleaningRulesets" :key="rs.id">
                        <tr>
                          <td x-text="fmt.date(rs.created_at)"></td>
                          <td class="mono fs-sm" x-text="rs.group_key || rs.url_regex || '—'"></td>
                          <td x-text="rs.rules?.length || 0"></td>
                          <td x-text="fmt.num(rs.pages_updated)"></td>
                          <td x-text="fmt.num(rs.pages_skipped)"></td>
                          <td x-text="fmt.num(rs.chars_removed)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== PESTANA: INFORME SEO ===== -->
        <template x-if="detailTab === 'insights'">
          <div>
            <!-- Loading -->
            <template x-if="insightsLoading">
              <div class="loading-overlay"><div class="spinner"></div> Calculando la puntuación...</div>
            </template>

            <template x-if="!insightsLoading && insights">
              <div>
                <!-- Puntuacion global -->
                <div class="insights-header">
                  <div class="score-ring-wrap">
                    <svg class="score-ring" viewBox="0 0 120 120">
                      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8"/>
                      <circle cx="60" cy="60" r="52" fill="none" :stroke="scoreColor(insights.overall_score)" stroke-width="8"
                        stroke-linecap="round"
                        :stroke-dasharray="ringDash(insights.overall_score, 52)"
                        stroke-dashoffset="0"
                        transform="rotate(-90 60 60)"/>
                      <text x="60" y="55" text-anchor="middle" fill="var(--text)" font-size="28" font-weight="700" x-text="insights.overall_score"></text>
                      <text x="60" y="73" text-anchor="middle" fill="var(--text-dim)" font-size="14" x-text="scoreLabel(insights.overall_score)"></text>
                    </svg>
                  </div>
                  <div class="insights-header-text">
                    <h2>Puntuación SEO global</h2>
                    <!-- El tope va ANTES que la explicacion de la media: si la
                         nota esta recortada, es lo primero que hay que saber. -->
                    <template x-if="insights.tope">
                      <div class="nota-tope">
                        <i data-lucide="alert-octagon" class="ico-15"></i>
                        <div>
                          <strong x-text="'Limitada a ' + insights.tope.tope + ' por errores'"></strong>
                          (sin el tope saldría <span x-text="insights.overall_score_sin_tope"></span>).
                          <!-- La cuenta es de la API (decision 92): paginas con error sobre
                               TODAS las URLs internas. Se dice asi, sin llamar
                               «URLs» a las paginas (revision del 27-oct). -->
                          <span x-text="fmt.n(insights.tope.paginas_con_error, 'página tiene', 'páginas tienen') + ' algún error: el ' + fmt.pct(insights.tope.pct) + ' de las ' + fmt.num(insights.tope.de) + ' URLs internas rastreadas (contando imágenes, PDF y redirecciones).'"></span>
                          <a :href="'#/rastreos/' + job.id + '/problemas?gravedad=error'">Ver los errores</a>
                        </div>
                      </div>
                    </template>
                    <p class="text-dim text-sm">Media ponderada de 6 categorías: rastreabilidad 25 %, contenido 25 %, enlaces 20 %, seguridad 15 %, datos estructurados 10 %, internacionalización 5 %. Con errores abiertos no pasa de 79, y si afectan al 10 % de las URLs o más, de 49.</p>
                  </div>
                </div>

                <!-- Categorias -->
                <div class="insights-categories">
                  <template x-for="cat in insights.categories" :key="cat.key">
                    <div class="insight-card" :style="'border-left-color:' + scoreColor(cat.score)">
                      <!-- Cabecera de categoria -->
                      <div class="insight-card-header" role="button" tabindex="0" @keydown.enter.prevent="$el.click()" @keydown.space.prevent="$el.click()" @click="toggleCategory(cat.key)">
                        <div class="flex items-center gap-1">
                          <!-- Sin emojis y con tildes (revision de UX del 25-oct, 3.9): el
                               nombre sale de la clave, la API anterior manda
                               «Internacionalizacion» y «Datos Estructurados». -->
                          <span class="insight-name" x-text="NOMBRE_CATEGORIA[cat.key] || cat.name"></span>
                        </div>
                        <div class="flex items-center gap-1">
                          <div class="insight-score-bar">
                            <div class="insight-score-fill" :style="'width:' + cat.score + '%;background:' + scoreColor(cat.score)"></div>
                          </div>
                          <span class="insight-score-num" :style="'color:' + scoreColor(cat.score)" x-text="cat.score"></span>
                          <span class="insight-toggle" x-text="isCategoryExpanded(cat.key) ? '&#9650;' : '&#9660;'"></span>
                        </div>
                      </div>

                      <!-- Cuerpo expandible -->
                      <div class="insight-card-body" x-show="isCategoryExpanded(cat.key)" x-transition.duration.200ms>
                        <!-- Metricas -->
                        <div class="metric-grid">
                          <!-- Crawlability metrics -->
                          <template x-if="cat.key === 'crawlability'">
                            <template x-for="m in [
                              {l:'URLs internas', v:fmt.num(cat.metrics.total_internal)},
                              {l:'% respuesta 2xx', v:fmt.pct(cat.metrics.pct_2xx)},
                              {l:'% indexables', v:fmt.pct(cat.metrics.pct_indexable)},
                              {l:'% redirecciones', v:fmt.pct(cat.metrics.pct_redirects)},
                              {l:'Errores 4xx', v:fmt.num(cat.metrics.errors_4xx)},
                              {l:'Errores 5xx', v:fmt.num(cat.metrics.errors_5xx)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Content metrics -->
                          <template x-if="cat.key === 'content'">
                            <template x-for="m in [
                              {l:'Páginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'% títulos OK', v:fmt.pct(cat.metrics.pct_title_ok)},
                              {l:'% descripciones OK', v:fmt.pct(cat.metrics.pct_desc_ok)},
                              {l:'% H1 OK', v:fmt.pct(cat.metrics.pct_h1_ok)},
                              {l:'Media palabras', v:fmt.num(cat.metrics.avg_word_count)},
                              {l:'Contenido delgado', v:fmt.num(cat.metrics.thin_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Links metrics -->
                          <template x-if="cat.key === 'links'">
                            <template x-for="m in [
                              {l:'Páginas internas', v:fmt.num(cat.metrics.total_internal_pages)},
                              {l:'Páginas huérfanas', v:fmt.num(cat.metrics.orphan_count)},
                              {l:'Media inlinks', v:cat.metrics.avg_inlinks},
                              {l:'Enlaces nofollow', v:fmt.num(cat.metrics.nofollow_links)},
                              {l:'Páginas con errores', v:fmt.num(cat.metrics.broken_link_issues)},
                              {l:'Exceso de enlaces', v:fmt.num(cat.metrics.high_outlinks)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Security metrics -->
                          <template x-if="cat.key === 'security'">
                            <template x-for="m in [
                              {l:'Páginas analizadas', v:fmt.num(cat.metrics.total_checked)},
                              {l:'% HTTPS', v:fmt.pct(cat.metrics.pct_https)},
                              {l:'% HSTS', v:fmt.pct(cat.metrics.pct_hsts)},
                              {l:'% CSP', v:fmt.pct(cat.metrics.pct_csp)},
                              {l:'% contenido mixto', v:fmt.pct(cat.metrics.pct_mixed)},
                              {l:'Con contenido mixto', v:fmt.num(cat.metrics.mixed_count)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- Structured Data metrics -->
                          <template x-if="cat.key === 'structured_data'">
                            <template x-for="m in [
                              {l:'Páginas HTML', v:fmt.num(cat.metrics.total_html)},
                              {l:'Con datos estructurados', v:fmt.num(cat.metrics.pages_with_sd)},
                              {l:'% con SD', v:fmt.pct(cat.metrics.pct_with_sd)},
                              {l:'Bloques totales', v:fmt.num(cat.metrics.total_sd_blocks)},
                              {l:'Errores de validación', v:fmt.num(cat.metrics.sd_errors)},
                              {l:'% errores', v:fmt.pct(cat.metrics.pct_errors)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                          <!-- i18n metrics -->
                          <template x-if="cat.key === 'i18n'">
                            <template x-for="m in [
                              {l:'Etiquetas hreflang', v:fmt.num(cat.metrics.total_hreflang)},
                              {l:'Idiomas', v:cat.metrics.languages?.join(', ') || '—'},
                              {l:'% retorno OK', v:fmt.pct(cat.metrics.pct_return_ok)},
                              {l:'Hreflang a URL descartada', v:fmt.num(cat.metrics.destino_malo ?? 0)},
                              {l:'% idioma válido', v:fmt.pct(cat.metrics.pct_lang_valid)},
                            ]">
                              <div class="metric-item">
                                <div class="metric-value" x-text="m.v"></div>
                                <div class="metric-label" x-text="m.l"></div>
                              </div>
                            </template>
                          </template>
                        </div>

                        <!-- Recomendaciones -->
                        <template x-if="cat.recommendations.length > 0">
                          <div class="recommendations-section">
                            <h4 class="text-dim text-sm mb-1" style="text-transform:uppercase;letter-spacing:.05em">Recomendaciones</h4>
                            <template x-for="rec in cat.recommendations" :key="rec.title">
                              <div class="recommendation">
                                <div class="recommendation-header">
                                  <span class="priority-badge" :class="priorityClass(rec.priority)" x-text="priorityLabel(rec.priority)"></span>
                                  <span class="recommendation-title" x-text="rec.title"></span>
                                  <template x-if="recHasUrls(rec)">
                                    <button class="btn-icon" @click.stop="toggleRecUrls(rec)"
                                      style="margin-left:.25rem;font-size:var(--fs-sm);padding:.15rem .4rem;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;gap:.25rem;color:var(--accent);background:rgba(91,174,35,.06);cursor:pointer">
                                      <i data-lucide="list" class="ico-11"></i>
                                      <span x-text="recUrlsOpen[rec.title] ? 'Ocultar URLs' : 'Ver URLs'"></span>
                                    </button>
                                  </template>
                                  <span class="recommendation-count" x-text="rec.affected_count + ' URLs'" x-show="rec.affected_count > 0"></span>
                                </div>
                                <p class="recommendation-desc" x-text="rec.description"></p>

                                <!-- URL list expandable -->
                                <template x-if="recUrlsOpen[rec.title]">
                                  <div style="margin-top:.5rem;padding:.5rem .65rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;animation:fadeInUp .2s ease">
                                    <template x-if="recUrls[rec.title]?.loading">
                                      <div class="loading-overlay" style="padding:.35rem;justify-content:flex-start"><div class="spinner ico-14"></div> <span class="text-dim text-sm">Cargando URLs...</span></div>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length === 0">
                                      <p class="text-dim text-sm">No se encontraron URLs afectadas.</p>
                                    </template>
                                    <template x-if="recUrls[rec.title]?.loaded && recUrls[rec.title].urls.length > 0">
                                      <div>
                                        <div style="display:flex;flex-direction:column;gap:.15rem;max-height:240px;overflow-y:auto">
                                          <template x-for="u in recUrls[rec.title].urls" :key="u.id">
                                            <div @click="openUrlDetail(u.id)" style="display:flex;align-items:center;gap:.5rem;padding:.25rem .4rem;border-radius:4px;cursor:pointer;font-size:var(--fs-sm);transition:background .15s" class="rec-url-row">
                                              <span class="exp-status" :class="expStatusClass(u.status_code)" x-text="u.status_code" style="font-size:var(--fs-sm);padding:.05rem .3rem"></span>
                                              <span class="ov-hidden ellipsis nowrap c-text" :title="u.url" x-text="u.url"></span>
                                            </div>
                                          </template>
                                        </div>
                                        <div style="margin-top:.4rem;display:flex;align-items:center;gap:.5rem;padding-top:.35rem;border-top:1px solid var(--border)">
                                          <span class="text-dim fs-sm" x-text="recUrls[rec.title].urls.length + ' de ' + rec.affected_count + ' URLs'"></span>
                                          <button class="btn btn-sm" @click.stop="openRecInExplorer(rec)" style="margin-left:auto;font-size:var(--fs-sm);padding:.2rem .5rem;display:flex;align-items:center;gap:.25rem">
                                            <i data-lucide="external-link" style="width:10px;height:10px"></i> Ver todas
                                          </button>
                                        </div>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="cat.recommendations.length === 0">
                          <p class="text-dim text-sm py-50 px-0">Sin problemas detectados en esta categoría.</p>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

      </div>
    </template>


    <!-- ============================================================ -->
    <!--            VISTA: DETALLE COMPLETO DE UNA URL                -->
    <!-- ============================================================ -->
    <!-- ============================================================ -->
    <!--      VISTA: INFORME PARA EL CLIENTE (decision 138)            -->
    <!-- ============================================================ -->
    <template x-if="view === 'informe'">
      <div class="informe" data-testid="informe">
        <div class="informe-acciones no-print">
          <a class="btn btn-sm" x-show="!compartido" :href="'#/rastreos/' + (job && job.id)">
            <i data-lucide="arrow-left" class="ico-13"></i> Volver al rastreo</a>
          <!-- Modo compartido (decision 143): elegir entre los censos del cliente. -->
          <template x-if="compartido && compartido.censos.length">
            <select @change="verInformeCompartido($event.target.value)" aria-label="Informe" class="w-auto maxw-22rem" data-testid="informe-censos">
              <template x-for="c in compartido.censos" :key="c.id">
                <option :value="c.id" :selected="c.id === compartido.elegido" x-text="fmt.dia(c.fecha) + ' · ' + c.nombre"></option>
              </template>
            </select>
          </template>
          <button class="btn btn-sm btn-primary" @click="window.print()" :disabled="!informe">
            <i data-lucide="printer" class="ico-13"></i> Imprimir o guardar como PDF</button>
        </div>
        <template x-if="informeCargando">
          <div class="loading-overlay"><div class="spinner"></div> Preparando el informe…</div>
        </template>
        <template x-if="compartido && compartido.error && !informe">
          <div class="card" style="margin-top:2rem" x-text="compartido.error"></div>
        </template>
        <template x-if="!informeCargando && informe">
          <article>
            <header class="informe-cabecera">
              <div class="text-dim text-sm" x-text="informe.cliente ? informe.cliente.nombre : 'Auditoría SEO técnica'"></div>
              <h1 x-text="informe.job.sitio"></h1>
              <div class="text-dim text-sm">
                Rastreo del <span x-text="fmt.date(informe.job.fecha)"></span>
                · <span x-text="fmt.num(informe.cifras.urls)"></span> URLs
                <span x-show="informe.job.modo_lista" x-text="'· lista de ' + fmt.num(informe.job.semillas) + ' URLs'"></span>
              </div>
            </header>

            <template x-if="informe.fiabilidad.length">
              <section class="informe-aviso" data-testid="informe-fiabilidad">
                <strong>Antes de leer las cifras</strong>
                <ul><template x-for="(t, i) in informe.fiabilidad" :key="i"><li x-text="t"></li></template></ul>
              </section>
            </template>

            <section class="informe-nota">
              <div class="informe-nota-global" :class="'nota-' + (informe.nota.global >= 80 ? 'buena' : informe.nota.global >= 50 ? 'media' : 'mala')">
                <div class="informe-nota-num" x-text="informe.nota.global"></div>
                <div class="text-sm">de 100</div>
              </div>
              <div>
                <h2>Estado del sitio</h2>
                <p x-show="informe.nota.tope" class="text-sm"
                   x-text="informe.nota.tope ? 'La media de las categorías sería ' + informe.nota.sin_tope + ', pero con ' + fmt.num(informe.nota.tope.paginas_con_error) + ' URLs con errores la nota no puede pasar de ' + informe.nota.tope.tope + '.' : ''"></p>
                <div class="informe-categorias">
                  <template x-for="c in informe.nota.categorias" :key="c.key">
                    <div><span x-text="c.nombre"></span> <strong x-text="c.nota"></strong></div>
                  </template>
                </div>
              </div>
            </section>

            <section>
              <h2>Cifras</h2>
              <div class="informe-cifras">
                <div><strong x-text="fmt.num(informe.cifras.paginas_html)"></strong><span>páginas HTML</span></div>
                <div><strong x-text="fmt.num(informe.cifras.indexables)"></strong><span>indexables</span></div>
                <div><strong x-text="fmt.num(informe.cifras.no_indexables)"></strong><span>no indexables</span></div>
                <div><strong x-text="fmt.num((informe.cifras.por_estado['4xx'] || 0) + (informe.cifras.por_estado['5xx'] || 0))"></strong><span>URLs rotas (4xx y 5xx)</span></div>
                <div><strong x-text="fmt.num(informe.cifras.por_estado['3xx'] || 0)"></strong><span>redirecciones</span></div>
              </div>
            </section>

            <template x-if="informe.comparacion && informe.comparacion.comparado_con">
              <section data-testid="informe-cambios">
                <h2>Qué ha cambiado desde el rastreo anterior</h2>
                <template x-if="informe.comparacion.alertas.length">
                  <ul class="informe-alertas">
                    <template x-for="(a, i) in informe.comparacion.alertas" :key="i">
                      <li :class="'sev-' + a.severidad">
                        <strong x-text="fmt.num(a.paginas) + ' de ' + fmt.num(a.de) + ' páginas (' + fmt.num(a.pct) + ' %)'"></strong>
                        — <span x-text="a.que_decide_google"></span>
                      </li>
                    </template>
                  </ul>
                </template>
                <template x-for="(t, i) in informe.comparacion.reglas_cliente || []" :key="'r' + i">
                  <p class="text-sm" x-text="t"></p>
                </template>
                <p x-show="!informe.comparacion.alertas.length && !(informe.comparacion.reglas_cliente || []).length">
                  Ningún cambio grave frente al rastreo anterior.</p>
                <!-- Sin «No incluida en el sitemap» si un censo leyo sus
                     sitemaps a medias, y dicho (decision 205). -->
                <p x-show="incidenciasInforme()" class="text-sm" data-testid="informe-incidencias"
                   x-text="(i => i ? fmt.num(i.nuevas) + ' incidencias nuevas' + (i.resueltas != null ? ', ' + fmt.num(i.resueltas) + ' resueltas' : '') + ' y ' + fmt.num(i.siguen) + ' que siguen.' : '')(incidenciasInforme())"></p>
                <p x-show="(incidenciasInforme() || {}).sin_sitemap" class="text-sm text-dim" x-text="TEXTO_SIN_SITEMAP"></p>
                <p x-show="informe.comparacion.incidencias_motivo" class="text-sm text-dim"
                   x-text="compartido ? 'En este informe las incidencias no se comparan una a una con el anterior.' : 'Las incidencias no se comparan: ' + (informe.comparacion.incidencias_motivo || '')"></p>
              </section>
            </template>

            <!-- Search Console (decision 142) -->
            <template x-if="informe.trafico">
              <section data-testid="informe-trafico">
                <h2>Tráfico de Google</h2>
                <p>Entre el <span x-text="fmt.dia(informe.trafico.desde)"></span> y el <span x-text="fmt.dia(informe.trafico.hasta)"></span>,
                  <strong x-text="fmt.num(informe.trafico.clics)"></strong> clics y
                  <strong x-text="fmt.num(informe.trafico.impresiones)"></strong> impresiones en Google.</p>
                <ul class="informe-alertas">
                  <li x-show="informe.trafico.trafico_en_pagina_perdida.paginas" class="sev-error">
                    <strong x-text="(n => fmt.num(n) + (n === 1 ? ' página con tráfico que hoy da error, tiene noindex o está bloqueada' : ' páginas con tráfico que hoy dan error, tienen noindex o están bloqueadas'))(informe.trafico.trafico_en_pagina_perdida.paginas)"></strong>
                    <span x-text="'(' + fmt.num(informe.trafico.trafico_en_pagina_perdida.clics) + ' clics en riesgo)'"></span></li>
                  <li x-show="informe.trafico.huerfana_con_trafico.paginas">
                    <span x-text="fmt.num(informe.trafico.huerfana_con_trafico.paginas) + (informe.trafico.huerfana_con_trafico.paginas === 1 ? ' página' : ' páginas') + ' con tráfico que ninguna otra página del sitio enlaza (' + fmt.num(informe.trafico.huerfana_con_trafico.clics) + ' clics)'"></span></li>
                  <li x-show="informe.trafico.trafico_en_variante_con_parametros.paginas">
                    <span x-text="fmt.num(informe.trafico.trafico_en_variante_con_parametros.paginas) + (informe.trafico.trafico_en_variante_con_parametros.paginas === 1 ? ' página cuyo tráfico se reparte' : ' páginas cuyo tráfico se reparte') + ' con variantes con parámetros (' + fmt.num(informe.trafico.trafico_en_variante_con_parametros.clics) + ' clics en las variantes)'"></span></li>
                  <template x-if="informe.trafico.inspeccion && informe.trafico.inspeccion.inspeccionadas">
                    <li x-text="'Google confirma indexadas ' + fmt.num(informe.trafico.inspeccion.indexadas) + ' de ' + fmt.num(informe.trafico.inspeccion.inspeccionadas) + ' páginas comprobadas una a una' + (informe.trafico.inspeccion.no_indexadas ? '; ' + fmt.num(informe.trafico.inspeccion.no_indexadas) + ' que deberían estarlo no lo están' : '') + (informe.trafico.inspeccion.canonical_distinto ? '; en ' + fmt.num(informe.trafico.inspeccion.canonical_distinto) + ' ha elegido otro canonical' : '') + (informe.trafico.inspeccion.canonical_antiguo ? '; en ' + fmt.num(informe.trafico.inspeccion.canonical_antiguo) + ' aún tiene un canonical que la página ya no declara' : '') + '.'"></li>
                  </template>
                  <li x-show="informe.trafico.urls_fuera_del_censo">
                    <span x-text="fmt.num(informe.trafico.urls_fuera_del_censo) + ' URLs con clics que el rastreo no encontró (' + fmt.num(informe.trafico.clics_fuera_del_censo) + ' clics)'"></span></li>
                </ul>
              </section>
            </template>

            <!-- Buscadores de IA (decisiones 129, 137 y 140) -->
            <template x-if="informe.ia">
              <section data-testid="informe-ia">
                <h2>Buscadores de IA</h2>
                <template x-if="informe.ia.bots.length">
                  <div class="informe-bots">
                    <template x-for="b in informe.ia.bots" :key="b.token">
                      <div>
                        <span x-text="b.proveedor + ' · ' + b.token"></span>
                        <span class="text-dim text-sm" x-text="b.tipo === 'busqueda_ia' ? '(búsqueda)' : '(entrenamiento)'"></span>
                        <strong :class="b.alcance === 'todo' ? (b.tipo === 'busqueda_ia' ? 'text-red' : '') : b.alcance === 'parte' ? 'text-orange' : ''"
                                x-text="({todo: 'bloqueado', parte: 'bloqueado en parte', nada: 'permitido'})[b.alcance] || 'sin evaluar'"></strong>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="text-sm text-dim" x-show="informe.ia.bots.length">Los de búsqueda deciden si el sitio puede salir en las respuestas de ChatGPT, Claude o Perplexity; bloquear los de entrenamiento no quita de ninguna búsqueda.</p>
                <ul class="informe-alertas">
                  <li x-show="informe.ia.nosnippet" class="sev-warning"
                      x-text="(n => fmt.num(n) + (n === 1 ? ' página indexable lleva' : ' páginas indexables llevan'))(informe.ia.nosnippet) + ' «nosnippet»: Google no las usa en AI Overviews ni enseña su texto en el resultado.'"></li>
                  <li x-show="informe.ia.data_nosnippet" class="sev-warning"
                      x-text="(n => fmt.num(n) + (n === 1 ? ' página indexable esconde' : ' páginas indexables esconden'))(informe.ia.data_nosnippet) + ' su H1 o la mayor parte de su contenido con «data-nosnippet»: ese texto no sale en el fragmento ni en AI Overviews.'"></li>
                  <li x-show="informe.ia.max_snippet"
                      x-text="fmt.num(informe.ia.max_snippet) + (informe.ia.max_snippet === 1 ? ' página limita' : ' páginas limitan') + ' su fragmento con «max-snippet»: la IA de Google solo puede citar ese trozo.'"></li>
                  <li x-show="informe.ia.solo_con_js.plantillas" class="sev-warning"
                      x-text="'En ' + informe.ia.solo_con_js.plantillas + (informe.ia.solo_con_js.plantillas === 1 ? ' plantilla' : ' plantillas') + ' (' + fmt.num(informe.ia.solo_con_js.paginas) + ' de ' + fmt.num(informe.ia.solo_con_js.muestreadas) + ' páginas comprobadas), parte del texto o de los enlaces solo aparece con JavaScript: los rastreadores de IA no lo ven.'"></li>
                </ul>
              </section>
            </template>

            <section data-testid="informe-prioridades">
              <h2>Qué arreglar primero</h2>
              <p class="text-sm text-dim">Ordenado por la gravedad y por lo importantes que son las páginas afectadas
                (su autoridad interna, a cuántos clics de la portada están, si el sitemap las declara y, con Search Console, los clics que reciben de Google).
                <span x-text="'Son los ' + informe.prioridades.length + ' primeros de ' + informe.tipos_de_incidencia + ' tipos de incidencia.'"></span></p>
              <ol class="informe-prioridades">
                <template x-for="r in informe.prioridades" :key="r.issue_type + r.severity">
                  <li>
                    <div class="informe-prio-cabecera">
                      <span class="sev-chip" :class="'sev-' + r.severity" x-text="fmt.severity(r.severity)"></span>
                      <strong x-text="fmt.issue(r.issue_type)"></strong>
                      <span class="text-dim text-sm" x-text="textoAlcanceInforme(r)"></span>
                    </div>
                    <template x-if="ISSUE_INFO[r.issue_type]">
                      <dl class="issue-explica">
                        <dt>Qué es</dt><dd x-text="ISSUE_INFO[r.issue_type].que"></dd>
                        <dt>Qué decide Google</dt><dd x-text="ISSUE_INFO[r.issue_type].google"></dd>
                        <dt>Cómo se arregla</dt><dd x-text="ISSUE_INFO[r.issue_type].arreglo"></dd>
                      </dl>
                    </template>
                    <div class="text-sm" x-show="r.ejemplos.length">
                      <span class="text-dim">Ejemplos:</span>
                      <template x-for="(e, n) in r.ejemplos" :key="n"><div class="informe-url" x-text="e.url"></div></template>
                    </div>
                  </li>
                </template>
              </ol>
            </section>

            <footer class="informe-pie text-sm text-dim">
              Generado el <span x-text="fmt.date(informe.generado)"></span>
              <span x-show="informe.job.crawler_version" x-text="'· rastreo ' + informe.job.crawler_version"></span>
              <span x-show="informe.job.analisis_version" x-text="'· análisis ' + informe.job.analisis_version"></span>
              <span x-show="informe.job.render_js">· con JavaScript renderizado</span>
            </footer>
          </article>
        </template>
      </div>
    </template>

    <template x-if="view === 'url-detail'">
      <div>
        <!-- Cargando -->
        <template x-if="urlDetailLoading">
          <div class="loading-overlay"><div class="spinner"></div> Cargando datos de la URL...</div>
        </template>

        <template x-if="!urlDetailLoading && urlDetail">
          <div>
            <!-- Cabecera de URL -->
            <div class="url-header-card card mb-2">
              <div class="flex items-center justify-between gap-75 flex-wrap">
                <div class="flex-1 minw-0">
                  <div class="flex items-center gap-1 mb-1">
                    <span class="badge" :class="{
                      'badge-completed': urlDetail.status_group === '2xx',
                      'badge-running': urlDetail.status_group === '3xx',
                      'badge-cancelled': urlDetail.status_group === '4xx',
                      'badge-failed': urlDetail.status_group === '5xx'
                    }" x-text="(urlDetail.status_code || '—') + ' ' + (urlDetail.status_text || '')"></span>
                    <span class="badge" :class="urlDetail.indexable ? 'badge-completed' : 'badge-cancelled'"
                      x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : 'No indexable')"></span>
                    <template x-if="urlDetail.is_internal !== null">
                      <span class="badge badge-pending" x-text="urlDetail.is_internal ? 'Interna' : 'Externa'"></span>
                    </template>
                  </div>
                  <!-- La URL se abre y se copia (revision de UX del 25-oct, 1.10). -->
                  <div class="url-full-display flex gap-40 items-baseline">
                    <a :href="urlDetail.url" target="_blank" rel="noopener" x-text="urlDetail.url" :title="'Abrir ' + urlDetail.url" class="break-all"></a>
                    <button class="btn btn-sm shrink-0" type="button" title="Copiar la URL"
                            @click="navigator.clipboard ? navigator.clipboard.writeText(urlDetail.url).then(() => showToast('URL copiada')).catch(() => showToast('No se pudo copiar', 'error')) : showToast('El navegador no deja copiar aquí', 'error')">Copiar</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Veredicto (UX-17): las tres preguntas que se hacen al abrir una
                 URL —¿se indexa?, ¿que le pasa?, ¿le llegan enlaces?— arriba,
                 antes de los 30 campos. -->
            <div class="url-veredicto mb-2">
              <div class="card">
                <div class="veredicto-titulo">Indexabilidad</div>
                <div class="veredicto-valor" :class="urlDetail.indexable ? 'green' : (urlDetail.indexable === false ? 'orange' : '')"
                     x-text="urlDetail.indexability_status || (urlDetail.indexable ? 'Indexable' : urlDetail.indexable === false ? 'No indexable' : 'Sin analizar')"></div>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.canonical_href && !urlDetail.indexable">
                  <div class="text-sm text-dim truncate" :title="urlDetail.html_meta.canonical_href"
                       x-text="'Canonical: ' + urlDetail.html_meta.canonical_href"></div>
                </template>
                <template x-if="urlDetail.html_meta && urlDetail.html_meta.meta_robots">
                  <div class="text-sm text-dim" x-text="'Meta robots: ' + urlDetail.html_meta.meta_robots"></div>
                </template>
                <template x-if="urlDetail.redirect_url">
                  <div class="text-sm text-dim truncate" :title="urlDetail.redirect_url" x-text="'Redirige a ' + urlDetail.redirect_url"></div>
                </template>
                <!-- La linea de robots.txt que la bloquea (decision 129): es lo
                     que hay que tocar, y sin ella habia que abrir el fichero y
                     repetir a mano la regla mas larga. -->
                <template x-if="urlDetail.robots_regla">
                  <div class="text-sm robots-regla">
                    <template x-for="lado in [['googlebot','Googlebot'],['rastreador','Nuestro rastreo']]" :key="lado[0]">
                      <template x-if="urlDetail.robots_regla[lado[0]]">
                        <div>
                          <span class="text-dim" x-text="lado[1] + ': línea ' + urlDetail.robots_regla[lado[0]].linea + ' de '"></span>
                          <a :href="urlDetail.robots_regla.robots_url" target="_blank" rel="noopener">robots.txt</a>
                          <code x-text="urlDetail.robots_regla[lado[0]].texto"></code>
                          <span class="text-dim" x-text="'(grupo «' + (urlDetail.robots_regla[lado[0]].grupo || '*') + '», línea ' + (urlDetail.robots_regla[lado[0]].linea_grupo ?? '—') + ')'"></span>
                        </div>
                      </template>
                    </template>
                  </div>
                </template>
                <!-- Sin leer todos los sitemaps no se afirma que falte (V13). -->
                <div class="text-sm text-dim" data-testid="ficha-sitemap" :class="!urlDetail.in_sitemap && dudaSitemaps(job) && 'orange'"
                     :title="!urlDetail.in_sitemap && dudaSitemaps(job) || ''"
                     x-text="urlDetail.in_sitemap ? 'En el sitemap' : (dudaSitemaps(job) ? 'No está en los sitemaps leídos; no se leyeron todos, así que no se puede afirmar que falte' : 'No está en el sitemap')"></div>
                <!-- De qué fichero(s) de sitemap viene y con qué lastmod (decisión 126) -->
                <template x-for="(sm, n) in (urlDetail.sitemaps || [])" :key="'sm' + n">
                  <div class="text-sm text-dim truncate" :title="sm.fichero + ((sm.hreflang || []).length ? '\n' + sm.hreflang.map(h => h[0] + ' → ' + h[1]).join('\n') : '')"
                       x-text="'Sitemap: ' + sm.fichero + (sm.lastmod ? ' · lastmod ' + sm.lastmod : ' · sin lastmod') + ((sm.hreflang || []).length ? ' · hreflang: ' + sm.hreflang.map(h => h[0]).join(', ') : '')"></div>
                </template>
                <!-- La entidad de WordPress que es esta URL (decisión 168) -->
                <template x-for="(w, n) in (urlDetail.wordpress || [])" :key="'wp' + n">
                  <div class="text-sm text-dim" data-testid="url-wordpress" x-text="'WordPress: ' + textoEntidadWp(w)"></div>
                </template>
              </div>
              <!-- Un tipo por fila, con cuantas veces y si es de plantilla
                   (revision de UX del 25-oct, 2.7; V27): antes el mismo tipo
                   salia repetido hasta llenar las cinco filas. -->
              <div class="card">
                <div class="veredicto-titulo">
                  Problemas
                  <a href="#" class="text-sm ml-auto" x-show="urlProblemas.length"
                     @click.prevent="urlDetailTab = 'issues'">ver qué le pasa</a>
                </div>
                <template x-if="!urlProblemas.length">
                  <div class="veredicto-valor green">Ninguno</div>
                </template>
                <ul class="veredicto-lista">
                  <template x-for="g in urlProblemas.slice(0, 5)" :key="g.tipo">
                    <li>
                      <span class="sev-chip" :class="'sev-' + g.severity" x-text="fmt.severity(g.severity)"></span>
                      <span class="url-problema-nombre">
                        <span x-text="fmt.issue(g.tipo)"></span><span class="text-dim" x-show="g.n > 1" x-text="' × ' + g.n"></span>
                        <span class="chip-alcance" x-show="g.alcance === 'plantilla' || g.alcance === 'servidor'"
                              x-text="g.alcance === 'servidor' ? 'del servidor' : 'de plantilla'"></span>
                        <!-- Sin leer todos los sitemaps no se afirma (V13). -->
                        <span class="orange text-sm" x-show="g.tipo === 'not_in_sitemap' && dudaSitemaps(job)" :title="dudaSitemaps(job) || ''">no concluyente</span>
                      </span>
                    </li>
                  </template>
                </ul>
                <div class="text-sm text-dim" x-show="urlProblemas.length > 5"
                     x-text="'y ' + (urlProblemas.length - 5) + (urlProblemas.length - 5 === 1 ? ' tipo más' : ' tipos más')"></div>
              </div>
              <!-- Google (90 dias) (revision de UX del 25-oct, 2.7; V28): lo que
                   Search Console dice de esta URL. Sin datos, una frase que dice
                   por que; nunca ceros que parezcan datos. -->
              <template x-for="g in [googleDeUrl()].filter(Boolean)" :key="'google'">
                <div class="card url-google">
                  <div class="veredicto-titulo">
                    Google (90 días)
                    <span class="text-sm" style="margin-left:auto;text-transform:none;letter-spacing:0" x-show="g.ventana" x-text="g.ventana"></span>
                  </div>
                  <template x-if="g.cifras">
                    <div class="url-google-cifras">
                      <div><strong x-text="fmt.num(g.cifras.clics)"></strong><span class="text-sm text-dim">clics</span></div>
                      <div><strong x-text="fmt.num(g.cifras.impresiones)"></strong><span class="text-sm text-dim">impresiones</span></div>
                      <div x-show="g.cifras.posicion != null"><strong x-text="fmt.num(g.cifras.posicion)"></strong><span class="text-sm text-dim">posición media</span></div>
                    </div>
                  </template>
                  <div class="text-sm" x-show="g.frase" x-text="g.frase"></div>
                  <div class="text-sm text-dim" x-show="g.parcial" x-text="g.parcial"></div>
                  <template x-if="g.canonical">
                    <div class="text-sm url-google-canonical">
                      <span class="text-dim">Canonical que elige Google:</span>
                      <a :href="g.canonical" target="_blank" rel="noopener" x-text="g.canonical"></a>
                    </div>
                  </template>
                  <div class="text-sm text-dim" x-show="g.canonicalFrase" x-text="g.canonicalFrase"></div>
                  <template x-if="g.inspeccion && g.inspeccion.fecha">
                    <div class="text-sm text-dim"
                         x-text="'Según la inspección de Google del ' + fmt.diaCorto(g.inspeccion.fecha) + (g.inspeccion.visita ? ' (su última visita: ' + fmt.diaCorto(g.inspeccion.visita) + ')' : '') + (g.inspeccion.cobertura ? ': ' + g.inspeccion.cobertura.charAt(0).toLowerCase() + g.inspeccion.cobertura.slice(1) + '.' : '.')"></div>
                  </template>
                </div>
              </template>
              <!-- Lo que contesto la IA sobre esta pagina (revision de UX del
                   25-oct, 2.9). Sin respuestas no sale: no haberla preguntado
                   no es un «no». -->
              <template x-if="iaUrl && iaUrl.length">
                <div class="card" data-testid="url-ia">
                  <div class="veredicto-titulo">Revisado con IA</div>
                  <ul class="veredicto-lista">
                    <template x-for="f in iaUrl" :key="f.run.id + f.d.pregunta">
                      <li class="bloque">
                        <div x-text="tituloPreguntaEnriq(f.d.pregunta)"></div>
                        <div>La IA dice: <strong x-text="f.d.respuesta == null ? 'sin respuesta' : fmt.respuestaEnriq(f.d.nivel ?? f.d.respuesta)"></strong></div>
                        <div class="text-sm text-dim">
                          <span x-text="estadoUnaEnriq(f.d.estado) + (f.d.confianza == null ? '' : ', confianza ' + fmt.num(Math.round(100 * f.d.confianza)) + ' %') + ' · ' + fmt.dia(f.run.created_at) + ' · '"></span>
                          <a href="#" @click.prevent="verResultadoIA(f.run.id, f.d.pregunta)">ver resultado</a>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Capturas de pantalla por muestra de plantilla (decisión 173):
                   la primera pantalla con el dispositivo del censo y, si se
                   pidió, con el otro. Solo las URLs muestreadas tienen. -->
              <template x-if="(urlDetail.capturas_pantalla || []).length">
                <div class="card" data-testid="url-capturas">
                  <div class="veredicto-titulo">Captura de pantalla</div>
                  <div style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-start">
                    <template x-for="c in urlDetail.capturas_pantalla" :key="c.perfil">
                      <figure style="margin:0;max-width:100%">
                        <a :href="c.src" target="_blank" rel="noopener">
                          <img :src="c.src" loading="lazy" :alt="'Captura ' + c.perfil"
                               :style="'display:block;max-width:100%;border:1px solid var(--border);border-radius:4px;width:' + (c.perfil === 'movil' ? '206px' : '420px')">
                        </a>
                        <figcaption class="text-sm text-dim"
                                    :title="c.user_agent || ''"
                                    x-text="(c.perfil === 'movil' ? 'Móvil' : 'Escritorio') + (c.ancho ? ' · ' + c.ancho + '×' + c.alto : '') + (c.plantilla ? ' · plantilla ' + c.plantilla : '') + (c.url_final ? ' · acabó en ' + c.url_final : '')"></figcaption>
                      </figure>
                    </template>
                  </div>
                </div>
              </template>
              <!-- Extraccion a medida (decision 104): lo que dieron las reglas
                   en esta URL. «No evaluada» no es «vacío». -->
              <template x-if="expAMedida.length">
                <div class="card">
                  <div class="veredicto-titulo">Extracción a medida</div>
                  <ul class="veredicto-lista">
                    <template x-for="d in expAMedida" :key="d.key">
                      <li>
                        <strong x-text="d.etiqueta + ': '"></strong>
                        <span x-text="EXP_COLUMN_DEFS[d.key].tip(urlDetail)"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <div class="card">
                <div class="veredicto-titulo">Enlazado interno</div>
                <!-- NULL no siempre es «sin camino»: en un censo analizado antes
                     de la decision 90 la columna no se calculo. -->
                <div class="veredicto-valor" x-text="urlDetail.click_depth != null ? (urlDetail.click_depth === 0 ? 'Es una portada' : 'A ' + urlDetail.click_depth + (urlDetail.click_depth === 1 ? ' clic' : ' clics') + ' de la home') : (stats && stats.click_depth_calculada ? 'Sin camino desde la home' : 'Profundidad sin calcular')"
                     :class="urlDetail.click_depth == null && urlDetail.indexable && stats && stats.click_depth_calculada ? 'orange' : ''"></div>
                <div class="text-sm text-dim" x-show="urlDetail.click_depth == null && !(stats && stats.click_depth_calculada)">
                  Este censo se analizó antes de medir los clics desde la home: hay que volver a analizarlo.</div>
                <div class="text-sm text-dim"
                     x-text="(n => fmt.num(n) + (n === 1 ? ' página la enlaza · ' : ' páginas la enlazan · '))(urlDetail.unique_inlinks_count ?? urlDetail.inlinks_count) + fmt.num(urlDetail.inlinks_count) + (urlDetail.inlinks_count === 1 ? ' enlace entrante' : ' enlaces entrantes')"></div>
                <!-- Quien la enlaza, con filtros y sin el tope de 200 de la ficha (revision de UX del 25-oct, 2.8). -->
                <a href="#" class="text-sm" x-show="urlDetail.inlinks_count" data-testid="ficha-quien-enlaza"
                   @click.prevent="irAEnlaces(urlDetail.url_hash ? { destino_hash: urlDetail.url_hash } : { destino: urlDetail.url, exacto: true }, 'enlaces')">Ver quién la enlaza</a>
                <div class="text-sm text-dim" x-show="urlDetail.pagerank_score != null"
                     x-text="'PageRank ' + urlDetail.pagerank_score + ' de 100'"></div>
              </div>
            </div>

            <!-- Mini stats de la URL -->
            <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
              <div class="stat-card">
                <div class="stat-value fs-lg" x-text="fmt.ms(urlDetail.response_time_ms)"></div>
                <div class="stat-label">Tiempo</div>
              </div>
              <div class="stat-card">

              </div>
              <div class="stat-card">
                <div class="stat-value fs-lg" x-text="fmt.num(urlDetail.outlinks_count)"></div>
                <div class="stat-label" data-tip="Enlaces que salen de esta página, internos y externos">Enlaces que salen</div>
              </div>
              <div class="stat-card">
                <div class="stat-value fs-lg c-accent" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : fmt.dec(urlDetail.pagerank, 2)"></div>

              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'links' && 'active'" @click="urlDetailTab = 'links'">

                     (apariciones, solo internos), revision de la 1.10. -->

              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'resources' && 'active'" @click="urlDetailTab = 'resources'">
                Recursos <span class="count" x-text="urlDetail.resources?.length || 0"></span>
              </button>
              <button type="button" class="tab" :class="urlDetailTab === 'issues' && 'active'" @click="urlDetailTab = 'issues'">
                Problemas <span class="count" x-text="urlProblemas.length"></span>

              <button type="button" class="tab" :class="urlDetailTab === 'security' && 'active'" @click="urlDetailTab = 'security'">Seguridad</button>
              <button type="button" class="tab" :class="urlDetailTab === 'structured' && 'active'" @click="urlDetailTab = 'structured'">
                Datos estr. <span class="count" x-text="urlDetail.structured_data?.length || 0"></span>
              </button>
            </div>

            <!-- ===== TAB: GENERAL ===== -->
            <template x-if="urlDetailTab === 'general'">
              <div class="card">
                <div class="detail-grid">
                  <div class="detail-row"><span class="detail-label">URL</span><span class="detail-value break-all" x-text="urlDetail.url"></span></div>
                  <div class="detail-row"><span class="detail-label">Host</span><span class="detail-value" x-text="urlDetail.host || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Path</span><span class="detail-value" x-text="urlDetail.path || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Scheme</span><span class="detail-value" x-text="urlDetail.scheme || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Interna</span><span class="detail-value" x-text="urlDetail.is_internal ? 'Sí' : 'No'"></span></div>

                  <div class="detail-row"><span class="detail-label">Grupo estado</span><span class="detail-value" x-text="urlDetail.status_group || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Content-Type</span><span class="detail-value" x-text="urlDetail.content_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño contenido</span><span class="detail-value" x-text="fmt.bytes(urlDetail.content_length)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tamaño transferencia</span><span class="detail-value" x-text="fmt.bytes(urlDetail.transfer_size)"></span></div>
                  <div class="detail-row"><span class="detail-label">Tiempo respuesta</span><span class="detail-value" x-text="fmt.ms(urlDetail.response_time_ms)"></span></div>
                  <div class="detail-row"><span class="detail-label">Versión HTTP</span><span class="detail-value" x-text="urlDetail.http_version || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Es HTML</span><span class="detail-value" x-text="urlDetail.is_html ? 'Sí' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tipo recurso</span><span class="detail-value" x-text="urlDetail.resource_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Indexable</span><span class="detail-value" x-text="urlDetail.indexable ? 'Sí' : 'No'"></span></div>
                  <div class="detail-row"><span class="detail-label">Estado indexabilidad</span><span class="detail-value" x-text="urlDetail.indexability_status || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Respuesta</span><span class="detail-value" :class="['challenge_waf','captcha','rate_limited','respuesta_binaria'].includes(urlDetail.response_class) && 'orange'" x-text="fmt.claseRespuesta(urlDetail.response_class)" title="Si lo que llegó era la página o un muro delante (desafío de un WAF, captcha, límite de peticiones, cuerpo binario). Decisión 103"></span></div>
                  <div class="detail-row"><span class="detail-label">Longitud URL</span><span class="detail-value" x-text="urlDetail.url_length || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Prof. carpetas</span><span class="detail-value" x-text="urlDetail.folder_depth ?? '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Palabras</span><span class="detail-value" x-text="fmt.num(urlDetail.word_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Ratio texto</span><span class="detail-value" x-text="fmt.pct(urlDetail.text_ratio)"></span></div>
                  <div class="detail-row"><span class="detail-label">Redirección a</span><span class="detail-value break-all" x-text="urlDetail.redirect_url || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Tipo redirección</span><span class="detail-value" x-text="urlDetail.redirect_type || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Last-Modified</span><span class="detail-value" x-text="urlDetail.last_modified || '—'"></span></div>
                  <div class="detail-row"><span class="detail-label">Inlinks</span><span class="detail-value" x-text="fmt.num(urlDetail.inlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Inlinks únicos</span><span class="detail-value" x-text="fmt.num(urlDetail.unique_inlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks</span><span class="detail-value" x-text="fmt.num(urlDetail.outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label">Outlinks externos</span><span class="detail-value" x-text="fmt.num(urlDetail.external_outlinks_count)"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="Cuánta autoridad le llega por los enlaces internos, en escala 0-100 logarítmica anclada a la página más fuerte del sitio. Es la que hay que leer y ordenar.">PageRank (0-100)</span><span class="detail-value" x-text="urlDetail.pagerank_score != null ? urlDetail.pagerank_score : '—'"></span></div>
                  <div class="detail-row"><span class="detail-label" data-tip="La escala 0-10 de siempre, aquí solo por compatibilidad con los informes ya entregados.">PageRank (0-10, antiguo)</span><span class="detail-value text-dim" x-text="fmt.dec(urlDetail.pagerank, 2)"></span></div>
                  <div class="detail-row"><span class="detail-label">Primera vez</span><span class="detail-value" x-text="fmt.date(urlDetail.first_seen_at)"></span></div>
                  <div class="detail-row"><span class="detail-label">Último rastreo</span><span class="detail-value" x-text="fmt.date(urlDetail.last_crawled_at)"></span></div>
                </div>
              </div>
            </template>

            <!-- ===== TAB: SEO ===== -->
            <template x-if="urlDetailTab === 'seo'">
              <div>
                <template x-if="!urlDetail.html_meta">
