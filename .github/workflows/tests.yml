name: Tests

# Reutilizable: lo llama este mismo workflow en cada PR y el de despliegue
# antes de tocar el VPS. Un despliegue no puede salir sin que esto este verde.
on:
  pull_request:
  # En `master` NO hace falta: deploy.yml llama a este mismo workflow con
  # `workflow_call` antes de tocar el VPS, asi que un push a master los
  # ejecutaba DOS veces (medido en el merge del PR #44).
  workflow_call:

jobs:
  crawler:
    name: Suite del crawler (extractores, spider, analisis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crawler"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -q --upgrade pip
          # El crawler entero: los tests del spider lanzan el SeoSpider real
          # contra un sitio local (tests/spider_harness.py), asi que necesitan
          # scrapy de verdad.
          pip install -q -r crawler/requirements.txt
          pip install -q -r analysis/requirements.txt
          pip install -q -r tests/requirements.txt
      - name: Instalar Chromium
        # Solo por tests/test_limpiador_navegador.py, que es el unico sitio
        # donde se comprueba el limpiador que corre EN EL NAVEGADOR. Con el
        # codigo anterior, `<body class="cookie-bar-active">` hacia que ese
        # limpiador borrase el body entero: la pagina se guardaba sin contenido,
        # sin enlaces y sin titulares, y nada lo marcaba. Sin navegador en CI
        # ese test se salta y el fallo vuelve sin que nadie se entere.
        run: python -m playwright install --with-deps chromium
      - name: pytest
        # La URL de Postgres destapa los tests marcados que hoy se saltan
        # SIEMPRE (test_pagerank_db.py). Nunca apuntar a crawler_db: la propia
        # cabecera del test lo advierte porque borra y escribe.
        env:
          PAGERANK_TEST_DATABASE_URL: postgresql+psycopg2://crawler:crawler@localhost:5432/crawler_test
          # Destapa el test de la cola contra Redis de verdad: lo demas usa un
          # doble, y el fallo (rpush+brpop es una pila) estaba justo en la
          # semantica real.
          REDIS_TEST_URL: redis://localhost:6379/9
        run: python -m pytest -q -rs --durations=5

  api:
    name: Suite de la API (export, insights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        # Solo lo que importan los tests de la API. No se instala
        # api/requirements.txt entero a proposito: umap-learn y hdbscan
        # compilan y tardan minutos, y ningun test los usa.
        run: |
          python -m pip install -q --upgrade pip
          pip install -q fastapi 'sqlalchemy>=2.0,<3.0' 'pydantic>=2.9' psycopg2-binary \
            'w3lib>=2.1.2' tldextract 'apscheduler>=3.10' redis httpx python-multipart pgvector
          pip install -q -r tests/requirements.txt
      - name: pytest
        # `test_comparacion.py` corre tambien AQUI, y no solo en el trabajo del
        # crawler, porque el endpoint de comparacion vive en la imagen de la
        # API: con el test solo alla, w3lib estaba presente y el fallo de
        # empaquetado que cambiaba el criterio de emparejado era invisible.
        # `test_clientes.py` levanta los routers con TestClient (de ahi httpx,
        # redis y python-multipart, que importa el router de jobs) y los llama
        # de verdad: CRUD, herencia, backup y que ningun endpoint devuelva el
        # valor de una credencial (decision 83).
        # La capa de decisiones (#7) tambien aqui: vive en `shared/` y la API
        # sera quien la dispare (#40), asi que tiene que funcionar con las
        # dependencias de SU imagen. Y el analisis enriquecido (#40), cuyo
        # endpoint con token vive aqui.
        run: >
          python -m pytest -q -rs tests/test_export_csv.py tests/test_insights.py
          tests/test_raw_html.py tests/test_comparacion.py
          tests/test_programaciones.py
          tests/test_cache_estaticos.py tests/test_clientes.py
          tests/test_decisiones_api.py tests/test_decisiones.py tests/test_llm.py
          tests/test_enriquecido.py tests/test_enriquecido_api.py
          tests/test_stats_api.py

  contrato:
    name: Contrato de /systemone contra los SDK oficiales
    # Aparte porque los SDK no son dependencias de produccion y el de
    # OpenRouter fija pydantic<2.13 (ver tests/requirements-contrato.txt). Si
    # el FakeLLM o el cuerpo que construye la capa dejan de casar con el
    # formato de TypeSafe u OpenRouter, falla aqui y no en una llamada de pago.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r tests/requirements-contrato.txt
      - name: pytest
        run: python -m pytest -q -rs tests/test_llm_contrato.py
